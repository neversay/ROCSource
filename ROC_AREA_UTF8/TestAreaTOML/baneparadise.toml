key = 0
to_room = 12256
[[rooms.12251.programs]]
trigger = "room_command"
argument = "search p 牆壁"
script = """
rcall search_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "search p wall"
script = """
rcall search_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_defun"
argument = "search_wall"
script = """
if roomvalue($0) & 1
	echoat $n 牆壁之中的凹痕已經被人探勘出來。
else
	echoat $n 你針對四周的牆壁開始搜索，終於讓你看出一些端倪。
	echoat $n 你發覺在西面的牆上和地板上分別各有著一道不明顯的方型凹痕。
	echoat $n 好似可以推動的樣子，看來應該是個機關所在。
	modrvt v0 | 1
	modrvt t0 = 24
endif
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "search default"
script = """
echoat $n 你想要搜尋什麼東西？
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "push p 牆壁"
script = """
rcall push_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "push p wall"
script = """
rcall push_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "推 p 牆壁"
script = """
rcall push_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "推 p wall"
script = """
rcall push_wall $n
"""
[[rooms.12251.programs]]
trigger = "room_defun"
argument = "push_wall"
script = """
if roomvalue($0) & 1
	echoat $n 你將手放在牆壁上的凹痕處用力的推壓。
	echoaround $n 你看到$N將手放在牆壁上的凹痕處用力的推壓。
	if roomvalue($n12258v0) == 1
		echoat $n 但機關似乎已經被啟動過了。
		break
	endif
	if pcweight($) > 800
		if roomvalue($0) & 2
			echoat $n 但似乎已經沒有什麼反應了。
		else
			modrvt v0 | 2
			modrvt t1 = 2
			echo 你看到地板上的凹痕似乎因為重量的關係而下沈了幾公分。
			if roomvalue($n12253v0) & 2
			if roomvalue($n12263v0) & 2
			if roomvalue($n12265v0) & 2
				echo 隨即，在你的東方附近竟傳來了一陣轟隆隆的巨響。
				at 12258 makedoor 1 出口 出口 1 -1 12259
				at 12258 modrvt v0 = 1
				at 12258 modrvt t0 = 50
			endif
			endif
			endif
		endif
	else
		echoat $n 但似乎沒有什麼反應。
	endif
else
	echoat $n 什麼？
endif
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "push default"
script = """
echoat $n 你想要推什麼？
"""
[[rooms.12251.programs]]
trigger = "room_command"
argument = "推 default"
script = """
echoat $n 你想要推什麼？
"""
[[rooms.12251.programs]]
trigger = "room_time"
argument = "100"
script = """
if roomtimer(1) == 1
	if roomvalue($0) & 2
		modrvt v0 r 2
		echo 你看到下沈的地板又逐漸的上升回復原狀。
	endif
endif
"""

