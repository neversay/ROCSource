[rooms.12001]
name = "亡者樂園入口"
description = """
你正站立在傳說中的亡者樂園入口。朝著你的東邊望去，是
一片陰暗的原始叢林，不時的可以從裡頭聽到陣陣的沙沙聲，聽
說是一些不死族的移動所造成的。而在路口處，插立著一塊石碑
(stele) 。而西邊，則可以讓你離開這個陰森恐怖的地方。
"""
flags = ["DARK", "NO_MOB"]
sector = "FOREST"
[[rooms.12001.extra_descriptions]]
keywords = "stele"
description = """
亡者樂園(Bane Paradise) ，曾經的羅曼諾斯城(Romanos City)
所在地，亦是曾經聞名於世的帝皇康斯坦丁 (Constantine)的帝
都所在。曾有過的榮耀與光芒，隨著巫妖之王密茲雷克(Myzelak
) 的來襲而成過往煙雲，大量的亡靈生物更將這個繁華的帝都給
毀損殆盡。

隨著時間的推移，大量的雜木叢生，而始作俑者密茲雷克更是在
原來的皇城旁邊建立了一座巫妖之塔。而原本生活在羅曼諾斯城
裡的人們更是被密茲雷克變成了亡靈生物，從而替他守護著這塊
被密茲雷克稱之為亡者樂園的地方。

傳說，巫妖之塔有著一條通往冥界的道路，只是一直未有人活著
從樂園裡出來証實這段傳聞。長久以來，大量的冒險者試圖踏入
亡者樂園裡來解開這道傳說，但得到的結果卻永遠都是失去了冒
險者們的音息。就此，亡者樂園亦慢慢的被歸為所謂的禁地之一
，也許，在沒有生人的打擾之下，這裡真的是名副其實的『亡者
樂園』吧。
"""
[rooms.12001.exits.east]
description = ""
keywords = ""
locks = []
key = 0
to_room = 12003
[rooms.12001.exits.west]
description = ""
keywords = ""
locks = []
key = 0
to_room = 80031
[[rooms.12001.programs]]
trigger = "room_enter"
argument = "127 100"
script = """
if is_qmark($n) != baneparadise_qmark
	add_qmark $n baneparadise_qmark -1 0 0 0 0 1
endif
"""
[[rooms.12001.programs]]
trigger = "room_time"
argument = "100"
script = """
if rnplayer($) == 0
	if roomtimer($0) == 0
		if mobcount(12024) == 0
			mload 12024
		endif
	endif
endif
if mobcount(12101) == 0
	at 13742 mload 12101
endif
"""

