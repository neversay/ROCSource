[[mobiles.12101.programs]]
trigger = "talk_prog"
argument = "p other"
script = """
say 你可以請我 remove、wear、drop，我會執行remove all、wear、all 或 drop all。
say 如果告訴我 report，我會回報目前的狀態，如果要我回寫告訴我 full 則會執行回血。
say 告訴我 hit(普擊攻擊)、multi10(10 次普擊攻擊)、multi20(20 次普擊攻擊)、frenzy、bash、kick，
say 我會執行這些戰鬥技能。
say 如果想停止戰鬥跟我說 calm 就行了。
"""
[[mobiles.12101.programs]]
trigger = "talk_prog"
argument = "p calm"
script = """
mpgoto self
mpecho $I停止戰鬥。
"""
