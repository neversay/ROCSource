亡靈怨氣似乎達到了高峰，四處都是灰矇矇的一片，使你分不清
東南西北。在你的四周，仍究被那參天的林木所圍繞。東西兩側
原是宏偉輝煌的城牆，而今卻變成了那千瘡百孔的斷壁殘垣。
"""
flags = ["DARK", "SUMMON_BIT"]
sector = "FOREST"
[[rooms.12148.programs]]
trigger = "room_mask"
argument = "south default"
script = """
if rand(70)
or isnpc($n)
	makedoor 2 出口 出口 0 0 12149
	force $n south
	deldoor 2
else
	if rand(30)
		echoaround $n \u001B[1;30m人影一晃，\u001B[m$N\u001B[1;30m的身影竟從你眼前消失了。\u001B[m
		at 12149 echo \u001B[1;33m你看到\u001B[m$N\u001B[1;33m的身影突然出現在你的眼前。\u001B[m
	endif
	transfer $n 12149
	at 12149 force $n look
endif
"""
[[rooms.12148.programs]]
trigger = "room_defun"
argument = "scout_south"
script = """
makedoor 2 出口 出口 0 0 12149
force $n scout south
deldoor 2
"""

