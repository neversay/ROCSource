level = 55
mod_hitplus = 2
mod_mana = 2
mod_hitroll = 1
mod_damroll = 1
mod_ac = 30000
mod_svs = 1
dodge = 8
mod_pp = 32
gold = 100000
sex = "neutral"
race = "Undead"
[[mobiles.65201.programs]]
