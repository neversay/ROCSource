short_description = "地獄守護者(Guardian guard)"
long_description = "地獄守護者(Guardian guard)守衛著地獄之路的入口，以防止你的闖入。\n"
description = """
這個守護者－一個由地獄中黑暗物質所凝聚出來，屬於石像鬼一族的巨大產物－
動也不動得站在你的前方，用他深黑的雙眼帶著怒意直視著你的靈魂，使你不寒
