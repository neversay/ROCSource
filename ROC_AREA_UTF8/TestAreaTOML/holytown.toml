sector = "INSIDE"
[[rooms.24113.programs]]
trigger = "room_rand"
argument = "10"
script = """
if roomvalue($0) == 0
	break
endif
if pcnum($) < 1
	echo \u001B[1;32m四周的岩壁逐漸停止晃動，一切回復正常。\u001B[0m
	modrvt v0 = 0
	break
else
echo \u001B[1;32m四周的岩壁開始晃動了起來，使得你差點失去平衡而跌倒。\u001B[0m
	if rand(25)
		modrvt v0 = 1
	else
		if rand(33)
			modrvt v0 = 2
		else
			if rand(50)
				modrvt v0 = 3
			else
				modrvt v0 = 4
			endif
		endif
	endif
endif
"""

