[[mobiles.24045.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if isaffected($i) & 1
	mpdis_magic self blindness
endif
if ispc($n)
	if is_qmark($i) == holytown_talking
		mpechoat $n $I現在正在忙著呢，並沒有注意到你的樣子。
		break
	endif
	if is_qmark($n) == holytown_enemy
		say 神聖小鎮的敵人！受死來吧！！
		mpkill $n
		hunt $n
		mpnowait
		break
	endif
	if isevil($n)
		say 該死的邪惡之徒！納命來呀！
		mpkill $n
		hunt $n
		mpnowait
		break
	endif
	if rand(30)
		if hour($) > 22
		of hour($) < 6
			mpadd_qmark $i holytown_talking 2 0 0 0 1 1
			mpechat $n $I\u001B[1;32m親切的對你說道「這位冒險者，那麼晚了還在外面閒晃呀？有什麼事就大聲叫我喔。」\u001B[0m
			mpechoaround $n $I\u001B[1;32m親切的對 \u001B[0m$n \u001B[1;32m說道「這位冒險者，那麼晚了還在外面閒晃呀？有什麼事就大聲叫我喔。」\u001B[0m
			mpcallout 2 mpdel_qmark $i holytown_talking
		else
			mpadd_qmark $i holytown_talking 2 0 0 0 1 1
			mpechoat $n $I\u001B[1;32m親切的對你說道「這位冒險者你好，有壞人欺負你的話，請大聲呼叫我。」\u001B[0m
			mpechoaround $n $I\u001B[1;32m親切的對\u001B[0m $n \u001B[1;32m說道「這位冒險者你好，有壞人欺負你的話，請大聲呼叫我。」\u001B[0m
