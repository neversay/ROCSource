[[rooms.24149.programs]]
trigger = "room_rand"
argument = "50"
script = """
if is_qmark($r) == holytown_room_jumping_falls 100001
	force $r yell 啊～娘～喂～啊～救命啊～好恐怖啊～早知道我就不跳了～
	echoat $r 沒想到你才剛叫完不到幾秒，咚～的一聲你已經摔進去水裡頭了～
	if rand(70)
		echoat $r 強大的衝擊力讓你受傷不淺，看來你離死不遠了。
		modhmv $r 03.100 100 0
	else
		echoat $r 你瞬間感到全身劇裂疼痛，想不到你竟然還沒有死！
		modhmv $r 03.70 80 0
	endif
	del_qmark $r holytown_room_jumping_falls
	transfer $r 24096
	at 24096 force $r look
endif
"""
