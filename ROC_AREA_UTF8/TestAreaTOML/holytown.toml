[[rooms.24142.programs]]
trigger = "room_command"
argument = "search default"
script = """
if is_qmark($n) == holytown_room_search
	echoat $n 你已經在搜尋了。
	else
	add_qmark $n holytown_room_search 2 0 0 0 1 0
	if roomvalue($0) == 1
		echoat $n 你在雜亂的房間裡開始搜尋著。
		callout 5 echoat $n 經過了一陣搜尋，你並沒有搜尋到任何有用的東西。
		callout 5 del_qmark $n holytown_room_search
		else
		if rand(20)
			echoat $n 你在雜亂的房間裡開始搜尋著。
			modrvt v0 = 1
			modrvt t0 = 48
			callout 5 rcall holytown_search_action $n
			else
			echoat $n 你在雜亂的房間裡開始搜尋著。
			callout 5 echoat $n 經過了一陣搜尋，你並沒有搜尋到任何有用的東西。
			callout 5 del_qmark $n holytown_room_search
		endif
	endif
endif
"""
[[rooms.24142.programs]]
trigger = "room_defun"
argument = "holytown_search_action"
script = """
if inroom($n) == 24142
	echoat $n 經過一陣搜尋，你找到了一把金黃色的鑰匙。
	echoaround $n 你看到 $n 找到了一把金黃色的鑰匙。
	oload 24002 1 floor
	del_qmark $n holytown_room_search
	else
	modrvt v0 = 0
endif
"""

