[[rooms.24003.extra_descriptions]]
keywords = "stone"
description = """
數百年前的封印之戰中，因為法蘭斯的奮勇犧牲，才得以將破壞之神給封印
在封印之峰中，無奈破壞之神所散發出的力量十分的可怕，眾人為怕破壞之
神掙脫封印，所以集結了所有人的力量在封印之峰為中心，在四周佈下了四
處結界，想藉由結界之力量來分別壓抑住破壞之神的暴戾之氣、驚人的魔力
、噬血的能力和邪惡之氣等四種主要力量之源。為了避免讓破壞之神的餘黨
有機會來破壞結界，造成破壞之神的力量脫離壓制而繼續為惡，所以眾人決
定世世代代都守護著這裡，一生以消滅試圖侵入此地的邪惡之徒為己任，視
消滅所有邪惡力量為理想。

外來者請注意：
請抱持著一顆善良的心來踏入這塊土地，裡頭的居民可不歡迎邪惡之徒，甚
至有可能視邪惡之徒為敵，所以在往前踏進一步之前，請先考慮清楚。另外
，封印之峰乃被列為禁地，未經許可請勿亂闖，如有發生任何意外，小鎮將
不負責，這點尚請見諒。
"""
