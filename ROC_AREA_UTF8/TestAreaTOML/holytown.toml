		force eria-holytown say 我是不會將藥水賣給神聖小鎮的仇人的！
		force eria-holytown say 再不離開我可要叫守衛了喔！
		break
	endif
	if isevil($n)
		force eria-holytown say 很抱歉，我是不會將藥水賣給邪惡之徒的。
		break
	endif
	if hour($) > 21
	or hour($) < 8
		rcall holytown_eria_close $n
		break
	endif
	if is_qmark(eria-holytown) >= holytown_eria_potion2 200015
		force eria-holytown say 真抱歉，解除詛咒用的水藍色藥水剛好賣完了耶～
		force eria-holytown say 麻煩您明早再來看看好嗎？
		force eria-holytown sorry $n
		break
	endif
	if goldamt($n) < 70000
		force eria-holytown say 這位冒險者，您身上的錢好像不夠70000 塊耶～
		force eria-holytown inn $n
	else
		force eria-holytown smile $n
		force eria-holytown say 嗯嗯～等等喔～我這馬上就去拿給你～
		echoat $n 伊莉雅(Eria) 說完，便轉過身去從櫃子左下方拿出一罐水藍色藥水，交給了你。
		echoaround $n 伊莉雅(Eria) 說完，便轉過身去從櫃子左下方拿出一罐水藍色藥水，交給了$n。
		force eria-holytown say 這個就是本店顏色最漂亮的水藍色藥水，謝謝您的惠顧～
		force eria-holytown mpgold $n -70000
		mod_qmark eria-holytown holytown_eria_potion2 v1 + 1
		oload 24026 20 $n target
	endif
else
	ehcoat $n 美麗的老闆娘伊莉雅(Eria) 並不在店裡喔！
endif
"""
[[rooms.24049.programs]]
trigger = "room_defun"
argument = "holytown_eria_close"
script = """
if is_qmark($n) != holytown_eria_close
	force eria-holytown say 真不好意思，本店已經打烊了，明天請早吧～
	force eria-holytown inn $n
	add_qmark $n holytown_eria_close 5 0 0 0 0 1
else
	if is_qmark($n) == holytown_eria_close 100003
		echoat $n 別再自討沒趣了，伊莉雅(Eria) 已經不想理你了。
	endif
	if is_qmark($n) == holytown_eria_close 100002
		force eria-holytown angry
		echoat $n 伊莉雅(Eria) 轉過頭去，已經不想理會你了。
		echoaround $n 你看到伊莉雅(Eria) 將頭轉到一邊，一副不想再理會$N 的樣子。
		mod_qmark $n holytown_eria_close v0 = 3
	endif
	if is_qmark($n) == holytown_eria_close 100001
		force eria-holytown say 這位客人，本店已經打烊了，明兒一早再來好嗎？
		force eria-holytown sorry $n
		mod_qmark $n holytown_eria_close v0 = 2
	endif
	if is_qmark($n) == holytown_eria_close 100000
		force eria-holytown say 不好意思，本店已經打烊了，明早九點將準時為您服務。
		force eria-holytown bow
		mod_qmark $n holytown_eria_close v0 = 1
	endif
endif
"""

