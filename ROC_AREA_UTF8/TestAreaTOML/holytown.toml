key = -1
to_room = 24133
[[rooms.24132.programs]]
trigger = "room_enter"
argument = "112 100"
script = """
if isfollow($n)
	echoat $n \u001B[1;36m你不自主的產生不想再跟隨別人的想法。\u001B[0m
	force $n follow $n
endif
if isgroup($n)
	echoat $n \u001B[1;36m你對於隊友產生了不信任感，所以選擇了脫離原來所屬的隊伍。\u001B[0m
	force $n group leave
endif
"""
[[rooms.24132.programs]]
trigger = "room_enter"
argument = "15 100"
script = """
if ispc($n)
	if area($b) != holytown
		def_rembch null-tar
		def_rembch $n
	endif
	if pcnum($) == 1
		rcall holytown_musicseal_randset1 $n
		break
	endif
	if pcnum($) > 1
		if inroom($b) == 24132
			rcall holytown_musicseal_randset2 $n
		else
			def_rembch null-tar
			def_rembch $n
			rcall holytown_musicseal_randset3 $n
		endif
	endif
endif
"""
[[rooms.24132.programs]]
trigger = "room_rand"
argument = "20"
script = """
if pcnum($) == 1
	if isaffected($r) & 131072
		echoat $r \u001B[1;33m在夢中傳來了一陣詭異的音樂後，不禁讓你全身無力。\u001B[0m
		modhmv 01.20 30 00010501
	else
		rcall holytown_musicseal_randsetb1 $r
	endif
	break
endif
if pcnum($) > 1
	if inroom($b) == 24132
		if isaffected($b) & 131072
			echoat $b \u001B[1;33m在夢中傳來了一陣詭異的音樂後，不禁讓你全身無力。\u001B[0m
			echoaround $b $b \u001B[1;33m似乎在睡夢中也不得安寧，看他抽搐了幾下後，還是沒醒來。\u001B[0m
			modhmv 01.20 30 00010501
			break
		else
			rcall holytown_musicseal_randcheck $b
		endif
	else
		def_rembch null-tar
		def_rembch $r
		rcall holytown_musicseal_bigpk $r
	endif
endif
"""
