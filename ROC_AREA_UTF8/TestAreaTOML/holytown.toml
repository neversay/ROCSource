				callout 3 rcall holytown_room_push_checkmiss $b
			endif
		else
			if robjcount(24079) >= 1
				if robjcount(24088) >=1
					purge tree
					purge tree
					oload 24088 1 floor
					modrvt v1 | 1
					modrvt t0 = 50
					break
				else
					if mvnum($n) < 400
						echoat $n 你的體力已經不足以推動這棵椰子樹了喔。
						break
					else
						modrvt v1 | 2
