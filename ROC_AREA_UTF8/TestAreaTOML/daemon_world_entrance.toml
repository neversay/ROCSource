trigger = "death_prog"
argument = "100"
script = """
if is_qmark($n) < wererat_save 300020
				mpechoat $n \u001B[0m\u001B[33;1m你身上來自界域封印的神聖力量將黑暗碎片溶解了！\u001B[0m
				mpechoaround $n $N\u001B[0m\u001B[33;1m身上來自界域封印的神聖力量將黑暗碎片溶解了！\u001B[0m
				mpmod_qmark $n wererat_save v2 + 1
				if is_qmark($n) == wererat_save 300020
						mpechoat $n \u001B[0m\u001B[35m附著在你身上的神聖力量已經完全耗盡了...\u001B[0m
				endif
				mpgreward exp $n 36 500
				mpgreward exp $n basic 500
				mpgreward skexp $n 36 10
