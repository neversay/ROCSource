[rooms.533]
name = "混沌領域"
description = """
你行走在一個混亂的空間之中。四周布滿著許多大大小小、形狀不定的黯淡色塊
，有如黑洞般地將來自封印的神聖力量吸收、吞噬與轉化。光線在這裡不再是直線行
進的，視界永遠是模糊而歪曲的，距離感也不再準確，你只能靠著碰觸與直覺在這個
充滿空間裂縫、隱形障礙與未知怪物的地方緩慢前進。看來這個空間已經被破壞得瀕
臨崩潰了，你想，必須快點消滅造成這一切的元兇才行。
"""
