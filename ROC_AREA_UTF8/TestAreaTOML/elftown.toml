		mpechoaround $n $I將獎賞遞給了$N。
		if is_qmark($n) >= war_reward 100090
			mpgold $n 1000000
			mpexp $n 100000
			mpskillexp $n 3000
			mpmerit $n 200
		else
			if is_qmark($n) >= war_reward 100070
				mpgold $n 500000
				mpexp $n 80000
				mpskillexp $n 2000
				mpmerit $n 100
			else
				if is_qmark($n) >= war_reward 100050
					mpgold $n 300000
					mpexp $n 60000
					mpskillexp $n 1500
					mpmerit $n 50
				else
					if is_qmark($n) >= war_reward 100025
						mpgold $n 200000
						mpexp $n 40000
						mpskillexp $n 1000
						mpmerit $n 25
					else
						mpgold $n 100000
						mpexp $n 20000
						mpskillexp $n 500
						mpmerit $n 10
					endif
				endif
			endif
		endif
		if is_qmark($n) < war_reward 200010
			mpmod_qmark $n war_reward v1 + 1
		endif
		if is_qmark($n) != war_reward 300100
			mpmod_qmark $n war_reward v2 + 2
			if is_qmark($n) >= war_reward 300030
				mpmod_qmark $n war_reward v2 = 100
				rumor 由於$N\u001B[35;1m對精靈鎮的巨大貢獻，榮獲精靈長老頒發的英雄證明！
				if primeattr($n) == 1
					mpoload 13660 $n viclv target
				endif
				if primeattr($n) == 2
					mpoload 13661 $n viclv target
				endif
				if primeattr($n) == 3
					mpoload 13662 $n viclv target
				endif
				if primeattr($n) == 4
					mpoload 13663 $n viclv target
				endif
				if primeattr($n) == 5
					mpoload 13664 $n viclv target
				endif
			endif
		endif
	endif
	mpmod_qmark $n war_reward v0 = 0
	mpforce $n group leave
endif
"""
[[mobiles.13626.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == elftown_final_reward
	if being(elf-soldier-marshal)
	or is_qmark($i) == war_fail
	else
		mpforcer 2 mload 13647
		rumor 聽說精靈鎮開始籌備對地靈的反擊....
	endif
	bow $n
	say 年輕人，謝謝你為我們解除這個危機，
	say 現在我們把這個森林的寶物和護身符送給你...
	mpechoat $n $I 將獎賞給了你....
	mpechoaround $n $I 將獎賞給了 $n ....
	mpdel_qmark $n elftown_final_reward
	if level($n) < 36
		mpoload 13643 $n 35 target
	else
		mpoload 13643 $n 36 target
	endif
	if ispc($n)
		if class($n) == 4
		or class($n) == 14
		or class($n) == 18
		or class($n) == 19
			mpoload 13630 $n viclv target
		endif
		if class($n) == 0
		or class($n) == 1
		or class($n) == 5
		or class($n) == 6
		or class($n) == 7
		or class($n) == 8
		or class($n) == 15
		or class($n) == 16
			mpoload 13631 $n viclv target
		endif
		if class($n) == 3
		or class($n) == 11
		or class($n) == 12
		or class($n) == 13
			mpoload 13632 $n 15 target
		endif
		if class($n) == 2
		or class($n) == 9
		or class($n) == 10
		or class($n) == 17
			mpoload 13633 $n viclv target
		endif
	endif
	say 希望你能繼續在各地行俠仗義，
	say 有一天你將會成為整個精靈大陸的英雄！
	wave $n
	if is_qmark($n) != elftown_quest_over
		mpadd_qmark $n elftown_quest_over -1 1 0 0 0 1
		if class($n) < 5
			mpexp $n 3500
		else
			mpexp $n 3000
			mpmod_qmark $n elftown_quest_over v1 = 2
		endif
	endif
	if being(pecker-m)
		mptransfer pecker-m
		mpforce pecker-m protect self
		mpforce pecker-m follow self
		mpforce pecker-m group leave
		mpforce pecker-m mpdef_rembch null-tar
		mpdel_qmark pecker-m elftown_pecker_follow
		mptransfer pecker-m 3048
	endif
	if being(fanatic-m)
		mptransfer fanatic-m
		mpforce fanatic-m protect self
		mpforce fanatic-m follow self
		mpforce fanatic-m group leave
		mpforce fanatic-m mpdef_rembch null-tar
		mpdel_qmark fanatic-m elftown_fanatic_follow
	endif
endif
"""

