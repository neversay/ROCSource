[mobiles.13600]
keywords = "gateguard"
short_description = "柵欄守衛(gateguard)"
long_description = "一位精靈族的柵欄守衛(gateguard)以懷疑的目光看著你。\n"
description = """
他是一位金髮白皮膚的精靈，有著長長的耳朵和迷人的笑容。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "HARD_DIS", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 500
level = 36
mod_hitplus = 1000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Elf"
class = ["WARRIOR", "SWORD"]
spec_flags = ["NO_CHARM", "NO_SLEEP"]
program_files = ["kobold_cave_elfs2.prg"]
[[mobiles.13600.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if ispc($n)
	if is_qmark($n) > kobold_cave_hero 100012
		say 你這個地靈族派來的間諜，我是絕對不會讓你進入精靈之鎮的！
		mpkill $n
	endif
	if is_inv_obj($n) == 3394
	or is_qmark($n) > war_reward 200000
		if is_qmark($n) > kobold_cave_hero 100012
		else
			say 歡迎你，我們的英雄 $N。
			bow $n
			unl e
			open e
		endif
	else
		say 對不起，我們村子不歡迎外人，除非你有精靈信物(token)。
	endif
endif
"""
[[mobiles.13600.programs]]
trigger = "talk_prog"
argument = "token"
script = """
if is_qmark($n) > kobold_cave_hero 100012
	say 你這個地靈族派來的間諜，我是絕對不會讓你進入精靈之鎮的！
	mpkill $n
else
	say 呃....，在一些特殊情況下，其他種族有可能贏得我們的信任，
	say 因此我們的城市永遠歡迎他，這時候便會給他這份榮耀....
	think
	say 您是從史卡拉貝來的吧，你認識蒂得利特嗎(yes/no)？
endif
"""
[[mobiles.13600.programs]]
trigger = "talk_prog"
argument = "no"
script = """
say 那我也沒辦法了....
shrug
"""
[[mobiles.13600.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) > kobold_cave_hero 100012
else
	say 蒂得是我的好朋友，他到史卡拉貝辦事了，如果你和他很熟，
	say 也許能夠回去找他(look for him)幫忙....
	hmm
	say 既然如此，麻煩你把這封信帶給他吧，省得我再走一趟。
	mpoload 13606
	give letter $n
	say 我想您還不至於偷看(look)信的內容吧？
endif
"""
[[mobiles.13600.programs]]
trigger = "talk_prog"
argument = "p look for him"
script = """
say 你在史卡拉貝城裡輸入 where deedrit 就找得到他了。
"""

