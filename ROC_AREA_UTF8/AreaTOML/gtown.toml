say ...你如果要進去的話，跟我說一聲(talk vice enter)，我會放你進去...
"""
[[mobiles.37002.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
break
endif
if race($n) == vampire
	if insameroom(ruru-gtown)
	else
		if insameroom(kasshu-gtown)
		else
			if mobcount(37016) != 0
				angry $n
				say 無恥的吸血蟲，你又來找你的同類了嗎
				say 總有一天你們會全部化為飛灰的！
				mpecho 正當副隊長擋住去路，僵持不下時，一股低沉的聲音從館中傳出...
				mpecho \u001B[1;31m「小女孩，你只是負責監視我，沒必要連我的客人也擋在門外吧」\u001B[0m
				mpcallout 2 mpcall gtown_gate_vicecaptain $n
			else
				angry $n
				say 無恥的吸血蟲，你又來找你的同類了嗎
				say 總有一天你們會全部化為飛灰的！
				mpechoat $n 副隊長擋住去路，僵持不讓你過去...
				mpechoaround $n 副隊長擋住去路，僵持不讓$n過去...
			endif
		endif
	endif
endif
if race($n) != vampire
	tell $n 你好，我奉派在此鎮守吸血鬼之館
	tell $n 裡面危險萬分，若沒有鎮長的命令我不能放你進去，抱歉
endif
"""
[[mobiles.37002.programs]]
trigger = "talk_prog"
argument = "enter"
script = """
if race($n) == vampire
	if mobcount(37016) != 0
		say 知道了...
		mpoload 37095
		unlock north
		open north
		mpecho $I把你趕了進去...
		mpforce $n north
		close north
		lock north
		mpjunk key
	else
		say 你們的王已經死了，我還會讓你進去嗎？
		say 快滾，不然我要斬奸除惡了！
		break
	endif
endif
"""

