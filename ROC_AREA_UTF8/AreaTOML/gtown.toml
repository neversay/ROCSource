[mobiles.37004]
keywords = "Novelist Kuro-gtown"
short_description = "庫羅(Kuro)"
long_description = "這位小說家(Novelist)就算死了依然不停地構思著情節\n"
description = """
他生前為了追求危險帶來的靈感來到了鬼鎮，雖然不幸死於死亡谷的
攻擊，但死前的種種的確也為他帶來了無窮的靈感，文思泉湧的他現
在則面臨了另一個問題─拿不起筆！
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 0
level = 38
mod_hitplus = 0
