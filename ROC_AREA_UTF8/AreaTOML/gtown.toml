[[mobiles.37048.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if isnpc($n)
	break
endif
if is_qmark($n) & gtown_quest_list 100002
	say 嗨，好兄弟好久不見啦，有什麼需要幫忙的地方儘管說
	say 我們一定挺你！
	pat $n
	break
endif
if is_qmark($n) == gtown_hawker_red 100002
	if is_qmark($n) == gtown_hawker_blue 100002
		if is_qmark($n) == gtown_hawker_yellow 100002
			clap $n 
			say 看來你幫了我們兄弟不少忙
			mpcallout 1 say 今天起你也是我們的好哥兒們了
			mpcallout 2 say 去找我大哥吧，他會送你我們祖傳的秘寶
			break
		endif
	endif
endif
if is_qmark($n) == gtown_hawker_red 100002
	if is_qmark($n) == gtown_hawker_blue 100002
		if is_qmark($n) != gtown_hawker_yellow 100002
			say 哎呀！這不是$n嗎，上次真是麻煩你了
			say 聽說我兄弟也有事要找人幫忙，拜託你去看一下吧
			break
		endif
	endif
endif
if is_qmark($n) == gtown_hawker_red 100002
	if is_qmark($n) != gtown_hawker_blue 100002
		if is_qmark($n) == gtown_hawker_yellow 100002
			say 哎呀！這不是$n嗎，上次真是麻煩你了
			say 聽說我兄弟也有事要找人幫忙，拜託你去看一下吧
			break
		endif
	endif
endif
if is_qmark($n) == gtown_hawker_red 100002
	if is_qmark($n) != gtown_hawker_blue 100002
		if is_qmark($n) != gtown_hawker_yellow 100002
			say 哎呀！這不是$n嗎，上次真是麻煩你了
			say 聽說我兄弟也有事要找人幫忙，拜託你去看一下吧
			break
		endif
	endif
endif
if is_qmark($n) != gtown_hawker_red 100002
	if is_qmark($n) == gtown_hawker_red
		say 嗯？龍霸槍(lance of tyrannosaurus)還沒交到卡萊爾(calire)手中嗎？
		say 最近感冒還是沒好，現在只能靠你了，拜託啦！
		break
	endif
endif
if is_qmark($n) != gtown_hawker_red 100002
	if level($n) >= 36
		say 歡迎歡迎，各種神兵利器供你挑選喔
		say 出門在外，多準備幾把武器比較安全啊
		mpcallout 1 mpechoat $n $I上下打量了你一下...
		mpcallout 2 mpechoat $n $I偷偷地湊到你耳邊說話...
		mpcallout 3 tell $n 這位冒險者，我看你全身散發著強烈的鬥氣
		mpcallout 4 tell $n 想必一定是位深藏不露的高手，不知可否幫我個忙？（yes/no）
		break
	endif
endif
if is_qmark($n) != gtown_hawker_red 100002
	if level($n) < 36
		say 歡迎歡迎，各種神兵利器供你挑選喔
		say 出門在外，多準備幾把武器比較安全啊
		break
	endif
endif
"""
[[mobiles.37048.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if isnpc($n)
	break
endif
if level($n) >= 36
if is_qmark($n) & gtown_quest_list 100002
else
	if is_qmark($n) != gtown_hawker_red
		tell $n 事情是這樣的，你也知道我們鬼鎮護衛隊個個都是以一擋百的好手吧
		tell $n 相對的，要進護衛隊沒有一定的實力是不行的
		mpcallout 1 tell $n 你是個高手，應該看得出來我一定夠資格進入護衛隊吧
		mpcallout 2 tell $n 不過護衛隊的小隊長卡萊爾(calire)卻硬是不讓我加入
		mpcallout 3 tell $n 沒辦法，最後他答應只要我拿把龍霸槍(lance of tyrannosaurus)給他
		mpcallout 4 tell $n 他就會重新考慮入隊的事情
		mpcallout 4 mpadd_qmark $n gtown_hawker_red -1 0 0 0 0 1
		mpcallout 5 tell $n 但是我這幾天不小心感冒了，渾身沒力，只好找你幫忙啦
		mpcallout 6 tell $n 只要幫我拿把龍霸槍給他就行了，麻煩你了
		mpcallout 7 addoil $n
	endif
endif
endif
"""
[[mobiles.37048.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) & gtown_quest_list 100002
	else
		if is_qmark($n) != gtown_hawker_red
	say 這樣啊...沒關係，我不會怪你的
	say 畢竟不是每個人都有勇氣面對挑戰
	shrug $n
	break
	endif
endif
"""
