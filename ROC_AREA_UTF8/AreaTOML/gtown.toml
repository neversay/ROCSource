	say 既然你都來了，就麻煩你幫我們拿去還囉
	say 讓我找一下...
	mpcallout 1 mpecho $I開始從一旁的大袋子裡翻找...
	mpcallout 3 say 找到了！還真有點捨不得還呢，就拜託你啦
