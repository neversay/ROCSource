[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "p fantasy flower"
script = """
mpecho 一聽到夢幻之花，$I的眼睛忽然亮了起來
mpcallout 1 say 你也在打聽這朵花嗎？呵呵，我還以為只有我相信這傳言
mpcallout 2 say 既然如此，我就提供你一點資料吧
mpcallout 3 say 傳說夢幻之花生長在充滿邪惡之氣和光明之力的地方
mpcallout 4 say 因此鬼鎮可說是完全符合這個條件
mpcallout 5 say 不過到底長在那裡就完全不曉得了
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "ready"
script = """
if is_qmark($n) == gtown_novel_kuro 100003
	mpdis_magic $n 'polymorph other'
	mpforce $n perform morphing
	if isaffected($n) == werewolf
		mpdis_magic $n werewolf
	endif
	say 那我們就開始吧...
	mpechoat $n $I打開一扇小門，帶領你進去
	mpechoaround $n $I打開一扇小門，帶領$n進去
	mptransfer $n 37100
	mpgoto 37100
	mpforce $n look
	mpmod_qmark $n gtown_novel_kuro v0 + 1
	mpdef_rembch $n
	mpcallout 1 say 我會好好的教你，你可要用心學啊
endif
