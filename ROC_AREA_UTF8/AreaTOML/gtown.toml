[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) & gtown_quest_list 100008
	say 你又來啦，我已經沒什麼可以教你的
	say 以後就靠你自己了
	mpcallout 1 wave $n
	break
endif
if is_qmark($n) >= gtown_novel_kuro 100004
	say 怎麼？想要重新學習文學之道嗎？
	say 跟我說一聲吧(talk kuro restart)
	break
endif
if is_qmark($n) == gtown_novel_kuro 100003
	say 如何，決定要跟我學習文學之道了嗎？
	say 如果下定決心就跟我說一聲吧(talk kuro ready)
	break
endif
if is_qmark($n) <= gtown_novel_kuro 100002
	say 還沒找到嗎？
	sigh
	mpcallout 1 say 到底是誰拿走了呢...
	break
endif
if level($n) >= 31
	mpechoat $n $I抬頭看了看你一眼
	mpechoaround $n $I抬頭看了看$n一眼
	mpcallout 1 say 怎麼？找我有事嗎？
	mpcallout 2 say 我可是不收弟子的喔，你還是放棄吧...
	mpcallout 3 mpecho $I開始自顧自地說起以前的輝煌事蹟
	mpcallout 6 say 嗯？你還沒走啊，看來你真的很崇拜我
	mpcallout 7 say 那好吧，你只要幫我辦一件事(talk kuro help)
	mpcallout 8 say 我就考慮教導你文學之道
else
	mpechoat $n $I抬頭看了看你一眼
	mpechoaround $n $I抬頭看了看$n一眼
	mpcallout 1 say 怎麼？找我有事嗎？
	mpcallout 2 say 我可是不收弟子的喔，你還是放棄吧...
	mpcallout 3 mpecho $I開始自顧自地說起以前的輝煌事蹟
	break
endif
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "help"
script = """
say 是這樣的，我的小說(novel)最近被人借去看了
mpcallout 1 say 我知道我的小說很受歡迎，大家會互相傳閱我也可以理解
mpcallout 2 say 可是沒想到傳一傳竟然搞丟了！
mpcallout 3 mpecho $I露出懊惱的神情
mpcallout 4 say 只要你幫我找回小說，我就教導你文學之道，如何？(talk kuro yes/no)
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if isnpc($n)
	break
endif
if level($n) >= 31
	if is_qmark($n) & gtown_quest_list 100008
	else
		if is_qmark($n) != gtown_novel_kuro
			say 太好了！那就交給你啦
			say 快點幫我找回來啊
			mpadd_qmark $n gtown_novel_kuro -1 1 0 0 0 1
		endif
	endif
endif
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) & gtown_quest_list 100008
else
	if is_qmark($n) != gtown_novel_kuro
		say 什麼？你不幫我？
		say 哼！你以後就算求我也不教你！
	endif
endif
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "novel"
script = """
say 我的小說？那可是到現在仍然十分暢銷的書啊
say 當時可是以極度寫實和刻畫入微著稱啊
cackle
mpcallout 1 say 不過沒想到後來被查禁了...
mpcallout 2 moan
"""
[[mobiles.37004.programs]]
trigger = "give_prog"
argument = "37042"
script = """
if is_qmark($n) == gtown_novel_kuro 100002
	mpjunk novel
	mpmod_qmark $n gtown_novel_kuro v0 + 1
	say 太好了，我還真擔心會不會被弄髒
	mpexp $n 2000
	mpcallout 1 mpecho $I小心翼翼地把小說收了起來
	mpcallout 2 say 那麼，照我們之前約好的，我會教你文學之道
	mpcallout 3 say 不過這段過程會有點冗長，等你準備好了再跟我說吧(talk kuro ready)
else
	?
	drop novel
endif
"""
[[mobiles.37004.programs]]
trigger = "talk_prog"
argument = "rose"
script = """
say 玫瑰我不清楚，你問別人吧
say 別拿這種小事打攪一個偉大的寫作家
