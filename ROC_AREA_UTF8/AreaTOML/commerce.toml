	mpcallout 10 tell $n 常用的手法大概就以低於傭兵市價的超便宜價格讓人雇用，又在途中不告而別。
	mpcallout 10 tell $n 事後我去探聽過這大名鼎鼎的「夜霄追星團」，也不少人被他們詐欺過。
	mpcallout 11 tell $n 更別提進入泰洛斯之類的危險區域了！
	mpcallout 11 tell $n 不然以他們的實力連進西方黑森林都有問題呢。
