if is_qmark($n) == commerce_crystal_quest 100003
if is_inv_obj($n) == 35020
	mpmod_qmark $n commerce_crystal_quest v0 = 4
	mpcallout 1 say 而您身上的「五色龍晶」就是一個例子，
	mpcallout 2 say 這個寶石因為沒有魂魄而顯得黯然無光，
	mpcallout 3 mpcall soul_1 $n
	mpcallout 4 say 唉，好心的冒險者呀，如果您有這些原料的話，
	mpcallout 5 say 是否能給我，讓我完成心願呢？(yes/no)
	mpcallout 6 say 我會以我能力所及來回報你。
	break
endif
endif
mpcallout 1 say 否則也只不過是一顆發亮的石頭罷了。
"""
[[mobiles.35003.programs]]
