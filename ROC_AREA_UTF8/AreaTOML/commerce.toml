	echoat $n \u001B[33m你打架的時候不行！\u001B[m
else
	if objval3($o) != 0
		echoat $n 你攪動著藥釜，試著將裡面的藥物混合。
		if objval3($o) & 1
			if objval3($o) & 2
				if objval3($o) & 32
					if is_qmark($n) & pharmacist_level 100001
						oforcer here oload 35087 1 $n target
						oset alchemist-pot value3 = 0
						echoat $n 你精煉出一罐藥水。
					else
						oforcer here oload 35086 1 $n target
						oset alchemist-pot value3 = 0
						echoat $n 你精煉出一罐藥水。
					endif
				else
					oforcer here oload 35086 1 $n target
					oset alchemist-pot value3 = 0
					echoat $n 你精煉出一罐藥水。
				endif
			else
				if objval3($o) & 96
					if is_qmark($n) & pharmacist_level 100002
						oforcer here oload 35088 1 $n target
						oset alchemist-pot value3 = 0
						echoat $n 你精煉出一罐藥水。
					else
						oforcer here oload 35086 1 $n target
						oset alchemist-pot value3 = 0
						echoat $n 你精煉出一罐藥水。
					endif
				else
					oforcer here oload 35086 1 $n target
					oset alchemist-pot value3 = 0
					echoat $n 你精煉出一罐藥水。
				endif
			endif
		else
			if objval3($o) & 1024
				if objval3($o) == 3104
					if is_qmark($n) & pharmacist_level 100004
						oforcer here oload 35089 1 $n target
						oset alchemist-pot value3 = 0
						echoat $n 你精煉出一罐藥水。
					else
						if rand(10)
							oforcer here oload 35089 1 $n target
							oset alchemist-pot value3 = 0
							echoat $n 你精煉出一罐藥水。
						else
							oforcer here oload 35086 1 $n target
