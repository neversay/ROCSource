argument = "50"
script = """
if rand(70)
        say 各位是來聖域冒險的嗎?
else
        say 唉, 雙子座的聖衣還沒修好....
endif
"""
[[mobiles.9302.programs]]
trigger = "rand_prog"
argument = "15"
script = """
if is_qmark($i) == work_delay
  mpecho $I正拿著鐵鎚揮汗工作.
else
  break
endif
"""
[[mobiles.9302.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == saintarea_quest_geminimask
or level($n) < 20
or rand(60)
        break
endif
say 當年卡諾和薩卡共同守護雙子聖衣之時
say 我將聖衣分成兩部分...
say 現在是把聖衣回歸原狀的時候了, 你能幫我嗎(yes/no)?
mpadd_qmark $n saintarea_quest_geminimask -1 0 0 0 0 1
"""
[[mobiles.9302.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == saintarea_quest_geminimask 100000
        mpmod_qmark $n saintarea_quest_geminimask v0 = 1
        nod $n
        say 你把雙子座的聖衣拿來給我吧
endif
"""
[[mobiles.9302.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) == saintarea_quest_geminimask 100000
        mpdel_qmark $n saintarea_quest_geminimask
        say 好吧, 那就請您自己逛逛吧
endif
"""
[[mobiles.9302.programs]]
trigger = "give_prog"
argument = "9316"
script = """
if is_qmark($n) == saintarea_quest_geminimask 100001
        mpjunk helmet
        mpmod_qmark $n saintarea_quest_geminimask v1 = 1
        if is_qmark($n) == saintarea_quest_geminimask 300001
                mpmod_qmark $n saintarea_quest_geminimask v0 = 2
                say 好啊, 你真的都拿回來了....看我的....
                mpecho \u001B[1;31m叮-----鏘-----叮-----鏘-----叮-----鏘\u001B[m
                mpoload 9317 $n viclv target
                mpechoat $n $I 把 雙面幻盔(gemini helmet) 給你.
                mpechoaround $n $I 把 雙面幻盔(gemini helmet) 給了 $n.
                if class($n) < 5
                        mpexp $n 1000
                endif
                mpexp $n 2000
                say 好了, 這才是雙子座最強的聖衣
                mpechoat $n $I狂笑著：我是最厲害的神匠啦...哈哈哈哈...
        else
                say 嗯, 這是薩卡的善之盔, 卡諾的惡之盔呢?
        endif
endif
"""
[[mobiles.9302.programs]]
trigger = "give_prog"
argument = "9318"
script = """
if is_qmark($n) == saintarea_quest_geminimask 100001
        mpjunk helmet
        mpmod_qmark $n saintarea_quest_geminimask v2 = 1
        if is_qmark($n) == saintarea_quest_geminimask 200001
                mpmod_qmark $n saintarea_quest_geminimask v0 = 2
                say 好啊, 你真的都拿回來了....看我的....
                mpecho \u001B[1;31m叮-----鏘-----叮-----鏘-----叮-----鏘\u001B[m
                mpoload 9317 $n viclv target
                mpechoat $n $I 把 雙面幻盔(gemini helmet) 給你.
                mpechoaround $n $I 把 雙面幻盔(gemini helmet) 給了 $n.
                if class($n) < 5
                        mpexp $n 1000
                endif
                mpexp $n 2000
                say 好了, 這才是雙子座最強的聖衣
                mpechoat $n $I狂笑著：我是最厲害的神匠啦...哈哈哈哈...
        else
                say 嗯, 這是卡諾的惡之盔, 薩卡的善之盔呢?
        endif
endif
"""
[[mobiles.9302.programs]]
trigger = "talk_prog"
argument = "inlay"
script = """
if is_qmark($n) == saintarea_perseus 100004
  mpmod_qmark $n saintarea_perseus v0 + 1
  mpecho 你向$I說出事情的經過...
  ponder
  say 知道是知道啦...不過美杜莎之首這種危險物品要加工的話...
  say 得先拿個東西給他包(pack)起來才行...
  say 你去問問穆吧, 他對處理這些事情蠻拿手的...
else
  break
endif
"""
[[mobiles.9302.programs]]
trigger = "give_prog"
argument = "9356"
script = """
if is_qmark($n) == saintarea_perseus 100014
  mpmod_qmark $n saintarea_perseus v0 + 1
  nod
  mpjunk box
  say 把盾牌也拿來吧, 我幫你鑲上去.
else
  if is_qmark($n) == saintarea_perseus 100015
    nod
    mpadd_qmark $n work_delay 12 0 0 0 0 1
    mpmod_qmark $n saintarea_perseus v0 + 1
    mpjunk box
    say 工作時間需要12小時, 請稍後再來取貨(get).
  else
    break
  endif
endif
"""
[[mobiles.9302.programs]]
trigger = "give_prog"
argument = "9352"
script = """
if is_qmark($n) == saintarea_perseus 100014
  mpmod_qmark $n saintarea_perseus v0 + 1
  nod
  mpjunk shield
  say 把美杜莎的頭也拿來吧, 我幫你鑲上去.
else
  if is_qmark($n) == saintarea_perseus 100015
    mpmod_qmark $n saintarea_perseus v0 + 1
    nod
    mpjunk shield
    mpadd_qmark $n work_delay 12 0 0 0 0 1
    say 工作時間需要12小時, 請稍後再來取貨(get).
  else
    break
  endif
endif
"""
[[mobiles.9302.programs]]
trigger = "talk_prog"
argument = "get"
script = """
if is_qmark($n) == work_delay
  say 工作尚在進行中, 請稍後再來.
else
  if is_qmark($n) == saintarea_perseus 100016
    mpmod_qmark $n saintarea_perseus v0 + 1
    nod
    say 我沒想到結合之後力量變的這麼強....
    mpechoat $n $I把蛇髮女之盾給了你.
    mpechoaround $I把蛇髮女之盾給了$N
    mpoload 9357 $n target
  else
    break
  endif
endif
