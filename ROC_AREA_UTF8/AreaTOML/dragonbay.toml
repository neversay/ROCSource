	mpechoat $n $I接過手後打開瓶蓋，$O裡的液體瞬間揮發掉了！
	tell $n 啊！不小心就順手打開了...
	mpjunk $o
else
	drop $o
endif
"""
[[mobiles.14222.programs]]
trigger = "give_prog"
argument = "14217"
script = """
if inroom($i) == 14350
	mpechoat $n 她看起來正在忙，沒注意到你。
	drop $o
	break
endif
if is_qmark($i) == timer
	mpechoat $n 她看起來正在忙，沒注意到你。
	drop $o
	break
endif
if is_qmark($i) == talking
	mpechoat $n 她正在忙。
	drop $o
	break
endif
if is_qmark($n) & dragonbay_quest_mark 200002
	if is_qmark($n) == dragonbay_ToL 100000
		mpjunk $o
		mpadd_qmark self talking
		mpmod_qmark $n dragonbay_ToL v0 = 1
		mpechoat $n $I仔細打量手上的耳墜。
		mpcallout 1 tell $n 它們原本是成對的，直到我把它交給了他。
		mpcallout 2 mpechoat $n $I從口袋中拿出一只耳墜。
		mpcallout 3 tell $n 剩下就任由你處置吧。
		mpcallout 3 tell $n 我已經失去持有它們的理由了。
		mpcallout 4 mpoload 14234 $n 38 target
		mpcallout 4 mpechoat $n $I把一副耳墜交付給你。
		mpcallout 4 mpdel_qmark self talking
	else
		drop $o
	endif
else
	drop $o
endif
"""
[[mobiles.14222.programs]]
trigger = "give_prog"
argument = "all"
script = """
if is_qmark($i) == timer
	mpechoat $n 她看起來正在忙，沒注意到你。
	drop $o
	break
endif
drop $o
"""
[[mobiles.14222.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpjunk all
if is_qmark($i) == revenger_done
	mpoload 14216 38
	break
endif
"""

