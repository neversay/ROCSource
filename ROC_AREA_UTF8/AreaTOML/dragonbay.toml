pat $n
"""
[[mobiles.14209.programs]]
trigger = "defun_prog"
argument = "say_4"
script = """
say 這些年來，由於各種強大力量的激烈衝突，以及各式各樣的
say 遠古禁咒，整個地底的時空已經亂成一團，幾乎什麼樣的種
say 族與生物都有可能出現在地底，各種奇異的環境景象都能在
say 下面發現，所以你們最好有心理準備。
say 以我的經驗，前三層是洞穴巨人、魔眼蜘蛛(devil-eye) 與
