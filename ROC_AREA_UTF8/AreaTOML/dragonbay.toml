[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) < dragonbay_mayor_secret 100007
        say 好的，任務重新開始！
        mpdel_qmark $n dragonbay_mayor_secret
else
        say 對不起，到這個階段，你的任務只能繼續下去。
endif
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) > dragonbay_mayor_secret 100008
or is_qmark($n) & dragonbay_quest_mark 100004
        say 你好，親愛的神選之人，請問有什麼事情可以為您效勞的嗎？
        smile $n
else
        say 你好，陌生的勇者，我是這裡的鎮長 - 胡克爾(hookard)。我代表
        say 所有的鎮民歡迎你的到訪。
        mpechoat $n 胡克爾(hookard)站起來對你欠欠腰。
        mpechoaround $n 胡克爾(hookard)站起來對$n欠欠腰。
        say 這裡很少有外人拜訪，您看來不像能夠穿越時空的大巫師，所以，
        say 您是越過地底沼澤抵達這裡的嗎？
endif
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == dragonbay_mayor_secret
or is_qmark($n) & dragonbay_quest_mark 100004
        break
endif
say 難得，難得！能夠穿越凶險的地底沼澤來到這裡，您一定是大陸上
say 最頂尖的勇者！不過，為了保險起見，我可以請問你一個問題嗎？
say 請問，最後的金鑰匙，是你擊敗什麼魔物才得到的？
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "p ancient reaper"
script = """
if is_qmark($n) == dragonbay_mayor_secret
or is_qmark($n) & dragonbay_quest_mark 100004
        break
endif
say 是的，您答對了，勇者。
bow $n
say 請原諒我的失禮，因為這關係到一項可怕的秘密(secret)，
say 我不得不特別小心...
mpechoat $n $I 住口沒再說下去，你最好主動打聽一下。
mpadd_qmark $n dragonbay_mayor_secret -1 0 0 0 0 1
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "secret"
script = """
if is_qmark($n) == dragonbay_mayor_secret
or is_qmark($n) & dragonbay_quest_mark 100004
        say 其實，這個地區之所以這麼難以抵達，是因為方圓二十公里的區域
        say 都被用強力的魔法與外界隔絕，無法通過。而唯一留下來的一條路
        say 徑，就是橫越地底沼澤，靠著以前大長老豎立的傳送點傳送過來。
        mpcallout 4 mpcall say_1
        mpcallout 8 mpcall say_2
        mpcallout 12 mpcall say_3
        mpcallout 16 mpcall say_4
endif
"""
[[mobiles.14206.programs]]
trigger = "defun_prog"
argument = "say_1"
script = """
say 這個海灣之所以要特別保護，是因為我們這個世界的空間在這個海灣
say 地底下特別薄弱，很容易被其他世界的生物打穿而入侵我們的世界..
shrug
say 詳細的道理其實我也不明白，總之若異界魔物想要大量入侵，這裡是
say 唯一可能的地方！而我們銀龍族因為是這個世界裡最高戰鬥力的種族
say ，便被眾神賦予看守的宿命，世世代代都必須駐守此地....
sigh
"""
[[mobiles.14206.programs]]
trigger = "defun_prog"
argument = "say_2"
script = """
say 幾千年來，我們族人每隔數十年就與侵入的魔物激戰，鮮紅的血液早
say 就灑遍這個海灣的每個角落。不但是地面與天空，英勇的戰士們甚至
say 需要主動出擊，深入限制我們力量的地底，進攻防禦堅固的地底要塞
say ，卻也因此造成極大的傷亡...
mpecho $I 又深深地歎了一口氣。
"""
[[mobiles.14206.programs]]
trigger = "defun_prog"
argument = "say_3"
script = """
say 銀龍一族正常的壽命該有五、六百年的，但現在連三百年龍族的戰士
say 都湊不滿一團，可見這些年來發生的戰役有多慘烈！
mpechoat $n $I 抬起頭深深望了你一眼：
mpechoaround $n $I 抬起頭深深望了$n一眼。
"""
[[mobiles.14206.programs]]
trigger = "defun_prog"
argument = "say_4"
script = """
say 銀龍一族戰鬥力再強，也不可能無止境地獨力對抗整個異世界的
say 入侵。再過幾百年也許就要全族戰死在這個海灣了....
sigh
say 據說眾神留下一個預言，祂們說這個世界的命運，最終還是寄託
say 在這個世界的所有生物。也就因為這個最後希望，以前的大長老
say (presbyter)才會打開一個傳送點，希望將來能有銀龍以外的勇
say 者通過考驗抵達這裡，成為這個世界最後的救贖！
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "presbyter"
script = """
say 大長老是我們族裡最有智慧的人。現在我們的大長老是第二十代
say 的大長老雷克亞衛克(recoh yarecoh)。
"""
[[mobiles.14206.programs]]
trigger = "talk_prog"
argument = "p recoh yarecoh"
script = """
if is_qmark($n) > dragonbay_mayor_secret 100001
or is_qmark($n) & dragonbay_quest_mark 100004
        break
endif
mpecho $I 顯現猶豫之色....
say 對不起....大長老是不見外人的。連我們族人也很少會去打擾他
say 老人家...
mpechoat $n 看到你著急的神情，$I又說了：
say 不過...
say 卡佳麗是大長老最疼愛的曾孫女，也許你能夠找她聊聊吧？
mpmod_qmark $n dragonbay_mayor_secret v0 = 1
"""

