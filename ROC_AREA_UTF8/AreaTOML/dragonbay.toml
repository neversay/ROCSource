[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == dragonbay_mayor_secret 100010
or is_qmark($n) & dragonbay_quest_mark 100004
	if is_qmark($n) != devileye_quest
        if is_qmark($n) !& dragonbay_quest_mark 200001
		if is_qmark($i) != dragonbay_talking
                	smile $n
                	say 親愛的神選之人您好，您能再來這裡拜訪真是令人
                	say 欣喜。您未來所要面對的將是來自異界強大的力量
                	say ，想必將要經歷一番苦戰是免不了的。在那麼大的
                	say 壓力之下，有一件事情不知該不該再麻煩你....
			mpadd_qmark self dragonbay_talking 2 0 0 0 0 1
			mpcall devileye_happened $n
                	break
		endif
	endif
        endif
endif
bow $n
say 您好，我是卡佳麗(calgory)。就像您看到的，
say 我是這群頑皮孩子(children)的保母。
mpechoat $n 卡佳麗(calgory)打量了你一下說：
say 您是從外地來的吧？
"""
[[mobiles.14205.programs]]
trigger = "defun_prog"
argument = "devileye_happened"
script = """
mpcallout 1 say 算了，畢竟這是我們的私事....
mpcallout 2 say 您還是好好的準備即將面對的異界之戰吧。
mpcallout 3 mpecho 你看到$I似乎有什麼難言之隱....(what's happened)
mpcallout 3 mpdel_qmark self dragonbay_talking
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) <= devileye_quest 100010
        say 好的，此任務可以重新開始。
        mpdel_qmark $n devileye_quest
endif
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "p what's happened"
script = """
if is_qmark($n) == dragonbay_mayor_secret 100010
or is_qmark($n) & dragonbay_quest_mark 100004
	if is_qmark($n) != devileye_quest
        if is_qmark($n) !& dragonbay_quest_mark 200001
                say 是這樣子的，在那最後一次的大規模進攻中，我的
                say 父親卡洛斯(Carlose) 也喪命在那恐怖的魔眼叢林
                say 裡了。至今，屍骨仍為尋獲，為此，曾祖父其實內
                say 疚了許久許久....不知道可不可以麻煩您替我撫平
                say 曾祖父那藏在內心許久的創傷呢？
                mpadd_qmark $n devileye_quest -1 1 0 0 0 1
        endif
	endif
endif
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "children"
script = """
say 我們銀龍族的小娃娃都會在這裡長大，
say 直到他們會說話為止...
sigh
say 這群小娃娃簡直是一場大災難啊！
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) == devileye_quest 100001
        say 也是，這種事本來就不應該麻煩您了。
        mpecho $I露出了一臉哀傷的神情，眼角似乎還泛起了淚珠。
endif
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == devileye_quest 100001
        say 那麼，一切就麻煩您了。
        thank $n
        kiss $n
        mpmod_qmark $n devileye_quest v0 = 2
        break
endif
if is_qmark($n) == dragonbay_mayor_secret 100004
        say 我的曾祖父很偉大喲，他是族裡面最有智慧的人，
        say 從兩百年前就是族裡的大長老！不過....
        mpcallout 3 mpcall say_1
        mpmod_qmark $n dragonbay_mayor_secret v0 = 5
        break
endif
if is_qmark($n) == dragonbay_mayor_secret 100002
        bow $n
        say 謝謝你，好心的冒險家....我想豆豆不會跑太遠的...
        break
endif
nod
say 你們不是銀龍族的人....也許你們該先到鎮上
say 去找鎮長，我們一直有些有關異族的傳說，
say 不過只有鎮長最清楚。
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "p recoh yarecoh"
script = """
worry
say 對不起，我現在正在忙(trouble)，恐怕沒辦法陪
say 你聊有關我曾祖父的事...
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "presbyter"
script = """
worry
say 對不起，我現在正在忙(trouble)，恐怕沒辦法陪
say 你聊有關大長老的事...
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "trouble"
script = """
if is_qmark($n) == dragonbay_mayor_secret 100001
        say 我照顧的一位寶寶，豆豆，趁我不注意時偷偷跑出去
        say 玩了！他現在還小，我真怕會出什麼意外....
        look $n
        say 我必須留在這裡照顧其他的孩子們，所以...不知道
        say 你能不能夠到附近幫我找找看(search)好嗎？
        mpmod_qmark $n dragonbay_mayor_secret v0 = 2
endif
"""
[[mobiles.14205.programs]]
trigger = "talk_prog"
argument = "search"
script = """
if is_qmark($n) == dragonbay_mayor_secret 100002
        nod $n
        say 是的，麻煩您在附近到處找找，好心的勇者。
endif
"""
[[mobiles.14205.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
        if vnum($n) == 14207
                mpecho $N嗚咽地向$I跑去....
                mpecho $I高興地抱著$N
                say 小豆豆，下次別再亂跑了喔...
                mpecho 你看到$N向$I撒嬌後，又被$I送回洞裡...
                mppurge toto-m
                mpcallout 3 mpecho $I感激地回頭對你說：謝謝你，勇者，幸好沒發生意外。
                mpcallout 4 say 您剛剛是想問我有關曾祖父的事吧？(yes/no)
        endif
endif
"""
[[mobiles.14205.programs]]
trigger = "defun_prog"
argument = "say_1"
script = """
say 曾祖父現在年紀大了，喜歡安靜，不希望人家打擾他。
say 除非有事，他一般都懶懶地在大龍峒曬太陽。
gig
say 你們想見他的話，到芒草原那裡誠心地向東方祭拜
say (knee east)，如果曾祖父心情好，他就會
say 和你們聊聊天的...
"""

