[[mobiles.14222.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == timer
	mpechoat $n 她看起來正在忙，沒注意到你。
	break
endif
if is_qmark($i) == talking
	mpechoat $n 她正在跟人講話。
	break
endif
if is_qmark($n) & dragonbay_quest_mark 200002
	if rand(20)
		say 您好，神選之人。
	endif
	break
endif
if is_qmark($n) == dragonbay_revenger
	say 您好，神選之人。
	break
endif
if is_qmark($n) == dragonbay_mayor_secret 100010
or is_qmark($n) & dragonbay_quest_mark 100004
	if is_qmark($n) & dragonbay_quest_list 100016
		mpadd_qmark self talking
		mpadd_qmark $n dragonbay_revenger -1 0 0 0 0 1
		say 您好，神選之人，全鎮的人都聽說您在魔眼叢林的戰績了。
		say 依您的實力，想必突破下一層的眼魔迷宮，肯定也不是問題。
		say 我會在此幫您祈求武運昌隆。
		mpcallout 2 hmm
		mpcallout 3 tell $n 我其實有件小事...但不知您是否方便幫忙...(yes/no)
		mpcallout 3 tell $n 啊，請您稍等一下...
		mpcallout 3 mpechoat $n $I用著水汪汪的大眼看著你，小聲的說。
		mpcallout 3 mpdel_qmark self talking
	else
		if rand(20)
			say 您好，神選之人。
		endif
	endif
else
	if rand(20)
		say 您好，請問有什麼指教？
	endif
endif
"""
