        say 的確，過了這麼多年，這個世界其他的生物也該負起自己
        say 的責任了。
        mpcallout 3 mpcall say_1 $n
        mpmod_qmark $n dragonbay_mayor_secret v0 = 6
        break
endif
mpecho $I懶懶地打量著你....
"""
