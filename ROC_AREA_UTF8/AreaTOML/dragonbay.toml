trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) & dragonbay_quest_list 100016
        if is_qmark($n) == devileye_quest 100014
                good $n
                say 真是太好了，想不到你真的辦到了。
                say 那麼，現在可以請你將魔眼邪臂交給我嗎？
                mpmod_qmark $n devileye_quest v0 = 15
                break
        endif
endif
if is_qmark($n) > dragonbay_mayor_secret 100008
        look $n
        say $n，你還在這裡幹什麼？還沒找到賈伯斯(Jabose)嗎？
        break
endif
mpechoat $n 一個低沈的聲音傳進你的心中：歡迎你，年輕的勇者，我就是銀龍族的大長老雷克亞衛克。
