[[objects.13484.extra_descriptions]]
keywords = "letter"
description = """
流風，

    我這幾天在賽伐斯拖普與市長巴洛特談判，設法拉攏賀比特加入，
不過巴洛特相當狡猾，首鼠兩端，不肯承諾什麼比較明確的事，也許我
們必須到莫瑞亞礦區找浩劫兵團談談，他們應該有辦法施加點壓力...

    另外，我在賽伐斯拖普北郊遇到傳聞中的大巫師甘道夫，相談甚歡。
甘道夫名不虛傳，我可以感到他已超脫時空的限制。甘道夫先生希望我
們能夠幫他辦件事，我認為這是他對暴風門的一些測試。你設法派一位
心地純良，能力高強的人過來。不敢說拉攏，但若能給甘道夫好的印象，
暴風門往後將得道多助。

	我怕明早就必須趕到莫瑞亞，你請來的人直接告訴甘道夫是風火海
(wfsea)派來的就行。

								匹克斯
								AE806/8/17 夜

	PS. 身體單薄，別焚膏繼晷。
"""

