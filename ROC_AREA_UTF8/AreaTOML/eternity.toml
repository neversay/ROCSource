[rooms.13330.exits.north]
description = ""
keywords = ""
locks = ["ISDOOR", "CLOSED", "LOCKED", "PICKPROOF", "PASSPROOF"]
key = -1
to_room = 13331
[rooms.13330.exits.south]
description = ""
keywords = ""
locks = ["ISDOOR", "BASHPROOF", "PICKPROOF"]
key = -1
to_room = 13329
[[rooms.13330.programs]]
trigger = "room_rand"
argument = "100"
script = """
if roomvalue($0) == 1
	echo 沈重的石牆慢慢往上升起！
	modrvt d0 r 6
	modrvt v0 = 0
endif
if roomvalue($0) == 2
	echo 沈重的石牆慢慢滑下來！
	modrvt v0 = 0
	if pcnum($) == 0
		modrvt d0 | 6
	else
		echo $r 奮不顧身把石牆頂住，卻因此受到很大的傷害！
		modhmv $r 01.350 400 1
	endif
endif
"""

