[[mobiles.13413.programs]]
trigger = "greet_prog"
argument = "20"
script = """
if ispc($n)
	if is_qmark($i) != eternity_imp_follow
		sigh
		say 入口到底在哪呢？
	endif
endif
"""
[[mobiles.13413.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) !& eternity_quest 100256
	if is_qmark($i) != eternity_imp_follow
		say 我想來這裡加入法師組織，但不得其門而入。
		sigh
		say 我已經在這裡待三天了，還是找不到上樓的鑰匙....
		say 你也是來加入永恆之塔的嗎(yes/no)？
	else
		say 我正在找尋永恆之塔的入口。
	endif
endif
"""
[[mobiles.13413.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if area($i) != eternity
	say 奇怪，說著說著怎麼跑出了永恆之塔了？
	mpecho $I 轉身往永恆之塔的方向飛去....
	mppurge self
	break
endif
if being($b)
	if is_qmark($i) == eternity_imp_follow
	else
		say 我看還是我自己找吧， $b 你太沒效率了....
		mpdef_rembch null-tar
		follow self
		group leave
		mpecho $I 自己去找進入永恆之塔 2F 的入口去了....
		mpgoto 13410
	endif
else
	if is_qmark($i) == eternity_imp_follow
		mpdel_qmark self eternity_imp_follow
		mpgoto 13410
	endif
endif
"""
[[mobiles.13413.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) & eternity_quest 100256
	break
endif
if being($b)
else
	say 太好了，我們一起找吧！
	mpgroup $n self 1 1
	mpadd_qmark self eternity_imp_follow 24 0 0 0 1 0
	mpdef_rembch $n
	rumor $n 試著想要加入永恆之塔
endif
"""
[[mobiles.13413.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) & eternity_quest 100256
	break
endif
if being($b)
else
	mpecho $I 失望地說：是喔？
	s
	e
endif
"""
[[mobiles.13413.programs]]
trigger = "entry_prog"
argument = "100"
script = """
if insameroom($b)
	if is_qmark($i) == eternity_imp_follow
		if inroom($i) == 13450
			yell 終於到塔的二樓了！
			bow $b
			say 謝謝你，讓我們彼此勉勵吧。
			mpexp $b 300
			wave $b
			follow self
			group leave
			if is_qmark($b) != eternity_quest
				mpadd_qmark $b eternity_quest -1 256 0 0 0 1
			else
				if is_qmark($b) !& eternity_quest 100256
					mpmod_qmark $b eternity_quest v0 | 256
				endif
			endif
			mpdef_rembch null-tar
			mpgoto 13404
		endif
	endif
endif
"""

