mpjunk wizard
bow $n
say 謝謝你...
ponder
say 良禽擇木而棲，像你這麼優秀的人才，應該加入
say 一個有力的組織，才能施展你遠大的抱負！
say 其實我正是偉大的風火海的一員，我們很誠摯地
say 邀請你加入(join)，共創更美好的明天！
