[[mobiles.13489.programs]]
trigger = "talk_prog"
argument = "join"
script = """
if is_qmark($n) == windcity_clan_member
	shake
	say 可惜你已經誤入歧途，風之城很快就要被消滅了....
	break
endif
if is_qmark($n) == wfs_clan_member 100000
	nod $n
	mpoload 13459 25
	give document $n
	say 你可以到永恆之塔地下找到風火海的總舵！
	say 通行口令是 wfsea
	mpmod_qmark $n wfs_clan_member v0 = 1
	if class($n) < 5
		mpexp $n 5400
	else
		mpexp $n 3600
	endif
	rumor \u001B[1;32m$n好像加入風火海了!\u001B[m
	addoil $n
endif
if is_qmark($n) >= wfs_clan_member 300004
or is_qmark($n) == wfs_clan_member 200001
	break
endif
if is_qmark($n) == wfs_clan_member 100001
	if is_inv_obj($n) == 13459
	or is_equ_obj($n) == 13459
		say 你已經擁有入會證明書了！
	else
		mpmod_qmark $n wfs_clan_member v2 + 1
		if is_qmark($n) == wfs_clan_member 300004
		ponder
		say 我記得你已經拿了很多張證明書
		say 這是最後一張了，請您妥善保管
		say 如再遺失，恕不負責
		endif
		mpoload 13459 25
		give document $n
	endif
endif
"""
[[mobiles.13489.programs]]
trigger = "talk_prog"
argument = "p mage guild"
script = """
if is_qmark($n) != mage_envoy_quest 100001
	pon
	say 啥？
	break
endif
if is_qmark($n) != wfs_clan_member
	mpechoat $n $I以惋惜的目光看著你說：
	say 你是一位人才，可是這項任務事關重大，
	say 不是本幫的幫眾我們不放心，對不起讓你白跑一趟！
	bow
else
    	if is_qmark($n) != mage_envoy_quest 100001
		?
		break
    	endif
	smile
	say 太好了！你終於來了！能夠找到這裡，表示你有起碼的
	say 實力。現在請你立刻到地下二樓本幫總舵，舵主流風韻
	say 事會告訴你詳情，記得說出暗語光榮密使(glory envoy)。
	if is_inv_obj($n) == 13459
	or is_equ_obj($n) == 13459
	else
		mpecho $I 拿出一份文件交給 $n ....
		say 這是入會證書，你會需要它來進入總舵....
	endif
	wave $n
	mpmod_qmark $n mage_envoy_quest v0 = 2
endif
"""

