[[objects.10331.extra_descriptions]]
keywords = "sword"
description = """
這柄劍的劍身長將近一米，而且筆直的如弓箭般，兩面都有一條幼細的凹紋。
兩面的劍刃成為對稱直線，鋒利的劍刃令你不禁心寒。無論從任何的角度去看
，這柄劍都是完美無暇，簡直就像由神所鑄造的。黑色的劍柄上模模糊糊的可
以看到索雷斯城的徽章。在劍身上還刻有這樣的詩文:

                      無知的人問，斬龍劍，你是如何斬殺惡龍的？
                      我..。會刺穿那個躲在龍鱗後面的心臟......
                      又有人問，斬龍劍，你會在哪裡得到棲息？
                      我..。只會棲息在被我斬殺的魔物的身體裡。

"""
