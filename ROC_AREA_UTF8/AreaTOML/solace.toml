你可以在這裡稍作休息，然後再繼續你的旅程。

請不要在這裡隨便的獵殺城內動物。

並注意閣下在城內的行為。

為保障城市及各位的安全，城門(Gates)會於晚上關閉。

                                -索雷斯城護衛隊隊長-
