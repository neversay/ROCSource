[rooms.10201]
name = "索雷斯城城門"
description = """
這裡是索雷斯城的大門。它的重要性在於它阻擋了怪物(monsters)進入
索雷斯城，保障了城內所有居民的生命及財產的安全。這是一個位於司徒米
爾河流(Crytalmir Lake)旁邊的寧靜農業城鎮。這裡有一面標牌(sign)釘在
附近的一顆樹上，同時有一塊石碑(plaque)豎立在路旁。
"""
