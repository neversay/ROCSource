echo 四面的牆壁傳來陣陣哭喊聲「好痛苦啊....！我好痛苦啊....！」
"""
[[rooms.10258.programs]]
trigger = "room_rand"
argument = "30"
script = """
if pcnum($) == 0
        break
else
        if rand(20)
                echo $r 一股黑暗的力量向你詛咒著。
                c 'curse' $n 42
        endif
        if rand(23)
                echo $r 一陣紫色的煙霧在你四周盈聚，你感覺到防衛力下降了。
                echo
                c 'faerie fire' $n 42
        endif
        if rand(26)
                echo $r 一陣冰凍的寒氣從四面牆壁 出來，你感到一絲寒意。
                c 'chill touch' $n 42
        endif
        if rand(29)
                echo $r 突然覺得四肢無，身體開始變得虛弱。
                c 'weaken' $n 42
        else
                echo $r 四面牆壁噴一陣煙霧，你感覺到不舒服，似乎是中毒了。
                c 'poison' $n 42
        endif
endif
"""
