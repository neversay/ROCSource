[[objects.10211.extra_descriptions]]
keywords = "sword"
description = """
這柄劍的劍身長將近一米，而且筆直的如弓箭般，兩面都有一條幼細的凹紋。
兩面的劍刃成為對稱直線，鋒利的劍刃令你不禁心寒。無論從任何的角度去看
，這柄劍都是完美無暇，簡直就像由神所鑄造的。黑色的劍柄上模模糊糊的可
以看到索雷斯城的徽章。在劍身上還刻有這樣的詩文:

                      平衡放天秤上，恆量對與錯，正義與邪惡，
                      以我的雙眼，搜尋一切破壞這片樂土的險惡心性。
                      然後，將之消滅，以保護神聖的心靈。
                      這是神賦予我的力量，也是我的天命。

"""
