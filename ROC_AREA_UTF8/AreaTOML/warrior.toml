name = "穿越森林的小徑"
description = """
你站在穿越森林的小徑，濃密的枝葉使得森林好像有種曦光中的幻象。
小徑通往南和北。
"""
flags = []
sector = "FOREST"
[rooms.13700.exits.north]
description = ""
keywords = ""
locks = []
key = 0
to_room = 13701
[rooms.13700.exits.south]
description = ""
keywords = ""
locks = []
key = 0
to_room = 6003
[[rooms.13700.programs]]
trigger = "room_enter"
argument = "5 100"
script = """
if ispc($n)
	if is_qmark($n) != warrior_quest
		add_qmark $n warrior_quest -1 0 0 0 0 1
	endif
	if is_qmark($n) == warrior_knight_test 100003
	or is_qmark($n) == warrior_swordsman_test 100003
	or is_qmark($n) == warrior_monk_test 100003
	or is_qmark($n) >= serpent_peddler_quest 100005
		echoat $n 遠方傳來一陣聲響「系統已經自動將您於銀蛇武士堡中的相關標記，」
		echoat $n 遠方傳來一陣聲響「自動轉換為目前現行的機制。」
		if is_qmark($n) == warrior_training 100015
			mpdel_qmark $n warrior_training
			mpmod_qmark $n warrior_quest v1 = 15
		endif
		if is_qmark($n) == warrior_knight_test 100003
			echoat $n 遠方傳來一陣聲響「你於銀蛇武士堡通過騎士試煉的標記已成功轉換。」
			del_qmark $n warrior_knight_test
			mod_qmark $n warrior_quest v0 | 1
		endif
		if is_qmark($n) == warrior_swordsman_test 100003
			echoat $n 遠方傳來一陣聲響「你於銀蛇武士堡通過劍士試煉的標記已成功轉換。」
			del_qmark $n warrior_swordsman_test
			mod_qmark $n warrior_quest v0 | 2
		endif
		if is_qmark($n) == warrior_monk_test 100003
			echoat $n 遠方傳來一陣聲響「你於銀蛇武士堡通過僧侶試煉的標記已成功轉換。」
			del_qmark $n warrior_monk_test
			mod_qmark $n warrior_quest v0 | 4
		endif
		if is_qmark($n) >= serpent_peddler_quest 100005
			echoat $n 遠方傳來一陣聲響「你於銀蛇武士堡中完成抉擇任務的標記已成功轉換。」
			del_qmark $n serpent_peddler_quest
			mod_qmark $n warrior_quest v0 | 8
		endif
	endif
endif
"""

