	mpat robber-s mppurge robber-s
endif
"""

[mobiles.13749]
keywords = "amiable monk"
short_description = "慈祥的僧侶(monk)"
long_description = "一位慈祥的僧侶(amiable monk)和藹地對你微笑。\n"
description = """
他的頭髮已經掉光了，只剩一個油亮的光頭。但他的眼神中似乎有種魔力，
當他對你微笑時你感覺你們之間的距離剎那間都不見，好像認識許多年一樣。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "HUNT", "TACTICS"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT"]
alignment = 800
level = 40
mod_hitplus = 1500
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "MAGE", "THIEF", "SWORD"]
spec_flags = ["NO_CHARM", "NO_SLEEP", "EXPERT", "NO_CRAZY"]
[[mobiles.13749.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
bow $n
say 僧侶是一項注重戰技的職業，
say 你必須要有足夠的技巧與訓練，
say 才能夠讓以徒手格鬥為主的僧侶，
say 對於敵人達到最大的殺傷力。
"""
[[mobiles.13749.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if ispc($n)
	if class($n) == 13
		if is_qmark($n) != warrior_monk_test
			if is_qmark($n) !& warrior_quest 100004
				smile $n
				say 您是來參加僧侶的最終試煉嗎？(yes/no)
			endif
			break
		endif
		if is_qmark($n) == warrior_monk_test 100001
			say 若你想再試一次，請告訴我一聲(ready)。
			break
		endif
		if is_qmark($n) == warrior_monk_test 100002
			mpdel_qmark $n warrior_monk_test
			mpexp $n 3600
			good $n
			mpforce $n remove all
			if is_qmark($n) != warrior_quest
				mpadd_qmark $n warrior_quest -1 4 0 0 0 1
			else
				if is_qmark($n) !& warrior_quest 100004
					mpmod_qmark $n warrior_quest v0 | 4
				endif
			endif
			mptransfer $n 9
			mpat 9 mpforce $n drop all
			mpat 9 mppurge
			mptransfer $n
			say 恭禧你，你已完成了代表愛心的僧侶之修鍊！這是你通過試煉的證明。
			mpoload 13741 $n 36 target
			mpechoat $n $I 把銀蛇僧侶束腰給你....
			say 你雖然完成銀蛇堡僧侶的測驗，
			say 但還有許多東西必須自己去體會，
			say 當你有疑問時歡迎你隨時回來繼續未完的修鍊。
			mpecho $I 好像還有話要說....
			mpcallout 1 mpcall warrior_secret_1 $n
		endif
	endif
endif
"""
[[mobiles.13749.programs]]
trigger = "talk_prog"
argument = "no"
script = """
say 沒關係，等你準備好再來吧。
"""
[[mobiles.13749.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if class($n) == 13
	if is_qmark($n) & warrior_quest 100004
		say 這個試煉只允許僧侶參加一次。
		break
	endif
	nod $n
 	say 為了測試出您真正的戰技，
 	say 參加最終試煉的僧侶按規定我們會取下您所有的裝備代為保管。
 	say 為避免有任何不測，請先把所有貴重物品自行取下。
 	say 另外試煉開始後，結束試煉的方法只有通過考驗與死亡兩種，
 	say 當您準備好後請告訴我(ready)。
endif
"""
[[mobiles.13749.programs]]
trigger = "talk_prog"
argument = "ready"
script = """
if class($n) == 13
	if is_qmark($n) & warrior_quest 100004
     		say 這個試煉只允許僧侶參加一次。
		break
	endif
	if level($n) < 36
		shake
		say 你的等級太低了！
		break
	endif
	c giant $n
	mpnowait
	c bless $n
	mpnowait
	mpforce $n remove all
	mpforce $n drop all
	mpoload 13715 $n 35 target
	mpoload 13715 $n 35 target
	mpoload 13742 $n 35 target
	mpforce $n wear all
	mpadd_qmark $n warrior_monk_test -1 1 0 0 0 1
	mptransfer $n 13810
endif
"""
[[mobiles.13749.programs]]
trigger = "defun_prog"
argument = "warrior_secret_1"
script = """
say 在我下方的房間中住著一位武功高強的僧侶，
say 我想通過試煉的你可以往下走，去跟他請益一些事物，
say 相信對你大有益處。
wave $n
"""
[[mobiles.13749.programs]]
trigger = "fight_prog"
argument = "100"
script = """
barehand $n
mpnowait
if rand(25)
	frenzy
	mpnowait
else
	if rand(33)
		kick
		mpnowait
	else
		if rand(50)
			bashhead
			mpnowait
		else
			skilldrv multihit $n
		endif
	endif
endif
"""

