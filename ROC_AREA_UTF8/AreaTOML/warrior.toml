[[mobiles.13723.programs]]
trigger = "talk_prog"
argument = "join"
script = """
if level($n) <= 21
or is_qmark($n) == windcity_clan_member
	break
endif
if is_qmark($n) & warrior_quest 100008
	if is_qmark($n) != windcity_clan_member
		if is_qmark($n) >= wfs_clan_member 100001
			say 對不起，我們不歡迎風火海的成員！
		else
			shout \u001B[1;32m歡迎 $n 加入風之城！\u001B[m
			if class($n) < 5
				mpexp $n 5400
			else
				mpexp $n 3600
			endif
			good $n
			mpechoaround $n $I 站起來，從桌後走過來與 $n 握手....
			mpechoat $n $I 站起來，從桌後走過來與你握手....
			say 太好了，風之城又多了一位良將！
			mpadd_qmark $n windcity_clan_member -1 0 0 0 0 1
			if is_qmark($n) == wfs_clan_member
				mpdel_qmark $n wfs_clan_member
			endif
			mpoload 13736 $n viclv target
			mpechoat $n $I 從抽屜拿出一枚藍色戒指給你....
			mpechoaround $n $I 從抽屜拿出一枚藍色戒指給 $n ....
			say 這個戒指代表風之城，請隨身攜帶，因為風之城成員之間就靠它來相認了。
			say 你先回去吧，我們會再主動和你聯絡！
