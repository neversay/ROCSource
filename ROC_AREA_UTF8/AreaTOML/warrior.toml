[mobiles.13700]
keywords = "gateguard"
short_description = "大門衛士(gateguard)"
long_description = "大門衛士(gateguard)挺起胸膛站得筆直，仔細注意著每個出入的人。\n"
description = """
他是一個非常強壯的武士，也是武士堡調教出來的好榜樣。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "HUNT"]
affected_flags = ["SANCTUARY"]
alignment = 500
level = 36
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "SWORD"]
special_function = "spec_guard"
[[mobiles.13700.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) & warrior_quest 100001
or is_qmark($n) & warrior_quest 100002
or is_qmark($n) & warrior_quest 100004
	mpechoat $n $I 對你露出敬佩的眼神....
	say 你能通過銀蛇堡的試練，真是不簡單。
	say 別忘了常回來練練功，一定能讓你的戰技更高強。
	break
endif
mpechoat $n $I 的濃眉大眼似笑非笑地望著你....
say 嗨，小白臉，你想成為銀蛇武士嗎(yes/no)？
"""
[[mobiles.13700.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
say 銀蛇武士的訓練是艱苦的，首先當然你必須是一位戰士，
say 然後你得到堡壘二樓找我們堡主談談，
say 一旦你加入銀蛇堡，堡內的訓練設施會讓你武藝大進！
"""
[[mobiles.13700.programs]]
trigger = "talk_prog"
argument = "no"
script = """
say 趕快回家向媽媽撒嬌吧！
laugh $n
"""
[[mobiles.13700.programs]]
trigger = "greet_prog"
argument = "40"
script = """
if ispc($n)
	if isgood($n)
		hello $n
	else
		say $n 你別想在銀蛇武士堡裡做壞事！
	endif
endif
"""
[[mobiles.13700.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if inroom($i) == 13702
	if hour($) > 0
		if hour($) < 12
			say 啊...該下哨了，這裡就交給你們了...
			mpecho $I 行了一個軍禮....
			n
			e
			s
			mpgoto 13729
			sleep
		endif
	endif
break
endif
if inroom($i) == 13729
	if hour($) > 12
		wake
		say 啊...那麼晚了！要趕快上哨....
		n
		w
		s
		mpgoto 13702
	endif
break
endif
say 銀蛇武士是不能擅自離開崗位的！
mpecho $I 匆匆忙忙跑了回去....
mpgoto 13729
"""

