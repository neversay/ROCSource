	mpecho 沈默的煉金師(silent alchemist)用奇異的方法處理掉屍體！
	mpforce silent-m think
	mpforce silent-m say 我沒什麼值錢的東西，但我願意交你這個朋友。
	mpforce silent-m say 我其實是個超級傭兵，一天價碼五十萬！
	mpforce silent-m say 但以後若有用得著的地方，你只要付我四十萬，
	mpforce silent-m say 我就為你賣命兩天！
	mpforce silent-m bow $b
