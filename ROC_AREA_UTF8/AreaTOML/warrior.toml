"""
[[mobiles.13703.programs]]
trigger = "talk_prog"
argument = "p rising-sun house"
script = """
if is_qmark($n) == thief_quest_list 200400
	nod $n
	say 噓，小聲一點，跟我過來....
	mpechoat $n $I 偷偷把你拉到廚房的角落....
	mpmod_qmark $n thief_quest_list v1 = 401
	mpadd_qmark self warrior_cook_story 50 0 0 0 1 0
	mpdef_rembch $n
endif
"""
[[mobiles.13703.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if insameroom($b)
	if is_qmark($i) == warrior_cook_story 100000
		say 你是工會派來的吧？據說你們只派夠格的高手，所以我才會找你們。
		mpechoaround $b $I 以懷疑的眼光看看 $b ，似乎不怎麼相信 $b 的能力....
		mpechoat $b $I 以懷疑的眼光看看你，似乎不怎麼相信你的能力....
		say 罷了，會咬人的狗不叫，也許這樣不起眼才叫高手。
		mpecho $I 用懷疑的語氣喃喃自語著....
		mpmod_qmark self warrior_cook_story v0 + 1
		break
	endif
	if is_qmark($i) == warrior_cook_story 100001
		say 你的任務就是去暗殺永恆之塔一樓的爆米花小販(puffed-rice dealer)，
		say 我們相信他是風火海的一線諜報人員，已經破壞過我們很多滲透計畫。
		say 啊，說這個你也不懂....
		mpecho $I 發現說溜了嘴，急忙打個哈哈....
		say 事成後，砍下他的頭交給附近的園丁(gardener)，絕對少不了你的好處的。
		mpmod_qmark $b thief_quest_list v1 = 402
		mpdel_qmark self warrior_cook_story
		mpdef_rembch null-tar
	endif
endif
"""

