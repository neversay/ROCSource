[rooms.13777]
name = "資料室"
description = """
這裡保藏了許多優秀武士們的心血結晶，也許你可以在這裡找到一些有
價值的資料。四個巨大的架子分別標明著戰士之卷、騎士之卷、劍客之卷與
僧侶之卷(warrior，knight，swordsman，monk)。
"""
flags = ["INDOORS"]
sector = "INSIDE"
[[rooms.13777.extra_descriptions]]
keywords = "warrior"
description = """
給新手戰士們的建議：
    首先，單獨一位戰士並不能發揮威力，但只要能夠和牧師或者法師組成一
隊，他們助攻型的法術能夠讓戰士如虎添翼！所以盡量和其他人一起組隊冒險。
另外，戰士系的人物不像法師，戰士是非常依賴裝備的，所以不要吝惜你的金錢，
盡可能把所有最好的防具武器穿戴起來，你花掉的金錢很快就能從敵人的屍體裡
賺回來。最後，小心設好你的wimpy，我們的建議是，能設多高就設多高，究竟
死而復活是要花很大的代價的，我們已經看過太多好勇鬥狠的新手戰士因為 wimpy
設太低而遺失他所有的裝備 - 這真是情何以堪啊！
"""
[[rooms.13777.extra_descriptions]]
keywords = "knight"
description = """
給新手騎士們的建議：
    騎士最具威力的地方是每回合六次攻擊的能力，如果武器裡含有隱藏力量，
每回合攻擊的次數會更多。騎士不像劍客需要時時補充移動力，所以具有很高的
單獨行動能力。新手騎士和有經驗的騎士最大的差別除了裝備之外，便是打帶跑
戰術(hunt and flee)的運用。善於使用打帶跑戰術的騎士甚至可以輕易擊敗比他
能力高出數十級的魔獸，新手騎士們不可不詳加琢磨。
"""
[[rooms.13777.extra_descriptions]]
keywords = "swordsman"
description = """
給新手劍客們的建議：
    如果劍客和騎士一對一決鬥，幾乎可以確定活下來的一定是劍客。劍客是一
種爆發力極強的職業，許多特殊的劍技都可以在一瞬間將敵人斬成兩段。並且由
於劍客在劍術上的專研，他們不容易被打掉武器，面對防禦值(ac)高的敵手也能
使用特殊劍法增加命中率。唯一的缺點是劍客一定要有牧師系的職業在一旁支，
否則劍客的瞬間爆發力馬上就會用盡他所有的移動力。
"""
[[rooms.13777.extra_descriptions]]
keywords = "monk"
description = """
給新手僧侶們的建議：
    僧侶是一項多才多藝的職業，利用徒手格鬥的技巧，可以讓精於閃躲的敵人
完全無法逃出你的手掌心之中。僧侶徒手格鬥的高命中率，一直是這項職業的最
大技巧。當然，雙手徒手的靈活攻擊，更是使用武器所辦不到的。
"""
