	mpgoto $b
	mpecho $I 快步走了過來....
	mpmod_qmark $b serpent_peddler_quest v2 = 0
	break
endif
if inroom($i) == 13735
	if is_qmark($i) == serpent_peddler_follow
		say 我該到銀蛇武士堡辦點事了....
		mpgoto 13735
