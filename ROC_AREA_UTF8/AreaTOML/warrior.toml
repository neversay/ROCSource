[[mobiles.13738.programs]]
trigger = "entry_prog"
argument = "100"
script = """
if insameroom($b)
	if inroom($i) == 6002
		if is_qmark($i) == serpent_peddler_follow 100001
			mpdis_magic self blindness
			mpat 5 cast inf
			mpecho .
			mpecho 三個大漢突然從林間竄出，擋住你的去路！
			mpmload 13748
			mpforce head mpdef_rembch $b
			mpforce head follow $b
			mpecho .
			mpecho 你要付十萬金幣給強盜頭子，以求順利達成任務；
		        mpecho 還是要為民除害，把這三個敗類翦除？
			mpmod_qmark self serpent_peddler_follow v0 = 2
			break
		endif
	endif
	if inroom($i) == 3012
		if is_qmark($i) == serpent_peddler_follow 100002
			mpecho .
			pat $b
			say 剛才真是謝謝你了，我看我們也走累了....
			think
			say 這樣吧，我們先到咕嚕咕嚕酒吧喝一杯吧，
			say 由我請客，順便表達我的感謝。
			mpmod_qmark self serpent_peddler_follow v0 = 3
			break
		endif
	endif
	if inroom($i) == 3006
		if is_qmark($i) == serpent_peddler_follow 100003
			if insameroom(silent-m)
				mpecho .
				mpecho $I 一看到沈默的煉金師(silent alchemist)就臉色大變！
				gasp
				mpforce silent-m say 好傢伙，總算讓我找到你了！
				mpforce silent-m say 你賣我們的那些假捲軸，害我最好的伙伴被洞穴巨人分屍了！
				mpforce silent-m say 我今天一定要為他們報仇！
				mpecho .
				say 喂，你要搞清楚，殺人的又不是我，
				say 更何況捲軸法力失效是常有的事，誰叫你貪小便宜。
				mpecho .
				mpforce silent-m say 可惡，害死了人還不認錯！納命來！
				mpechoat $n 沈默的煉金師(silent alchemist)正要出手攻擊，卻被你擋下....
				mpechoaround $n 沈默的煉金師(silent alchemist)正要出手攻擊，卻被 $n 擋下....
				mpforce $b say 住手，他是我的委託人，沒問過我別想動手！
				mpforce silent-m say 好吧，讓你選....
				mpforce silent-m say 你是要伸張正義(talk alc help silent)，
				mpforce silent-m say 還是要助紂為孽(talk alc help peddler)？
				mpmod_qmark $b serpent_peddler_quest v0 = 3
				mpmod_qmark self serpent_peddler_follow v0 = 4
			endif
		endif
		break
	endif
	if inroom($i) == 13602
		if is_qmark($b) == serpent_peddler_quest 100004
			bow $b
			say 到這裡就安全了，謝謝你一路保護我。
			say 這是我答應的酬勞：
			mpgold $b 150000
			mpexp $b 1000
			think
			say 看你這麼值得信任...。
			say 其實我是史卡拉貝最大幫派 風之城 的成員，
			say 專門負責到各地尋找像你這種勇敢又有義氣的人。
			say 加入 風之城 有數不盡的榮華富貴，
			say 就連銀蛇堡都是我們的分堂。
			say 你只要告訴銀蛇堡主你想加入我們(join)，
			say 你將來的成就絕對不可限量！
			wave $b
			say 我走了，別放棄自己的大好機會喔！
			mpecho 精靈守衛開門讓 $I 進去....
			mpdel_qmark $b serpent_peddler_quest
			if is_qmark($b) != warrior_quest
				mpadd_qmark $b warrior_quest -1 8 0 0 0 1
			else
				if is_qmark($b) !& warrior_quest 100008
					mpmod_qmark $b warrior_quest v0 | 8
				endif
			endif
			mppurge self
		endif
	endif
endif
"""
[[mobiles.13738.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
if is_qmark($b) == serpent_peddler_quest 100100
	if mobcount(3160) == 0
		mpmload 3160
	endif
	mptransfer silent-m
	mpforce silent-m yell 謝謝你！我的朋友，你是正義的化身！
	mptransfer $b
