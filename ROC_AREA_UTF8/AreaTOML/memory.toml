trigger = "talk_prog"
argument = "flower"
script = """
if is_qmark($n) != memory_questmark
        mpadd_qmark $n memory_questmark -1 0 0 0 0 1
endif
if is_qmark($i) != memory_talking
        if is_qmark($n) != memory_flower1_quest
                if is_qmark($n) !& memory_questmark 204096
                        mpadd_qmark self memory_talking 10 0 0 0 0 1
                        tell $n 嗯，沒錯，我是在尋找某種花朵......
                        mpcallout 1 tell $n 不過這花朵不是我自己要的，但這不是重點。
                        mpcallout 2 tell $n 說得單純一點嘛，我想要七色之花的花種。
                        mpcallout 3 tell $n 雖然說我們鎮內有些地方也看得到七色之花，但是有個麻煩。
                        mpcallout 4 tell $n 在魔眼......在某件事情過後，鎮上的花朵就生病了。
                        mpcallout 5 tell $n 不要看它們仍然盛開的模樣，現在它們結不出半顆種籽。
                        mpcallout 6 tell $n 再這樣下去，這種對我們有特殊意義的花朵就要從鎮上消失了。
                        mpcallout 7 tell $n 現在比較可行的辦法則有幾個，其中一個則是......
                        mpcallout 8 tell $n 到外地去找健康的七色花，或是花種回來。
                        mpcallout 8 mpadd_qmark $n memory_flower1_quest -1 1 0 0 0 1
                        mpcallout 8 mpdel_qmark self memory_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
