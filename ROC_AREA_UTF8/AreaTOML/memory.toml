[[mobiles.63600.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if rand(50)
        say 是外地人啊......不要在鎮內鬧事啊。
else
        say 今天真是個好天氣啊......
endif
"""
[[mobiles.63600.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if rand(33)
        say 不是叫你別在這裡鬧事了嗎！
        frenzy
        mpnowait
else
        if rand(50)
                say 見識我的怒火吧！
                cast 'angry fire storm' $r
                mpnowait
        else
                say 必殺～斬！
                perform empslash
                mpnowait
        endif
endif
"""

