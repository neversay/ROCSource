[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) & memory_questmark 300016
or is_qmark($n) & memory_questmark 300032
        tell $n 你好，今天有什麼事嗎？
else
        if rand(50)
                tell $n 請問有什麼事嗎？
        else
                mpechoat $n $I自言自語著：又該去買幾本新的教科書了......
        endif
endif
"""
[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "story"
script = """
if is_qmark($n) != memory_questmark
        mpadd_qmark $n memory_questmark -1 0 0 0 0 1
endif
if is_qmark($i) != memory_talking
        if is_qmark($n) != memory_story_quest
                if is_qmark($n) & memory_questmark 300016
                or resp($n) < 31
                or level($n) < 41
                else
                        mpadd_qmark self memory_talking 10 0 0 0 0 1
                        tell $n 對，沒錯，我需要一點有趣或是新奇的故事。
                        mpcallout 1 tell $n 如果是冒險故事那就更好了，我個人很喜歡這類故事。
                        mpcallout 2 tell $n 我曾經想當個探險家，但是礙於父親的壓力，只得選擇與書本為伍。
                        mpcallout 3 tell $n 現在想出去闖天下也太老了，而且我也沒什麼錢請保鑣......
                        mpcallout 4 tell $n 所以我現在只能聽聽故事，並在閒暇之餘跟鎮裡的孩子們分享。
                        mpcallout 5 tell $n 請問你可以分享(share)一點讓我這個老頭聽聽嗎？
                        mpcallout 5 mpadd_qmark $n memory_story_quest -1 1 0 0 0 1
                        mpcallout 5 mpdel_qmark self memory_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "share"
script = """
if is_qmark($i) != memory_talking
        if is_qmark($n) == memory_story_quest 100001
                mpadd_qmark self memory_talking 10 0 0 0 0 1
                mpechoat $n 你點了點頭，開始提起過去的冒險經歷。
                mpcallout 1 mpechoat $n 冰天雪地中，在雪后的冰雪魔法下死中求勝的回憶。
                mpcallout 2 mpechoat $n 彷彿連鋼鐵都能熔化的火山口，和上古火龍大戰的經歷。
                mpcallout 3 mpechoat $n 被暗黑精靈大軍包圍，與深土帝國三公的死鬥。
                mpcallout 4 mpechoat $n 面對張著血盆大口的混沌九頭蛇，以及巨大無比的萬古樹妖。
                mpcallout 5 mpechoat $n 雖然你加油添醋了不少，不過$I似乎全都當真了。
                mpcallout 6 mpechoat $n 直到你覺得好像扯過頭了，這才停(end)了下來。
                mpcallout 6 mpmod_qmark $n memory_story_quest v0 = 2
                mpcallout 6 mpdel_qmark self memory_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "end"
script = """
if is_qmark($i) != memory_talking
        if is_qmark($n) == memory_story_quest 100002
                mpadd_qmark self memory_talking 10 0 0 0 0 1
                tell $n 真是精彩啊，不愧是身經百戰的探險家。
                mpcallout 1 tell $n 這些故事我會牢牢記住的，那些孩子們應該也會喜歡吧。
                mpcallout 2 tell $n 那麼，先謝謝你了，如果還有更多(more)故事的話，歡迎再告訴我。
                mpcallout 2 mpexp $n 3000
                mpcallout 2 mpskillexp $n 2000
                mpcallout 2 mpmod_qmark $n memory_questmark v2 | 16
                mpcallout 2 mpdel_qmark $n memory_story_quest
                mpcallout 2 mpdel_qmark self memory_talking
         endif
         if is_qmark($n) == memory_story_quest2 100002
                mpadd_qmark self memory_talking 10 0 0 0 0 1
                mpechoat $n $I顯得有些意猶未盡的樣子。
                mpcallout 1 tell $n 真羨慕你啊......可以在外面到處跑，接觸那麼多事物。
                mpcallout 2 tell $n 不過這麼一來，我又有不少故事可以跟孩子們分享了。
                mpcallout 3 tell $n 再次感謝你，你的故事真的相當精彩。
                mpcallout 3 mpexp $n 5000
                mpcallout 3 mpskillexp $n 4000
                mpcallout 3 mpmod_qmark $n memory_questmark v2 | 32
                mpcallout 3 mpdel_qmark $n memory_story_quest2
                mpcallout 3 mpdel_qmark self memory_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "more"
script = """
if is_qmark($i) != memory_talking
        if is_qmark($n) != memory_story_quest2
                if is_qmark($n) !& memory_questmark 300016
                or is_qmark($n) & memory_questmark 300032
                else
                        mpadd_qmark self memory_talking 10 0 0 0 0 1
                        tell $n 喔？真的嗎？你還有更多的冒險故事？
                        mpcallout 1 mpechoat $n 你發現$I的雙眼似乎閃耀著異樣的光彩。
                        mpcallout 2 tell $n 該不會有更超乎想像的大冒險？可以告訴我嗎？ 
                        mpcallout 2 mpadd_qmark $n memory_story_quest2 -1 1 0 0 0 1
                        mpcallout 2 mpdel_qmark self memory_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.63668.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($i) != memory_talking
        if is_qmark($n) == memory_story_quest2 100001
                if is_qmark($n) !& sealevil_quest 300016
                or is_qmark($n) !& adv_book_2_1 100002
                or is_qmark($n) !& adv_book_1_west 101024
                or is_qmark($n) !& adv_book_1_west 102048
                or is_qmark($n) < malathar_quest 100043
                        mpadd_qmark self memory_talking 10 0 0 0 0 1
                        mpechoat $n 你才剛打算開口，忽然想到一個麻煩的問題。
                        mpcallout 1 mpechoat $n 由於上次實在唬得太誇張了點，這次如果不更精彩就說不過去了。
                        mpcallout 2 mpechoat $n 問題是，要是再誇大下去，很明顯就是在鬼扯。
                        mpcallout 3 mpechoat $n 想到這點，你只能對$I搖頭苦笑，表示自己還有事要辦。
                        mpcallout 4 mpechoat $n $I看起來似乎有點失望......
                        mpcallout 4 mpdel_qmark self memory_talking
                else
                        mpadd_qmark self memory_talking 10 0 0 0 0 1
                        mpechoat $n 雖然上次已經扯得有點誇張了，不過你仍然胸有成竹。
                        mpcallout 1 mpechoat $n 在$I期待的眼光下，你開始講起半真實半吹牛的事蹟。
                        mpcallout 2 mpechoat $n 深不見底的邪惡洞窟深處，與不老不死的古代帝王死戰。
                        mpcallout 3 mpechoat $n 面對比自己高上數十倍的泰坦巨人，仍然奮不顧身地往前衝。
                        mpcallout 4 mpechoat $n 在炎紅塔塔頂，對上邪龍軍團兩名菁英時的戰慄感。
                        mpcallout 5 mpechoat $n 在瑪拉勒一連串事件中，多次與惡魔交手的精彩戰史。
                        mpcallout 6 mpechoat $n 只見$I被你唬得一愣一愣的，他對你的敬佩大概又增加了好幾分吧。
                        mpcallout 7 mpechoat $n 差不多可以停止(end)了，再扯下去你大概就跟破壞神差不多強了。
                        mpcallout 7 mpmod_qmark $n memory_story_quest2 v0 = 2
                        mpcallout 7 mpdel_qmark self memory_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""

