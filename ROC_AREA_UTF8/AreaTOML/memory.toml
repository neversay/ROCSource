[rooms.63803]
name = "石像廣場"
description = """
這裡是一處圓形廣場，廣場中央立著一尊約有十公尺高的石像，比較奇特的
地方是，石像身旁有五塊不同的晶石飄浮著，它們散發著柔和的光輝。當你對眼
前的物體感到疑惑的當兒，你忽然看到石像腳下的地面有面石板，石板上好像還
刻有文字(rock)，不曉得為什麼，你可以看得懂它們。
"""
flags = ["DARK", "INDOORS", "SUMMON_BIT", "NO_TELEPORT_OUT", "NO_TELEPORT_IN"]
sector = "CITY"
[[rooms.63803.extra_descriptions]]
keywords = "rock"
description = """
為了守護聖潔的女神，西妮絲殿下
守護者們獻出自己大部份的力量，成為她的護甲
但是為了躲避魔眼之子的追擊
因此，六位守護者將黃金之城歐亞那封印
以城市的意志，將女神與外界隔離
其中五位守護者的肉體也一同被封鎖在城中

只有水之守護者‧Jerdoey，留在世界上
她與時間之神訂下了契約
自願成為不老不死的永久守護者

石像身旁的五種寶物，各代表了五位守護者
鑽石(diamond)	  光之守護者‧Iruny
黑水晶(carbonado) 闇之守護者‧Halim
紅寶石(ruby)	  火之守護者‧Vicna
黃玉(topaz) 	  地之守護者‧Quadriga
翡翠(jade)	  風之守護者‧Unny

欲晉見五位守護者的人們
必須將自身的意念傳送(intend)至其中一種寶物上
如此，方能打開前往守護者的通道

"""
[rooms.63803.exits.north]
description = ""
keywords = ""
locks = []
key = 0
to_room = 63802
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend diamond"
script = """
if ispc($n)
	echoat $n 鑽石似乎感受到你的意識，發出耀眼的強光包圍著你！
	echoat $n 當你回過神來的時候，眼前的景色已經不一樣了。
	echoaround $n 你看見鑽石竟然發出眩目的強光，令你無法直視。
	echoaround $n 耀眼的光芒籠罩了$n的身體，$n就這樣消失在強光之中......
	transfer $n 63824
endif
"""
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend carbonado"
script = """
if ispc($n)
	echoat $n 柔和的黑色光芒化成了絲線狀，緩緩纏繞在你身上。
	echoat $n 當光芒散去之後，你發現自己似乎被帶到了另一個地方。
	echoaround $n 黑水晶閃動著柔和的異光，環繞在$n身邊。
	echoaround $n 只見$n的身體竟然逐漸與黑色的光芒融合為一......
	transfer $n 63827
endif
"""
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend ruby"
script = """
if ispc($n)
	echoat $n 瞬間，紅色的火光張牙舞爪地向你襲來，你的視界頓時化成一片火紅！
	echoat $n 你趕緊逃離紅光的掌控，然而你卻發現四周的景物好像不太相同。
	echoaround $n 火紅色的光芒毫無預警地襲來，就像烈燄一般將$n活生生吞沒！
	echoaround $n 紅光來得快也去得快，然而你眼前已經沒有$n的身影了......
	transfer $n 63830
endif
"""
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend topaz"
script = """
if ispc($n)
	echoat $n 一道光線自黃玉射出，在你腳下劃出了上古魔法陣的圖案。
	echoat $n 身處散發著黃光的魔法陣中，視野內的景物慢慢地改變了模樣。
	echoaround $n 你看見$n腳下出現了由黃色光線劃成的魔法之陣。
	echoaround $n 當魔法陣完成的同時，$n的身體竟然就這麼陷入魔法陣之中......
	transfer $n 63833
endif
"""
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend jade"
script = """
if ispc($n)
	echoat $n 綠色的光芒輕柔地擁抱著你，舒服的感覺令你不自覺地閉上了眼睛。
	echoat $n 當你張開雙眼時，才發現自己不曉得什麼時候來到了此處。
	echoaround $n 由翡翠所放出的綠色光化成了美麗女性的外表，擁抱著$n。
	echoaround $n 然而，你忽然發現$n的身形逐漸模糊，最後竟然完全不見了......
	transfer $n 63836
endif
"""
[[rooms.63803.programs]]
trigger = "room_command"
argument = "intend default"
script = """
if ispc($n)
	echoat $n 啥？
endif
"""

