short_description = "費德斯坦(Feldstein)"
long_description = "「惡魔公爵」費德斯坦(Feldstein)一臉冰冷地望著你。\n"
description = """
如果光看外表，他就像個冷酷的帥氣中年大叔，就算你跟他面對面玩三貼，也感
覺不到他身上有什麼力量或是靈氣魔氣等等的東西。然而，他卻是個擁有爵位的
