argument = "30"
script = """
modhmv pc 04.5 10 00000000
    	modhmv pc 14.5 10 00000000
    	modhmv pc 24.5 10 00000000
    	echo 經過充分的休息，你感覺狀況更好了！
  if rand(50)
   	callout 1 echo 一隻老鼠從牆腳破洞鑽了出來，迅速消失在另一邊......
    	break
  endif
  callout 1 echo 一陣霉氣撲面而來......
"""
[[rooms.9442.programs]]
trigger = "room_command"
argument = "survey view"
script = """
if month($) <= 3
  	if hour($) <= 5
  	or hour($) >= 21
    		echoat $n \u001B[1;37m你看到遠方街上猶有細雪，春夜的寒意讓你不禁縮著脖子吐氣，\u001B[0m
    		rcall moon $n
		break
  	endif
        if hour($) > 16
                echoat $n \u001B[1;31m火紅的太陽掛在黃昏的垂幕上，映著春天怒放的鮮花，十分美麗。\u001B[0m
		break
        endif
  	if hour($) > 5
    		echoat $n \u001B[1;32m你看到遠方街上熙熙攘攘，活潑的春天氣氛也傳進了旅店房間。\u001B[0m
  	endif
  	break
endif
if month($) <= 8
  	if hour($) <= 5
  	or hour($) >=21
    		echoat $n \u001B[1;36m你看到遠方街上籠罩一層薄霧，夏天的暑熱消散一空，\u001B[0m
    		rcall moon $n
		break
  	endif
        if hour($) > 16
                echoat $n \u001B[1;31m火紅的夕陽掛在黃昏的垂幕上，驚人的熱氣讓你滿臉大汗。\u001B[0m
		break
        endif
  	if hour($) > 5
    		echoat $n \u001B[1;32m你看到遠方街上熱鬧非凡，夏天的氣息讓萬物欣欣向榮。\u001B[0m
	endif
  	break
endif
if month($) <= 12
  	if hour($) <= 5
  	or hour($) >= 21
    		echoat $n \u001B[1;36m你看到遠方秋風吹起，冷夜寒星讓街道顯得空曠寂寞，\u001B[0m
    		rcall moon $n
		break
  	endif
        if hour($) > 16
                echoat $n \u001B[1;33m圓扁的太陽緩緩降入群山間，微寒的秋日讓你感傷莫名。\u001B[0m
		break
        endif
  	if hour($) > 5
    		echoat $n \u001B[1;36m你看到遠方街上眾人事務繁忙，忙著儲糧過冬。\u001B[0m
  	endif
  	break
endif
  if hour($) <= 5
  or hour($) >= 21
    	echoat $n \u001B[1;37m你看到街上大雪剛停，大雪夜的寒意讓你不禁縮著脖子吐氣，\u001B[0m
    	rcall moon $n
	break
  endif
  if hour($) > 16
        echoat $n \u001B[1;31m凜冽的冬風將黃昏的垂陽吹得毫無熱度，只看到微弱的紅火降下大地。\u001B[0m
	break
  endif
  if hour($) > 5
    	echoat $n \u001B[1;37m你看到遠方街上眾人皆裹著大衣厚服而行，毫無暖意的太陽晾在天空。\u001B[0m
  endif
"""
[[rooms.9442.programs]]
trigger = "room_defun"
argument = "moon"
script = """
