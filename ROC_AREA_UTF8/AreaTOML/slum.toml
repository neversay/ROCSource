，你可以傾著上半身向外瞭望(survey view)，看看大街的景色，也可以沿
著樓梯向下走。
"""
flags = ["NO_MOB", "SAFE", "SUMMON_BIT", "SAVE", "NO_TELEPORT_IN"]
