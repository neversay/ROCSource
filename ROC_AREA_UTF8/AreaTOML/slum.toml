    	echoat $n \u001B[1;36m天空灑滿銀星，不見紅月。\u001B[0m
	break
  endif
  if day($) <= 11
    	echoat $n \u001B[1;31m你也看到上弦月掛在夜空中，散發著淒冷的紅光。\u001B[0m
	break
  endif
  if day($) <= 23
    	echoat $n \u001B[1;31m你也看到美麗的滿月掛在夜空中，散發著飽滿的紅暈。\u001B[0m
	break
  endif
  echoat $n \u001B[1;31m你也看到下弦月懸在夜空中，散發著詭異的紅光。\u001B[0m
"""

