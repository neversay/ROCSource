[rooms.9400]
name = "巢穴貧民區暫存區"
description = """
這裡堆滿了各式雜物和垃圾，地上淺坑積滿死水，角落鼠屍爛得發蛆，
令人昏眩的惡臭無所不在，這裡是貧民區的隱密角落，不管你在這裡做什麼
都沒有人會注意。
    另外，你在不遠處的廢物堆中看到了一張紙條(note)，似乎寫了些什麼。
"""
