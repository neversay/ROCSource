                                                  Neversay
"""

[rooms.9401]
name = "巢穴--貧民區(slum)的入口"
description = """
你來到一處與史卡拉貝城完全不同的混亂世界。髒亂、無序、簡窳的街
道一路延伸進去，空氣充滿陳腐的臭味，泥土地棄滿果皮和動物內臟。三兩
遊民從你身旁經過，肩擔油得發黑的布袋，匆匆消失彼方。這裡是巢穴貧民
區，史卡拉貝混亂之源。
    你南邊的史卡拉貝河灘不時駛來一艘小船(vessel)，看起來頗為神秘；
街道兩旁的石板屋常有居民走動，好不熱鬧。
    你低頭一看，腳下似乎踩著了一張紙條(note)。
"""
flags = ["NO_MOB"]
sector = "CITY"
[[rooms.9401.extra_descriptions]]
keywords = "vessel"
description = """
那幾艘小船似乎載了大量重物，幾乎沉進水裡。
"""
[[rooms.9401.extra_descriptions]]
keywords = "note"
description = """
這個區域是由Neversay在Nov,7,2001建立的，用以替代原本的生化工廠，
統一ROC風格。
"""
