[[rooms.9466.programs]]
trigger = "room_enter"
argument = "15 100"
script = """
echoat $n 遠方傳來空洞呼號的鬼鳴。
  if rand(50)
  	if primeattr($n) == 3
  	or primeattr($n) == 4
		c mute $n 10
 		echoat $n 你聽到鬼鳴中飄盪著一句話：「死吧......」
 	endif
  endif
"""
