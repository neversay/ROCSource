[[rooms.9401.programs]]
trigger = "room_enter"
argument = "15 30"
script = """
if hour($) == 10
	echo 遠方駛來一群雙桅帆船......
  	callout 1 echo 一名水手登上船頭，大喊：「到貨啦！漁船讓道！」
  	callout 3 echo 河上帆船群緩緩駛離......
  endif
  if hour($) == 21
  	echo 你看到幾艘雙桅帆船遠遠駛來......
  	callout 3 echo 河上帆船群緩緩駛離，往下游而去......
  endif
  if mobcount(9429) > 0
  	if hour($) == 23
  		echo 你看到一艘小黑船迅捷地往上游划去。
  	endif
  	if hour($) == 8
  		echo 你看到一艘小黑船快速地駛向下游。
  	endif
  endif
  if hour($) > 9
  	echoat $n 你聽到街道的紛擾，有如潮水般湧來。
  	break
  endif
  echoat $n 街上冷冷清清，除了遠方幾聲狗吠，皆無人聲。
"""

