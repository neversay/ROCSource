short_description = "船家(captain)"
long_description = "船家(captain)，一個滿臉風霜的老者，在這裡賣著船。\n"
description = """
聽附近的人說，這位老闆當年是海上捕鯊的第一高手，喪生在他手下的鯊不知道有
多少。看他現在這個樣子，你實在無法想像。
"""
act_flags = ["NPC", "SENTINEL"]
