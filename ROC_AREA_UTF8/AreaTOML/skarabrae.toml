[area]
name = "史卡拉貝城"
identity = "skarabrae"
builders = "Diku"
translator = "Zcecil"
modifier = "Amenda"
vnum_start = 2950
vnum_end = 3399
security = 1
recall = 3001
f_toggle = false

[mobiles.3000]
keywords = "wizard"
short_description = "風谷法術捲軸店老闆(wizard)"
long_description = "滿頭銀髮的精靈，風谷法術捲軸店老闆(wizard)靜靜地坐在店裡，臉上充滿了智慧。\n"
description = """
他雖然滿頭白髮，但是你隱隱可以感覺出他強大的魔力。他身上穿戴著許多你見都
沒見過的各式護符，最好還是不要亂惹他。
"""
act_flags = ["NPC", "SENTINEL"]
affected_flags = []
alignment = 900
level = 50
mod_hitplus = 800
mod_mana = 500
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = -5
dodge = 0
mod_pp = 0
gold = 5000
sex = "female"
race = "Elf"
class = ["MAGE"]
spec_flags = ["NO_DM", "EXPERT", "NO_CRAZY"]
special_function = "spec_cast_mage"
[[mobiles.3000.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.3000.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 如果你想要使用(recite)卷軸的話，
mpcallout 1 say 請先去學朗誦捲軸(scrolls)的技能。
"""
[[mobiles.3000.programs]]
trigger = "fight_prog"
argument = "50"
script = """
if rand(60)
        cast 'star fire'
        mpnowait
else
        cast powerball
        mpnowait
endif
"""
[[mobiles.3000.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == skarabrae_enemy
        say 史卡拉貝的敵人！納命來！
        c 3 powerball $n
        mpnowait
        break
endif
if isnpc($n)
        break
endif
if rand(50)
        smile $n
        if rand(50)
                if sex($n) == 2
                        mpcallout 1 mpechoat $n $I 說：小姐妳好，我們精靈捲軸是世界無雙的，請隨意看看。
                else
                        mpcallout 1 mpechoat $n $I 說：先生你好，我們精靈捲軸是世界無雙的，請隨意看看。
                endif
        else
                mpcallout 1 mpechoat $n $I 說：知道來這裡，您真是行家。
        endif
endif
"""
[[mobiles.3000.programs]]
trigger = "rand_prog"
argument = "20"
script = """
if pcnum($) > 0
        if rand(50)
                say 偉大的精靈王 奧貝隆(Oberon)曾說：
                say 「魔法是武士最好的朋友。」
        else
                say 沒有捲軸在身，武士別孤身犯險。
        endif
endif
"""
[[mobiles.3000.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) != skarabrae_enemy
        mpadd_qmark $n skarabrae_enemy 200 0 0 0 1 1
else
        mpmod_qmark $n skarabrae_enemy timer + 50
endif
"""

[mobiles.3001]
keywords = "baker"
short_description = "麵包店老闆(baker)"
long_description = "麵包店老闆娘(baker)正帶著微笑看著你。\n"
description = """
一個稍微發福，面帶微笑的老婦人，看起來相當的和藹。但是從她有力的臂膀，你
感覺到她也不是好欺負的。
"""
act_flags = ["NPC", "SENTINEL"]
affected_flags = []
alignment = 900
level = 52
mod_hitplus = 1000
mod_mana = 0
mod_hitroll = 5
mod_damroll = 5
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 5000
sex = "female"
class = ["WARRIOR"]
spec_flags = ["NO_DM", "EXPERT", "NO_CRAZY"]
[[mobiles.3001.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 肚子餓的話，體力及精神都會恢復得很慢喔！
"""
[[mobiles.3001.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == skarabrae_enemy
        say 史卡拉貝的敵人，納命來！
        mpkill $n
        break
endif
if isnpc($n)
        break
endif
hello $n
if is_qmark($n) == free_pie 100001
        mpcallout 1 say 我剛送你的派吃完了嗎？口味如何？
        break
endif
if goldamt($n) < 200
        sigh
        say 可憐的孩子，竟然那麼窮...
        say 我送你一塊派吧，免費的....
        mpoload 3009 $n 1 target
        mpadd_qmark $n free_pie 10 1 0 0 1 1
        break
endif
if rand(50)
        mpcallout 1 mpechoat $n $I 說：孩子，要記得隨時補充營養。
else
        mpcallout 1 mpechoat $n $I 說：香甜的麵包，百吃不厭喔。
endif
"""
[[mobiles.3001.programs]]
trigger = "rand_prog"
argument = "20"
script = """
if pcnum($) > 0
        wink
        if rand(50)
                say 如何？我親手烤的派還合你的口味嗎？
        else
                say 多吃一點，孩子，你太瘦了....
        endif
endif
"""
[[mobiles.3001.programs]]
trigger = "speech_prog"
argument = "yes"
script = """
say 謝謝你，孩子，你的喜愛是我最大的鼓勵。
"""
[[mobiles.3001.programs]]
trigger = "speech_prog"
argument = "no"
script = """
sigh
say 你換別種口味試試。
"""
[[mobiles.3001.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) != skarabrae_enemy
        mpadd_qmark $n skarabrae_enemy 200 0 0 0 1 1
else
        mpmod_qmark $n skarabrae_enemy timer + 50
endif
if mobcount(3011) > 0
        yell 可惡的 $N 竟然不顧新手福利殺害了我！執法者替我報仇！
        if insameroom(enforcer-skarabrae)
        else
                mptransfer enforcer-skarabrae
        endif
        mpforce enforcer-skarabrae hunt $n
        mpforce enforcer-skarabrae frenzy
endif
"""

