             所有的浪漫因她而起，所有的罪惡也因她而發生，

        我們只是處在她裙擺下的一個小角落，努力的扮演自己的角色，

             而區別的只是虛幻和真實的自己，常常令人迷思，

            一樣的夜晚，躺在山野裡的坡地上，仰望無垠天際，

滿天的星星，可以不停的夢想，不停的許願，雖然也是虛無的，不過她是永恆的

