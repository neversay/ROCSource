[rooms.26553]
name = "陰暗之間"
description = """
這一個陰暗的房間，是由完美的六角型排列組合而成。房間的上頭吊著一個吊床。
這張吊床的上頭載著非常重的東西，因此懸掛吊床的繩索被拉的筆直。一張巨大的椅子
擺放在這間房間之中。房間內地板下有條水溝流過，而上頭有個閣樓，不過上去閣樓的
