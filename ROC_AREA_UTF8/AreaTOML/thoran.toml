argument = "thoran_altar"
script = """
if robjcount(26598) > 0
	echoat $n 你用力地推動 沾滿血跡的祭壇(bloody altar) ....
	echoaround $n $n 用力地推動 沾滿血跡的祭壇(bloody altar) ....
