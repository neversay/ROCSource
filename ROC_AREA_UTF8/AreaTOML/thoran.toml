endif
if hour($) == 19
	if robjcount(26594) > 0
		purge coffin1-thoran
	endif
	if robjcount(26595) == 0
		oload 26595 99 floor
	endif
	echo 黑夜降臨，房間中的 棺材(coffin) 忽然緩緩打開....
	callout 1 echo 裡頭忽然飄出一隻 吸血鬼(vampire) ....！
	callout 1 mload 26552
endif
"""

