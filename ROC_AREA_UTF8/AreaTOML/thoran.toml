				callout 1 echoaround $n $n 將 沾滿血跡的祭壇(bloody altar) 給移開了....
				callout 1 purge altar1-thoran
				callout 1 oload 26599 99 floor
				callout 1 modrvt v0 = 1
				callout 1 modrvt timer = 30
