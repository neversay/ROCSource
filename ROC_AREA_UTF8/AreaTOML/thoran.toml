[[rooms.26553.programs]]
trigger = "room_time"
argument = "100"
script = """
if roomvalue($1) < 720
	modrvt v1 + 1
else
	modrvt v1 = 0
	if robjcount(26590) > 0
	else
		oload 26590 99 floor
	endif
	if objcount(26591) > 0
	else
		force 26587 oload 26591 99 floor
	endif
	if objcount(26592) > 0
		force 26587 purge hammock3-thoran
	endif
endif
"""
[[rooms.26553.programs]]
trigger = "room_command"
argument = "climb chair"
script = """
if isfight($n)
	echoat $n 你正在戰鬥中！
	break
endif
if robjcount(26557) > 0
	echoat $n 你爬到椅子的上頭，想要進入了閣樓中....
	echoaround $n $n 爬到了椅子的上頭，想要進入閣樓中....
	if roomvalue($0) == 0
		if pcnum($26587) < 2
			callout 1 transfer $n 26587
			callout 1 echoat $n 你進入了閣樓之中....
			callout 1 echoaround $n $n 進入了閣樓之中....
		else
			callout 1 echoat $n 閣樓上擠了太多人，你上不去....
			callout 1 echoaround $n 閣樓上擠了太多人， $n 上不去....
		endif
	else
		callout 1 echoat $n 但是閣樓已經毀壞，你無法爬上去....
		callout 1 echoaround $n 但是閣樓已經毀壞， $n 無法爬上去....
	endif
else
	callout 1 echoat $n 但你找不到椅子可以讓你爬上閣樓....
endif
"""
