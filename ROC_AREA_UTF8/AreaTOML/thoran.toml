[rooms.26587]
name = "閣樓上"
description = """
你正在閣樓的上頭，上頭的空間十分的狹隘，因此你必須微微的彎著腰才能夠順利棲身於
閣樓之中。支撐閣樓的結構十分的脆弱，當你登上閣樓時已經發出類似「嘰嘎、嘰嘎」的聲音
，閣樓上的人還是不要太多的好，以免整個倒塌。你可以往下爬回(climb down)房間之中。
"""
flags = ["NO_MOB", "INDOORS"]
sector = "INSIDE"
[[rooms.26587.programs]]
trigger = "room_time"
argument = "100"
script = """
if robjcount(26591) > 0
or robjcount(26592) > 0
else
	if mobcount(26537) > 0
		oload 26591 99 floor
	endif
endif
"""
[[rooms.26587.programs]]
trigger = "room_command"
argument = "grab chest"
script = """
if robjcount(26591) > 0
	if roomvalue($0) & 512
		if roomvalue($0) & 1024
			echoat $n 你趁著吊床與箱子一起盪過來的時候趕緊拿走了 箱子(chest)....
			echoaround $n $n 趁著吊床與箱子一起盪過來的時候趕緊拿走了 箱子(chest)....
			modrvt v0 r 512
			modrvt v0 r 1024
			modrvt v1 = 0
			purge hammock2-thoran
			oload 26592 99 floor
			oload 26593 viclv $n target
		endif
		if roomvalue($0) & 2048
			echoat $n 你想要拿走吊床上的箱子，但是距離過遠沒有成功....
			echoaround $n $n 想要拿走吊床上的箱子，但是距離過遠沒有成功....
		endif
	else
		echoat $n 你想要拿走吊床上的箱子，但是你只能夠輕微的推到吊床而已....
		echoaround $n $n 想要拿走吊床上的箱子，但是 $n 只能夠輕微的推到吊床而已....
	endif
endif
"""
[[rooms.26587.programs]]
trigger = "room_command"
argument = "push hammock"
script = """
if robjcount(26591) > 0
	if roomvalue($0) !& 512
		echoat $n 你輕輕的推動閣樓旁的吊床，讓吊床與上頭的箱子輕輕的擺動了起來....
		echoaround $n $n 輕輕的推動閣樓旁的吊床，讓吊床與上頭的箱子輕輕的擺動了起來....
		modrvt v0 | 512
		modrvt v0 | 1024
		modrvt v1 + 1
	endif
endif
"""
[[rooms.26587.programs]]
trigger = "room_command"
argument = "climb down"
script = """
echoat $n 你爬回了下面的房間....
echoaround $n $n 往下爬到了下面的房間....
transfer $n 26553
"""
[[rooms.26587.programs]]
trigger = "room_rand"
argument = "100"
script = """
if roomvalue($0) & 512
	if roomvalue($1) >= 10
		echo 閣樓旁的吊床與箱子的擺動漸漸的緩和了下來....
		modrvt v0 r 512
		modrvt v0 r 1024
		modrvt v0 r 2048
		modrvt v1 = 0
		break
	endif
	if roomvalue($0) & 1024
		echo 你看見閣樓旁的吊床與箱子往你的遠方盪了過去....
		modrvt v0 r 1024
		modrvt v0 | 2048
		modrvt v1 + 1
		break
	endif
	if roomvalue($0) & 2048
		echo 你看見閣樓旁的吊床與箱子往你這邊盪了過來....
		modrvt v0 | 1024
		modrvt v0 r 2048
		modrvt v1 + 1
	endif
endif
if rand(40)
	if pcnum($) >= 3
		if roomvalue($0) & 8
		 	echo 閣樓因無法承受長時間的過量載重，已經崩塌了....
	 		echo 你因為閣樓的結構崩塌，受到嚴重的創傷....
	 		modhmv pc 03.70 90 0
	 		transfer all 26553
	 		modrvt v0 = 0
	 		force 26553 modrvt v0 = 1
	 		force 26553 modrvt timer = 240
	 		break
		endif
		if roomvalue($0) & 4
		 	echo 支撐閣樓的主樑與柱子交接處，因剪力過大而有粉碎性裂縫....
	 		echo 趁著整理結構還沒倒塌前，趕緊下樓去吧....
	 		modrvt v0 | 8
	 		break
		endif
		if roomvalue($0) & 2
		 	echo 支撐閣樓的主樑因為彎矩過大，已經產生形變....
		 	echo 趁著整體結構還尚完整，趕緊下樓去吧....
		 	modrvt v0 | 4
	 		break
		endif
		if roomvalue($0) & 1
	 		echo 支撐閣樓的結構已經受到輕微的損傷，閣樓似乎開始輕微的搖了起來....
	 		modrvt v0 | 2
	 		break
		endif
		if roomvalue($0) !& 1
		 	echo 閣樓上頭的人太多了，支撐的結構發出「嘰嘎、嘰嘎」的聲音....
		 	modrvt v0 | 1
		endif
	endif
endif
"""

