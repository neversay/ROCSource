long_description = "一個妓女(whore)在這邊想著如何詐取你身上所有的錢財。\n"
description = """
這個女人身體十分的骯髒，她與客人搞完之後，幾乎都不清理身子的。
她不斷的向你招手，你確定要嗎？
"""
