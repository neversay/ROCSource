		callout 1 echoat $n 祭壇上頭的保護力場讓你無法接近，也讓你受傷了....
		callout 1 echoaround $n 祭壇上頭的保護力場讓 $n 無法接近....
		callout 1 modhmv $n 03.25 45 0
