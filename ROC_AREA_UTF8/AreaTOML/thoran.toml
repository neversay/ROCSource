[rooms.26595]
name = "地下城內的房間"
description = """
當你進到這間房間之中，發現裡頭幾乎是完全黑暗的。當你使用照明裝備照亮了房間之後
，才發覺裡頭赫然放有一具棺材。除了棺材之外，這裡的屍臭味非常的重，你開始懷疑這具棺
材與吸血鬼之間具有一定的關連性。
"""
flags = ["DARK", "INDOORS", "UNDERGROUND"]
sector = "INSIDE"
[rooms.26595.exits.south]
description = ""
keywords = ""
locks = ["ISDOOR", "CLOSED"]
key = 0
to_room = 26594
[[rooms.26595.programs]]
trigger = "room_time"
argument = "100"
script = """
if robjcount(26594) == 0
	if robjcount(26595) == 0
		if hour($) >= 6
			if hour($) <= 18
				oload 26594 99 floor
			else
				oload 26595 99 floor
				mload 26552
			endif
		else
			oload 26595 99 floor
			mload 26552
		endif
		break
	endif
endif
if hour($) == 7
	if robjcount(26595) > 0
		purge coffin2-thoran
	endif
	if robjcount(26594) == 0
		oload 26594 99 floor
	endif
	echo 白晝降臨，外頭忽然飄進一縷白煙，進入了 棺材(coffin) 之中....
	callout 1 echo 棺材(coffin) 忽然自己關閉了....
