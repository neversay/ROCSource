[rooms.26501]
name = "星光之城的城門"
description = """
通過了星界中錯綜複雜的路徑，你終於到達了傳說中星空之城的城門口。巨大、堅硬
的岩石漂浮在星界之中，組成了這一座相當巨大的城市。路到了這邊就中斷了，在你面前
是一道巨大而且光滑的牆壁，光滑的程度連平靜的湖面也是自嘆弗如。你似乎可以聽到由
牆壁對面傳過來的熱鬧聲音，但是卻不知道如何通過這道牆壁(wall)。
"""
flags = ["NO_MOB", "NO_RECALL"]
sector = "CITY"
[[rooms.26501.extra_descriptions]]
keywords = "wall"
description = """
牆壁上十分的光滑，卻有一個小地方稍微凹陷了進去。你仔細的審視這個地方，發覺
似乎是經過人手經年累月的敲擊，才讓這個地方稍微凹了進去。
"""
[rooms.26501.exits.south]
description = ""
keywords = ""
locks = []
key = 0
to_room = 26500
[[rooms.26501.programs]]
trigger = "room_rand"
argument = "20"
script = """
if roomvalue($0) == 1
	echo 悄悄地星光之城的魔法城門又再度出現了....
	deldoor 0
	modrvt v0 = 0
endif
"""
[[rooms.26501.programs]]
trigger = "room_command"
argument = "knock wall"
script = """
if roomvalue($0) == 0
	echoat $n 你在牆壁凹陷的地方用力的敲了敲....
	echoaround $n $n 在牆壁凹陷的地方用力的敲了敲....
	echo 敲擊的力道十分輕微，但是回聲卻十分的響亮....
	callout 2 echo 過了一會兒，整座牆壁竟然在你面前消失了....！
	callout 2 makedoor 0 這座牆壁現在已經完全消失了 wall 0 0 26502
	callout 2 modrvt v0 = 1
	break
endif
if roomvalue($0) == 1
	echoat $n 這面牆壁已經消失了....
endif
"""

