mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 50
sex = "female"
[[mobiles.26502.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == thoran_talking
	break
endif
mpadd_qmark self thoran_talking 5 0 0 0 1 0
sigh
say 我一直都記得，當年我最愛的情人....，
mpcallout 1 say 將一顆大寶石鑲嵌(inlay)在一個箱子上....，
mpcallout 2 say 送給我後向我求婚的情形....，
mpcallout 3 say 可惜....，他....他在前往涅盤大地的時候....，
mpcallout 4 say 被那邊的野獸給....，
mpcallout 5 sigh
mpcallout 5 mpdel_qmark self thoran_talking
"""
[[mobiles.26502.programs]]
trigger = "greet_prog"
argument = "15"
script = """
if is_qmark($i) == thoran_talking
or isnpc($n)
	break
endif
mpadd_qmark self thoran_talking 5 0 0 0 1 0
blush $n
mpcallout 1 mpechoat $n $I 伸起了她的小手向你召喚著....
mpcallout 1 mpechoaround $n $I 伸起了她的小手向 $n 召喚著....
mpcallout 2 say 喂！ $n ！想不想來一次啊....？
mpcallout 3 say 我的收費不會很貴喔....！
mpcallout 4 mpechoat $n $I 話說完，向你眨了眨眼睛....
mpcallout 4 mpechoaround $n $I 話說完，向 $n 眨了眨眼睛....
mpcallout 5 mpecho 忽然你覺得有點想吐....
mpcallout 5 mpdel_qmark self thoran_talking
"""

