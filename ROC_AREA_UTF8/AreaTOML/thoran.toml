[rooms.26598]
name = "祭壇旁邊的密室"
description = """
當你扳動了祭壇下的拉桿，才發覺這邊有間密室，裡頭關了一個人，竟然是....！
"""
flags = ["DARK", "INDOORS", "UNDERGROUND"]
sector = "INSIDE"
[[rooms.26598.programs]]
trigger = "room_defun"
argument = "thoran_anir_death"
script = """
if is_qmark($n) == thoran_anir_quest 100001
	if rmobcount(26548) > 0
		if is_qmark(vampire1-thoran) == thoran_anir_death
			if is_equ_obj($n) == 26545
				purge $n timber-thoran
				echoat $n 你將手上的 木樁(timber) ，插向變成吸血鬼的奈亞心臟....
				echoaround $n $n 將手上的 木樁(timber) ，插向變成吸血鬼的奈亞心臟....
				mod_qmark $n thoran_anir_quest v0 = 11
				callout 1 echo 木樁(timber) 插進了奈亞的心口....
				callout 2 echo 奈亞(Anir) 大叫一聲，隨即側身死去....
				callout 2 purge vampire1-thoran
				callout 2 oload 26558 99 floor
			else
				echoat $n 你手上並沒有 木樁(timber) 這樣武器....
			endif
		else
			echoat $n 吸血鬼 奈亞(Anir) 目前精神飽滿，你目前完全無法近身....
			echoround $n 吸血鬼 奈亞(Anir) 目前精神飽滿， $n 目前完全無法近身....
			force vampire1-thoran
			force vampire1-thoran mpkill $n
		endif
	else
		echoat $n 這裡沒有你要刺的對象....
	endif
endif
"""
