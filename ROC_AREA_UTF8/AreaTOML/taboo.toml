當你仔細察看這具枯骨時，由他穿戴鎧甲和已化為枯骨的手中仍緊抓著
的斷劍握柄看來他應該是個戰士吧，你發現壓在它身上的斷牆(wall)似
乎有點鬆動，要推推(putoff)看嗎?
"""
