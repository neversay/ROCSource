[[mobiles.32009.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == taboo_kelo_quest
        say 快能離開了...
        break
else
        say 我是來自史卡拉貝城的克羅，你知道如何走出這個地方嗎？
        say 我已經困在這不知多久了，正好就碰到你，要不要跟我一起走？
        say 只要給我五萬，我就陪你一起走，我的功夫還算不差，你覺得怎麼樣？
        if is_qmark($n) != taboo_kelo_quest
                mpadd_qmark $n taboo_kelo_quest 2 0 0 0 0 1
        endif
endif
"""
[[mobiles.32009.programs]]
trigger = "bribe_prog"
argument = "50000"
script = """
if being($b)
        mpjunk all.coins
        mpgold $n 50000
        say 我已經先接受 $B 的邀請了，下次再找我吧。
        smile $n
        break
endif
if insameroom(sijeso-taboo)
        tell $n 很抱歉我要這麼說，但我無法跟他一同組隊。
        tell $n 不要相信這個人，遲早你會發現他的真面目。
        tell $n 他絕對不是好人，早早離開他吧，我的朋友。
        mpjunk all.coins
        mpgold $n 50000
else
        if is_qmark($n) != taboo_kelo_quest
                mpechoat $n $I 對於你的慷慨大方表示謝意。
                mpechoaround $n $N 無緣無故給了 $I 一大筆金幣！
        else
                if is_qmark($i) != taboo_kelo_quest
                say 請你記住，我只能陪你兩天的時間。
                say 兩天後若還是回不了史卡拉貝城，我就自己找路了。
                say 現在就讓我們想辦法走出這個塔回到史卡拉貝城吧！
                mpadd_qmark self taboo_kelo_quest 48 0 0 0 0 1
                mpdef_rembch $n
                mpgroup $b self 1 0
                endif
        endif
endif
"""
[[mobiles.32009.programs]]
trigger = "rand_prog"
argument = "100"
script = """
if being($b)
else
        if inroom($i) != 32037
                mppurge self
        endif
break
endif
if is_qmark($i) != taboo_kelo_quest
        if insameroom($b)
                if area($i) != skarabrae
                        tell $b 你不會比我還路痴吧！夠了！我自己走！
                        mpecho $I 氣呼呼的走掉了！
                        mppurge self
                endif
        else
                say $b 這孩子真糟糕啊...帶路帶到人都不見了
                say 算了，我還是自己走好了～
                sing
                mpecho $I 輕快地離開了這～
                mppurge self
        endif
break
endif
if is_qmark($i) == taboo_kelo_quest
        if insameroom($b)
                if area($i) == skarabrae
                        mpecho $I 深深吸了一口氣，看來無比的舒暢。
                        tell $b 謝謝你，我終於能回到這久違的故鄉了！
                        if is_qmark($b) == taboo_scroll
                                if is_qmark($b) != taboo_kelo_quest 100001
                                  tell $b 這是我家族自古流傳下來的脛甲，就交給你吧！
                                  mpechoat $b $I 將身上的風神脛甲脫下來交給了你。
                                  mpechoaround $b $I 將身上的風神脛甲脫下來交給了 $b 。
                                  mpoload 32008 $b viclv target
                                  mpadd_qmark $b taboo_kelo_quest -1 1 0 0 0 1
                                else
                                  tell $b 雖然我沒什麼能給你的，但十分感謝你的幫助！
                                  mpechoat $b --你想起自己似乎已經不是第一次幫助他--
                                endif
                                mpecho $I 的身影逐漸消失在你眼前，只剩一陣冷風吹過...
                                mppurge self
                        else
                                tell $b 這是我在裡面找到的，就送給你當禮物吧。
                                mpoload 32046 $b viclv target
                                tell $b 或許，這卷軸藏有什麼重大的秘密呢，自己保重啦。
                                mpadd_qmark $b taboo_scroll -1 0 0 0 0 1
                                wave $b
                                mpecho $I 的身影逐漸消失在你眼前！只剩一陣冷風吹過...
                                mppurge self
                        endif
                endif
        else
                mpat 5 tell $b 喂！你丟下我跑哪去啦！？
                kok $b
        endif
endif
"""
[[mobiles.32009.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpecho $I 化為一縷輕煙消散在風中
"""

