short_description = "西傑索(Sijeso)"
long_description = "一位受困於此的戰士(warrior)正小心的注意四周。\n"
description = """
他由於長期受困於此，因此只要感到邪氣就會反射性的攻擊但是由於
長期被邪氣薰染，他早已命在旦夕了，現在只是靠著戰鬥本能而活著
，如同行屍走肉般罷了。
"""
