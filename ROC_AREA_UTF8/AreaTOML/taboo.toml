description = """
掉到井底的你簡直不敢相信自己所見的，井底下約有及腰的積水，
而你腳下踏的不是泥沼，而是一堆白骨，你看到這些白骨都呈破裂狀，
好像曾經遭受撞擊，看來此地不宜久留，快離開吧!
"""
