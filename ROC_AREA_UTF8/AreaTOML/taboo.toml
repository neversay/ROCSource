[[mobiles.32008.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.32008.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
or isimmort($n)
        break
endif
if is_qmark($i) == taboo_sijeso_quest
        break
else
        if isevil($n)
                mpecho $I 眼中透露出殺意，如同看到塔中的怪物一般。
                yell 你就算變了模樣也騙不了我！去死！邪靈！
                mpechoaround $I 大喊一聲後竟舉起武器朝著 $N 刺了過去！
                mpkill $n
        else
                say 感謝主！終於有人來這裡了！
                say 求求你帶我離開這！我是個好武士！我...我能幫你！
                say 只要你帶我回到史卡拉貝！拜託！拜託！(Yes/No)
        endif
endif
"""
[[mobiles.32008.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if being($b)
        break
endif
if insameroom(kelo-taboo)
        say 該死！你竟和克羅是一伙的！給我滾！
        say 有他在就不會有我在！我倆誓不兩立！
        say 滾吧！不要逼你老子動手！
        mpecho $I 一臉氣呼呼地靠著牆瞪著克羅！似乎兩人曾有過糾紛。
                break
        else
        if is_qmark($i) != taboo_sijeso_quest
                say 謝謝！我們快走吧！
                say 我等了那麼久終於能夠離開這鬼地方！
                mpadd_qmark self taboo_sijeso_quest 48 0 0 0 0 1
                mpdef_rembch $n
                mpgroup $b self 1 0
        endif
endif
"""
[[mobiles.32008.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if being($b)
        break
else
        say 馬的！老子這麼低聲下氣了還不領情！做我刀下魂！
        mpecho $I 身後冒出了黑色的靈體，裂開的大嘴正冷冷笑著！
        c 'energy drain' $n
        mpnowait
endif
"""
[[mobiles.32008.programs]]
trigger = "rand_prog"
argument = "100"
script = """
if being($b)
else
        if inroom($i) != 32035
                mppurge self
        endif
        break
endif
if is_qmark($i) != taboo_sijeso_quest
        if insameroom($b)
                if area($i) != skarabrae
                        mpgroup self self 0 0
                        mpechoat $b $I 大吼著「你會不會帶路啊！去死吧！」
                        mpecho $I 身上冒出邪惡的氣息！
                        mpechoat $b $I 將你丟入了闇黑的空間！
                        mptransfer $b 32065
                        mppurge self
                else
                        if area($i) != taboo
                                mpgroup self self 0 0
                                yell 我終於離開那個禁錮吾等邪靈的高塔啦！
                                grin $b
                                say 這是給你的謝禮，去死吧！
                                mpecho $I 身上冒出邪惡的氣息！
                                mpechoat $b $I 將你丟入了闇黑的空間！
                                mptransfer $b 32065
                                mppurge self
                        else
                                mpgroup self self 0 0
                                mpechoat $n $I 大吼著「你會不會帶路啊！去死吧！」
                                mpecho $I 身上冒出邪惡的氣息！
                                mpechoat $b $I 將你丟入了闇黑的空間！
                                mptransfer $b 32065
                                mppurge self
                        endif
                endif
        endif
else
        if insameroom($b)
                if area($i) == skarabrae
                        say 喔！這就是史卡拉貝城了嗎？
                        mpgroup self self 0 0
                        mpechoat $b 聽到 $I 這種驚訝的語氣，你忽然覺得不對勁！
                        mpechoat $b 當初 $I 不是自稱來自史卡拉貝城嗎！？
                        grin $b
                        say 嘿嘿嘿！這是謝禮！
                        cac $b
                        mpechoat $b $I 將你丟入了闇黑的空間！
                        mptransfer $b 32065
                        mppurge self
                endif
        else
                mpgoto $b
                mpecho $I 急急忙忙的跑了過來！
                say 等...等等我啊！
                mpecho $I 看起來很累的樣子。
        endif
endif
"""

[mobiles.32009]
