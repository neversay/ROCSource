[rooms.32222]
name = "四樓到五樓的樓梯間"
description = """
脫離了剛才的怪異樓層後，你對於突如其來的強光顯得不能適應，在
過了一陣子後你的眼睛才慢慢適應了光線，你一睜開眼後，一座逼真的龍
人雕像映入你的眼中，你被這逼真過頭的雕像嚇得往後坐了下去，你不禁
咒罵著當初裝飾房間的人沒事把那麼逼真的雕像放在這，是想嚇死誰啊！
在你罵完後你拍拍衣服站了起來，忽然一個恐怖的想法如一支箭射入你腦
中：每層的守軍都和看到的某些事物有關，難道這層的守軍是龍人不成！
"""
