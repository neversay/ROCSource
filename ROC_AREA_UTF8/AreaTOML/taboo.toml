[rooms.32003]
name = "塔之大門"
description = """
一座黑色的高塔聳立在你眼前，塔中令人髮指的強烈邪氣，滲過眼前
的鐵門直擊你的五感，讓你不由自主向後退了一步。也許在推開北邊大門
的瞬間，後方的退路會被立馬截斷，現在轉頭離開可能是較好的選擇。
