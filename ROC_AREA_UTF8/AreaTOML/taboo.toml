[rooms.32219]
name = "樹林小徑"
description = """
眼前的道路被一片巨大的石牆硬分成了兩條，你看到石牆上還插著
的斷劍和大片被某種尖銳武器戳擊造成的痕跡，你忽地發現斷牆下有一
具骷髏(skeleton)，你不禁退了幾步，在這霧氣中你似乎可以看到北邊
不遠處有一座高聳的塔形建築物，或許那裡會有答案吧！
"""
flags = ["NO_MOB"]
sector = "FOREST"
[[rooms.32219.extra_descriptions]]
