[rooms.32217]
name = "古岩密道"
description = """
幽暗的隧道中不時自隧道頂上滴落著水滴，洞壁四周都長滿了青苔
，洞口的斷牆現在成了一道半透明的幻象，外面似乎看不見裡面。不時
有些小蟲自你腳下走過，你伸手探索著前方的路，忽然感到手摸到一個
圓圓的東西，你想到剛才的那副枯骨，難道是"骷髏頭"不成！！還好只
是個光滑的岩石，嚇了你一跳。
"""
