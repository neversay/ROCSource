風來的太怪了，整間指揮官室都沒有窗戶或通風口，而且門外依舊是熾熱
的炎柱所盤繞著，但這裡似乎就是不被外面的熱氣所干擾，你閉眼感覺寒
風的來源，你赫然發現寒風中還夾雜著死亡的氣息，而寒風的來源則是房
間裡那扇通向四樓的門後，門後似乎有著不屬於世間的邪惡。
