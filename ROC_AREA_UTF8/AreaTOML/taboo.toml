[mobiles.32000]
keywords = "holy aura-taboo"
short_description = "聖靈光氣(Holy Aura)"
long_description = "一團發出神聖光輝的靈氣(Aura)漂浮在這！\n"
description = """
你只看到一團氣體。
"""
act_flags = ["NPC"]
affected_flags = ["HOLD"]
alignment = 1000
level = 50
mod_hitplus = 100000
mod_mana = 100000
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "neutral"
race = "God"
spec_flags = ["NO_CHARM", "ALY_INF"]
[[mobiles.32000.applies]]
type = "APPLY_AMAGIC"
degree = 3000
[[mobiles.32000.applies]]
type = "APPLY_ADAMAGE"
degree = 3000
[[mobiles.32000.programs]]
trigger = "kill_prog"
argument = "100"
script = """
if is_qmark($n) == taboo_darkside 100001
        mpcallout 2 mpat $n mpechoat $n 或許這是天要給你個能贖罪的機會！
        mpcallout 2 mpat $n mpechoat $n 你在被聖靈光氣擊潰的瞬間，忽然覺得身上多了道烙印...
        mpmod_qmark $n taboo_darkside v0 = 2
else
        if is_qmark($n) == taboo_darkside 200001
        break
        endif
        if is_qmark($n) == taboo_darkside 100005
        mpcallout 2 mpat $n mpechoat $n 當你能感覺到被殺者之痛，你就能解脫了...
        mpcallout 2 mpat $n mpechoat $n 你感到每被擊敗一次，身上的痛楚就更深了些...
        mpmod_qmark $n taboo_darkside v2 + 1
        endif
endif
"""
[[mobiles.32000.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) == taboo_darkside 300020
        mpgoto self
        mpechoat $n 你心中傳來一股聲音！
        mpcallout 2 mpecho 『你已經對於你曾經犯下的罪惡表現了悔過』
        mpcallout 3 mpecho 『只有你能夠痛徹心扉你才能夠體會曾造成的傷痛』
        mpcallout 4 mpecho 『此後你已經無需為了自己曾犯下的罪惡難過』
        mpcallout 5 mpecho 『只要你能保持心中這份寧靜』
        mpcallout 6 mpecho 『永遠不見』
        mpcallout 7 mpmod_qmark $n taboo_darkside v0 = 6
        mpcallout 8 mptransfer $n 3005
        mpcallout 8 mpat 3005 mpechoat $n 一陣光之後你回到了熟悉的城鎮中
        mpcallout 8 break
endif
if is_qmark($n) == taboo_darkside 100005
        mpecho $I 緩緩變成了你過去曾經殺害的各種生命...手持光劍給了你致命一擊！
        mpforcer here modhmv $n 03.200 200 0
endif
if is_qmark($n) >= taboo_darkside 100001
        mpecho $I 冒出了無數的熾熱光芒！
        cast 5 'fire breath' $n
        mpnowait
else
        mptransfer $n 3001
endif
"""
[[mobiles.32000.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""

