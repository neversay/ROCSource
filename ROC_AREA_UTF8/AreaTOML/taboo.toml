他是一個黑髮的年輕人，全身穿著黑色系的衣服，唯有腳上繫著一對
刻有風神教徽的奇特脛甲，他的眼神中透露著某種神秘感，似乎暗示
著他曾經有過奇特的遭遇。
"""
