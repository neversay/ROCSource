[mobiles.310]
keywords = "slaver"
short_description = "奴隸商人(slaver)"
long_description = "一個奴隸商人(slaver)正無精打采地在這裡休息。\n"
description = """
他看起來已經很久找不到生意上門了，也許是因為受史卡拉貝反奴隸政策的影響。
"""
act_flags = ["NPC", "SENTINEL"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY"]
alignment = -500
level = 50
mod_hitplus = 1000
mod_mana = 500
mod_hitroll = 10
mod_damroll = 10
mod_ac = -20
mod_svs = 0
dodge = -30
mod_pp = 50
gold = -1
sex = "male"
race = "Human"
class = ["WARRIOR"]
spec_flags = ["NO_DM", "NO_CHARM", "NO_SLEEP"]
[[mobiles.310.programs]]
trigger = "fight_prog"
argument = "40"
script = """
if rand(30)
	c 3 'dispel magic' $n
else
	c 3 fireball $n
endif
"""
[[mobiles.310.programs]]
trigger = "rand_prog"
argument = "5"
script = """
if pcnum($) > 0
	if rand(50)
		sigh
		say 近來一個妖精(fairy)都沒抓到，真難生活。
	else
		say 最近這一帶的長官(chief)抓的正緊，妖精(fairy)的買賣越來越難做了…
	endif
endif
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
? $n
	say 要買妖精(fairy)別找我唷，最近沒抓到半個。
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "p greenwood kingdom"
script = """
say 綠樹王國在史卡拉貝城西不遠處。
say 你可以藉著 <help map> 來得知前往綠樹王國的路線。
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "fairy"
script = """
if is_qmark($i) == plains_slaver_waiting
	mpechoat $n $I 忙著自己的事，根本沒空理你。
	break
endif
if is_qmark($n) == plains_slaver_quest 200004
	break
endif
if is_qmark($n) >= plains_slaver_quest 200001
	say 要找妖精(fairy)的話，可能得到
	say 綠樹王國(Greenwoods)，那邊有不少。
	break
endif
if is_qmark($n) >= plains_slaver_quest 200002
	mpechoat $n $I 說「加油！」
else
	mpechoat $n $I 說「你不知道嗎？」
	mpechoat $n $I 說「妖精奴隸可是在這一帶最搶手的商品呢！」
	mpechoat $n $I 說「只是近來因為綠樹王國民族意識高漲，史卡拉貝又下」
	mpechoat $n $I 說「禁令，妖精奴隸就越來越難抓了。」
	if level($n) >= 15
		mpechoat $n $I 說「你似乎是個經驗挺豐富的冒險者。」
		mpechoat $n $I 說「我這裡有件不錯的東西，但是你必須幫忙我(yes/no)。」
		mpadd_qmark $n plains_slaver_quest -1 1 0 0 0 1
		break
	endif
endif
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($i) == plains_slaver_waiting
	mpechoat $n $I 忙著自己的事，根本沒空理你。
	break
endif
if is_qmark($n) == plains_slaver_quest 200004
	break
endif
if is_qmark($n) == plains_slaver_quest 100001
	mpechoat $n $I 長長的嘆了一口氣，「唉～～」
	mpechoat $n $I 說「那就算了。」
	mpdel_qmark $n plains_slaver_quest
endif
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "chief"
script = """
say 長官(chief)就住在這附近，經常會在附近走來走去。
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($i) == plains_slaver_waiting
	mpechoat $n $I 忙著自己的事，根本沒空理你。
	break
endif
if is_qmark($n) == plains_slaver_quest 100004
	break
endif
if is_qmark($n) == plains_slaver_quest 100001
	mpechoat $n $I 說「其實很簡單，你去幫我說服長官(chief)不再插手這事。」
	mpechoat $n $I 說「至於怎麼說服，就看你囉！」
	mpmod_qmark $n plains_slaver_quest v0 = 2
endif
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "inform"
script = """
if is_qmark($i) == plains_slaver_waiting
	mpechoat $n $I 忙著自己的事，根本沒空理你。
	break
endif
if is_qmark($n) == plains_slaver_quest 100004
	break
else
	if is_qmark($n) == plains_slaver_quest 100005
		mpechoat $n 你把之前發生的事通知商人。
		mpechoat $n $I 說「錢？我哪有錢付他…」
		mpechoat $n $I 說「不過至少你成功的完成任務了。」
		mpechoat $n $I 說「別跑遠了，晚點我還會找你的。」
		mpechoat $n 因為你完成任務，經驗值增加了！
		mpexp $n 500
		mpadd_qmark self plains_slaver_waiting 20 1 0 0 1 1
		mpmod_qmark $n plains_slaver_quest v0 = 0
		mpmod_qmark $n plains_slaver_quest v1 = 1
		break
	endif
	if is_qmark($n) == plains_slaver_quest 100006
		mpechoat $n 你把之前發生的事通知商人。
		mpechoat $n $I 說「幹的好，這樣我什麼都不用做了…」
		mpechoat $n $I 說「你成功的完成任務了。」
		mpechoat $n $I 說「別跑遠了，晚點我還會找你的。」
		mpechoat $n 因為你成功的完成任務，經驗值增加了！
		mpexp $n 1000
		mpadd_qmark self plains_slaver_waiting 20 1 0 0 1 1
		mpmod_qmark $n plains_slaver_quest v0 = 0
		mpmod_qmark $n plains_slaver_quest v1 = 2
		break
	endif
	if is_qmark($n) == plains_slaver_quest 100007
		mpechoat $n 你把之前發生的事通知商人。
		mpechoat $n $I 說「你殺了他！？你不知道這樣做對我們很不利嗎！？」
		mpechoat $n $I 說「不過至少你成功的完成任務了。」
		mpechoat $n 因為你的急燥，導致經驗減少了！
		mpexp $n -500
		mpechoat $n $I 說「別跑遠了，晚點我還會找你的。」
		mpadd_qmark self plains_slaver_waiting 20 1 0 0 1 1
		mpmod_qmark $n plains_slaver_quest v0 = 0
		mpmod_qmark $n plains_slaver_quest v1 = 3
		break
	endif
endif
"""
[[mobiles.310.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == plains_slaver_quest 200000
	if is_qmark($n) <= plains_slaver_quest 100003
		mpechoat $n 你聽到一道聲音說：「任務成功的重設！」
		mpdel_qmark $n plains_slaver_quest
	endif
	break
endif
if is_qmark($n) >= plains_slaver_quest 200001
	if is_qmark($n) <= plains_slaver_quest 200003
		if is_qmark($n) < plains_slaver_quest 300008
			mpechoat $n 你聽到一道聲音說：「本任務第二階段已經成功的重設！」
			mpmod_qmark $n plains_slaver_quest v2 = 0
			break
		endif
		break
	endif
	if is_qmark($n) == plains_slaver_quest 200004
		mpechoat $n 你聽到一道聲音說：「任務已經解完，不需重解。」
	endif
endif
"""
[[mobiles.310.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($i) <= plains_slaver_quest 200003
	if isnpc($n)
		if race($n) == Fairy
			if isaffected($n) & 262144
				if insameroom($b)
					mpechoat $b $I 說「幹的好！」
					mpecho $I 連忙把 $N 抓起來帶走。
					mppurge $n
					if is_qmark($b) < plains_slaver_quest 300005
						mpmod_qmark $b plains_slaver_quest v2 + 1
					else
						if is_qmark($b) >= plains_slaver_quest 300005
							mpechoat $b $I 說「幹的好！」
							mpechoat $b $I 說「等等，我找件好東西送你。」
							mpadd_qmark self plains_slaver_speech 20 1 0 0 0 1
						endif
					endif
				endif
			endif
		endif
	endif
	break
endif
if is_qmark($i) == plains_slaver_waiting
	if is_qmark($n) >= plains_slaver_quest 200001
		mpechoat $n $I 說「晚一點再來找我吧。」
		break
	endif
endif
if is_qmark($n) >= plains_slaver_quest 200001
	if is_qmark($n) <= plains_slaver_quest 200003
		if notbeing($b)
			mpechoat $n $I 說「啊！你來了！」
			mpechoat $n $I 說「我有個任務找你....」
			mpechoat $n $I 說「你去幫我抓五隻妖精來吧！」
			mpechoat $n $I 說「記得，是妖精(fairy)，不是小妖精(pixie)。」
			mpmod_qmark $n plains_slaver_quest v2 = 1
			mpadd_qmark self plains_slaver_quest 70 0 0 1 0 1
			mpdef_rembch $n
		else
			if is_qmark($n) == plains_slaver_quest 300001
				break
			else
				mpechoat $n $I 說「啊！你來了！」
				mpechoat $n $I 說「不過已經有人在幫我的忙了。」
				mpechoat $n $I 說「你晚一點再來吧！」
			endif
		endif
	endif
endif
"""
[[mobiles.310.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if is_qmark($i) == plains_slaver_speech
	if insameroom($b)
		if is_qmark($b) == plains_slaver_quest 200001
			mpechoat $b $I 說「這個送你吧！」
			mpoload 313 20
			give ofcol $b
			bye $b
			mpmod_qmark $b plains_slaver_quest v0 = 0
			mpmod_qmark $b plains_slaver_quest v1 = 4
			mpmod_qmark $b plains_slaver_quest v2 = 0
			mpdel_qmark self plains_slaver_speech
			mpdel_qmark self plains_slaver_quest
			mpdef_rembch null-tar
			break
		endif
		if is_qmark($b) == plains_slaver_quest 200002
			mpechoat $b $I 說「這個送你吧！」
			mpoload 314 20
			give ofcol $b
			bye $b
			mpmod_qmark $b plains_slaver_quest v0 = 0
			mpmod_qmark $b plains_slaver_quest v1 = 4
			mpmod_qmark $b plains_slaver_quest v2 = 0
			mpdel_qmark self plains_slaver_speech
			mpdel_qmark self plains_slaver_quest
			mpdef_rembch null-tar
			break
		endif
		if is_qmark($b) == plains_slaver_quest 200003
			mpechoat $b $I 說「這個送你吧！」
			mpoload 315 20
			give ofcol $b
			bye $b
			mpmod_qmark $b plains_slaver_quest v0 = 0
			mpmod_qmark $b plains_slaver_quest v1 = 4
			mpmod_qmark $b plains_slaver_quest v2 = 0
			mpdel_qmark self plains_slaver_speech
			mpdel_qmark self plains_slaver_quest
			mpdef_rembch null-tar
			break
		endif
	endif
	break
endif
if is_qmark($i) != plains_slaver_quest
	if being($b)
		tell $b 你動作真慢！
		tell $b 我去找別人好了！
		mpat $b mpechoat $b 你因為動作太慢，導致任務失敗了！
		mpat $b mpechoat $b 任務失敗，被扣除經驗點數！
		mpexp $b -2000
		mpdel_qmark $b plains_slaver_quest
		mpdef_rembch null-tar
	endif
endif
"""

[mobiles.311]
keywords = "chief northern plains"
short_description = "長官(chief)"
long_description = "北方平原的長官(Chief of the Northern Plains)在這裡巡邏。\n"
description = """
他是奧夫卡的一個小貴族，受史卡拉貝市議會秘令阻止奴隸買賣。
"""
act_flags = ["NPC", "SENTINEL", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY"]
alignment = 1000
level = 39
mod_hitplus = 500
mod_mana = 0
mod_hitroll = -10
mod_damroll = -10
mod_ac = 10
mod_svs = 20
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
spec_flags = ["NO_DM", "NO_CHARM", "NO_SLEEP"]
[[mobiles.311.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == plains_slaver_quest 100002
	mpechoat $n --- 你找到北方平原的長官了！ ---
endif
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == plains_slaver_quest 100002
	mpechoat $n -- 你要怎麼做？
	mpechoat $n -- 你是殺了他(kill)，還是試著說服(persuade)他？
	mpmod_qmark $n plains_slaver_quest v0 = 3
else
	mpechoat $n $I 說「奴隸制度(slavery)是邪惡的行為。」
	mpechoat $n $I 說「一定要阻止這些傢伙的惡行。」
endif
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "slavery"
script = """
mpechoat $n $I 說「只可惜我抓不到那個奴隸商犯罪的證據。」
mpechoat $n $I 說「他總是利用幫兇幫忙製造不在場證據(alibi)。」
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "alibi"
script = """
mpechoat $n $I 說「我遲早抓出他的犯罪證據！」
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "persuade"
script = """
if is_qmark($n) == plains_slaver_quest 100003
	mpechoat $n 你試著說服長官。
	mpechoat $n $I 說「什麼！？叫我跟奴隸商同流合汙！？」
	mpechoat $n $I 說「我想不出什麼理由可以讓我這麼做！」
	mpechoat $n 這時，你要怎麼回答他呢？
	mpechoat $n 是錢財(treasure)，還是更高的地位(class)？
	mpmod_qmark $n plains_slaver_quest v0 = 4
endif
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "treasure"
script = """
if is_qmark($n) == plains_slaver_quest 100004
	mpechoat $n 你對長官(chief)解釋了一番。
	mpechoat $n $I 說「的確，奴隸買賣利益相當的高。」
	mpechoat $n $I 說「好，你回去通知(inform)他我答應了。」
	mpmod_qmark $n plains_slaver_quest v0 = 5
endif
"""
[[mobiles.311.programs]]
trigger = "talk_prog"
argument = "class"
script = """
if is_qmark($n) == plains_slaver_quest 100004
	mpechoat $n 你對長官(chief)解釋了一番。
	mpechoat $n 說「的確，奧夫卡高等貴族普遍支持奴隸制度。」
	mpechoat $n 說「這麼做，也許可以得到他們的支持。」
	mpechoat $n $I 說「好，你回去通知(inform)他我答應了。」
	mpmod_qmark $n plains_slaver_quest v0 = 6
endif
"""
[[mobiles.311.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) == plains_slaver_quest 100003
	mpechoat $n 說「史卡拉貝不會放過你的，卑鄙的奴隸商人！」
	mpechoat $n 你成功的殺了長官(chief)，趕快回去通知(inform)商人吧！
	mpmod_qmark $n plains_slaver_quest v0 = 7
endif
"""

