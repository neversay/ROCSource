[[rooms.341.programs]]
trigger = "room_command"
argument = "search junk"
script = """
if robjcount(322) > 0
	if rand(10)
		echoat $n 你開始翻找這堆廢物....
		echoaround $n 你看到$N在翻著一旁的廢棄物。
		purge junks-plains
		callout 2 echoat $n 你找到了一雙靴子。
		callout 2 echoaround $n $N好像發現了什麼！
		callout 2 oload 325 36 $n target
		callout 2 oload 323 1 floor
		callout 2 modrvt timer = 24
	else
		echoat $n 你開始翻找這堆廢物....
		echoaround $n 你看到$N在翻著一旁的廢棄物。
		purge junks-plains
		callout 2 echoat $n 你什麼也沒發現....
		callout 2 echoaround $n $N露出一臉失望的樣子...
		callout 2 oload 323 1 floor
		callout 2 modrvt timer = 24
	endif
else
	echoat $n 這堆東西已經被翻過了。
endif
"""
[[rooms.341.programs]]
trigger = "room_time"
argument = "100"
script = """
if roomtimer($0) == 0
	if robjcount(322) == 0
		purge searched-plains
		oload 322 1 floor
	else
		break
	endif
else
	break
endif
"""
[[rooms.341.programs]]
trigger = "room_enter"
argument = "127 100"
script = """
if is_qmark($n) == scar_adv_helping 100001
	force scar-commerce hmm
	force scar-commerce tell $n 看來這裡就是人馬營地了，搜索看看有沒有冒險者們的下落。
	mod_qmark $n scar_adv_helping v0 = 2
