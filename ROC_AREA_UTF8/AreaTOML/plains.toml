[[objects.320.applies]]
type = "MANA"
value = 200
[[objects.320.applies]]
type = "POWER_POTENTIAL"
value = 2
[[objects.320.programs]]
trigger = "obj_command"
argument = "reserve default"
script = """
if is_inv_obj($n) == 320
	if is_equ_obj($n) == 320
		if objval3($o) == 200
			echoat $n 你將部分魔力儲入，$O散發出淡淡的\u001B[1;13m魔力\u001B[m之光。
			oset self extra | 64
			oset self value3 = 201
			modhmv $n 11.500 500 0
		else
			echoat $n $O內已經存有魔力了。
		endif
	else
		echoat $n 你要將$O戴在身上才能保存魔力。
	endif
else
	break
endif
"""
[[objects.320.programs]]
trigger = "obj_command"
argument = "restore default"
script = """
if is_inv_obj($n) == 320
	if is_equ_obj($n) == 320
		if objval3($o) == 201
			echoat $n 儲存在$O中的魔力，瞬間轉移到你身上。
			oset self extra r 64
			oset self value3 = 200
			modhmv $n 12.300 300 0
		else
			echoat $n $O內已經沒有魔力了。
		endif
	else
		echoat $n 你要將$O戴在身上才能提取魔力。
	endif
else
	break
endif
"""

