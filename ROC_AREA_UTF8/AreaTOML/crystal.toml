	mpechoat $n 「負責掌控水晶湖區的偉大之龍，本來主宰是讓我掌有生殺大權。」
	mpechoat $n 「但看在你年幼無知的份上，給我滾吧！」
	mpadd_qmark $n crystal_qmark -1 0 1 0 0 1 
	mpechoat $n 「不要再讓我看到你了....。」
	break
endif
"""
[[mobiles.10008.programs]]
trigger = "tick_prog"
argument = "50"
script = """
if inroom($i) == 5
	if is_qmark($i) != crystal_quest
		mpgoto 10076
		yell 我又復活了，哇哈哈哈....！
	endif
endif
"""
[[mobiles.10008.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) <= crystal_force 100002
	cackle
	yell 在這個世界上，沒有任何力量(power)是我的對手！
	yell 暗黑主宰！請讓我再一次的復活吧....！
	mpat 5 mpmload 10008
	mpat 5 mpforce 2.turtle-a mpmload 10010
	mpat 5 mpforce 2.turtle-a wear all
	mpat 5 mpadd_qmark 2.turtle-a crystal_quest 30 0 0 0 0 1
	cackle
	yell 我會再次復活的....！我會再次復活的....！
	if is_qmark($n) == crystal_force 200001
		mpmod_qmark $n crystal_force v0 = 2
	endif
	mppurge self
	break
endif
if is_qmark($n) == crystal_force 100003
       	if is_inv_obj($n) == 10018
       	or is_equ_obj($n) == 10018
        	gasp
        	say 為什麼！為什麼你會有著聖王的力量！
        	say 主宰！我不能為您效勞了....。
        	mpdel_qmark $n crystal_force
       		mpadd_qmark $n crystal_reward -1 1 0 0 0 1
       		mpmload 10016
       		rumor $n 打破邪惡的禁制，解放了銀龍！
        	mpforce silver-m tell $n 英勇的冒險者，請到我的面前來(talk dragon finish)
        	mpadd_qmark silver-m crystal_quest 20 0 0 0 0 1
		mpforce silver-m mpdef_rembch $n
       		mppurge self
       	endif
endif
"""

