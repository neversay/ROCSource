identity = "crystal"
builders = "Envy"
translator = "Zeel"
modifier = "Zeel"
vnum_start = 10001
vnum_end = 10082
security = 1
recall = 4580
f_toggle = true

[mobiles.10001]
keywords = "Goldmoon girl"
short_description = "金月(Goldmoon)"
long_description = "金月(Goldmoon)正在這裡唱著一首美麗的歌曲。\n"
description = """
金月有著天藍色的眼眸，如凝脂般的肌膚，披垂下來的髮絲有著白金般的色澤。
身上披著白色的毛織披風，在右邊的鬢角上插著一隻羽毛作為裝飾。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "TRAIN", "PRACTICE", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY"]
alignment = 1000
level = 50
mod_hitplus = 2500
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "female"
class = ["MAGE"]
spec_flags = ["NO_CHARM"]
special_function = "spec_cast_adept"
[[mobiles.10001.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.10001.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == crystal_enemy
		say 水晶湖的敵人....，受死吧！
		c blindness $n
		c powerball $n
		break
	endif
	if isnpc($n)
		break
	endif
	if rand(50)
		smile $n
	endif
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "seed"
script = """
if is_qmark($n) == ocean_annie_seed 100007
mpmod_qmark $n ocean_annie_seed v0 = 8
nod $n
say 艾佛先生剛剛已經替你聯絡過了
mpcallout 1 say 我馬上就把白楓葉子拿給你
mpcallout 2 mpoload 40043 $n viclv target
mpcallout 3 mpechoat $n 金月把白楓葉交給了$n
wave $n
endif
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 你好，歡迎來到水晶湖(crystal lake)。
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "prophecy"
script = """
if is_qmark($n) != crystal_qmark 100001
		break
	endif
	gasp
	mpechoat $n $I 上上下下的打量著你
	mpechoat $n $I 說著「原來是河風告訴你這件事的。」
	sigh
	mpechoat $n $I 說著「那我就告訴你關於神諭的真相(truth)吧。」
	mpmod_qmark $n crystal_qmark v0 = 2
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "truth"
script = """
if is_qmark($n) != crystal_qmark 100002
		break
	endif
	mpechoat $n $I 說著「這件事情得從一個星期前說起，水晶湖地區突然產生了異變。」
	mpechoat $n $I 說著「不正當的力量(force)侵入了這受到聖王保護的區域。」
	mpechoat $n $I 說著「使得長期守護這裡的銀龍(Silver Dragon)消失無蹤。」
	ponder
	mpechoat $n $I 說著「銀龍據說是被邪惡的魔法封印改變了外貌，但是沒有人知道真相。」
	mpmod_qmark $n crystal_qmark v0 = 3
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "force"
script = """
if is_qmark($n) != crystal_qmark 100003
		break
	endif
       	mpechoat $n $I 說著「這是連聖王的神力也無法阻止的力量，聖王只能依稀分辨出」
       	mpechoat $n $I 說著「這股力量似乎跟肆虐海洋另一邊的大陸的力量是同樣的來源。」
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "p Silver Dragon"
script = """
if is_qmark($n)!=crystal_qmark 100003
		break
	endif
       	nod
       	mpechoat $n $I 說著「對，他是聖王所派遣，專門保護這裡的聖龍。」
       	mpechoat $n $I 說著「自從聖龍消失之後，水晶湖區就開始出現各種怪異現象。」
       	mpechoat $n $I 說著「受到聖王力量所指引的冒險者啊，」
       	mpechoat $n $I 說著「你可願意代替我和河風來找出聖龍的下落呢(yes/no)？」
       	mpmod_qmark $n crystal_qmark v0 = 4
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) != crystal_qmark 100004
		break
	endif
       	bow $n
       	mpechoat $n $I 說著「真的太感謝你了，」
       	mpechoat $n $I 說著「也許你可以去找托德(Toede)問看看，」
       	mpechoat $n $I 說著「雖然我感覺他身上有著相同的邪氣。」
       	wave
        mpmod_qmark $n crystal_qmark v0 = 5
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "power"
script = """
if is_qmark($n) != crystal_force 100002
		break
	endif
       	mpechoat $n $I 說著「真是對不起，我忘了把另一部份的神諭告訴你了。」
       	mpechoat $n $I 說著「害你傷得這麼重，真是不好意思。」
       	cast 'full heal' $n
       	mpechoat $n $I 說著「聖王的神諭中有提到，如果使用一般的武器攻擊惡龍，」
       	mpechoat $n $I 說著「是無法破解邪惡力量的禁制的，一定要使用神聖武具(Holy Weapon)才行。」
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "p holy weapon"
script = """
if is_qmark($n) != crystal_force 100002
		break
	endif
        nod $n
        mpechoat $n $I 說著「這把就是聖王所賜下的神聖武具 - 尊者冠冕(Sword Avatar)」
        mpdis_magic self blindness
        mpoload 10018 20
        give avatar $n
        mpechoat $n $I 說著「希望你能用這把劍除去惡龍。」
        mpmod_qmark $n crystal_force v0 = 3
	drop avatar
        if insameroom(riverwind)
	       	mpforce riverwind say 請加油
	       	mpforce riverwind bow $n
	endif
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "p crystal lake"
script = """
say 這裡是 ROC 新開放的區域，如果有任何問題，請告知 Zeel 或是 Pluto。
	smile $n
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "zeel"
script = """
mpecho 你看到 $I 露出了疑惑的表情
	say 就是翻譯這裡的 imm 啊。
"""
[[mobiles.10001.programs]]
trigger = "talk_prog"
argument = "pluto"
script = """
say Pluto 我倒是不認識。
"""
[[mobiles.10001.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic blindness
mpat 5 c inf
if is_qmark($n) != crystal_enemy
	mpadd_qmark $n crystal_enemy 50 0 0 0 1 0
else
	mpmod_qmark $n crystal_enemy timer + 50
endif
"""

