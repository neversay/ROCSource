argument = "topic"
script = """
if is_qmark($n) != crystal_qmark 100005
		say &@*&*#&^&^DPU@！沒事不要來煩我！
		break
	endif
        mpechoat $n $I 上上下下的打量著你
       	mpechoat $n $I 說著「你渾身上下充滿了神的氣息，我最討厭這種人了！」
       	think
       	mpechoat $n $I 說著「但是看在你那麼誠懇的份上....，」
       	mpechoat $n $I 說著「給我個五萬塊花花，我就告訴你線索。」
"""
[[mobiles.10002.programs]]
trigger = "bribe_prog"
argument = "50000"
script = """
mpjunk all.coins
	if is_qmark($n) != crystal_qmark 100005
		smirk $n
		mpechoat $n $I 說著「沒事給我錢啊？那就大恩不言謝了。」
		break
	endif
	mpechoat $n $I 說著「我確實收到了這筆錢了，但是我不能告訴你太多....。」
	mpechoat $n $I 說著「你可以去湖底找找，這是唯一能跟你講的線索。」
	mpechoat $n .
        mpechoat $n 你心裡暗暗咒罵著「這傢伙要是膽敢暗槓我的錢，保證讓他死無葬身之地！」
	mpechoat $n .
       	mpdel_qmark $n crystal_qmark
       	mpadd_qmark $n crystal_force -1 1 0 0 0 1 
       	mpechoat $n 你百般無奈的離開這裡，心裡想著「只好先去看看再說。」
"""

