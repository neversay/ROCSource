[mobiles.5200]
keywords = "beholder"
short_description = "眼魔(The mighty beholder)"
long_description = "你碰上一顆漂浮在半空中的眼魔(beholder)！\n"
description = """
他是一顆漂浮在半空中的大球，中央有一粒大眼睛，從周圍伸出的觸手頂端也長
了眼睛。這些眼睛都具有強烈的魔力，當他們注視你時，你已經逃不掉了！
"""
act_flags = ["NPC", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "FLYING", "SEALMAGIC"]
alignment = -870
level = 38
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = -200
mod_svs = -20
dodge = 0
mod_pp = 0
gold = -1
sex = "neutral"
race = "Beholder"
class = ["MAGE"]
special_function = "spec_cast_mage"
[[mobiles.5200.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.5200.programs]]
trigger = "greet_prog"
argument = "99"
script = """
if isnpc($n)
or level($n) != 36
	break
endif
if rand(50)
	c charm $n
else
	c sleep $n
endif
"""
[[mobiles.5200.programs]]
trigger = "fight_prog"
argument = "25"
script = """
cast sun
"""
[[mobiles.5200.programs]]
trigger = "fight_prog"
argument = "25"
script = """
if pcnum($) == 0
	cast whirlwind
	break
endif
if rand(30)
	cast 'wind screaming' $r
else
	cast curse $r
endif
"""

