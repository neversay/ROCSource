[[rooms.5250.programs]]
trigger = "room_command"
argument = "pray summon"
script = """
if isnpc($n)
	break
endif
if is_qmark($n) != thalos_darkforce_quest
        echoat $n 你要幹嘛？
        break
endif
if is_qmark($n) > thalos_darkforce_quest 200005
or is_qmark($n) !& thalos_darkforce_quest 100015
or is_qmark($n) != thalos_darkforce_check
	echoat $n 什麼事都沒發生...
	break
endif
if is_qmark($n) == thalos_darkforce_timer
	echoat $n 什麼事都沒發生...
	break
endif
if is_qmark($n) == thalos_darkforce_quest
	mod_qmark $n thalos_darkforce_quest v1 + 1
	add_qmark $n thalos_darkforce_timer 200 0 0 0 0 1
endif
echo \u001B[0;37m...四周亮起了神秘的符號...\u001B[m
callout 3 echo \u001B[0;37m光芒越來越熾烈了\u001B[m
callout 6 echo \u001B[1;37m...四周逐漸被光芒覆蓋了...\u001B[m
callout 9 echo \u001B[1;37m...你覺得意識越來越模糊...\u001B[m
callout 12 echoat $n 你覺得周圍的景物產生了變化...
callout 12 echoaround $n $N 周圍產生了一陣光芒...
callout 15 transfer pc 5281
"""
[[rooms.5250.programs]]
trigger = "room_command"
argument = "pray default"
script = """
echoat $n 你覺得周圍的空間動了一下，但是什麼都沒發生。
echoat $n 一陣聲音在你心底響起：
echoat $n \u001B[1;37m『你想去哪邊呢？』\u001B[m
echoaround $n $N 周圍產生了一陣波動...
"""
