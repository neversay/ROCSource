[[mobiles.11.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if is_qmark($i) != sum_life_time
	if being($b)
		mpat $b mpmod_qmark $b max_water_lv2 v0 - 1
		mpat $b mpmod_qmark $b max_water_mobs v0 - 1
		if is_qmark($i) & sum_count 100001
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 1
		endif
		if is_qmark($i) & sum_count 100002
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 2
		endif
		if is_qmark($i) & sum_count 100004
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 4
		endif
	endif
	mpecho 契約的效力到期了，$I蒸散在四周.
	remove all
	drop all
	mppurge self
endif
if sector($) == 10
	if being($b)
		mpat $b mpmod_qmark $b max_water_lv2 v0 - 1
		mpat $b mpmod_qmark $b max_water_mobs v0 - 1
		if is_qmark($i) & sum_count 100001
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 1
		endif
		if is_qmark($i) & sum_count 100002
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 2
		endif
		if is_qmark($i) & sum_count 100004
			mpat $b mpmod_qmark $b max_water_lv2 v2 r 4
		endif
	endif
	mpecho $I純淨的身軀緩緩消逝在周圍的沙漠中...
	mppurge self
endif
if being($b)
	if is_qmark($b) != max_water_mobs
		mpecho 失去了血之契約的牽絆，$I回到它該去的地方了.
		remove all
		drop all
		mppurge self
	endif
	if insameroom($b)
	else
		if is_qmark($i) & summon_mob_states 100002
			mpecho 依照契約的約定，$I又回$B的身邊了.
			mpteleport $b
			mpecho 依照契約的約定，$I又回$B的身邊了.
