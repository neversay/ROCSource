keywords = "coffee bucket"
description = """
這個水桶裡所裝的冰咖啡可以幫助你提神，且也可以止渴。比較神奇的一點是，怎麼
一個小小的桶子，卻可以供應那麼多位區域作者飲用呢？你若覺得無聊的話，可以試
著能不能把桶子裡的冰咖啡喝完看看，當然還是不建議你嚐試就是了，因為早在你之
前就有人試過了，事實証明是桶子裡的冰咖啡是無限供應的。而且你若一試，吵到其
它區域作者的話，那就皮繃緊一點吧！
"""

