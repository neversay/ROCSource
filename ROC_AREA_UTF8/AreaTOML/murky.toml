[[rooms.10701.extra_descriptions]]
keywords = "small plaque"
description = """
這個區域的原作者是由創立 Merc/Envy Mud 的 Hatchet 於 8/20/1995 時寫出來的。
寫的時候使用了 Slash 的程式，這個程式可以讓撰寫區域更加快速。

在這個區域之中用了許多原始 Merc/Envy Mud 大神的名字。但是若你要將這個區域移
