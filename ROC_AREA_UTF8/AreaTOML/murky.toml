[mobiles.10700]
keywords = "stony guard"
short_description = "堅石守衛(stony guard)"
long_description = "看起來十分無聊的守衛(guard)坐在小亭子中靜靜地看著你。\n"
description = """
這個守衛看起來兩眼無神，似乎對什麼事情都不關心。當然，如果是上級的命令(order)
他應該會稍微振作一些精神。
"""
act_flags = ["NPC", "SENTINEL", "SCAVENGER", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
alignment = -100
level = 40
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 30
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "SWORD"]
spec_flags = ["NO_CHARM"]
special_function = "spec_cast_judge"
[[mobiles.10700.programs]]
trigger = "talk_prog"
argument = "p north town"
script = """
ponder
mpcallout 1 say 北區小鎮是羅胡城堡北邊的一個區....，
mpcallout 2 say 由於最近一股邪惡的勢力不斷的由這個地方湧出....，
mpcallout 3 say 因此在這股邪惡勢力來源沒有消滅之前....，
mpcallout 4 say 羅胡城堡的北邊地區必須要限制通行....，
mpcallout 5 say 冒險者除非有堡主的手諭(order)....，
mpcallout 6 say 否則我不會讓任何冒險者通過的。
"""
[[mobiles.10700.programs]]
trigger = "give_prog"
argument = "8284"
script = """
mpjunk all.order
mpecho $I 仔細閱讀了 羅胡堡主 的手諭....，
mpcallout 1 say 這的確是堡主的手諭....，
mpcallout 2 say 因此你可以進去了....，
mpcallout 2 mpoload 10700
mpcallout 3 unlock n
mpcallout 4 open n
mpcallout 4 mpjunk all.key
mpcallout 5 say 你請過去吧！
"""
[[mobiles.10700.programs]]
trigger = "fight_prog"
argument = "50"
script = """
wear all
disarm
mpnowait
kick
mpnowait
if rand(50)
	mpat 5 c 2 'double heal'
	mpnowait
endif
if rand(50)
	yell 看我的連續攻擊技巧....！
	skilldrv heavyhit $n
	skilldrv heavyhit $n
	skilldrv heavyhit $n
	skilldrv heavyhit $n
	skilldrv heavyhit $n
	skilldrv heavyhit $n
endif
"""
[[mobiles.10700.programs]]
trigger = "talk_prog"
argument = "order"
script = """
say 想要進入北區小鎮(north town)嗎....？
mpcallout 1 say 沒有羅胡城堡堡主的手諭....，
mpcallout 2 say 我是不會親自放你過去的。
"""

[mobiles.10701]
keywords = "greeter bouncer person"
short_description = "巨漢(bouncer)"
long_description = "一個身軀巨大、笨重的七呎巨漢(bouncer)在這邊閒晃。\n"
description = """
他十分不喜歡他現在的工作，雖然當他看到你的時候，勉強想要擠出一點微笑。
但是由他那僵硬的笑容看來，他的生活過的相當清苦。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "REGENERACY"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
alignment = -300
level = 50
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = -200
mod_svs = 0
dodge = 100
mod_pp = 0
gold = 0
sex = "male"
race = "Human"
class = ["WARRIOR"]
spec_flags = ["NO_CHARM"]
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "p mist island"
script = """
gasp $n
mpcallout 1 say 迷霧之島被喻為「魔性之島」....。
mpcallout 2 say 其實在史卡拉貝的居民移民過去之前....，
mpcallout 3 say 島上就有許多奇奇怪怪的生物....，
mpcallout 4 say 有些甚至是在史卡拉貝大陸完全沒有見過的品種。
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "parents"
script = """
mpecho 話說到這邊， $I 忽然訕訕的流下淚來....。
mpcallout 1 sigh
mpcallout 2 say 為了保護整個羅胡城堡的安全....，
mpcallout 3 say 我將家中老父老母安頓在 奧夫卡(ofcol)鎮 後就過來了....，
mpcallout 4 say 也不知道他們的現況(current)如何？
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "current"
script = """
if is_qmark($n) & murky_quest 100001
	tell $n 抱歉，你已經完成本項任務了。
	break
endif
mpecho $I 對你露出相當驚訝的表情....
mpcallout 1 say 如果真的可以的話....，
mpcallout 2 say 不知道您是否能夠帶我捎個訊息給他們(yes/no)....，
mpcallout 3 say 我至少要讓他們知道我現在是非常平安的。
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) & murky_quest 100001
or is_qmark($n) == murky_bouncer_quest
	break
endif
shrug
mpcallout 1 say 那麼我只好另請人幫我了。
mpcallout 2 sigh
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) & murky_quest 100001
	tell $n 抱歉，你已經完成本項任務了。
	break
endif
if is_qmark($n) == murky_bouncer_quest
	tell $n 你曾經接過本項任務，並且尚未完成。
	mpcallout 1 tell $n 如果想要重新開始的話，請直接跟我說 <talk bouncer restart>。
	break
endif
if is_qmark($n) != murky_quest
	mpadd_qmark $n murky_quest -1 0 0 0 0 1
endif
mpadd_qmark $n murky_bouncer_quest -1 0 0 0 0 1
thank $n
mpcallout 1 say 我立即寫封家信....，
mpcallout 2 say 讓你帶去給我的雙親，請稍等一下....，
mpcallout 3 mpecho $I 由懷中抽出紙筆，開始寫起家書....
mpcallout 5 mpecho $I 書寫這封家書時，表情顯得十分的認真....
mpcallout 8 nod
mpcallout 9 say 好了，完成了！
mpcallout 10 mpecho $I 將他寫好的家信交給了你....
mpcallout 10 mpoload 10795 $n viclv target
mpcallout 11 say 拜託你了！
mpcallout 12 wave $n
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "ofcol"
script = """
say 奧夫卡啊....，
mpcallout 1 ponder
mpcallout 2 say 在史卡拉貝城北邊的北方平原....，
mpcallout 3 say 在奧夫卡山脈的東邊....，
mpcallout 4 say 是個相當繁榮的城市。
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "passage"
script = """
shrug
mpcallout 1 say 不知道是誰有那麼大的能耐打開這個通道....，
mpcallout 2 say 不過我曾經聽堡主說過....，
mpcallout 3 say 那個打開通道的人並不是史卡拉貝大陸的居民....，
mpcallout 4 say 而是遠從迷霧之島(mist island)過來的魔法師。
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) & murky_quest 100001
	say 你已經完成了本項任務，無法重新開始。
	break
endif
if is_qmark($n) <= murky_bouncer_quest 100005
	mpdel_qmark $n murky_bouncer_quest
	mpechoat $n 遠方傳來一陣聲響「這項任務已經可以重解了！」
endif
"""
[[mobiles.10701.programs]]
trigger = "give_prog"
argument = "673"
script = """
mpjunk all.sweater
if is_qmark($n) == murky_bouncer_quest 100005
	mpdel_qmark $n murky_bouncer_quest
	mpmod_qmark $n murky_quest v0 | 1
	mpecho $I 開始熱淚盈眶....，
	mpcallout 1 say 我這個不孝子....，
	mpcallout 2 say 我真對不起我的母親....，
	mpcallout 3 mpecho $I 傷心了一會兒，接著轉頭面向你....
	mpcallout 4 say 謝謝你如此辛勞的來回奔波....，
	mpcallout 5 say 我一定要好好的謝謝您的幫助....，
	mpcallout 6 mpgold $n 20000
	mpcallout 6 mpexp $n 4000
	mpcallout 6 mpresp $n 2
	mpcallout 7 say 我一定要好好堅守我的崗位....，
	mpcallout 8 say 大家一起努力吧！
	mpcallout 9 wave $n
endif
"""
[[mobiles.10701.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == murky_bouncer_quest 100002
	mpdel_qmark $n murky_bouncer_quest
	mpmod_qmark $n murky_quest v0 | 1
	mpecho $I 聽了你帶來的口訊，不禁熱淚盈眶....。
	mpcallout 1 mpecho $I 趕緊擦乾了眼淚，轉身面對著你....，
	mpcallout 2 say 謝謝你捎來那麼重要的口訊給我....，
	mpcallout 3 mpexp $n 2000
	mpcallout 3 mpresp $n 2
	mpcallout 4 say 我會繼續鎮守此處....，
	mpcallout 5 say 直到有朝一日 幽冥巨獸 被消滅為止....。
	mpcallout 6 wave $n
	break
endif
sigh
mpcallout 1 say 自從幽冥深淵與人間的通道(passage)被打開之後....，
mpcallout 2 say 我就奉堡主之命來鎮守此處....，
mpcallout 3 say 避免有閒雜人等隨意進入北區小鎮之中....，
mpcallout 4 say 家中的老父老母(parents)是否還安好呢？
"""
[[mobiles.10701.programs]]
trigger = "fight_prog"
argument = "40"
script = """
if rand(30)
	invoke
endif
frenzy
"""

