description = """
任務第三天 - 

在這個叫做幽冥深淵的地方，簡直是不可思議般的墮落世界。跟幽冥深淵裡頭的生物比
起來，羅胡城堡北區小鎮中的盜匪與殺人犯反倒覺得像是善良的精靈。在通往幽冥深淵
深處的大門前，這三天來我至少看到 8 名身著重甲的冒險者進入，卻從未看到他們回
來過。想要進入幽冥深淵深處，必須先取得骷髏鑰匙。


任務第四天 - 

在幽冥深淵探險的日子裡，我已經瀕臨精神崩潰的狀態，我儘量保持我的神智清醒以能
夠迅速跟上隊伍。在這地方所有看的見的影子，似乎都在四處飄移，但是四周卻沒有任
何能夠造成陰影的光源。目前為止，我已經看到至少 5 個被凌虐過的屍體。
"""

