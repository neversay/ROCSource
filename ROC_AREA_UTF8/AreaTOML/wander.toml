[mobiles.59101]
keywords = "Roddlevan-wander Roddlevan"
short_description = "羅德爾邦(Roddlevan)"
long_description = "年輕的學者羅德爾邦(Roddlevan)在這裡看書。\n"
description = """
這是一位從奈圖王國來的年輕學者，你看他文質彬彬、衣冠得體，一眼就覺得
他是個好青年；在他的年輕臉龐下，卻好想隱隱流露出一股無奈的神情，不過
比較值得你注意的是，他們這一群人吃飽沒事幹在這裡做什麼？
"""
act_flags = ["NPC", "STAY_AREA", "WIMPY", "TACTICS"]
affected_flags = ["PROTECT"]
alignment = 0
level = 42
mod_hitplus = 4000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = -500
mod_svs = -50
dodge = -500
mod_pp = 0
gold = 0
sex = "male"
race = "Human"
class = []
spec_flags = ["NO_CHARM"]
[[mobiles.59101.applies]]
type = "REDUCE_DAMAGE"
degree = 100000
[[mobiles.59101.applies]]
type = "REDUCE_MAGIC"
degree = 100000
[[mobiles.59101.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if isfight($i)
else
	if hour($) == 8
		wake
		open e
	endif
	if hour($) == 22
		mpgoto 59129
		close e
		sleep
	endif
endif
"""
[[mobiles.59101.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self enable_sleep_tick -1 0 0 0 0 1
mpadd_qmark self enable_rest_tick -1 0 0 0 0 1
mpat 5 mpoload 59100
mpat 5 mpoload 59101
mpat 5 mpoload 59102
mpat 5 mpoload 59103
mpat 5 wear all
mpgoto 59129
"""
[[mobiles.59101.programs]]
trigger = "rand_prog"
argument = "20"
script = """
if pcnum($) == 0
	break
endif
if is_qmark($i) == wander_talk
	break
endif
if rand(25)
	mpecho $I抓了抓頭髮....
	break
endif
if rand(33)
	say 嗯....嗯....
	mpecho $I抬起頭望向天空....
	break
endif
if rand(50)
	mpecho $I把手上的書翻了一頁。
endif
"""
[[mobiles.59101.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == wander_enemy
	break
endif
if is_qmark($i) == wander_talk
	break
endif
say 你好，請問你有什麼事嗎？
mpechoat $n  - ‧想請教關於你(you)的事情。
mpechoat $n  - ‧想請教關於這裡(here)的事情。
mpechoat $n  - ‧想跟你聊聊天(gossip)。
"""
[[mobiles.59101.programs]]
trigger = "talk_prog"
argument = "you"
script = """
if is_qmark($n) == wander_enemy
	break
endif
if is_qmark($i) == wander_talk
	break
endif
mpadd_qmark self wander_talk 5 0 0 0 0 1
mpforce $n say 想請教關於你(you)的事情。
mpcallout 1 say 我嗎？
mpcallout 2 say 真沒想到我這個年輕小毛頭也會有人來問我身份。
mpcallout 3 say 我的名字叫羅德爾邦，
mpcallout 4 say 如你所見，我們是從奈圖王國來到這裡的考察團，
mpcallout 5 say 目的就是收集幻惑迷林(Wander Jungle)這塊新發現地區的一些資料，
mpcallout 6 say 包括動物、植物、礦物....等。
mpcallout 6 mpdel_qmark self wander_talk
"""
[[mobiles.59101.programs]]
trigger = "talk_prog"
argument = "here"
script = """
if is_qmark($n) == wander_enemy
	break
endif
if is_qmark($i) == wander_talk
	break
endif
mpadd_qmark self wander_talk 5 0 0 0 0 1
mpforce $n say 想請教關於這裡(here)的事情。
mpcallout 1 say 這裡是我們奈圖考察團的營地，
mpcallout 2 say 往前面走過吊橋就到幻惑迷林(Wander Jungle)了。
mpcallout 3 say 不過裡面的生物異常的兇猛，
mpcallout 4 say 害我們只能在大地的裂縫對岸乾瞪眼。
mpcallout 5 say 你們要過去的話，千萬要小心啊....
mpcallout 5 mpdel_qmark self wander_talk
"""
[[mobiles.59101.programs]]
trigger = "talk_prog"
argument = "gossip"
script = """
if is_qmark($n) == wander_enemy
	break
endif
if is_qmark($i) == wander_talk
	break
endif
if is_qmark($n) & wander_quest 100001
	if rand(20)
		mpadd_qmark self wander_talk 5 0 0 0 0 1
		mpforce $n say 想跟你聊聊天(gossip)。
		mpcallout 1 look $n
		mpcallout 2 say 聽說你好像在幫教授們收集研究用的材料？真是謝謝你了....
		mpcallout 3 say 我們常常在為研究材料的不足而感到煩惱呢。
		mpcallout 4 bow $n
		mpcallout 4 mpdel_qmark self wander_talk
	endif
endif
if is_qmark($n) == mirage_book
	if rand(20)
		mpadd_qmark self wander_talk 5 0 0 0 0 1
		mpforce $n say 想跟你聊聊天(gossip)。
		mpcallout 1 look $n
		mpcallout 2 say 看你的樣子，你是在找書對吧？
		mpcallout 3 say 我們帳棚裡是有不少的書....
		mpcallout 4 say 不過對你來說可能太深奧了....
		mpcallout 5 pat $n
		mpcallout 5 mpdel_qmark self wander_talk
	endif
endif
if is_qmark($n) == mirage_potion
	if rand(20)
		mpadd_qmark self wander_talk 5 0 0 0 0 1
		mpforce $n say 想跟你聊聊天(gossip)。
		mpcallout 1 say 嗯.....你身上滿滿都是藥水的味道....
		mpcallout 2 say 或許你對藥水藥材有一定的認識吧？
		mpcallout 3 say 有空去跟植物學家瑪法談談吧....
		mpcallout 4 say 她研究那方面一段時間了。
		mpcallout 4 mpdel_qmark self wander_talk
	endif
endif
if is_qmark($n) == mirage_beetle
    if rand(20)
		mpadd_qmark self wander_talk 5 0 0 0 0 1
		mpforce $n say 想跟你聊聊天(gossip)。
        mpcallout 1 look $n
        mpcallout 2 say 你身上居然帶著補蟲網和補蟲盒？
        mpcallout 3 say 你不會要去幻惑迷林抓昆蟲吧？
        mpcallout 4 roll
        mpcallout 4 mpdel_qmark self wander_talk
    endif
endif
if rand(33)
	mpadd_qmark self wander_talk 5 0 0 0 0 1
	mpforce $n say 想跟你聊聊天(gossip)。
	mpcallout 1 say 說實在，住在這邊沒有想像中的危險。
	mpcallout 2 say 隔了一個大地的裂縫，又只有一座破吊橋，
	mpcallout 3 say 兇猛的怪物很少過來的....
	mpcallout 4 say 雖然說對岸也有猛禽類，
	mpcallout 5 say 但是也沒看到他們飛來過。
	mpcallout 5 mpdel_qmark self wander_talk
	break
endif
if rand(50)
	mpadd_qmark self wander_talk 5 0 0 0 0 1
	mpforce $n say 想跟你聊聊天(gossip)。
	mpcallout 1 say 我們在這邊都是自給自足，
	mpcallout 2 say 每隔一段時間就要回去奈圖城堡補充糧食，
	mpcallout 3 say 還好在大地的裂縫這邊的生物比較溫馴，
	mpcallout 4 say 不然我可能早就去投胎了，
	mpcallout 5 say 像你們這些冒險者那麼強壯真好。
	mpcallout 6 gig
	mpcallout 6 mpdel_qmark self wander_talk
else
	mpadd_qmark self wander_talk 5 0 0 0 0 1
	mpforce $n say 想跟你聊聊天(gossip)。
	mpcallout 1 say 其實在這邊的生活挺不賴的，
	mpcallout 2 say 雖然說沒有豪華的生活，
	mpcallout 3 say 只能住在野外、吃吃乾糧，
	mpcallout 4 say 不過至少做的是自己喜歡的事，
	mpcallout 5 say 人生快樂就好不是嗎？
	mpcallout 6 smile $n
	mpcallout 6 mpdel_qmark self wander_talk
endif
"""
[[mobiles.59101.programs]]
trigger = "fight_prog"
argument = "50"
script = """
say 你怎麼打人啊....
yell 救命喔！
mpadd_all_qmark $n wander_enemy -1 0 0 0 0 1
flee
mpnowait
flee
mpnowait
flee
mpnowait
"""
[[mobiles.59101.programs]]
trigger = "death_prog"
argument = "100"
script = """
yell 殺人啦！
mpdis_magic self blindness
mpat 5 cast 'detect hidden'
mpat 5 cast 'detect inv'
mpat 5 cast inf
mpadd_all_qmark $n wander_enemy -1 0 0 0 0 1
"""

