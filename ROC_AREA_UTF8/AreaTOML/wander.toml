        if int($n) >= 20
                oset self value1 = 75
                oset self value2 = 80
                break
        endif
        if int($n) >= 17
                oset self value1 = 70
                oset self value2 = 75
                break
        endif
        if int($n) >= 14
                oset self value1 = 65
                oset self value2 = 70
                break
        else
                oset self value1 = 60
                oset self value2 = 65
        endif
        endif
endif
"""

