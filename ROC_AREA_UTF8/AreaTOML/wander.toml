description = """
身為火星人的你是不是對這裡非常熟悉呢？
"""
flags = ["DARK", "INDOORS", "NO_RECALL", "SUMMON_BIT", "NO_TELEPORT_OUT", "NO_TELEPORT_IN"]
sector = "FOREST"
[[rooms.59100.extra_descriptions]]
keywords = "更新履歷update"
description = """
2022/10/27
  1. 修正大量 endif 缺失、誤置等可能造成 crash 的 bug。
  2. 修正部分不作用的 function 判定。
2022/10/30
  1. 試重新開放黃金盔甲(Goldarmor)外的其他特殊 boss，boss 由 coconet-wander 的 defun_prog wander_boss 作調控。
  2. 將所有 mob 加入 enable_rest_tick 及 enable_sleep_tick 以 tick_prog 取代 A 的 mob 行為。
  3. 所有的 mpcall 加入目標物。
2022/11/20
  1. being($b) 在看不見 $b 的情況下依然會成立，部分 function 似乎會產生 crash，
     因此在 being($b) 下加入 can_see($b) 的判定，確保能確實抓到目標。
  2. 對 room prg 中部分 room transfer 沒加入位置導致不判定的問題，修改 room transfer 的 code。
     將 room transfer 修改為抓全 mud 的目標，並且增加位置 here 作為將目標抓入該房間的指令。
"""
[[rooms.59100.programs]]
trigger = "room_rand"
argument = "20"
script = """
if rnplayer($) >= 1
	if mobcount(59155) <= 10
		mload 59155
	endif
	if roomtimer($0) > 180
		break
	endif
	if is_qmark(coconet-wander) != wander_boss 100000
		break
	endif
	force coconet-wander mpcall wander_boss coconet-wander
endif
"""
[[rooms.59100.resets.mobiles]]
vnum = 59100
limit = 1

