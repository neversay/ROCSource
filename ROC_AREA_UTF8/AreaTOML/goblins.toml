[[mobiles.20000.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
	break
endif
if level($n) < 15
	tell $n 等級太低的玩家最好不要接近此處。
else
	tell $n 不要在此逗留，再不聽就殺了你！
endif
"""
