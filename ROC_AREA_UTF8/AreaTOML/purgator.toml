degree = 100
[[mobiles.401.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if isfight($i)
	break
else
	if hitprcnt($i) < 70
		say 命運的巨輪開始轉動....。
		say 因業的漁網籠罩一切....。
		mpecho 一陣奇怪的閃光，籠罩在 $I 的身上....。
		mpat 5 c 'full heal'
	endif
endif
"""
[[mobiles.401.programs]]
trigger = "talk_prog"
argument = "return"
script = """
if ispc($n)
	if is_qmark($n) == purgator_dead
		tell $n 踏上輪迴的時間未到，你必須再等一會兒。
	else
		tell $n 輪迴的號角已經響起，你可以回到人間了。
		mpechoat $n $I 已經將你傳送回光明之鎮的聖殿了....。
		mpecho $I 將 $n 傳送走了....。
		mptransfer $n 4580
		wave $n
	endif
endif
"""
[[mobiles.401.programs]]
trigger = "talk_prog"
argument = "grave"
script = """
if ispc($n)
	c grave $n
        mpnowait
        c 'detect invis' $n 
	if is_qmark($n) != purgator_dead
		mpadd_qmark $n purgator_dead 5 0 0 0 0 1
	else
		mpmod_qmark $n purgator_dead timer + 1
	endif
	tell $n 想回(return)到人間嗎？
	mpnowait
endif
"""
[[mobiles.401.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if ispc($n)
	tell $n 通過了煉獄之道，進入了審判之間，你應該獲得你應得的獎賞。
	tell $n 有需要的話，儘管告訴我吧(talk reaper grave)。
endif
"""
[[mobiles.401.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.401.programs]]
trigger = "fight_prog"
argument = "30"
script = """
if class($n) == 10
	c 'star fire' $n
	mpnowait
	c para
	mpnowait
	mpat 5 c 3 double
	mpnowait
endif
c 'energy drain' $n
mpnowait
c curse $n
mpnowait
c poison $n
mpnowait
mpat 5 c 2 double
mpnowait
"""
[[mobiles.401.programs]]
trigger = "rand_prog"
argument = "40"
script = """
if hitprcnt($i) <= 10
	if is_qmark($i) != purgator_dead_fullheal
		mpadd_qmark $i purgator_dead_fullheal 100 0 0 0 1 0
	else
		if is_qmark($i) <= purgator_dead_fullheal 100002
			c 'full heal'
			mpmod_qmark $i purgator_dead_fullheal v0 + 1
		endif
	endif
	break
endif
if hitprcnt($i) <= 30
	mpat 5 c 'double heal'
endif
"""
[[mobiles.401.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if class($n) == 10
	c 'star fire' $n
	mpnowait
	c para
	mpnowait
	mpat 5 c 3 double
	mpnowait
	break
endif
if class($n) == 14
        c 3 fireball $n
        mpnowait
endif
skilldrv heavyhit $n
skilldrv heavyhit $n
skilldrv heavyhit $n
skilldrv heavyhit $n
skilldrv heavyhit $n
skilldrv heavyhit $n
skilldrv speedhit $n
skilldrv speedhit $n
skilldrv speedhit $n
skilldrv speedhit $n
skilldrv speedhit $n
skilldrv speedhit $n
if hitprcnt($i) <= 10
	if is_qmark($i) != purgator_dead_fullheal
		mpadd_qmark $i purgator_dead_fullheal 100 0 0 0 1 0
	else
		if is_qmark($i) <= purgator_dead_fullheal 100002
			c 'full heal'
			mpmod_qmark $i purgator_dead_fullheal v0 + 1
		endif
	endif
endif
"""
[[mobiles.401.programs]]
trigger = "fight_prog"
argument = "60"
script = """
if hitprcnt($i) < 20
	c 'double heal'
	mpnowait
	c heal
	mpnowait
	mpat 5 invoke
endif
if hitprcnt($i) < 50
	if rand(30)
		c 'double heal'
		mpnowait
		c flamestrike
	else
		c 'double heal'
		mpnowait
		c fireball
	endif
	mpnowait
endif
if hitprcnt($i) < 80
	if rand(30)
		c 'double heal'
	else
		c heal
	endif
	mpnowait
endif
"""
[[mobiles.401.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
mplog killed by $n
if rand(99)
        mpjunk all
endif
"""
[[mobiles.401.programs]]
trigger = "hurt_prog"
argument = "60"
script = """
if is_qmark($i) != reaper_magic_missile
    mpadd_qmark $i reaper_magic_missile -1 1 0 0 0 1
    mpat 5 c full
    mpnowait
    else
        if is_qmark($i) < reaper_magic_missile 100003
            mpmod_qmark $i reaper_magic_missile v0 + 1
            mpat 5 c 2 double
            mpnowait
        else
            mpdel_qmark $i reaper_magic_missile
                sigh $n
                say 別以為這招會有用！
                mpat 5 c 2 'double heal'
                mpnowait
                c 3 whirl 
                mpnowait
                c 3 'magic missile' $n
                mpnowait
        endif
endif
"""
[[mobiles.401.programs]]
trigger = "hurt_prog"
argument = "58"
script = """
if is_qmark($i) != reaper_lightning
    mpadd_qmark $i reaper_lightning -1 1 0 0 0 1
    mpat 5 c full
    mpnowait
    else
        if is_qmark($i) < reaper_lightning 100003
            mpmod_qmark $i reaper_lightning v0 + 1
            mpat 5 c 3 double
            mpnowait
        else
            mpdel_qmark $i reaper_lightning
                sigh $n
                say 別以為這招會有用！
                mpat 5 c full
                mpnowait
                c 3 whirl 
                mpnowait
                c 3 lightning $n
                mpnowait
        endif
endif
"""
[[mobiles.401.programs]]
trigger = "hurt_prog"
argument = "137"
script = """
if is_qmark($i) != reaper_frenzy
    mpadd_qmark $i reaper_frenzy -1 1 0 0 0 1
    mpat 5 c full
    mpnowait
    else
        if is_qmark($i) < reaper_frenzy 100003
            mpmod_qmark $i reaper_frenzy v0 + 1
            mpat 5 c 3 double
            mpnowait
        else
            mpdel_qmark $i reaper_frenzy
                sigh $n
                say 別以為這招會有用！
                mpat 5 c full
                mpnowait
                frenzy $n
                mpnowait
        endif
endif
"""
[[mobiles.401.programs]]
trigger = "hurt_prog"
argument = "101"
script = """
if is_qmark($i) != reaper_circle
     mpadd_qmark $i reaper_circle -1 1 0 0 0 1
     mpnowait
     mpat 5 c heal
     mpnowait
     else
        if is_qmark($i) < reaper_circle 100003
            mpmod_qmark $i reaper_circle v0 + 1
            mpat 5 c 2 double
            mpnowait
        else
                mpdel_qmark $i reaper_circle
                sigh $n
                say 別以為這招會有用！
                mpat 5 c 2 'double heal'
                mpnowait
                c 3 whirl 
                mpnowait
                c 'magic missile' $n
                mpnowait
        endif     
endif
"""

