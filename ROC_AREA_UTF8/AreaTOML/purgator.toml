[mobiles.401]
keywords = "dead reaper"
short_description = "死神(Reaper of the Dead)"
long_description = "死神(Reaper of the Dead)在此等著決定你的命運。\n"
description = """
他看起來似乎並不介意在這裡陪你過一輩子。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "PRACTICE", "CRITICAL", "HARD_DIS", "HUNT", "TWO_WEAPON", "TACTICS", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT", "POLYMORPH", "FLYING", "PASS_DOOR", "MYSTIC_ARMOR"]
alignment = -1000
level = 70
mod_hitplus = 20000
mod_mana = 0
mod_hitroll = 50
mod_damroll = 30
mod_ac = 1000
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "neutral"
race = "God"
class = ["WARRIOR", "MAGE", "SWORD"]
spec_flags = ["NO_DM", "REF_MAGIC", "ALY_SAN", "EXPERT", "MOBAI_LV2"]
[[mobiles.401.applies]]
type = "POWER_POTENTIAL"
degree = 50
[[mobiles.401.applies]]
type = "REDUCE_DAMAGE"
degree = 100
[[mobiles.401.applies]]
type = "REDUCE_MAGIC"
degree = 100
[[mobiles.401.applies]]
type = "APPLY_ADAMAGE"
degree = 100
[[mobiles.401.applies]]
