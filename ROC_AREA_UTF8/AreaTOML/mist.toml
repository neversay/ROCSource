[mobiles.4503]
keywords = "receptionist port"
short_description = "港口的接待員(receptionist)"
long_description = "港口的接待員(receptionist)在這邊處理港口貨物與船隻進出的事項。\n"
description = """
接待員在這裡似乎很閒沒有事做，因為來往於迷霧之島與史卡拉貝城間的班次不
多。使得他經常在這邊不知道要做什麼。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "BANKER", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "PROTECT"]
alignment = 1000
level = 51
mod_hitplus = 5000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "female"
class = ["WARRIOR", "THIEF", "SWORD"]
spec_flags = ["NO_DM", "NO_BLIND", "NO_CHARM", "NO_SLEEP"]
[[mobiles.4503.programs]]
trigger = "fight_prog"
argument = "100"
script = """
mpat 5 c 'full heal'
c 3 powerball
mpgoto self
"""
[[mobiles.4503.programs]]
trigger = "talk_prog"
argument = "lawk"
script = """
say 他是光明之鎮海港辦事處的服務員。
mpcallout 1 say 平常負責有關迷霧海港的一些特別事務，
mpcallout 2 say 或是有關漁船(raft)出海的登記。
"""
[[mobiles.4503.programs]]
trigger = "talk_prog"
argument = "raft"
script = """
say 想要坐漁船不是來找我喔！
mpcallout 1 say 你們可以到海港辦事處找羅克(Lawk)。
mpcallout 2 say 若沒有看到他的話，可能他下班了。
mpcallout 3 say 你可以到他的住處試著找找看。
"""
[[mobiles.4503.programs]]
trigger = "rand_prog"
argument = "30"
script = """
if pcnum($) >= 0
	say 來來來！歡迎大家來到光明之鎮。
	mpcallout 1 say 迷霧海港提供最為完善的運輸服務。
	mpcallout 2 say 比起羅克(Lawk)的漁船(raft)，
	mpcallout 3 say 我們的服務可比他好的太多。
endif
"""
[[mobiles.4503.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == misty_receptionist_ferryage 100002
or is_qmark($i) == misty_receptionist_ferryage 100004
	if rand(50)
		mpecho $I 說著「你想要登船(board)船嗎？現在沒有船隻停泊在港口內，請等待。」
	else
		mpecho $I 說著「迷霧之島到處都有濃霧籠罩，請小心慢行。」
	endif
	break
endif
if is_qmark($i) == misty_receptionist_ferryage 100001
	mpecho $I 說著「現在有一艘豪華渡船在港內，您要登船(board)嗎？」
	break
endif
if is_qmark($i) == misty_receptionist_ferryage 100003
	mpecho $I 說著「現在有一艘普通渡船在港內，你要登船(board)嗎？」
endif
"""
[[mobiles.4503.programs]]
trigger = "talk_prog"
argument = "board"
script = """
if is_qmark($i) == misty_receptionist_ferryage 100001
	mpecho $I 說著「豪華渡船到 史卡拉貝城 的費用是 300000 元。」
	break
endif
if is_qmark($i) == misty_receptionist_ferryage 100003
	mpecho $I 說著「普通渡船到 史卡拉貝城 的費用是 100000 元。」
else
	mpecho $I 說著「現在沒有船隻停泊在港口內，請等待。」
endif
"""
[[mobiles.4503.programs]]
trigger = "bribe_prog"
argument = "300000"
script = """
if is_qmark($i) == misty_receptionist_ferryage 100001
	if is_qmark($i) < misty_receptionist_ferryage 200050
		nod
		mpecho $I 說著「好， $n 你可以上船了。」
		mpechoat $n 你登上了豪華渡船的甲板上....。
		mpjunk coins
		mptransfer $n 4509
		mpmod_qmark self misty_receptionist_ferryage v1 + 1
		break
	endif
	if is_qmark($i) == misty_receptionist_ferryage 200050
		shake
		mpecho $I 說著「豪華渡船的載重有限，頂多只能 50 個人上去。」
		mpecho $I 說著「現在船上已經滿 50 個人了，請下次再來。」
		mpgold $n 300000
	endif
else
	mpjunk coins
endif
"""
[[mobiles.4503.programs]]
