script = """
if roomvalue($0) == 0
	if rand(40)
		if pcnum($) >= 2
			echoat 你與眾人合力將這些石塊、殘骸給移開，出現了一道門。
			echo $N與眾人合力將這些石塊、殘骸給移開，出現了一道門。
			echo 下方傳來一陣可怕的聲響，分不清楚是人還是野獸的聲音。
			modrvt v0 = 1
			makedoor 5 下方傳來可怕的聲響 石門 1 0 4677
			at 4677 makedoor 4 可以從這裡離開地下室 石門 1 0 4675
			at 4677 echo 你上方的石門被打開了。
			if robjcount(4616) > 0
				purge furniture1-mist
			endif
			oload 4617 99 floor
		endif
	else
		if str($n) >= 22
			if rand(80)
				echoaround $N用力地想將這些石塊、殘骸給移開，但是旁邊的碎塊又掉了下來。
				echoat $n 你用力地想將這些石塊、殘骸給移開，但是旁邊的碎塊又掉了下來。
				echoat $n 或許還要多試個幾次才行。
			else
				echoat 你將這些石塊、殘骸給移開，出現了一道門。
				echo $N將這些石塊、殘骸給移開，出現了一道門。
				echo 下方傳來一陣可怕的聲響，分不清楚是人還是野獸的聲音。
				modrvt v0 = 1
				makedoor 5 下方傳來可怕的聲響 石門 1 0 4677
				at 4677 makedoor 4 可以從這裡離開地下室 石門 1 0 4675
				at 4677 echo 你上方的石門被打開了。
				if robjcount(4616) > 0
					purge furniture1-mist
				endif
				oload 4617 99 floor
			endif
		else
			echoaround $N用力地想將這些石塊、殘骸給移開，但是這些殘骸實在太重了。
			echoat $n 你用力地想將這些石塊、殘骸給移開，但是旁邊的碎塊又掉了下來。
			echoat $n 或許還要多試個幾次，或人更多一點才行。
		endif
	endif
else
	echoat $n 這些東西都已經移開了。
endif
"""
