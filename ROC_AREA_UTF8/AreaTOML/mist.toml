			mpat 4512 mptransfer all 4513
			mpat 4514 mpecho 前往 迷霧之島 的豪華渡船即將抵達 迷霧之島。
			mpat 4514 mptransfer all 4515
			mpgoto 4510
			break
		endif
		if hour($) == 9
			mpat 4509 mpecho 前往 迷霧之島 的豪華渡船已經抵達 迷霧之島。
			mpat 4509 mptransfer all 4522
			mpat 4510 mpecho 前往 迷霧之島 的豪華渡船已經抵達 迷霧之島。
			mpat 4510 mptransfer all 4522
			mpat 4511 mpecho 前往 迷霧之島 的豪華渡船已經抵達 迷霧之島。
			mpat 4511 mptransfer all 4522
			mpat 4513 mpecho 前往 迷霧之島 的豪華渡船已經抵達 迷霧之島。
			mpat 4513 mptransfer all 4522
			mpat 4515 mpecho 前往 迷霧之島 的豪華渡船已經抵達 迷霧之島。
			mpat 4515 mptransfer all 4522
			mpdel_qmark self misty_ferryman-a_ferryage
		endif
	endif
	break
endif
if is_qmark($i) == misty_ferryman-a_ferryage 100004
	if day($) == 3
		if hour($) == 15
			mpat 4509 mpecho 前往 史卡拉貝城 的豪華渡船已經啟動出發。
			mpat 4509 mptransfer all 4506
			mpat 4510 mpecho 前往 史卡拉貝城 的豪華渡船已經啟動出發。
			mpat 4510 mptransfer all 4507
			mpat 4511 mpecho 前往 史卡拉貝城 的豪華渡船已經啟動出發。
			mpat 4511 mptransfer all 4508
			mpat 4513 mpecho 前往 史卡拉貝城 的豪華渡船已經啟動出發。
			mpat 4513 mptransfer all 4512
			mpat 4515 mpecho 前往 史卡拉貝城 的豪華渡船已經啟動出發。
			mpat 4515 mptransfer all 4514
			mpgoto 4507
		endif
		break
	endif
	if day($) == 5
		if hour($) == 8
			mpat 4506 mpecho 前往 史卡拉貝城 的豪華渡船即將抵達 史卡拉貝城。
			mpat 4506 mptransfer all 4501
			mpat 4507 mpecho 前往 史卡拉貝城 的豪華渡船即將抵達 史卡拉貝城。
			mpat 4507 mptransfer all 4502
			mpat 4508 mpecho 前往 史卡拉貝城 的豪華渡船即將抵達 史卡拉貝城。
			mpat 4508 mptransfer all 4503
			mpat 4512 mpecho 前往 史卡拉貝城 的豪華渡船即將抵達 史卡拉貝城。
			mpat 4512 mptransfer all 4504
			mpat 4514 mpecho 前往 史卡拉貝城 的豪華渡船即將抵達 史卡拉貝城。
			mpat 4514 mptransfer all 4505
			mpgoto 4502
			break
		endif
		if hour($) == 9
			mpat 4501 mpecho 前往 史卡拉貝城 的豪華渡船已經抵達 史卡拉貝城。
			mpat 4501 mptransfer all 3049
			mpat 4502 mpecho 前往 史卡拉貝城 的豪華渡船已經抵達 史卡拉貝城。
			mpat 4502 mptransfer all 3049
			mpat 4503 mpecho 前往 史卡拉貝城 的豪華渡船已經抵達 史卡拉貝城。
			mpat 4503 mptransfer all 3049
			mpat 4504 mpecho 前往 史卡拉貝城 的豪華渡船已經抵達 史卡拉貝城。
			mpat 4504 mptransfer all 3049
			mpat 4505 mpecho 前往 史卡拉貝城 的豪華渡船已經抵達 史卡拉貝城。
			mpat 4505 mptransfer all 3049
			mpdel_qmark self misty_ferryman-a_ferryage
		endif
	endif
endif
"""

