[mobiles.4501]
keywords = "ferryman-a captain"
short_description = "豪華渡船船長(captain)"
long_description = "渡船船長(captain)在此提供整艘渡船前進的動力到魔力水晶球之中。\n"
description = """
他就是這艘豪華渡船的船長，提供了整艘船行進的魔力到水晶球之中。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "CRITICAL", "HARD_DIS", "ARTIFACT", "GAMBLE", "BANKER", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT"]
alignment = 1000
level = 70
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 100
mod_damroll = 100
mod_ac = -500
mod_svs = -100
dodge = -500
mod_pp = 500
gold = -1
sex = "male"
class = ["WARRIOR", "THIEF", "SWORD"]
spec_flags = ["NO_DM", "NO_BLIND", "NO_CHARM", "NO_SLEEP", "NO_CRAZY"]
special_function = "spec_cast_cleric"
[[mobiles.4501.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
mpoload 4636
wear oar
"""
[[mobiles.4501.programs]]
trigger = "fight_prog"
argument = "100"
script = """
mpat 5 c 'full heal'
mpnowait
c 3 powerball
mpnowait
mpgoto self
"""
[[mobiles.4501.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == misty_ferryman-a_ferryage 100001
	mpecho $I 說著「歡迎來到通往 迷霧之島 的豪華渡船。」
	mpecho $I 說著「如果您現在反悔想下船(over the side)請跟我說一聲。」
	break
endif
if is_qmark($i) == misty_ferryman-a_ferryage 100002
	mpecho $I 說著「現在船已經啟動要前往 迷霧之島。」
	mpecho $I 說著「在船上請您小心自己的安全。」
	break
endif
if is_qmark($i) == misty_ferryman-a_ferryage 100003
	mpecho $I 說著「歡迎來到通往 史卡拉貝城 的豪華渡船。」
	mpecho $I 說著「如果您現在反悔想下船(over the side)請跟我說一聲。」
	break
endif
if is_qmark($i) == misty_ferryman-a_ferryage 100004
	mpecho $I 說著「現在船已經啟動要前往 史卡拉貝城。」
	mpecho $I 說著「在船上請您小心自己的安全。」
	break
endif
if is_qmark($i) != misty_ferryman-a_ferryage
	mpecho $I 說著「如果您想下船(over the side)請跟我說一聲。」
endif
"""
[[mobiles.4501.programs]]
trigger = "talk_prog"
argument = "p over the side"
script = """
if is_qmark($i) == misty_ferryman-a_ferryage 100001
	mpechoat $n 你下船回到了 維芬海港。
	mptransfer $n 3049
	break
endif
if is_qmark($i) == misty_ferryman-a_ferryage 100003
	mpechoat $n 你下船回到了 史卡拉貝。
	mptransfer $n 4522
endif
"""
[[mobiles.4501.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if is_qmark($i) == misty_ferryman-a_ferryage 100002
	if day($) == 0
		if hour($) == 15
			mpat 4501 mpecho 前往 迷霧之島 的豪華渡船已經啟動出發。
			mpat 4501 mptransfer all 4506
			mpat 4502 mpecho 前往 迷霧之島 的豪華渡船已經啟動出發。
			mpat 4502 mptransfer all 4507
			mpat 4503 mpecho 前往 迷霧之島 的豪華渡船已經啟動出發。
			mpat 4503 mptransfer all 4508
			mpat 4504 mpecho 前往 迷霧之島 的豪華渡船已經啟動出發。
			mpat 4504 mptransfer all 4512
			mpat 4505 mpecho 前往 迷霧之島 的豪華渡船已經啟動出發。
			mpat 4505 mptransfer all 4514
			mpgoto 4507
		endif
		break
	endif
	if day($) == 2
		if hour($) == 8
			mpat 4506 mpecho 前往 迷霧之島 的豪華渡船即將抵達 迷霧之島。
			mpat 4506 mptransfer all 4509
			mpat 4507 mpecho 前往 迷霧之島 的豪華渡船即將抵達 迷霧之島。
			mpat 4507 mptransfer all 4510
			mpat 4508 mpecho 前往 迷霧之島 的豪華渡船即將抵達 迷霧之島。
			mpat 4508 mptransfer all 4511
