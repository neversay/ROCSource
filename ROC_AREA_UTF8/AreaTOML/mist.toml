material = "paper"
[[objects.4512.extra_descriptions]]
keywords = "page3"
description = """
[兩地通航]
由於迷霧之島光明之鎮的居民都是由史卡拉貝城移居過去。這些鎮
民大部分都是因為當初傷心於魔劍士托司馬克的過世，因此選擇離
開了傷心的史卡拉貝城。但是兩地的商業往來仍然十分的頻繁。迷
霧之島魚產十分的豐富，加上天然濃霧籠罩，其他海上生物不欲靠
近此處，因此藉由航路的通行，將魚產賣到史卡拉貝城，用來換取
日常生活的物資。
"""
[[objects.4512.extra_descriptions]]
keywords = "page2"
description = """
[光明之鎮]
光明之鎮的來由，是由於後來由史卡拉貝城移居至此的人，有感於
此地終年濃霧籠罩，不得天日。因此取之為光明之鎮，希望有朝一
日能夠將此處的濃霧給除去。但是後來發生了幾次的海上的怪物大
舉進攻光明之鎮，但是由於此地天然天險，地形特殊，加上濃霧籠
罩，反而讓此地的鎮民死裡逃生，此為光明之鎮之名的由來。
"""
[[objects.4512.extra_descriptions]]
keywords = "page1"
description = """
[迷霧之島]
迷霧之島形成的原因目前不明。當初史卡拉貝城中的盜賊系分成兩
派，以致於兩方發生紛爭。因此，其中一派便遠渡重洋找到了這個
迷霧之島。此處進可攻、退可守，天然的濃霧讓整個迷霧之島變得
易守難攻。加上島上的高山崎嶇難行，因此那些盜賊選定了島上的
高山做為他們隱蔽的地方。他們成為迷霧之島上最早的居民。
"""
[[objects.4512.extra_descriptions]]
keywords = "history"
description = """
[ Page1 ] 第一頁 - 迷霧之島
[ Page2 ] 第二頁 - 光明之鎮
[ Page3 ] 第三頁 - 光明之鎮與史卡拉貝城
"""

