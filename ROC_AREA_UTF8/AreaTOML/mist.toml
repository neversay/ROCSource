long_description = "迷霧之島歷史書(History of Misty Island)被放置在這邊。"
action_description = ""
item_type = "TREASURE"
extra_flags = ["GLOW", "MAGIC"]
wear_flags = ["TAKE", "HOLD"]
values = ["0", "0", "0", "0"]
weight = 3
