[[mobiles.4504.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if hour($) < 8
or hour($) > 20
	if is_qmark($i) == mist_rest
		if is_qmark($i) == mist_work
			mpdel_qmark self mist_work
		endif
		break
	else
		mpecho 下班時間到， $I 回家休息去了....。
		mpgoto 4500
		mpadd_qmark self mist_rest -1 0 0 0 0 1
		if is_qmark($i) == mist_work
			mpdel_qmark self mist_work
		endif
	endif
else
	if is_qmark($i) == mist_work
		if is_qmark($i) == mist_rest
			mpdel_qmark self mist_rest
		endif
		break
	else
		mpgoto 4523
		mpecho 上班時間到， $I 來到迷霧海港開始一天的工作....。
		mpadd_qmark self mist_work -1 0 0 0 0 1
		if is_qmark($i) == mist_rest
			mpdel_qmark self mist_rest
		endif
	endif
endif
"""
