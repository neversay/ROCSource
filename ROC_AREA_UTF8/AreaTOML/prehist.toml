[[rooms.15631.programs]]
trigger = "room_rand"
argument = "40"
script = """
if pcnum($) >= 3
        if roomvalue($0) == 0
                if insameroom(rook-prehist)
                        force rook-prehist say 唉呀！你們的人進來的太多了....，
                        callout 1 force rook-prehist say 趕快出去，不然這棟房子會垮的。
                else
                        echo 這棟破舊的房子忽然發出「嘎！嘰！」幾響奇怪的聲響。
                endif
                modrvt timer = 240
                modrvt v0 = 1
                break
        endif
        if roomvalue($0) == 1
                if insameroom(rook-prehist)
                        force rook-prehist say 不是跟你們說這棟房子要倒了嗎....？
                        callout 1 force rook-prehist say 拜託你們趕快出去啦！
                else
                        echo 這棟破舊的房子忽然發出「嘎！嘰！譏！嘎！」的聲響。
                endif
                modrvt v0 = 2
                break
        endif
        if roomvalue($0) == 2
                if insameroom(rook-prehist)
                        force rook-prehist say 你趕快出去好不好....，
                        callout 1 force rook-prehist say 這棟房子快倒了啦！
                        callout 1 echo 整棟房子忽然開始劇烈搖動了起來！
                else
                        echo 這棟破舊的房子忽然發出「嘎！嘰！譏！嘎！」的聲響。
                        echo 整棟房子忽然開始劇烈搖動了起來！
                endif
                modrvt v0 = 3
                break
        endif
        if roomvalue($0) == 3
                echo 忽然一陣劇烈的搖動，整棟房子的屋頂塌了下來....
                echo 散落的結構與家具對你們造成嚴重的傷害！
                if insameroom(rook-prehist)
                        mod_qmark rook-prehist prehist_rook_quest v0 = 1
                endif
                modhmv pc 01.250 350 0
                echo 整棟房子現在已經成為廢墟....
                modrvt v0 = 0
                deldoor 2
                force 15634 deldoor 0
                force 15634 makedoor 0 通往廢墟(exit) exit 0 0 15598
                force 15598 makedoor 2 通往廢墟(exit) exit 0 0 15634
                force 15634 modrvt v0 = 1
                transfer all 15598
                transfer obj 15598
        endif
endif
"""

