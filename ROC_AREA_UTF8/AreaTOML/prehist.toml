                        mpcallout 1 say 可以做出許多常人做不來的動作....，
                        mpcallout 2 say 這些動作往往可以讓我想取悅的人高興不已....，
                        mpcallout 3 say 當然，沒有足夠的敏捷是辦不到的。
                        mpcallout 3 mpdel_qmark self prehist_talking
                endif
        endif
endif
"""
