description = """
他在一次的戰役中失去了他所有伙伴，因此僅能夠孤獨地躲在遠古森林中避免被遠古森林
兇惡的生物給吃掉。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "IGNORE_NO_MOB"]
