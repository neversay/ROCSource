name = "蠻荒平原"
description = """
你正漫步在一片寬廣、開闊的平原上，上頭長滿了厚厚一層野草與散落的喬木與灌木。許
多種類的鳥類在這個開闊的草原上遨翔，更有許多史前的生物在草原上怒吼、奔馳。整個草原
往東邊延伸而去，而南邊可以回到迷霧大平原。這邊有一塊大匾額(plaque)。
"""
flags = []
sector = "FOREST"
[[rooms.15400.extra_descriptions]]
keywords = "轉盤數字serialnumber"
description = """
1. 123
2. 732
3. 615
4. 476
5. 457
"""
[[rooms.15400.extra_descriptions]]
keywords = "任務表列questlist"
description = """
目前這個區域的任務表列(quest list)：
1. prehist_quest v0 | 1 prehist_golden_potion           拯救野獸 done
2. prehist_quest v0 | 2 prehist_xue_quest               取悅冰長老 done
3. prehist_quest v0 | 4 prehist_pii_quest               為小痞取得配刀 done
4. prehist_quest v0 | 8 prehist_rook_quest              幫路克修理房子 done
5. prehist_quest v0 | 16 prehist_cute_quest             小女孩的寶藏 done
6. prehist_quest v0 | 32 prehist_adventurer_quest       幫助遠古森林中冒險者脫離 done
7. prehist_quest v0 | 64 prehist_lei_quest              幫雷幹事解饞 done
8. prehist_quest v0 | 128 prehist_ice_quest             幫冰長老清除冰庫中的魔法冰塊 done
9. prehist_quest v0 | 256 prehist_savevillage_quest     拯救魔刀村 not yet
10.prehist_quest v0 | 512 prehist_wuu_quest             霧老師的煩惱 done
11.prehist_quest v0 | 1024 prehist_rescue_quest         援救賽斯與索恩 done
"""
[[rooms.15400.extra_descriptions]]
keywords = "plaque"
description = """
.
這個區域稱為「遠古森林(prehistoria/ancient woods)」，是繼星光之城之後自己的再
度創作。當然，裡頭比起星光之城來說，再度增加了不少有趣的新點子，讓玩家能夠在這
個區域探險的時候，能夠感受到前所未有的冒險感（當然，這些話是對真正能夠注意周邊
環境的玩家而言）。

在這個區域裡頭同時結合了來自 卡莎米亞(Cassamia) 大神 Clover 的區域 - 魔劍村，
基於混沌幻世以劍為主題的區域已經相當多了，因此將這個村落改成 - 魔刀村。同時將
自己創作的「幻魔高塔」與原本魔劍村的黑色之塔結合，讓區域的難度設定能更加完整。
在此十分感謝 Clover 願意提供其創作的一部份而大幅增加了本區域整體的豐富性與多樣
性。

本區域的前置作業，完成於 2002/06/15 ，大約是星光之城完成後的一個月。
本區域的主體作業，完成於 2002/10/18 ，事先釋放出 5 項任務。
2002/11/19 完成本區域中獨創的武器與寶石融合機制，同時釋放本區域的第 8 項任務。
2003/04/18 完成第 9 項幫路克修理房子任務，並籌備有關烽火峽谷及幻魔高塔的製作。

                                                - 闇之冥王星普魯多(Pluto)
"""
