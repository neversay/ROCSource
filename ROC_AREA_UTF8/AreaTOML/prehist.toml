mpdel_qmark $b prehist_adventurer_quest
if is_qmark($b) != prehist_quest
        mpadd_qmark $b prehist_quest -1 32 0 0 0 1
else
        if is_qmark($b) !& prehist_quest 100032
                mpmod_qmark $b prehist_quest v0 | 32
        endif
endif
"""
[[mobiles.15431.programs]]
trigger = "greet_prog"
argument = "100"
script = """
mpcall prehist_adventurer_underattack
"""
[[mobiles.15431.programs]]
trigger = "give_prog"
argument = "15452"
script = """
if rembch($n)
        if is_equ_obj($i) != 15452
                say 哇！黃金鏟子，真是太好了。
                wear shovel-prehist
        else
                say 我身上已經裝備有一支了。
                drop shovel-prehist
        endif
        if inroom($i) == 4634
                if is_qmark($i) == prehist_adventurer_quest 100005
                        mpcall prehist_adventurer_digging $b
                endif
        endif
else
        ? $n
        say 你給我這支鏟子做什麼？
        drop shovel-prehist
endif
"""
[[mobiles.15431.programs]]
trigger = "defun_prog"
argument = "prehist_adventurer_digging"
script = """
