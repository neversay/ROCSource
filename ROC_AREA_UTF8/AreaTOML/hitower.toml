[[mobiles.1206.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if rand(10)
        say 炎狼之牙！
        mpechoat $n $I的手臂上忽然冒出尖牙狀的火炎，朝你猛力劃下！
        mpechoaround $n $I的手臂上忽然冒出尖牙狀的火炎，$N首當其衝，被正面劃中了！
        cast armageddon $n
        mpnowait
        mpdel_qmark self spell_armageddon_timer
        mpdis_magic self armageddon
        cast 'seal magic' $n
        mpnowait
else
        if rand(20)
                say 雙焰猛襲劍！
                mpechoat $n $I手中憑空出現一把火燄長劍，他持劍對你擊出了X型的火燄波！
                mpechoaround $n 一把火紅色的長劍在$I手中瞬間成形，他流暢地揮出兩道呈交叉狀的烈焰！
                mpat 5 mpoload 70914 36
                mpat 5 wear sword
                flaming
                mpnowait
                flaming
                mpnowait
                mpat 5 remove sword
                mpat 5 mpjunk sword
        else
                if rand(33)
                        say 燄華閃光！
                        mpecho 兩枚火星在$I面前碰撞，瞬間引發耀目的強光！
                        cast 'sun flash'
                        mpnowait
                        cast 2 'star fire' $r
                        mpnowait
                else
                        if rand(50)
                                say 蒼炎的旋律！
                                mpecho $I猛擊地面，龜裂的地面噴出灼熱的能量波！
                                cast 2 'song of firestorm' $r
                                mpnowait
                        else
                                say 創滅之紅！
                                mpechoat $n $I一揚手，熱風與灼痛頓時襲擊著你身體的每一片皮膚！
                                mpechoaround $n 一股灼熱的烈風隨著$I的動作朝向$n撲去！
                                cast 2 'angry fire storm' $n
                                mpnowait
                        endif
                endif
        endif
endif
"""
