[[mobiles.1206.programs]]
trigger = "hitprcnt_prog"
argument = "20"
script = """
if is_qmark($i) != hitower_sixpower
if rand(33)
        shout 在使者的鮮血與永恆的誓約之前，呼喚六芒之星！
        shout 灼熱的侵略紅焰！飄揚的潔淨霜雪！沉靜的幻想綺夢！
        shout 閃耀的天際星辰！遼闊的碧藍蒼空！無瑕的破魔聖光！
        mpechotoall 五道顏色各異的光輝劃過天際，朝著舊大陸的西方而去！
        mpat 5 cast 'full heal'
        mpnowait
        mpechoat $n $I身上所有的傷勢竟然在一瞬間完全復原了！
        mpadd_qmark self hitower_sixpower -1 1 0 0 0 1
endif
"""
[[mobiles.1206.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self all
mpat 5 cast 'detect hidden'
mpat 5 cast 'detect invis'
mpat 5 cast infravision
mpgreward exp $n 36 30000
mpgreward skexp $n 36 100
mpdis_magic $n 'polymorph other'
mpdis_magic $n morphing
if race($n) == Drow
        if is_qmark($i) == hitower_sixpower
                if is_qmark($n) != hitower_questmark
                        mpadd_qmark $n hitower_questmark -1 4 0 0 0 1
                        mpresp $n 3
                        mpexp $n 20000
                        mpskillexp $n 30000
                else
                        if is_qmark($n) != hitower_questmark 100004
                                mpmod_qmark $n hitower_questmark v0 | 4
                                mpresp $n 3
                                mpexp $n 20000
                                mpskillexp $n 30000
                        else
                                yell 還無法理解嗎？！與我有著相同根源血脈的同族哪！
                        endif
                endif
        else
                yell 你能毀滅我的肉體，但是你毀不了我身上的詛咒！
        endif
else
        mpdis_magic $r 'polymorph other'
        mpdis_magic $r morphing
        if race($r) == Drow
                if is_qmark($i) == hitower_sixpower
                        if is_qmark($r) != hitower_questmark
                                mpadd_qmark $r hitower_questmark -1 4 0 0 0 1
                                mpresp $r 3
                                mpexp $r 10000
                                mpskillexp $r 15000
                        else
                                if is_qmark($r) != hitower_questmark 100004
                                        mpmod_qmark $r hitower_questmark v0 | 4
                                        mpresp $r 3
                                        mpexp $r 10000
                                        mpskillexp $r 15000
                                else
                                        yell 即使是這樣，這一切仍然無法結束！
                                endif
                        endif
                else
                        yell 你能毀滅我的肉體，但是你毀不了我身上的詛咒！
                endif
        else
                yell 終究只有這點程度嗎......算了......
        endif
endif
"""

[mobiles.1207]
keywords = "Ceres"
short_description = "瑟雷斯(Ceres)"
long_description = "一個略顯蒼老的男人(Ceres)坐在這裡喝著便宜的酒。\n"
description = """
他看起來沒有什麼特別的，是那種在街上隨處可見的中年大叔。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 0
level = 35
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Human"
class = ["WARRIOR", "MAGE"]
spec_flags = ["NO_CHARM"]
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) != hitower_talking
        if ispc($n)
                if is_qmark($n) != hitower_questmark
                        mpadd_qmark $n hitower_questmark -1 0 0 0 0 1
                endif
                if is_qmark($n) == hitower_energy_quest
                or is_qmark($n) & hitower_questmark 100008
                or is_qmark($n) !& hitower_questmark 100001
                else
                        if is_equ_obj($n) == 1202
                        or is_equ_obj($n) == 1203
                                mpadd_qmark $n hitower_energy_quest -1 1 0 0 0 1
                                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                                tell $n 喔，你身上那個東西是......
                                mpcallout 1 tell $n 嗯？我好像對你沒什麼印象，你那東西哪來的？
                                mpcallout 2 mpechoat $n 你發現$I似乎盯著上次你用某個杯子換來的物品。
                                mpcallout 2 mpdel_qmark self hitower_talking
                        endif
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "edgar"
script = """
if is_qmark($i) != hitower_talking
        if is_qmark($n) == hitower_energy_quest 100001
                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                tell $n 什麼？！這小子真不識貨，竟然把我的心血結晶拿去換那種東西！
                mpcallout 1 mpechoat $n $I看起來似乎很不高興的樣子。
                mpcallout 2 mpechoat $n 你在好奇之餘向他問了問到底是怎麼回事。
                mpcallout 3 tell $n 是這樣的，舞音護腿與紫電之痕是我以前親手製造出來的東西。
                mpcallout 4 tell $n 這兩件物品還只是是半成品，後來因為某些緣故，我送了一套給艾德加(Edgar)。
                mpcallout 5 tell $n 至於為什麼沒給他完成品，是因為缺了關鍵的物品(item)。
                mpcallout 5 mpmod_qmark $n hitower_energy_quest v0 = 2
                mpcallout 5 mpdel_qmark self hitower_talking
        else
                tell $n 你說他？我認識啊，他怎麼了？
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "item"
script = """
if is_qmark($i) != hitower_talking
        if is_qmark($n) == hitower_energy_quest 100002
                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                tell $n 這個關鍵物品要製造並不算非常難，不過也不是隨隨便便就能做出來的。
                mpcallout 1 tell $n 你必須要將自己的生命力、法力與體力同時投入才行。
                mpcallout 2 tell $n 三者融合後就會形成我所需要的關鍵物品，這樣你懂吧？
                mpcallout 3 tell $n 麻煩的地方是，三種能量的瞬間投入量必須高到一定程度，否則只是白白浪費掉。
                mpcallout 4 tell $n 所以，在這三方面的修為都要有相當的程度才行。
                mpcallout 5 tell $n 如果你對自己很有信心，那麼你可以隨時來找我，我會把你送進(transfer)我的工作室。
                mpcallout 6 tell $n 你在那裡就可以凝聚(congeal)能量，結晶要記得拿啊。
                mpcallout 5 mpmod_qmark $n hitower_energy_quest v0 = 3
                mpcallout 5 mpdel_qmark self hitower_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "transfer"
script = """
if is_qmark($i) != hitower_talking
        tell $n 好，你去吧。
        mpechoat $n $I用魔法將你送進他的工作室裡面。
        mptransfer $n 1226
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "lasvia"
script = """
if is_qmark($i) != hitower_talking
        if ispc($n)
                tell $n 不認識。
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "talk_prog"
argument = "annlo"
script = """
if is_qmark($i) != hitower_talking
        mpadd_qmark self hitower_talking 10 0 0 0 0 1
        tell $n 強者，真的很強！
        mpcallout 1 tell $n 可惜的是他太冷酷，否則我就能請他幫我個大忙了......
        mpcallout 1 mpdel_qmark self hitower_talking
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1207.programs]]
trigger = "give_prog"
argument = "1217"
