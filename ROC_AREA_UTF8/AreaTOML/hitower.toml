                mpecho $I拿到了座標圖後，便開始唸出一長串的咒文....
                mpcallout 1 mpecho \u001B[1;35m瞬間周遭產生了一股強大的魔力磁場，\u001B[0m
                mpcallout 2 mpecho \u001B[1;35m不一會兒，你看到一扇巨大的魔法門出現在你的面前！\u001B[0m
                mpcallout 2 mpoload 1477 40 floor
                mpcallout 3 say 我的魔力雖然強大，但是魔法門我也沒法子開啟多久...
                mpcallout 4 say 請趕緊把握時間吧....
                mpcallout 4 mpdel_qmark self dragonbay_portal
        else
                say 你給我這個幹什麼？
                give paper $n
        endif
else
        你給我這個幹什麼？
        give paper $n
endif
"""
[[mobiles.1364.programs]]
trigger = "give_prog"
argument = "13483"
script = """
if is_qmark($n) == mage_envoy_quest 100011
nod $n
mpecho $I 閉起眼睛喃喃唸出難懂得咒文，你注意
mpecho 到紫薇神戒發出的紫色光芒越來越熾烈！
mpjunk all.ring
mpcallout 4 mpcall givering $n
mpmod_qmark $n mage_envoy_quest v0 = 12
break
endif
if is_qmark($n) != mage_envoy_quest 100007
        ?
        drop all.ring
        break
endif
look $n
mpecho 以好奇的表情聽完你來這裡的目的後，$I 格格笑了起來：
say 孩子啊，真不曉得該說你天真還是幼稚，難道你不知
say 道我是偉大的魔法女王嗎！
mpecho $I 看了看手上的紫薇神戒....
gig
say 第一，以我的魔力，根本不需要這種小玩具，
say 第二，要我和史卡拉貝最具勢力的風之城為敵，代價
say 未免太高吧！
mpecho $I 溫柔地撫摸坐在膝上的花貓，大花貓(calico cat)
mpecho 喉嚨發出舒服的咕嚕咕嚕聲....
mpcallout 4 mpcall speak1 $n
mpcallout 10 mpcall speak2 $n
"""
[[mobiles.1364.programs]]
trigger = "defun_prog"
argument = "givering"
script = """
mpoload 1476 $n viclv target
mpmod_qmark $n mage_envoy_quest v1 = 2
mpecho 紫薇神戒的光芒突然消失，而$I也張開眼睛
mpecho .
say 孩子，我已將我的魔力灌注到戒子裡，你要好好使用！
mpecho $I把東西交給了你....
mpgreward exp $n -42 5000
say 你可以回去了，告訴他們你已圓滿達成任務(finished)
say 你的門主會很高興吧。匹克斯能得到你這種人才應該是
say 天意，風之城以後恐怕不好過了...
gig
"""
[[mobiles.1364.programs]]
trigger = "defun_prog"
argument = "speak1"
script = """
mpechoat $n 拍拍花貓的頭，$I 從頭到腳仔細地打量你....
mpechoaround $n $I 拍拍花貓的頭，$I 從頭到腳仔細地打量著 $n ....
"""
[[mobiles.1364.programs]]
trigger = "defun_prog"
argument = "speak2"
script = """
say 不過，你能夠穿過迷宮，並打敗我一手訓練出來的高塔
say 守衛抵達這裡，實力也算不簡單了。
smile
give purple $n
say 我最欣賞你們這種剛剛冒出頭的年輕人，生命裡充滿了
say 旺盛的活力....
chu
say 這樣吧，你幫我辦件事，如果做得好，表示風火海有資
say 格和魔法高塔結盟，然後我也會給你一些報酬...(yes/no)
mpmod_qmark $n mage_envoy_quest v0 = 8
"""
[[mobiles.1364.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) != mage_envoy_quest 100008
        break
endif
say 初生之犢不畏虎呀....
mpecho $I嘉許地看著$n
say 你有聽過禁斷之塔嗎？是最近在大陸西南興起的壞東
say 西。我派使者過去，他們居然還不肯向魔法高塔朝貢，
say 真是太放肆了！
frown
say 你去教訓一下他們，聽說帶頭的是一個叫罰悲還是
say 發呸的糊塗蛋。去賞他幾個巴掌再回來找我....
mpmod_qmark $n mage_envoy_quest v0 = 9
"""
[[mobiles.1364.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) != mage_envoy_quest 100010
        break
endif
mpecho $I驚愕地看著$n...
say 真有你的，你還真的打了上去！
mpecho $I不自覺地從她巨大的座位站了起來...
if sex($n) == 2
        say 小姑娘，我本來只是想讓妳知難而退，
        say 不料到妳竟然有這份實力！
else
        say 小夥子，我本來只是想讓你知難而退，
        say 不料到你竟然有這份實力！
endif
clap $n
say 波濤疊疊，後浪蓋前浪，我真的老嘍！
say 結盟一事當然沒問題，風火海已經有了匹克斯，現在
say 又多了你，能和這麼強大的組織結盟對魔法高塔也有
say 好處。
gig
say 對了，之前有答應給你一點獎勵，你把紫薇交給我吧。
mpmod_qmark $n mage_envoy_quest v0 = 11
"""
[[mobiles.1364.programs]]
trigger = "talk_prog"
argument = "annlo"
script = """
if is_qmark($i) != hitower_talking
        mpadd_qmark self hitower_talking 10 0 0 0 0 1
        tell $n 雖然我很不願意承認，但是以我的力量，也未必是那個男人的對手。
        mpcallout 1 sigh
        mpcallout 2 tell $n 很明顯地，他是為了某種目的而來，不過到目前為止他並未有危害我方的舉動。
        mpcallout 3 tell $n 另外，他也不屬於風之城或是風火海這兩方勢力的任一方。
        mpcallout 4 ponder
        mpcallout 5 tell $n 再來就是他很沉默，我只與他交談過一次......不，應該說一句話。
        mpcallout 6 tell $n 「當六芒之星架構完成，就是我最後之戰的開端。」
        mpcallout 7 tell $n 自己當心點，年輕人。
        mpcallout 7 mpdel_qmark self hitower_talking
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1364.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if hitprcnt($i) < 50
	c 'double heal'
	mpnowait
endif
if rand(20)
	c 'demon tremor'
	mpnowait
endif
if ispc($r)
	if rand(20)
		c curse $r
		mpnowait
		c curse $r
		mpnowait
	endif
	if rand(20)
		c poison $r
		mpnowait
		c blindness $r
		mpnowait
	endif
	if rand(40)
		if rand(50)
			c lifesteal $r
			mpnowait
			c lifesteal $r
			mpnowait
		else
			c soulsteal $r
			mpnowait
			c soulsteal $r
			mpnowait
		endif
	endif
	if rand(50)
		c 'energy drain' $r
		mpnowait
		c 'energy drain' $r
		mpnowait
	else
		c 3 powerball $r
		mpnowait
	endif
endif
if rand(50)
	if rmobcount(1203) < 3
		say 守衛！守衛！把這些人轟出去！
		mpecho 隨著$I一聲令下，忽然一名守衛從角落衝了出來！
		mpmload 1203
		mpgroup self guardian-hitower 1 0
		mpforce guardian-hitower rescue $i
	endif
else
	if rand(50)
		if rmobcount(1204) < 1
			say 幻法師！把這些人趕出去！
			mpecho 隨著$I一聲令下，忽然一名幻法師從角落衝了出來！
			mpmload 1204
			mpgroup self sorcerer-hitower 1 0
			mpforce sorcerer-hitower rescue $i
		endif
	else
		if rmobcount(1205) < 2
			say 鍊金師！把這些人趕出去！
			mpecho 隨著$I一聲令下，忽然一名幻法師從角落衝了出來！
			mpmload 1204
			mpgroup self alchemist-hitower 1 0
			mpforce alchemist-hitower rescue $i
		endif
	endif
endif
if isaffected($i) & 16777216
	mpdis_magic self 'seal magic'
	say 無知的小鬼！居然對掌握魔法的我施展封鎖魔法！
	c 'seal magic' $r
	mpnowait
endif
if isaffected($i) & 4096
	c 'cure poison'
	mpnowait
endif
if isaffected($i) !& 128
		c sanctuary
		mpnowait
endif
if isaffected($i) & 268435456
	mpdis_magic self paralyze
endif
"""
