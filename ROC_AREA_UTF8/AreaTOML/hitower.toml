                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                mpechoat $n $I在一瞬間被你嚇得睡意全消。
                mpcallout 1 tell $n 你說什麼！拉斯維亞？！你從哪裡聽來這個名字的！
                mpcallout 2 mpechoat $n 你選擇性地將先前發生過的事告訴了$I......
                mpcallout 3 mpechoat $n 聽完你的話，再看著你那一副似乎能一拳殺熊的模樣，$I臉色變得很難看。
                mpcallout 4 tell $n 沒想到他死前的詛咒竟然成真了......紙終究包不住火嗎......
                mpcallout 5 tell $n 告訴你吧，拉斯維亞原本也是我們塔裡的法師之一，但是他背叛了我們。
                mpcallout 6 tell $n 他想要取得不該擁有的力量，因此我們在他成功之前聯合起來殺掉他。
                mpcallout 7 tell $n 這件事我們也不敢讓上面的人知道，所以我們做了點處置。
                mpcallout 8 tell $n 我們將奈美西絲(Nemesis)，也就是拉斯維亞試著重組的東西再度拆碎，藏了起來。
