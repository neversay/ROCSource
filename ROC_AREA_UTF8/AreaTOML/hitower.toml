argument = "portal"
script = """
if is_qmark($i) == hitower_gm_talking
        break
endif
if is_qmark($i) == dragonbay_portal_wait
        say 我的魔力已經用盡，一切等我回復後再說吧！
        break
endif
if is_qmark($n) > dragonbay_mayor_secret 100008
or is_qmark($n) & dragonbay_quest_mark 100004
        mpadd_qmark $i hitower_gm_talking 5 0 0 0 0 1
        mpechoat $n \u001B[1;32m你說「我是來請教你有關魔法傳送門的事的....」\u001B[0m
        mpechoaround $n $N\u001B[1;32m說著「我是來請教你有關魔法傳送門的事的....」\u001B[0m
        mpechoat $n 緊接著，你緩緩地道出了事情的源由....
        mpechoaround $n 緊接著，$N 緩緩地對 $I 道出了事情的源由....
        mpcallout 2 ohoho
        mpcallout 3 say 想不到甘道夫也有請求於我的一天，
        mpcallout 4 say 不錯，以我的魔力的確是有法子開啟魔法傳送門沒錯，
        mpcallout 5 say 但是，我憑什麼要為了你或是甘道夫浪費我的魔力？
        mpcallout 6 say 我又能夠得到什麼好處呢？除非......
        mpcallout 7 gla
        mpcallout 8 say 最近常看到天邊的流星劃破星空掉落塵土，
        mpcallout 9 say 傳說流星碎片常蘊藏著強大的魔法力量....
        mpcallout 10 say 若你能為我取得一個流星碎片給我，那我就考慮幫你吧！
        mpcallout 11 say 相信這對你這位神選之人並不難才是！
        mpcallout 12 addoil $n
        mpcallout 12 mpdel_qmark $i hitower_gm_talking
endif
"""
