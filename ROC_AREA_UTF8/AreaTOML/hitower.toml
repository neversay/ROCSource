[[mobiles.1327.programs]]
trigger = "talk_prog"
argument = "lasvia"
script = """
if is_qmark($i) != hitower_talking
        if is_qmark($n) == hitower_lyre_quest 100003
                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                tell $n 拉斯維亞？！
                mpcallout 1 mpechoat $n $I看了看四周，然後示意學生們自己練習，接著將你拉到角落。
                mpcallout 2 tell $n 這件事過去已經被上面的人包得密不透風，你竟然會曉得。
                mpcallout 3 tell $n 你問的那個人是我的好友，他在幾年前死於某次實驗中。
                mpcallout 4 tell $n 以上都是官方說法，接下來我要講的是只有少數人才曉得的事實(truth)。
                mpcallout 4 mpmod_qmark $n hitower_lyre_quest v0 = 4
                mpcallout 4 mpdel_qmark self hitower_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1327.programs]]
trigger = "talk_prog"
argument = "truth"
script = """
if is_qmark($i) != hitower_talking
        if is_qmark($n) == hitower_lyre_quest 100004
                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                tell $n 是的，他雖然是死於實驗意外，但是實驗的紀錄被竄改過了。
                mpcallout 1 tell $n 那次他進行的，是將一件被拆解過的不明魔法物品重新組合。
                mpcallout 2 tell $n 拆解的時候沒問題，重新組合的時候意外就發生了。
                mpcallout 3 tell $n 但不知道為什麼，其他法師將這件案例刻意淡化，然後呈報給女王跟前那三頭呆驢。
                mpcallout 4 tell $n 我是事後翻閱拉斯維亞的日記，才曉得他處理的是什麼東西。
                mpcallout 5 tell $n 問題應該就出在那個東西，可是在意外發生後它就失蹤了。
                mpcallout 6 tell $n 我知道的就這麼多......啊，你可不要說是我講的喔！
                mpcallout 6 mpmod_qmark $n hitower_lyre_quest v0 = 5
                mpcallout 6 mpdel_qmark self hitower_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.1327.programs]]
trigger = "talk_prog"
argument = "annlo"
script = """
if is_qmark($i) != hitower_talking
        mpadd_qmark self hitower_talking 10 0 0 0 0 1
        tell $n 我要是有他十分之一強悍，就不用留在這裡教這些傢伙了。
        mpcallout 1 mpecho $I搖頭苦笑，轉頭看了自己的學生們一眼。
        mpcallout 1 mpdel_qmark self hitower_talking
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""

