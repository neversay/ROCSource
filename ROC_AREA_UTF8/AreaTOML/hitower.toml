[[mobiles.1329.programs]]
trigger = "talk_prog"
argument = "Nemesis"
script = """
if is_qmark($i) != hitower_talking
        if is_qmark($n) == hitower_lyre_quest 100008
                mpadd_qmark self hitower_talking 10 0 0 0 0 1
                tell $n 幾年前，神罰之琴‧奈美西絲在我們塔裡是個禁忌的名號。
                mpcallout 1 tell $n 我們好不容易分解了這個危險物品，但是拉斯維亞卻偷走了碎片，想要重組以獲得力量。
                mpcallout 2 tell $n 當時我們認定他已經失控，所以殺了他。
                mpcallout 3 tell $n 神罰之琴的碎片在分開處理後也過了幾年，原本擁有的強大魔力已經散失了。
                mpcallout 4 tell $n 其中一塊碎片就是這個。
                mpcallout 5 mpechoat $n $I從床底取出一塊殘骸交到你的手中。
                mpcallout 5 mpoload 1204 $n 36 target
                mpcallout 6 tell $n 現在就算把神罰之琴重組，它也沒有什麼力量了。
                mpcallout 7 tell $n 另外幾塊碎片在其他幾位法師的手裡，我會告訴他們一聲，你去拿吧。
                mpcallout 8 tell $n 然後，神罰之琴送你沒關係，但是趕快把它帶走，湮滅證據！
                mpcallout 9 tell $n 要是被女王或那三個蠢蛋知道當時的事，我們就慘了......
                mpcallout 9 mpmod_qmark $n hitower_lyre_quest v0 = 9
                mpcallout 9 mpdel_qmark self hitower_talking
        else
                tell $n 我只有一塊碎片，其他的你得去找別人問。
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
