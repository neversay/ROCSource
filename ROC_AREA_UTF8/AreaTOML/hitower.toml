        mpcallout 1 tell $n 那種冷酷模樣看起來挺神秘的，不過也不太好親近啦。
        mpcallout 2 tell $n 聽上面的人講，他開口講話的時間很短。
        mpcallout 3 tell $n 而且講的話也很短，好像都是人名的樣子。
        mpcallout 4 tell $n 不過就算你去問他那些人名，他也不會理你吧。
        mpcallout 4 mpdel_qmark self hitower_talking
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""

