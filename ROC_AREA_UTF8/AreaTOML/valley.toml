     原 qmark 可以在進入本房間 或 talk angel skexp 時進行轉換。
  3. valley_elf_tree 完成後變更為取得 valley_elf_quest v0 & 1
  4. valley_elf_find = 2 完成後變更為取得 valley_elf_quest v0 & 2
"""
