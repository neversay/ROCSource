description = """
當你進入這個區域的時候，你感受到濃厚的死亡氣息環繞在你的身旁。
在你身邊至少有200隻以上的各種動物屍體被刀劍等武器砍死。在你身前的
原野上散布了數以千計的武器與營火。你可以看到地上手推車與馬匹的足
跡通往南邊，而小路往東邊延伸而去。

