[[objects.3442.extra_descriptions]]
keywords = "book"
description = """
蜂蜜水果煎餅(4人份) 

材料 餅皮部份： 中筋麵粉2/3杯、蛋1個、牛奶200c.c.、蜂蜜
1又1/2小匙、蔬菜油1/2小匙 餡料部份： 葡萄乾1又1/2大匙切
碎、水1大匙、檸檬汁1/2小匙、香蕉1根切片、奇異果1又1/2個
切丁、蜂蜜1大匙

做法 餅皮部份： 

1.將麵粉過篩，蛋打散。在大碗中置麵粉，一面緩緩注入牛奶、
蛋汁與蜂蜜，一面攪拌。用4支筷子攪打麵糊至均勻，最後倒入
蔬菜油攪拌。 

2.在平底煎鍋中抹上薄薄一層油，當鍋熱時，把3大匙份量的麵
糊注入鍋中，用中火煎2、3分鐘。至表面浮起泡泡狀的突起，翻
面，繼續煎至略焦黃。其餘麵糊用同樣方式煎好備用。

餡料部份：

1.先將葡萄乾浸泡在1大匙水中15分鐘，加入蜂蜜與檸檬汁。另
備大碗置水果丁，把葡萄乾連汁倒入攪拌即成餡料。

食用: 1.冷食：在每片餅皮中包少許餡料，對折成半圓形或包成
枕頭狀，即可食用。 2.熱食：將包好的餡餅置於鋪了鋁箔的烤
盤上，上面覆蓋另一層鋁箔。在已預熱的至攝氏180度的烤箱中，
烤10分鐘左右使之熟透；也可包覆鋁箔後置於鍋中，在爐火上用
中火加熱
"""

