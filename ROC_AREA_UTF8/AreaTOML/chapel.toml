argument = "topic"
script = """
if is_qmark($n) == chapel_question 100000
		say 冒險者阿，你是來這裡尋找邪惡的嗎？(yes/no)
	else
		say 冒險者阿，你為何會來到這個地方？
	endif
"""
[[mobiles.3412.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == chapel_question 100000
		mpcallout 1 say 原來如此...那麼就讓我告訴你吧...
		mpcallout 2 say 很久以前，在我還是國王的時候，我統治著整個王國
		mpcallout 3 say 那是一個繁華的時代...
		mpcallout 4 sigh
		mpcallout 5 say 但是在我臨死之前，有一個吸血鬼來到了我的床邊
		mpcallout 6 say 他告訴我將會給我永恆的生命，然後就緩緩的把我剩餘的生命吞噬了
		mpcallout 7 say 也許你已經知道了，他就是羅赫塔(Roch'tar)
		mpcallout 9 mpecho $I仔細打量著$n
		mpcallout 10 say 去吧，去把這個殘破的王國裡，那些戰士的屍體都帶過來。
		mpcallout 8 say 我想你還沒有足夠的力量對抗羅赫塔(Roch'tar)
		mpcallout 11 say 我將借由他們殘存的身體，賦予你他們剩餘的力量。
		mpcallout 12 say 快去吧，冒險者，時間不多了...
		mpcallout 12 mpmod_qmark $n chapel_question v0 = 1
	else
		say 我並沒有要你幫忙什麼事情阿，冒險者。
	endif
"""
[[mobiles.3412.programs]]
trigger = "give_prog"
argument = "3412"
script = """
if is_qmark($n) == chapel_question 100001
        	if is_qmark($n) & chapel_question 200001
                	say 我已經拿到這個道具了
                	give head $n
        	else
                	mpjunk all.head
                	mpmod_qmark $n chapel_question v1 | 1
                	say 這是祖巴的頭(head of Jubal)...
			say 它可以給帶給你智慧...
			if is_qmark($n) == chapel_question 200031
				mpmod_qmark $n chapel_question v0 = 2		
				say 藉由這些屍體，我總算凝聚了足夠的力量。
				mpcallout 1 mpecho $I的身上緩緩散發出光芒...
				mpcallout 2 mpecho $I把光芒交給了$n
				mpoload 3437 $n viclv target
				mpcallout 3 say 我把我凝聚力量交給你了...去吧，去打倒它...
				mpcallout 4 mpecho $I的身體緩緩消失在空中...
				mpcallout 5 mppurge $i
			else
				say 還請你快找來其他勇士的身體
			endif
        	endif
        else
        	say 你給我這個作什麼呢？
		drop head
	endif
"""
