[[mobiles.3405.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) != chapel_question
	say 你要重新開始什麼？
else
	if is_qmark($n) < chapel_question 100002
		mpdel_qmark $n chapel_question
		mpechoat $n 你已經可以重新開始解任務了！
	else
		tell $n 很抱歉勇者，很多事情不是能重頭來的。
		pat $n
	endif
endif
"""
[[mobiles.3405.programs]]
trigger = "talk_prog"
argument = "corpse"
script = """
if is_qmark($n) == chapel_question
		say 你已經幫了我們忙了，謝謝你
		bow $n
	else
		if is_qmark($n) != chapel_question
			mpcallout 1 ponder
			mpcallout 2 請恕我直說了...
			mpcallout 3 emote 輕輕的咳了幾下
			mpcallout 4 say 最近墓園這裡常常發生屍體被偷走或著是被破壞的情況。
			mpcallout 5 say 我懷疑這跟前一陣子教堂底下的古老陵墓被發掘有關。
			mpcallout 6 say 所以如果可以的話，希望$n你可以幫我找尋一下事情的真相。
			mpcallout 7 say 可以嗎？(yes/no)
		endif
	endif
"""
[[mobiles.3405.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) != chapel_question
		mpcallout 1 say 謝謝你願意幫忙
		mpcallout 2 say 這是往陵墓的鑰匙，我現在就交給你了。
		mpcallout 3 mpecho $I 把鑰匙交給了 $n
		mpcallout 3 mpoload 3430 $n viclv target
		mpcallout 3 mpadd_qmark $n chapel_question -1 0 0 0 0 1
		mpcallout 4 那就麻煩你了！
		bow $n
	else
		say 我並沒有拜託你什麼事情阿
	endif
"""
[[mobiles.3405.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == chapel_question 100004
		say 謝謝你上次的幫忙
		smile $n
	else
		if is_qmark($n) != chapel_question
			say 真是糟糕，這該怎麼辦阿...
			say 屍體(corpse)怎麼一直消失呢...
		endif
	endif
"""
[[mobiles.3405.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($n) == chapel_question 100003
		mpcallout 1 say 原來是吸血鬼阿...
		mpcallour 2 say 這樣大部分的事情就說的通了...
		mpcallout 3 say 辛苦你們了，這就當作獎賞吧
		mpcallout 4 mpoload 3440 $n viclv target
		mpcallout 5 mpmod_qmark $n chapel_question v0 = 4
		mpcallout 6 bow $n
		mpcallout 7 wave $n
	else
		say 你要跟我回報什麼呢？
	endif
"""

