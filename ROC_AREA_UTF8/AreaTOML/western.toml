[rooms.100527]
name = "\u001B[1;37m小築閣樓\u001B[0m"
description = """
房間內的擺設相當簡單，僅有一張單人床和一張書桌
書桌上面擺著房間主人和朋友們的照片(pictuers)
在你面前有個窗戶，透過它往外望去是一大片綠油油的草地
遠方則是頂端為白雪所覆蓋的高山
隨著開著的窗戶，房裡不時有和煦的柔風吹入。。。


          書桌上新增了一張照片(Photo)似乎是最近才放上去的
"""
flags = ["NO_MOB", "UNDERGROUND", "SAFE"]
sector = "INSIDE"
[[rooms.100527.extra_descriptions]]
keywords = "pictures"
description = """
有幾張照片擺在桌上，分別是房間主人Windfox和朋友們的照片
首先是Fire'S的合照，有著Sword，Hyuk，Wendell，Cgc，Roger以及Windfox。
一張則是創幫的元老們的合照，有著Western，Cysefa，Sword，Vvcc，Xinef。
再來幾張是幫友們的合照：有流氓組的米羅和阿教，悶燒組的小樹和Hyuk，
CF3(Come from 3Y)的Mesawa，Chinko，Aio，魚丸，荔枝。
還有最猛的飛魚Hippo，給Fox很感覺很乖的Still。
還有創立貓國的小貓，辛苦兼職貓國總理大臣的Desk。
最後幾張則是凡特錫溫柔的大姊姊Vashiwa，和凡特錫鎮幫之寶Diary
以及凡特錫中唯一的小羅莉-薰兒
"""
[[rooms.100527.extra_descriptions]]
keywords = "photo"
description = """
照片裡面的女子是Windfox的乾姐
面對攝影機的她似乎有點不自然
據說對Windfox來說,她是一個重要性不止於姐弟關係的人
"""

