                        mpcallout 3 tell $n 我們與他們本來是相安無事，不過啊......
                        mpcallout 4 glare
                        mpcallout 5 tell $n 好幾年前，我們和他們起了爭執，後來事情鬧大了，雙方就開始冷戰。
