[[mobiles.80100.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
mpadd_qmark self delayed_stun -1 0 0 0 1 0
group form
"""
[[mobiles.80100.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == malathar_enemy
        yell 可惡的瑪拉勒之敵！我要驅逐你！
        mpkill $n
else
        if ispc($n)
                tell $n 我以瑪拉勒統治者之名，歡迎你蒞臨此地。
                hello $n
        endif
endif
"""
[[mobiles.80100.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) != malathar_talking
        if is_qmark($n) == malathar_quest 100029
                if is_qmark($n) != malathar_enemy
                        mpmod_qmark $n malathar_quest v0 = 30
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        nod $n
                        mpcallout 1 tell $n 你的事我已經聽說了，在此我得先感謝你來回奔波。
                        mpcallout 2 tell $n 能讓向來與我們瑪拉勒不和的愛潔梅菲同意和談，你的確是傑出的人才。
                        mpcallout 3 tell $n 不過仍然有點晚了，黑暗勢力已經接近，攻過來只是遲早的事。
                        mpcallout 4 tell $n 你如果要離開此地的話最好快點，等到敵人進犯時再逃就太晚了。
                        mpcallout 5 tell $n 如果你要出城，先跟奧勒塔撒拉確認一下，免得碰上敵人。
                        mpcallout 6 wave $n
                        mpcallout 6 mpdel_qmark self malathar_talking
                endif
        else
                tell $n 我以瑪拉勒統治者之名，歡迎你蒞臨此地。
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.80100.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($i) != malathar_talking
        if is_qmark($n) == malathar_quest 100042
                if is_qmark($n) != malathar_enemy
                        mpmod_qmark $n malathar_quest v0 = 43
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        say 這真是太令人意外了......
                        gasp
                        mpcallout 1 tell $n 我知道了，你的情報很有價值，謝謝你的協助。
                        mpcallout 2 tell $n 我會派人去把整件事情調查清楚的，放心吧！
                        mpcallout 3 mpgold $n 5000000
                        mpcallout 4 wave $n
                        mpcallout 4 mpdel_qmark self malathar_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.80100.programs]]
trigger = "give_prog"
argument = "80190"
script = """
if is_qmark($i) != malathar_talking
        if is_qmark($n) == malathar_quest 100042
                if is_qmark($n) != malathar_enemy
                        mpmod_qmark $n malathar_quest v0 = 43
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        mpjunk $o
                        ? $n
                        mpcallout 1 mpecho $I翻開攻擊計畫書看了看，並找來一名翻譯官。
                        mpcallout 3 mpecho 翻譯官將內容正確無誤地翻譯出來。
                        mpcallout 5 mpecho 沒多久，$I的臉色變了。
                       mpcallout 6 say 敵人竟然已經佈署這麼久了，我們卻沒有妥善防備，真是失策！
                        mpcallout 7 tell $n 做得好，不愧是托爾與漢恩他們極力推荐的人材，果然有一套。
                        if resp($n) < 70
                        or is_qmark($n) != enable_level_41
                        or is_qmark($n) != sandrock_questmark 100255
                        or is_qmark($n) !& sealevil_quest 100002
                        or is_qmark($n) != Ageemephy_questmark 100511
                        or is_qmark($n) != malathar_quest 200045
                                mpcallout 8 tell $n 經過這次教訓，我們以後會更加提高警覺，不會再被敵人得逞了。
                                mpcallout 9 tell $n 我必須好好酬謝你，勇者。
                                mpcallout 10 mpcall malathar_hiddenpower $n
                                mpcallout 10 mpexp $n 30000
                                mpcallout 10 mpskillexp $n 25000
                                mpcallout 10 mpresp $n 3
                                mpcallout 11 tell $n 再見了！勇者！
                                mpcallout 12 wave $n
                        else
                                mpcallout 8 tell $n 經過這次教訓，我們以後會更加提高警覺，不會再被敵人得逞了。
                                mpcallout 9 mpecho $I從一旁的白金玻璃櫃中取出一個裝著戒指的精緻木盒。
                                mpcallout 10 tell $n 請收下這枚代表榮耀與英勇的戒指，這是真正勇者的象徵！
                                mpcallout 11 tell $n 你的名字將會永遠留在本城的紀念碑之上！
                                mpcallout 12 mpechoat $n $I將戒指小心翼翼地交付到你手中。
                                mpcallout 13 mpcall malathar_hiddenpower $n
                                mpcallout 13 mpexp $n 50000
                                mpcallout 13 mpskillexp $n 35000
                                mpcallout 13 mpresp $n 3
                                mpcallout 13 mpoload 80189 $n 36 target
                                mpcallout 14 tell $n 再見了！勇者！
                                mpcallout 15 wave $n
                        endif
                        mpcallout 14 mpdel_qmark self malathar_talking
                endif
        else
                ? $n
                give $o $n
        endif
else
        mpechoat $n 別人講話時不要插嘴。
        give $o $n
endif
"""
[[mobiles.80100.programs]]
trigger = "defun_prog"
argument = "malathar_hiddenpower"
script = """
if is_qmark($n) == max_skill_exp
        mpmod_qmark $n max_skill_exp v0 + 10
else
        mpadd_qmark $n max_skill_exp -1 10 0 0 0 1
endif
mpechoat $n 你感到自身潛在的力量覺醒了！
"""
[[mobiles.80100.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) != malathar_enemy
        mpadd_qmark $n malathar_enemy 24 0 0 0 0 1
endif
if rand(25)
        say 風啊，助我粉碎敵人身上的防護！
        mpecho $I召來一陣侵略的強風！
        cast 2 'crushing hand' $r
        mpnowait
        cast 'double heal'
        mpnowait
        cast 'double heal'
        mpnowait
        cast 'double heal'
        mpnowait
else
        if rand(33)
                say 裁決之劍！
                mpecho $I高舉武器，使出威力強大的劍法！
                perform empslash
                mpnowait
        else
                if rand(50)
                        say 冰啊，撕裂眼前的敵人！
                        mpecho 空氣中的水份在一瞬間凝固成堅冰！
                        icecore
                        mpnowait
                else
                        mpechoat $n 當你正忙著與$I戰鬥時，一個鬼鬼祟祟的傢伙忽然自背後捅了你一刀！
                        mpforcer here add_affect $n tardy 1040 10 34 150 4096
                endif
        endif
endif
"""
[[mobiles.80100.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self all
mpat 5 cast 'detect hidden'
mpat 5 cast 'detect invis'
mpat 5 cast infravision
if is_qmark($n) != malathar_enemy
        mpadd_qmark $n malathar_enemy 200 0 0 0 0 1
else
        mpmod_qmark $n malathar_enemy timer + 50
endif
cast armageddon $n
mpnowait
"""

