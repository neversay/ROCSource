                        mpechoat $n 你將先前從大法師托爾那裡聽來的東西略為描述了一遍。
                        mpcallout 1 mpechoat $n $I緩緩張開雙眼，打量了你幾下......
                        mpcallout 2 tell $n 你已經知道這兩個勢力的冷戰狀態，那我也不用多說了。
                        mpcallout 3 tell $n 首先我要為你的英勇表示敬意，感謝你除去了城內那股異常的力量。
                        mpcallout 4 tell $n 至於托爾所說的話是對的，雙方必須同心協力才能抵禦這共同的敵人。
                        mpcallout 5 tell $n 但是，南方島嶼的狀況與瑪拉勒不同......
                        mpcallout 6 yawn
                        mpcallout 7 tell $n 瑪拉勒基本上是公爵獨攬大權，南方島嶼那邊卻不一樣。
                        mpcallout 8 tell $n 除了村長與長老以外，島上的賢者、巫女、民兵隊長在島上都具有不小的影響力。
                        mpcallout 9 tell $n 人多嘴雜，所以即使瑪拉勒有意和談，對方也不見得會有善意回應。
                        mpcallout 10 tell $n 如果你能說服雙方，那麼鐵定是大功一件，就看你有沒有這個意願與能力了......
                        mpcallout 11 tell $n 要是你有興趣，可以先與他們的巫女談談，就說是我漢恩(Haan)派你去的。
                        mpcallout 11 mpdel_qmark self malathar_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.80104.programs]]
trigger = "talk_prog"
argument = "Hailock"
script = """
if is_qmark($i) != malathar_talking
        if is_qmark($n) == malathar_quest 100026
                if is_qmark($n) != malathar_enemy
                        mpmod_qmark $n malathar_quest v0 = 27
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        mpechoat $n 你把之前發生的事，以及海拉克長老所說的全都告訴了$I。
                        mpcallout 1 mpechoat $n $I緩緩張開雙眼，打量了你幾下......
                        mpcallout 2 tell $n 比想像中的還要順利，現在就差臨門一腳了。
                        mpcallout 3 tell $n 要是托爾勸服不了公爵，必要的時候只好靠我出馬了......
                        mpcallout 4 tell $n 至於對方的長老所指的......應該是這個。
                        mpcallout 5 mpechoat $n $I龍尾忽然掃過你頭上，接著一個小東西落到你的手中。
                        mpcallout 6 mpoload 80179 $n 36 target
                        mpcallout 6 tell $n 將這個東西交給他，他應該就明白了，假如弄丟(lost)的話再來找我。
                        mpcallout 6 mpdel_qmark self malathar_talking
                endif
        endif
        if is_qmark($n) == malathar_quest 100028
                if is_qmark($n) != malathar_enemy
                        mpmod_qmark $n malathar_quest v0 = 29
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        tell $n 做得很好，另外我也有好消息，就是公爵終於答應和解了。
                        mpcallout 1 tell $n 雖然讓他同意的手段稍微粗暴了一點......
                        mpcallout 2 tell $n 你辛苦了，再來應該就沒你的事了。
                        mpcallout 3 tell $n 這是給你的酬勞，感謝你這麼熱心協助。
                        mpcallout 4 mpexp $n 50000
                        mpcallout 4 mpskillexp $n 20000
                        mpcallout 4 mpoload 80180 $n 36 target
                        mpcallout 4 mpdel_qmark self malathar_talking
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
