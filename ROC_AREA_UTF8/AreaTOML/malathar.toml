endif
"""
[[mobiles.80126.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) != malathar_enemy
        mpadd_qmark $n malathar_enemy 24 0 0 0 0 1
endif
if rand(25)
        cast 2 powerball $r
        mpnowait
else
        if rand(33)
                mpgoto self
                cast 'mystic mirror'
                mpnowait
                cast 'mystic armor'
                mpnowait
                cast 'flaming armor'
                mpnowait
                mpkill $r
        else
                if rand(50)
                        cast blindness $r
                        mpnowait
                        cast blindness $n
                        mpnowait
                        cast weaken $r
                        mpnowait
                        cast weaken $n
                        mpnowait
                else
                        mpechoat $n 當你正忙著與$I戰鬥時，一個鬼鬼祟祟的傢伙忽然自背後捅了你一刀！
