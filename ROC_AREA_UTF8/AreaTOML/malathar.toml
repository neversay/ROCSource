                        tell $n 也對，這種事應該告訴外地人，有空我派人去貼個告示。
                        mpcallout 1 ponder
                        mpcallout 2 tell $n 前陣子城外有一些邪惡的生物，專門騷擾路過的人。
                        mpcallout 3 tell $n 雖然威脅性不大，不過也總不能放著不管。
                        mpcallout 4 tell $n 總之你平常要多留意點。
