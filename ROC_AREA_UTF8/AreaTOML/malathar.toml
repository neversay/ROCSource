                                mpcallout 2 say 這個傢伙的靈魂與記憶已經被我消化了，再來就輪到你了！
                                mpcallout 3 mpecho 瞬間，$I的身體開始漲大，逐漸變成一隻肥壯的巨大惡魔！
                                mpcallout 4 mpecho 同時，他背後也出現了兩名恐怖的美麗魔女！
                                mpcallout 5 mpecho 要是你打不過他們，那麼至少也得告知(report)公爵這個情報！
                                mpcallout 6 mpecho 以免到時讓他們跑了，而使得公爵他們失去了反制先機！
                                mpcallout 6 mpmload 80162
                                mpcallout 6 mpmload 80163
                                mpcallout 7 mpmload 80161
                                mpcallout 8 mpgoto 5
                                mpcallout 9 mppurge self
                        endif
                endif
        endif
endif
"""
[[mobiles.80126.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) != malathar_talking
        if is_qmark($n) == malathar_quest 100039
                if is_qmark($n) != malathar_enemy
                        mpadd_qmark self malathar_talking 10 0 0 0 0 1
                        mpmod_qmark $n malathar_quest v0 = 40
                        tell $n 哼，那個最近很活躍的外地傢伙就是你啊？
                        mpcallout 1 mpechoat $n $I似乎不怎麼把你放在眼裡的樣子。
                        mpcallout 2 tell $n 你給我聽好，我不管你之前做了什麼事，總之我們不需要你的幫忙。
                        mpcallout 3 tell $n 瑪拉勒的事由我們瑪拉勒自己解決，你懂了嗎？
                        mpcallout 4 tell $n 知道的話就快點離開這裡，否則一旦被惡魔殺死就是你自己倒楣了。
                        mpcallout 5 mpechoat $n ......還真如托爾所說的，這傢伙可真不友善啊。
                        mpcallout 5 mpdel_qmark self malathar_talking
                endif
        else
                if ispc($n)
                        tell $n 抱歉抱歉，之前出了一點小事，物品鑑定服務暫時停止中。
                endif
        endif
else
