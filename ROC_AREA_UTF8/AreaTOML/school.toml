[[mobiles.3720.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
if isnpc($n)
or level($n) > 9
or is_qmark($n) != school_adept_quest
or is_qmark($n) & school_adept_quest 100008
        break
endif
mpmod_qmark $n school_adept_quest v0 | 8
mpechoat $n 一陣慈祥的聲音從牆壁後傳來：
mpechoat $n 新手學校校長說：恭喜你，$N，你畢業了！
mpechoat $n 新手學校校長說：你已完成 Mud School 的學業，現在是出外見廣大世界的時候。
mpechoat $n 新手學校校長說：你可以先到/dsse和/dssw增加技能及屬性，然後再到史卡拉貝城逛逛。
mpechoat $n 新手學校校長說：記住，ROC的BBS和homepage都有許多有用的資料，知識就是力量！
if race($n) != Beholder
        mpechoat $n 新手學校校長說：最後建議你去聖殿(/)找睿智長者(elder) -> "talk elder"
endif
"""

[mobiles.3721]
keywords = "principal"
short_description = "新手學校校長(Principal)"
long_description = "新手學校校長(Principal)正在這裡歡迎你的到來.\n"
description = """
嗯... 看見校長是否該鞠躬(bow)呢?
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "REGENERACY"]
affected_flags = ["DETECT_EVIL", "DETECT_INVIS", "DETECT_MAGIC", "DETECT_HIDDEN", "SANCTUARY"]
alignment = 1000
level = 51
mod_hitplus = 2000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 10
mod_ac = -200
mod_svs = -20
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "MAGE"]
spec_flags = ["NO_DM", "NO_BLIND", "NO_CHARM", "NO_CRAZY"]
[[mobiles.3721.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if class($n) < 5
        if level($n) <= 15
                if rand(50)
                        tell $n 在等級 15 以前，如果你的移動力不足....，
                        tell $n 可以來找我喔(talk principal refresh)！
                        tell $n 我可以給你一些適當的幫助。
                else
                        tell $n 如果你的移動力不足可以來找我喔(talk principal refresh)！
                        tell $n 我可以在適當的時限內幫助你恢復移動力。
                endif
        endif
endif
"""
[[mobiles.3721.programs]]
trigger = "talk_prog"
argument = "refresh"
script = """
if class($n) < 5
        if level($n) <= 15
                if is_qmark($n) != school_newbie_refresh
                or is_qmark($n) <= school_newbie_refresh 100002
                        if is_qmark($n) != school_newbie_refresh
                                mpadd_qmark $n school_newbie_refresh 50 0 0 0 0 1
                        endif
                        if is_qmark($n) <= school_newbie_refresh 100002
                                mpmod_qmark $n school_newbie_refresh v0 + 1
                        endif
                        nod $n
                        c 'full refresh' $n
                        mpnowait
                else
                        shake $n
                        if rand(50)
                                tell $n 在一定的期限內，我還不能夠幫你施展法術。
                        else
                                tell $n 你使用我的幫助太頻繁咯！
                        endif
                endif
        else
                tell $n 你的等級太高了。
        endif
else
        tell $n 只有尚未轉職的職業才能夠接受這項優惠。
endif
"""
[[mobiles.3721.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 你好！
say 新手是負責教導新手冒險家基本生存技能的地方
say 希望這裡的課程能對您往後的冒險生涯有益處
"""
[[mobiles.3721.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if isnpc($n)
        mpecho $I 用疑惑的眼光打量著 $N。
        say 對不起！這裡並不歡迎非玩家的 Mob.
        mpecho $I 把$N送走了....。
        mppurge $n
        break
endif
if level($n) < 10
        smile $n
        mpechoat $n $I說 '輸入help，就可以看到混沌幻世的說明喔!'
        if hitprcnt($n) < 35
                mpechoat $n $I說 '喔, 你不小心受傷啦?'
                mpechoat $n $I說 '讓我來幫你治療吧'.
                cast heal $n
        endif
endif
if isimmort($n)
        bow $n
endif
"""
[[mobiles.3721.programs]]
trigger = "fight_prog"
argument = "100"
script = """
mpgroup self acolyte 1 0
if rand(30)
        say 學校中絕不允許暴力的存在!
        say 以神之名, 召喚聖火, 驅盡一切邪惡!
        cast 'angry fire' $n
        mpnowait
endif
"""

