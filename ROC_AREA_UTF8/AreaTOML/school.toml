description = """
使用'SCORE'可以查看你詳細的屬性資料。你的等級越高，列出的資料會越詳細。

西邊是基本屬性訓練室可以讓你提高你的基本屬性。
東邊的魔法訓練室可以讓你練習你的技能和魔法。

如果你還沒有訓練過，最好先到東西兩間房間裡去一趟(輸入east 或 west)，
完成訓練後回來這裡繼續向南走。
"""
