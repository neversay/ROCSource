keywords = "book"
description = """
以下是渾沌幻世常用指令列表，給新進冒險者參考用：

exam 物品名 : 終極版本的look,可以看到物品的絕大部份資訊!
look :  看看現在四周環境。
look 物品名/人名 : 仔細觀察這個人/物品。
talk 生物名 : \u001B[1;33m向非玩家生物打聽消息，很有用。\u001B[0m
talk 生物名 關鍵字 : 向非玩家生物打聽特定消息。
score : 看看自己目前的狀況。
eq :    看看自己身上穿了什麼。
inv :   看看自己身上帶了什麼。
get 物品名 : 撿起某個東西。
get all 物品名 :把放在某物品裡的東西全拿出來。通常是把屍體裡的裝備揀出來。
drop 物品名 : 丟下某個東西。
open 方向 : 打開那個方向的門。
unlock 方向 : 把那個方向的鎖打開。
wear 物品名 : 穿上某件裝備。
remove 物品名 : 脫下某件裝備。
eat 食物名 : 吃東西。
drink 容器名 : 喝水。
kill 生物名 : 攻擊該生物。
flee : 打不過時，逃跑。
cast 法術名 : 施展該法術。(你要先學會才行)
sleep : 躺下來睡覺恢復生命、體力。
wake : 離開睡覺的狀態。
who :  看看現在有哪些玩家正在線上。
question 問題 : 向其他玩家詢問你想問的問題。
tell 玩家名 訊息 : 告訴某特定玩家一些事。
save : 儲存遊戲進度
quit : 離開遊戲。
"""
[[objects.3733.applies]]
type = "HITROLL"
value = 2

