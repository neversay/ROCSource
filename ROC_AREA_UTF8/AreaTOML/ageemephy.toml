                        mpcallout 4 tell $n 那就是，創造出一個空白的靈魂，然後注入他妻子的記憶......
                        mpcallout 5 tell $n 難度的確是非常高，但是如你所見，他根本沒有放棄的念頭。
                        mpcallout 6 tell $n 心靈術、魔藥、古代秘文、遺跡與法器、一直到現在的魔法陣研究。
                        mpcallout 7 tell $n 容我說一句實話，他這種念頭，是一種會給亡者帶來強烈苦痛的縛鎖。
                        mpcallout 8 tell $n 亡者會被生者的思念所束縛，尤其是像他這麼強烈的意念，要掙脫根本辦不到。
                        mpcallout 9 tell $n 很可惜的，即使我告訴他這一點，他也完全不為所動。
                        mpcallout 10 mpechoat $n $I輕輕搖了搖頭，在她嘆息的同時，臉上露出略為憂心的神情。
                        mpcallout 11 tell $n 這樣下去對活著以及死去的人都不是好事，雙方現在都是活在苦痛之中。
                        mpcallout 12 tell $n 我沒有辦法讓他斷絕這份強烈的意念，但我至少要讓他無法接觸禁忌。
                        mpcallout 13 tell $n 只不過他現在可能也很不想看到我，因此需要你的協助(help)。
                        mpcallout 13 mpmod_qmark $n Ageemephy_quest_F v0 = 8
