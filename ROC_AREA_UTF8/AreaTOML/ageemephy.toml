                        mpadd_qmark $n TideIsland_questmark -1 0 0 0 0 1
                endif
                if is_qmark($n) != TideIsland_quest_A
                        if is_qmark($n) & TideIsland_questmark 200001
                        or resp($n) < 45
                                curse $n
                                say 走開！不要來煩我！
                        else
                                mpadd_qmark self TideIsland_talking 10 0 0 0 0 1
                                sigh 
