trigger = "room_enter"
argument = "127 100"
script = """
if is_qmark($n) == Ageemephy_quest_H 100003
        if is_qmark($n) == Ageemephy_quest_H 300003
                echoat $n 當你剛來到這裡，你身上那兩朵花忽然脫離了你的身體，自動沉到墓碑上頭。
                echoat $n 一股平和的感覺充斥著全身，令你相當舒服。
                if is_qmark($n) != Ageemephy_quest_H 200001
                        mload 70931
                        force aspiddy-is mpexp $n 2500
                        force aspiddy-is mpskillexp $n 5000
                        mod_qmark $n Ageemephy_questmark v0 | 128
                        del_qmark $n Ageemephy_quest_H
                        purge aspiddy-is
                else
                        mod_qmark $n Ageemephy_quest_H v0 = 4
                        if rmobcount(70931) == 0
                                echoat $n 愛絲碧緹不在這裡，或許你該試著再吹奏一次風笛看看。
                        else
                                echoat $n 在你獻完花朵後，只見愛絲碧緹正打量著你，似乎有什麼話想對你講。
                        endif
                endif
        endif
endif
"""
[[rooms.71049.programs]]
trigger = "room_command"
argument = "play bagpipe"
script = """
if ispc($n)
        if is_equ_obj($n) == 70925
                if is_qmark($n) != Ageemephy_questmark
                        add_qmark $n Ageemephy_questmark -1 0 0 0 0 1
                endif
                if is_qmark($n) != Ageemephy_quest_H
                        if is_qmark($n) !& Ageemephy_questmark 100128
                                add_qmark $n Ageemephy_quest_H -1 3 1 0 0 1
                        endif
                endif
                if rmobcount(70931) == 0
                        echoat $n 當你吹奏風笛的同時，墓碑上突然浮現出淡藍色的發光體......
                        mload 70931
                endif
                callout 1 force Aspiddy-is say 好懷念的風笛聲哪......
                callout 2 force Aspiddy-is say 旅人，能否請你帶著花朵，再到這裡來一趟呢？
                callout 3 force Aspiddy-is say 島上有位木雕高手以及一名巫女，請你向他們拿取獻祭用的鮮花......
        else
                if is_equ_obj($n) != 11523
                        echoat $n 你哪來的風笛可以吹奏？
                else
                        echoat $n 你忽然聽到湖中傳來冰雪女神憤怒的聲音----
                        echoat $n 「竟然想拿這種東西濫竽充數？你給我差不多一點～～！！」
                        echoat $n 一股強大的水壓差點當場壓扁你的身體！呃啊！
                        modhmv $n 03.100 100 0
                endif
        endif
endif
"""

