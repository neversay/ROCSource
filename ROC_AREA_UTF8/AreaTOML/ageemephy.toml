                                sigh 
                                mpcallout 1 say 一切都是我的錯......我對自己的實力太有自信了......
                                mpcallout 2 say 要不是我提議去探險，我那些好朋友(friends)也不會死在那裡......
                                mpcallout 3 say 死在那座無名的古代祭壇遺跡......
                                mpcallout 3 mpadd_qmark $n TideIsland_quest_A -1 1 0 0 0 1
                                mpcallout 3 mpdel_qmark self TideIsland_talking
                        endif
                endif
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70957.programs]]
trigger = "talk_prog"
argument = "friends"
script = """
if is_qmark($i) != TideIsland_talking
        if is_qmark($n) == TideIsland_quest_A 100001
                mpadd_qmark self TideIsland_talking 10 0 0 0 0 1
                say 我那三個朋友...蕾兒，賽路爾，菲夏特，我們在一起冒險很久了。
                mpcallout 1 mpechoat $n 在說這些話的時候，$I的表情一直很陰沉。
                mpcallout 2 say 上次我們聽說這一帶有座古代祭壇遺跡，然後......
                mpcallout 3 say 都是我不好，我提議去一探究竟，結果我們在往祭壇的道路上碰到了大量的敵人！
                mpcallout 4 sad $n
                mpcallout 5 say 而且敵人種類也有好幾種，像是劍兵、魔獸、狼人等等。
                mpcallout 6 say 我們雖然奮力應戰，但是敵人的數量實在太多了......
                mpcallout 7 say 最後我失去意識，等我醒過來已經躺在病床上，救我的是一個牛頭人。
                mpcallout 8 say 他告訴我，當他看到我們時，我的摯友們已經戰死，我也受了足以致命的重傷。
                mpcallout 9 say 最後，他留給我一句話：「你跟過去的我很像，我也因為自己的疏失而死了兩個好友。」
                mpcallout 10 sigh
                mpcallout 11 say 算了......傷心事就不要再講了。
                mpcallout 12 mpechoat $n 他看起來似乎真的很難過......不過，他所說的那座古代祭壇遺跡在哪裡(where)？
                mpcallout 12 mpmod_qmark $n TideIsland_quest_A v0 = 2
                mpcallout 12 mpdel_qmark self TideIsland_talking
        else
                say 蕾兒，賽路爾，菲夏特......我對不起你們......
                sad
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70957.programs]]
trigger = "talk_prog"
argument = "where"
script = """
if is_qmark($i) != TideIsland_talking
        if is_qmark($n) == TideIsland_quest_A 100002
                mpadd_qmark self TideIsland_talking 10 0 0 0 0 1
                mpechoat $n 聽到你這麼問，$I的表情稍微起了變化。
                mpcallout 1 say 你問那座古代祭壇遺跡在哪？
                mpcallout 2 say 雖然我知道怎麼去，但是我就算告訴你，你也沒辦法去。
                mpcallout 3 say 去問這座島上那個獨居的老巫師吧，他應該有辦法......
                mpcallout 4 say 不過，那裡真的很危險啊......唉......
                mpcallout 4 mpmod_qmark $n TideIsland_quest_A v0 = 3
                mpcallout 4 mpdel_qmark self TideIsland_talking
        else
                say 古代祭壇遺跡的位置？去問這座島上那個獨居的老巫師吧。
