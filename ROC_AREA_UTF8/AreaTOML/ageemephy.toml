[[mobiles.70919.programs]]
trigger = "talk_prog"
argument = "foreigner"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_D 100003
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 那是很久以前的事，有多久我也不記得了......
                        mpcallout 1 tell $n 當時有一名黑髮黑瞳的劍客來到島上，好像是雲夢大陸的人吧。
                        mpcallout 2 tell $n 他沒有名字，不過由於他穿得一身漆黑，我們就以黑武者之名稱呼他。
                        mpcallout 3 tell $n 那個人的劍術相當高超，人也相當地和善，不過就是話少了一點。
                        mpcallout 4 tell $n 印象中他在島上待了十幾年吧，後來就搬離島上。
                        mpcallout 5 tell $n 因為他在島上待了好幾年後，愛上了某位少女，並且有了後代。
                        mpcallout 6 tell $n 但也因為有了後代，所以那位少女就這麼去世了，因為難產......
                        mpcallout 7 mpechoat $n 你忽然發現$I的表情沉了下來，這件事對他來說好像有著某種意義。
                        mpcallout 8 tell $n 後來少女的遺體被火化，骨灰與當時生下的女兒都被他一起帶走了。
                        mpcallout 9 tell $n 在他離去之前，他花上一年多的時間建造劍之間，將一把劍放在裡面。
                        mpcallout 10 tell $n 直到他搬走為止，大家都不曉得他的用意是什麼。
                        mpcallout 11 tell $n 一直到六年前的那次惡魔暴亂事件，本來我們是沒有勝算的。
                        mpcallout 12 tell $n 然而保存在劍之間的那把劍卻自己飛了出來，將惡魔的力量抑制住。
                        mpcallout 13 tell $n 雖然有一半原因也是惡魔突然停止攻擊......不過那不是重點。
                        mpcallout 14 tell $n 在那次事件後，那把劍受到惡魔邪氣的污染，開始產生異常變化。
                        mpcallout 15 mpechoat $n 當$I說到這裡的時候，你發現在一瞬間，他的表情有著微妙的變化。
                        mpcallout 16 tell $n 隨著邪氣與日俱增，最後我們不得不封閉劍之間，並派人看守。
                        mpcallout 17 tell $n 現在已經六年了，那把劍的邪氣已經不曉得變得多強了。
                        mpcallout 18 tell $n 我雖然想把那把劍取回，設法將它淨化，可是現在我的肉體已經老朽不堪。
                        mpcallout 19 mpechoat $n $I緩緩抬起頭，以期盼的眼光打量著你。
                        mpcallout 20 tell $n 或許這個要求很無理也很唐突，年輕的冒險者啊......
