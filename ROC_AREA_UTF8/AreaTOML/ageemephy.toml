if ispc($n)
        if is_qmark($n) != Ageemephy_enemy
                mpechoat $n 她什麼話也沒說，只是對你點了點頭。
                mpechoat $n 儀態十分自然優雅，給人一種相當舒服的感覺。
                if is_qmark($n) & Ageemephy_questmark 100001
                        mpechoat $n 她對你微笑著，這個笑容還真是可愛......
                endif
        else
                tell $n ............
        endif
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "silence"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_A 100002
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 看起來，這件事好像鬧得越來越大了......
                        mpechoat $n $I皺了皺眉頭，似乎很傷腦筋的樣子。
                        mpcallout 1 tell $n 既然如此，多一個人知道也沒什麼關係。
                        mpcallout 2 tell $n 好吧，我就把事情(event)的經過告訴你。
                        mpcallout 3 tell $n 雖然我已經講過很多次了......
                        mpcallout 3 mpmod_qmark $n Ageemephy_quest_A v0 = 3
                        mpcallout 3 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "event"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_A 100003
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 事情是這樣的，幾個月前的某天早上，村裡的人忽然發現神像上面有血跡。
                        mpcallout 1 tell $n 村民們原本以為有人在這裡打架，可是周圍並未留下打鬥的痕跡。
                        mpcallout 2 tell $n 前一晚我有事不在家，所以我也不清楚發生了什麼事。
                        mpcallout 3 tell $n 然而從那天開始，原本會開口賜予神諭的神像，就再也沒發出聲音。
                        mpcallout 4 tell $n 我們雖然把血跡清洗掉，也舉行了祭祀儀式，但是一點用也沒有。
                        mpcallout 5 tell $n 漸漸地，村民們開始不安了......
                        mpcallout 6 tell $n 我雖然想過幾個主意(idea)，可是實際操作起來都有麻煩。
                        mpcallout 6 mpmod_qmark $n Ageemephy_quest_A v0 = 4
                        mpcallout 6 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "idea"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_A 100004
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 啊？這、這個嘛......
                        mpcallout 1 tell $n 有幾個主意不太好意思提，請、請你不要問那麼多了。
                        mpcallout 2 mpechoat $n 只見$I的臉微微紅了起來，該不會是一些色色的主意吧......
                        mpcallout 3 mpechoat $n 她似乎發現說錯了話，連忙轉移話題。
                        mpcallout 4 tell $n 扣掉、扣掉那些，有一個方法是這樣的......
                        mpcallout 5 tell $n 我有個朋友曾經在某片沙漠的地底下發現一個奇怪的藏書庫。
                        mpcallout 6 tell $n 他說那些書的名字都很奇怪，不過裡面的知識卻還算滿好用的。
                        mpcallout 7 tell $n 我也曾經想過請他替我找，可是他已經很久沒回來過了。
                        mpcallout 8 tell $n 我自己也沒辦法到那麼遠的地方去，所以......
                        mpcallout 8 mpmod_qmark $n Ageemephy_quest_A v0 = 5
                        mpcallout 8 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_A 100006
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        mpechoat $n 你將從那本怪書上所抄下來的重點筆記交給她。
                        mpcallout 1 mpechoat $n 她看了看筆記的內容，臉上露出三條黑線。
                        mpcallout 2 tell $n 這，這真的有用嗎？感覺好奇怪......
                        mpcallout 3 tell $n 不過，現在也沒有其他辦法，只好試試看了。
                        mpcallout 4 tell $n 總之你跑這一趟辛苦了，在此感謝你的幫助。
                        mpcallout 5 tell $n 那麼就讓我喚醒你的潛在力量，當成是謝禮吧......
                        mpcallout 6 mpexp $n 20000
                        mpcallout 6 mpskillexp $n 15000
                        mpcallout 6 mpcall Ageemephy_hiddenpower $n
                        mpcallout 6 mpmod_qmark $n Ageemephy_questmark v0 | 1
                        mpcallout 6 mpdel_qmark $n Ageemephy_quest_A
                        mpcallout 7 bow $n
                        mpcallout 7 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "truth"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_A 100010
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 什麼......！潔、潔璐雅？！她還活著？
                        mpechoat $n 她愣在原地，這個消息令她非常地意外。
                        mpcallout 1 tell $n 我一直以為她在小時候就去世了......沒想到竟然會是...這樣...
                        mpcallout 2 tell $n 現在我明白了......神諭，就讓它到此為止吧......
                        mpcallout 3 sigh
                        mpcallout 4 tell $n 村民們短期內可能會感到不安，不過時間能沖淡一切的。
                        mpcallout 5 tell $n 話說回來，雖然你這麼熱心，但是很抱歉，我也沒有什麼好回報的。
                        mpcallout 6 tell $n 我的力量很小，能做到的也只有這樣......
                        mpcallout 7 tell $n 就讓我導出你的潛在力量......願冰雪的守護之力與你同在......
                        mpcallout 7 mpskillexp $n 20000
                        mpcallout 7 mpcall Ageemephy_hiddenpower2 $n
                        mpcallout 7 mpmod_qmark $n Ageemephy_questmark v0 | 1
                        mpcallout 7 mpmod_qmark $n Ageemephy_questmark v1 | 1
                        mpcallout 7 mpdel_qmark $n Ageemephy_quest_A
                        mpcallout 8 bow $n
                        mpcallout 8 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "study"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_F 100005
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 你說什麼？史提夫又在進行他的研究了？
                        mpechoat $n $I露出擔憂的神情。
                        mpcallout 1 tell $n 我早已經警告過他，那是凡人不能任意碰觸的禁忌(taboo)......
                        mpcallout 2 tell $n 看起來，他恐怕已經完全聽不進去了......
                        mpcallout 2 mpmod_qmark $n Ageemephy_quest_F v0 = 6
                        mpcallout 2 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
                mpjunk $o
        endif
else
        mpechoat $n 別人講話時不要插嘴。
        drop $o
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "taboo"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_F 100006
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 死者操控、靈界對話、開啟異界門扉與死者復甦都只是表面，他想要做的是靈魂培育！
                        mpcallout 1 tell $n 也就是用人工的方式製造出靈魂，這可是禁忌啊！
                        mpcallout 2 mpechoat $n 她有點激動，這對她來說大概真的是什麼非常不好的行為吧？
                        mpcallout 3 tell $n 要不是當年那件意外，他也不會這麼執著於這方面的研究。
                        mpcallout 4 mpechoat $n 你剛打算追問，她卻先講了出來......
                        mpcallout 5 tell $n 我是從長老那裡聽來的，應該是不會有太大的誤差。
                        mpcallout 6 tell $n 很久以前，史提夫在某次的實驗意外中，失去了他的妻子。
                        mpcallout 7 tell $n 據說他們感情非常好，因此當時他著實消沉了好一陣子。
                        mpcallout 8 mpechoat $n 她停了一下，咬了咬嘴唇，彷彿下定決心般繼續講了下去......
                        mpcallout 9 tell $n 原本是研究心靈法術的他，在她臨死之前，施展了古老的秘咒。
                        mpcallout 10 tell $n 他將她一生的記憶複製了一份，收藏在一種極為罕見的寶石裡面，以備萬一。
                        mpcallout 11 tell $n 接著他開始研究魔藥方面的學問，想要找出能讓她復活的方法。
                        mpcallout 12 tell $n 時間一久，他仍然找不到方法，於是他轉頭研究其他方面的學識。
                        mpcallout 13 tell $n 就在這時候，他聽到了某個謠傳(rumor)...讓他現在這麼熱衷的謠傳。
                        mpcallout 13 mpmod_qmark $n Ageemephy_quest_F v0 = 7
                        mpcallout 13 mpdel_qmark self Ageemephy_talking
                endif
        else
                tell $n ............
                mpjunk $o
        endif
else
        mpechoat $n 別人講話時不要插嘴。
        drop $o
endif
"""
[[mobiles.70903.programs]]
trigger = "talk_prog"
argument = "rumor"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_F 100007
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 那是一個很怪異的傳聞，不曉得你聽說過沒有。
                        mpcallout 1 tell $n 某幾個從史卡拉貝來的人，說他們曾經見過某個能用紙張創造出動物的奇特女子。
                        mpcallout 2 tell $n 聽到這個傳聞，原本已經快要放棄的史提夫，又重新燃起了希望。
