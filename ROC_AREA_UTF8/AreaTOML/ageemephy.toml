[[mobiles.70914.programs]]
trigger = "talk_prog"
argument = "truth"
script = """
if is_qmark($i) != Ageemephy_talking
        if is_qmark($n) != Ageemephy_enemy
                if is_qmark($n) == Ageemephy_quest_C 100007
                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 對你而言，這是我的一面之詞，你相不相信是你的自由。
                        mpcallout 1 tell $n 可是，我仍然想講出來，在六年前所發生的事。
                        mpcallout 2 tell $n 你或許不知道，莫莉雅蒂那個女人在六年前曾經暗中研究黑暗的力量。
                        mpcallout 3 tell $n 她的心靈早就被邪惡汙染了，只不過表面還是一副高尚的虛偽模樣。
                        mpcallout 4 mpechoat $n $I憤怒地捶了牆壁一拳，牆壁頓時多了個坑洞，掉下一些磚石。
                        mpcallout 5 tell $n 六年前的那個夜晚，我在完全不知情的狀況下被她當成了實驗品......
                        mpcallout 6 tell $n 我頓時被黑暗給吞噬，化身成了可怕的惡魔鬥士。
                        mpcallout 7 tell $n 然而很幸運的，我仍然勉強保有自己的意識，不至於成為那個女人的傀儡。
                        mpcallout 8 tell $n 她發現實驗失敗後，便想把我除掉，於是她製造了那場火災。
                        mpcallout 9 tell $n 被憤怒沖昏頭的我只想找她理論，然而看起來就像是惡魔凶性大發一樣。
                        mpcallout 10 mpechoat $n 說到這裡，$I原本憤怒的表情鬆弛了一點，變得有點無奈。
                        mpcallout 11 tell $n 以我當時的力量要逃走是沒問題的，不過我決定乖乖就範，讓自己被囚禁起來。
                        mpcallout 12 tell $n 因為，這是我完全不熟悉的肉體與力量，一旦失控可能會傷到無辜的人。
                        mpcallout 13 tell $n 我是在變成惡魔，並且被關起來半年多之後，才曉得這些事。
                        mpcallout 14 tell $n 有個神秘的蒙面客闖進封印地與惡魔型態的我對話......不過那不重要。
                        mpcallout 15 mpechoat $n $I的表情再度變得險惡，他的怒火又燒了起來。
                        mpcallout 16 tell $n 莫莉雅蒂那個女人會害怕我逃走是當然的......
                        mpcallout 17 tell $n 就算我講的話沒有人相信，我還是有足夠的力量將她撕成碎片！
                        mpcallout 18 mpechoat $n $I的語氣充滿了憤怒與憎恨，看起來他似乎真的很痛恨莫莉雅蒂。
                        mpcallout 19 mpechoat $n 但是，你從他身上卻感覺不到一絲想要報復(revenge)的氣息......
                        mpcallout 19 mpmod_qmark $n Ageemephy_quest_C v0 = 8
