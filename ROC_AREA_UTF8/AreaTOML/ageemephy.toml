[[objects.70927.extra_descriptions]]
keywords = "diary"
description = """
大部份的頁面都已經發黃，字都看不清楚了。
不過你注意到其中一頁上有這樣的字：

......明天就要出海了，不過據說外面的世界相當危險，所以我覺得，這些話還
是先寫下來吧。我的病恐怕也拖不了多久，趁著身體還能動的時候多做一點事，
這樣才不會留下遺憾！

米雷爾與奧夫，我不在的時候可不准偷懶，如果你們想早點成為能夠獨當一面的
鐵匠，那麼就給我好好地努力。努力不一定會成功，但是想成功就一定要努力，
懂了嗎？

