                        mpadd_qmark self Ageemephy_talking 10 0 0 0 0 1
                        tell $n 報復？我一開始的確是想過這點......
                        mpcallout 1 tell $n 在那起事件後不久，我的家人就全都莫名其妙地病死了。
                        mpcallout 2 tell $n 但我很清楚......絕對是那個女人所下的毒手！
                        mpcallout 3 tell $n 如同我剛才所說的，只要我發揮全部的力量，那個女人只有死路一條。
                        mpcallout 4 mpechoat $n 說到這裡，他忽然看了你一眼，那無奈與哀傷的神情令你不禁愣了一下。
                        mpcallout 5 tell $n 不過我將她殺掉後又能挽回什麼？六年的時光還是我家人的性命？
                        mpcallout 6 tell $n 我沒有辦法將憎恨的心情消去，然而我希望自己的心靈不要再變得越來越黑暗。
                        mpcallout 7 tell $n 雖然我的肉體是惡魔，但是我仍然希望能回歸天國......
                        mpcallout 8 mpechoat $n $I忽然停了下來，好像想到了些什麼。
                        mpcallout 9 tell $n 好了，請你離開吧，這裡的環境對一般人不太好。
                        mpcallout 10 tell $n 另外感謝你讓我暫時變回原本的模樣，至少讓我向你致上微薄的謝意......
