trigger = "room_enter"
argument = "127 100"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100090
        stun $n 60
        echoat $n 模糊的聲音忽然在你耳際響起......
        if is_inv_obj($n) == 63019
        or is_equ_obj($n) == 63019
                if is_inv_obj($n) == 63115
                or is_equ_obj($n) == 63115
                        callout 1 echoat $n 「妳們終於來了，我摯愛的妹妹們。」
                        callout 2 echoat $n 「現在的我，無法顯現原有的光彩。」
                        callout 3 echoat $n 「我會一直等待著妳們。」
                        callout 4 echoat $n 「三姊妹重聚之日，就要來臨了......」
                else
                        callout 1 echoat $n 「我感覺到了，妳離開了原本的主人。」
                        callout 2 echoat $n 「被選中的勇者啊，來吧。」
                        callout 3 echoat $n 「封印之古祭壇，永恆的守護者。」
                        callout 4 echoat $n 「我相信，你與她的實力......」
                endif
        else
                if is_inv_obj($n) == 63115
                or is_equ_obj($n) == 63115
                        callout 1 echoat $n 「自石之咒縛中掙脫了嗎，影子？」
                        callout 2 echoat $n 「雖然如此，我仍期待妳的到來。」
                        callout 3 echoat $n 「穿過重重的阻礙，來與我重逢吧。」
                        callout 4 echoat $n 「與被選中的勇者併肩而行吧......」
                else
                        callout 1 echoat $n 「背負著我原本主人之期盼而來的人。」
                        callout 2 echoat $n 「有著勇者之威名與實力的人。」
                        callout 3 echoat $n 「故事的盡頭，已經隱約浮現。」
                        callout 4 echoat $n 「給我力量，然後，我將給你力量......」
                endif
        endif
        callout 5 mod_qmark $n sealevil_Aleru_quest v0 = 91
endif
"""

