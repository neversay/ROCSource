毀損又不是什麼大事，那只是表示我的功夫還不夠看，況且你是為了保護大家而
戰鬥，和我這個三流鐵匠相比，該感到丟臉的應該是我。不過，等我回來就能重
鑄那把武器，到時候你恐怕就沒有辦法再讓它斷掉囉。

