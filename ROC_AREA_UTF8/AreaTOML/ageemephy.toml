[[mobiles.70946.programs]]
trigger = "talk_prog"
argument = "sound"
script = """
if is_qmark($i) != TideIsland_talking
        if is_qmark($n) == sealevil_Aleru_quest 100095
                mpadd_qmark self TideIsland_talking 10 0 0 0 0 1
                mpforce $n follow $i
                mpechoat $n 你才剛開口問，$I卻好像早已經有了心理準備。
                mpcallout 1 mpechoat $n 看起來，他大概已經從那幾個女孩口中聽到風聲了。
                mpcallout 2 mpechoat $n 沉默了一會兒，他終於開了口，但是語氣和平常散散漫漫的感覺完全不同。
                mpcallout 3 tell $n 我大概猜得到你是為了什麼而來，我也知道你聽到的聲音是什麼。
                mpcallout 4 tell $n 對我來說，你要把東西拿回去我是沒什麼意見，畢竟那已經是很久以前所發生的事。
                mpcallout 5 tell $n 至少，到我曾祖父那一代，就已經對這家族所留傳下來的使命興趣缺缺了。
                mpcallout 6 tell $n 不過她們可能不會這麼想吧，因此我認為你還是有必要跟她們溝通一下。
                mpcallout 7 mpechoat $n $I已經示意你去和那四個女孩溝通，那麼就先從菲蘭開始吧......
                mpcallout 7 mpmod_qmark $n sealevil_Aleru_quest v0 = 96
                mpcallout 7 mpdel_qmark self TideIsland_talking
        endif
        if is_qmark($n) == sealevil_Aleru_quest 100102
                mpadd_qmark self TideIsland_talking 10 0 0 0 0 1
                mpforce $n follow $i
                mpechoat $n 你將她們四人已經全部點頭同意一事告訴了$I。
                mpcallout 1 tell $n 好吧，那麼我把事情一次講完，不過可能會很囉嗦，請你忍著點吧。
                mpcallout 2 tell $n 首先關於你聽到的聲音，那是「冥闇幽月」所發出的訊息。
                mpcallout 3 tell $n 針對「被選中的人」所發出的訊息，那個人想當然爾就是你了。
                mpcallout 4 mpechoat $n $I停了一下。
                mpcallout 5 tell $n 根據我爺爺告訴我的內容，我的祖先曾和一些人帶著「冥闇幽月」來到這裡。
                mpcallout 6 tell $n 菲蘭姊和賽娜她們也是那個時候來到這座島上的。
                mpcallout 7 tell $n 原本她們還有六個姊妹，不過那六個人無緣踏上這座島的土地就已經......
                mpcallout 8 tell $n 小依和悠菲雅則是在這座島上出生的......算了，先不提這個。
                mpcallout 9 mpechoat $n $I又停了一下。
                mpcallout 10 tell $n 當時的「冥闇幽月」雖然被下了封印，但仍然具有強大的力量。
                mpcallout 11 tell $n 而且，它的解體作業剛失敗，正處於極為不安定的狀態。
                mpcallout 12 tell $n 正當我的祖先與其他人束手無策的當頭，他們碰到一個叫狄斯馬爾的人。
                mpcallout 13 tell $n 呃，我不曉得這個狄斯馬爾和愛潔梅菲島那個鏡子商人是不是同一人，我想應該不是吧。
                mpcallout 14 tell $n 總之，因為他的關係，我的祖先才因此得救。
                mpcallout 15 tell $n 他帶著眾人到附近一座古代祭壇，並將「冥闇幽月」交給祭壇的永恆守護人。
                mpcallout 16 tell $n 在此之前他還對「冥闇幽月」下了更強力的封印，然後......
                mpcallout 17 tell $n 他不曉得去哪裡找來一大票各式各樣的衛兵，在通往祭壇的必經之道上佈下重兵。
                mpcallout 18 mpechoat $n $I再次停了一下。
                mpcallout 19 tell $n 奇怪的是，在一切塵埃落定後，就再也沒有精靈族追兵找上我的祖先。
                mpcallout 20 tell $n 而那個男人也沒對我的祖先與其他人索取任何代價，就這麼消失了。
                mpcallout 21 tell $n 接著我的祖先接管了這座無人島，一直到今天。
                mpcallout 22 tell $n 據說，當北邊的那座瑪拉勒城建立時，這座島上的人們緊張了好一陣子。
                mpcallout 23 tell $n 大概是精靈恐懼症吧......當然我沒有這種症狀啦。
                mpcallout 24 tell $n 總體來說，可能是封印力量減弱還是怎麼樣，所以「冥闇幽月」才能對你發出訊息。
                mpcallout 25 tell $n 而它就在這附近的祭壇最深處，由永恆守護人所持有。
                mpcallout 26 tell $n 希望你能一馬當先衝到永恆守護人面前，並親眼目睹永恆的殞落，加油。
                mpcallout 27 mpechoat $n 他最後一句話好像有點怪怪的......什麼意思啊？
                mpcallout 27 mpmod_qmark $n sealevil_Aleru_quest v0 = 103
                mpcallout 27 mpdel_qmark self TideIsland_talking
        endif
else
        mpechoat $n 別人講話時不要插嘴。
endif
"""
