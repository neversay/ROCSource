[mobiles.37200]
keywords = "shadow elf-ghouse"
short_description = "虛影(shadow)"
long_description = "一道透明的身影(shadow)在這靜立\n"
description = """
他在此負責看守身後的木門，如果想進去請試著詢問他(talk shadow enter)
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 0
level = 100
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 1
sex = "male"
race = "Elf"
spec_flags = ["NO_DM", "NO_LORE", "NO_BLIND", "NO_CHARM", "NO_SLEEP"]
[[mobiles.37200.applies]]
type = "EXP"
degree = -9999
[[mobiles.37200.applies]]
type = "REDUCE_DAMAGE"
degree = 9999
[[mobiles.37200.applies]]
type = "REDUCE_MAGIC"
degree = 9999
[[mobiles.37200.applies]]
type = "APPLY_GPHYSICAL"
degree = 9999
[[mobiles.37200.applies]]
type = "APPLY_GMAGIC"
degree = 9999
[[mobiles.37200.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == ghouse_enter_count 100005
	mpechoat $n \u001B[1;32m虛影(shadow)說著「你怎麼又來了？」\u001B[0m
else
	if is_qmark($n) == ghouse_enter_count 100004
		mpechoat $n \u001B[1;32m虛影(shadow)說著「你為什麼要一直進進出出的？」\u001B[0m
		mpechoat $n \u001B[1;32m虛影(shadow)說著「$n我再給你一次機會，這次進去如果你依然不認真的解決問題」\u001B[0m
		mpechoat $n \u001B[1;32m虛影(shadow)說著「那麼短時間內我都不會讓你進去了。」\u001B[0m
		mpechoat $n \u001B[1;32m虛影(shadow)說著「自己考慮清楚還要不要進去(talk shadow enter)」\u001B[0m
	else
		mpechoat $n \u001B[1;32m虛影(shadow)說著「$n你要進去嗎？(talk shadow enter)」\u001B[0m
	endif
endif
"""
[[mobiles.37200.programs]]
trigger = "talk_prog"
argument = "enter"
script = """
if is_qmark($n) == ghouse_enter_count 100005
	mpechoat $n \u001B[1;32m虛影(shadow)說著「你一直進進出出的讓我很困擾...」\u001B[0m
	mpechoat $n \u001B[1;32m虛影(shadow)說著「去去去...不想認真挑戰就別待在這煩我」\u001B[0m
	mpechoat $n \u001B[1;32m虛影(shadow)說著「等你過段時間想通後再來，好，現在你可以滾了！」\u001B[0m
	mpechoat $n 一陣輕煙環繞在四周，轉瞬間你回到史卡拉貝廣場...
	mptransfer $n 3014
else
	if class($n) >= 5
		if level($n) >= 36
			mpechoat $n \u001B[1;32m虛影(shadow)說著「這裡已不適合你了，去別處尋求挑戰吧」\u001B[0m
		else
			mpechoat $n \u001B[1;32m虛影(shadow)說著「如你所願...」\u001B[0m
			mpechoat $n 一陣輕煙環繞在四周，轉瞬間你已身在木門之後了...
			mpmod_qmark $n ghouse_enter_count timer + 5
			mpmod_qmark $n ghouse_enter_count v0 + 1
			mpadd_qmark $n ghouse_enter_count 10 1 0 0 0 1
			mptransfer $n 37203
		endif
	else
		mpechoat $n \u001B[1;32m虛影(shadow)說著「如你所願...」\u001B[0m
		mpechoat $n 一陣輕煙環繞在四周，轉瞬間你已身在木門之後了...
		mpmod_qmark $n ghouse_enter_count timer + 5
		mpmod_qmark $n ghouse_enter_count v0 + 1
		mpadd_qmark $n ghouse_enter_count 10 1 0 0 0 1
		mptransfer $n 37203
	endif
endif
"""

