trigger = "talk_prog"
argument = "salary"
script = """
if is_qmark($n) == roc_ppl_salary
        tell $n 趕快寫你的區域吧，現在不是你領薪水的時候！
        if is_qmark($n) <= roc_ppl_salary 1024
                tell $n 大約再過一天，你就可以來跟我領薪水了。
                break
        endif
        if is_qmark($n) <= roc_ppl_salary 1048
                tell $n 大約再過兩天，你就可以來跟我領薪水了。
                break
        endif
        if is_qmark($n) <= roc_ppl_salary 1120
                tell $n 大約再過五天，你就可以來跟我領薪水了。
                break
        endif
        if is_qmark($n) <= roc_ppl_salary 1240
                tell $n 大約還得再過十天，你才能夠跟我領薪水。
                break
        endif
        if is_qmark($n) <= roc_ppl_salary 1360
                tell $n 大約還得再過十五天，你才能夠跟我領薪水。
                break
        endif
        if is_qmark($n) <= roc_ppl_salary 1480
                tell $n 大約還得再過二十天，你才能夠跟我領薪水。
        else
                tell $n 還得過二十幾天你才能夠跟我領薪水。
        endif
else
        if level($n) <= 2
                tell $n 你的等級必須至少到達第 3 級才能夠跟我領薪水。
                break
        endif
        nod $n
        tell $n 你可以跟我領薪水了，領完後給我快點繼續寫區域！
        if is_qmark($n) <= 30
                mpadd_qmark $n roc_ppl_salary 720 0 0 0 0 1
        else
                mpadd_qmark $n roc_ppl_salary 960 0 0 0 0 1
        endif
        if level($n) <= 5
                tell $n 依照你的等級你可以領到 100000 元的金幣。
                mpgold $n 100000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 10
                tell $n 依照你的等級你可以領到 130000 元的金幣。
                mpgold $n 130000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 15
                tell $n 依照你的等級你可以領到 160000 元的金幣。
                mpgold $n 160000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 20
                tell $n 依照你的等級你可以領到 200000 元的金幣。
                mpgold $n 200000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 25
                tell $n 依照你的等級你可以領到 250000 元的金幣。
                mpgold $n 250000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 30
                tell $n 依照你的等級你可以領到 300000 元的金幣。
                mpgold $n 300000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 35
                tell $n 依照你的等級你可以領到 370000 元的金幣。
                mpgold $n 370000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 37
                tell $n 依照你的等級你可以領到 450000 元的金幣。
                mpgold $n 450000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 39
                tell $n 依照你的等級你可以領到 550000 元的金幣。
                mpgold $n 550000
                mpcall resp_gold $n
                break
        endif
        if level($n) <= 41
                tell $n 依照你的等級你可以領到 700000 元的金幣。
                mpgold $n 700000
                mpcall resp_gold $n
                break
        else
                tell $n 依照你的等級你可以領到 1000000 元的金幣。
                mpgold $n 1000000
                mpcall resp_gold $n
        endif
endif
"""
[[mobiles.66000.programs]]
trigger = "defun_prog"
argument = "resp_gold"
script = """
if resp($n) < 0
        break
endif
if resp($n) >= 1
        if resp($n) <= 5
                tell $n 依照你的威望值，你可以額外領到 50000 元的金幣。
                mpgold $n 50000
                break
        endif
        if resp($n) <= 10
                tell $n 依照你的威望值，你可以額外領到 100000 元的金幣。
                mpgold $n 100000
                break
        endif
        if resp($n) <= 20
                tell $n 依照你的威望值，你可以額外領到 200000 元的金幣。
                mpgold $n 200000
                break
