"""
[[mobiles.66000.programs]]
trigger = "talk_prog"
argument = "p go third"
script = """
if is_qmark($n) == areawriter_go_third
        mpechoat $n 你才剛過去休息過，回去再寫一陣子區域再來休息吧！
        mpechoaround $n $N 向 $I 申請要去勞改三營休息，卻不被批準！
else
        mpadd_qmark $n areawriter_go_third 12 0 0 0 1 1
        mpechoat $n 你向 $I 申請要去勞改三營休息清靜一下，獲得批準。
        mpechoaround $n $N 向 $I 申請要去勞改三營休息並且偷懶一下，獲得批準。
        mpechoaround $n 你看到 $I 將 $N 送到了勞改三營去。
        mpforcer 66002 echo 你看到 $N 被傳送到了這裡陪你們ＱＫ。
        mptransfer $n 66002
        mpforcer 66002 force $n look
