                mpgold $n 400000
                break
        endif
        if resp($n) <= 60
                tell $n 依照你的威望值，你可以額外領到 500000 元的金幣。
                mpgold $n 500000
                break
        endif
        if resp($n) <= 80
                tell $n 依照你的威望值，你可以額外領到 700000 元的金幣。
                mpgold $n 700000
                break
        endif
        if resp($n) <= 99
