為了混沌幻世的將來，原本生性善良的他只好化身為一位不茍言笑的惡魔。你看他那
天使的白色羽翼還未全部轉成烏鴉的黑色羽翼呢。當他對著你們大聲的吼叫時，其實
他的心裡是在滴血的。而他在這裡的工作不只是負責監督而已，他還負責著你們薪資
分發的工作呢，真是辛苦他了。
"""
