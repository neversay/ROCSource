"""
[[mobiles.66000.programs]]
trigger = "talk_prog"
argument = "hungry"
script = """
if is_inv_obj($n) == 66002
        mpechoat $n 你身上已經有一個特製米食了，真的餓了的話就快吃吧！
else
        mpechoat $n 當你正在喊餓的時候，你身上突然多了一個特製米食。
        mpoload 66002 $n viclv target
