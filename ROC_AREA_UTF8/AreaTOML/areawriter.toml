"""
[[mobiles.66000.programs]]
trigger = "talk_prog"
argument = "light"
script = """
if isaffected($n) & 8
if isaffected($n) & 32
        say 明明就什麼都看的到，竟然也想跟我要法術！
        say 給我去二營懺悔吧你！
        mpechoat $n 你被 $I 狠狠的丟到了勞改二營去。
        mpechoaround $n 你看到 $N 被 $I 狠狠的丟到勞改二營去懺悔～阿門～
        mpforcer 66001 echo 你看到 $N 被丟過來二營陪你們受罪。
        mptransfer $n 66001
        mpforcer 66001 force $n look
        break
endif
endif
if isaffected($n) !& 8
        say 什麼！看不到隱形？
        say 那就讓我來為 $N \u001B[1;32m你擦亮雙眼，好讓你看得更清楚吧！！
        mpforcer here add_affect $n 'detect invis' 1130 1000 41 -50000 8
        mpforcer here add_affect $n 'detect invis' 1130 1000 42 -50000 8
endif
if isaffected($n) !& 32
        say 看不到藏匿者？
        say 就讓我來為 $N \u001B[1;32m你擦亮雙眼，好讓藏匿者在你眼前現形吧！！
        mpforcer here add_affect $n 'detect hidden' 1130 1000 39 10000 32
        mpforcer here add_affect $n 'detect hidden' 1130 1000 17 10000 32
endif
"""
