if isnpc($n)
or isfollow($i)
or is_qmark($n) == midennir_lostboy_exp
or is_qmark($n) >= midennir_lost_boy 100002
	break
endif
cry
mpechoat $n $I 哭著說：媽媽，媽媽....
follow $n
if isfollow($i)
	mpadd_qmark $n midennir_lost_boy 200 1 0 0 1 0
endif
"""
