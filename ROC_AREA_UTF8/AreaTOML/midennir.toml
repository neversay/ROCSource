mpecho $I 拉著你的褲管哭鬧：媽媽，我要媽媽....
"""

[mobiles.3503]
keywords = "innkeeper"
short_description = "旅店店主(Innkeeper)"
long_description = "旅店店主(Innkeeper)，他對這個森林(midennir)有一份特殊的感情。\n"
description = """
他現在大部分的時間都花在等待不一定會有的客人上。晚上則是擔心哥布林的來襲
。他的旅館現在早已不像以前那樣，是一個人來人往的好地方了。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = []
alignment = 400
level = 22
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
[[mobiles.3503.programs]]
trigger = "greet_prog"
argument = "80"
script = """
if isnpc($n)
	break
endif
mpechoat $n $I 說：歡迎歡迎，請問您是要住宿還是用餐？密登尼(midennir)
mpechoat $n $I 說：森林裡就只有本店提供溫暖的床鋪，我建議您休息一晚，
mpechoat $n $I 說：養足了精神，明天好繼續趕路。
"""
[[mobiles.3503.programs]]
trigger = "talk_prog"
argument = "midennir"
script = """
say 就是史卡拉貝東南方的這片森林，以前這裡非常寧靜，
say 史卡拉貝城的居民們一有假期都喜歡到這裡觀光旅遊，
say 親近大自然。但是這一、兩年不知道什麼原因，哥布林
say (goblin)們脾氣變得非常暴躁，動不動就攻擊森林裡的遊客，
say 所以來這裡休憩的旅客就少多了....
"""
[[mobiles.3503.programs]]
trigger = "talk_prog"
argument = "goblin"
script = """
say 他們在這座森林已經生活很久了，甚至遠在史卡拉貝城
say 建立之前呢！因為生活領域的重疊，哥布林對史卡拉貝的
say 居民一直不太友善，但之前雙方總還是能克制自己，並未
say 引起太大的衝突。一直到最近一、兩年，哥布林們態度
say 突然強硬起來，動不動就對外人發動突襲，據說是因為得
say 到強力的盟友了....
shrug
Say 誰知道呢？也許只是因為來此地的遊客們沒有好好愛惜
say 這片美好的森林吧？他們到處喧嘩也的確嚇跑不少溫和
say 的動物(animal)....
sigh
"""
[[mobiles.3503.programs]]
trigger = "talk_prog"
argument = "animal"
script = """
say 要是您一路來沒看到什麼動物，請不要驚訝。其實，
say 以前密登尼森林裡有許多野生動物自由地倘佯著，像是
say 鹿、松鼠、浣熊、雉雞等。每到夏天傍晚，動物們都會
say 聚集到湖邊喝水嬉戲，而我也會在湖濱享受沁涼的晚風，
say 一直坐到繁星點點，那是我童年最美好的回憶....
mpecho $I 抬頭露出沈醉的表情。
sigh
say 後來因為許多遊客湧進這裡，破壞了安寧的環境，所以
say 這些小動物都搬到更遠更隱密的森林深處了。
"""

[mobiles.3504]
keywords = "bard"
short_description = "吟遊詩人(bard)"
long_description = "一個憂鬱的吟遊詩人(bard)在這裡藉酒澆愁.\n"
description = """
他的身上滿是酒味，看來他在這裡已經坐了好久的時間了。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS"]
alignment = 600
level = 8
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
special_function = "spec_cast_cleric"
[[mobiles.3504.programs]]
trigger = "greet_prog"
argument = "60"
script = """
if isnpc($n)
	break
endif
mpechoat $n $I說：我親愛的朋友，你想要聽首歌嗎？只要一杯啤酒(beer)
mpechoat $n $I說：給我潤潤這副沙啞的嗓子，我就唱首歌給你聽。
"""
[[mobiles.3504.programs]]
trigger = "defun_prog"
argument = "bard_song"
script = """
if is_qmark($i) == midennir_bard_sing
	break
endif
bow $n
mpecho $I 喝了口啤酒.
mpjunk beer
mpjunk barrel
say 謝謝你，親愛的朋友，這首歌有點長，請耐心聽我唱....
mpecho $I 輕撥起他的三絃琴：
mpadd_qmark $i midennir_bard_sing -1 1 0 0 1 1
"""
[[mobiles.3504.programs]]
trigger = "give_prog"
argument = "13051"
script = """
mpcall bard_song $n
"""
[[mobiles.3504.programs]]
trigger = "give_prog"
argument = "13622"
script = """
mpcall bard_song $n
"""
[[mobiles.3504.programs]]
trigger = "give_prog"
argument = "3000"
script = """
mpcall bard_song $n
"""
[[mobiles.3504.programs]]
trigger = "rand_prog"
argument = "80"
script = """
if is_qmark($i) == midennir_bard_sing 100001
	mpecho $I 唱道：....對酒當歌，人生幾何....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100002
	mpecho $I 唱道：....譬如朝露，去日苦多....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100003
	mpecho $I 唱道：....慨當以慷，憂思難忘....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100004
	mpecho $I 唱道：....何以解憂，唯有杜康....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100005
	mpecho $I 唱道：....青青子衿，悠悠我心....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100006
	mpecho $I 唱道：....但為君故，沈吟至今....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100007
	mpecho $I 唱道：....嗷嗷鹿鳴，食野之萍....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100008
	mpecho $I 唱道：....我有嘉賓，鼓瑟吹笙....
	mpmod_qmark $i midennir_bard_sing v0 + 1
	break
endif
if is_qmark($i) == midennir_bard_sing 100009
	smile
	mpecho $I說：我唱得好聽嗎？(yes/no)
	mpmod_qmark $i midennir_bard_sing v0 + 1
endif
"""
[[mobiles.3504.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($i) == midennir_bard_sing 100010
	sigh
	mpdel_qmark $i midennir_bard_sing
endif
"""
[[mobiles.3504.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($i) == midennir_bard_sing 100010
	smile $n
	say 謝謝你的讚美，我親愛的朋友.....
	mpdel_qmark $i midennir_bard_sing
	if is_qmark($n) == midennir_bard_quest
		break
	endif
	ponder
	say 我們也算有緣，這樣吧，如果你能幫我尋回失落的
	say 象牙豎琴(ivory harp)，我就把我的家傳寶物送你。
	mpadd_qmark $n midennir_bard_quest -1 1 0 0 0 1
endif
"""
[[mobiles.3504.programs]]
trigger = "give_prog"
argument = "3501"
script = """
if is_qmark($n) == midennir_bard_quest 100001
	mpexp $n 300
	thank $n
	mpecho $I 小心的把象牙豎琴(ivory harp)收起來.
	mpjunk harp
	say 我把這雙旅者之靴送你，希望它能夠讓你不再飽受長途跋涉之苦。
	if level($n) < 5
		mpoload 3500 $n 5 target
		mpmod_qmark $n midennir_bard_quest v0 + 1
		break
	endif
	if level($n) > 20
		mpoload 3500 $n 20 target
		mpmod_qmark $n midennir_bard_quest v0 + 1
		break
	endif
	mpoload 3500 $n viclv target
	mpgold $n 2500
	mpmod_qmark $n midennir_bard_quest v0 + 1
	endif
endif
"""

