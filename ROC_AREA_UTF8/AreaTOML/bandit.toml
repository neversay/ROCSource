[area]
name = "盜賊要塞"
identity = "bandit"
builders = "Pax"
translator = "Pluto"
modifier = "Coconet"
vnum_start = 4000
vnum_end = 4199
security = 1
recall = 4580
f_toggle = true

[mobiles.4000]
keywords = "chief-bandit bandit chief"
short_description = "盜賊頭頭(Bandit Chief)"
long_description = "盜賊頭頭(bandit chief)正高貴的坐在這裡。\n"
description = """
他看起來沒什麼特別的。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "PRACTICE", "CRITICAL", "HARD_DIS", "HUNT", "TACTICS", "TRACK", "MOB_AI", "REFLEXION"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT", "SNEAK", "HIDE", "DARK_RAID"]
alignment = -1000
level = 60
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 30
mod_damroll = -80
mod_ac = 1000
mod_svs = 0
dodge = -500
mod_pp = 50
gold = -1
sex = "neutral"
class = ["WARRIOR", "THIEF", "SWORD"]
spec_flags = ["NO_DM", "NO_BLIND", "NO_CHARM", "HALF_MAGIC", "ALY_HIDE", "ALY_SNEAK", "EXPERT", "NO_CRAZY", "MOBAI_LV2"]
special_function = "spec_assassin"
practice_skills = "circle darkraid track nightstalk assassination reflexion *untangle 'deadly strike' escape morphing backstab sneak\n 'enhanced damage' 'tricky pacing' scan dodge hide critical 'dart mastery'"
transfer_classes = "assassin ninja ranger"
[[mobiles.4000.applies]]
type = "REDUCE_DAMAGE"
degree = 250
[[mobiles.4000.applies]]
type = "REDUCE_MAGIC"
degree = 250
[[mobiles.4000.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
mpadd_qmark self bandit_chief_heal -1 20 20 20 1 0
"""
[[mobiles.4000.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if is_equ_obj($i) != 4004
	wear bronze-dagger
endif
if is_equ_obj($i) != 4056
	wear assassination-dagger
endif
if is_qmark($n) == bandit_enemy
	if hitprcnt($i) > 50
		if rand(20)
			bs $n
			mpnowait
		else
			assa $n
			mpnowait
			flee
			flee
			flee
		endif
	else
		if rand(50)
			assa $n
			mpnowait
			flee
			flee
			flee
		else
			bs $n
			mpnowait
		endif
	endif
	break
endif
if class($n) == 2
or class($n) == 9
or class($n) == 10
or class($n) == 17
	if is_qmark($n) != bandit_thief_exam
		say 小子，沒有經過我的認定你只能夠稱為普通的盜賊。
		mpcallout 1 say 如果想要成為真正的盜賊，最好向我好好請教一下。
		mpcallout 1 mpadd_qmark $n bandit_thief_exam -1 1 0 0 0 1
		break
	endif
else
	say 職業不是盜賊的你，能夠走到我面前來已經算是不錯了。
	mpcallout 1 say 說吧！有什麼問題或要求，如果我能夠辦到一定儘量幫助你。
endif
if is_qmark($n) == bandit_thief_exam 100005
	if class($n) == 10
		say 你來了啊！我的得力助手....
		mpcallout 1 mpechoat $n $I 仔細打量著你....
		mpcallout 1 mpechoaround $n $I 仔細打量著 $n ....
		mpcallout 2 say 看來自從你上次離開至今，又長進了不少。
		mpcallout 3 gig
		mpcallout 4 say 我想你應該有能力挑戰進一步的試練。
		mpcallout 5 say 通過的話，還可以學到新的技能！如果你夠小心的話。
		mpcallout 6 chuckle
		mpcallout 7 say 怎樣！想不想試試啊(sure/not sure)？
		break
	endif
endif
if is_qmark($n) >= bandit_thief_exam 100006
	if class($n) == 10
		say 如果你想再次回去修練(discipline)，就告訴我一聲。
	endif
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if class($n) == 2
or class($n) == 9
or class($n) == 10
or class($n) == 17
	if is_qmark($n) == bandit_thief_exam 100001
		say 我給你幾個任務，看看你是否有資格能夠接受我們的盜賊試煉。
		say 你有足夠的勇氣與技巧接受嗎(yes/no)？
		break
	endif
endif
if class($n) == 10
	if is_qmark($n) == bandit_thief_exam 100005
		say 看來你已經逐漸的成長茁壯了，那麼該是接受最後試練的時候了，
		say 最後的試練，你必須利用你所有曾經學會或是即將學會的技能，
		say 去達到最後的這項修練。如果你準備好，就請告訴我(sure)。
	endif
endif
if is_qmark($n) == bandit_thief_exam 100006
	say 看來你是失敗了，別灰心。如果準備好了，想要再試一次，
	say 那就再跟我說一下吧(discipline)。
endif
if is_qmark($n) == bandit_thief_exam 100007
	say 你又來了呀，想要進去試煉再提升你的實力嗎(discipline)？
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if class($n) == 2
or class($n) == 9
or class($n) == 10
or class($n) == 17
	if is_qmark($n) == bandit_thief_exam 100001
		if is_qmark($n) == thief_quest_list 100000
			mpmod_qmark $n bandit_thief_exam v0 = 2
			say 很好，這邊的任務可不是像在史卡拉貝那種小兒科的任務。
			mpcallout 1 say 想要加入我們，沒有一定的實力是不行的。
			mpcallout 2 say 當然，如果有幸成為我們的一員！
			mpcallout 3 say 能夠享受的利益是遠比一般盜賊公會好的多。
			mpcallout 4 hmm $n
			mpcallout 5 say 既然你有心想要加入，我就先給你一個任務，
			mpcallout 6 say 看看你的實力能不能符合我的要求吧。
			mpcallout 7 hmm $n
			mpcallout 8 say 最近我珍藏的一批珠寶竟然莫名的消失了，
			mpcallout 9 say 看來應該是要塞裡面的內賊所為，這件事情我尚未處理。
			mpcallout 10 say 不過你既然有心想加入，我看就當做你的考驗吧！
			mpcallout 11 say 你去把我遭竊的珠寶找回來。
			 mpcallout 12 mpat 4120 mpmload 4049
			mpcallout 13 say 拿回來後直接把東西給我吧。
			mpcallout 14 say 至於那個可惡的叛徒，他如果願意主動拿出來就算了。
			mpcallout 15 say 不願意的話，你就替我教訓教訓他吧！
			mpcallout 16 wave
		else
			mpcallout 1 mpechoat $n $I 不屑的看了你一眼....
			mpcallout 1 mpechoaround $n $I 不屑的看了 $n 一眼....
			mpcallout 2 say 連史卡拉貝那種小兒科任務都還沒完全解決的人，
			mpcallout 3 say 我是不會要的。你去多磨練自己吧！
		endif
	endif
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) ==bandit_thief_exam 100000
	say 看來你是膽怯了。
	mpcallout 1 say 等你有了足夠的勇氣與技巧的時候，再來找我吧！
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "p not sure"
script = """
if is_qmark($n) == bandit_thief_exam 100005
	ponder $n
	mpcallout 1 say 既然你尚心存顧忌！就先去鍛鍊鍛鍊自己吧！
	mpcallout 2 say 我就不逼你了！
	mpcallout 3 wave $n
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "p sure"
script = """
if class($n) == 10
	if is_qmark($n) == bandit_thief_exam 100005
      		gig
      		mpmod_qmark $n bandit_thief_exam v0 = 6
                mpcallout 1 say 很好很好！我果然沒看錯人，
                mpcallout 2 say 我這就送你過去！
                mpcallout 3 mpcall set_guardian
                mpcallout 4 mpecho 你聽到一陣奇怪的喀喀聲，似乎是機關運作的聲響。
                mpcallout 5 mptransfer $n 4152
                mpcallout 6 mpat 4152 mpechoat $n 機關運作的喀喀聲停止後，你被送到了一間密室。
	endif
endif
"""
[[mobiles.4000.programs]]
trigger = "defun_prog"
argument = "set_guardian"
script = """
mpat 4155 mppurge guardian-bandit
mpat 4155 mpmload 4054
mpat 4159 mppurge guardian-bandit
mpat 4159 mpmload 4055
mpat 4160 mppurge guardian-bandit
mpat 4160 mpmload 4056
mapt 4161 mppurge guardian-bandit
mpat 4161 mpmload 4057
mpat 4162 mppurge guardian-bandit
mpat 4162 mpmload 4058
mpat 4163 mppurge guardian-bandit
mpat 4163 mpmload 4059
mpat 4164 mppurge guardian-bandit
mpat 4164 mpmload 4060
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "discipline"
script = """
if class($n) == 10
      if is_qmark($n) == bandit_thief_exam 100007
                say 沒問題，我這就送你過去！
                mptransfer $n 4152
               	mpcall dis_guardian
                mpcall set_guardian
      endif
      if is_qmark($n) == bandit_thief_exam 100006
      		sm $n
                mpcallout 1 say 很好！你的確很努力，
                mpcallout 2 say 我這就送你過去！
                mpcallout 3 mpcall dis_guardian
                mpcallout 4 mpcall set_guardian
                mpcallout 4 mpechoat $n 你聽到一陣奇怪的喀喀聲，似乎是機關運作的聲響。
                mpcallout 5 mptransfer $n 4152
                mpcallout 6 mpat 4152 mpechoat $n 機關運作的喀喀聲停止後，你被送到了一間密室。
      endif
endif
"""
[[mobiles.4000.programs]]
trigger = "defun_prog"
argument = "dis_guardian"
script = """
mpat 4155 mppurge guardian-bandit
mpat 4159 mppurge guardian-bandit
mpat 4160 mppurge guardian-bandit
mpat 4161 mppurge guardian-bandit
mpat 4162 mppurge guardian-bandit
mpat 4163 mppurge guardian-bandit
mpat 4164 mppurge guardian-bandit
"""
[[mobiles.4000.programs]]
trigger = "give_prog"
argument = "4067"
script = """
if is_qmark($n) == bandit_thief_exam 100003
        if is_qmark($n) != bandit_thief_jewel
                mpadd_qmark $n bandit_thief_jewel -1 1 0 0 0 1
                mpjunk all.jewel
                say 我收到珠寶了。
        else
                if is_qmark($n) == bandit_thief_jewel 100002
                        mpjunk all.jewel
                        say 沒錯都齊了。
                        say 你合格了，恭喜你成為我們的一員(member)。
	        mpechoat $n 你心想 ：「該問問成員該有的優待吧？」
                        mpmod_qmark $n bandit_thief_exam v0 = 4
                        mpdel_qmark $n bandit_thief_jewel
                else
                        say 我不需要這個，你已經給過了。
                        drop jewel
                endif
        endif
else
        say 你給我這做什麼？
        drop jewel
endif
"""
[[mobiles.4000.programs]]
trigger = "give_prog"
argument = "4068"
script = """
if is_qmark($n) == bandit_thief_exam 100003
        if is_qmark($n) != bandit_thief_jewel
                mpadd_qmark $n bandit_thief_jewel -1 2 0 0 0 1
                mpjunk all.jewel
                say 我收到珠寶了。
        else
                if is_qmark($n) == bandit_thief_jewel 100001
                        mpjunk all.jewel
                        say 沒錯都齊了。
                        say 你合格了，恭喜你成為我們的一員(member)。
	        mpechoat $n 你心想 ：「該問問成員該有的優待吧？」
                        mpmod_qmark $n bandit_thief_exam v0 = 4
                        mpdel_qmark $n bandit_thief_jewel
                else
                        say 我不需要這個，你已經給過了。
                        drop jewel
                endif
        endif
else
        say 你給我這做什麼？
        drop jewel
endif
"""
[[mobiles.4000.programs]]
trigger = "defun_prog"
argument = "resp_check"
script = """
say 你可以向我學習盜賊新技能：「解除陷阱」了
mpadd_qmark $n untangle -1 1 0 0 0 1
if resp($n) >= 8
	mpoload 4065 $n viclv target
	break
endif
if resp($n) >= 5
	mpoload 4064 $n viclv target
	break
endif
if resp($n) >= 3
	mpoload 4063 $n viclv target
	break
endif
if resp($n) >= 0
	mpoload 4062 $n viclv target
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "member"
script = """
if is_qmark($n) == bandit_thief_exam 100004
	mpcallout 1 mpechoat $n $I仔細地打量你。
	mpcallout 2 say 依照你的能力，我給你我們的證明。
	mpcallout 3 mpcall resp_check $n
	mpcallout 4 mpechoat $n $I 把盜賊的守則給了你。
	mpmod_qmark $n bandit_thief_exam v0 = 5
else
	say 你還不夠格啊！
endif
"""
[[mobiles.4000.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == bandit_thief_exam
	if is_qmark($n) == bandit_thief_exam 100005
		mpechoat $n 「遠處傳來一陣聲音：你已經完成本任務了！」
		break
	else
		mpmod_qmark $n bandit_thief_exam v0 = 1
		mpechoat $n 「遠處傳來一陣聲音：你的任務重新開始了！」
	endif
endif
"""
[[mobiles.4000.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) != bandit_enemy
	mpadd_all_qmark $n bandit_enemy -1 0 0 0 1 1
endif
if hitprcnt($i) < 30
	if is_qmark($i) > bandit_chief_heal 300001
		mpecho \u001B[1;33m$I 吃下了一顆\u001B[0m\u001B[1;36m青色藥丸\u001B[0m\u001B[1;33m....\u001B[0m
		mpat 5 c 3 'doubl heal'
		mpmod_qmark self bandit_chief_heal v2 - 1
		mpnowait
	else
		if is_qmark($i) == bandit_chief_heal 300001
			yell 糟糕！我身上已經沒有\u001B[1;36m青色藥丸\u001B[0m了！
			mpmod_qmark self bandit_chief_heal v2 = 0
		endif
	endif
endif
if hitprcnt($i) < 50
	if is_qmark($i) > bandit_chief_heal 200001
		mpecho \u001B[1;33m$I 吃下了一顆\u001B[0m\u001B[1;31m紅色藥丸\u001B[0m\u001B[1;33m....\u001B[0m
		mpat 5 c 2 'double heal'
		mpmod_qmark self bandit_chief_heal v1 - 1
		mpnowait
	else
		if is_qmark($i) == bandit_chief_heal 200001
			yell 糟糕！我身上已經沒有\u001B[1;31m紅色藥丸\u001B[0m了！
			mpmod_qmark self bandit_chief_heal v1 = 0
		endif
	endif
endif
if hitprcnt($i) < 70
	if is_qmark($i) > bandit_chief_heal 100001
		mpecho \u001B[1;33m$I 吃下了一顆\u001B[0m白色藥丸\u001B[1;34m....\u001B[0m
		mpat 5 c 'double heal'
		mpmod_qmark self bandit_chief_heal v0 - 1
		mpnowait
	else
		if is_qmark($i) == bandit_chief_heal 100001
			yell 糟糕！我身上已經沒有\u001B[1;37m白色藥丸\u001B[0m了！
			mpmod_qmark self bandit_chief_heal v0 = 0
		endif
	endif
endif
if is_equ_obj($i) != 4004
	wear bronze-dagger
endif
if is_equ_obj($i) != 4056
	wear assassination-dagger
endif
if rand(80)
	disarm
	mpnowait
	yell $n 死吧！看我的背刺....！
	mpdef_rembch $n
	mpgoto $b
	bs $b
	mpnowait
	mpdef_rembch null-tar
endif
if rand(50)
	disarm
	mpnowait
	yell $n 死吧！看我的連續背刺....！
	mpdef_rembch $n
	mpgoto $b
	bs $b
	mpnowait
	if insameroom($b)
		mpgoto $b
		bs $b
		mpnowait
	endif
	mpdef_rembch null-tar
endif
"""
[[mobiles.4000.programs]]
trigger = "kill_prog"
argument = "100"
script = """
if ispc($n)
	mpget $n 3 0
endif
"""
[[mobiles.4000.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if class($n) == 2
or class($n) == 9
or class($n) == 10
or class($n) == 17
	if is_qmark($n) != bandit_enemy
		mpadd_all_qmark $n bandit_enemy -1 0 0 0 1 1
	endif
	shout 我竟然會被身為盜賊的人所擊敗，我不甘心....！
else
	if is_qmark($n) != bandit_enemy
		mpadd_all_qmark $n bandit_enemy -1 0 0 0 1 1
	endif
	shout $n 我會記住你的，今後你將會被我的屬下所追殺....！
endif
"""

[mobiles.4001]
keywords = "prince-bandit bandit prince"
short_description = "盜賊王子(Bandit Prince)"
long_description = "英俊的盜賊王子(bandit prince)有些事情要拜託你。\n"
description = """
他身上並沒有什麼特別的。
"""
act_flags = ["NPC", "SENTINEL", "SCAVENGER", "STAY_AREA", "PRACTICE", "CRITICAL", "HARD_DIS", "HUNT", "TACTICS", "TRACK", "MOB_AI", "REFLEXION"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT", "SNEAK", "HIDE"]
alignment = -1000
level = 50
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 20
mod_damroll = -30
mod_ac = 500
mod_svs = 0
dodge = -700
mod_pp = 30
gold = -1
sex = "neutral"
class = ["WARRIOR", "THIEF", "SWORD"]
spec_flags = ["NO_CHARM", "HALF_MAGIC", "ALY_HIDE", "ALY_SNEAK", "EXPERT", "NO_CRAZY", "MOBAI_LV2"]
[[mobiles.4001.applies]]
type = "REDUCE_DAMAGE"
degree = 150
[[mobiles.4001.applies]]
type = "REDUCE_MAGIC"
degree = 150
[[mobiles.4001.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
if being(princess-bandit)
else
	mpmload 4002
endif
if insameroom(princess-bandit)
else
	mptransfer princess-bandit
	mpforce princess-bandit mpat 5 c 'full heal'
endif
mpgroup princess-bandit self 1 0
"""
[[mobiles.4001.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) != bandit_enemy
	mpadd_all_qmark $n bandit_enemy -1 0 0 0 1 1
endif
mpcall bandit_prince_heal $n
if is_equ_obj($i) != 4060
	wear poisonous-dagger
endif
if rand(50)
	disarm
	mpnowait
	yell $n 死吧！看我的背刺....！
	mpdef_rembch $n
	mpgoto $b
	bs $b
	mpnowait
	mpdef_rembch null-tar
endif
if rand(30)
	disarm
	mpnowait
	yell $n 看我的連續背刺....！
	mpdef_rembch $n
	mpgoto $b
	bs $b
	mpnowait
	if insameroom($b)
		mpgoto $b
		bs $b
		mpnowait
	endif
	mpdef_rembch null-tar
endif
"""
[[mobiles.4001.programs]]
trigger = "rand_prog"
argument = "50"
script = """
mpcall bandit_prince_heal
"""
[[mobiles.4001.programs]]
trigger = "defun_prog"
argument = "bandit_prince_heal"
script = """
if insameroom(princess-bandit)
	if isaffected($i) & 1
		mpforce princess-bandit c 'cure blindness' prince-bandit
	endif
	if isaffected($i) !& 128
		mpforce princess-bandit c sanc prince-bandit
	endif
	if isaffected($i) & 1024
		mpforce princess-bandit c 'remove curse' prince-bandit
	endif
	if isaffected($i) & 4096
		mpforce princess-bandit c 'cure poison' prince-bandit
	endif
	if isaffected($i) & 268435456
		mpforce princess-bandit c vivi prince-bandit
	endif
	if hitprcnt($i) < 30
		mpforce princess-bandit c 3 'double heal' prince-bandit
		break
	endif
	if hitprcnt($i) < 50
		mpforce princess-bandit c 2 'double heal' prince-bandit
		break
	endif
	if hitprcnt($i) < 70
		mpforce princess-bandit c 'double heal' prince-bandit
	endif
endif
"""
[[mobiles.4001.programs]]
trigger = "kill_prog"
argument = "100"
script = """
if ispc($n)
	mpget $n 3 0
endif
"""
[[mobiles.4001.programs]]
trigger = "death_prog"
