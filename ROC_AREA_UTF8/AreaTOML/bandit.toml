	if resp($n) > 10
		say 這不就是在史卡拉貝大名鼎鼎的 $n 嗎？
	else
		if resp($n) > 5
			say 這不就是遠近馳名的 $n 嗎？
		else
			say 喔！原來是盜賊同志 $n 啊？
		endif
	enidif
	say 怎麼？有什麼事情嗎？
else
	say 嗨！你好，有什麼事情需要我的幫忙嗎？
endif
