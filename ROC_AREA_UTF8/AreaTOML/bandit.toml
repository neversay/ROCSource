	mpcallout 2 mpadd_qmark self free_swordman_mist -1 0 0 0 1 0
	mpcallout 2 mpecho $I來了。
	mpcallout 2 mpgoto 4522
	mpcallout 2 mpecho $I離開了這裡。
endif
"""
[[mobiles.4048.programs]]
trigger = "fight_prog"
argument = "30"
script = """
if rand(30)
	circular
	mpnowait
else
	perform empslash
	mpnowait
endif
if rand(30)
	flaming
	mpnowait
else
	icecore
	mpnowait
endif
"""
[[mobiles.4048.programs]]
trigger = "fight_prog"
argument = "50"
script = """
say 憑你這種三腳貓的技巧，也想來跟我挑戰？
skilldrv multihit $n
skilldrv heavyhit $n
skilldrv speedhit $n
if rand(50)
	if hitprcnt($i) < 70
		c heal
	endif
	if hitprcnt($i) < 30
		c 'double heal'
	endif
endif
"""
[[mobiles.4048.programs]]
trigger = "fight_prog"
argument = "30"
script = """
if isaffected($i) & 1
	c 'cure blindness'
endif
if isaffected($i) & 4096
	c 'cure poison'
endif
if isaffected($i) & 8388608
	grin
	mpdis_magic self mute
	say 禁言術對我來說是沒有用的。
	mpecho $I 身上的禁言術消失了....。
endif
if isaffected($i) & 16777216
	shake
	say 你無法封鎖我身上的魔法。
	mpdis_magic self 'seal magic'
	mpecho $I 身上的封鎖魔法失效了....。
endif
if isaffected($i) & 268435456
	say 麻痺術怎麼可能對我有效呢？
	mpdis_magic self paralyze
	mpecho $I 的身體再度又能夠活動自如....。
endif
"""

