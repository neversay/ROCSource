if mobcount(4001) > 0
	if insameroom(prince-bandit)
	else
		yell 請王子回到我身邊幫助我擊退外敵！
		mpecho \u001B[1;33m盜賊王子(Bandit Prince) 忽然出現了！\u001B[0m
		mptransfer prince-bandit
	endif
endif
if isaffected($i) & 1
	c 'cure blindness'
endif
if isaffected($i) !& 128
	c sanc
endif
if isaffected($i) & 1024
	c 'remove curse'
endif
if isaffected($i) & 4096
	c 'cure poison'
endif
if hitprcnt($i) < 30
	c 3 'gdouble heal'
	mpnowait
	break
endif
if hitprcnt($i) < 50
	c 2 'gdouble heal'
	mpnowait
	break
endif
if hitprcnt($i) < 30
	c 'gdouble heal'
	mpnowait
endif
"""
