[[rooms.4153.extra_descriptions]]
keywords = "elder"
description = """
不起眼的老人(elder) - 人類(Human):
不起眼的外表下，隱隱透露出他經過多年鍛鍊的事實。

不起眼的老人(elder)\u001B[1;20m健康狀況良好。\u001B[m

他身上穿著：
< 光  源 > (\u001B[1;16m發光\u001B[m)盜賊的守則(Rules of Thief)
<主要武器> 暗殺匕首(assassination dagger)
