你正漫步在魔眼叢林密處裡。一陣肅殺的氣息似乎從未曾中斷過，雪白
的濃霧也不知在何時迷漫四周，使得你心頭更加的緊張。緊湊的呼吸聲伴隨
著那疲憊的腳步聲，有如死亡樂章裡的一段章節似的。雖然視野在濃霧中遭
受到了影響，而且似乎視野有越來越模糊的情形。也因此，你的感觀也就更
加地敏銳，在你正準備開始移動時，發現這附近的土地似乎有些許的鬆動，
