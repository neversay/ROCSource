description = """
你正漫步在魔眼叢林深處的小徑上。周遭的空氣讓你感覺異常的潮濕，
不時吹起的寒風讓你覺得身子愈來愈冰冷。在你兩旁的叢林中，樹幹之間幾
乎全是糾結纏繞的蜘蛛絲。仔細一看的話，還能看到有數根白骨夾雜在蜘蛛
絲中，也許是早前來此的冒險者們的殘骸吧。真希望你不會有變成他們一員
