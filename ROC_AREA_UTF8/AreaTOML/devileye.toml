name = "魔眼叢林深處"
description = """
你正漫步在魔眼叢林深處裡。一陣肅殺的氣息似乎從未曾中斷過，雪白
的濃霧也不知在何時迷漫四周，使得你心頭更加的緊張。緊湊的呼吸聲伴隨
著那疲憊的腳步聲，有如死亡樂章裡的一段章節似的。濃霧中，雖然視野也
遭受到了影響，但在你僅能見到的範圍內，仍究是一樣的情景。尤其是樹幹
