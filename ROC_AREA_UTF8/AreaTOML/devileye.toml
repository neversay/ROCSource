[rooms.24270]
name = "魔眼叢林密穴"
description = """
這裡乃是魔眼蜘蛛皇后的所居處。你無法相信眼前所能看到的情景，竟
有著數個巨大的卵繭排放在四周，仔細一看的話，卵繭裡還未成形的幼年魔
眼蜘蛛還在蠕動著。當然，你也沒那精神可讓你去擔心那些幻年魔眼蜘蛛是
否會剛好破繭成形出來攻擊你，因為你眼前的魔眼蜘蛛皇后似乎正想要把你
給當成他們的補品呀～
"""
flags = ["DARK", "NO_MOB", "UNDERGROUND", "NO_RECALL", "SUMMON_BIT"]
sector = "FOREST"
[[rooms.24270.programs]]
trigger = "room_time"
argument = "100"
script = """
if pcnum($) == 0
	if roomtimer($0) == 0
		if mobcount(24209) == 0
			mload 24209
		endif
	endif
endif
"""
[[rooms.24270.programs]]
trigger = "room_leave"
argument = "127 100"
script = """
at $n add_qmark $n devileye_save -1 3 0 0 0 1
at $n echoat $n 進度儲存完成，你將有兩次機會從銀龍聖殿那裡接關(continue)直接此地。
"""
