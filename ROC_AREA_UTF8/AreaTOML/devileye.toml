script = """
echo 突然碰～的一聲巨響，你看到下方的土地整個都鬆垮了。
echo 一條通往下方的密道也就此出現在你面前。
at 24250 echo 你聽到南方傳來了巨大的聲響！
at 24254 echo 你聽到東方傳來了巨大的聲響！
makedoor 5 密道 密道 0 0 24270
"""
