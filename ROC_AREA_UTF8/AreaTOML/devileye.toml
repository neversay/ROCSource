[rooms.24253]
name = "魔眼叢林深處"
description = """
你正漫步在魔眼叢林深處裡。潮濕的空氣讓你呼吸不甚順暢，不時吹起
的寒風總是讓你的身上沾粘到那惹人厭煩的蜘蛛絲，因為需要注意隨時會從
天而降的魔眼蜘蛛的攻擊，你也無法分心去處理掉這些蜘蛛絲。在你視野所
見的樹幹之間幾乎全是糾結纏繞的蜘蛛絲。仔細一看的話，還能看到有數根
白骨夾雜在蜘蛛絲中，也許是早先來此的冒險者們的殘骸吧。真希望你不會
有變成他們一員的一天。你戰戰兢兢的踏出你的腳步，卻發現除了踅音的迴
響之外，空氣中還充滿了細微的低語聲，而當你一停下腳步，樹林又立刻陷
入一片死寂，你不禁懷疑，這座森林是活的？
"""
