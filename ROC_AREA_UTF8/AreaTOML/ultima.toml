[rooms.2400]
name = "最終聖戰--創世紀(Ultima)的入口"
description = """
上方巨大的月之門(moongate)發出奇異的藍光, 照耀在南邊的村門(gate)上.
從開啟著的門之間, 你可以看到另一邊是一個小村子. 月之門的左右兩旁有兩個石
座, 左邊的那個石座上放著一個魔法卷軸(magic scroll), 右邊的石座上則放置著
一個石碑(plaque).
"""
flags = ["NO_MOB", "SUMMON_BIT"]
sector = "INSIDE"
[[rooms.2400.extra_descriptions]]
keywords = "magic scroll"
description = """
當你碰觸到這個魔法卷軸的一剎那, 卷軸突然發出強烈的光芒, 嚇得你退了好幾步
！當你退開來之後, 就見到卷軸發出的那道光芒逐漸形成一個巨大的人影. 一陣低
沉的聲音從人影中傳來：「歡迎來到創世紀！不管任何程度的冒險者都能在這裡找
到適合自己的任務和冒險, 每塊大陸難度會逐漸增加, 請小心. 祝您玩得愉快.」
"""
[[rooms.2400.extra_descriptions]]
keywords = "plaque"
description = """
石碑上寫著：「本區域為 Merc 2.0 所使用.」
下面有一行新刻上去的字：「由 Zcecil 中文化, Wind 校正改編.」
"""
