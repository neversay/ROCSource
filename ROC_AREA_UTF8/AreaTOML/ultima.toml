        echoat $n 多，我們只知道.... ... 橙葉綠樹法杖 .. 神龍魂
        echoat $n \u001B[1;31m有段字跡模糊不清。\u001B[0m。
else
        echoat $n 你一拿起書，整本書就不明來由的燒起來。
endif
if is_qmark($n) == olympus_weapon_quest1 100015
        echoat $n 你覺得你的資料大概已經蒐集完成了.
        mod_qmark $n olympus_weapon_quest v1 + 4
        del_qmark $n olympus_weapon_quest1
endif
"""

