[mobiles.2405]
keywords = "katrina woman shepherd"
short_description = "凱特琳娜(Katrina)"
long_description = "牧羊女凱特琳娜(Katrina)正在村莊裡巡視著.\n"
description = """
凱特琳娜是天命勇士(Warriors of Destiny)之一，她是謙遜的象徵。在完成
她個人的昇華考驗之後，她回到了自己的家園，並且加入了新美尼琴西亞重建
的行列。雖然已經很久沒有動武了，她仍然是個強大的戰士，而且也是新美琴
尼西亞最有力的守護者。
"""
act_flags = ["NPC", "SCAVENGER", "STAY_AREA"]
affected_flags = ["SANCTUARY", "PROTECT"]
alignment = 1000
level = 37
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 100
sex = "female"
class = ["WARRIOR"]
spec_flags = ["NO_CHARM"]
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == ultima_enemy
        mpechoat $n $I 仔細打量了你一番.
        mpechoat $n $I 說 '你就是那個驕傲的入侵者嗎?'
        mpechoat $n $I 說 '無論如何我是不會幫助你的!'
        break
endif
if is_qmark($n) & ultima_destroy_evil 300002
        smile $n
        mpechoat $n $I 說 '希望你能持續保有謙遜的美德.'
        break
endif
if is_qmark($n) == ultima_destroy_evil 100003
        if is_qmark($n) !& ultima_destroy_evil 300001
                mpechoat $n $I 說 '喔, 是國王和聖者要你來接受考驗的嗎?'
                mpforce $n nod
                mpechoat $n $I 說 '沒問題, 我已經準備好了, 今天就看你的表現了.'
                mpechoat $n $I 說 '記得多留意周遭的事物喔...'
                mpechoat $n $I 說 '如果有什麼問題就儘管問我吧.'
                mpmod_qmark $n ultima_destroy_evil v2 | 1
                mpadd_qmark $n ultima_magincia 300 0 0 0 0 1
                mpadd_qmark $n ultima_magincia_timer 20 0 0 0 1 1
                break
        endif
endif
smile
mpechoat $n $I 說 '歡迎來到新美琴尼西亞, 有什麼事需要我幫忙的嗎?'
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == ultima_enemy
        mpechoat $n $I 仔細打量了你一番.
        mpechoat $n $I 說 '你就是那個驕傲的入侵者嗎?'
        mpechoat $n $I 說 '無論如何我是不會幫助你的!'
        break
endif
if is_qmark($n) & ultima_destroy_evil 300001
        mpechoat $n $I 說 '好吧... 現在你重新去體會謙遜的真諦.'
        mpdel_qmark $n ultima_magincia
        mpdel_qmark $n ultima_magincia_timer
        mpmod_qmark $n ultima_destroy_evil v2 r 3
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "humility 謙遜"
script = """
if is_qmark($n) & ultima_destroy_evil 300001
        mpechoat $n $I 說 '謙遜的符石就在我這邊, 如果你要我驗收你的成果的話'.
        mpechoat $n $I 說 '只要和我說符石(mantra)就可以了.'
else
        mpechoat $n $I 說 '謙遜是這裡所代表的美德, 希望你也能夠擁有.'
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "pride 驕傲"
script = """
mpechoat $n $I 說 '驕傲過去人民的惡習和滅亡的原因.'
mpechoat $n $I 說 '我們應該培養謙遜的美德, 革除驕傲的惡習.'
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "mantra 符石"
script = """
if is_qmark($n) != ultima_magincia
or is_qmark($n) & ultima_destroy_evil 300002
        break
endif
if is_qmark($n) == ultima_enemy
        mpechoat $n $I 仔細打量了你一番.
        mpechoat $n $I 說 '你就是那個驕傲的入侵者嗎?'
        mpechoat $n $I 說 '無論如何我是不會幫助你的!'
        break
endif
if is_qmark($n) == ultima_magincia_timer
        mpechoat $n $I 說 '你的謙遜看來還要靠時間來顯現...'
        break
endif
if is_qmark($n) == ultima_magincia 100004
        mpechoat $n $I 說 '你認為自己是否有資格通過考驗呢?
        mpechoat $n Choose a topic: yes no
        mpmod_qmark $n ultima_magincia v0 = 5
else
        mpechoat $n $I 說 '沒有經歷過驕傲帶來的失敗的人, 是不容易瞭解謙遜的'
        mpechoat $n $I 說 '希望你再多從這裡發現一些你要的答案...'
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == ultima_magincia 100005
        mpechoat $n $I 說 '看來你還是沒能瞭解謙遜的真諦...'
        sigh
        mpmod_qmark $n ultima_magincia v0 = 4
        mpadd_qmark $n ultima_magincia_timer 20 0 0 0 1 1
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) == ultima_magincia 100005
        if is_inv_obj($n) == 2401
        or is_inv_obj($n) == 2501
                shake
                mpechoat $n $I 說 '你對自己太沒有信心了.'
                mpechoat $n $I 說 '你以前就已經通過考驗囉.'
                mpdel_qmark $n ultima_magincia
                break
        endif
        mpechoat $n $I 誠心的恭喜你.
        mpechoat $n $I 說 '恭喜你通過考驗了, 這顆代表謙遜的符石你就拿去吧.
        mpoload 2401 $n viclv target
        mpdel_qmark $n ultima_magincia
        mpmod_qmark $n ultima_destroy_evil v2 | 2
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "history 歷史 過去 past"
script = """
if is_qmark($n) == ultima_magincia 100000
        nod $n
        mpechoat $n $I 說 '好的, 讓我慢慢說給您聽.'
        mpechoat $n $I 說 '過去這裡曾經是一個繁華的商業城鎮, 人民生活十分富裕'
        mpechoat $n $I 說 '但卻也因此染上了驕傲, 奢侈, 浪費的惡習, 甚至變得不事生產'
        mpechoat $n $I 說 '只知壓榨其他弱小村落的人民...'
        mpechoat $n 　
        mpechoat $n $I 說 '後來巫師蒙丹(Mondain)來到了這裡, 用他強的魔力魅惑人民'
        mpechoat $n $I 說 '聽從他的命令, 開始四處作亂, 破壞了不列顛尼亞的和平...
        mpechoat $n 　
        mpechoat $n $I 似乎回憶起了一些往事...
        mpechoat $n Choose a topic: continue
        mpmod_qmark $n ultima_magincia v0 = 1
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "mondain"
script = """
if is_qmark($n) == ultima_magincia 100001
        mpechoat $n $I 說 '蒙丹原本是不列顛王國的皇家巫師, 但他企圖謀取不列顛的'
        mpechoat $n $I 說 '統治權, 於是他開始研究古代邪惡魔法, 想要魅惑國王.'
        mpechoat $n $I 說 '但幸好聖遊俠杜波爾(Dupre)看穿了他的陰謀通知國王'
        mpechoat $n $I 說 '國王在洞悉了蒙丹的邪惡後, 召集部下要逮捕蒙丹'
        mpechoat $n $I 說 '不過蒙丹還是靠著強大的魔法脫逃了, 於是他懷著恨意來到'
        mpechoat $n $I 說 '美琴尼西亞, 進行他的邪惡報復計劃.
        mpechoat $n Choose a topic: continue
        mpmod_qmark $n ultima_magincia v0 = 2
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "dupre"
script = """
mpechoat $n $I 說 '杜波爾是國王的好朋友, 同時也是得力的助手'
mpechoat $n $I 說 '他帶領著一群遊俠們四處行俠仗義, 遇到別人有困難就加以協助'
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "continue"
script = """
if is_qmark($n) == ultima_magincia 100001
        mpechoat $n $I 從回憶中回過神來...
        mpechoat $n $I 說 '哦, 剛剛說到那了?'
        mpechoat $n $I 說 '我們來說說蒙丹如何?'
        break
endif
if is_qmark($n) == ultima_magincia 100002
        mpechoat $n $I 說 '好的, 我繼續說下去...'
        mpechoat $n $I 說 '國王派出軍隊進攻美琴尼西平亂, 本來一般人民當然不是正規軍'
        mpechoat $n $I 說 '對手, 但蒙丹祈求邪神降威, 讓人民用死後的靈魂作為交換條件'
        mpechoat $n $I 說 '於是王軍反而失利, 蒙丹反而還被佔領了鄰近的村莊...'
        mpechoat $n $I 說 '直到最後聖者(Avatar)出現了, 他以神聖力量戰勝邪惡'
        mpechoat $n $I 說 '並用美德感化人心, 重新喚回人性的光輝, 徹底打敗了蒙丹'
        mpechoat $n $I 說 '現在的新美琴尼西亞就是我們重新建設的.'
        mpmod_qmark $n ultima_magincia v0 = 3
endif
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "avatar"
script = """
mpechoat $n $I 說 '聖者是八大美德的具體實踐者, 他帶領不列顛擊敗了'
mpechoat $n $I 說 '邪惡的力量, 現在邪惡力量再度掘起, 希望你能成為'
mpechoat $n $I 說 '新一代的聖者, 戰勝一切邪惡.'
"""
[[mobiles.2405.programs]]
trigger = "talk_prog"
argument = "now 現在 目前 new"
script = """
if is_qmark($n) == ultima_magincia 100003
        mpechoat $n $I 說 '過去的美琴尼西亞曾因為戰爭的浩劫成了一片廢墟'
        mpechoat $n $I 說 '後來我得到國王的援助, 率領族人回來重建這片家園'
        mpechoat $n $I 說 '我們謹遵聖者的教誨, 以謙遜的美德對待彼此'
        mpechoat $n $I 說 '如今美琴尼西亞已經走出過去的陰影,'
        mpechoat $n $I 說 '這都要感謝國王和聖者的協助, 以及族人們的配合.'
        mpmod_qmark $n ultima_magincia v0 = 4
endif
"""
[[mobiles.2405.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
if is_qmark($n) == ultima_enemy
        mpmod_qmark $n ultima_enemy timer + 20
        mpmod_qmark $n ultima_enemy v0 + 1
else
        mpadd_qmark $n ultima_enemy 40 1 0 0 1 1
endif
"""

