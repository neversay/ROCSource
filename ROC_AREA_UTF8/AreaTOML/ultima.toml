[[rooms.2517.programs]]
trigger = "room_time"
argument = "100"
script = """
if roomvalue($0) >= 3
	break
endif
if roomtimer($0) == 0
	if robjcount(18039) > 0
		modrvt v0 + 1
		modrvt t0 = 100
	endif
endif
"""
[[rooms.2517.programs]]
trigger = "room_command"
argument = "push tree"
script = """
if robjcount(18039) == 0
	echoat $n 什麼？
	break
endif
if is_qmark($n) == homeport_coconet_quest
	if roomvalue($0) <= 0 
		if roomvalue($1) == 1
			echoat $n 似乎有人已經在努力的推動椰子樹了，或許你該稍等一下。
		else
			if mvnum($n) < 300
				echoat $n 你已經沒有體力去推動椰子樹了。
				break
			else
				stun $n 60
				modrvt v1 = 1
				echoat $n 你使盡了吃奶的力氣，努力的推晃著眼前的椰子樹。
				echoaround $n 你看到 $N 在貼近椰子樹後，便開始使勁的推晃著椰子樹。
				if rand(50)
					callout 1 echoat $n 你用力的搖晃著椰子樹。
					callout 2 modhmv $n 21.300 300 0
					callout 3 echoat $n 無奈的是，椰子根本連動都不動。
					callout 3 modrvt v1 = 0
				else
					callout 1 echoat $n 你用力的搖晃著椰子樹。
					callout 2 modhmv $n 21.300 300 0
					callout 3 echoat $n 終於，你頭上的椰子似乎開始鬆落.....。
					callout 4 echoat $n 你衝上前去試圖接住那個要鬆落的椰子！
					callout 4 echoaround $n 一顆椰子鬆動落掉落了下來！
					callout 5 rcall check_coconut $n
				endif
			endif
		endif
	else
		echoat $n 滿身是汗的你仰頭望了一下，才發現樹上早已沒半顆椰子了。
		echoaround $n 在 $N 使勁的推晃了一陣子之後，你卻發現樹上早就沒半顆椰子了。
	endif
else
	stun $n 60
	modrvt v1 = 1
	echoat $n 你使盡了吃奶的力氣，努力的推晃著眼前的椰子樹。
	echoaround $n 你看到 $N 在貼近椰子樹後，便開始使勁的推晃著椰子樹。
	callout 1 echoat $n 你用力的搖晃著椰子樹。
	callout 2 modhmv $n 21.300 300 0
	callout 3 echoat $n 無奈的是，椰子根本連動都不動。
	callout 3 modrvt v1 = 0
endif
"""
[[rooms.2517.programs]]
trigger = "room_defun"
argument = "check_coconut"
script = """
if is_qmark($n) & homeport_coconet_quest 100002
	if is_qmark($n) & homeport_coconet_quest 100004
		echoat $n 雖然你試圖接住掉落的椰子，不過還是失敗了，椰子滾入了海中，消失不見。
		echoaround $n $N試圖接住掉落的椰子，不過還是失敗了。
		modrvt v1 = 0
		break
	endif
endif
if is_qmark($n) & homeport_coconet_quest 100002
	mod_qmark $n homeport_coconet_quest v0 | 4
else
	mod_qmark $n homeport_coconet_quest v0 | 2
endif
if dex($n) < 20
	echoat $n 雖然椰子終究被你接住，但你也因此而受傷了。
	echoaround $n $N打算示範「如何用頭接住樹上掉落的椰子」，但顯然表演失敗了，他被砸得眼冒金星。
	modhmv $n 03.30 30 0
else
	echoat $n 你敏捷的接住了掉落的椰子，絲毫未損。
	echoaround $n $N靈巧地接住樹上掉落的椰子。
endif
oload 18038 1 $n target
modrvt v1 = 0
"""

