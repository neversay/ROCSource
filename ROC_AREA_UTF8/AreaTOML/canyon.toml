		mpcallout 1 tell $n 鍊成釜的材料都湊齊了，現在要去收集靈藥的材料。(material)
	endif
endif
"""
[[mobiles.9233.programs]]
trigger = "give_prog"
argument = "10779"
script = """
mpjunk $o
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($n) == mist_clean_quest 100015
	if is_qmark($n) !& mist_clean_quest 204096
	mpmod_qmark $n mist_clean_quest v1 | 4096
	tell $n 我收到魔力火把了。
endif
if is_qmark($n) & mist_clean_quest 202048
	if is_qmark($n) & mist_clean_quest 204096
		mpmod_qmark $n mist_clean_quest v0 = 16
		mpmod_qmark $n mist_clean_quest v1 | 1024
		mpcallout 1 tell $n 鍊成釜的材料都湊齊了，現在要去收集靈藥的材料。(material)
	endif
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "material"
script = """
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($n) == mist_clean_quest 100016
	tell $n 靈藥的基本組成是元素峽谷的魔力藥草，在谷內部分具有雙相性的元素生物體內能找到。
	tell $n 比較麻煩的是剩下的部分....
	tell $n 不過你還是先去搞一株魔力藥草過來，我會利用這段時間先製作鍊成釜。
	tell $n 剩下的材料等你拿來藥草後再討論。
endif
"""
[[mobiles.9233.programs]]
trigger = "give_prog"
argument = "9232"
script = """
mpjunk $o
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($n) == mist_clean_quest 100016
	mpmod_qmark $n mist_clean_quest v0 = 17
	good $n
	tell $n 我剛好也完成鍊成釜了。
	tell $n 那麼剩下的部分是，要想辦法竊取五位元素主宰的力量。(power)
	mpmod_qmark $n mist_clean_quest v1 r 1024
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "power"
script = """
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($i) == vendor_talking
	mpechoat $n 他正在跟人說話。
	break
endif
if is_qmark($n) == mist_clean_quest 100017
	mpadd_qmark self vendor_talking
	mpmod_qmark $n mist_clean_quest v0 = 18
	tell $n 所謂能製療百病的靈藥，只是把所有必需的物質施加在受者身上，
	tell $n 這樣不管身體缺少什麼都能完整補充。
	tell $n 剛好生長在元素谷的藥草具備吸收元素的能力。
	mpcallout 2 tell $n 你覺得這裡有那麼大量的草藥讓你採集嗎？
	mpcallout 2 tell $n 要作成一瓶靈藥可能要用到上萬株草藥才夠。
	mpcallout 2 tell $n 但是光只是這樣是不夠的，因為這些藥草含有的力量太小了。
	mpcallout 4 tell $n 嘛....大概就類似增質不增量的概念吧。
	mpcallout 4 tell $n 讓一株的力量能抵萬株，就不需要使用大量的藥草鍊製。
	mpcallout 4 tell $n 所以我的作法是，對藥草灌輸大量的元素力量，讓它吸得夠。
	mpcallout 5 tell $n 但想要取得龐大的元素力量，也只能從各主宰的力量下手了。(rulers)
	mpcallout 5 mpdel_qmark self vendor_talking
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "rulers"
script = """
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($i) == vendor_talking
	mpechoat $n 他正在跟人說話。
	break
endif
if is_qmark($n) == mist_clean_quest 100018
	mpadd_qmark self vendor_talking
	mpadd_qmark $n ele_drain -1 0 0 0 0 1
	tell $n 元素主宰們本體只是具有極強大屬性的元素生物，分別統御著谷內不同的元素生物。
	tell $n 它們誕生的原因不明，反正對外界並沒有任何危害，所以也沒人在意就是了。
	mpcallout 2 tell $n 而這也是本次作戰的重點，只要取得部分就夠用了。
	mpcallout 2 tell $n 換言之，它們等同於主宰們身體的一部分。
	mpcallout 2 tell $n 而守護者是由主宰直接分出部分力量所創造出來的。
	mpcallout 2 tell $n 每位主宰都會創造一位守護者，保衛自身領域不受侵擾。
	mpcallout 3 mpechoat $n $I突然朝你念了一道咒語。
	mpcallout 4 tell $n 簡單講，我要你去現場幹掉各屬性的守護者，取得身上的力量。(elements)
	mpcallout 4 tell $n 但這魔法對元素生物的效果不佳，需要先打散它們才有辦法吸取。
	mpcallout 4 tell $n 我剛剛在你身上施加了一道能夠吸收週圍元素的魔法。
	mpcallout 5 tell $n 但還是勸你一句，柿子挑軟的吃。
	mpcallout 5 tell $n 當然覺得自己實力非常強想硬上主宰，我也沒意見啦。
	mpcallout 6 addoil $n
	mpcallout 6 mpdel_qmark self vendor_talking
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "elements"
script = """
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($i) == vendor_talking
	mpechoat $n 他正在忙。
	break
endif
if is_qmark($n) != ele_drain
	break
endif
if is_qmark($n) == mist_clean_quest 100018
	if is_qmark($n) != ele_drain 100031
		tell $n 快點去收集元素的力量吧。
			mpechoat $n 還沒取得：
		if is_qmark($n) !& ele_drain 100001
			mpechoat $n 　　　　　地
		endif
		if is_qmark($n) !& ele_drain 100002
			mpechoat $n 　　　　　水
		endif
		if is_qmark($n) !& ele_drain 100004
			mpechoat $n 　　　　　風
		endif
		if is_qmark($n) !& ele_drain 100008
			mpechoat $n 　　　　　雷
		endif
		if is_qmark($n) !& ele_drain 100016
			mpechoat $n 　　　　　火
		endif
	else
		mpmod_qmark $n ele_drain v0 = 0
		mpadd_qmark self vendor_talking
		tell $n 不錯，看來你收集完成了，那我開始精鍊靈藥。
		tell $n 你在一旁等著別亂跑避免鍊成失敗要再收集一次元素。
		mpcallout 1 mpechoat $n $I將草藥丟入鍊成釜中，點燃魔力火把加熱。
		mpcallout 3 mpechoat $n $I慢慢的將你身上的元素力量剝離，導入鍊成釜中....
		mpcallout 5 mpechoat $n $I慢慢的將你身上的元素力量剝離，導入鍊成釜中....
		mpcallout 7 mpechoat $n $I慢慢的將你身上的元素力量剝離，導入鍊成釜中....
		mpcallout 8 mpechoat $n $I釜中的草藥漸漸發出光芒.....
		mpcallout 10 mpechoat $n $I釜中的草藥漸漸發出光芒.....
		mpcallout 11 mpechoat $n $I釜中的草藥化成一灘液體。
		mpcallout 12 mpechoat $n $I將液體裝入瓶子中交給你。
		mpcallout 12 mpmod_qmark $n mist_clean_quest v0 = 19
		mpcallout 12 mpdel_qmark $n ele_drain
		mpcallout 12 mpoload 9233 $n 1 target
		mpcallout 13 bye $n
		mpcallout 13 tell $n 這就是成品了，拿去完成你的事吧。
		mpcallout 13 mpdel_qmark self vendor_talking
	endif
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) < mist_clean_quest 300004
	break
endif
if is_qmark($i) == vendor_talking
	mpechoat $n 他正在跟人說話。
	break
endif
if is_qmark($n) == mist_clean_quest 100014
	mpadd_qmark self vendor_talking
	mpmod_qmark $n mist_clean_quest v0 = 18
	tsk $n
	mpcallout 1 tell $n 這讓我想起了以前某個朋友呢....
	mpcallout 1 tell $n 你為什麼能為了一個未開化的陌生人作到如此地步？明明跟自己的利益完全沒有關係....
	mpcallout 2 ponder
	mpcallout 3 tell $n 但是我目前還缺少某些材料，要從各元素主宰那裡取得。(rulers)。
	mpcallout 3 tell $n 那麼好吧，看在你無私的份上，我幫你作靈藥。
	mpcallout 3 mpdel_qmark self vendor_talking
endif
"""
[[mobiles.9233.programs]]
trigger = "talk_prog"
argument = "elixirs"
script = """
if is_qmark($i) == vendor_talking
	mpechoat $n 他正在跟人說話。
	break
endif
if is_qmark($n) == mist_clean_quest 100011
	if is_qmark($n) >= mist_clean_quest 300004
		mpadd_qmark self vendor_talking
		say 你問我靈藥怎麼來的？
		mpcallout 1 ponder
		mpcallout 3 say 當然是商業機密！白癡才會告訴你勒！
		mpcallout 4 laugh $n
		mpcallout 5 mpechoat $n 雖然他態度相當囂張，但這個人該不會就是特拉恰斯(therachepist)吧？
		mpcallout 5 mpdel_qmark self vendor_talking
		mpcallout 5 mpmod_qmark $n mist_clean_quest v0 = 12
	else
		mpadd_qmark self vendor_talking
		say 你問我靈藥怎麼來的？
		mpcallout 1 ponder
		mpcallout 3 say 當然是商業機密！白癡才會告訴你勒！
		mpcallout 4 laugh $n
		mpcallout 4 mpdel_qmark self vendor_talking
	endif
else
	mpadd_qmark self vendor_talking
	say 你問我靈藥怎麼來的？
	mpcallout 1 ponder
	mpcallout 3 say 當然是商業機密！白癡才會告訴你勒！
	mpcallout 4 laugh $n
	mpcallout 4 mpdel_qmark self vendor_talking
endif
"""

