                mpdel_qmark $n enclave_quest_shield
                mpadd_qmark $n enclave_quest_shield -1 12 0 0 0 1
                mpcallout 1 say ........................「紫燄之盾」。
                mpcallout 2 mpechoat $n 一道淡紫色的燄光瞬間籠罩了你的身體！
                mpcallout 2 mpechoaround $n 一道淡紫色的燄光瞬間籠罩了$N！
                mpcallout 3 tell $n 好啦，這樣就可以讓那傢伙的殺人法術失效了......
                mpcallout 4 tell $n 不過還是要提醒你，這個護盾是有抵擋次數限制的，大概挨個十二發就會碎了。
                mpcallout 5 tell $n 所以你要在護盾破碎前把他斃了，否則......不用我說了吧？
                mpcallout 6 tell $n 你有朋友願意去幫你的，也可以來找我。
                mpcallout 6 mpdel_qmark self enclave_talking
        else
                tell $n 滾！
        endif
else
        mpechoat $n 插嘴不好，不要插嘴。
endif
"""
[[mobiles.21712.programs]]
trigger = "talk_prog"
argument = "what"
script = """
if is_qmark($i) != enclave_talking
        if is_qmark($n) !& enclave_quest 300001
                if is_qmark($n) == enclave_quest 100004
                        mpadd_qmark self enclave_talking 10 0 0 0 0 1
                        tell $n 這是秘密武器，所以我只能借給你半天，而且只能借你一次。
                        tell $n 如果你很不幸地不能拿，那麼我也沒輒了。
                        mpcallout 1 mpmod_qmark $n enclave_quest v0 = 5
                        mpcallout 1 mpechoat $n 說話的同時，你發現一把劍正在你的手中成形！
                        mpcallout 2 mpechoat $n 然而當你看著這把劍，你突然有個莫名其妙的感想......
                        mpcallout 2 mpoload 21727 $n 1 target
                        mpcallout 3 mpechoat $n 「某電鋸魔要是再這麼惡搞下去，總有一天會遭天譴」
                        mpcallout 4 mpechoat $n 雖然不曉得自己為什麼突然會有這麼奇怪的感想，但是現在管不了那麼多。
                        mpcallout 4 mpdel_qmark self enclave_talking
                endif
        else
                tell $n 滾！
        endif
else
        mpechoat $n 插嘴不好，不要插嘴。
endif
"""

