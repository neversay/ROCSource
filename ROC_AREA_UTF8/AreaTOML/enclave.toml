[[rooms.21747.programs]]
trigger = "room_command"
argument = "search default"
script = """
if ispc($n)
        if insameroom(predator)
                echoat $n ......你先擺平掠食者再來考慮這件事吧。
        else
                if is_qmark($n) == enclave_quest 100002
                        echoat $n 你根本就沒看到什麼小女孩的影子，倒是看到幾具小孩體型的骷髏。
                        echoat $n 然而，其中一具骷髏身旁的東西引起了你的注意力。
                        echoat $n 你撿起了這個奇形怪狀的東西，心想把它拿回去給梅菲雅(Mephia)看看好了。
                        mod_qmark $n enclave_quest v0 = 3
                else
                        echoat $n 你什麼都沒找到。
                endif
        endif
endif
"""

