[rooms.63000]
name = "封魔洞窟外"
description = """
你現在正站在封魔洞窟外不遠處，東邊你看到了一個黑漆漆的洞口，那就是
傳說中的封魔洞窟。據說裡面除了有許多恐怖的怪獸與魔物以外，還有幾個更可
怕的大魔頭也被封印在洞窟深處。至於是真是假，就不得而知了。而在洞口的右
前方，則有著一塊石碑(stele) ，上面似乎刻有著文字。
"""
flags = ["DARK", "NO_MOB", "SUMMON_BIT", "NO_TELEPORT_IN"]
sector = "FIELD"
[[rooms.63000.extra_descriptions]]
keywords = "stele"
description = """
本區域原作者為 Casamia 的玩家 SSkill
該區域封閉後，經 Feena 於2000年10月進行大幅度改修
之後， Feena 於2003年4月開始將其內容修改為適合於ROC的格式
並再更進一步擴充，於2004年4月正式上線
雖然名為改修，其實幾乎等於從頭創造一個新區域
不過本區域中某些地方仍然存有原始封魔洞窟的影子

                                                        by Feena
"""
[rooms.63000.exits.east]
description = ""
keywords = ""
locks = []
key = 0
to_room = 63001
[rooms.63000.exits.south]
description = ""
keywords = ""
locks = []
key = 0
to_room = 15596
[[rooms.63000.programs]]
trigger = "room_enter"
argument = "127 100"
script = """
if is_qmark($n) == sealevil_quest
        if is_qmark($n) & sealevil_quest 200001
                if is_qmark($n) == sealevil_Aleru_quest 100008
                        mod_qmark $n sealevil_Aleru_quest v0 = 9
                        mod_qmark $n sealevil_quest v1 = 0
                endif
        endif
        if is_qmark($n) & sealevil_quest 200002
                if is_qmark($n) == sealevil_Aleru_quest 100009
                        mod_qmark $n sealevil_Aleru_quest v0 = 10
                        mod_qmark $n sealevil_quest v1 = 0
                endif
        endif
        if is_qmark($n) & sealevil_quest 200004
                if is_qmark($n) == sealevil_Aleru_quest 100010
                        mod_qmark $n sealevil_Aleru_quest v0 = 11
                        mod_qmark $n sealevil_quest v1 = 0
                endif
        endif
        if is_qmark($n) & sealevil_quest 200008
                if is_qmark($n) == sealevil_Aleru_quest 100011
                        mod_qmark $n sealevil_Aleru_quest v0 = 12
                        mod_qmark $n sealevil_quest v1 = 0
                        at 63199 force derail-se mpcall aleru_quest_call
                endif
        endif
	if is_qmark($n) & sealevil_quest 200016
		if is_qmark($n) == sealevil_Aleru_quest 100015
			mod_qmark $n sealevil_Aleru_quest v0 = 16
			mod_qmark $n sealevil_quest v1 = 0
		endif
	endif
        if is_qmark($n) == sealevil_Polo_quest 100009
                mod_qmark $n sealevil_quest v0 | 1
                del_qmark $n sealevil_Polo_quest
        endif
        if is_qmark($n) == sealevil_Aleru_quest 100057
                mod_qmark $n sealevil_quest v0 | 2
                del_qmark $n sealevil_Aleru_quest
        endif
        if is_qmark($n) == sealevil_Rafael_quest 100016
                mod_qmark $n sealevil_quest v0 | 4
                del_qmark $n sealevil_Rafael_quest
        endif
        if is_qmark($n) == sealevil_Tylas_quest 100009
                mod_qmark $n sealevil_quest v0 | 8
                del_qmark $n sealevil_Tylas_quest
        endif
        if is_qmark($n) == sealevil_Yellu_quest 100004
                mod_qmark $n sealevil_quest v0 | 16
                del_qmark $n sealevil_Yellu_quest
        endif
else
        add_qmark $n sealevil_quest -1 0 0 0 0 1
endif
"""

