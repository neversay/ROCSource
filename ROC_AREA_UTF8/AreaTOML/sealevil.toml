"""
[[mobiles.63068.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100084
        if inroom($i) == 63265
                tell $n 這個方法有點危險，你的生命力至少要到一定程度，才不會發生危險。
                mpcallout 1 tell $n 不過這也不是要求你要有蟑螂般的生命力......
                mpcallout 2 tell $n 那麼我先大致解說一下方法。
                mpcallout 3 tell $n 首先，你應該看到我腳下這片漂亮的廣場了吧？
                mpcallout 4 tell $n 其實這片廣場除了漂亮以外，還藏有某些秘密......
                mpcallout 5 tell $n 我們要做的，就是使用隱藏在這裡的力量，去找出冥闇幽月的所在位置。
                mpcallout 6 tell $n 雖然說這個方法有點亂七八糟，不過我已經束手無策了......
                mpcallout 7 mpechoat $n $I忽然停住，似乎在考慮該怎麼繼續說下去。
                mpcallout 8 tell $n 只不過呢～～之前我沒採用這個方法的理由是......
                mpcallout 9 tell $n 這個方法會吸收生命力......而且吸得很兇。
                mpcallout 10 mpechoat $n 你忽然覺得自己八成會被她當成替死鬼......
                mpcallout 11 mpechoat $n 大概是察覺到你的不安，$I連忙補上一句。
                mpcallout 12 tell $n 放心放心，我不會讓你當免費勞工的啦，工作結束後會有一點酬勞的。
                mpcallout 13 tell $n 先告訴你方法，你得在這片廣場召喚(summon)魔神......
                mpcallout 14 tell $n 理論上是不會召喚過來，不過我可以趁機用向祂詢問情報。
                mpcallout 15 tell $n 這個時候，身為祭品......呃不，身為助手的你，將會被魔神吸收生命力。
                mpcallout 16 tell $n 不過這個方法還有個缺點，就是魔神給的解答不見得會是我們想要的。
                mpcallout 17 tell $n 我說過這個辦法雖然亂七八糟，不過勉強還可以用......
                mpcallout 18 tell $n 現在只等你同意了(agree)。
                mpcallout 18 mpmod_qmark $n sealevil_Aleru_quest v0 = 85
                mpcallout 19 mpechoat $n 你不禁在心中咒罵：「這種鬼方法到底是哪個傢伙發明的！？」
        endif
endif
"""
[[mobiles.63068.programs]]
trigger = "talk_prog"
argument = "agree"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100085
        tell $n 那麼，我隨時都可以，你現在就可以開始召喚了。
        mpcallout 1 tell $n 召喚之後來問(ask)我結果。此外，兩次的召喚儀式之間必須休息一下。
        mpcallout 2 mpmod_qmark $n sealevil_Aleru_quest v0 = 86
endif
"""
[[mobiles.63068.programs]]
trigger = "talk_prog"
argument = "ask"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100087
        if rand(20)
                mpechoat $n 你發現$I臉上有著奇怪的神情。
                mpechoat $n $I沒說什麼，只是紅著臉對你搖了搖頭。
                mpechoat $n 看樣子八成不行，只好再來一次了。
                mpechoat $n 不過......$I為什麼會臉紅？難道是......為了達到三倍速嗎？
                mpmod_qmark $n sealevil_Aleru_quest v0 = 86
        else
                if rand(25)
                        tell $n 嗯......我問到的情報是下次史卡拉貝地下賭馬的勝利馬匹。
                        tell $n 因為沒什麼用，所以我就把資料銷毀了。
                        tell $n 怎麼了？你怎麼一副看起來很懊惱的樣子？出了什麼事嗎？
                        mpechoat $n 聽到$I這麼說，你真不曉得她是裝傻還是真的不曉得......
                        mpechoat $n 不管如何，你只能再去召喚一次了。
                        mpmod_qmark $n sealevil_Aleru_quest v0 = 86
                else
                        if rand(33)
                                mpechoat $n 聽到你要詢問結果，$I嘆了口氣，並遞給你一張詭異的羊皮紙。
                                mpechoat $n 你接過羊皮紙，一股濃厚的血腥味迎面而來！
                                mpechoat $n 你忍住這股氣味，仔細閱讀羊皮紙上的文字......
                                mpechoat $n 「讓身為洗衣板的妳長出六個豐滿胸部的方法」
                                mpechoat $n 你把羊皮紙一丟，決定再去召喚一次。
                                mpmod_qmark $n sealevil_Aleru_quest v0 = 86
                        else
                                if rand(50)
                                        mpechoat $n 你發現$I的態度似乎有點遲疑，不過她還是給了你一張怪怪的羊皮紙。
                                        mpechoat $n 仔細一看，上頭用鮮血寫了幾行你看得懂的文字......
                                        mpechoat $n 「幹掉某Ｆ的方法」
                                        mpechoat $n 再仔細一看，旁邊還有一行焦黑的文字......
                                        mpechoat $n 「我寫的mob竟然不給我面子，Go Die！」
                                        mpechoat $n 看樣子這也是沒什麼用的資料......再試一次吧。
                                        mpmod_qmark $n sealevil_Aleru_quest v0 = 86
                                else
                                        tell $n 嗯......看樣子這個方法也沒那麼糟嘛？
                                        mpcallout 1 tell $n 多少有點頭緒了，冥闇幽月目前還在迷霧之島，但是詳細位置沒辦法確定。
                                        mpcallout 2 tell $n 而且......它目前還完好無缺，並未被解體。
                                        mpcallout 3 tell $n 目前就只能知道這麼多，其他的......
                                        mpcallout 4 tell $n 不過如果我們得到的情報是真的，那麼就有問題了。
                                        mpcallout 5 tell $n 因為傳聞中冥闇幽月被解體成四個部份，但是剛才的結果卻顯示它還完好無缺。
                                        mpcallout 6 tell $n 假如不是有人再度將它組合成原來的模樣，那麼就是......
                                        mpcallout 7 tell $n 當年負責處理冥闇幽月的那些人，其實被它給耍了。
                                        mpcallout 8 tell $n 畢竟冥闇幽月是三劍中最古老，也是最難以控制的一把。
                                        mpcallout 9 mpechoat $n 正當$I對你說明剛才的成果時，四周空間忽然產生劇烈的波動！
                                        mpcallout 10 mpechoat $n 空氣中的邪氣也越來越濃烈，似乎有什麼東西要出現了！
                                        mpcallout 11 tell $n 糟糕，果然這個方法還是有點缺陷......
                                        mpcallout 12 mpechoat $n $I話剛說完，十多個巨大的黑影忽然憑空出現在不遠處，然後忽然消失！
                                        mpcallout 13 tell $n 情況不妙，看來應該是出了點問題，不小心把惡魔給召喚出來了......
                                        mpcallout 14 tell $n 我先去擺平惡魔，你晚點再來找我吧(over)！現在我先送你離開！
                                        mpcallout 14 mpmod_qmark $n sealevil_Aleru_quest v0 = 88
                                        mpcallout 14 mpadd_qmark $n sealevil_teatime 50 0 0 0 0 1
                                        mpcallout 15 mptransfer $n 63000
                                endif
                        endif
                endif
        endif
endif
"""
[[mobiles.63068.programs]]
trigger = "talk_prog"
argument = "over"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100088
        if is_qmark($n) == sealevil_teatime
                tell $n 惡魔趕回去了，不過現在還不是時候，晚點再過來，等我徹底解決問題再說......
                mpechoat $n 只見光芒一閃，你被彩色的光輝所圍繞，瞬間被帶離了這個空間！
                mptransfer $n 63000
        else
                tell $n 問題總算解決了，雖然過程出了點小小的狀況.....
                mpcallout 1 tell $n 不過結果還算不錯，至少有點進展，也有了新的調查方向。
                mpcallout 2 tell $n 現在就只要確認這情報的真實度有多少。
                mpcallout 3 tell $n 辛苦你啦，這是先前說好要給你的報酬......
                mpcallout 4 tell $n 哦，對了對了，還有這個東西，是從剛才那些惡魔身上拿到的......
                mpcallout 4 mpoload 63050 1
                mpcallout 5 give lottery $n
                mpcallout 5 mpexp $n 7500
                mpcallout 5 mpskillexp $n 40000
                mpcallout 5 mpresp $n 2
                mpcallout 5 mpmod_qmark $n sealevil_Aleru_quest v0 = 89
                mpcallout 5 mpcall snowcastle_max_skexp $n
                mpcallout 6 mpechoat $n $I露出大惑不解的表情。
                mpcallout 7 tell $n 不過，為什麼惡魔的身上會帶著這種東西呢......？
        endif
endif
"""
[[mobiles.63068.programs]]
trigger = "talk_prog"
argument = "sound"
script = """
if is_qmark($i) != sealevil_talking
        if is_qmark($n) == sealevil_Aleru_quest 100093
                mpadd_qmark self sealevil_talking 10 0 0 0 0 1
                mpechoat $n 你將之前所聽到的相關訊息與情報都告訴了$I。
                mpcallout 1 tell $n 看樣子我還不夠成熟，我連它的位置在哪裡都不曉得。
                mpcallout 2 tell $n 然而別人卻已經查出它位在南方某處了......
                mpcallout 3 sigh
                mpcallout 4 tell $n 抱歉，在這方面我也沒有什麼可以告訴你的，不過......
                mpcallout 5 tell $n 你在漂浮之塔頂樓應該看過一面石碑吧？上面有八個名字的那塊石碑。
                mpcallout 6 tell $n 前陣子我問過雅比絲和亞魯曼他們，他們說那不是守護靈體。
                mpcallout 7 tell $n 而且他們說，那八個女孩不是一般人，具有極長的壽命。
                mpcallout 8 tell $n 說簡單點，她們與當年封印「冥闇幽月」與「封嶽蒼炎」的人們是同一個年代的人物。
                mpcallout 9 tell $n 我不曉得她們能活多久，說不定還有幾個人活著。
                mpcallout 10 tell $n 如果找得到她們，或許可以得到更進一步的線索吧。
                mpcallout 10 mpmod_qmark $n sealevil_Aleru_quest v0 = 94
                mpcallout 10 mpdel_qmark self sealevil_talking
        endif
else
        tell $n 麻煩你晚點再講好嗎？一次講兩段話很麻煩。
endif
"""
[[mobiles.63068.programs]]
trigger = "defun_prog"
argument = "snowcastle_max_skexp"
script = """
if is_qmark($n) == max_skill_exp
        mpmod_qmark $n max_skill_exp v0 + 5
else
        mpadd_qmark $n max_skill_exp -1 5 0 0 0 1
endif
"""
[[mobiles.63068.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100089
        tell $n 哎呀，你來的正是時候，我正好有事找你。
        tell $n 上次的那顆白櫻指環，你還留著嗎？
        tell $n 我最近學到新方法，可以再拆掉它一層封印，你要試試嗎？
        tell $n 要的話就把指環給我吧。
endif
"""
[[mobiles.63068.programs]]
trigger = "give_prog"
argument = "63116"
script = """
if is_qmark($n) == sealevil_Aleru_quest 100089
        mpat 5 mpjunk $o
        mpechoat $n $I接過了白櫻指環，左手同時浮現一道白色的亮光。
        mpcallout 1 say 我以我的靈力能源為代價，向身在異界的守護精靈‧白夜精靈梅兒露琪娜請求......
        mpcallout 2 say 藉由您那神奇的力量，協助我毀去這顆戒指上的封印吧！
        mpcallout 3 mpechoat $n $I左手的白光瞬間化為數道細線，融進了白櫻指環中。
        mpcallout 4 mpechoat $n 白櫻指環的顏色飛快地改變，原本的白色已經消失無蹤。
        mpcallout 5 mpechoat $n 同時，你發現$I的雙手似乎在冒煙，臉上表情看起來滿痛苦的樣子。
        mpcallout 6 mpat 5 mpoload 63352
        mpcallout 7 give ring $n
        mpcallout 7 mpmod_qmark $n sealevil_Aleru_quest v0 = 90
        mpcallout 8 mpechoat $n $I勉強擠出笑容，她的手似乎很痛的樣子。
        mpcallout 9 tell $n 這就是成品，不過......
        mpcallout 10 tell $n 正如波瑞克所講的，異界守護精靈的力量太強......
        mpcallout 11 tell $n 本來只打算拆一層封印，結果一不小心多拆了好幾層......
        mpcallout 12 tell $n 下次有機會再請你幫忙囉。
        mpcallout 13 wave $n
endif
"""

