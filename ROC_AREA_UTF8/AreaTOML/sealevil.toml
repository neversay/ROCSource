[[mobiles.63064.programs]]
trigger = "fight_prog"
argument = "75"
script = """
if ispc($n)
or ishorse($n)
        say 為什麼要攻擊我！？
        mpecho $I的背後忽然出現了女戰神的幻影！
        mpechoat $n 電光石火之間，強大的衝擊波朝你席捲而來！
        mpechoaround $n 你看見一道非常強大的衝擊波往$n而去！
        mpat 5 cast 'full heal'
        mpnowait
        if dex($n) == 25
                mpechoat $n 你第一時間往旁閃躲，但是衝擊波的速度實在太快了！
                mpechoat $n 你並未完全躲開，不過衝擊波也只擦過你的身旁。
                mpechoaround $n $n展現高明的迴避技巧，衝擊波沒完全打中$n！
                mpforcer here modhmv $n 01.150 150 0
                if rand(30)
                        mpecho 但是，衝擊波忽然爆開！衝擊彈如同暴雨一般襲來！
                        mpforcer here modhmv pc 01.300 300 0
                else
                        mpecho 衝擊波消失在黑暗之中，不見了。
                endif
        else
                if rand(99)
                        mpechoat $n 你一切的防禦完全沒有用！衝擊波狠狠地擊中了你的身體！
                        mpechoaround $n $n被強烈的衝擊波擊中了！
                        mpechoat $n 超乎想像的一擊！你重重地摔倒在地！
                        mpforcer here modhmv $n 01.2500 2500 0
                else
                        mpechoat $n 當你覺得萬事休矣的瞬間，衝擊波忽然消散了！？
                        mpechoaround $n 你看見那強烈的衝擊波在$n面前消失得無影無蹤！
                endif
        endif
endif
"""
