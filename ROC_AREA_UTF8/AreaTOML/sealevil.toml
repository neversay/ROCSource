[[mobiles.63047.programs]]
trigger = "talk_prog"
argument = "agree"
script = """
if is_qmark($i) != sealevil_talking
        if ispc($n)
                if is_qmark($n) != sealevil_Polo_quest
                        if is_qmark($n) !& sealevil_quest 100001
                                if level($n) > 35
                                        if class($n) == 7
                                        or class($n) == 8
                                                mpadd_qmark self sealevil_talking 10 0 0 0 0 1
                                                hmm $n
                                                mpcallout 1 tell $n 是這樣的，數百年前......
                                                mpcallout 2 tell $n 我曾經在洞窟深處得到一塊奇特的石頭。
                                                mpcallout 3 mpechoat $n $I停了一下，看看你的反應。
                                                mpcallout 4 tell $n 別對我的年齡感到奇怪，這不重要。
                                                mpcallout 5 tell $n 我們繼續說吧，經過我長久的研究後......
                                                mpcallout 6 tell $n 我發現，這塊石頭具有強大的力量！
                                                mpcallout 7 tell $n 但是，由於某些因素，這塊石頭已經失去了力量。
                                                mpcallout 8 tell $n 這是很可惜的事，因此，我想讓它恢復昔日的光輝。
                                                mpcallout 9 tell $n 但是你知道的，我必須待在這裡鎮守洞窟。
                                                mpcallout 10 tell $n 因此，這個工作就交給你了。
                                                mpcallout 11 tell $n 你要做的事，是去收集幾項物品，並拿回來給我。
                                                mpcallout 12 tell $n 我所需要的東西如下，記好了。
                                                mpcallout 13 tell $n 首先，魔法高塔的大魔力方塊。
                                                mpcallout 14 tell $n 其次，綠樹王國的白金葉綠樹法杖。
                                                mpcallout 15 tell $n 再來，永恆之塔的忘憂解語護腕。
