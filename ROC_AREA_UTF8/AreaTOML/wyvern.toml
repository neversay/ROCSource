  			mpmod_qmark $n wyvern_tower v0 = 3
		else
  			mpecho $I 苦笑著：現在可是苦哈哈的日子啊....
		endif
	endif
"""
[[mobiles.1716.programs]]
trigger = "talk_prog"
argument = "lopas"
script = """
if is_qmark($n) == wyvern_tower 100000
  		mpecho $I 雙眼熱烈的注視著 $n
  		say 什麼？您願意幫我們打聽羅帕斯的下落嗎？
  		say 真是太好了，我族必定引頸期待您的好消息。
  		say 如果遇到了什麼問題，可以回來找我商量。
  		smile $n
	else
  		think
  		say 羅帕斯可是這一帶赫赫有名的大法師呢！
  		say 據說他跟龍族訂定了特殊契約，擁有操控龍的力量呢！
	endif
"""
[[mobiles.1716.programs]]
trigger = "talk_prog"
argument = "trouble"
script = """
if is_qmark($n) == wyvern_tower 200001
        mpechoat $n $I抬起頭，用盼望的眼神看著你。
        say 唉，本來是不好意思再麻煩英雄您的，不過您提起了，
        say 那我就告知您人馬村現在遇到的困境吧......
        sigh
        mpcallout 1 mpcall chief_talking1 $n
        mpcallout 2 mpcall chief_talking2 $n
        mpcallout 3 mpcall chief_talking3 $n
        mpcallout 3 mpmod_qmark $n wyvern_tower v1 = 2
endif
"""
[[mobiles.1716.programs]]
trigger = "talk_prog"
argument = "p great basilisk"
script = """
if is_qmark($n) == wyvern_tower 200002
        mpechoat $n 你覺得有點一頭霧水，便決定向$I多打聽一些詳細的情報。
        mpechoat $n 特別是關於巨龍蜥出沒的情報....
        mpcallout 1 mpcall chief_talking4 $n
        mpcallout 2 mpcall chief_talking5 $n
        mpcallout 2 mpmod_qmark $n wyvern_tower v1 = 3
endif
"""
[[mobiles.1716.programs]]
trigger = "talk_prog"
argument = "p to solve this problem"
script = """
if is_qmark($n) == wyvern_tower 200003
        mpechoat $n 你毅然決然的向$I表明了願意幫人馬村解決這件麻煩。
        gasp $n
        say 啊，英雄，您真的願意再幫助我們渡過另一次的難關？
        mpechoat $n $I靠在你懷裡不停地哭哭啼啼。
        say 不好意思，太感動了，一時失態....那就請英雄您多加
