	force windsophisticated cry pixiee-m
	force windsophisticated say 我們必須趕快保護門主到史卡拉貝去，一來可以找
	force windsophisticated say 醫者療傷，而且在史卡拉貝有終結者與執法者，風
	force windsophisticated say 之城的人也不敢那麼囂張，繼續追殺...
	force windsophisticated say 拜託你幫我們開道了，我是賢者，戰鬥力真的不強。
	force windsophisticated bow $n
	force windsophisticated mpgroup $n windsophisticated
