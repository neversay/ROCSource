trigger = "room_command"
argument = "search around"
script = """
stun $n 30
echoat $n 你四處翻找....
echoaround $n $N四處摸東摸西的，不知道在找些什麼。
if is_qmark($n) & ianua_info 100001
	if is_qmark($n) == ianua_bothynus_info 100000
		if mobcount(1142) > 0
		or mobcount(1143) > 0
			callout 1 echoat $n 但什麼也沒找到。
		else
			if is_qmark($n) == ianua_bothynus_emeny
				mod_qmark $n ianua_bothynus_info v0 | 1
				at 13200 mload 1142
				callout 1 echoat $n 但什麼也沒找到。
				callout 2 force gentleman-Melufatis mpkill $n
				callout 2 echo 從門外傳來聲響，你發現一對男女走進木屋內，不由分說的朝你砍來。
				callout 2 force gentleman-Melufatis mpdef_rembch $n
				callout 2 force girl-Liliandus mpdef_rembch $n
				callout 2 at 13200 transfer gentleman-Melufatis 1163
				callout 2 at 13200 transfer girl-Liliandus 1163
			else
				mod_qmark $n ianua_bothynus_info v0 | 1
				at 13200 mload 1142
				callout 1 echoat $n 但什麼也沒找到。
				callout 2 echo 從門外傳來聲響，你發現一對男女走進木屋內。
				callout 2 force gentleman-Melufatis mpdef_rembch $n
				callout 2 force girl-Liliandus mpdef_rembch $n
				callout 2 at 13200 transfer gentleman-Melufatis 1163
				callout 2 at 13200 transfer girl-Liliandus 1163
			endif
		endif
	else
		callout 1 echoat $n 但什麼也沒找到。
	endif
else
	callout 1 echoat $n 但什麼也沒找到。
endif
"""
