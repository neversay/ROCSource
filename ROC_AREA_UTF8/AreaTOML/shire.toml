[mobiles.1100]
keywords = "elven wizard"
short_description = "精靈巫師(Elven Wizard)"
long_description = "精靈巫師(Elven Wizard)正在這邊製作節慶要用的慶祝煙火。\n"
description = """
精靈巫師向你看過來，你發覺他的表情相當嚴肅。他的眼神似乎能夠穿透你的心防
直達你的心靈深處。他身上穿著一件銀色的袍子同時拿著一把七彩的法杖。雖然他
看起來甚至比人類最老的人還要老，但是卻似乎擁有比人類的年輕勇士更強的力量。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS"]
alignment = 500
level = 25
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Elf"
class = ["WARRIOR", "MAGE"]
special_function = "spec_cast_mage"
[[mobiles.1100.programs]]
trigger = "talk_prog"
argument = "chicken melody"
script = """
if is_qmark($n) == shire_haton_chicken
	say 別為了這點小事來打擾我！
	say 打聽事情也要看對象！去找常在街上走動的人吧！
	say 他們或許可以幫上你的忙！
endif
"""
[[mobiles.1100.programs]]
trigger = "death_prog"
argument = "50"
script = """
mpdis_magic self blindness
mpat 5 c inf
yell 指揮官，$N在囤墾區濫殺無辜啊！
if mobcount(1132) < 15
	mpecho 一位幹練的警探聽到$I的呼救後匆匆趕到！
	mpmload 1132
	mpforce shiriff mpkill $n
endif
"""

