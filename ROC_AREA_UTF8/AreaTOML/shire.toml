[mobiles.1120]
keywords = "blacksmith"
short_description = "鐵匠(blacksmith)"
long_description = "這個鐵匠(blacksmith)正極力召喚你進入他簡陋的店中購物。\n"
description = """
這個鐵匠看起來過去一定精通於戰鬥之術。他對於戰鬥的豐富經驗以及店中的各式武
器與裝甲足夠讓他應付類似像你們這種可能搶奪他財物的外來者。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 800
level = 27
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
race = "Hobbit"
class = ["WARRIOR"]
spec_flags = ["NO_CHARM"]
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "things"
script = """
say 我需要的金銀材料必須要是整條未被鍛融過的魔法加持原金銀，
say 還有作為外框的鋼條，以及作為守墓家族家徽的秘銀條，
say 這些材料我想應該是沒有出產了吧，但我曾聽過一位矮人商人向我說過，
say 矮人帝國曾經在很久以前賣了一些稀有的金屬條給當時的精靈首席魔法師作為研究材料，
say 後來這位魔法師在精靈帝國衰弱時隱居到南方迷霧森林的高塔中了，
say 那些數量不多的原料便一起帶進去塔中了，我想你可以到那裡找找看。
mpcall ornament_material $n
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "ornament_material"
script = """
mpechoat $n 你還欠缺的原料
if is_qmark($n) !& shire_ornament_quest 200001
	mpechoat $n \u001B[0;30m.\u001B[m		銀條(bar of silver)
endif
if is_qmark($n) !& shire_ornament_quest 200002
	mpechoat $n \u001B[0;30m.\u001B[m		金條(bar of gold)
endif
if is_qmark($n) !& shire_ornament_quest 200004
	mpechoat $n \u001B[0;30m.\u001B[m		秘銀條(bar of mithril)
endif
if is_qmark($n) !& shire_ornament_quest 200008
	mpechoat $n \u001B[0;30m.\u001B[m		鋼條(bar of adamantite)
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "1310"
script = """
mpjunk bar
if is_qmark($n) == skarabrae_joe_quest 100002
	if is_qmark($n) == shire_ornament_quest
		say 我收到銀條了。
		mpmod_qmark $n shire_ornament_quest v1 | 1
		if is_qmark($n) == shire_ornament_quest 200015
			mpcall ornament_complete $n
		else
			mpcall ornament_material $n
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "1311"
script = """
mpjunk bar
if is_qmark($n) == skarabrae_joe_quest 100002
	if is_qmark($n) == shire_ornament_quest
		say 我收到金條了。
		mpmod_qmark $n shire_ornament_quest v1 | 2
		if is_qmark($n) == shire_ornament_quest 200015
			mpcall ornament_complete $n
		else
			mpcall ornament_material $n
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "1312"
script = """
mpjunk bar
if is_qmark($n) == skarabrae_joe_quest 100002
	if is_qmark($n) == shire_ornament_quest
		say 我收到秘銀條了。
		mpmod_qmark $n shire_ornament_quest v1 | 4
		if is_qmark($n) == shire_ornament_quest 200015
			mpcall ornament_complete $n
		else
			mpcall ornament_material $n
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "1313"
script = """
mpjunk bar
if is_qmark($n) == skarabrae_joe_quest 100002
	if is_qmark($n) == shire_ornament_quest
		say 我收到鋼條了。
		mpmod_qmark $n shire_ornament_quest v1 | 8
		if is_qmark($n) == shire_ornament_quest 200015
			mpcall ornament_complete $n
		else
			mpcall ornament_material $n
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "ornament_complete"
script = """
nod
mpoload 1123 10
mpdel_qmark $n shire_ornament_quest
mpmod_qmark $n skarabrae_joe_quest v2 | 4
say 材料已經蒐集完畢了，我馬上把成品打造出來。
mpcallout 1 mpecho \u001B[1;37m$I 將鋼條投進鎔爐裡溶解......\u001B[0m
mpcallout 2 mpecho \u001B[1;37m$I 拿鐵鎚開始槌擊金條，將金條打成一個奇特的形狀。\u001B[0m
mpcallout 3 mpecho \u001B[1;37m$I 將銀條也投進鎔爐裡，跟先前的鋼條混和在一起。\u001B[0m
mpcallout 4 mpecho \u001B[1;37m$I 拿起秘銀條，用特殊的魔法工具槌打秘銀原礦。\u001B[0m
mpcallout 5 mpecho \u001B[1;37m秘銀條開始變形，被大力擊打成一個更古怪的形狀。\u001B[0m
mpcallout 6 mpecho \u001B[1;37m$I 將變形的秘銀條與金條接合在一起，組合成一隻條紋橫佈的金銀蜘蛛。\u001B[0m
mpcallout 7 mpecho \u001B[1;37m$I 將做好的蜘蛛鑲進熾熱的金鐵框架中，然後放進水裡......\u001B[0m
mpcallout 8 mpecho \u001B[1;37m玆..........\u001B[0m
mpcallout 9 say 做好了！
mpcallout 10 give ornament $n
mpcallout 11 say 請交給她吧。
"""
[[mobiles.1120.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) != shire_quest
	mpadd_qmark $n shire_quest -1 0 0 0 0 1
endif
if is_qmark($n) == skarabrae_joe_quest 100002
	if is_qmark($n) != shire_ornament_quest
		if is_qmark($n) == skarabrae_joe_quest 300004
			break
		endif
		mpadd_qmark $n shire_ornament_quest -1 1 0 0 0 1
		mpechoat $n 你將永恆之塔學徒的要求向$I詳細地說了一遍....
		mpechoaround $n $N將永恆之塔學徒的要求向$I詳細地說了一遍....
		hmm
		mpcallout 1 say 既然是守墓家族的要求，我當然會義不容辭幫到底。
		mpcallout 2 say 但是我手上還欠缺一些原料(things)，請你幫我蒐齊吧。
		break
	endif
endif
if level($n) >= 36
	if is_inv_obj($n) == 14046
	or is_equ_obj($n) == 14046
		if is_qmark($n) !& shire_quest 100001
			if is_qmark($n) != shire_blacksmith_mars
				say 咦？你身上的那件東西不就是賀比特城著名的「鬥神護符」嗎？
				if sex($n) <= 1
					say 唉呀，小兄弟，借我看看吧。
				else
					say 唉呀，小姑娘，借我看看吧。
				endif
				mpadd_qmark $n shire_blacksmith_mars -1 1 0 0 0 1
				break
			endif
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "14046"
script = """
if is_qmark($n) == shire_blacksmith_mars 100001
	mpmod_qmark $n shire_blacksmith_mars v0 = 2
	hmm
	mpcallout 1 say 這項裝備做得是不錯，但是結構太差，在劇烈的作戰下很容易損毀。
	mpcallout 2 say 太過強大的戰士還不宜穿著這件裝備旅行勒！
	mpcallout 3 hmm
	mpcallout 4 say 看著這件好東西被賀比特人的手藝糟蹋了，身為鐵匠的我真是心疼。
	mpcallout 5 say 怎麼樣，讓我幫你加強這件裝備吧(agree/disagree)？
else
	drop mars
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "disagree"
script = """
if is_qmark($n) == shire_blacksmith_mars 100002
	say 不要就算了，你等著在戰鬥時看著它被破壞吧！
	mpdel_qmark $n shire_blacksmith_mars
	drop mars
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "agree"
script = """
if is_qmark($n) == shire_blacksmith_mars 100002
	mpmod_qmark $n shire_blacksmith_mars v0 = 3
	mpjunk all.mars
	good $n
	mpcallout 1 say 很好！我欣賞你這種冒險者！
	mpcallout 2 say 不過醜話說在前頭，我只負責加強這件裝備，加強所需的原料請自備。
	mpcallout 3 mpcall material_1 $n
	mpcallout 4 say 拿到其中任何一樣東西都可以拿來給我。
	mpcallout 5 say 如果你忘了還有哪些東西要給，就直接問(talk)我吧。
	mpcallout 6 就這樣，祝你好運啦！
endif
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "material_1"
script = """
mpechoat $n 我需要的原料有：
if is_qmark($n) !& shire_blacksmith_mars 200001
	mpechoat $n \u001B[0;30m.\u001B[m		\u001B[1;32m森林巨鷹的羽毛(eagle feather)\u001B[0m
endif
if is_qmark($n) !& shire_blacksmith_mars 200002
	mpechoat $n \u001B[0;30m.\u001B[m		\u001B[1;30m地底之下石牛之皮(skin of gorgon)\u001B[0m
endif
if is_qmark($n) !& shire_blacksmith_mars 200004
	mpechoat $n \u001B[0;30m.\u001B[m		\u001B[1;35m萬色返空龍的喉鱗(scale of tiamat)\u001B[0m
endif
if is_qmark($n) !& shire_blacksmith_mars 200008
	mpechoat $n \u001B[0;30m.\u001B[m		\u001B[1;36m南極永不融化的雪水(eversnow)\u001B[0m
endif
mpechoat $n 如果對材料有任何疑問就直接問\u001B[1;37m(talk blacksmith <物品英文全名>)\u001B[0m吧。
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "p eagle feather"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	say 我必須要用老鷹羽毛其中蘊含的「勇猛」意象來調和其他原料，
	mpcallout 1 say 而現在大陸上能捕捉到老鷹的地方，只剩下傳說中綠洲蠻荒森林
	mpcallout 2 say 其他地方的老鷹都被補殺一空了。
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "p skin of gorgon"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	say 石牛的皮是鍛造承受「勇猛」元素最好的平台，不過石牛只生存於遠離地表的
	say 深土之內，要取得這種皮的確十分困難。
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "p scale of tiamat"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	say 萬色返空龍是一條五頭龍，又稱緹雅瑪特，能噴發出各種恐怖的龍息，而
	say 她的喉鱗蘊含著無限的狂躁氣息，是加強鬥神護符最好的素材。
	say 五頭龍的下落不明，老頭子我也不知道這件東西要怎麼拿到。
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "eversnow"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	say 永凍雪只存在於更南方的冰封大地，除了是滋養名貴花木最好的活水之外，
	say 也是最佳的冷卻水，這種冰雪聚集了寒氣的精華，很容易化成強大的魔法生物，
	say 甚至是次級的神靈，例如傳說中的白雪之后(Snow Queen)就是一例。
	mpcallout 1 say 將她打回原形後就能得到純淨的永凍雪了。
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == shire_blacksmith_mars 100004
	mpdel_qmark $n shire_blacksmith_mars
	if is_qmark($n) != shire_quest
		mpadd_qmark $n shire_quest -1 1 0 0 0 1
	else
		if is_qmark($n) !& shire_quest 100001
			mpmod_qmark $n shire_quest v0 | 1
		endif
	endif
	say 你已經完成「製作狂龍護符」的任務，我已將完成的標記轉換為新的格式。
	say 因此你無法重新開始「製作狂龍護符」的任務。
endif
if is_qmark($n) !& shire_quest 100001
	if is_qmark($n) < shire_blacksmith_mars 100004
		mpdel_qmark $n shire_blacksmith_mars
		mpechoat $n 遠方傳來一陣聲響「製作狂龍護符的任務已經可以重解了。」
		break
	endif
endif
if is_qmark($n) !& astral_quest 100004
	if is_qmark($n) == shire_scale_quest
		mpdel_qmark $n shire_scale_quest
		mpechoat $n 遠方傳來一陣聲響「製作戰龍脛甲的任務已經可以重解了。」
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "4203"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	if is_qmark($n) & shire_blacksmith_mars 200001
		say 你不是給過了嗎？
		give feather $n
	else
		mpjunk all.feather
		mpmod_qmark $n shire_blacksmith_mars v1 | 1
		mpcall shire_complete_1 $n
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "15087"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	if is_qmark($n) & shire_blacksmith_mars 200002
		say 你不是給過了嗎？
		give skin $n
	else
		mpjunk all.skin
		mpmod_qmark $n shire_blacksmith_mars v1 | 2
		mpcall shire_complete_1 $n
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "2293"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	if is_qmark($n) & shire_blacksmith_mars 200004
		say 你不是給過了嗎？
		give scale $n
	else
		mpjunk all.scale
		mpmod_qmark $n shire_blacksmith_mars v1 | 4
		mpcall shire_complete_1 $n
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "give_prog"
argument = "1808"
script = """
if is_qmark($n) == shire_blacksmith_mars 100003
	if is_qmark($n) & shire_blacksmith_mars 200008
		say 你不是給過了嗎？
		give eversnow $n
	else
		mpjunk all.eversnow
		mpmod_qmark $n shire_blacksmith_mars v1 | 8
		mpcall shire_complete_1 $n
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "shire_complete_1"
script = """
good $n
if is_qmark($n) == shire_blacksmith_mars 200015
	mpmod_qmark $n shire_blacksmith_mars v0 = 4
	say 終於蒐集完成了！
	if class($n) < 5
		mpexp $n 5400
	else
		mpexp $n 3600
	endif
	mpcallout 1 mpecho \u001B[1;37m$I 快速地將萬色返空鱗投進爐子裡。\u001B[0m
	mpcallout 2 mpecho \u001B[1;37m$I 將石牛皮放在鐵砧上，包住鬥神護符與老鷹的羽毛。\u001B[0m
	mpcallout 3 mpecho \u001B[1;37m$I 將燒紅的萬色返空鱗拿上來，放在鐵砧上敲打出一個形狀。\u001B[0m
	mpcallout 4 mpecho \u001B[1;37m$I 把石牛皮放進火爐裡，在皮開始融化時拿上來鑲進鱗片裡。\u001B[0m
	mpcallout 5 mpecho \u001B[1;37m$I 拿起鐵鎚一陣猛敲......\u001B[0m
	mpcallout 6 mpecho \u001B[1;33m叮叮噹噹......\u001B[0m
	mpcallout 7 mpecho \u001B[1;33m叮叮噹噹......\u001B[0m
	mpcallout 8 mpecho \u001B[1;33m叮叮噹噹......\u001B[0m
	mpcallout 9 mpecho \u001B[1;33m叮叮噹噹......\u001B[0m
	mpcallout 9 mpoload 1122 37
	mpcallout 10 mpecho \u001B[1;37m最後，這片龍鱗被 $I 打成了狂龍飛舞的形狀！\u001B[0m
	mpcallout 11 give dragon $n
	mpcallout 12 say 拿去吧，記得好好善用它。
	mpcallout 12 mpdel_qmark $n shire_blacksmith_mars
	mpcallout 12 mpmod_qmark $n shire_quest v0 | 1
else
	mpcall material_1 $n
	say 加油，繼續蒐集吧！
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "chicken melody"
script = """
if is_qmark($n) == shire_haton_chicken
	say 去問山恩指揮官吧！
	say 不要打擾我練製裝備！
	sigh
	say 何時才可以完成我的夢想啊！我心目中的裝備！
endif
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "shire_scale_eqmake"
script = """
if is_qmark($i) == shire_eqmake
	if being($b)
		if rembch($n)
			mpecho $I正在努力的鍊製裝備....
		else
			say 對不起，我現在在忙，請待會再來。
		endif
		break
	else
		mpdel_qmark self shire_eqmake
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
mpcall shire_scale_eqmake $n
if is_qmark($n) == shire_blacksmith_mars 100003
	mpcall material_1 $n
	break
endif
if is_qmark($n) & astral_quest 100004
	break
endif
if is_qmark($n) & astral_quest 100002
	if is_qmark($n) == shire_scale_quest
		if is_qmark($n) == shire_scale_quest 100001
			say 你已經找齊我所需要的物品了嗎？
		endif
	else
		if is_inv_obj($n) == 1928
		or is_equ_obj($n) == 1928
			say 你身上的不就是 龍族的鱗片(dragon scale) 嗎？
			say 我找這個東西很久了，因為我一直想要完成一項裝備(equipment)。
			mpadd_qmark $n shire_scale_quest -1 0 0 0 0 1
		endif
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "equipment"
script = """
mpcall shire_scale_eqmake $n
if is_qmark($n) == shire_scale_quest 100000
	if is_inv_obj($n) == 1928
	or is_equ_obj($n) == 1928
		say 我一直想要利用 龍族的鱗片(dragon scale) 來製作一項特殊的裝備，
		say 可以提供年輕冒險者相當大的力量，
		say 不知道您是否願意幫助我完成這個心願(yes/no)？
	endif
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "no"
script = """
mpcall shire_scale_eqmake $n
if is_qmark($n) == shire_scale_quest 100000
	say 是嗎？那就算了，我另尋高明了。
	wave $n
	mpdel_qmark $n shire_scale_quest
endif
"""
[[mobiles.1120.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
mpcall shire_scale_eqmake $n
if is_qmark($n) == shire_scale_quest 100000
	say 實在太感謝您了，
	say 除了龍族的鱗片，我還需要兩件龍族的東西，
	say 一件是史卡拉貝城下水道裡的 紅龍腳爪(red dragon greaves) ，
	say 一件是龍塔附近山上的 黑龍的頭顱(black dragon's head) ，
	say 如果又有這兩件物品，我就可以完成我的裝備。
	wave $n
	addoil $n
	mpmod_qmark $n shire_scale_quest v0 = 1
endif
"""
[[mobiles.1120.programs]]
trigger = "defun_prog"
argument = "shire_scale_quest"
script = """
if is_qmark($n) == shire_scale_quest 200007
	mpdef_rembch $n
	mpecho 你看到$I開始著手煉製裝備....
	mpadd_qmark self shire_eqmake 20 0 0 0 1 0
	mpcallout 5 mpecho $I 忽然皺起眉頭，似乎在製作上發生一些困難....
	mpcallout 10 mpecho $I 坐下來想了一想，又繼續站起來製作裝備....
	mpcallout 15 mpecho $I 擦了擦他的汗....
	mpcallout 16 say 總算裝備製作比較順利了....，
	mpcallout 20 mpecho $I 臉上漸漸露出微笑，似乎裝備已經快要完成....
	mpcallout 25 hop
	mpcallout 26 mpecho $I 拿起了製作好的裝備，看樣子已經完成了。
	mpcallout 27 say 我終於完成了我心目中的裝備了....！
	mpcallout 28 thank $b
	mpcallout 29 say 沒有你，我沒辦法完成我心目中這個心願....，
	mpcallout 30 say 因此我把這個裝備送給你，希望你好好的使用它。
	mpcallout 30 mpoload 1929 5
	mpcallout 31 give leggings $b
	mpcallout 31 mpdel_qmark self shire_eqmake
	mpcallout 31 mpdel_qmark $b shire_scale_quest
	mpcallout 31 mpmod_qmark $b astral_quest v0 | 4
	mpcallout 32 mpdef_rembch null-tar
endif
"""
[[mobiles.1120.programs]]
