if insameroom(cleo-mo)
	mpgroup self cleo-mo 1 0
endif
"""
[[mobiles.40011.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if hitprcnt($i) < 40
	mpat 40199 c 'double heal'
	mpnowait
endif
if isaffected($i) !& 128
	say 為了保護好這裡的安危，我應該多準備才是！
	c sanc
	mpnowait
endif
if is_qmark($n) == ocean_enemy
	yell 邪惡之人！看招！
	if is_equ_obj($i) != 40010
		wield bluewave
	endif
	if is_equ_obj($i) != 40011
		wield silenceblue
	endif
	mpkill $n
	skilldrv multihit $n
	break
endif
if is_qmark($i) == ocean_fight
	break
endif
if name($n) / cleo-mo
	say 克里歐，最近還好吧？
	mpforce cleo-mo say 還可以，村子最近平靜多了。
	break
endif
if is_qmark($n) == ocean_captain_quest 300003
or is_qmark($n) & mistocean_quest 100001
	bow $n
	say 歡迎光臨此地，我們的英雄 $n
	tell $n 你可以請我傳送(transfer)你到特殊地點。
endif
"""
[[mobiles.40011.programs]]
trigger = "talk_prog"
argument = "transfer"
script = """
if is_qmark($i) == ocean_fight
	say 抱歉，海域現在相當危險，恐怕沒辦法將你送上陸地。
	break
endif
if is_qmark($n) == ocean_enemy
	yell 邪惡之人，還想要我幫助你！看招！
	if is_equ_obj($i) != 40010
		wield bluewave
	endif
	if is_equ_obj($i) != 40011
		wield silenceblue
	endif
	mpkill $n
	skilldrv multihit $n
	break
endif
if is_qmark($i) == ocean_captain_transfer
	say 抱歉，我的能力尚未恢復過來。
	if is_qmark($i) >= ocean_captain_transfer 1012
		say 我大概還要半天以上才能恢復。
	else
		say 我再一下子就可以恢復了。
	endif
	break
endif
if is_qmark($n) == ocean_captain_quest 300003
or is_qmark($n) & mistocean_quest 100001
	nod $n
	say 我很樂意幫助你和你的隊友
	say 但請注意，我一天中只能實行一次這種特殊能力
	mpadd_qmark self ocean_captain_transfer 24 0 0 0 1 0
	mptransfer pc 4580
endif
"""
