argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
if insameroom(chrisana-mo)
	mpgroup chrisana self 1 0
endif
"""
[[mobiles.40010.programs]]
trigger = "greet_prog"
argument = "70"
script = """
if ispc($n)
	if is_qmark($n) == ocean_enemy
		yell 你這個破壞公理和秩序的兇手！
		if is_equ_obj($i) != 40007
			wear blueocean
		endif
		mpkill $n
		mete
		mpnowait
	endif
endif
"""
[[mobiles.40010.programs]]
trigger = "rand_prog"
argument = "25"
script = """
mpecho 克里歐抓了抓頭，很煩惱的樣子
say 我要怎樣把箭(arrow)交給河風(riverwind)呢？
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "arrow"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100007
or is_qmark($n) == ocean_cleo_help 100009
or is_qmark($n) & mistocean_quest 100002
or is_qmark($n) & mistocean_quest 100004
	break
endif
say 你願意幫忙嗎？(talk cleo yes/no)
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100007
or is_qmark($n) == ocean_cleo_help 100009
or is_qmark($n) & mistocean_quest 100002
or is_qmark($n) & mistocean_quest 100004
	break
endif
sigh $n
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100007
or is_qmark($n) == ocean_cleo_help 100009
or is_qmark($n) & mistocean_quest 100002
or is_qmark($n) & mistocean_quest 100004
	break
endif
hop
say 太好了！
mpcallout 1 say 我之前答應河風(riverwind)要送他一副全新的弓箭，
mpcallout 2 say 但一直抓不到時間上去一趟。
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100007
or is_qmark($n) == ocean_cleo_help 100009
or is_qmark($n) & mistocean_quest 100002
or is_qmark($n) & mistocean_quest 100004
	break
endif
if is_qmark($n) == ocean_wait_cleo
	say 你還不能重解！
endif
if is_qmark($n) >= ocean_cleo_help 100001
	if is_qmark($n) < ocean_cleo_help 100006
		if is_qmark($n) == ocean_wait_help
			say 你的時限還沒過呢！稍等一會兒吧。
		else
			mpmod_qmark $n ocean_cleo_help v0 = 1
			mpoload 40001 $n 1 target
			say 請再幫我送一次提貨單
		endif
	endif
endif
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "riverwind"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100007
or is_qmark($n) == ocean_cleo_help 100009
or is_qmark($n) & mistocean_quest 100002
or is_qmark($n) & mistocean_quest 100004
	break
endif
if is_qmark($n) != ocean_cleo_help
	say 他就住在迷霧之島的水晶湖區
	mpadd_qmark $n ocean_cleo_help -1 1 0 0 0 1
	mpcallout 1 say 請你先去工房領取弓箭，再回來找我吧。
	mpcallout 2 say 回來時跟我說一聲(talk cleo ok)就可以了。
	mpcallout 3 mpecho 克里歐從口袋中取出一張紙片拿給了你(paper)。
	mpcallout 4 mpoload 40001 $n 1 target
	mpcallout 5 say 這是我的提貨單，你拿給工房的老闆他就知道了
	mpcallout 6 bow $n
endif
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "ok"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100002
	bow $n
	say 感謝你的幫忙
	mpmod_qmark $n ocean_cleo_help v0 = 3
	mpcallout 1 say 如果方便的話，可以幫我送上去給河風嗎？
	mpcallout 2 mpechoat $n $I 看你似乎面有難色，補上一句
	mpcallout 3 say 放心，我可以用魚人族的神力送你上去
	mpcallout 4 mpechoat $n (do cleo a favor/I am busy)
endif
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "p do cleo a favor"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100003
	say 那就麻煩你了
	mpmod_qmark $n ocean_cleo_help v0 = 4
	bow $n
	mpadd_qmark $n ocean_wait_help 100 0 0 0 0 1
	mptransfer $n 4645
endif
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "p i am busy"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100003
	mpdel_qmark $n ocean_cleo_help
	if is_qmark($n) == mistocean_quest
		mpmod_qmark $n mistocean_quest v0 | 4
	else
		mpadd_qmark $n mistocean_quest -1 4 0 0 0 1
	endif
	sigh
	say 好吧，那我再另外找時間去吧。
	mpexp $n 3000
	wave $n
endif
"""
[[mobiles.40010.programs]]
trigger = "talk_prog"
argument = "finish"
script = """
if is_qmark($i) == ocean_fight
	say 現在海域面臨重大危機，私事有空再處理。
	break
endif
if is_qmark($n) == ocean_cleo_help 100006
	mpdel_qmark $n ocean_cleo_help
	if is_qmark($n) == mistocean_quest
		mpmod_qmark $n mistocean_quest v0 | 2
	else
		mpadd_qmark $n mistocean_quest -1 2 0 0 0 1
	endif
	bow $n
	say 我真不知道應該要怎樣表達我的謝意才好。
	mpexp $n 1500
	mpecho $I 從身邊取出了一顆閃閃發光的小石子
	say 這是只有魚人才找的到的寶物
	say 我把它送給你，充當謝禮。
	mpecho $I 把日月星之石給了 $n
	mpoload 40018 $n viclv target
endif
"""
[[mobiles.40010.programs]]
trigger = "fight_prog"
argument = "50"
script = """
yell    ---九  九  歸  真---
if is_equ_obj($i) != 40007
	wear blueocean
endif
mete
mpnowait
if hitprcnt($i) < 50
	mpat 40199 c 'double heal'
	mpnowait
	c 3 blindness
	mpnowait
	mete
	mpnowait
endif
"""
[[mobiles.40010.programs]]
trigger = "death_prog"
argument = "100"
script = """
yell 克莉珊娜！！
if is_qmark($n) != ocean_enemy
	mpadd_qmark $n ocean_enemy 50 0 0 0 1 0
else
	mpmod_qmark $n ocean_enemy timer + 50
endif
"""

[mobiles.40011]
keywords = "captain chrisana-mo"
short_description = "守備隊隊長克莉珊娜(captain chrisana)"
long_description = "全副武裝的守備隊隊長(captain)正在這裡巡邏\n"
description = """
不要看她年紀輕輕，克莉珊娜可是鎮上第一的用劍高手。
從她接掌這個位置以來，不知道有多少邪惡的生物和歹徒
死在她的劍下。你想當下一個嗎？
"""
act_flags = ["NPC", "STAY_AREA", "CRITICAL", "HARD_DIS", "HUNT", "TWO_WEAPON", "TACTICS", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "PROTECT", "GILLS"]
