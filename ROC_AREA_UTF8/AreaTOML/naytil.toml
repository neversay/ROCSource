[mobiles.10601]
keywords = "Ifor-naytil grand wizard"
short_description = "大巫師 - 艾佛(Ifor)"
long_description = "大巫師艾佛(Grand Wizard - Ifor)靜靜的看著你。\n"
description = """
你可以看到他的眼神中流動著強大力量的光彩。他穿著的服裝與攜帶的法杖上所附著的強
大魔法似乎可以撼動整個空間。這一生中他是你看過力量最為強大的法師。
"""
act_flags = ["NPC", "SENTINEL", "TRAIN", "PRACTICE", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT", "FLAMING"]
alignment = 900
level = 62
mod_hitplus = 3000
mod_mana = 1000
mod_hitroll = 30
mod_damroll = 0
mod_ac = 600
mod_svs = -50
dodge = 20
mod_pp = 0
gold = 100000
sex = "male"
race = "Angel"
class = ["WARRIOR", "MAGE"]
spec_flags = ["EXPERT"]
special_function = "spec_cast_mage"
practice_skills = "powerball 'star fire' 'remove alignment' armageddon 'turn undead' calm 'sun flash'\n'flaming armor' 'mana shield' meditate 'mystic mirror' 'wizard rage' 'mystic armor'\n'prot. from fire' 'prot. from wind' 'prot. from cold' 'prot. from earth'\n'mental empower' fireball 'prot. from lightning'"
[[mobiles.10601.weaknesses]]
skill = "star fire"
percent = 500
damage = 400
[[mobiles.10601.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.10601.programs]]
trigger = "talk_prog"
argument = "seed"
script = """
if is_qmark($n) == ocean_annie_seed 100006
mpmod_qmark $n ocean_annie_seed v0 = 7
soga
say 原來你是為了白楓種子而來的啊
mpcallout 1 say 真是可惜，種子我已經又拿給水晶湖的金月了
mpcallout 2 say 現在應該已經差不多長葉了吧
endif
"""
[[mobiles.10601.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if ispc($n)
	if rand(30)
		mpechoat $n 當你進入這間房間時，這個巫師銳利的眼神似乎穿透了你的心靈。
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "fight_prog"
argument = "50"
script = """
if isaffected($i) & 16777216
	mpdis_magic self 'seal magic'
endif
if isaffected($i) & 1
	c 'cure blindness'
	mpecho ... $I 治癒了自己的眼睛...！
endif
if isaffected($i) & 4096
	c 'cure poison'
	mpecho ... $I 去除了身上的毒素...！
endif
if isaffected($i) !& 128
	if hitprcnt($i) < 30
		c sanctuary
	endif
endif
if isaffected($i) & 268435456
	mpdis_magic self paralyze
	mpecho ... $I 讓自己的身體又能夠活動自如...！
endif
if isaffected($i) & 536870912
        if ran(30)
             c calm
        endif
endif
if area($i) == mist
	mpecho $I 放出一股前所未有的強大魔力！
	mpechoat $n 你被傳送走了！
	if ispc($n)
		mpechoaround $n $n被傳送走了！
	else
		mpechoaround $n $N被傳送走了！
	endif
	if rand(50)
		mptransfer $n 9042
	else
		mptransfer $n 9908
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == naytil_mary_visit
	break
endif
if is_qmark($n) == naytil_quest_wait
	if insameroom(nicholas-naytil)
		if is_qmark($n) == naytil_quest 100007
			mpforce nicholas say 大巫師正在加持魔法，請您稍候...。
		else
			mpforce nicholas say 大巫師正在加持魔法，請不要吵他...。
		endif
	endif
	break
else
	if is_qmark($n) == naytil_quest 100007
		say 好了，魔法加持已經完畢。
		say 這個水晶就送給你吧！
		mpoload 10664 35
		give crystal $n
		mpmod_qmark $n naytil_quest v0 = 8
		say 對了，冒險者...
		mpcallout 1 say 我感覺那個惡魔是南方高地(highland)的邪惡者所召喚來的。
		mpcallout 2 say 邪惡的來源是那四個高塔的某一座，我不大確定。
		mpcallout 3 mpcall legend_1 $n
		mpcallout 4 say 希望你能代替我們去察看那四座塔。
	else
		say 您好！
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "defun_prog"
argument = "legend_1"
script = """
say 那四座高塔的北方是一座巨大的城堡，高地人的大巫師博得
say 就住在那裡，我想這場陰謀有可能就是他幕後主使的。
say 但是那道邪惡的能源並不是從城堡中傳出來的，這讓我十分疑惑，
"""
[[mobiles.10601.programs]]
trigger = "defun_prog"
argument = "legend_2"
script = """
say 我大概知道博得在想什麼詭計了，冒險者呀，高地人的城堡只有從四座塔的其中
say 一個地窖密道才能進入，外面是無法通行的。在殲滅他們的先鋒部隊後，記得直接
say 殺進去給博得一個驚喜！
"""
[[mobiles.10601.programs]]
trigger = "fight_prog"
argument = "30"
script = """
if insameroom(nicholas)
	yell 請聖騎士助我一臂之力吧！
	mpgroup nicholas-naytil ifor-naytil 0 1
	mpforce nicholas-naytil protect ifor-naytil
	if rand(30)
		c 'double heal' nicholas
	endif
	if rand(30)
		c 'gdouble heal'
	endif
endif
c blindness $r
c poison $r
c curse $r
"""
[[mobiles.10601.programs]]
trigger = "rand_prog"
argument = "80"
script = """
if inroom($i) == 4580
	if is_qmark($i) != naytil_mary_visit
		say 我怎麼會在這裡？
		mpecho $I 開始施法...
		mpecho $I 化為一道閃光，消失在空氣之中。
		mpgoto 10601
		mpecho $I 忽然在一陣亮光中憑空出現！
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100000
		mpforce mary hello ifor-naytil
		say 妳好，瑪麗！
		mpforce mary say 好久不見，大巫師！
		say 什麼好久不見，短短一個月而已嘛！
		mpforce mary smile
		mpmod_qmark self naytil_mary_visit v0 = 1
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100001
		say 真希望甘道夫(gandalf)那老頭也能來呢！
		mpforce mary say 我也是，但甘道夫先生住的賽伐斯拖普離這裡實在太遠了。
		sigh
		mpmod_qmark self naytil_mary_visit v0 = 2
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100002
		say 對了，對於最近奈圖王國出現的邪氣，妳有什麼想法？
		mpforce mary say 我覺得這是一個魔族的巨大陰謀，背後的支持者一定是個危險人物...
		mpforce mary say 因為近來死亡之谷也不斷傳來一股可怕的邪氣...
		mpmod_qmark self naytil_mary_visit v0 = 3
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100003
		say 那，妳對最近馬可斯將軍發起的反叛軍有何看法？
		mpforce mary say 馬可斯是個可以信任的將軍，他會這麼做一定是有苦衷的。
		agree mary
		say 也許，這跟我的預言中最後一句有關係呢！
		mpmod_qmark self naytil_mary_visit v0 = 4
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100004
		say 對於蠢蠢欲動的高地，不知道該怎麼辦。
		mpforce mary say 真希望我們光明之鎮能像聖城史卡拉貝那般強大，那我們就能幫助奈圖王國了。
		shake
		say 強大...就是腐敗的開端啊！
		mpforce mary say 原來如此，我會好好記著您的話的。
		mpmod_qmark self naytil_mary_visit v0 = 5
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100005
		say 對了，我之前幫妳設下的魔法石狀況還不錯吧！
		mpforce mary say 託您的福，現在恐龍已經較少入侵光明之鎮了。
		giggle
		mpmod_qmark self naytil_mary_visit v0 = 6
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100006
		glare
		say 有關西邊諸城邦...妳有聽到任何消息嗎？
		mpforce mary shake
		sigh
		mpmod_qmark self naytil_mary_visit v0 = 7
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100007
		say 索爾(shore)的事...妳真的不打算繼續調查？
		mpforce mary say 難道大巫師您認為他是無辜的嗎？
		say 也不能這麼說...
		sigh
		mpmod_qmark self naytil_mary_visit v0 = 8
		break
	endif
	if is_qmark($i) == naytil_mary_visit 100008
		say 那好，我也該回去了！
		mpforce mary wave ifor-naytil
		mpecho $I 施起了法...
		mpecho $I 化為一道閃光，消失在空氣之中。
		mpgoto 10601
		mpecho $I 忽然在一陣亮光中憑空出現！
		mpdel_qmark self naytil_mary_visit
		break
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "rand_prog"
argument = "90"
script = """
if hitprcnt($i) < 20
	if rand(50)
		c 2 'double heal'
	endif
endif
if hitprcnt($i) < 50
	if rand(50)
		c 'double heal'
	endif
endif
if hitprcnt($i) < 70
	if rand(50)
		c heal
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "fight_prog"
argument = "50"
script = """
if inroom($i) == 4580
	say 在這個教堂...你也敢攻擊我？！
	cast 3 'wind sc'
	mpnowait
	break
endif
if hitprcnt($i) < 10
	mpecho $I 大喝一聲後，他的周圍出現了魔法能量保護...。
	mpat 5 c 'mana shield'
	mpnowait
	mpat 5 c 'stone skin'
	mpnowait
	mpat 5 c 'mystic mirror'
	mpnowait
	c powerball
endif
if hitprcnt($i) < 20
	if rand(30)
		mpecho $I 身上開始大量流血，但是對你的攻勢卻也更加猛烈...。
	endif
	mpat 5 c heal
	c powerball
endif
if hitprcnt($i) < 50
	if rand(30)
		mpecho $I 大喝一聲！空間中的魔法能量開始向他身上匯集...。
	endif
	mpat 5 c barrier
	mpnowait
	mpat 5 c protection
	mpnowait
	c powerball
endif
"""
[[mobiles.10601.programs]]
trigger = "fight_prog"
argument = "20"
script = """
if rand(20)
	say 嘗嘗我的能量球吧！
	cast 3 powerball
endif
if rand(20)
	if isevil($n)
		say 嘗嘗我的除魔術！
		cast 2 'dispel evil'
	endif
endif
cast fireball
"""
[[mobiles.10601.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if inroom($i) == 10601
	if day($) == 10
		if hour($) == 6
			say 啊，該去拜訪瑪麗(Mary)那小女孩了！
			say 我得準備準備...
			mpadd_qmark self naytil_mary_visit -1 0 0 0 0 1
			break
		endif
		if hour($) == 7
			say 好了，準備走了...
			mpecho $I 開始施法...
			mpat 4580 mpecho 一陣強大的魔法力量不斷冒出來...
			break
		endif
		if hour($) == 8
			mpecho $I 化為一道閃光，消失在空氣之中。
			mpgoto 4580
			mpecho $I 忽然在一陣亮光中憑空出現！
			break
		endif
	endif
endif
"""
[[mobiles.10601.programs]]
trigger = "talk_prog"
argument = "soil"
script = """
if is_qmark($n) != naytil_ifor_stone
        if is_qmark($n) == ocean_alc_stone 100003
                say 原來如此，你是為了異界之土而來的。
                mpadd_qmark $n naytil_ifor_stone -1 1 0 0 0 1
                say 所謂的異界之土，指的是星界中的流星，風化後所產生的土壤。
                say 如果你能將墜落的流星帶來給我，我就可以替你製造異界之土。
        endif
else
        say 我想我之前已經跟你說明過了。
endif
"""
[[mobiles.10601.programs]]
trigger = "give_prog"
argument = "1930"
script = """
if is_qmark($n) == naytil_ifor_stone 100001
	mpmod_qmark $n naytil_ifor_stone v0 = 2
	mpadd_qmark $n naytil_ifor_wait 48 0 0 0 0 0
	say 我不能確定要多久才能使其風化。
	say 請你過幾天再來跟我領取(take)
endif
"""
[[mobiles.10601.programs]]
trigger = "talk_prog"
argument = "take"
script = """
if is_qmark($n) == naytil_ifor_wait
	say 我還在處理中，請稍待
	break
endif
if is_qmark($n) == naytil_ifor_stone 100002
	mpmod_qmark $n naytil_ifor_stone v0 = 3
	mpoload 40040 $n target
	say 這就是異界之土，請小心保管。
endif
"""
[[mobiles.10601.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
yell 我的預言真的即將實現了嗎...？！
if is_qmark($n) != naytil_enemy
	mpadd_qmark $n naytil_enemy 50 0 0 0 1 1
else
	mpmod_qmark $n naytil_enemy timer + 50
endif
"""

