[mobiles.201]
keywords = "witch hag woman"
short_description = "巫婆(witch)"
long_description = "一個巫婆(witch)在她的住處冷冷地看著你的行動。\n"
description = """
她應該是你見過最老的巫婆吧。她手拿著一隻魔杖，另外一隻手拿著一本紅色
的魔法書。
"""
act_flags = ["NPC", "SENTINEL"]
affected_flags = []
alignment = 0
level = 17
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "female"
race = "Hobbit"
spec_flags = ["NO_CHARM"]
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "coconut"
script = """
if is_qmark($n) == homeport_coconet_quest 100001
	if is_qmark($n) != homeport_coconet_quest 200003
		ponder $n
		mpechoat $n $I 說 '椰子樹？那種東西對我的魔法研究又沒任何幫助，早就被
		mpechoat $n $I 說 '河口的茂密樹林所掩蓋了。
		mpechoat $n $I 說 '好了好了，快走別吵我，我要繼續研究了。
		if robjcount(216) == 0
			mpat 208 mpoload 216 1 floor
			mpat 208 mpforcer 208 modrvt timer = 120
		endif
	endif
endif
"""
[[mobiles.201.programs]]
trigger = "greet_prog"
argument = "30"
script = """
say 外來者，滾出我的房間....！
say 話說完忽然就丟了一個火球過來....！
c fireball $n
mpgoto self
say 趕快出去....！
"""
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) & ocean_quest 300001
	say 你還想要更多藥水嗎？一瓶 50000 枚金幣。
	hehe $n
	break
endif
say 我想做一種藥水(potion)，需要很多材料。
"""
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "potion"
script = """
if is_qmark($n) & ocean_quest 300001
	break
endif
say 就是傳說中的水中呼吸藥水....。
say 需要燕巢(net of swallow)、人頭(head)以及 15000 枚金幣。
say 你想要幫我收集這些物品嗎(yes/no)？
"""
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) & ocean_quest 300001
	break
endif
if is_qmark($n) != ocean_quest
	mpadd_qmark $n ocean_quest -1 0 0 0 0 1
	say 太棒了，請將剛剛我說的幾項物品趕緊拿給我。
endif
"""
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "p net of swallow"
script = """
say 據說附近碼頭的船長有。
"""
[[mobiles.201.programs]]
trigger = "talk_prog"
argument = "head"
script = """
say 這附近人不少吧！
grin
"""
[[mobiles.201.programs]]
trigger = "give_prog"
argument = "212"
script = """
if being($b)
	mpjunk all.head
	say 現在正在製作藥水，請稍等。
	break
endif
if is_qmark($n) & ocean_quest 100008
or is_qmark($n) & ocean_quest 100016
	mpjunk all.head
	break
endif
if is_qmark($n) != ocean_quest
	mpjunk all.head
else
	if is_qmark($n) & ocean_quest 100001
		mpjunk all.head
		say 你已經給過我這個東西了。
		break
	endif
	say OK，收到人頭！
	mpmod_qmark $n ocean_quest v0 | 1
	mpjunk all.head
	if is_qmark($n) !& ocean_quest 100002
		say 你還需要給我一份燕巢(net of swallow)。
	endif
	if is_qmark($n) !& ocean_quest 100004
		say 你還需要給我 15000 枚金幣。
	endif
	if is_qmark($n) == ocean_quest 100007
		mpecho $I 把材料與金幣丟進鍋子裡，開始製作藥水。
		mpmod_qmark $n ocean_quest v0 | 8
		mpdef_rembch $n
		mpadd_qmark self ocean_quest -1 0 0 0 0 1
	endif
endif
"""
[[mobiles.201.programs]]
trigger = "give_prog"
argument = "213"
script = """
if being($b)
	mpjunk all.swallow
	say 現在正在製作藥水，請稍等。
	break
endif
if is_qmark($n) & ocean_quest 100008
or is_qmark($n) & ocean_quest 100016
	mpjunk all.swallow
	break
endif
if is_qmark($n) != ocean_quest
	mpjunk all.swallow
else
	if is_qmark($n) & ocean_quest 100002
		mpjunk all.swallow
		say 你已經給過我這個東西了。
		break
	endif
	say OK，收到燕巢(net of swallow)！
	mpmod_qmark $n ocean_quest v0 | 2
	mpjunk all.swallow
	if is_qmark($n) !& ocean_quest 100001
		say 你還需要給我一顆人頭(head)。
	endif
	if is_qmark($n) !& ocean_quest 100004
		say 你還需要給我 15000 枚金幣。
	endif
	if is_qmark($n) == ocean_quest 100007
		mpecho $I 把材料與金幣丟進鍋子裡，開始製作藥水。
		mpmod_qmark $n ocean_quest v0 | 8
		mpdef_rembch $n
		mpadd_qmark self ocean_quest -1 0 0 0 0 1
	endif
endif
"""
[[mobiles.201.programs]]
trigger = "bribe_prog"
argument = "50000"
script = """
if is_qmark($n) & ocean_quest 300001
	mpoload 214 1 floor
	say 自己撿起來吧，我無法彎腰！
	yawn
endif
"""
[[mobiles.201.programs]]
trigger = "bribe_prog"
argument = "15000"
script = """
if being($b)
	mpgold $n 15000
	mpjunk all.coins
	say 現在正在製作藥水，請稍等。
	break
endif
if is_qmark($n) & ocean_quest 100008
or is_qmark($n) & ocean_quest 100016
	mpjunk all.coins
	break
endif
if is_qmark($n) != ocean_quest
	mpjunk all.coins
else
	if is_qmark($n) & ocean_quest 100004
		mpjunk all.coins
		say 你已經給過我 15000 枚金幣了。
		mpgold $n 15000
		break
	endif
	say OK，收到 15000 枚金幣！
	mpmod_qmark $n ocean_quest v0 | 4
	mpjunk all.coins
	if is_qmark($n) !& ocean_quest 100001
		say 你還需要給我一顆人頭(head)。
	endif
	if is_qmark($n) !& ocean_quest 100002
		say 你還需要給我一份燕巢(net of swallow)。
	endif
	if is_qmark($n) == ocean_quest 100007
		mpecho $I 把材料與金幣丟進鍋子裡，開始製作藥水。
		mpmod_qmark $n ocean_quest v0 | 8
		mpdef_rembch $n
		mpadd_qmark self ocean_quest -1 0 0 0 0 1
	endif
endif
"""
[[mobiles.201.programs]]
trigger = "rand_prog"
argument = "40"
script = """
if is_qmark($i) == ocean_quest 100000
	if insameroom($b)
		if rand(70)
			mpecho 鍋子忽然冒出一陣青煙！
			say 完成了！
			if is_qmark($b) !& ocean_quest 300001
				mpmod_qmark $b ocean_quest v2 | 1
				if class($n) < 5
					mpexp $n 1000
				endif
				mpexp $b 2000
			endif
			mpoload 214 1 floor
			say 自己撿起來吧，我無法彎腰！
			yawn
			mpdel_qmark self ocean_quest
			mpdef_rembch null-tar
		else
			mpecho 鍋子忽然冒出一陣黑煙！
			say 失敗了！常有的事，只好麻煩您再去找一次。
			shrug
			mpdel_qmark self ocean_quest
			mpmod_qmark $b ocean_quest v0 = 0
			mpdef_rembch null-tar
		endif
	endif
endif
"""

