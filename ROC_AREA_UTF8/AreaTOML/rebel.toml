argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
mpadd_qmark self delayed_stun -1 0 0 0 1 0
mpat 5 mpoload 64105 38
mpat 5 mpoload 64106 38
mpat 5 wear all
"""
[[mobiles.64101.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if ispc($n)
		if is_qmark($n) > rebel_questmark 100004
				mptransfer $n 64170
		endif
endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "trouble"
script = """
if is_qmark($n) == rebel_questmark
or isnpc($n)
else
		mpadd_qmark $n rebel_questmark -1 1 0 0 0 1
endif
if is_qmark($n) == rebel_questmark 100001
		tell $n 麻煩，是啊，我們是有麻煩，上頭那些狗娘養的官員們就是最大的麻煩呀。
		tell $n 算了算了，罵那些混球只是浪費時間而已，談正經的吧。
		tell $n 我們這支部隊在不久前跟叛軍打過一場，就在營地外頭的那條路上。
		tell $n 雖然暫時把他們打回老窩去了，但是我們也損失不少。
		tell $n 而就在我們等待援兵的時候，對方竟然派了個死靈師還是啥鬼的復活了我軍的死者！
		tell $n 在援兵到來之前，我們只能堅守在這個地方，還是說你能幫我們個忙？
		mpmod_qmark $n rebel_questmark v0 = 2
endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if is_qmark($n) == rebel_questmark 100002
		tell $n 簡單來說，我們得先解決那個玩屍體的變態傢伙。
		tell $n 從營地出去，你會看到一條大路，路上有很多被復活的不死士兵。
		tell $n 而我們的斥候回報說那個死靈師還是啥鬼的就躲在這些死人的後面。
		tell $n 所以我要你去幹掉他！否則這個營地早晚會再被叛軍奪回去。
		tell $n 你可以直接殺出一條血路，或是從東北方的小路繞到敵人的背後。
		tell $n 當然你走那條地下隧道也可以繞到敵人後方，這樣你瞭解了嗎？
		mpmod_qmark $n rebel_questmark v0 = 3
endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == rebel_questmark 100003
		tell $n 很好，我喜歡一點就通的聰明人，那就出發吧！
		tell $n 動作快點，拖越久狀況就對我軍越不利，幹掉那傢伙後來找我回報(report)。
		mpadd_qmark $n rebel_quest_time01 12 0 0 0 0 1
		mpmod_qmark $n rebel_questmark v0 = 4
		if mobcount(64103) == 0
				mpat 64109 mpmload 64103
		endif
		if is_qmark($n) == rebel_quest_check01
				mpdel_qmark $n rebel_quest_check01
		endif
endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($n) == rebel_questmark 100004
		if is_qmark($n) == rebel_quest_check01
				mpdel_qmark $n rebel_quest_check01
				tell $n 我軍斥候剛才已經回報給我知道，你幹得太好了。
				tell $n 那混球一死，不死軍隊也應該會瓦解，我們陣亡的弟兄終於能真正安息了。
				tell $n 這下子營地遭受的壓力也可以減輕不少，真讓人高興。
				tell $n 另外援軍不久之後就會到達，不過我得回去報告這次戰鬥的情況與結果。
				tell $n 讓我們祝彼此好運吧，下次見了。
				mpexp $n 50000
				mpskillexp $n 5000
				mpmod_qmark $n rebel_questmark v0 = 5
				if is_qmark($n) == rebel_quest_time01
						mpmod_qmark $n rebel_questmark v1 + 1
						mpdel_qmark $n rebel_quest_time01
				endif
				mptransfer $n 64170
		endif
endif
"""

