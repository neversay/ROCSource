				or sex($n) == 0
				or sex($n) == 1
						tell $n 另外，我已經預見了，你的未來會因為某人的惡意而遭遇某些阻礙，這個東西應該能助你一臂之力......
						mpoload 64181 $n 36 target
						mpechoat $n $I把一個玩偶娃娃交到你手裡。
				endif
				mpmod_qmark $n rebel_questmark v0 = 66
		else
				if rand(33)
						mpechoat $n 一盒奇怪的東西忽然出現在你手中！你下意識地打開一看......
						mpechoat $n 發現裡面似乎是食物，盒子外側還印了「ＯＸ可樂餅」的字樣。
						mpechoat $n 這一定有什麼地方搞錯了(fail)，你這麼覺得。
						mpmod_qmark $n rebel_questmark v0 = 64
				else
						if rand(50)
