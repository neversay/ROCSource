				tell $n 我感受到光與影的氣息交錯融合在槍身之中，也因此它發揮不出真正的力量。
				tell $n 如果你有興趣，我或許能助你一臂之力。
		endif
endif
"""
[[mobiles.64107.programs]]
trigger = "talk_prog"
argument = "lance"
script = """
if is_qmark($n) == rebel_secret_weapon
		tell $n 如果你想要它展現出光之力，我可以提供你由法師公會煉製的太陽石。
		tell $n 如果你想要影之力，傳送門的法師則能提供你月水晶。
		tell $n 一顆的價格是一百萬，另外因為很多因素，所以無法連續提供，每提供一個之後需要等待一些時間才能再提供。
endif
"""
[[mobiles.64107.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == rebel_questmark 100005
		tell $n 你好，之前那位上尉離開時，託我轉告你一些他忘記講的事情。
		tell $n 他說照目前的狀況，在援軍抵達之後應該會往敵營的方向推進才對。
		tell $n 依照這附近的地形來看，他認為軍方會在北邊那塊空地建立新的陣地。
		tell $n 他還說或許你可以提供一點協助才是。
		mpmod_qmark $n rebel_questmark v0 = 6
else
		tell $n 我是法師公會派來協助此次軍事行動的煉金師$I，請多指教。
endif
"""
[[mobiles.64107.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if is_qmark($n) == rebel_questmark 100006
		tell $n 為了建築新的陣地所以需要建材，而軍方似乎是想就地取材。
		tell $n 從這個營地往北走，你會看到一處應該已經在我軍控制下的空地。
		tell $n 從那塊空地往東和往西各有一處林地和採石場，你看起來身強體壯應該幫得上忙。
		tell $n 另外還需要一些繩索，這些東西軍方也打算從敵人身上搶來。
		tell $n 叛亂軍的斥候身上可能找得到這種東西，不過他們躲藏得很好，不容易找到。
		tell $n 所以，你打算去採石頭(stone)、伐木(wood)還是弄繩索(rope)回來？
		mpmod_qmark $n rebel_questmark v0 = 7
endif
"""
[[mobiles.64107.programs]]
trigger = "talk_prog"
argument = "stone"
script = """
if is_qmark($n) == rebel_questmark 100007
		tell $n 好，那麼你就去採石場跟那邊的礦工要石頭吧。
		tell $n 如果你不好意思向別人伸手，那麼自己挖(dig)也是可以的。
		tell $n 挖到的東西交給任何一位士兵就可以了，但不要交給這邊的傷兵。
		tell $n 大約交個三塊就行了，這應該不難，加油吧。
		mpmod_qmark $n rebel_questmark v0 = 8
endif
"""
[[mobiles.64107.programs]]
trigger = "talk_prog"
argument = "wood"
script = """
if is_qmark($n) == rebel_questmark 100007
