[rooms.64211]
name = "廣場"
description = """
這是一片被山壁環繞的廣場，四面都是難以攀爬上去的高聳岩壁，只有南邊
的岩壁被鑿出一個缺口，並且建設了高大的牆壁與門扉。這裡的建築物不多，你
只看到一棟兩層樓高的石造建築和一排木造的平房，跟外頭的牆壁與巨門相比，
