trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == rebel_questmark 100065
		if rand(33)
				mpechoat $n 一瓶奇怪的液體忽然出現在你手中！你嚇了一跳，連忙將瓶子遞給$I。
				mpechoat $n $I打開瓶子輕輕嗅了嗅，露出了欣慰的笑容。
				tell $n 感謝你對一個垂死之人的慈悲，這樣我就沒有遺憾了......
