to_room = 14159
[[rooms.14168.programs]]
trigger = "room_enter"
argument = "16 100"
script = """
if mobcount(14038) == 0
	break
endif
if is_qmark(lieutenant-h) == hobbit_robber_quest 100008
	force lieutenant-h say 奇怪！還真的有一個地窖！
	echo 守備副隊長(lieutenant)拿起一袋金幣看看說：「沒錯，這正是昨天被搶的....」
	echo 守備副隊長(lieutenant)不相信地搖著頭，以篤定的語氣說：
	force lieutenant-h say 巴菲特先生決不可能做這種事，
	force lieutenant-h say 他們一定是偷偷利用巴菲特先生的別墅來嫁禍！
	force lieutenant-h say 無論如何，我們還是先去找巴菲特先生吧。
	mod_qmark lieutenant-h hobbit_robber_quest v0 = 9
endif
"""

