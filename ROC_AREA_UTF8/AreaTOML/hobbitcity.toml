[mobiles.14000]
keywords = "traveller"
short_description = "旅者(traveller)"
long_description = "一位遠遊的旅者(traveller)低著頭趕路。\n"
description = """
他的衣衫沾滿灰塵，頭髮上還黏著一點草屑，昨晚大概累得隨便找個
地方倒頭就睡。
"""
act_flags = ["NPC", "SCAVENGER", "STAY_AREA", "WIMPY"]
affected_flags = []
alignment = -50
level = 26
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
[[mobiles.14000.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 你好，我從奧夫卡來，想到賽伐斯拖普批一些靴子(boots)去賣。
"""
[[mobiles.14000.programs]]
trigger = "talk_prog"
argument = "boots"
script = """
nod
say 賽伐斯拖普的靴子絕對是全大陸第一的，除了從怪物屍體上扒下
say 來的，能用金幣買到的最好的靴子就是在賽伐斯拖普了！
"""
[[mobiles.14000.programs]]
trigger = "greet_prog"
argument = "30"
script = """
mpechoat $n $I 抬頭望天說「希望能在天黑前趕到....」
"""

[mobiles.14001]
keywords = "tourist"
short_description = "觀光客(tourist)"
long_description = "衣著華麗的觀光客(tourist)對四周指指點點。\n"
description = """
和一般跑單幫的旅客不同，他是閒暇來觀光的，所以一點也沒有長途旅行的倦容。
"""
act_flags = ["NPC", "STAY_AREA", "WIMPY"]
affected_flags = []
alignment = 50
level = 25
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
[[mobiles.14001.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 這裡的風景不錯，你說呢？
smile
say 聽導遊說賽伐斯拖普的老闆一被殺，就會全城
say 通緝兇手，你來觀光要小心。
"""

[mobiles.14002]
keywords = "farmer"
short_description = "農夫(farmer)"
long_description = "赤腳的農夫(farmer)彎腰耕田，全身濕透。\n"
description = """
他露出一雙毛茸茸的大腳，一看就知道是賀比特。當他注意到你正在看他，
便露出樸素的笑容。
"""
act_flags = ["NPC", "SCAVENGER", "STAY_AREA", "WIMPY"]
affected_flags = []
alignment = 400
level = 25
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Hobbit"
[[mobiles.14002.programs]]
trigger = "greet_prog"
argument = "20"
script = """
mpechoat $n $I 揮動鋤頭，嘿咻嘿咻地耕田。
"""
[[mobiles.14002.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 您好，今年雨水不夠，多虧人工湖(lake)我們的麥子才沒枯死。
say 你還想問我什麼事？
"""
[[mobiles.14002.programs]]
trigger = "talk_prog"
argument = "lake"
script = """
say 就是南邊那個小湖啊？引頓河的河水而成的，
say 花了十年，是上一任市長(mayor)任內完成。
"""
[[mobiles.14002.programs]]
trigger = "talk_prog"
argument = "mayor"
script = """
say 我覺得上一任市長比較好，會注意到我們農夫的需要，
say 不像這任市長，只注意商人的買賣喲！
shake
say 也不想想賽伐斯拖普沒有我們都會餓死了....
"""

