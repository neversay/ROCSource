[[mobiles.6503.programs]]
trigger = "give_prog"
argument = "18013"
script = """
if is_qmark($n) == homeport_dwarf_quest 100002
	mpjunk commerce-token
	mpadd_qark self quest_talking 10 0 0 0 0 0
	mpechoat $n $I看了你給他的信物之後，笑了笑。
	tell $n 你來晚了一步，剛剛我已經接到消息，西克索已經收到我們運過去的貨品了。
	tell $n 不過還是辛苦你這趟旅程的幫忙。
	mpdel_qmark $n homeport_dwarf_quest
	if is_qmark($n) == homeport_quest
		mpmod_qmark $n homeport_quest v0 | 16
	else
		mpadd_qmark $n homeport_quest -1 16 0 0 0 1
	endif
	if is_qmark($n) == max_skill_exp
		mpmod_qmark $n max_skill_exp v0 + 1
	else
		mpadd_qmark $n max_skill_exp -1 1 0 0 0 1
	endif
	bow $n
endif
"""
[[mobiles.6503.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == homeport_dwarf_quest 100002
	if is_inv_obj($n) == 18013
		mppurge $n commerce-token
		mpadd_qmark self quest_talking 10 0 0 0 0 0
		mpcallout 1 mpechoat $n 你總算到達矮人王國的商會地。
		mpcallout 2 mpechoat $n 可是你手中的信物不知何時早已遺落。
		mpcallout 3 mpechoat $n 是要回去跟商人回報這件事情，還是跟這裡的店主說明請求相信呢(report)？
		mpcallout 3 mpdel_qmark self quest_talking
		mpcallout 3 mpmod_qmark $n homeport_dwarf_quest v0 = 3
	endif
endif
"""
[[mobiles.6503.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($i) == quest_talking
	break
endif
if is_qmark($n) == homeport_dwarf_quest 100003
	mpadd_qmark self quest_talking 5 0 0 0 0 0
	ponder $n
	mpcallout 1 tell $n 真不知道是否該相信你。
	mpcallout 2 tell $n 不過你是要拿礦石(mineral)還是拿裝甲(armor)回去呢？
	mpcallout 3 tell $n 我想那老闆應該有跟你說清楚吧。
	mpcallout 3 mpdel_qmark self quest_talking
	mpcallout 3 mpmod_qmark $n homeport_dwarf_quest v0 = 5
endif
"""
[[mobiles.6503.programs]]
trigger = "talk_prog"
argument = "armor"
script = """
if is_qmark($i) == quest_talking
	tell $n 我現在在忙，你等等在來吧。
	break
endif
if is_qmark($n) == homeport_dwarf_quest 100005
	mpmod_qmark $n homeport_dwarf_quest v0 = 6
	mpadd_qmark self quest_talking 5 0 0 0 0 0
	flop $n
	mpcallout 1 tell $n 西克索真的這樣跟你說嘛？
	mpcallout 2 mpechoat $n $I 喃喃自語說：可是這明明就該是機密....。
	mpcallout 3 mpechoat $n $I 陷入了思考。
	mpcallout 5 tell $n 好吧，既然西克索都這樣跟你說了，那你稍等一下。
	mpcallout 6 mpechoat $n $I 打開了商店的櫃子，謹慎的拿出了一件護甲。
	mpcallout 7 mpoload 18016 40
	mpcallout 8 give dwarven-homeport $n
	mpcallout 9 tell $n 請務必把這胸甲拿給西克索。
	mpcallout 10 bow $n
	mpcallout 10 mpmod_qmark $n homeport_dwarf_quest v2 = 1
endif
"""
[[mobiles.6503.programs]]
trigger = "talk_prog"
argument = "mineral"
script = """
if is_qmark($n) == homeport_dwarf_quest 100005
	if is_qmark($n) == quest_talking
		tell $n 我現在在忙，你等等再來吧。
		break
	endif
		mpmod_qmark $n homeport_dwarf_quest v0 = 6
		mpadd_qmark self quest_talking 5 0 0 0 0 0
		soga
		mpcallout 1 tell $n 原來是礦石，那就比較好辦了。
		mpcallout 2 tell $n 不過你沒有信物，這又很麻煩。
		mpcallout 3 ponder
		mpcallout 4 tell $n 這樣吧，給我五萬元我就把礦石給你帶回去。
		mpcallout 4 mpdel_qmark self quest_talking
		mpcallout 4 mpmod_qmark $n homeport_dwarf_quest v1 = 1
endif
"""
[[mobiles.6503.programs]]
trigger = "bribe_prog"
argument = "50000"
script = """
if is_qmark($n) == homeport_dwarf_quest 200001
	mpechoat $n $I點了點錢。
	mpcallout 1 mpoload 18014 $n viclv target
	mpcallout 1 mpechoat $n $I 把礦石給了你。
	mpcallout 1 mpmod_qmark $n homeport_dwarf_quest v1 = 2
endif
"""
