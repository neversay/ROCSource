[[mobiles.11027.programs]]
trigger = "talk_prog"
argument = "method"
script = """
if is_qmark($i) == bai_war
	tell $n 不要吵！我正在降妖！
	break
endif
if is_qmark($n) == ROC_white_snake 200006
	mpmod_qmark $n ROC_white_snake v1 = 7
	tell $n 雖然我沒辦法接近那裡，但用一些法術花費兩天的時間已經查出妖氣的來源了，
	tell $n 發現妖氣是從雲夢大陸上的清河鎮散出，正確說是在清河鎮中的妖怪所生成的，
	tell $n 並發現妖怪似乎化身為人類女性隱藏於市，且不只有一個。
	tell $n 但就算知道了，這些我也沒辦法接近那裡，所以我想到的方法是.....
	mpcallout 2 tell $n 出原形，再來我就有辦法把她引到海面上處理掉了。
	mpcallout 2 tell $n 困難，只需要把參有雄黃的酒水朝妖怪身上潑灑(spill)，她就會顯
	mpcallout 2 tell $n 希望你能協助我把妖怪從鎮上引到海面上，實際要你去作的事也不
	mpcallout 4 tell $n 如何呀，我的朋友。如果願意為廣大的蒼生作一點小事，就助我一臂之力吧！
endif
"""
[[mobiles.11027.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($i) == baiwar_over
	if is_qmark($n) == bai_fighting
		if is_qmark($n) == ROC_white_snake 300001
			mpmod_qmark $n ROC_white_snake v2 = 3
			mpdel_qmark $n bai_fighting
			tell $n 感謝你的協助，短時間內這妖孽應該不會再出現作亂了。
			tell $n 我手上沒有什麼好東西，只能將這把刀送給你作為謝禮。
			mpechoat $n $I給了你一把黑色的刀。
			mpoload 11079 $n 40 target
			mpcallout 1 wave $n
			mpcallout 1 tell $n 那麼祝你端午節快樂，我們後會有期。
		endif
	else
		tell $n 雖然我跟你不熟，但很慶幸你能從這災難中活著回來。
		mpdel_qmark $n bai_fighting
	endif
endif
"""
[[mobiles.11027.programs]]
trigger = "talk_prog"
argument = "reason"
script = """
if is_qmark($i) == bai_war
	tell $n 不要吵！我正在降妖！
	break
endif
if is_qmark($n) == ROC_white_snake 100006
	mpmod_qmark $n ROC_white_snake v2 = 2
	mpat suzhen-dbf mpadd_qmark suzhen-dbf fahai_war -1 0 0 0 0 1
	say 什麼？你居然在幫妖孽說話！
	say 既然你已被妖孽迷惑，那老納就親自去解決她！
	mpecho $I說完後往山下直奔而去。
	mpgoto 5
	mpcallout 3 mpat 234 mpmload 11028
	mpcallout 4 mppurge self
endif
"""
[[mobiles.11027.programs]]
trigger = "give_prog"
argument = "all"
script = """
if is_qmark($i) == bai_war
	drop $o
	break
endif
if is_qmark($i) == fahai_give
	tell $n 我現在沒空，你等下再來。
	drop $o
	break
endif
if is_qmark($n) == ROC_white_snake 200004
	if material($o) == fiber
		if rand(15)
			tell $n 這樣就足夠了。
			tell $n 請在一旁稍等，我要來製作一下法具。
			mpadd_qmark self fahai_give -1 0 0 0 0 1
			mppurge $o
			mpcallout 2 mpechoat $n $I快速地將手上的綢布裁剪成袋狀，然後拿出一些木片磨成粉末狀。
			mpcallout 3 mpechoat $n $I將木片粉末倒入綢布袋中，然後放入些不明物，隨之將袋口縫合。
			mpcallout 5 mpechoat $n $I給了你一個香囊。
			mpcallout 5 tell $n 好，完成了。
			mpcallout 5 mpoload 11047 $n viclv target
			mpcallout 6 tell $n 戴著這個就可以消除身上的妖氣了。
			mpcallout 6 mpmod_qmark $n ROC_white_snake v1 = 5
			mpcallout 6 mpadd_qmark $n dbf_fahai_timer 48 0 0 0 0 1
			mpcallout 7 mpdel_qmark self fahai_give
			mpcallout 7 tell $n 有事想請你幫忙一下。(thing)
			mpcallout 7 tell $n 另外你看起來滿利害的，過兩天後再來找我，
			mpcallout 8 wave $n
		else
			tell $n 還需要更多，再找一些來。
			mppurge $o
		endif
	else
		shake $n
		tell $n 這東西不是綢布(fiber)。
		drop $o
	endif
else
	? $n
	drop $o
endif
"""
[[mobiles.11027.programs]]
trigger = "fight_prog"
argument = "100"
