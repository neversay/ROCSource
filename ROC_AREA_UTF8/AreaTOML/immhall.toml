以此因應更多節慶裝備及quest房間，並且能有更多空間作額外裝備補償修正。
房間 10900 設定為 qmark check 的回傳 room，涉及需 qmark 回傳的 obj 或 mob 可以用此空間。

2022/12/02
將年獸及其相關的物品完全從 devileye.are 及 deepland.are 轉換至 immhall.are 的新增編碼下。

