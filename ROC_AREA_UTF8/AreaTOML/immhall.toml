	oforcer here at 11048 force old-santa mpat 4541 mpcall check_plant old-santa
endif
if inroom($n) == 10663
	oforcer here at 11048 force old-santa mpat 10663 mpcall check_plant old-santa
endif
if inroom($n) == 21036
	oforcer here at 11048 force old-santa mpat 21036 mpcall check_plant old-santa
endif
echoat $n 你把聖誕樹苗(Christmas Sapling)植入地面的土壤中，能回去報告了(report)。
oforcer here mod_qmark $n ROC_Claus v0 = 7
purge self
