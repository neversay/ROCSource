[rooms.10900]
name = "Qmark Room"
description = """
這裡是用作check quest 及 boss qmark回傳的房間。
2022/10/05 將 system_quest_check.prg 跟 system_adv_check.prg 的內容整合為 system_qmark_check.prg 這個副程式檔。
原本的 quest 及 adv 的副程式內容變更為單純的 room_command 指向 system_qmark_check.prg 觸發 room_defun。

system_qmark_check.prg 中 room_defun 的目標皆為 $b，因為 room 只有對 $b 時才有辦法作遠程 qmark 判定。
以此能實現 obj 來執行 room 副程式的內容，即可作出以 obj_command 直接 check qmark。
但 rcall 只能針對房間有人的情況下執行，所以這方法的 room 中必須存在有執行 rcall 的目標。
在這裡是使用單一 npc 作為 rcall 的目標物來執行 room_defun，輸出 echoat 及 qmark 判定 $b。

如果想在 room 中 check qmark 需在 Roomprogs 中導入 system_qmark_check.prg。
並且一定要在自行設定的 room_command 中讓該房間 def_rembch 目標再去作 rcall。
也可直接在 room 中另外加入 system_quest_check.prg 或 system_adv_check.prg，
其內容即為 def_rembch + room_command。

在 immhall 中，obj_command 的 check 寫在 obj 10900 上，可參考使用。
