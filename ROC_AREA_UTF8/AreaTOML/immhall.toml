		mpcallout 4 tell $n 而看到你被大量妖氣纏身後仍能行動自如後，我發現你對妖氣有著異常高的抵抗力，
		mpcallout 4 tell $n 但是妖氣過於龐大，我的身體光是靠近就無法承受了，更別提渡海一探究竟。
		mpcallout 4 tell $n 所以我來到此處的原因是為了查清楚這大量妖氣的生成原因並且鏟除根源。
	endif
endif
