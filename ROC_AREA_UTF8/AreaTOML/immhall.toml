keywords = "code"
description = """
顯示字元屬性控制
格式：ESC[控制碼m   （ESC='\\x1b'）
另外，以下的控制碼均已包含'['。

控  制  碼    │   [n1;n2;.......m
說        明  │ 1)設定顯示字元的屬性狀態
              │ 2)若有兩個以上的屬性狀態要設定則以分號將代碼
              │   即( n1; n2; .......)隔開
              │ 3)除非重新設定,否則原設定之屬性會一直被保留

代        碼 │  意                             義
     0      │ 所有屬性 OFF , 即返回正常顯示模式 (Normal)
     1      │ 高亮度顯示 (Bright)
     4      │ 加上底線 (Underline)
     5      │ 閃爍顯示 (Flach)
     7      │ 反白顯示 (Inverse)
     8      │ 不可見 (Invisable)

 < 底下之代碼僅適用於彩色顯示的系統 >
         30                40               黑色
         31                41               紅色
         32                42               綠色
         33                43               黃色
         34                44               藍色
         35                45               紫紅色
         36                46               青藍色
         37                47               白色

 < 30 - 37 為前景顏色, 40 - 47 為背景顏色 >

"""
