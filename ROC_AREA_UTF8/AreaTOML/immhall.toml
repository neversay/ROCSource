	oforcer here at 11048 force old-santa mpat 3014 mpcall check_plant old-santa
endif
if inroom($n) == 601
	oforcer here at 11048 force old-santa mpat 601 mpcall check_plant old-santa
endif
if inroom($n) == 13404
	oforcer here at 11048 force old-santa mpat 13404 mpcall check_plant old-santa
endif
