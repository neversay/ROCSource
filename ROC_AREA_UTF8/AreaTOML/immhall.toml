argument = "topic"
script = """
say 您好，我是技能小天使。
say 當您完成特定任務時，可以向我領取技能經驗點(skexp)。
say 如果您有加入冒險者公會(commerce)，在您首次擊敗特定目標時，
say 也可以向我領取技能經驗點(skexp)。
"""
