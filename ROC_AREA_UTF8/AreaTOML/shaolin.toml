trigger = "room_time"
argument = "100"
script = """
if roomvalue($0) == 0
        if robjcount(20102) == 0
                if robjcount(20103) > 0
                        purge 20103
                        oload 20102
                else
                        oload 20102
                endif
        else
                if robjcount(20103) > 0
                        purge 20103
                endif
        endif
endif
"""
