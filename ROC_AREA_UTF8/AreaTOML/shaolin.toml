trigger = "room_command"
argument = "pull candle"
script = """
if roomvalue($0) == 1
        echoat $n 這裡已經沒蠟燭了，你還想要拔什麼？
else
        echoat $n 你偷偷地將寺中的蠟燭藏在懷裡。
        echoaround $n $N鬼鬼祟祟地東張西望，不知道在幹什麼。
        purge 20102
        oload 20103
        oload 20104 viclv $n target
        modrvt v0 = 1
        modrvt t0 = 1
endif
"""
