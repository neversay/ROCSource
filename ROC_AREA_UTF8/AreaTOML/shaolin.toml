dodge = 0
mod_pp = 0
gold = 0
sex = "male"
race = "human"
spec_flags = ["NO_CHARM"]
[[mobiles.20101.programs]]
trigger = "tick_prog"
argument = "80"
script = """
mpecho $I嘀嘀咕咕的說著：那邊一定有什麼...那個地方(place)一定怪怪的。
	curse
"""
[[mobiles.20101.programs]]
trigger = "talk_prog"
argument = "place"
script = """
if is_qmark($n) != shaolin_quest
		mpadd_qmark $n shaolin_quest -1 0 0 0 0 1
		say 啊？你說那個地方是哪裡？
		ponder
		say 還不是那個放有花瓶的地方。那個地方老是有奇怪的聲音傳出來。
		say 雖然長老說沒什麼，我還是覺得怪怪的，改天一定要去搜一下。
	else
		say 我不是告訴過你了嗎？放花瓶的地方！
		say 就是客房外面那個小佛堂！
		anger $n
	endif
"""
[[mobiles.20101.programs]]
trigger = "talk_prog"
argument = "prison"
script = """
if is_qmark($n) == shaolin_quest 100001
		say 監獄？你在開玩笑吧？長老不會允許這種事的啦～不然你去問他～
		shr
	else
		say 啥監獄？
	endif
"""
[[mobiles.20101.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 施主有什麼事嗎？
"""

