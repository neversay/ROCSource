                mpexp $n 4500
        else
                mpexp $n 3000
        endif
        say \u001B[1;36m你可將他拿給工匠鍛造，或許可以改鍛造出好用的裝備\u001B[m
        if is_qmark($n) <= astral_gith 100001
                say 這東西其實對你還有用...
                give pentagram $n
                say \u001B[1;36m你可以用它開啟通往吉斯王住處的暗黑之門。\u001B[m
