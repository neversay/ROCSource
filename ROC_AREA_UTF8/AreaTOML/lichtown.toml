　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　by Ryzen
"""
[[objects.22073.extra_descriptions]]
keywords = "cross"
description = """
本區域「巫妖之塔」是由Ryzen為高等級的角色所設計的，建議的等級是36到42
級，任何等級低於這個範圍的玩家，個人強烈建議最好不要到這裡來，因為有不
少具有攻擊性的怪物存在。然而，由於此地是通往某些地方的唯一途徑，因此怪
物們「沒有」偵測隱形的能力，只要你全程保持隱形狀態，你應該能活著通過此
地，前往你想去的地方。
　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　by Ryzen
"""

