[mobiles.64101]
keywords = "Jwo ho sin young man"
short_description = "卓鶴山(Jwo ho sin)"
long_description = "一個年輕人(Young man)在這裡迎接山莊的客人。\n"
description = """
他頭戴青皮帽，身穿長袍馬掛，負責引導初入名劍山莊的各路
英雄好漢。他滿臉笑容的和你打恭作揖。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "HARD_DIS"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
alignment = 800
level = 50
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
class = ["WARRIOR", "SWORD"]
spec_flags = ["NO_CHARM", "ALY_DI", "ALY_DH"]
[[mobiles.64101.applies]]
type = "HIT"
degree = 20000
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "p hair dress"
script = """
if is_qmark($n) == swordcottage 200001
		say 這個...我也不太清楚
		say 你可以去問問別人。
	else
		say 什麼髮飾？
	endif
"""
[[mobiles.64101.programs]]
trigger = "tick_prog"
argument = "10"
script = """
if is_qmark($i) > swordcottage_enter 100001
		mpmod_qmark $i swordcottage_enter v0 - 1
	endif
"""
[[mobiles.64101.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 名劍山莊不歡迎你，請回吧
	else
		mpechoat $n $I恭敬的向你鞠躬
		tell $n 歡迎光臨名劍山莊，有什麼問題請儘管吩咐．
			if is_qmark($i) != swordcottage_enter
				mpadd_qmark $i swordcottage_enter -1 0 0 0 0 1
			endif
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 我無法回答你的問題，你請回吧
	else
		tell $n 請問有什麼問題？
		mpechoat $n －－－請問我能進去嗎(Enter)？
		mpechoat $n －－－請問莊主在哪裡(where)？
		mpechoat $n －－－關於名劍山莊的問題(About)
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "enter"
script = """
if is_qmark($n) != swordcottage_killer
			if is_qmark($i) > swordcottage_enter 100006
				tell $n 對不起，山莊內的客人已滿，我沒辦法讓您進去。
				sorry $n
			else
					if resp($n) > 30
						if sex($n) == 2
							tell $n 好的，名劍山莊非常歡迎像您這樣有名的俠女
							mpechoat $n $I打開門讓你進去。
							mpechoaround $n $I打開門讓$n進去。
							mptransfer $n 64151
							mpmod_qmark $i swordcottage_enter v0 + 1
						else
							tell $n 好的，名劍山莊非常歡迎像您這樣有名的俠客
							mpechoat $n $I打開門讓你進去。
							mpechoaround $n $I打開門讓$n進去。
							mptransfer $n 64151
							mpmod_qmark $i swordcottage_enter v0 + 1
						endif
					else
						mpechoat $n $I仔細的打量你...
						mpechoaround $n $I仔細的打量$n...
						tell $n 對不起，我恐怕沒辦法讓您進去。
						tell $n 名劍山莊只歡迎有名的俠客或是俠女，$n您請回吧。
					endif			
			endif
	else
		tell $n 名劍山莊不歡迎您，請回吧。
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "where"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 我無法回答您的問題，您請回吧。
	else
		tell $n 只要往前一直走，莊主就在大廳裡面．
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "about"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 我無法回答您的問題，您請回吧。
	else
		tell $n 想知道什麼嗎？
		mpechoat $n －－－名劍山莊的由來(From)？
		mpechoat $n －－－名劍山莊的莊主(Master)？
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "from"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 我無法回答您的問題，您請回吧。
	else
		mpechoat $n $I說著：名劍山莊原本只是一個普通的山莊，後來因為第
		mpechoat $n $I說著：三任莊主喜好劍術，於是便改名為名劍山莊，同
		mpechoat $n $I說著：時廣邀英雄劍俠到山莊內作客。現在的莊主則是
		mpechoat $n $I說著：第六任莊主，但是卻因為沒有兒子，而打算招贅
		mpechoat $n $I說著：一名年輕人來挑起大業。
		mpechoat $n $I說著：大致上就是這個樣子了。
	endif
"""
[[mobiles.64101.programs]]
trigger = "talk_prog"
argument = "master"
script = """
if is_qmark($n) == swordcottage_killer
	or is_qmark($n) == castsword
		tell $n 我無法回答您的問題，您請回吧。
	else
		mpechoat $n $I說著：現任莊主秦徹生先生是第六任莊主，現在就在大
		mpechoat $n $I說著：廳裡面，您可以去拜訪他。
	endif
"""
[[mobiles.64101.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 cast 'detect inv'
mpat 5 cast 'detect hidden'
mpat 5 cast inf
	if is_qmark($n) == swordcottage_killer
		yell 嗚啊！！$n在名劍山莊行兇阿！！
	else
		mpadd_all_qmark $n swordcottage_killer 200 0 0 0 1
	endif
"""
[[mobiles.64101.programs]]
trigger = "fight_prog"
argument = "100"
script = """
say 名劍山莊不歡迎鬧事的人！
	mpechoat $n $I一揮手，一陣強大的風把你推了出去！
	mpechoaround $n $n被$I推了出去！
	mptransfer $n 64121
	mpnowait
"""

[mobiles.64102]
