argument = "10"
script = """
if is_qmark($i) != swordcottage_hairdress
		say 怎麼會不見了呢...
		sigh
	endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == swordcottage_killer
	tell $n 你還不離開嗎？那我就送你一程吧！
	mpkill $n
else
	nod $n
	tell $n 久仰大名，歡迎來到名劍山莊
endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "disappear"
script = """
if is_qmark($n) == swordcottage_killer
		say 你這兇手！還敢問我事情！
		mpkill $n
	else
		if is_qmark($n) == castsword
			say 這件事情跟鑄劍谷的人沒有關係。
			mpechoat $n $I把頭別過去，似乎不想理你。
			mpechoaround $n $I把頭別過去，似乎不想理$n。
		else
			if is_qmark($i) != swordcottage_hairdress
				if is_qmark($n) == swordcottage
					tell $n 其實是我髮妻(wife)留下來的髮飾(hair dress)被我弄丟了。
					tell $n 雖然找了不少地方，可是就是找不到。
					sigh
					mpmod_qmark $n swordcottage v2 = 1
				else
					tell $n 其實是我髮妻(wife)留下來的髮飾(hair dress)被我弄丟了。
					tell $n 雖然找了不少地方，可是就是找不到。
					sigh
					mpadd_qmark $n swordcottage -1 0 0 1 0 1
				endif
			else
				您的什麼東西掉了嗎？
			endif
		endif
	endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "p hair dress"
script = """
if is_qmark($n) == swordcottage_killer
		say 你這兇手！還敢問我事情！
		mpkill $n
else
	if is_qmark($n) == swordcottage 300001
		if is_qmark($i) != swordcottage_hairdress
			tell $n 是一個暗紅色的髮飾，不知道掉在哪了
		else
			tell $n 我已經托人在莊內尋找，不勞您費心。
		endif
	endif
endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "p gin-ming"
script = """
if is_qmark($n) == swordcottage_killer
		say 你這兇手！還敢問我事情！
		mpkill $n
	else
	if is_qmark($n) == jd_liu 100001
		mpechoat $n 你將柳敬明託付的事情告訴$I
		gasp $n
		tell $n 您認識敬明？我也找他找了許久，但一直沒有消息。
		tell $n 但你說當年雲風與秋雨一起到山莊排解紛爭，我卻不記得有這回事
		tell $n 當年僅有秋雨上山來找我，他同時告訴我雲風有事不能到來，請他代為致歉
		tell $n 但...怎麼會有這種事？
		ponder
		tell $n 如果你所說的屬實，那麼務必先找出雲風失蹤的地方。
		tell $n 李總管確實告訴我，當時雲風沒有踏入山莊
		tell $n 或許他在上山莊的路上有事...或是失蹤了？
		tell $n 麻煩您跑一趟，在來山莊的路上找找。
		tell $n 我趁這段時間問一下李總管當時的詳細狀況。也問問秋雨。
		tell $n 麻煩您了
		bow $n
		mpmod_qmark $n jd_liu v0 = 2
		mpechoat $n 你覺得山下那座土堆實在太可疑了...要再去調查一次嗎？
	else
		tell $n 敬明阿！好久沒看到他了，不知道他近況如何...
	endif
	endif
"""
[[mobiles.64102.programs]]
trigger = "give_prog"
argument = "11144"
script = """
if is_qmark($n) == jd_liu 100003
		mpechoat $n $I顫抖著手讀完這封信
		tell $n 我知道了，我馬上讓秋雨過來一趟，請他好好說明
		tell $n 這封信麻煩您帶去給敬明，讓他知道這件事吧...唉。
		mpat 64137 mptransfer chen-swordcottage 64247
		give letter $n
	else
		?
		tell $n 你給我這個做什麼？
		drop letter
	endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "p where is chow-yu"
script = """
if is_qmark($n) == swordcottage_killer
		say 你這兇手！還敢問我事情！
		mpkill $n
else
	if is_qmark($n) == jd_liu 100004
		tell $n 說來慚愧，秋雨一聽到我要找他，馬上離開了山莊，也來不及攔住他
		tell $n 看來這件事是真的了，希望少俠能為敬名報這殺父之仇。
		bow $n
		tell $n 我猜秋雨應該會回到他認為最隱密的地方，也許是當初少俠發現雲風遺書的地方
		tell $n 請少俠跑這最後一趟，替武林去除這個敗類吧！
		tell $n 願劍神Kention保佑你。
		mpmod_qmark $n jd_liu v0 = 5
	else
		tell 你找秋雨嗎？他應該在客房裡阿。
	endif
endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "wife"
script = """
if is_qmark($n) == castsword
		say 這件事情跟鑄劍谷的人沒有關係。
		mpechoat $n $I把頭別過去，似乎不想理你。
		mpechoaround $n $I把頭別過去，似乎不想理$n。
	else
		if is_qmark($n) == swordcottage_killer
			say 你這兇手！還敢問我事情！
			mpkill $n
		else
			if is_qmark($n) == swordcottage 300001
				if is_qmark($i) == swordcottage_talking
					mpechoat $n $I現在正在跟別人說話。
				else
					if is_qmark($i) != swordcottage_hairdress
						if resp($n) > 65
							mpcallout 1 mpadd_qmark self swordcottage_talking
							mpcallout 1 mpechoat $n $I說著：既然您問起了，事情是這樣的...
							mpcallout 1 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 2 mpechoat $n $I說著：十幾年前，我受友人所託，出海前往另一個島
							mpcallout 3 mpechoat $n $I說著：到達該島之後，我發現當地居民與我族衣著，習慣皆不相同
							mpcallout 4 mpechoat $n $I說著：恰巧那位友人必須留在島上一段時間，希望留我作伴
							mpcallout 5 mpechoat $n $I說著：正好家中無事，我也不加推辭，就留在該島練劍
							mpcallout 5 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 6 mpechoat $n $I說著：在練劍的同時，我認識了一位當地的少女
							mpcallout 7 mpechoat $n $I說著：她經常送一些食物以及水過來給我，並且在旁邊看著我練劍
							mpcallout 8 mpechoat $n 你好像覺得這種劇情很耳熟...
							mpcallout 8 mpechoaround $n $n露出一點不可置信的表情
							mpcallout 9 mpechoat $n $I苦笑著說：是的，後來的事情您應該也猜到了
							mpcallout 10 mpechoat $n $I說著：我後來與那位少女相戀，並且結了婚
							mpcallout 11 mpechoat $n $I說著：但這也是一切不幸的開始...
							mpcallout 11 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 12 mpechoat $n $I說著：她有了身孕之後，我常常出外狩獵一些牲畜給她補身子
							mpcallout 13 mpechoat $n $I說著：同時也託不斷來回的船隻幫我捎一些藥品回來
							mpcallout 14 mpechoat $n $I說著：但是她仍然不幸過世，就在她生映月的那天晚上
							mpcallout 15 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 16 mpechoat $n $I說著：因為難產，流血過多，因而死亡...
							mpcallout 17 mpechoat $n $I說著：我當時悲憤難耐，便一劍劈開了島上的大石
							mpcallout 18 mpechoat $n $I說著：後來友人勸我回來家鄉，一方面是該繼承家業，另一方面也是看我整日愁靡...
							mpcallout 18 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 19 mpechoat $n $I說著：於是我在當地建立了一間石室，將我的配劍置入
							mpcallout 20 mpechoat $n $I說著：也算是為了紀念亡妻
							mpcallout 21 mpechoat $n $I說著：當時她留給我的，就只剩這個髮飾
							mpcallout 21 mpechoaround $n $I似乎在跟$n討論什麼...
							mpcallout 22 mpechoat $n $I仔細的打量你...
							mocallout 22 mpechoaround $I仔細的看了看$n...
							mpcallout 23 mpechoat $n $I說著：少俠聲名遠播，不知是否可以委託您幫我找回這個髮飾？(yes/no)
							mpcallout 23 mpdel_qmark self swordcottage_talking
						else
							tell $n 她在十數年前便已過世，只留下映月與我相依為命．
							glare
							tell $n 十年生死兩茫茫...
							sigh
							tell $n 不勞您多費心，我自己再找找便是。
						endif
					else
						tell $n 她在十數年前便已過世，只留下映月與我相依為命．
						glare
						tell $n 十年生死兩茫茫...
						sigh
					endif
				endif
			else
				tell $n 她在十數年前便已過世，只留下映月與我相依為命．
				glare
				tell $n 十年生死兩茫茫...
				sigh
			endif
		endif
	endif
"""
[[mobiles.64102.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($i) != swordcottage_hairdress
	tell $n 那就有勞您了
	bow
	tell $n 也許您可以問問李總管，他對莊內的情況比較熟悉。
	tell $n 願劍神Kention保佑你。
	mpmod_qmark $n swordcottage v2 = 2
	mpadd_qmark $i swordcottage_hairdress	200 0 0 0 0 -1
endif
"""
[[mobiles.64102.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 cast 'detect inv'
mpat 5 cast 'detect hidden'
mpat 5 cast inf
	if is_qmark($n) == swordcottage_killer
		mpmod_all_qmark $n swordcottage_killer timer = -1
		say 映月，你爹..沒辦法..再..照顧你..了..
		mpecho 碰的一聲，$I倒地不起。
		rumor 名劍山莊莊主$I被$n殺害了！名劍山莊下令永久通緝$n！
	else
		mpadd_all_qmark $n swordcottage_killer -1 0 0 0 0 1
		rumor 名劍山莊莊主$I被$n殺害了！名劍山莊下令永久通緝$n！
	endif
"""
[[mobiles.64102.programs]]
trigger = "give_prog"
argument = "64135"
script = """
if is_qmark($n) == swordcottage_killer
			say 你這兇手！還敢來見我！
			mpkill $n
			mpjunk hair
