他就是掌管整個名劍山莊的莊主-秦徹生(Chin cher sen)，
江湖上傳言他能在雨中舞劍而身上不沾半點雨滴。除了高超
的劍術，秦徹生也以素有正義感而聞名．但是早年喪妻的他
，似乎正為了唯一的女兒，秦映月的婚事而煩惱著．
"""
