你正站在陰暗的迷斯卓諾森林之中，那些曾經令人喜愛的精靈們，現在早已
變得邪惡而扭曲，這片大地的美景幾乎全消失了。周圍的樹木似乎帶著不祥的預
兆，彷彿正隱約威脅著你，而灌木叢裡則到處都是飛奔竄逃的小動物。這片森林
朝四面八方延伸出去，讓人很難看清楚周圍有什麼東西。
"""
