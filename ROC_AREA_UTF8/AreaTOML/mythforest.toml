[[mobiles.21200.applies]]
type = "HITROLL"
degree = 50
[[mobiles.21200.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isevil($n)
	say 邪惡之人！休想通過此地！
	mpkill $n
	hunt $n
endif
"""
[[mobiles.21200.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if rand(33)
	snare $n
	mpnowait
else
