name = "林間泥土小徑的終點"
description = """
你發現自己位於一條濃密森林之間的狹窄小路上，這條路看起來不常有人走
過，上頭的天空被許多樹葉給遮蔽住。在周圍的樹影間，你看到模糊的身影，同
時還聽到灌木叢中有生物活動發出的聲音。小徑到此中斷，往南可以原路返回，
東邊能看見一座湖泊，北邊則是一片原始樹林。
"""
