name = "迷斯卓諾森林湖岸"
description = """
這是座被森林包圍的內陸湖，樹木隨風磨擦的沙沙聲，像樹陰下有人在竊竊
私語，風停後又恢復死寂，讓人無法安心。在岸邊的泥地上不時能發現些巨大的
掌印，不知道是什麼生物留下的。混濁的綠色湖水飄散出些許腐敗的臭味，就算
氣溫炎熱，也不會有人想跳入湖泊裡消暑。
"""
