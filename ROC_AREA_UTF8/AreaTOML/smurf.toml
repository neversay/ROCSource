[mobiles.110]
keywords = "papa smurf"
short_description = "老爹(Papa Smurf)"
long_description = "老爹(Papa Smurf)正在練習魔法。\n"
description = """
他就是小精靈們的老爹嘍。他戴著紅色帽子，留著白色的鬍子。所有的藍色小精靈
都很尊敬老爹。
"""
act_flags = ["NPC", "STAY_AREA", "WIMPY"]
affected_flags = []
alignment = 100
level = 7
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 50
sex = "male"
race = "Elf"
special_function = "spec_cast_mage"
[[mobiles.110.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == smurf_save 100002
	say 您好，我們的英雄....。
	break
endif
if is_qmark($n) == smurf_save 100000
	if is_qmark($n) <= smurf_save 200005
		say 我們的英雄，我只能給你一點幫助....。
		mpechoat $n $I 在你身上施了幾道魔法....。
		c bless $n
		c arm $n
		c shi $n
		c fly $n
		c gi $n
		say 希望能夠對你有一些幫助。
		mpmod_qmark $n smurf_save v1 + 1
		break
	endif
	if is_qmark($n) >= smurf_save 200006
		say 我們的英雄，我已經用盡了我所有的法力。
		say 我已經沒有辦法再幫忙你了，希望你能夠擊敗賈不妙。
		sorry $n
	endif
	break
endif
if is_qmark($n) == smurf_save 100001
	say 謝謝您，我們的英雄....。
	say 為了感謝您，我們精靈村只有這項東西能送您，請您收下。
	mpoload 111 5
	give hat $n
	mpgold $n 5000
	if class($n) < 5
		mpexp $n 150
	endif
	mpexp $n 300
	mpmod_qmark $n smurf_save v0 + 1
	thank $n
	break
endif
say 嗨！你第一次來藍色小精靈村玩嗎？
"""

[mobiles.111]
keywords = "gargamel"
short_description = "賈不妙(Gargamel)"
long_description = "賈不妙(Gargamel)不停地咒罵著藍色小精靈。\n"
description = """
賈不妙這一輩子從來沒作好過任何事。他好幾次都捉到了小精靈們，不過又讓他們
逃走了。
"""
act_flags = ["NPC", "SENTINEL", "WIMPY"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
alignment = -100
level = 10
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 50
sex = "male"
special_function = "spec_cast_cleric"
[[mobiles.111.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == smurf_save 100002
		mpechoat $n $I 說著「好好....，我答應不再去煩小精靈們就是。」
		break
	endif
	if isnpc($n)
		break
	endif
	if is_qmark($n) != smurf_save
		say 擅闖賈不妙城堡者....死！
		if insameroom(azreal)
			say 大笨貓，攻擊....！
			mpforce azreal mpkill $n
		else
			if being(azreal)
				mptransfer azreal
				say 大笨貓，趕緊過來攻擊....！
				mpforce azreal mpkill $n
			endif
		endif
		c gi
		c bless
		mpkill $n
		break
	endif
	if is_qmark($n) == smurf_save 100000
		say 原來你就是小精靈們的英雄啊！
		say 自不量力的傢伙，為你的無禮納命來吧....！
		if insameroom(azreal)
			say 大笨貓，攻擊....！
			mpforce azreal mpkill $n
		else
			if being(azreal)
				mptransfer azreal
				say 大笨貓，趕緊過來攻擊....！
				mpforce azreal mpkill $n
			endif
		endif
		c fae $n
		mpkill $n
	endif
"""
[[mobiles.111.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
	if is_qmark($n) == smurf_save 100000
		mpat 5 c inf
		mpat 5 c 'detect invis'
		mpat 5 c 'detect hidden'
		mpmod_qmark $n smurf_save v0 + 1
		say 我會記住你的....。
	endif
"""

