[[mobiles.1769.programs]]
trigger = "talk_prog"
argument = "building"
script = """
if is_qmark($i) != talking
     if is_qmark($n) & southend_quest 100002
        if is_qmark($n) == southend_kent_tion 100001
        　　mpadd_qmark self talking 5 1 0 0 0 1
            mpechoat $n $I\u001B[1;33m告訴你「湖底有個建築物！？」\u001B[m
            mpechoat $n $I\u001B[1;33m告訴你「那應該是泫(Tion)女神的住所。」\u001B[m
            mpcallout 3 mpechoat $n $I\u001B[1;33m告訴你「他也是我們企鵝村第二任村長，而他的伴侶呢，就叫做泫(Tion)」\u001B[m
            mpcallout 3 mpechoat $n $I\u001B[1;33m告訴你「我記得，那個站出來征討極地熊的勇者名字叫做湯瑪士(Tomas)」\u001B[m
            mpcallout 3 mpechoat $n $I\u001B[1;33m告訴你「後來，有個雄壯威武的企鵝就和他的伴侶站出來向極地熊宣戰」\u001B[m
            mpcallout 3 mpechoat $n $I\u001B[1;33m告訴你「相傳在好久好久之前，南極之地是被極地之熊所統治的。」\u001B[m
            mpcallout 6 mpechoat $n $I\u001B[1;33m告訴你「了自己所有的力量，最後終於將湯瑪士族長給救了出來。」\u001B[m
            mpcallout 6 mpechoat $n $I\u001B[1;33m告訴你「變成一個大冰雕。就在湯瑪士族長的腳開始變成冰的時候，泫女神費盡」\u001B[m
            mpcallout 6 mpechoat $n $I\u001B[1;33m告訴你「也成了第一個犧牲，他受到了極地熊王的詛咒，從此之後他將永遠的」\u001B[m
            mpcallout 6 mpechoat $n $I\u001B[1;33m告訴你「一陣強大的詛咒從此籠罩在這南極之地，而站在最前方的湯瑪士族長」\u001B[m
            mpcallout 6 mpechoat $n $I\u001B[1;33m告訴你「傳說之中，當他們擊敗極地之熊王的時候，伴隨著極地熊王的怒吼下」\u001B[m
            mpcallout 9 mpechoat $n $I\u001B[1;33m告訴你「族長會縮水成小嬰孩企鵝，不過他依然擁有些許的記憶。」\u001B[m
            mpcallout 9 mpechoat $n $I\u001B[1;33m告訴你「光芒之下，全身冰凍的族長會慢慢的溶解。當全身冰塊融解完之後的時候，」\u001B[m
            mpcallout 9 mpechoat $n $I\u001B[1;33m告訴你「族長都會由腳部開始變成冰塊，這時候天上總會降下一道光芒，然後在這道」\u001B[m
            mpcallout 9 mpechoat $n $I\u001B[1;33m告訴你「不過也不算是詛咒，因為從此之後他就擁有不死之身。每當族長壽命到終點的時候」\u001B[m
            mpcallout 9 mpechoat $n $I\u001B[1;33m告訴你「不過極地熊王的詛咒實在太強大了。從此之後，湯瑪士族長就永遠背負著詛咒而活，」\u001B[m
            mpcallout 12 mpechoat $n $I\u001B[1;33m告訴你「企鵝村才能擁有現今的繁華。」\u001B[m
            mpcallout 12 mpechoat $n $I\u001B[1;33m告訴你「效力互相影響的結果。也好在重生之後的族長能力不太會受到影響，也因此」\u001B[m
            mpcallout 12 mpechoat $n $I\u001B[1;33m告訴你「族長之所以會擁有這個能力，我們都猜想是極地熊王的詛咒和泫女神的祝福」\u001B[m
            mpcallout 12 mpechoat $n $I\u001B[1;33m告訴你「一個名字，接著族長就會回到族長的地位，重新帶領我們企鵝族。」\u001B[m
            mpcallout 12 mpechoat $n $I\u001B[1;33m告訴你「當時機成熟的時候，每任的族長會自行到泫女神殿去，這時候泫女神會給族長」\u001B[m
            mpcallout 15 mpechoat $n $I\u001B[1;33m告訴你「畢竟，平常沒甚麼人會去那邊，那裡的風雪總是特別的強，原來是沉到湖底了啊！」\u001B[m
            mpcallout 15 mpechoat $n $I\u001B[1;33m告訴你「一作神殿來祭拜泫女神。不過不知道從甚麼時候開始，泫女神神殿就消失了。」\u001B[m
            mpcallout 15 mpechoat $n $I\u001B[1;33m告訴你「為了紀念泫女神，在第三任族長的策畫下，企鵝的族員們在極光之湖的中間蓋了」\u001B[m
            mpcallout 18 mpdel_qmark self talking
            mpcallout 18 mpmod_qmark $n southend_kent_tion v0 + 1
            mpcallout 18 mpechoat $n $I\u001B[1;33m告訴你「畢竟他十幾年前就去過了。」\u001B[m
            mpcallout 18 mpechoat $n $I\u001B[1;33m告訴你「不過既然沉到水底的話，那入口在哪就不得而知了，不過肯特族長應該會知道」\u001B[m
        else
            mpechoat $n $I\u001B[1;33m告訴你「你去問村長會比較詳細。」\u001B[m
        endif
     else
