[rooms.1796]
name = "冰像中"
description = """
你被極地熊王的絕對冷凍氣給冰封在這
邊，你只能祈禱你的隊友能快點的，溫柔的
救你出去。不然，你只有去面對死神吧。
"""
flags = ["INDOORS", "UNDERGROUND", "SAFE", "NO_RECALL", "CONE_OF_SILENCE", "SUMMON_BIT", "SAVE", "NO_TELEPORT_OUT", "NO_TELEPORT_IN"]
sector = "INSIDE"
[[rooms.1796.programs]]
trigger = "room_enter"
argument = "100 127"
script = """
force $n look
"""
[[rooms.1796.programs]]
trigger = "room_time"
argument = "100"
script = """
if pcnum($) > 0
	if mobcount(1784) == 0
		echo 你死了！
		transfer pc 3054
	else
		if roomvalue($0) == 3
			modrvt v0 = 0
			echo 你死了！
			transfer pc 3054
		endif
		if roomvalue($0) == 2
			modrvt v0 = 3
			echo 你體溫降到最低點！在不快點離開這鬼地方就要凍死了！
			modhmv pc 03.95 95 0
		endif
		if roomvalue($0) == 1
			modrvt v0 = 2
			echo 你體溫急劇下降，在沒人來救你出去就會很危險。
			modhmv pc 03.50 50 0
		endif
		if roomvalue($0) == 0
			modrvt v0 = 1
			echo 周圍的低溫讓你感覺有點冷....
			modhmv pc 03.10 10 0
		endif
	endif
else
	if roomvalue($0) > 0
		modrvt v0 = 0
	endif
endif
"""
[[rooms.1796.programs]]
trigger = "room_rand"
argument = "100"
script = """
if pcnum($) > 0
	if mobcount(1784) == 0
		echo 你死了！
		transfer pc 3054
	endif
endif
if pcnum($) == 0
	if roomvalue($0) != 0
		modrvt v0 = 0
	endif
endif
"""

