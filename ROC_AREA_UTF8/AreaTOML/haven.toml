[rooms.1896]
name = "冰雪尖碑下"
description = """
自從極地熊王完全復活後，這邊就多了一個尖碑，
也不知道這是從哪邊冒出來的。這個尖碑似乎有著奇妙
的魔力，這東西讓極地熊都無法靠近這裡。
"""
flags = ["NO_RECALL", "NO_TELEPORT_IN"]
sector = "FIELD"
[[rooms.1896.programs]]
trigger = "room_command"
argument = "display Sn-De-Ca-Sn"
script = """
if is_qmark($n) == southend_display
     echoat $n 你太累了，需要休息一下
     break
 endif
 if class($n) == 5
 or class($n) == 6
 or class($n) == 15
     if mpnum($n) < 500
        echoat $n 你的靈力不足以建立起結界
     else
        add_qmark $n southend_display 1 0 0 0 0 1
        echoat $n 你快速的結起結界手印
        echoaround $n $N快速的結起結界手印
        callout 1 force $n yell 結～～界～～封～～印～～
        callout 2 echo 四周升起了七彩極光結界，看起來就好像是把自己包在泡泡裡面了
        callout 2 modrvt t0 + 5
        callout 2 modhmv $n 11.500 500 0
     endif
 else
     echoat $n 你一時不查，魔力銷散在四周
     modhmv $n 31.50 100 0
 endif
"""
[[rooms.1896.programs]]
trigger = "room_command"
argument = "pray stele"
script = """
if roomvalue($1) == 2
     break
 endif
 if class($n) == 7
 or class($n) == 8
     if isgood($n)
        if mpnum($n) < 1000
            echoat $n 你的靈力不足以祈禱
        else
            echoat $n 你誠心的祈求著上天的幫忙
            echoaround $n $N誠心的祈求著上天的幫忙
            modrvt v0 + 1
            modrvt v1 = 1
            modhmv $n 11.1000 1000 0
            force $n meditate
        endif
     else
        echoat $n 上天拒絕你的請求，只因為你不是神聖的神職人員
     endif
 else
     echoat $n 上天拒絕你的請求，只因為你不是高貴的神職人員
 endif
"""
[[rooms.1896.programs]]
trigger = "room_time"
argument = "100"
script = """
if mobcount(1790) > 0
     if roomvalue($0) >= 10
        at bear-king-total echo \u001B[1;37m聚集足夠的力量之後，泫女神一擊切斷了極地熊王的冷冽氣息\u001B[m
        at bear-king-total echo \u001B[1;37m失去不死之力的熊王同時也失去了理智，更加的瘋狂了\u001B[m
        at bear-king-total mload 1801
        at bear-king-total force bear-king-total mppurge self
        echo \u001B[1;37m聚集足夠的力量之後，泫女神一擊切斷了極地熊王的冷冽氣息\u001B[m
        echo \u001B[1;37m失去不死之力的熊王同時也失去了理智，更加的瘋狂了\u001B[m
        modrvt v1 = 2
        break
     endif
     if roomvalue($1) == 1
        if roomtimer($0) == 1
            echo 極光結界開始淡化即將消失了
        endif
        if roomtimer($0) == 0
            if npcnum($) > 15
                break
            endif
            echo .
            echo \u001B[1;37m在沒有極光結界的保護下\u001B[m
            echo .
            echo \u001B[1;37m極地熊派遣的特攻隊衝進來\u001B[m
            echo .
            mload 1791
            mload 1791
            mload 1791
            mload 1791
            mload 1791
        else
            echo 極地熊派遣特攻隊來攻擊
            echo 可是卻被極光結界擋在外面無法進入
        endif
     endif
 endif
"""

