        callout 1 echoaround $n 迫使$N停止他的動作
        callout 1 echoat $n 迫使你停止你的動作
        callout 1 echo 一陣冷風從骨骸裡吹出
     endif
 endif
"""
[[rooms.1891.programs]]
trigger = "room_time"
argument = "10"
script = """
if roomvalue($0) == 1
     modrvt v1 + 1
     if roomvalue($1) > 10
        modrvt v1 = 0
        modrvt v0 = 0
        purge all
        mload 1793
     endif
 endif
"""
