 callout 1 echoat $n 這副白骨看起來蠻脆弱的
 callout 2 echoat $n 似乎一敲就會碎掉了
 callout 3 echoat $n 不過胸前裡的紅色骨頭明顯的比其他的骨頭硬
 callout 4 echoat $n 而且紅色骨頭也被其他的骨頭保護的好好的
 callout 5 echoat $n 看起來要先想辦法粉碎保護紅色骨頭的骨頭
 callout 6 modrvt v0 = 1
"""
[[rooms.1891.programs]]
trigger = "room_command"
argument = "crush bear king corpse bone"
script = """
if roomvalue($0) == 0
     break
 endif
 modrvt v0 = 0
 echoat $n 你試著粉碎 熊王的骨骸(bear-king bone)
 echoaround $n $N試著粉碎 熊王的骨骸(bear-king bone)
 if str($n) >= 23
     if rand(70)
        callout 1 echoat $n 你成功的將 熊王的骨骸(bear-king bone)給瓦解了
        callout 1 echoaround $n $N成功的將 熊王的骨骸(bear-king bone)給瓦解了
        callout 1 oload 1814 1
        callout 1 oload 1815 1
        callout 1 purge all
     else
        callout 1 modrvt 1892 v0 = 1
        callout 1 echoaround $n 迫使$N停止他的動作
        callout 1 echoat $n 迫使你停止你的動作
        callout 1 echo 一陣冷風從骨骸裡吹出
     endif
 else
     if rand(20)
        callout 1 echoat $n 你成功的將 熊王的骨骸(bear-king bone)給瓦解了
        callout 1 echoaround $n $N成功的將 熊王的骨骸(bear-king bone)給瓦解了
        callout 1 oload 1814 1
        callout 1 oload 1815 1
        callout 1 purge all
