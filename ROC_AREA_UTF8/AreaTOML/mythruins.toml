[[rooms.21442.extra_descriptions]]
keywords = "bridge"
description = """
一個駕駛台，上面只剩下一個小棚子能擋擋雨水，你可以確認看看上面有啥(check)。
"""
[[rooms.21442.extra_descriptions]]
keywords = "engineroom"
description = """
一個被稱為引擎室的鐵盒子，你可以看看裡面還留有什麼(check)。
"""
[[rooms.21442.programs]]
trigger = "room_time"
argument = "100"
script = """
if roomvalue($0) & 512
or roomvalue($0) & 1024
or roomvalue($n21261v1) == 1
	break
endif
if roomvalue($0) >= 31
	if pcnum($) == 0
		at 21447 echo 一艘船被海水打進了港口中....
		modrvt v0 = 15
		modrvt v1 = 0
		modrvt t0 = 0
		modrvt t1 = 0
		at 21474 modrvt t0 = 0
	endif
endif
"""
[[rooms.21442.programs]]
trigger = "room_rand"
argument = "100"
script = """
if roomvalue($0) == 1023
	modrvt v0 | 1024
	at 21474 modrvt t0 = 0
	callout 3 echo 船失去動力後被血紅的潮水推動著....
	callout 5 echo 船正快速的被血紅的潮水推動著....在不遠處看見一座小島...
	callout 7 echo 船正非常快速的被血紅的潮水推動著....並且離小島越來越近....
	callout 9 echo 轉眼間，船已經被推到快撞上小島了！
	callout 11 at 21447 modrvt t1 = 10
	callout 11 modrvt v0 = 1039
	callout 11 transfer all 21474
	callout 11 echo 碰！！ 船撞上了小島，你被甩到岸上。
endif
if roomtimer(1) == 0
	break
endif
if rmobcount(21327) == 0
	echo 擊退來犯的魚人後，又再次取回船的掌控權了。
	modrvt t1 = 0
	rcall check_island
endif
"""
[[rooms.21442.programs]]
trigger = "room_enter"
argument = "64 100"
script = """
if roomvalue($0) == 1039
	echoat $n 船沉在海中，你被血紅的海水帶往其他地方。
	transfer $n 21464
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "disembark default"
script = """
echoat $n 你想要下什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "disembark ship"
script = """
if roomvalue($0) !& 16
	echoat $n 你離開了精靈船。
	echoaround $n $N下船離開。
	transfer $n 21447
	at $n echoaround $N 從船上走下來。
	at $n force $n look
else
	if roomvalue($n21261v1) == 1
		echoat $n 你離開了精靈船，登入小島。
		echoaround $n $N下船登入小島。
		transfer $n 21261
		at $n echoaround $n $N下船登入了小島。
		at $n force $n look
		break
	endif
	echoat $n 船還在海上飄，想跳海自殺嗎？
	echoaround $n $N手扶船緣看起來有些想不開，有空開導他一下吧....
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "check default"
script = """
echoat $n 你要查看什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "check p bridge"
script = """
echoat $n 這是船隻的駕駛台，上面有著許許多多的東西，其中引起你興趣的是：
if roomvalue($0) & 3
	echoat $n 船舵穩穩地安裝在駕駛台上，上面還裝著一個羅盤。
	break
endif
if roomvalue($0) & 1
	echoat $n 船舵穩穩地安裝在駕駛台上，但上面有個孔不知道是幹啥的。
else
	echoat $n 駕駛台上居然沒有船舵(rudderhelm)！
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "check p engineroom"
script = """
echoat $n 這是放置引擎的地方，但說白點外觀就只是像個大一點的金屬盒，你看進去裡面發現：
if roomvalue($0) & 16
	echoat $n 放著一顆發著微光的引擎，正在運轉中。
	break
endif
if roomvalue($0) & 12
	echoat $n 放著一顆發著微光的引擎，裡面加入了柴油，但沒有在運轉。
	break
endif
if roomvalue($0) & 4
	echoat $n 放著一顆發著微光的引擎，裡面還沒有放入燃料。
else
	echoat $n 放著一顆滿是破洞的引擎，連加個油都會漏，看來是不能用了。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "bolt default"
script = """
echoat $n 你要鎖什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "bolt rudderhelm"
script = """
if is_inv_obj($n) == 21349
	if roomvalue($0) & 1
		stun $n 10
		purge $n rudderhelm-myth
		echoat $n 船舵(rudderhelm)功能正常，但你還是想要換掉。
		echoaround $n $N似乎嫌船舵(rudderhelm)不順手，堅持替換掉，但過程非常快因此沒人有意見。
	else
		stun $n 10
		echoat $n 你將船舵(rudderhelm)栓到駕駛台上。
		echoaround $n $N將船舵(rudderhelm)栓到駕駛台上。
		modrvt v0 | 1
		purge $n rudderhelm-myth
	endif
else
	echoat $n 你身上沒有船舵。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "install default"
script = """
echoat $n 你要裝什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "install compass"
script = """
if roomvalue($0) !& 1
	echoat $n 在駕駛台上你找不到適合的地方安裝它。
	break
endif
if is_inv_obj($n) == 21350
	if roomvalue($0) & 2
		stun $n 10
		purge $n compass-myth
		echoat $n 魔導羅盤(magica compass)功能正常，但你還是想要換新的上去。
		echoaround $n $N堅持替換魔導羅盤(magica compass)，但過程非常快因此沒人有意見。
	else
		stun $n 10
		echoat $n 你將魔導羅盤(magica compass)妥善地裝置在船舵上。
		echoaround $n $N將魔導羅盤(magica compass)妥善地裝置在船舵上。
		modrvt v0 | 2
		purge $n compass-myth
	endif
else
	echoat $n 你身上沒有魔導羅盤。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "replace default"
script = """
echoat $n 你要換什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "replace engine"
script = """
if is_inv_obj($n) == 21351
	if roomvalue($0) & 4
		stun $n 10
		purge $n engine-myth
		echoat $n 魔導引擎(arcane engine)功能正常，但你還是想要換一顆新的上去。
		echoaround $n $N堅持換上一顆新的魔導引擎(arcane engine)，但處理非常快因此沒人有意見。
	else
		stun $n 10
		echoat $n 你將舊的引擎拆除，換上新的魔導引擎(arcane engine)。
		echoaround $n $N將舊的引擎拆除，換上新的魔導引擎(arcane engine)。
		modrvt v0 | 4
		purge $n engine-myth
	endif
else
	echoat $n 你身上沒有魔導引擎。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "refuel default"
script = """
echoat $n 你要填充什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "refuel diesel"
script = """
if roomvalue($0) !& 4
	echoat $n 這艄船的引擎毀壞嚴重。
	break
endif
if is_inv_obj($n) == 21352
	if roomvalue($0) & 8
		stun $n 10
		purge $n diesel-myth
		echoat $n 引擎中已經有柴油(diesel)了，但你還是倒入更多。
		echoaround $n $N堅持將柴油(diesel)加滿！
	else
		stun $n 10
		modrvt v0 | 8
		purge $n diesel-myth
		echoat $n 你將柴油(diesel)倒入魔導引擎中。
		echoaround $n $N將柴油(diesel)倒入魔導引擎中。
	endif
else
	echoat $n 你身上沒有柴油。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "trigger default"
script = """
echoat $n 你要引發什麼？
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "trigger cluster"
script = """
if is_inv_obj($n) == 21353
	echoat $n 你試著用魔法晶簇(magic cluster)啟動魔導引擎....
	echoaround $n $N試著用魔法晶簇(magic cluster)啟動魔導引擎....
	stun $n 10
	if roomvalue($0) !& 4
		callout 1 echoat $n 你發現這艘船的引擎毀壞嚴重，無法啟動。
		callout 1 echoaround $n 但引擎已經毀壞，對$N的行為沒有反應。
		break
	endif
	if roomvalue($0) !& 8
		callout 1 echoat $n 你發現魔導引擎中缺少燃料，沒辦法啟動。
		callout 1 echoaround $n 但魔導引擎對$N的行為沒有反應。
		break
	endif
	if roomvalue($0) !& 1
		callout 1 echoat $n 但你突然想到還沒找到方法操作船體，所以作罷。
		callout 1 echoaround $n $N好像突然想到了什麼，決定停止進行這個動作。
		break
	endif
	if roomvalue($0) !& 2
		callout 1 echoat $n 咚咚咚....咚咚....噗砰....
		callout 1 echoaround $n 咚咚咚....咚咚....噗砰....
		callout 2 echoat $n 你順利啟動引擎，但引擎突然又自動熄火。
		callout 2 echoat $n $N順利啟動魔導引擎，但引擎又自動熄火。
		break
	endif
	if roomvalue($0) & 16
		purge $n cluster-myth
		callout 1 echoat $n 魔法晶簇(magic cluster)發出炫麗的光茫消失掉了，引擎依然啟動。
	else
		stun $n 30
		modrvt v0 | 16
		modrvt t0 = 99
		at 21447 echo 你看見一艘船離開港口航向外海。
		purge $n cluster-myth
		callout 1 echoat $n 魔法晶簇(magic cluster)發出炫麗的光茫消失掉了。
		callout 2 echoat $n 咚咚咚....咚咚咚....咚咚咚咚！！！ 看來引擎順利啟動了。
		callout 2 echoaround $n 咚咚咚....咚咚咚....咚咚咚咚！！！
		callout 3 echo 船體開始移動，離開港口航向外海。
		callout 5 echo 不一會時間，船已經停在外海上了，現在或許能試著操作船舵(sail 方向)。
		callout 5 at 21474 modrvt t0 = 16
		callout 5 modrvt t0 = 0
	endif
else
	echoat $n 你身上沒有魔法晶簇。
endif
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "sail default"
script = """
if roomvalue($0) !& 16
	break
endif
echoat $n 你要把船開往哪邊？(sail 方向)
"""
[[rooms.21442.programs]]
trigger = "room_command"
argument = "sail p north"
script = """
if roomvalue($0) !& 16
	break
endif
if roomtimer($0) != 0
	echoat $n 目前已經被掌舵了。
	break
endif
if roomtimer(1) != 0
	echoat $n 看來要擊退來犯的敵人才能奪回船的掌控權。
	break
endif
if roomvalue($0) & 512
	echoat $n 船失去了動力。
	break
endif
rcall ship_attack $n
rcall ship_north $n
"""
