keywords = "rod lordly might"
description = """
這看起來是把老舊且無用的加冕用手杖，上頭有一些奇怪的雕刻(markings)。
It appears to be a dull and useless ceremonial staff.
There are some strange markings on the rod...
"""
[[objects.21317.extra_descriptions]]
keywords = "markings"
description = """
手杖上面有一些刻痕與文字，其中一個看起來像是錘子(mace)，另一把則是寶劍
(sword)，另外還有一些像是星形(star-like)的圖案。「統治者都只是傀儡」這
幾個字被刻在下方。
There are several scratches and words on the rod, one looks like a mace,
another like a sword, and yet another which is some kind of strange star-like
symbol. The words 'rulers are just figureheads' are etched into the base of it.
"""
[[objects.21317.extra_descriptions]]
keywords = "star star-like"
description = """
「為神聖而統治」這幾個字被另外雕刻在星形記號的旁邊。
The words 'rulership is for the divine' are written alongside the star etched
into the rod's surface.
"""
[[objects.21317.extra_descriptions]]
keywords = "mace"
description = """
「以鐵腕來統治」這幾個子被另外刻在錘子圖案的旁邊。
The words 'rule with an iron fist' are written alongside the mace etched into
the rod's surfaec.
"""
[[objects.21317.extra_descriptions]]
keywords = "sword"
description = """
另外有些字被刻在寶劍的記號旁，上面寫著「弱者被強者統治」。
