description = """
你看不懂這古老的語言，但不知為何，卻能理解字句的意義：
　
「主啊！我要\u001B[1;37m洗手表明無辜\u001B[0m，才來繞著你的祭壇行走；
  好使我發出稱謝的聲音，述說你一切奇妙的作為。 」
                                  -- 詩篇 26:6-
　
 "I\u001B[1;37m wash 'my hands'\u001B[0m in innocence, and go about your alter, O LORD,
  proclaiming aloud your praise and telling of all your wonderful deeds."
                                                    --Psalm 26:6-7
"""
[[rooms.9072.programs]]
trigger = "room_enter"
argument = "32 100"
