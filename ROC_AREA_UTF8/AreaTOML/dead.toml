[[rooms.9059.programs]]
trigger = "room_time"
argument = "100"
script = """
if pcnum($) > 0
	if mobcount(9008) == 0
		if roomvalue($0) == 0
			echo 當 死亡谷守衛 - 索爾(Shore) 消失之後，
			echo 忽然東邊出現了一個出口，而且遠遠的可以看到人間的亮光。
			echo 遠方傳來一陣聲響「快啊！不然出口就要消失了....！」
			makedoor 1 東邊一片漆黑 door 1 0 9039
			modrvt v0 = 1
			break
		endif
		if roomvalue($0) == 1
			echo 由於死亡谷與人間打開了一個出口，
			echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			force 9039 echo 由於死亡谷與人間打開了一個出口，
			force 9039 echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			force 9040 echo 由於死亡谷與人間打開了一個出口，
			force 9040 echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			force 9041 echo 由於死亡谷與人間打開了一個出口，
			force 9041 echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			force 9043 echo 由於死亡谷與人間打開了一個出口，
			force 9043 echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			force 9044 echo 由於死亡谷與人間打開了一個出口，
			force 9044 echo 空間忽然開始劇烈震動，你幾乎都快站不穩了。
			modrvt v0 = 2
			break
		endif
		if roomvalue($0) == 2
			echo 索爾(Shore) 接受死亡谷的死氣後，再度復活了。
			echo 索爾(Shore) 關閉了死亡谷前往人間的通道。
			if roomtimer($0) > 0
				mload 9008
				add_qmark shore-dead dead_shore_relife 30 0 0 0 1 1
			else
				mload 9008
			endif
			mload 9004
			mload 9004
			deldoor 1
			modrvt v0 = 0
		endif
	else
		if roomvalue($0) == 0
			break
		else
			modrvt v0 = 0
		endif
	endif
endif
if roomtimer($0) == 0
if mobcount(9008) == 0
	mload 9008
endif
endif
"""

