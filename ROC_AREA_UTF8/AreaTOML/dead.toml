[mobiles.9000]
keywords = "ephraim lord dead"
short_description = "死亡之王 - 艾佛瑞(Ephraim - Lord of Death)"
long_description = "艾佛瑞(Ephraim) - 死亡谷的主宰，是人們心中的夢魘。\n"
description = """
他是人人懼怕的死亡之王，控制著人們的懼怕與驚恐。
"""
act_flags = ["NPC", "SENTINEL", "PRACTICE", "CRITICAL", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED", "PROTECT"]
alignment = -1000
level = 60
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 30
mod_damroll = -50
mod_ac = 700
mod_svs = -50
dodge = -1000
mod_pp = 0
gold = -1
sex = "male"
race = "Undead"
class = ["WARRIOR", "MAGE", "THIEF", "BLOODY"]
spec_flags = ["NO_BLIND", "HALF_MAGIC", "EXPERT", "NO_CRAZY", "MOBAI_LV2", "SPELL_FURY", "NO_FEAR"]
[[mobiles.9000.applies]]
type = "SAVING_BREATH"
degree = -100
[[mobiles.9000.applies]]
type = "SAVING_EARTH"
degree = -50
[[mobiles.9000.applies]]
type = "SAVING_WIND"
degree = -50
[[mobiles.9000.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.9000.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if is_qmark($n) == dead_enemy
	say 曾經擊敗過我的 $n ，竟然又來送死了！
	grin $n
	c sleep $n
	mpnowait
	c 3 whirlwind
	mpnowait
	break
endif
if ispc($n)
	tell $n 歡迎來到你的人生最終路途，只是我很驚訝你能夠到達這邊。
	tell $n 或許我應該要高興，或許你可以加入我們死亡谷的行列。
	tell $n 或是....享受死亡的歡愉！
endif
"""
[[mobiles.9000.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if is_qmark($n) != dead_enemy
	mpadd_all_qmark $n dead_enemy 500 0 0 0 1 1
endif
if hitprcnt($i) < 70
	mpat 5 c 'double heal'
	mpnowait
endif
if hitprcnt($i) < 50
	mpat 5 c 'double heal'
	mpnowait
endif
if hitprcnt($i) < 30
	mpat 5 c 3 'double heal'
	mpnowait
endif
say 死吧！你必須迎接死亡之路....！
if rand(40)
	c 'demon tremor'
	mpnowait
endif
if ispc($r)
	if rand(20)
		c curse $r
		mpnowait
		c curse $r
		mpnowait
	endif
	if rand(20)
		c poison $r
		mpnowait
		c blindness $r
		mpnowait
	endif
	if rand(40)
		if rand(50)
			c lifesteal $r
			mpnowait
			c lifesteal $r
			mpnowait
		else
			c soulsteal $r
			mpnowait
			c soulsteal $r
			mpnowait
		endif
	endif
	if rand(50)
		c 'energy drain' $r
		mpnowait
		c 'energy drain' $r
		mpnowait
	else
		c powerball $r
		mpnowait
	endif
endif
if rand(30)
	if mobcount(9021) > 0
		if insameroom(guardian-dead)
			if is_qmark($i) != dead_ephraim_groupfight
				mpadd_qmark self dead_ephraim_groupfight -1 0 0 0 1 0
				yell 我的死亡守衛，請過來幫助我啊！
				mpgroup self guardian-dead 1 0
				mpforce guardian-dead rescue ephraim
			endif
		else
			yell 我的死亡守衛，請過來幫助我啊！
			mptransfer guardian-dead
			mpgroup self guardian-dead 1 0
			mpforce guardian-dead rescue ephraim
		endif
	endif
endif
if isaffected($i) & 16777216
	mpdis_magic self 'seal magic'
	yell 封鎖魔法對我來說是沒有用的！哈....哈....！
	c 'seal magic' $r
	mpnowait
endif
if isaffected($i) & 4096
	c 'cure poison'
	mpnowait
endif
if isaffected($i) & 4096
	c 'cure poison'
	mpnowait
endif
if isaffected($i) !& 128
	if hitprcnt($i) < 30
		c sanctuary
		mpnowait
	endif
endif
if isaffected($i) & 268435456
	mpdis_magic self paralyze
endif
"""
[[mobiles.9000.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
shout 死亡是永恆的，就憑你 $n 是沒有辦法殺死我的....！
tell $n 我會再去找你，你永遠不能擺脫死亡的....！
if is_qmark($n) != dead_enemy
	mpadd_all_qmark $n dead_enemy 500 0 0 0 1 1
endif
if is_qmark($n) == dead_echo
	mpecho $I 的身體緩緩的消失了....。
	mpecho 一把光芒萬丈的劍漸漸的浮現出來....！
	mpdel_qmark $n dead_echo
	mpoload 9011 38 floor
	mppurge self
endif
if pcnum($) > 20
	mpgreward exp $n 30 5000
else
	if pcnum($) > 15
		mpgreward exp $n 30 5500
	else
		if pcnum($) > 10
			mpgreward exp $n 30 6000
		else
			if pcnum($) > 5
				mpgreward exp $n 30 6500
			else
				mpgreward exp $n 30 7000
			endif
		endif
	endif
endif
"""

