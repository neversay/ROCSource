	c 'cure blindness'
	mpnowait
endif
"""
[[mobiles.9036.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if being($b)
	if insameroom($b)
		break
	endif
endif
ponder
say 好的，我還有一些力量可以幫助你....。
say 請你稍等一下....。
mpdef_rembch $n
mpadd_qmark self dead_quest -1 0 0 0 0 1
"""
[[mobiles.9036.programs]]
trigger = "rand_prog"
argument = "35"
script = """
if insameroom($b)
	if is_qmark($b) == dead_quest 100000
		say 試著去存在吧....！試著去拯救我的子民吧....！
		say 試著去擊敗無盡的邪惡....！
		mpmod_qmark self dead_quest v0 = 1
		break
	endif
	if is_qmark($b) == dead_quest 100001
		mpecho $I 緩緩的升起她的右手....。
		mpecho 當 $I 舉起她的右手時，似乎這個空間已經完全沒有了聲音....。
		mpmod_qmark self dead_quest v0 = 2
		break
	endif
	if is_qmark($b) == dead_quest 100002
		mpechoat $b 忽然有一道白光將你帶離了死亡谷....。
		mpechoaround $b 忽然有一道白光將 $b 帶離了這裡。
		mptransfer $b 4580
		mpdel_qmark self dead_quest
		mpdef_rembch null-tar
	endif
endif
"""
[[mobiles.9036.programs]]
trigger = "death_prog"
argument = "100"
script = """
if pcnum($) > 15
        mpgreward exp $n 30 500
else
        if pcnum($) > 10
                mpgreward exp $n 30 900
        else
                if pcnum($) > 5
                        mpgreward exp $n 30 1200
                else
                        mpgreward exp $n 30 1500
                endif
        endif
endif
"""

