[rooms.9000]
name = "死亡谷的入口"
description = """
.
                              死  亡  谷
    你現在正在死亡的大地上, 這是死亡之王(Lords of Death)的領域。即使你認為你可以獨
自找到離開的路，耐克瑞(Necri) 還是會將你的靈魂撕裂。如果你想在這裡生存，那麼加入死
亡之王的行列，作為死亡之王忠誠的僕人，或許可以倖免於難。當然，你也必需要証明你的確
有足夠的資格，可以接受死亡之王的幫助....。
有些文字(word)虛無飄渺的浮在這裡....。
"""
flags = ["DARK", "NO_MOB", "NO_RECALL", "SUMMON_BIT", "SAVE", "NO_TELEPORT_OUT"]
sector = "MOUNTAIN"
[[rooms.9000.extra_descriptions]]
keywords = "word"
description = """
如果你的等級低於 36，奉勸你不要接近這邊。
一旦進入死亡谷，將沒有可以回頭的地方。
或許你可以找到能夠回到人間的出口。
"""
[rooms.9000.exits.north]
description = ""
keywords = ""
locks = []
key = -1
to_room = 9006
[rooms.9000.exits.south]
description = ""
keywords = ""
locks = []
key = -1
to_room = 4659
[[rooms.9000.programs]]
trigger = "room_enter"
argument = "4 100"
script = """
if ispc($n)
	if level($n) < 36
		echoat $n 前頭一團包含強大力量的死氣，將你推了回來....。
		transfer $n 4659
	else
		echoat $n 前頭的死氣，讓你感到不甚舒服....。
		if rand(10)
			echoat $n 你覺得你似乎被詛咒了....。
			add_affect $n curse 0 30 18 -10 1024
			break
		endif
		if rand(10)
			if race($n) == vampire
				break
			else
				echoat $n 你覺得你似乎中毒了....。
				add_affect $n poison 0 30 1 -3 4096
			endif
			break
		endif
		if rand(10)
			echoat $n 你覺得你似乎不甚安穩了....。
			if rand(50)
				add_affect $n 'faerie fire' 0 30 17 50 256
			endif
			break
		endif
		if rand(5)
			echoat $n 你覺得你似乎全身麻痺了....。
			add_affect $n  paralyze 0 3 17 -100 268435456
		endif
	endif
endif
"""
