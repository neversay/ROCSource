	echoat $n 忽然一股十分強大的力量將你推了回來....。
	transfer $n 9071
endif
"""
[[rooms.9072.programs]]
trigger = "room_command"
argument = "wash p my hands"
script = """
if ispc($n)
	echoat $n 遠方傳來一陣奇怪的聲響「我已經聽見你對我的呼喚！」
	echoat $n 遠方傳來一陣奇怪的聲響「我來領你離開這死亡世界吧！」
	echoaround $n 一陣閃光之後， $n 忽然不見了....。
	echoat $n 你被傳送回到光明之鎮的聖殿了....。
	transfer $n 4580
endif
"""
