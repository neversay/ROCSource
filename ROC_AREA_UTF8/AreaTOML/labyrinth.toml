                endif
                if is_qmark($n) == labyrinth_quest 100002
                        say 原來是Amenda的信眾啊，歡迎歡迎～
                endif
                if is_qmark($n) == labyrinth_quest 100003
                        say 原來是Zcecil的信眾啊，歡迎歡迎～
                endif
                if is_qmark($n) == labyrinth_quest 100004
                        say 原來是Coconet的信眾啊，歡迎歡迎～
