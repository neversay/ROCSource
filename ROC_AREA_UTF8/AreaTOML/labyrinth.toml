		mpmod_qmark $n labyrinth_castle_mask v0 = 1
		say 這樣才對嘛！既然你那麼有誠意的問了，那我就大發慈悲的告訴你
		say 你個光源，實在是太差了，小小一個執法者之旗也敢拿著大街上逛
		say 真正頂級的光源是結合了善良、中立、邪惡三種最強的光源混合在
		say 起的啊！如果你能給我執法者之旗、慈悲之火、赤火魔燄，再加上
		say "少許"的工本費，我就能將三種的光源融合在一起，要不要考率看
		say 看？(yes/no)
	else
