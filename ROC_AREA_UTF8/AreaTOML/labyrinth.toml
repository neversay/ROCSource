[rooms.38321]
name = "血莽"
description = """
稀疏不茂盛的樹林，錯綜生長在平原上，低矮的樹叢團團密佈在可視
範圍內，擾人的藤蔓從樹上垂掛至地面的矮叢裡。高過人肩的長草，鋸齒
般的葉緣留有深紅色血染的光澤。小心別碰到了刺人的藤蔓，注意腳下，
別陷入了無可挽救的泥沼。
