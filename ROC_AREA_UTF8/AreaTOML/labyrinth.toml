script = """
if is_qmark($n) & labyrinth_village_sleepless 100032
        mpmod_qmark $n labyrinth_quest v1 | 8
        mpdel_qmark $n labyrinth_village_sleepless
	say 機會往往是沒有第二次的，就跟人生一樣，不能重來
	pat $n
else
