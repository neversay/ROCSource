。你根本沒時間去關心在這高度能看到什麼風景，只怕到時不知該如何降
落了？
"""
flags = ["NO_MOB", "INDOORS", "UNDERGROUND", "SUMMON_BIT", "SAVE"]
sector = "INSIDE"
[[rooms.38203.programs]]
trigger = "room_enter"
argument = "127 100"
script = """
if roomvalue($n38202v0) & 4
        at 38202 modrvt v0 r 4
        callout 2 echo 隆隆的風聲在你耳邊響個不停～
        callout 4 echo 隆隆的風聲在你耳邊響個不停～
        callout 6 echo 隆隆的風聲在你耳邊響個不停～
        callout 8 echo 隆隆的風聲在你耳邊響個不停～
        callout 10 echo 你發現似乎有什麼東西接近了～
        callout 12 echo 你覺得剛剛看到的東西越來越大～
        callout 14 echo 你突然驚覺那似乎是一座山！！
        callout 17 echo 糟糕，你煞不住車！只能撞上去了....
        callout 17 echotoarea \u001B[37m【北七快訊】：「砲彈飛人 $N \u001B[37m試射失敗....結果撞山了！！」\u001B[m
        callout 17 modhmv $n 03.50 50
        callout 18 transfer $n 902
        break
endif
if roomvalue($n38202v0) & 1
        at 38202 modrvt v0 r 1
        callout 2 echo 你覺得身邊的事物如流星般消逝～
        callout 4 echo 你覺得身邊的事物如流星般消逝～
        callout 6 echo 你覺得你似乎飛得太快了～
        callout 8 echo 你覺得事情並不是你所想像的那樣～
        callout 10 echo 你突然感到莫名地擔心！
        callout 12 echo 你在想：該不會就這樣，永遠不會停了吧？
        callout 14 echo 突然眼前一陣炫光，你什麼都看不到了！
        callout 17 echo Oh My God! 你怎麼會出現在這種地方！
        callout 17 echotoarea \u001B[1;37m遠方出現一片亮光，有人試圖穿過時空的障壁！\u001B[m
        callout 18 transfer $n 2581
        break
endif
if roomvalue($n38202v0) & 8
        at 38202 modrvt v0 r 8
        callout 2 echo 你覺得你像超人一樣迅速地往天空中飛去！
        callout 4 echo 咻～咻～你像隻小鳥般在天空快樂的飛著～
        callout 6 echo 你突然失速了  ＯＨ～ＮＯ！
        callout 9 echo \u001B[1;33m砰！你重重地摔在地上，跌個四腳朝天！\u001B[m
        callout 9 echotoarea \u001B[1;33m你聽到遠方傳來一陣雷聲～  打雷了嗎？\u001B[m
        callout 9 stun $n 50
        callout 10 transfer $n 8207
        break
endif
"""
[[rooms.38203.programs]]
trigger = "room_rand"
argument = "100"
script = """
if roomvalue($n38202v0) & 2
        if roomvalue($1) >= 8
                if rand(50)
                        echo 你感覺到你已經通過最高點，開始往下墜了....
                        modrvt v1 = 0
                        at 38202 modrvt v0 r 2
                        callout 1 transfer $r 38204
                        break
                endif
                if rand(40)
                        modrvt v1 = 0
                        at 38202 modrvt v0 r 2
                        callout 2 echo 你覺得越來越熱....
                        callout 4 echo 這不是錯覺，真的越來越熱了....
                        callout 6 echo 你突然驚覺你的衣服已經開始著火....
                        callout 9 echo \u001B[1;31m慘了！你全身衣物都燒起來了.... 砰 ....\u001B[m
                        callout 9 echotoarea \u001B[37m【北七快訊】：「 $R \u001B[37m在史卡拉貝外海發生爆炸，不幸失事....」\u001B[m
                        callout 9 modhmv $r 03.50 50
                        callout 9 stun $r 50
                        callout 10 transfer $r 3054
                        break
                endif
                echo 你開始覺得這似乎是永無止境的飛行....
                modrvt v1 = 0
                break
        endif
        if roomvalue($1) < 8
                echo 你迎面吹著舒服的風，朝向未知的目的地前進～
                modrvt v1 + 1
        endif
endif
"""

