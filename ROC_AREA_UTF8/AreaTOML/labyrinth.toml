trigger = "act_prog"
argument = "angry"
script = """
if is_qmark($n) & labyrinth_castle_mask 300001
	mpechoat $n $I眼露兇光，對你說：「看來，一切你都知道了？」
	mpechoaround $n $I眼露兇光，對$N說：「看來，一切你都知道了？」
	mpkill $n
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "bloodfield"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	say 想必你也有所耳聞，這一帶的森林異常的生長速度吧？
	say 血莽(bloodfield)就是最好的例子。就算被破壞得多麼
	say 嚴重，它還是能夠在三天以內恢復原狀。一旦開始復原
	say 就算是多麼有經驗的冒險隊伍，也將會被困在裡面，跟
	say 無盡的自然奮鬥至死。
	mpcallout 2 talk self recover
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "recover"
script = """
if isnpc($n)
	say 你們一定很想知道，那邊到底有什麼東西吧？可惜的是
	say ，到目前為止，只有一個人能夠發現通往下層的道路。
	say 其餘的冒險者，運氣好的是無功而返；運氣差的，則是
	say 再也回不來了。
	mpecho 你不禁開始讚嘆，到底是誰有如此大的能耐
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "who"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	say 那還用說，當然是偉大的麥斯克大人
	kow $i
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "act_prog"
argument = "kowtow"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	pat $n
	say 很好，很好。既然你有心求教，那我也不吝於教授。你
	say 應該知道血莽中間有一塊巨大的平台吧。其實那就是真
	say 正的入口，其實說穿了，我也不知道怎麼進去的，當時
	say 很多人在一起探查，突然看到入口莫名其妙開啟了，我
	say 就走了進去(enter)。
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "enter"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	say 裡面有著邪惡的力量，很強大，無法比擬；很邪惡，比
	say 我還邪惡。我敗了，徹底的敗了！
	shin
	say 不過我發現連結該空間與這個世界的方法(way)，不需要
	say 進血莽就可以到達異界。
	cac
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "way"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	kok $n
	say 這當然是商業機密啊=v=!!怎能跟你說！
	say 不過，只要給點資助(support)，我倒是可以讓你進我的研究室。
	say 但是裡面也是有相當的危險(danger)，自己小心。
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "support"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	mpforcer here stun $n 100
	say 來個三百萬怎樣？夠便宜吧
	mpcallout 1 mpechoat $n 你對$I露出-_-的表情....
	mpcallout 1 mpechoaround $n $N對$I露出-_-的表情....
	mpcallout 2 mpforce $n say 三百個屁，五十萬還差不多
	mpcallout 2 mpechoat $n 你對$I比了個凸....
	mpcallout 2 mpechoaround $n $N對$I比了個凸....
	mpcallout 3 say 什麼五十萬，頂多算你三百萬減五十萬，二百五算你啦
	mpcallout 4 mpforce $n say 什麼二百五，太貴了啦，便宜點啦
	mpcallout 5 say 那多少才不算貴啊？
	mpcallout 6 mpforce $n say 至少也要半價啊！
	mpcallout 7 say 好！那就一百五十萬....成交
	mpcallout 8 mpechoat $n 你猛然有種上當了的感覺！
	mpadd_qmark $n labyrinth_mask_research -1 0 0 0 1 0
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "danger"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	say 說到危險，這是因為當初被那強大的壓迫感所驚嚇，於是為了發
	say 展出能夠與其對抗的力量，我自形研發了許多的合成生物、召喚
	say 生物等。結果，我成功了，也失敗了....
	mpecho 你聽了覺得怎麼會(why)這麼奇怪？
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "why"
script = """
if is_qmark($n) == labyrinth_mask_bloodfield
	say 我的確是成功的研發出新的物種，召喚出異界的魔獸。但是我卻無
	say 法控制他們的力量，於是，我的研究室就被他們佔據了。通往異界
	say 的門在右邊走廊進頭，但是中間會遇到什麼，我也不敢想像了。
else
	stare $n
	say 想免費從我這裡得到消息，門兒都沒有！
endif
"""
[[mobiles.38223.programs]]
trigger = "death_prog"
argument = "100"
script = """
