	mpoload 38205
	give key-labyrinth $n
else
	look $n
	say 你想幹啥....
endif
"""
[[mobiles.38204.programs]]
trigger = "talk_prog"
argument = "golin"
script = """
if is_qmark($n) & labyrinth_village_killgolin 100002
        say 事情是這樣的，有人來報告我說聽見葛林的聲音，但是去找
        say 他時房裡只有看到血跡，已經不見人影了
        mpecho $I說到這裡突然頓了一下....
        mpecoh .
        shining
        mpechoat $n $I似乎發現你身上的血跡....
        mpechoaround $n $I似乎發現$N身上沾染著血跡....
        say 難道是你........！！
        mpechoat $n .
        mpechoat $n 你覺得你是 有罪(guilty) 還是 無辜(innocent) 的
        mpmod_qmark $n labyrinth_village_killgolin v0 r 2
        mpmod_qmark $n labyrinth_village_killgolin v0 | 4
else
        if is_qmark($n) == labyrinth_village_sleepless
                say 葛林(Golin)喔....
                say 其實也沒什麼啦。只是他最近失眠的很厲害，脾氣變得很暴躁
                say 其實他平常人可是很好的呢！反正只要記得開門時輕輕推別吵
                say 到他就對了。
        endif
endif
"""
[[mobiles.38204.programs]]
trigger = "talk_prog"
argument = "cocota"
script = """
if is_qmark($n) == labyrinth_village_coconutlost 200001
        say 摳摳塔(Cocota)說你偷了他的椰子，不曉得有沒有這回事？
        mpechoat $n -- 回答承認(Confess)／否認(Deny)
        mpmod_qmark $n labyrinth_village_coconutlost v1 | 2
else
        if is_qmark($n) == labyrinth_village_cocotawork 100001
                say 這....我就不清楚了喔....
