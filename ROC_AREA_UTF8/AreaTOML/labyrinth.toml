[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step1"
script = """
ponder
say 原來...我忘了這個步驟嗎...
say 我忘記了在合成光源的時候，會連陣營一起合成，所以必須再經過
say 一個步驟才能掉陣營的限制。
mpcallout 2 talk $i step2
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step2"
script = """
mmm
say 這個步驟相當困難，因為在移除陣營限制的過程中，必須在大量的
say 黃金中才能辦到。若黃金的量不夠，移除陣營的光源會在一瞬間燒
say 光，大概只能持續...2小時吧！
mpcallout 2 talk $i step3
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step3"
script = """
say 而我想你也知道，為了最好的光源，〝一點點〞的代價是相當值得
say 的。
mpecho $I又再次地搓了搓手。
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step4"
script = """
