say 好啦！接下來就是獨門密方。就稍微等我一下吧！
mpecho $I帶著融化的黃金進到了密門裡.
mpcallout 2 talk $i step5
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step5"
script = """
mpforce $b wait
mpcallout 2 talk $i step6
"""
[[mobiles.38223.programs]]
trigger = "talk_prog"
argument = "step6"
script = """
mpechoat $b $I拍了拍快睡著的你.
