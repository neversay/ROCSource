[[mobiles.38201.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if is_qmark($n) == labyrinth_quest 100005
        if hour($) >= 18
        or hour($) < 6
                mpechoat $n $I對於你的到來感到驚訝....
                mpechoaround $n $I對於$N的到來感到驚訝....
        else
                mpadd_qmark self labyrinth_notalk -1 1 0 0 0 0
                mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
                mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
                break
        endif
else
        if rand(33)
                mpechoat $n $I轉過頭來無神地向你望了一下....
        endif
endif
"""
[[mobiles.38201.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if hour($) >= 18
or hour($) < 6
        if is_qmark($i) == labyrinth_notalk
                mpdel_qmark self labyrinth_notalk
        endif
endif
if hour($) == 0
        drop all
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
cry
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if rand(50)
        if rand(50)
                say 村裡面好久沒有外地人來了....
                mpcallout 2 say 難道又是一場浩劫的開端嗎....
        else
                hmm
        endif
endif
"""
[[mobiles.38201.programs]]
trigger = "rand_prog"
argument = "9"
script = """
if rand(70)
        sigh
else
        sigh
        say 又有誰能幫我這個忙呢？
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) == labyrinth_village_zombie
or is_qmark($n) & labyrinth_quest 200002
        say 你的心意我已經瞭解了....
else
        mpechoat $n $I緩緩地轉過頭來看你....
        mpcallout 2 say 你真的想幫我嗎？
        mpcallout 3 pull $n
        mpadd_qmark $n labyrinth_village_zombie -1 1 0 0 0 1
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "no"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_quest 200002
        say 感謝你的心意....
else
        if is_qmark($n) == labyrinth_village_zombie
                sigh
                say 這樣啊....沒關係的，我知道很為難，你就別放在心上了....
                bow $n
                mpcallout 2 $I又漸漸進入呆滯狀態....
                mpmod_qmark $n labyrinth_quest v1 | 2
                mpdel_qmark $n labyrinth_village_zombie
        endif
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_quest 200002
        say 感謝你的心意....
else
        if is_qmark($n) == labyrinth_village_zombie
                say 那就麻煩你再幫我的忙了！
                bow $n
                mpdel_qmark $n labyrinth_village_zombie
        endif
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_quest 200002
        say 感謝你的心意....
else
        if is_qmark($n) == labyrinth_village_zombie
                mpmod_qmark $n labyrinth_village_zombie v0 | 2
                say 真的嗎？！  真是太好了....
                say 村裡的人都不願意幫我這個忙....畢竟危險性太高了....
                sigh
                mpcallout 2 say 那我就慢慢將事情(event)說給你聽....
        endif
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "event"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100002
        mpmod_qmark $n labyrinth_village_zombie v0 | 4
        say 我的未婚夫前一陣子因為發生了某些事情，不幸喪生了。
        say 安葬於村子西邊的墓園中，原本好好的沒什麼事情。
        say 但就在最近，怪異(eerie)的事情開始發生了....
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "eerie"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100004
        mpmod_qmark $n labyrinth_village_zombie v0 | 8
        say 最近聽村裡的人說，入夜之後墓園裡會跑出奇怪的東西....
        say 似乎有人晚上經過時，不注意去看到園裡有人影出沒....
        say 當白天去察看的時候，卻發現有些墓地被挖開來了....
        mpecho $I講到這裡時稍微停頓了一下。
        worry
        mpcallout 2 mpechoat $n 你對事情感到有點興趣，稍微提示她繼續(continue)講下去....
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "continue"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100008
        mpmod_qmark $n labyrinth_village_zombie v0 | 16
        say 你不覺得很嚇人嗎？
        say 就因為如此，我為我那剛下葬不久的未婚夫感到不安....
        say 才會想找人去幫我調查(survey)一下....
        mpechoat $n 你覺得要幫助她嗎？(Ok/No)
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "survey"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100016
        say 說調查也不是說什麼特別的....
        say 只要去墓園幫我看看有沒有什麼事情，
        say 然後再回來跟我報備(report)就可以了。
        say 自從那些聽聞開始流傳之後，我一個人更不敢到處走動。
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "ok"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100016
        mpmod_qmark $n labyrinth_village_zombie v0 | 32
        curtsey $n
        say 真是太感謝你了....
        say 那就麻煩了....
endif
"""
[[mobiles.38201.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($n) == labyrinth_quest 100005
if is_qmark($i) == labyrinth_notalk
        mpechoat $n $I慌張地對你大叫：別過來，我什麼都不知道！
        mpechoaround $n $I慌張地對$N大叫：別過來，我什麼都不知道！
        break
endif
endif
if is_qmark($n) & labyrinth_village_zombie 100512
or is_qmark($n) & labyrinth_village_zombie 100128
or is_qmark($n) & labyrinth_village_zombie 100064
        say 原來就是有隻殭屍在作怪，才會弄得人心惶惶....
        say 你說有找到一具屍體？可不可以給我看看？
        mpmod_qmark $n labyrinth_village_zombie v0 | 1024
endif
if is_qmark($n) & labyrinth_village_zombie 100256
        hmm
        say 雖然他跑掉了，但我還是不太放心....
        say 拜託你，再去幫我確認一下....拜託了！
        mpmod_qmark $n labyrinth_village_zombie v0 r 256
endif
"""
[[mobiles.38201.programs]]
trigger = "give_prog"
argument = "38215"
script = """
if is_qmark($n) & labyrinth_village_zombie 101024
        if is_qmark($n) & labyrinth_village_zombie 100064
                mpecho $I凝重地看著屍體嘆了口氣，「唉～～」
                say 真是荼毒生靈啊～怎麼會發生這種事情呢....
                say 不過，無論如何，真的很感謝你的幫助，才能將殭屍解決。
                bow $n
                mpechoat $n 你潛藏的能力提昇了！
                mpskillexp $n 20000
                mpjunk corpse
                mpdel_qmark $n labyrinth_village_zombie
                mpmod_qmark $n labyrinth_quest v1 | 2
        else
                roll
                say 你給我這東西幹什麼？
                drop corpse
        endif
else
        drop corpse
endif
"""
[[mobiles.38201.programs]]
trigger = "give_prog"
argument = "38216"
script = """
if is_qmark($n) & labyrinth_village_zombie 101024
        if is_qmark($n) & labyrinth_village_zombie 100128
                mpecho $I凝重地看著屍體嘆了口氣，「唉～～」
                say 可憐啊～這是我鄰居家前些日子才安葬的人....如今卻....
                say 不過幸好有你幫忙，才不至於遭毀屍之禍。
                say 真是太感謝你的幫忙了。
                bow $n
                mpechoat $n 你潛藏的能力提昇了！
                mpskillexp $n 15000
                if is_qmark($n) == max_skill_exp
                        mpmod_qmark $n max_skill_exp v0 + 1
                else
                        mpadd_qmark $n max_skill_exp -1 1 0 0 0 1
                endif
                mpjunk corpse
                mpdel_qmark $n labyrinth_village_zombie
                mpmod_qmark $n labyrinth_quest v1 | 2
        else
                roll
                say 你給我這東西幹什麼？
                drop corpse
        endif
else
        drop corpse
endif
"""
[[mobiles.38201.programs]]
trigger = "give_prog"
argument = "38217"
script = """
if is_qmark($n) & labyrinth_village_zombie 101024
        if is_qmark($n) & labyrinth_village_zombie 100512
                sad $n
                say 嗚....嗚....還是....還是....
                say 這是我未婚夫的屍體，唉～～
                say 幸而在你的幫助之下，屍體沒什麼大礙，只要重新安葬就好了....
                say 真是太感謝你為我們村子除去如此大患....
                bow $n
                mpechoat $n 你潛藏的能力提昇了！
                mpskillexp $n 10000
                if is_qmark($n) == max_skill_exp
                        mpmod_qmark $n max_skill_exp v0 + 3
                else
                        mpadd_qmark $n max_skill_exp -1 3 0 0 0 1
                endif
                mpjunk corpse
                mpdel_qmark $n labyrinth_village_zombie
                mpmod_qmark $n labyrinth_quest v1 | 2
        else
                roll
                say 你給我這東西幹什麼？
                drop corpse
        endif
else
        drop corpse
endif
"""

[mobiles.38202]
keywords = "putrid zombie-labyrinth"
short_description = "腐爛的殭屍(putrid zombie)"
long_description = "一具腐爛(putrid)一半的屍體蹲在這裡不知道在挖什麼。\n"
description = """
全身發出惡臭味，要不是身上已經有部位開始腐爛，也許還以為只是流浪
漢咧。腐爛的脖子露出部分的骨頭，也許給他敲一下，脖子會就這麼斷了
也說不定；另外他的眼睛已經快掉下來了，不知道看不看見你的存在呢？
"""
act_flags = ["NPC", "SENTINEL", "REGENERACY"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED", "FLYING"]
alignment = 0
level = 30
mod_hitplus = 4000
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "neutral"
race = "Undead"
spec_flags = ["NO_DM", "NO_LORE", "NO_BLIND", "NO_CHARM", "NO_CURSE", "NO_FAEFIRE", "NO_POISON", "NO_SLEEP", "HALF_MAGIC", "ANTI_MAGIC", "ALY_DI", "ALY_DH", "ALY_INF", "NO_TARDY", "NO_MUTE", "NO_SEALMAGIC", "NO_CRAZY", "NO_PARA", "NO_FEAR"]
[[mobiles.38202.applies]]
type = "REDUCE_DAMAGE"
degree = 100000
[[mobiles.38202.applies]]
type = "REDUCE_MAGIC"
degree = 100000
[[mobiles.38202.applies]]
type = "APPLY_GPHYSICAL"
degree = 100000
[[mobiles.38202.applies]]
