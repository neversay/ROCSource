        break
endif
echoat $n 你試著在結冰的牆壁上搜索....
echoaround $n $N仔細地搜索牆壁每一塊地方....
modrvt v1 + 1
if roomvalue($1) < 6
        if rand(30)
                modrvt v0 | 1
                callout 3 echoat $n 噢～好冰！你一碰到結冰的牆壁就趕緊縮了回來....
                callout 3 echoaround $n $N把手放在牆壁上摸了一下，又趕緊縮了回來....
                callout 3 modrvt v0 r 1
        else
                modrvt v0 | 1
                callout 3 echoat $n 你在冰壁上摸來摸去，但是沒找到什麼東西....
                callout 3 echoaround $n $N在冰壁上摸來摸去，不知道想找什麼....
                callout 3 modrvt v0 r 1
        endif
        break
endif
if roomvalue($1) >= 6
        if roomvalue($1) == 9
                modrvt v0 | 1
                callout 3 echoat $n 你在角落冰層較薄的地方摸到一塊突起類似按鈕的東西....
                callout 3 echoaround $n $N眼睛一亮，似乎發現了什麼東西！
                callout 3 modrvt v0 r 1
                callout 3 modrvt v0 | 16
        else
                if rand(30)
                        modrvt v0 | 1
                        callout 3 echoat $n 你的手漸漸冰冷，就快沒感覺了....
                        callout 3 echoaround $n $N搓了搓自己的手，似乎很冷的樣子....
                        callout 3 modrvt v0 r 1
                else
                        modrvt v0 | 1
                        callout 3 echoat $n 由於你手中的溫度，冰壁似乎有點融化的跡象....
                        callout 3 echoaround $n $N甩了甩手上的水....
                        callout 3 modrvt v0 r 1
                endif
        endif
endif
"""
