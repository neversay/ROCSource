				if str($n) > 14
					modrvt v1 + 14
					callout 1 modrvt v1 - 14
				else
					modrvt v1 + 10
					callout 1 modrvt v1 - 10
				endif
			endif
		endif
	endif
	if roomvalue($1) > 100
		echoat $n \u001B[1;32m你使盡吃奶的力氣，終於推開這沈重的石門！\u001B[m
		echoaround $n \u001B[1;32m眾人在$N的領導之下，開啟了被封閉的石門！\u001B[m
		makedoor 0 眼前一片亮光 north 0 0 38410
	else
		echoat $n 你使盡吃奶的力氣，但這石門一動也不動！
		echoaround $n $N掛著扭曲的臉孔貼在牆上。
	endif
endif
"""

