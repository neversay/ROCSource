        mpmod_qmark $n labyrinth_village_story v0 | 1
endif
"""
[[mobiles.38204.programs]]
trigger = "talk_prog"
argument = "larva"
script = """
if is_qmark($n) & labyrinth_village_story 100001
        mpmod_qmark $n labyrinth_village_story v0 | 2
        say 拉爾法(Larva)原本只是「幼蟲」的意思，表示這是個成長
        say 中尚未茁壯的地區。這是一直以來流傳下來的說法，直到某
        say 次意外訪客(visitor)出現，才完全瞭解其中真正的含意的。
