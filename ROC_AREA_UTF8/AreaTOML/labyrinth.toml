degree = 100000
[[mobiles.38202.programs]]
trigger = "all_greet_prog"
argument = "100"
script = """
if is_qmark($n) & labyrinth_village_zombie 100032
        mpadd_qmark $i labyrinth_village_zombie -1 1 0 0 0 0
        if is_qmark($n) == labyrinth_quest 100005
                mpechoat $n $I一看到你的到來渾身發抖，拋下身邊的屍體慌張地逃跑了！
                mpechoaround $n $I一看到$N的到來渾身發抖，拋下身邊的屍體慌張地逃跑了！
                mpoload 38217 1 floor
                mpechoat $n .
                mpechoat $n 殭屍跑了，回去報備吧！
                mpmod_qmark $n labyrinth_village_zombie v0 = 512
                mpat 5 mppurge self
        else
                if is_equ_obj($n) == 38214
                        if is_wear_loc($n) == 16
                        or is_wear_loc($n) == 18
                                mpechoat $n $I看到你手上的武器，似乎開始感到畏懼。
                                mpechoaround $n $I看到$N手上的武器，似乎開始感到畏懼。
                                mpcallout 2 mpechoat $n $I似乎在害怕你，這種小喀幹掉他吧！
                        else
                                mpechoat $n 「嘎！」$I發覺你的到來，停下手邊的動作....
                                mpechoaround $n 「嘎！」$I發覺$N的到來，停下手邊的動作....
                                mpcallout 2 mpechoat $n $I的反應有點奇怪，該不該攻擊他？
                        endif
                else
                        if is_inv_obj($n) == 38214
                                mpechoat $n 「嘎！」$I發覺你的到來，停下手邊的動作....
                                mpechoaround $n 「嘎！」$I發覺$N的到來，停下手邊的動作....
                                mpcallout 2 mpechoat $n $I的反應有點奇怪，要不要攻擊他？
                        else
                                mpechoat $n $I回頭無神地望了你一下，又轉過身去繼續挖著....
                                mpechoaround $n $I回頭無神地望了$N一下，又轉過身去繼續挖著....
                                mpcallout 2 mpechoat $n $I的反應令你不爽，乾脆幹掉他了....
                        endif
                endif
        endif
else
        mpechoat $n $I似乎沒有發覺你的到來，繼續蹲在地上挖洞。
        mpechoaround $n $I似乎沒有發覺$N的到來，繼續蹲在地上挖洞。
endif
"""
[[mobiles.38202.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if hour($) < 6
or hour($) >= 18
else
        mpecho 「嘎！嘎！」....在刺眼的陽光下，殭屍化成煙霧消失了！
        if is_qmark($n) & labyrinth_village_zombie 100032
                mpechoat $n .
                mpechoat $n 殭屍不見了？回去報備一下好了....
                mpmod_qmark $n labyrinth_village_zombie v0 | 256
        endif
        mpat 5 mppurge self
        break
endif
if is_qmark($n) & labyrinth_village_zombie 100032
        if is_qmark($i) < labyrinth_village_zombie 100005
                mpmod_qmark $i labyrinth_village_zombie v0 + 1
        else
                mpgoto self
                mpecho $I發出「嘎嘎」聲。
                mpmod_qmark $i labyrinth_village_zombie v0 = 0
                mpmod_qmark $i labyrinth_village_zombie v1 + 1
                mpcallout 2 mpechoat $n $I怎麼突然不打了？再打他試試看....
        endif
else
        mpechoat $n 你打跑殭屍了！
        mpechoaround $n $N把殭屍打跑了！
        mpat 5 mppurge self
endif
if is_qmark($n) & labyrinth_village_zombie 100032
        if is_qmark($i)== labyrinth_village_zombie 200004
                if is_equ_obj($n) == 38214
                or is_inv_obj($n) == 38214
                        mpechoat $n $I受不了你的騷擾，終於丟下到手的屍體跑走了....
                        mpechoaround $n $I受不了$N的騷擾，終於丟下到手的屍體跑走了....
                        mpechoat $n .
                        mpechoat $n 你成功趕跑殭屍，可以回去報備了！
                        mpoload 38216 1 floor
                        mpmod_qmark $n labyrinth_village_zombie v0 = 128
                        mpat 5 mppurge self
                else
                        mpechoat $n $I受不了你的騷擾，終於丟下到手的屍體跑走了....
                        mpechoaround $n $I受不了$N的騷擾，終於丟下到手的屍體跑走了....
                        mpechoat $n .
                        mpechoat $n 你成功趕跑殭屍，可以回去報備了！
                        mpoload 38215 1 floor
                        mpmod_qmark $n labyrinth_village_zombie v0 = 64
                        mpat 5 mppurge self
                endif
        endif
endif
"""

