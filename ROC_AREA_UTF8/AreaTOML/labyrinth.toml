                mpmod_qmark $n labyrinth_village_cocotawork v0 r 1
                mpmod_qmark $n labyrinth_village_cocotawork v2 = 1
        else
                say 你說摳摳塔(Cocota)喔？他可是村裡很有成就的年輕人啊～本
                say 來好好的，不知道什麼原因，突然開始酗酒鬧事，有時會看他
                say 喝得醉醺醺的，不僅工作誤事，更白白糟蹋了一個人才啊！
                sigh
        endif
endif
"""
[[mobiles.38204.programs]]
trigger = "talk_prog"
argument = "background"
script = """
