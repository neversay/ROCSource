[[mobiles.38209.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) & labyrinth_village_sleepless 100032
        tsk $n
        say 居然真的給你找到了！趕快拿去給他吧！
else
        if is_qmark($n) & labyrinth_village_sleepless 100002
                gasp $n
                say 你想要安眠藥？
                say 說簡單是簡單啦....只要找到西爾(Ziel)之花拿給他聞一下
                say 幾乎馬上就可以見效！不過根本沒有人敢去採那種花的。你
                say 還是想別的辦法吧！
                shrug
                mpmod_qmark $n labyrinth_village_sleepless v0 r 2
                mpmod_qmark $n labyrinth_village_sleepless v0 | 4
        else
                if is_qmark($n) & labyrinth_village_sleepless 100008
                        say 怎樣？找到沒有？
                        say 跟你說還是別打這念頭比較好啦....
                        pat $n
                else
                        if rand(50)
                                if rand(33)
                                        zc $n
                                        say 信ZC得永生！
                                else
                                        if rand(50)
                                                say 需要幫忙嗎？
                                        else
                                                mpechoat $n $I稍微瞄了你一下，又繼續做手邊的工作。
                                                mpechoaround $n $I稍微瞄了$N一下，又繼續做手邊的工作。
                                        endif
                                endif
                        endif
                endif
        endif
endif
"""
[[mobiles.38209.programs]]
trigger = "talk_prog"
argument = "ziel"
script = """
if is_qmark($n) & labyrinth_village_sleepless 100004
        say 西爾之花不僅不小心聞到時會陷入重度昏迷，如果吸入太多
        say 還有可能會醒不過來。但這只要稍微做點防護措施就好了。
        say 可怕的是那花生長在墳墓附近，根繫埋入的屍體，藉由屍體
        say 的養分成長，屍體越新鮮，花就長的越茂盛。
        mpecho $I說到這裡，不禁停下來吞了口口水。
        mpecho .
        say 當你拔(pull)起花的那瞬間，有可能連根拔起。到時，花的
        say 根上繫著的可能是一顆顆串連在一起的頭骨。
        shiver
        say 不管怎樣，太可怕了，你還是少打這主意為妙....
        mpmod_qmark $n labyrinth_village_sleepless v0 r 4
        mpmod_qmark $n labyrinth_village_sleepless v0 | 8
else
        say 西爾(Ziel)之花？
        say 很久沒看過了，你從哪聽來的啊？
endif
"""
