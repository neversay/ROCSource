trigger = "talk_prog"
argument = "native"
script = """
say 你不知道啊！不知道去年什麼時候開始就有一些土人莫
say 名其妙跑到這附近(around)，也不知道打哪來的。想要
say 出去打獵砍柴，一不注意還會被攻擊。
curse
"""
[[mobiles.38210.programs]]
trigger = "talk_prog"
argument = "around"
script = """
say 這附近本來就比較少人出沒，對於哪些土人什麼時候跑
say 來的根本沒人知道。加上森林濃密，以及更遠處是草莽
say 想抓他們根本沒那麼容易。去年就有一次，他們大舉入
say 侵(attack)，我可是跑到崖邊躲著他們才沒找到我。不
say 然哪有那麼多命賠！
"""
[[mobiles.38210.programs]]
trigger = "talk_prog"
argument = "attack"
script = """
say 以前啊，門上畫著野獸的圖像，說也奇怪，土人們看到
say 居然會怕。大概是他們十分迷信吧，對這種東西比較害
say 怕。不過上次他們數量太多，門被驚嚇的豬群撞壞了，
say 結果最近變害我受他們騷擾。不知道有沒有什麼東西可
say 以拿來貼著，嚇嚇他們的。
sigh
"""
[[mobiles.38210.programs]]
trigger = "talk_prog"
argument = "larva"
script = """
say 你說「拉爾法(larva)」？
say 其實這是我的姓，而不是名字，不過我們這族的人已經
say 消失的差不多了，拉爾法區的現存者幾乎都是外來的移
say 民。傳說中我們是屬於被詛咒(curse)的一族，滅亡是
say 必定的道路。
"""
[[mobiles.38210.programs]]
trigger = "talk_prog"
argument = "curse"
script = """
say 古老的傳說中說著....
say 「巫術之始　長夜與太陽降臨　蘊含著暑氣的冬日
