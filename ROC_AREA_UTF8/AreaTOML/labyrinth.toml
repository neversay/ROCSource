		mpmod_qmark $n labyrinth_village_killgolin v1 r 8
		mpmod_qmark $n labyrinth_village_killgolin v1 r 16
		mpmod_qmark $n labyrinth_village_killgolin v1 | 4
	endif
else
	pat $n
	say 孩子，你還有很多需要學著的....
endif
