[[mobiles.38204.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == labyrinth_village_killgolin
	if is_qmark($n) == labyrinth_village_killzombie
		gasp $n
		say 你說找不到？
		say 剛剛我已經收到怪物被制伏的消息了，你也不用找了....
		say 至於，那件事情就算了。
		say 也沒有切確的證據可以證明你的關係。
		say 你走吧....
	        mpdel_qmark $n labyrinth_village_killgolin
	        mpdel_qmark $n labyrinth_village_killzombie
