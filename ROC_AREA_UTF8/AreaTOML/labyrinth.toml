if is_qmark($n) == labyrinth_village_zombie
        pond
        say 墓地啊....是有人在晚上看到不明人物出沒在墓園，不過到底
        say 是什麼，並沒有人真正知道。如果你想要去看看，還是帶點東
        say 西去防身吧。角落那兒有些東西，你自己找看看有沒有適合的
