if is_qmark($n) == labyrinth_village_zombie
        mpechoat $n -- 向他詢問關於墓地的傳聞(hearsay)？
endif
if is_qmark($n) == labyrinth_village_sleepless
        mpechoat $n -- 向他詢問葛林(Golin)怎麼了？
endif
if is_qmark($n) == labyrinth_village_cocotawork 100001
        mpechoat $n -- 如何叫醒摳摳塔(Cocota)？
endif
