        modrvt v0 | 1
        echoat $n 你按下門的開關，門又關起來了....
        echoaround $n $N按下門的開關，門又關起來了....
        deldoor 0
        at 38221 setdoor 2 flags 119
        modrvt v0 r 1
        modrvt v0 r 32
        modrvt v0 | 64
        break
endif
if roomvalue($0) !& 16
        echoat $n 什麼？
        break
else
        if roomvalue($0) & 64
                echoat $n 你按下門的開關，門又打開來了....
                echoaround $n $N按下門的開關，門又打開來了....
                makedoor 0 0 0 0 0 38221
                at 38221 setdoor 2 flags 113
                modrvt v0 r 32
        else
                modrvt v0 | 1
                stun $n 40
                echoat $n 你試著按了按開關，似乎不會動....只好....
                callout 2 echoat $n 你運起全身的怨氣朝著牆上的開關用力地揍下去....
                callout 2 echoaround $n $N對著牆壁用力地揍了一拳....發瘋了嗎？
                callout 3 echoat $n 砰～門開了！不過你卻順勢跌了出去....
                callout 3 echoaround $n 砰～門開了！不過$N卻順勢跌了出去....
                callout 3 makedoor 0 0 0 0 0 38221
                callout 3 at 38221 setdoor 2 flags 113
                callout 3 modrvt v0 r 1
                callout 3 modrvt v0 | 32
                callout 4 transfer $n 38221
                callout 5 at 38221 force $n look
        endif
endif
"""

