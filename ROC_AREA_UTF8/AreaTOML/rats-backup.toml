[mobiles.3813]
keywords = "slave human"
short_description = "女性人類奴隸(human slave)"
long_description = "一個女性人類奴隸(human slave)蜷縮在角落發抖.\n"
description = """
在這裡看到人類令你感到十分欣慰，但是見到她的狀況又讓你感到十分的氣憤。你見到
的這個人類是史卡拉貝城的居民！她請求你幫助她離開這裡！
"""
act_flags = ["NPC", "WIMPY"]
affected_flags = []
alignment = 100
level = 19
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "female"
[[mobiles.3813.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) != wererat_save
		mpechoat $n $I 說：我是在睡覺的時候被鼠人抓來這邊的。
		mpechoat $n $I 說：請幫助我脫離鼠人的統治，可以嗎？(yes/no)
		break
	endif
	if is_qmark($n) == wererat_save 100001
		mpmod_qmark $n wererat_save v0 = 2
		thank $n
		mpechoat $n $I 說：我感到鼠人巢穴內還是有邪惡的力量存在。
		mpechoat $n $I 說：不過還是謝謝你除去了鼠人巢穴的首領。
		mpechoat $n $I 說：這裡有件我個人的小禮物....。
		mpoload 3824 10
		give tin $n
		if class($n) < 5
			mpexp $n 600
		endif
		mpexp $n 1200
		wave
	endif
"""
[[mobiles.3813.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) != wererat_save 100002
		mpechoat $n $I 說：我不清楚鼠人們的組織如何？
		mpechoat $n $I 說：但我知道鼠人們有個首領領導他們準備向史卡拉貝城攻擊。
		mpechoat $n $I 說：請除掉鼠人首領，拯救我們這些可憐的奴隸。
		mpechoat $n $I 說：然後回來跟我說(talk)吧。
		mpadd_qmark $n wererat_save -1 0 0 0 0 1
	endif
"""
[[mobiles.3813.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == wererat_save 100002
		mpechoat $n 由遠方傳來一道聲響：你已經完成這個任務了。
	else
		mpechoat $n 由遠方傳來一道聲響：你這個任務已經可以重來了。
		mpdel_qmark $n wererat_save
	endif
"""

