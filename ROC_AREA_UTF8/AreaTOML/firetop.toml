[rooms.5835]
name = "傳送之間"
description = """
這是一間空曠的隔間，除了房間中央的石製平台(plane)外，就只有幾張椅子放著在周圍。
平台閃爍著黯淡的藍色光芒，使整個房間充滿神秘的氣氛。
"""
flags = ["DARK", "INDOORS", "NO_RECALL", "PK"]
sector = "INSIDE"
[rooms.5835.exits.east]
description = ""
keywords = ""
locks = ["ISDOOR", "CLOSED"]
key = 0
to_room = 5717
[[rooms.5835.programs]]
trigger = "room_command"
argument = "step p plane"
script = """
if is_qmark($n) == ianua_teleporter
	if is_inv_obj($n) == 13204
		purge $n vnum 13204
		echoat $n 你踏上了石製平台，傳送者之石化成粉末散落在平台上。
		at 35051 echo 平台發出刺眼的光芒。
		transfergroup $n 35051
		echo $N踏上了石製平台，平台發出強烈的光芒籠罩著$N的隊伍。
	else
		stun $n 20
		echoat $n 你踏上了石製平台。
		echoaround $n $N把石製平台當作舞台，在上面瘋狂的跳起舞來。
		callout 1 echoat $n 但什麼事也沒發生。
	endif
else
	stun $n 20
	echoat $n 你踏上了石製平台。
	echoaround $n $N把石製平台當作舞台，在上面瘋狂的跳起舞來。
	callout 1 echoat $n 但什麼事也沒發生。
endif
"""
[[rooms.5835.programs]]
trigger = "room_enter"
argument = "64 100"
script = """
stun $n 30
echoat $n 平台突然發出強烈的光芒籠罩著你。
callout 2 echoat $n 你覺得有些頭暈。
callout 2 force $n look
"""
