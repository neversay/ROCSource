[[rooms.5709.programs]]
trigger = "room_command"
argument = "throwup hook"
script = """
rcall firetop_throwup $n
"""
[[rooms.5709.programs]]
trigger = "room_command"
argument = "throwup rope"
script = """
rcall firetop_throwup $n
"""
[[rooms.5709.programs]]
trigger = "room_defun"
argument = "firetop_throwup"
script = """
if is_inv_obj($n) == 5704
        echoat $n 你將 繩鉤(rope hook) 拋向高處....
        echoaround $n $n 將 繩鉤(rope hook) 拋向高處....
        if int($n) >= 22
                callout 1 rcall firetop_throw_succed $n
        else
                if int($n) >= 18
                        if rand(75)
                                callout 1 rcall firetop_throw_succed $n
                        else
                                callout 1 echo 不過失敗了。
                        endif
                else
                        if int($n) >= 14
                                if rand(50)
                                        callout 1 rcall firetop_throw_succed $n
                                else
                                        callout 1 echo 不過失敗了。
                                endif
                        else
                                if rand(25)
                                        callout 1 rcall firetop_throw_succed $n
                                else
                                        callout 1 echo 不過失敗了。
                                endif
                        endif
                endif
        endif
else
        echoat $n 你身上沒有這項東西。
endif
"""
[[rooms.5709.programs]]
trigger = "room_defun"
argument = "firetop_throw_succed"
script = """
echoat $n 你成功地將 繩鉤(rope hook) 鉤住了高處的石頭。
echoaround $n $n 成功地將 繩鉤(rope hook) 鉤住了高處的石頭。
oload 5705 1 floor
at 5716 oload 5706 1 floor
purge $n hook2-firetop
"""
[[rooms.5709.programs]]
trigger = "room_command"
argument = "climb rope"
script = """
if robjcount(5705) > 0
        echoat $n 你藉著繩索爬了上去....
        echoaround $n $n 藉著繩索爬了上去....
        at 5716 echoaround $n $n 藉著繩索爬了上來....
        transfer $n 5716
else
        echoat $n 這裡沒有任何繩索可以提供你攀爬。
endif
"""
[[rooms.5709.programs]]
trigger = "room_command"
argument = "retrieve rope"
script = """
if robjcount(5705) > 0
        echoat $n 你將 繩鉤(rope hook) 給收了回來....
        echoaround $n $n 將 繩鉤(rope hook) 給收了回去....
        at 5716 echo 繩鉤(rope hook) 被收回去了....
        oload 5704 1 $n target
        purge hook3-firetop
        force 5716 purge hook4-firetop
else
        echoat $n 這裡沒有繩索能夠讓你收回。
endif
"""

