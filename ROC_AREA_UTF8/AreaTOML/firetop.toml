[mobiles.5700]
keywords = "adventurer busy"
short_description = "忙碌的冒險者(busy adventurer)"
long_description = "一位忙碌的冒險者(busy adventurer)在這個谷地中走來走去。\n"
description = """
他剛來到這邊不久，主要聽說這裡有些新玩意兒(event)，因此來這邊湊個熱鬧。
"""
act_flags = ["NPC", "STAY_AREA", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED"]
alignment = 0
level = 45
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "SWORD"]
spec_flags = ["NO_CHARM", "HALF_MAGIC", "EXPERT"]
[[mobiles.5700.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpoload 9909
mpoload 10644
mpoload 11148
mpoload 16023
mpat 5 wear all
"""
[[mobiles.5700.programs]]
trigger = "talk_prog"
argument = "event"
script = """
if is_qmark($i) == firetop_talking
        break
endif
mpadd_qmark self firetop_talking 5 0 0 0 1 0
gasp $n
say 你不知道最近光明之鎮的大事嗎....？
mpcallout 1 say 就是這附近發現了前往魔刀村的捷徑(shortcut)啊....，
mpcallout 2 say 聽說魔刀村附近有許多危險的挑戰....，
mpcallout 3 say 這正是我們冒險者一夕成名的機會啊！
mpcallout 3 mpdel_qmark self firetop_talking
"""
[[mobiles.5700.programs]]
trigger = "talk_prog"
argument = "shortcut"
script = """
if is_qmark($i) == firetop_talking
        break
endif
say 其實這一條捷徑我還沒去過....，
mpcallout 1 say 不過聽說曾經前往魔刀村回來的前輩說....，
mpcallout 2 say 途中雖然安全很多....，
mpcallout 3 say 但是卻需要動用到不少工具....，
mpcallout 4 say 諸如鉤子(hook)、繩索(rope)或圓鍬(shovel)....等一類的工具....，
mpcallout 5 say 聽說光明之鎮有賣一些....，
mpcallout 6 say 但是詳細的情形我就不太清楚了。
"""

[mobiles.5701]
keywords = "robust warrior"
short_description = "精壯的武士(robust warrior)"
long_description = "一位身材精壯的武士(robust warrior)在這裡四處遊蕩，尋找刺激。\n"
description = """
他的存在不為了什麼，僅是為了冒險與刺激(exciting)。如果你能夠提供他這些元素，那
麼他為你赴湯蹈火，在所不辭。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "WIMPY", "HARD_DIS", "HUNT", "TACTICS", "IGNORE_NO_MOB"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "INFRARED", "PROTECT"]
alignment = 0
level = 50
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
class = ["WARRIOR", "SWORD", "BLOODY"]
spec_flags = ["NO_CHARM", "HALF_MAGIC", "EXPERT"]
[[mobiles.5701.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpoload 5710
mpoload 5711
mpoload 5712
mpoload 14206
mpat 5 wear all
"""
[[mobiles.5701.programs]]
trigger = "entry_prog"
argument = "100"
script = """
if insameroom($b)
        if insameroom(elite-firetop)
                if is_qmark($b) !& firetop_robust_quest 200001
                        mpmod_qmark firetop_robust_quest v1 | 1
                        yell 好個食人妖菁英戰士，看我如何對付你！
                endif
        endif
        if insameroom(cyclops-firetop)
                if is_qmark($b) !& firetop_robust_quest 200004
                        mpmod_qmark firetop_robust_quest v1 | 4
                        yell 獨眼巨人！太棒了，讓我來會會你！
                endif
        endif
        if insameroom(chieftain-firetop)
                if is_qmark($b) !& firetop_robust_quest 200016
                        mpmod_qmark firetop_robust_quest v1 | 16
                        yell 食人妖隊長？！名過其實，看我如何對付你！
                endif
        endif
endif
"""
[[mobiles.5701.programs]]
trigger = "kill_prog"
argument = "100"
script = """
if vnum($n) == 5715
        if is_qmark($b) & firetop_robust_quest 200001
                if is_qmark($b) !& firetop_robust_quest 200002
                        yell 夠刺激！我可幹掉食人妖菁英戰士了！
                        mpmod_qmark $b firetop_robust_quest v1 | 2
                endif
        endif
endif
if vnum($n) == 5744
        if is_qmark($b) & firetop_robust_quest 200004
                if is_qmark($b) !& firetop_robust_quest 200008
                        yell 什麼獨眼巨人，在我看來根本不值一晒。
                        mpmod_qmark $b firetop_robust_quest v1 | 8
                endif
        endif
endif
if vnum($n) == 5739
        if is_qmark($b) & firetop_robust_quest 200016
                if is_qmark($b) !& firetop_robust_quest 200032
                        yell 砍死這個隊長比踩死一隻螞蟻還要簡單啊！
                        mpmod_qmark $b firetop_robust_quest v1 | 32
                endif
        endif
endif
"""
[[mobiles.5701.programs]]
trigger = "talk_prog"
argument = "exciting"
script = """
gig
say 如果你可以承諾(promise)讓我經歷真正具有冒險與刺激的旅程，
say 我就加入你的行列來體驗你所謂的冒險之旅，
say 同時讓我全心全意來幫助你。
"""
[[mobiles.5701.programs]]
trigger = "talk_prog"
argument = "promise"
script = """
if is_qmark($n) & firetop_quest 100001
or is_qmark($n) == firetop_robust_quest
or being($b)
        break
endif
say 很好，我給你 5 天的時間，
say 希望這 5 天內能夠讓我知道，
say 何謂刺激與冒險。
mpdef_rembch $n
mpgroup $n self 1 0
mpadd_qmark $n firetop_robust_quest -1 1 0 0 0 1
mpadd_qmark self firetop_robust_quest 120 0 0 0 1 0
"""
[[mobiles.5701.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if being($b)
        if is_qmark($i) == firetop_robust_quest
                if insameroom($b)
                        if is_equ_obj($i) != 5710
                                wear halberd
                        endif
                else
                        if is_qmark($i) > firetop_robust_quest 1005
                                mpmod_qmark self firetop_robust_quest timer - 5
                        endif
                endif
        else
                if is_qmark($b) > firetop_robust_quest 200000
                        say 在我們短短的五天之中，
                        if is_qmark($b) & firetop_robust_quest 200001
                                if is_qmark($b) & firetop_robust_quest 200002
                                        say 你帶領我擊敗了「食人妖菁英戰士」，
                                        mpskillexp $b 300
                                        mpexp $b 1000
                                else
                                        say 你帶領我遇到了「食人妖菁英戰士」，
                                        mpskillexp $b 100
                                        mpexp $b 300
                                endif
                        endif
                        if is_qmark($b) & firetop_robust_quest 200004
                                if is_qmark($b) & firetop_robust_quest 200008
                                        say 你帶領我擊敗了「鐵獨眼巨人」，
                                        mpskillexp $b 400
                                        mpexp $b 1200
                                else
                                        say 你帶領我遇到了「鐵獨眼巨人」，
                                        mpskillexp $b 100
                                        mpexp $b 300
                                endif
                        endif
                        if is_qmark($b) & firetop_robust_quest 200016
                                if is_qmark($b) & firetop_robust_quest 200032
                                        say 你帶領我擊敗了「食人妖酋長」，
                                        mpskillexp $b 600
                                        mpexp $b 2000
                                else
                                        say 你帶領我遇到了「食人妖酋長」，
                                        mpskillexp $b 100
                                        mpexp $b 300
                                endif
                        endif
                else
                        shake $b
                        tell $b 你這樣不行喔！
                        tell $b 到了現在我還是沒有刺激的感覺。
                        tell $b 我想我們下次再合作吧。
                        mpecho $I 離開了你的視線....
                        mppurge self
                endif
        endif
else
        if is_qmark($i) == firetop_robust_quest
                sigh
                say 又一位沒有完成任務就放棄的傢伙。
                mpecho $I 離開了你的視線....
                mppurge self
        else
                if rand(50)
                        if rand(50)
                                say 我希望能夠有真正刺激(exciting)的冒險之旅啊！
                        else
                                say 什麼時候才能有人滿足我的需求呢？
                        endif
                endif
        endif
endif
"""
[[mobiles.5701.programs]]
trigger = "fight_prog"
argument = "100"
script = """
skilldrv speedhit $n
skilldrv speedhit $n
skilldrv speedhit $n
if rand(50)
        if is_equ_obj($i) != 5710
                wear halberd
        endif
        if rand(50)
                disarm
                mpnowait
        endif
endif
if rand(50)
        bashhead
        mpnowait
        bashhead
        mpnowait
        bashhead
        mpnowait
else
        kick
        mpnowait
        kick
        mpnowait
        kick
        mpnowait
endif
"""
[[mobiles.5701.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) & firetop_quest 100001
or being($b)
        break
endif
mpechoat $n 遠方傳來一陣聲響「本項任務你已經可以重新開始了。」
mpdel_qmark $n firetop_robust_quest
"""

