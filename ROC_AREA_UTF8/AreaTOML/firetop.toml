[[rooms.5772.programs]]
trigger = "room_command"
argument = "move rock"
script = """
if robjcount(5720) > 0
        if roomvalue($1) & 1024
                echoat $n 目前你無法作這個動作。
                break
        endif
        modrvt v1 | 1024
        echoat $n 你嘗試移動這塊大岩石....
        echoaround $n $n 嘗試移動這塊大岩石....
        if str($n) >= 25
                callout 1 echoat $n 你移開了這塊大岩石....
                callout 1 echoaround $n 移開了這塊大岩石....
               callout 1 purge rock1-firetop
                callout 1 oload 5721 1 floor
                callout 1 makedoor 1 通往洞穴(exit) exit 0 0 5775
                callout 1 force 5775 makedoor 3 通往外面(exit) exit 0 0 5772
                callout 1 modrvt v0 = 1
                callout 1 modrvt t0 = 36
        else
                callout 1 echoat $n 但是你完全推不動。
                callout 1 echoaround $n 但是 $n 完全無法推動。
        endif
        callout 2 modrvt v1 r 1024
endif
if robjcount(5721) > 0
        if roomvalue($1) & 1024
                echoat $n 目前你無法作這個動作。
                break
        endif
        modrvt v1 | 1024
        echoat $n 你嘗試移動這塊大岩石....
        echoaround $n $n 嘗試移動這塊大岩石....
        if str($n) >= 25
                callout 1 echoat $n 你移回了這塊大岩石....
                callout 1 echoaround $n 移回了這塊大岩石....
                callout 1 purge rock2-firetop
                callout 1 oload 5720 1 floor
                callout 1 deldoor 1
                callout 1 force 5775 deldoor 3
                callout 1 modrvt v0 = 0
                callout 1 modrvt t0 = 0
        else
                callout 1 echoat $n 但是你完全推不動。
                callout 1 echoaround $n 但是 $n 完全無法推動。
        endif
        callout 2 modrvt v1 r 1024
endif
if robjcount(5722) > 0
        echoat $n 你移動一堆碎石作什麼？
endif
"""
[[rooms.5772.programs]]
trigger = "room_command"
argument = "insert tnt"
script = """
if is_inv_obj($n) == 5719
        if robjcount(5720) > 0
        or robjcount(5721) > 0
                if roomvalue($1) & 1024
                        echoat $n 目前你無法做這個動作。
                        break
                endif
                modrvt v1 | 1024
                if is_qmark($n) !& firetop_quest 100004
                        mpmod_qmark $n firetop_quest v0 | 4
                        mpskillexp $n 100
                        mpexp $n 1500
                endif
                echoat $n 你將炸藥放入岩石之中....
                echoaround $n $n 將炸藥放入岩石之中....
                callout 1 echo 轟然一聲巨響！炸藥爆炸了！
                callout 2 echo 擋住通道的石頭被炸成碎片！
                callout 2 purge rock1-firetop
                callout 2 purge rock2-firetop
                callout 2 oload 5722 1 floor
                callout 2 makedoor 1 通往洞穴(exit) exit 0 0 5775
                callout 2 force 5775 makedoor 3 通往外面(exit) exit 0 0 5772
                callout 2 modrvt v0 = 2
