argument = "fame"
script = """
if being($b)
else
        say 其實我一直想要在光明之鎮冒險者間出人頭地....，
        mpcallout 1 say 我這一位同伴也是....，
        mpcallout 1 point cleric-firetop
        mpcallout 2 say 但是我們之間雖有尚稱強大的戰鬥力....，
        mpcallout 3 say 我與我的同伴每 5 天僅要 100 萬元....，
        mpcallout 4 say 就能夠幫助你的旅程更加順遂....，
        mpcallout 5 say 同時也將幫助你擊敗任何在你旅途中擋路的敵手。
endif
"""
[[mobiles.5702.programs]]
trigger = "talk_prog"
argument = "behemoth"
script = """
if being($b)
else
        say 遠古巨獸是遠古森林三大魔物之一，
        say 沒有任何施展魔法或特殊技能的能力，
        say 但是光是他那連續攻擊的能力與強大的傷害力，
        say 死在牠手下的冒險者不計其數。
endif
"""
[[mobiles.5702.programs]]
trigger = "talk_prog"
argument = "grinffin"
script = """
if being($b)
else
        say 獅鷲獸是一種鳥頭獅身的怪物，
        say 尾巴能夠射出劇毒的毒針，
        say 同時兼具飛翔的能力，經常集體出動，
        say 其危險性不愧為遠古森林三大魔物之列。
endif
"""
[[mobiles.5702.programs]]
trigger = "bribe_prog"
argument = "1000000"
script = """
mpjunk all.coins
if being($b)
        if rembch($n)
                say 好的，我們延長契約的時間 5 天。
                mpmod_qmark self firetop_warrior_group timer + 60
        else
                say 抱歉，我被 $b 雇用了。
                mpgold $n 1000000
        endif
else
        say 好，那麼我們成交，我將幫助你 5 天的時間。
        mpdef_rembch $n
        mptransfer cleric-firetop
        mpgroup $n self 1 0
        mpgroup $n cleric-firetop 1 0
        mpadd_qmark self firetop_warrior_group 60 0 0 0 1 1
endif
"""
[[mobiles.5702.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if being($b)
	if is_qmark($i) == firetop_warrior_group
		if insameroom($b)
			if is_equ_obj($i) != 5707
				wear axe
			endif
			if is_equ_obj($i) != 20125
				wear shield
			endif
		else
			if is_qmark($i) > firetop_warrior_group 1005
				mpmod_qmark self firetop_warrior_group timer - 5
			endif
		endif
	else
		tell $b 抱歉，您的契約已經到期了。
		tell $b 希望未來我們還有機會合作。
		wave $b
		mpecho $I 與 地精牧師(gnome cleric) 離開了這個地方....
		if being(cleric-firetop)
				mpat cleric-firetop mppurge cleric-firetop
		endif
		mppurge self
	endif
else
	if is_qmark($i) == firetop_warrior_group
		say 契約還沒完成就離線？
		shrug
		mpecho $I 與 地精牧師(gnome cleric) 離開了這個地方....
		if being(cleric-firetop)
				mpat cleric-firetop mppurge cleric-firetop
		endif
		mppurge self
	endif
endif
"""
[[mobiles.5702.programs]]
trigger = "fight_prog"
argument = "100"
script = """
if rand(20)
        berserk
endif
if rand(50)
        if is_equ_obj($i) != 5707
                wear axe
        endif
        if is_equ_obj($i) != 20125
                wear shield
        endif
        if rand(50)
                disarm
                mpnowait
        endif
endif
if rand(50)
        if rand(33)
                circular
                mpnowait
        else
                if rand(50)
                        flaming
                        mpnowait
                else
                        earth
                        mpnowait
                endif
        endif
endif
if rand(50)
        if rand(50)
                bashhead
                mpnowait
        else
                kick
                mpnowait
        endif
endif
"""
[[mobiles.5702.programs]]
trigger = "death_prog"
argument = "100"
script = """
if insameroom(cleric-firetop)
        yell 伙伴，替我報仇！
        mpforce cleric-firetop say 沒問題，你安心的去吧！
        mpforce cleric-firetop c 3 harm
        mpforce cleric-firetop c 'gfull heal'
endif
"""

