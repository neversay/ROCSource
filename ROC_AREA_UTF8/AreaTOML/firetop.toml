[[mobiles.5720.programs]]
trigger = "talk_prog"
argument = "assistant"
script = """
say 我們冒險者隨機提供冒險者一些服務，
say 我們冒險者公會能夠提供的服務有以下幾種：
say 1. 我們提供獎金獵人(hunter)的服務，提供懸賞請冒險者帶回我們需要的東西。
say 2. 我們提供冒險者任務(assignment)，這些任務不一定需要殺戮。
say 3. 我們提供冒險者進入遠古森林一些額外服務(service)，當然你的名聲夠的話。
say 想要中途終止(cancel)任務的話，請直接跟我說，但是押金可拿不回去。
"""
[[mobiles.5720.programs]]
trigger = "talk_prog"
argument = "cancel"
script = """
if is_qmark($n) == firetop_hunter_quest
or is_qmark($n) == firetop_assignment_quest
or is_qmark($n) == firetop_service_quest
        if is_qmark($n) & firetop_hunter_quest 100001
                nod $n
                say $n 終止了「千年蜘蛛膽」的任務。
                say $n 同時我們也沒收您置於本會的押金。
                mpat firetop-hunter-quest1 mppurge firetop-hunter-quest1
                mpdel_qmark $n firetop_hunter_quest
        endif
        if is_qmark($n) & firetop_hunter_quest 100002
                nod $n
                say $n 終止了「獅鷲獸膽」的任務。
                say $n 同時我們也沒收您置於本會的押金。
                mpat firetop-hunter-quest2 mppurge firetop-hunter-quest2
                mpdel_qmark $n firetop_hunter_quest
        endif
        if is_qmark($n) & firetop_hunter_quest 100004
                nod $n
                say $n 終止了「遠古巨獸肝」的任務。
                say $n 同時我們也沒收您置於本會的押金。
                mpat firetop-hunter-quest3 mppurge firetop-hunter-quest3
                mpdel_qmark $n firetop_hunter_quest
        endif
        if is_qmark($n) & firetop_hunter_quest 100008
                nod $n
                say $n 終止了「鐵獨眼巨人之眼」的任務。
                say $n 同時我們也沒收您置於本會的押金。
                mpat firetop-hunter-quest4 mppurge firetop-hunter-quest4
                mpdel_qmark $n firetop_hunter_quest
        endif
else
        say 你並沒有接下任何遠古森林冒險者公會的任務。
endif
"""
