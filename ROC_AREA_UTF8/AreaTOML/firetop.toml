[[mobiles.5764.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if being($b)
else
        if ispc($n)
                if is_qmark($i) != firetop_talking
                        mpadd_qmark self firetop_talking 1 0 0 0 1 0
                        hello $n
                        say 想要玩一場「十點半」嗎(gambling)？
                endif
        endif
endif
"""
[[mobiles.5764.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if being($b)
else
        hello $n
        say 想要玩一場「十點半」嗎(gambling)？
        say 規則(rule)既簡單又好玩喔。
endif
"""
[[mobiles.5764.programs]]
trigger = "talk_prog"
argument = "rule"
script = """
if being($b)
        say 抱歉，現在 $b 正在玩呢！
        if insameroom($b)
        else
                say 但是他不知道跑到那邊去了？
                say 再等一下就好了。
        endif
else
        say 十點半的規則嗎？
        say 牌 A - 9 分別代表 1 - 9 點，牌 J Q K 都是半點，
        say 將你的牌所有的點數加起來若比我大你就贏了，
        say 如果你的牌剛好是 10 點半，
        say 或是總共 5 張牌還沒有超過 10 點半就可以得到雙倍報酬，
        say 但是如果你的點數跟我一樣，或是點數超過了 10 點半，
        say 那麼你就輸了這一場比賽。
endif
"""
[[mobiles.5764.programs]]
trigger = "talk_prog"
argument = "gambling"
script = """
if being($b)
        say 抱歉，現在 $b 正在玩呢！
        if insameroom($b)
        else
                say 但是他不知道跑到那邊去了？
                say 再等一下就好了。
        endif
else
        nod $n
        say 好，那麼我們就開始吧。
        say 籌碼有 20 萬、 50 萬與 100 萬三種。
        mpdef_rembch $n
        mpadd_qmark self firetop_dwarf_gambling 10 0 0 0 1 0
        if is_qmark($n) == firetop_dwarf_gambling
                mpmod_qmark $n firetop_dwarf_gambling timer = 10
        else
                mpadd_qmark $n firetop_dwarf_gambling 10 0 0 0 1 0
        endif
endif
"""
[[mobiles.5764.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if being($b)
        if is_qmark($i) == firetop_dwarf_gambling
                if insameroom($b)
                else
                        tell $b 不想玩就快回來中斷遊戲吧(talk dwarf cancel)！
                        tell $b 我要將機會讓給其他人了。
                endif
        else
                sorry $b
                say 抱歉，您的時間到了卻尚未完成本遊戲。
                say 只好將機會換給其他人了。
                mpat $b mpdel_qmark $b firetop_dwarf_gambling
                mpdef_rembch null-tar
        endif
else
        if is_qmark($i) == firetop_dwarf_gambling
                curse
                say 又是一個沒有完成遊戲就離線的玩家。
                mpdel_qmark self firetop_dwarf_gambling
        else
                if inroom($i) != 4670
                        ponder
                        say 這裡不是我該來的地方。
                        mpgoto 4670
                endif
        endif
endif
"""
[[mobiles.5764.programs]]
trigger = "talk_prog"
argument = "cancel"
script = """
if rembch($n)
        if is_qmark($i) == firetop_dwarf_gambling
                nod $n
                say 那麼 $n 已經中斷了遊戲，
                say 將機會讓給其他人了。
                mpdel_qmark self firetop_dwarf_gambling
                mpdef_rembch null-tar
        endif
endif
"""
[[mobiles.5764.programs]]
trigger = "bribe_prog"
argument = "1000000"
script = """
if rembch($n)
        if is_qmark($i) == firetop_dwarf_gambling
                mpjunk all.coins
                nod $n
                say 我收到你的 100 萬元了。
                mpmod_qmark self firetop_dwarf_gambling v2 | 4
                mpecho $I 發了一張牌給自己....
                mpcall firetop_dwarf_gambling01 $b
                say $b 你還需要更多的牌嗎(yes/no)？
        else
                ? $n
                mpgold $n 1000000
        endif
else
        ? $n
        mpgold $n 1000000
endif
"""
[[mobiles.5764.programs]]
trigger = "bribe_prog"
argument = "500000"
script = """
if rembch($n)
        if is_qmark($i) == firetop_dwarf_gambling
                mpjunk all.coins
                nod $n
                say 我收到你的 50 萬元了。
                mpmod_qmark self firetop_dwarf_gambling v2 | 2
                mpecho $I 發了一張牌給自己....
                mpcall firetop_dwarf_gambling01 $b
                say $b 你還需要更多的牌嗎(yes/no)？
        else
                ? $n
                mpgold $n 500000
        endif
else
        ? $n
        mpgold $n 500000
endif
"""
[[mobiles.5764.programs]]
trigger = "bribe_prog"
argument = "200000"
script = """
if rembch($n)
        if is_qmark($i) == firetop_dwarf_gambling
                mpjunk all.coins
                nod $n
                say 我收到你的 20 萬元了。
                mpmod_qmark self firetop_dwarf_gambling v2 | 1
                mpcall firetop_dwarf_gambling01 $b
                mpecho $I 發了一張牌給自己....
                say $b 你還需要更多的牌嗎(yes/no)？
        else
                ? $n
                mpgold $n 200000
        endif
else
        ? $n
        mpgold $n 200000
endif
"""
[[mobiles.5764.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if rembch($n)
        if is_qmark($b) >= firetop_dwarf_gambling 200001
                mpcall firetop_dwarf_gambling01 $b
                if is_qmark($b) > firetop_dwarf_gambling 100021
                        say 哇！你的點數因為超過而爆掉了！
                        mpcall firetop_dwarf_gambling_over $b
                else
                        if is_qmark($b) == firetop_dwarf_gambling 100021
                                if is_qmark($b) >= firetop_dwarf_gambling 200005
                                        say 哇！你的點數剛好「十點半」，又「過五關」，必須給你四倍的獎金。
                                        if is_qmark($i) & firetop_dwarf_gambling 300001
                                                mpgold $b 1000000
                                        endif
                                        if is_qmark($i) & firetop_dwarf_gambling 300002
                                                mpgold $b 2500000
                                        endif
                                        if is_qmark($i) & firetop_dwarf_gambling 300004
                                                mpgold $b 4800000
                                        endif
                                else
                                        say 哇！你的點數剛好「十點半」，必須加倍給你獎金。
                                        if is_qmark($i) & firetop_dwarf_gambling 300001
                                                mpgold $b 600000
                                        endif
                                        if is_qmark($i) & firetop_dwarf_gambling 300002
                                                mpgold $b 1500000
                                        endif
                                        if is_qmark($i) & firetop_dwarf_gambling 300004
                                                mpgold $b 3000000
                                        endif
                                endif
                                mpcall firetop_dwarf_gambling_over $b
