喔，天啊！當你越前進，你就越能感受由頭到腳到不安。四周牆上留有巨大的爪痕。
當你到達了洞穴的底部，你才驚覺你竟然身處一處龍穴之中。南邊的牆上有一扇鎖住的鐵
門能夠提供此洞穴主人迅速地逃離此處。
"""
