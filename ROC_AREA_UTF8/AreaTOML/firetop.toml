[rooms.5700]
name = "崎嶇的峽谷地形"
description = """
你往下走了幾步，發覺峽谷的海平面遠比迷霧平原低得許多。由於四面環山，使得這個峽
谷地形不被四周海洋所灌入成為沼澤或內陸湖。峽谷中的霧比起迷霧平原來得更大，你有霧氣
中嗅出一股腐敗的味道。往上走可以回到遠古森林，你也可以繼續往下進入這個峽谷之中。你
看見在枯萎的樹附近釘著一塊小招牌(sign)。
"""
flags = ["NO_MOB"]
sector = "MOUNTAIN"
[[rooms.5700.extra_descriptions]]
keywords = "sign"
description = """
招牌上面寫著 -

「歡迎來到烽火峽谷，一座由『Mad Elf』撰寫有趣且充滿著刺激的地方將呈獻給你。」

接著寫著 -

「烽火峽谷在 1995 年 11 月由 Yaegar 為 Anony 這個 Mud 使用 Dos 編輯器撰寫出來
，任何 Merc 2.2 版的 Mud 都可以（而且歡迎）載入。」

後面又跟著寫著 -
「這個區域於 2004 年 2 月由 Pluto 翻譯、改編並依據需求增加部分景點，作為混沌幻
世（Realm Of Chaos）這個 Mud 的新增區域，主要劇情為食人妖(Troll)與食人魔(Ogre)
之間的一些問題。」

「原區域要作為 ROC 之用，其劇情與內容仍不足，因此由 Pluto 自創約 50％ Mob/Obj/
room 等串連整個區域，並增加 Quest 提升本區域深度，方可成為 ROC 的區域。」

