[mobiles.18003]
keywords = "Mayor-homeport Achilo-homeport"
short_description = "市長安齊羅(Mayor Achilo)"
long_description = "望鄉港的市長(Mayor)在這裡看著你。\n"
description = """
一個有著強大意志的人，他以堅強的意志率領著民團，打敗了入侵的海盜，
因而當上了望鄉港的市長。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "CRITICAL", "HARD_DIS", "HUNT", "TACTICS"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY"]
alignment = 900
level = 50
mod_hitplus = 10000
mod_mana = 500
mod_hitroll = 40
mod_damroll = 0
mod_ac = 0
mod_svs = -15
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Human"
class = ["WARRIOR", "SWORD"]
spec_flags = ["NO_BLIND", "NO_CHARM"]
[[mobiles.18003.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
mpoload 18000
mpoload 18005
mpoload 18006
mpoload 18007
mpoload 18004
mpat 5 wear all
"""
[[mobiles.18003.programs]]
trigger = "tick_prog"
argument = "100"
script = """
if is_qmark($i) != talking
	if hour($) < 7
	or hour($) > 16
		if inroom($i) == 18047
			mpoload 18029 1
			unlock e
			open e
			e
			close w
			lock w
			mpcallout 2 mpjunk key
		endif
	else
		if inroom($i) == 18048
			mpoload 18029 1
			unlock w
			open w
			w
			close e
			lock e
			mpcallout 2 mpjunk key
		endif
	endif
endif
"""
[[mobiles.18003.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == talking
	mpechoat $n $I 正在忙。
	break
endif
mpadd_qmark self talking
mpcallout 5 mpdel_qmark self talking
say 歡迎你來到望鄉港，親愛的旅者。
say 這裡已經有一段時間沒有來自遠方的冒險者經過。
say 又或許大家已經慢慢遺忘了這裡。
ponder
mpcallout 1 say 望鄉港其實是個充滿歷史的港口。
"""
[[mobiles.18003.programs]]
trigger = "talk_prog"
argument = "history 歷史"
script = """
if is_qmark($n) == homeport_hero_quest
	break
endif
if is_qmark($i) == talking
	tell $n 歷史？我要好好想想...已經好久沒人問過我了
	tell $n 你晚一點再來問我吧。
else
	mpadd_qmark $n homeport_hero_quest -1 0 0 0 0 1
	mpadd_qmark self talking
	mpcallout 4 mpdel_qmark self talking
	tell $n 望鄉港，可以說是一個和平的地方。充滿了平和，安閒。
	mpcallout 1 tell $n 沒有戰爭，沒有鬥爭，沒有外來的侵略。
	mpcallout 2 tell $n 有的只是單純的居民，單純的貿易，簡簡單單的生活罷了。
	mpcallout 3 tell $n 這一切，都是因為先人的努力，才有現在的成就。
	mpcallout 4 mpechoat $n $I 陷入了沉思當中...(continue)。
endif
"""
[[mobiles.18003.programs]]
trigger = "talk_prog"
argument = "continue"
script = """
if is_qmark($n) == homeport_quest 100000
	if is_qmark($i) == talking
		mpechoat $n $I 似乎還陷入在深深的沉思當中，晚點再來請教他好了...
	else
		mpmod_qmark $n homeport_hero_quest v0 = 1
		mpadd_qmark self talking
		mpcallout 9 mpdel_qmark self talking
		sorry $n
		mpcallout 1 tell $n 真是抱歉，親愛的旅者。
		mpcallout 2 tell $n 每次當我回想起那遙遠的年代，我就不自覺的陷入這種情緒當中。
		mpcallout 3 mpechoat $n $I 似乎很努力的回想過去...
		mpcallout 4 tell $n 在很久以前，遠方的史卡拉貝處在動亂不安的氛圍之下，緊繃的環境，大戰一觸即發。
		mpcallout 5 tell $n 當下的環境中，有一群想追求平靜生活的人們，在一位英雄的帶領下，冒險來到這裡。
		mpcallout 6 tell $n 經過一番努力，最終在古望鄉港遺跡(old homeport)附近建立起集落，安穩的居住下來。
		mpcallout 7 tell $n 在平靜的環境中生活久了，人們也都過慣和平生活，而不想冒險外出面對未知的危險。
		mpcallout 8 tell $n 人口進多出少的情況下，最終使望鄉港從集落搖身變成大城市。
		mpcallout 9 tell $n 如果沒有當初那位英雄，或許就沒有現今的望鄉港。
	endif
endif
"""
[[mobiles.18003.programs]]
trigger = "talk_prog"
argument = "p old homeport"
script = """
if is_qmark($i) == talking
	mpechoat $n $I 似乎還陷入在深深的沉思當中，晚點在來請教他好了....
else
	mpadd_qmark self talking
	mpcallout 4 mpdel_qmark self talking
	mpcallout 1 tell $n 古望鄉港，只有在史書上面有記載著。
	mpcallout 2 tell $n 根據記載，古望鄉港曾經是大陸上繁盛的港口之一。
	mpcallout 3 tell $n 可惜的是，在幾百年前的記載忽然中斷，也再也沒有當初那段歷史的下文。
	mpcallout 4 tell $n 直到後來，我們在英雄的帶領之下，找到了這裡。
endif
"""
[[mobiles.18003.programs]]
trigger = "talk_prog"
argument = "hero 英雄"
script = """
if is_qmark($n) == homeport_quest 100001
	if is_qmark($i) == talking
		mpechoat $n $I 似乎一時之間想不到關於你所問英雄的事蹟，晚點在來吧...
	else
		mpmod_qmark $n homeport_hero_quest v0 = 2
		mpadd_qmark self talking
		mpcallout 6 mpdel_qmark self talking
		ponder $n
		mpcallout 2 tell $n 根據我的記憶，那位英雄似乎叫做亞克(Yeark)。
		mpcallout 3 tell $n 據聞，那英雄在望鄉港的情勢穩定之後，就悄悄的離去...
		mpcallout 4 tell $n 沒有人知道他確切的去處。
		mpcallout 5 tell $n 真要說，或許當初在村內和英雄比較熟的人會有比較清楚的消息..
		mpcallout 6 mpechoat $n $I說完似乎又陷入了沉思當中。
	endif
endif
"""
[[mobiles.18003.programs]]
trigger = "fight_prog"
argument = "50"
script = """
wear all
if rand(50)
	frenzy
	mpnowait
endif
bashhead
mpnowait
bashhead
mpnowait
bashhead
mpnowait
"""
[[mobiles.18003.programs]]
trigger = "fight_prog"
argument = "80"
script = """
wear all
skilldrv multihit $n
skilldrv multihit $n
snare $n
mpnowait
skilldrv multihit $n
"""
[[mobiles.18003.programs]]
trigger = "hitprcnt_prog"
argument = "20"
script = """
mpecho $I看著似乎無法抵抗，趁著一溜煙的時候躲進了休息室。
mpgoto 18048
untangle self
mpnowait
c vivi 
mpnowait
c 'full hea'
mpnowait
"""
[[mobiles.18003.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) != homeport_enemy
	mpadd_qmark $n homeport_enemy 100 0 0 0 1 1
else
	mpmod_qmark $n homeport_enemy timer + 100
endif
"""

