				oforcer here mod_qmark $n homeport_coconet_quest v0 | 256
			else
				oforcer here mod_qmark $n homeport_coconet_quest v0 | 128
			endif
		endif
		if dex($n) < 20
			oforcer here callout 6 echoat $n 雖然椰子終究被你接住，但你也因此而受傷了。
			oforcer here callout 6 echoaround $n $N打算示範「如何用頭接住樹上掉落的椰子」，但顯然表演失敗了，他被砸得眼冒金星。
			oforcer here callout 6 modhmv $n 03.30 30 0
		else
			oforcer here callout 6 echoat $n 你敏捷的接住了掉落的椰子，絲毫未損。
			oforcer here callout 6 echoaround $n $N靈巧地接住樹上掉落的椰子。
		endif
		oset self v1 - 1
		oforcer here oload 18038 1 $n target
		oforcer here callout 6 force $n stop_pushing $o
	endif
else
	oforcer here stun $n 40
	oforcer here callout 3 echoat $n 無奈的是，椰子根本連動都不動。
	oforcer here callout 3 force $n stop_pushing $o
endif
"""

