	mpadd_qmark self talking -1 0 0 0 0 1
	mpcallout 9 mpdel_qmark self talking
	good $n
	mpcallout 1 tell $n 既然你接受了，我想，你就是對自己很有信心。
	mpcallout 2 tell $n 想想，一個英雄需要具備些什麼？
	mpcallout 3 tell $n 不外乎就是知識，技巧，勇氣，以及一些精神吧。
	mpcallout 4 tell $n 還依稀記得十年前我和亞克在外面闖蕩的時候，
	mpcallout 5 tell $n 曾經遇到三個讓我們很棘手的事件。
	mpcallout 6 tell $n 算一算，十年的週期也該到了，那三個事件(things)也該再度被觸發了。
	mpcallout 7 tell $n 或許你可以試著去解決那些事件，當你自認已經完成時，請回來告訴我(finish)。
	mpcallout 8 tell $n 記住，一個英雄需要具備的是冒險的勇氣和正義。祝福你！
endif
"""
[[mobiles.18027.programs]]
trigger = "defun_prog"
argument = "homeport_list"
script = """
if is_qmark($n) != homeport_hero_things 100007
	tell $n 麻煩你幫我代為尋找下列物品：
	if is_qmark($n) !& homeport_hero_things 100001
		mpechoat $n -- ‧天之芽(The bud of the sky)。
	endif
	if is_qmark($n) !& homeport_hero_things 100002
		mpechoat $n -- ‧湖之草(The grass of the lake)。
	endif
	if is_qmark($n) !& homeport_hero_things 100004
		mpechoat $n -- ‧神之心(The heart of the God)。
	endif
	tell $n 當然我也不能保證這些東西是否還存在這世上，所以如果你自認已經盡力了。
	tell $n 跟我說一聲(finish)就好，我也不會太勉強你一定要找到的。
else
	mpcall finish_list $n
	break
endif
mpdel_qmark self talking
"""
[[mobiles.18027.programs]]
trigger = "defun_prog"
argument = "finish_list"
script = """
if is_qmark($n) > homeport_hero_things 100000
	if is_qmark($n) & homeport_hero_things 100001
		mpmod_qmark $n homeport_hero_quest v1 | 1
	endif
	if is_qmark($n) & homeport_hero_things 100002
		mpmod_qmark $n homeport_hero_quest v1 | 2
	endif
	if is_qmark($n) & homeport_hero_things 100004
		mpmod_qmark $n homeport_hero_quest v1 | 4
	endif
	mpmod_qmark $n homeport_hero_quest v0 = 7
else
	tell $n 看來你的能力還是不足。
	mpmod_qmark $n homeport_hero_quest v0 = 99
endif
mpdel_qmark $n homeport_hero_trial
mpdel_qmark $n homeport_hero_things
mpdel_qmark self talking
"""
[[mobiles.18027.programs]]
trigger = "talk_prog"
argument = "things"
script = """
if is_qmark($i) == talking
	mpechoat $n 看來$I正在和誰在打情罵俏中。
	break
endif
if is_qmark($n) == homeport_hero_quest 100006
	mpadd_qmark self talking
	mpcall homeport_list $n
endif
"""
[[mobiles.18027.programs]]
trigger = "talk_prog"
argument = "finish"
script = """
if is_qmark($i) == talking
	mpechoat $n 看來$I正在和誰在打情罵俏中。
	break
endif
if is_qmark($n) == homeport_hero_quest 100006
	mpadd_qmark self talking
	mpcall finish_list $n
endif
"""
[[mobiles.18027.programs]]
trigger = "talk_prog"
argument = "p the bud of the sky"
script = """
if is_qmark($n) == homeport_hero_quest 100006
	if is_qmark($n) !& homeport_hero_things 100001
		tell $n 天之芽，顧名思義就是在神木頂端所生長出來的嫩芽。
		tell $n 雖然聽起來很好找，可是一方面神木的存在已經很少了。
		tell $n 另外一方面則是嫩芽會吸引其他怪物的注意，因此我也
		tell $n 不能保證是否還存在著這種嫩芽。或許你該去神木附近
		tell $n 的村莊問問看會更清楚。
	else
		tell $n 你已經完成這項試驗了。
	endif
endif
"""
[[mobiles.18027.programs]]
trigger = "talk_prog"
argument = "p the grass of the lake"
script = """
if is_qmark($n) == homeport_hero_quest 100006
	if is_qmark($n) !& homeport_hero_things 100002
		tell $n 湖之草，顧名思義就是在大陸中湖泊深處所生長的水草。
		tell $n 由於湖泊深處通常都會有怪物的生存，我想湖之草也不一
		tell $n 定會安然存在。或許能問問湖泊附近的人會比較清楚。
	else
		tell $n 你已經完成這項試驗了。
	endif
endif
"""
[[mobiles.18027.programs]]
