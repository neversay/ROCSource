description = """
一棵十分高大的椰子樹，看著那整串已經成熟的椰子，若能夠喝到那新鮮的
椰汁的話不知有多好。也許你可以試著推推看(push)，也許椰子會掉下來也
說不定哦，但可要小心別被掉落的椰子給擊中，那可就不好玩了。
"""
[[objects.18039.programs]]
trigger = "obj_tick"
argument = "100"
script = """
if objval1($o) >= 3
	break
endif
oset self v0 - 1
if objval0($o) <= 0
	oset self v1 + 1
	oset self v0 = 100
endif
"""
[[objects.18039.programs]]
trigger = "obj_command"
argument = "stop_pushing default"
script = """
if is_qmark($n) == homeport_push_stun
	oset self v2 = 0
	oforcer here del_qmark $n homeport_push_stun
	del_affect $n excited
endif
"""
[[objects.18039.programs]]
trigger = "obj_command"
argument = "push default"
script = """
if objval2($o) >= 1
	oforcer here echoat $n 似乎有人已經在努力的推動椰子樹了，或許你該稍等一下。
	break
endif
if mvnum($n) < 300
	oforcer here echoat $n 你已經沒有體力去推動椰子樹了。
	break
endif
add_affect $n excited 1130 2 3 -5 64
oset self v2 = 1
oforcer here add_qmark $n homeport_push_stun 2 0 0 0 0 1
oforcer here modhmv $n 21.300 300 0
oforcer here echoat $n 你使盡了吃奶的力氣，努力的推晃著眼前的椰子樹。
oforcer here echoaround $n 你看到 $N 在貼近椰子樹後，便開始使勁的推晃著椰子樹。
oforcer here callout 1 echoat $n 你用力的搖晃著椰子樹。
if objval1($o) <= 0
	oforcer here stun $n 40
	oforcer here callout 3 echoat $n 滿身是汗的你仰頭望了一下，才發現樹上早已沒半顆椰子了。
	oforcer here callout 3 echoaround $n 在 $N 使勁的推晃了一陣子之後，你卻發現樹上早就沒半顆椰子了。
	oforcer here callout 3 force $n stop_pushing $o
	break
endif
if is_qmark($n) & homeport_coconet_quest 100001
	if rand(70)
		oforcer here stun $n 40
		oforcer here callout 3 echoat $n 無奈的是，椰子根本連動都不動。
		oforcer here callout 3 force $n stop_pushing $o
	else
		oforcer here stun $n 80
		oforcer here callout 3 echoat $n 終於，你頭上的椰子似乎開始鬆落.....
		oforcer here callout 4 echoat $n 你衝上前去試圖接住那個要鬆落的椰子！
		oforcer here callout 4 echoaround $n 一顆椰子鬆動落掉落了下來！
		if inroom($n) == 208
			if is_qmark($n) & homeport_coconet_quest 100002
				if is_qmark($n) & homeport_coconet_quest 100004
					oforcer here callout 5 echoat $n 雖然你試圖接住掉落的椰子，不過還是失敗了，椰子滾入了海中，消失不見。
					oforcer here callout 5 echoaround $n $N試圖接住掉落的椰子，不過還是失敗了。
					oforcer here callout 5 force $n stop_pushing $o
					break
				endif
			endif
			if is_qmark($n) & homeport_coconet_quest 100002
				oforcer here mod_qmark $n homeport_coconet_quest v0 | 4
			else
