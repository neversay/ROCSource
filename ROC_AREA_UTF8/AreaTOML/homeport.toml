trigger = "tick_prog"
argument = "100"
script = """
if hour($) == 6
	open s
endif
if hour($) == 20
	close s
endif
if pcnum($) > 0
	if hour($) > 6
	or hour($) < 20
		if rand(30)
			mpecho $I焦急地來回跺步，看著大道上的人群。
			mpcallout 1 mpecho $I喃喃念著：「嘖...怎麼還沒來，訂單快趕不上時間啦....」
			mpcallout 2 mpecho 看來$I似乎遇到些什麼"麻煩"。
			mpcallout 2 mpcall knowthetrouble pc
		endif
	endif
endif
"""
[[mobiles.18009.programs]]
trigger = "defun_prog"
argument = "knowthetrouble"
script = """
if is_qmark($n) & homeport_quest 100016
or is_qmark($n) == homeport_dwarf_quest
	break
endif
mpforcer here add_qmark $n homeport_dwarf_hint -1 0 0 0 0 1
"""
[[mobiles.18009.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($i) == talking
	mpechoat $n $I看起來很忙，沒注意到你。
	break
endif
if is_qmark($n) & homeport_quest 100016
	tell $n 希望在這裡能找到對你有用的東西。
	break
endif
if is_qmark($n) == homeport_dwarf_quest
	break
endif
say 目前店內沒有存貨，要是你有急需，請去其他店問。
mpechoat $n $I看起來完全不想招呼你。
"""
[[mobiles.18009.programs]]
trigger = "talk_prog"
argument = "trouble 麻煩"
script = """
if is_qmark($i) == talking
	mpechoat $n $I看起來很忙，沒注意到你。
	break
endif
if is_qmark($n) & homeport_quest 100016
	break
endif
if is_qmark($n) == homeport_dwarf_quest
	break
endif
if is_qmark($n) == homeport_dwarf_hint
	mpadd_qmark $n homeport_dwarf_quest -1 0 0 0 0 1
	mpdel_qmark $n homeport_dwarf_hint
	mpadd_qmark self talking 2 0 0 0 0 0
	mpcallout 6 mpdel_qmark self talking
	ponder
	mpcallout 1 tell $n 但直到今天連個鬼影子都看不見。
	mpcallout 1 tell $n 從矮人王國出發的馬車，早該在上星期就抵達了。
	mpcallout 1 tell $n 每月定期配送的貨物還沒有來，導致店內的庫存見底。
	mpcallout 1 tell $n 旅行者呀，如你所想的一樣，我的確碰到了些麻煩。
	mpcallout 2 tell $n 現在商船也沒辦法隨叫隨到....
	mpcallout 2 tell $n 然而，近期的傳聞使得港口變得異常的繁忙。
	mpcallout 2 tell $n 雖然能加些錢改走海路，讓貨物快速抵達。
	mpcallout 3 sigh
	mpcallout 4 tell $n 要是貨物再不進來，就要開天窗了。
	mpcallout 4 tell $n 但最麻煩的是，目前有筆大訂單要交貨。
	mpcallout 4 tell $n 依目前店裡的商品存量，恐怕撐不過幾天。
	mpcallout 5 look $n
	mpcallout 6 tell $n 如果有人可以幫忙確認馬車、貨物的去向，還真是感激不盡。
else
	tell $n 你才麻煩呢！
	bark $n
endif
"""
[[mobiles.18009.programs]]
trigger = "talk_prog"
argument = "help 幫忙"
script = """
if is_qmark($i) == talking
	mpechoat $n $I看起來很忙，沒注意到你。
	break
endif
if is_qmark($n) & homeport_quest 100016
	tell $n 你已經幫我很大的忙囉！
	bow $n
	break
endif
if is_qmark($n) == homeport_dwarf_quest 100000
	if level($n) >= 36
		mpmod_qmark $n homeport_dwarf_quest v0 | 1
		mpadd_qmark self talking 2 0 0 0 0 0
		mpcallout 4 mpdel_qmark self talking
		mpdef_rembch null-tar
		mpdef_rembch $n
		bow $b
		if isgood($b)
			mpcallout 1 tell $b 你的內心果然如同你的外表般善良，這件事就拜託你了。
		endif
		if isneutral($b)
			mpcallout 1 tell $b 旅行者呀，你累積的生存經驗肯定能解決這件事情。
		endif
		if isevil($b)
			mpcallout 1 tell $b 我相信這件事的處理過程一定會運用到你狡詐的智慧。
		endif
		mpcallout 2 mpcall give_qitem $b
	else
		look $n
		tell $n 我想，以你的實力幫不上忙。
		tell $n 我可不想店裡的事忙不完，還要花時間幫你善後。
	endif
endif
"""
[[mobiles.18009.programs]]
trigger = "defun_prog"
argument = "give_qitem"
script = """
if being($b)
	if insameroom($b)
		mpoload 18013 $b viclv target
		mpechoat $b $I把信物給了你。
		mpcallout 1 tell $b 你如果沒有什麼頭緒，拿著這個信物去找他，相信他會提供協助。
		mpcallout 1 tell $b 這個是我和皮毛商號老闆的交易信物，詳細的事情標記在上面了。
		mpcallout 2 addoil $b
	else
		mpat $b mpdel_qmark $b homeport_dwarf_quest
		tell $b 我話還沒說完，怎麼你人就跑了？
		tell $b 真是沒禮貌的傢伙，去去去...
	endif
endif
"""
[[mobiles.18009.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($i) == talking
	mpechoat $n $I看起來很忙，沒注意到你。
	break
endif
if is_qmark($n) >= homeport_dwarf_quest 100003
	if is_qmark($n) != homeport_quest
		mpadd_qmark $n homeport_quest -1 0 0 0 0 1
	endif
	mpmod_qmark $n homeport_quest v0 | 16
	mpdel_qmark $n homeport_dwarf_quest
	mpadd_qmark self talking 2 0 0 0 0 0
	mpcallout 3 mpdel_qmark self talking
	ponder
	mpcallout 1 tell $n 看來拜託這些旅行者果然是很冒險的一件事情。
	mpcallout 2 tell $n 現在只能希望那信物別被人家給冒用了。
	mpcallout 3 tell $n 雖然你沒有幫上什麼忙，但還是辛苦你了。
	mpcallout 3 mpexp $n 2000
	mpcallout 3 mpgold $n 10000
endif
"""
[[mobiles.18009.programs]]
trigger = "give_prog"
argument = "18014"
script = """
if is_qmark($i) == talking
	tell $n 我正在忙，你等一下再來。
	give $o $n
	drop $o
	break
endif
if is_qmark($n) & homeport_dwarf_quest 165551
	if is_qmark($n) != homeport_quest
		mpadd_qmark $n homeport_quest -1 0 0 0 0 1
	endif
	mpmod_qmark $n homeport_quest v0 | 16
	mpdel_qmark $n homeport_dwarf_quest
	mpadd_qmark self talking 2 0 0 0 0 0
	mpjunk $o
	mpcallout 4 mpdel_qmark self talking
	mpechoat $n $I看了看礦石並且聽了你的敘述之後，沉思了一下。
	mpcallout 1 tell $n 真是感謝你了，旅行者。
	mpcallout 2 tell $n 這下子也趕得上訂單了。
	mpcallout 2 tell $n 雖然信物弄丟了，可是你還是幫上了我的忙。
	mpcallout 3 tell $n 我只能付給你這點小報酬，希望你別嫌少。
	mpcallout 3 mpexp $n 5000
	mpcallout 3 mpgold $n 500000
	mpcallout 4 thank $n
	mpcallout 10 mpecho $I把新加工好的商品上架。
	if rand(33)
		mpcallout 10 mpolaod 18047 36
	else
		if rand(50)
			mpcallout 10 mpolaod 18048 36
		else
			mpcallout 10 mpolaod 18049 36
		endif
	endif
	if rand(34)
		mpcallout 10 mpolaod 18047 36
	else
		if rand(50)
			mpcallout 10 mpolaod 18048 36
		else
			mpcallout 10 mpolaod 18049 36
		endif
	endif
else
	? $n
	give $o $n
	drop $o
endif
"""
[[mobiles.18009.programs]]
trigger = "give_prog"
argument = "18016"
script = """
if is_qmark($i) == talking
	tell $n 我正在忙，你等一下再來。
	give $o $n
	drop $o
	break
endif
if is_qmark($n) == homeport_dwarf_quest 165591
	if is_qmark($n) != homeport_quest
		mpadd_qmark $n homeport_quest -1 0 0 0 0 1
	endif
	mpmod_qmark $n homeport_quest v0 | 16
	mpmod_qmark $n homeport_quest v1 | 16
	mpdel_qmark $n homeport_dwarf_quest
	mpadd_qmark self talking 2 0 0 0 0 0
	mpcallout 6 mpdel_qmark self talking
	mpjunk $o
	gasp
	mpcallout 1 tell $n 這..這...這和我當初交代的好像不同吧？！
	mpcallout 2 tell $n 而且這東西稍微有點....
	mpcallout 3 tell $n 呃.....算了，總之這趟旅程辛苦你了。
	mpcallout 4 tell $n 我已經順利的從其他地方調到了。
	mpcallout 4 tell $n 貨物的部分你不用擔心。
	mpcallout 5 mpexp $n 3000
	mpcallout 5 mpgold $n 10000
	mpcallout 5 tell $n 這是讓你奔波的酬勞。
	mpcallout 6 bow $n
	mpcallout 30 mpecho $I把新加工好的商品上架。
	mpcallout 30 mpoload 18050 36
else
	? $n
	give $o $n
	drop $o
endif
"""
[[mobiles.18009.programs]]
trigger = "give_prog"
argument = "all"
script = """
? $n
give $o $n
drop $o
"""

