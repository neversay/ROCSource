script = """
if is_qmark($n) == homeport_gambler_quest 300001
	tell $n 哎呀，花賣完了，真抱歉阿，客人。
	mpechoat $n $I轉過身去，準備離開。
	mpechoat $n 你似乎聽到$I在喃喃自語：這些錢不知道夠不夠還父親的賭債...
	mpmod_qmark $n homeport_gambler_quest v2 = 2
	break
endif
if is_qmark($i) == talking
	break
endif
mpadd_qmark self talking
mpcallout 5 mpdel_qmark self talking
tell $n 哎呀，花賣完了，該休息了。
mpecho $I 轉身離開。
mpat 5 purge self
"""
[[mobiles.18006.programs]]
