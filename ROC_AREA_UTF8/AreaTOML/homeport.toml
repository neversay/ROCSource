[area]
name = "望鄉港"
identity = "homeport"
builders = "Sally"
translator = "----"
modifier = "Coconet"
vnum_start = 18000
vnum_end = 18999
security = 1
recall = 18000
death = 18000
f_toggle = false

[mobiles.18000]
keywords = "sentry-homeport"
short_description = "入口衛兵(sentry)"
long_description = "一位衛兵(sentry)正守衛著望鄉港的入口。\n"
description = """
一個出生於本地的人，他的眼裡有一種你說不上來的感覺。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "HUNT"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY"]
alignment = 1000
level = 40
mod_hitplus = 4000
mod_mana = 0
mod_hitroll = 30
mod_damroll = 30
mod_ac = 0
mod_svs = -5
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
race = "Human"
class = ["WARRIOR"]
spec_flags = ["NO_CHARM"]
[[mobiles.18000.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpoload 18008
mpoload 18009
mpat 5 wear all
"""
[[mobiles.18000.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if is_qmark($n) == homeport_enemy
	yell 破壞平和的人終將受到報應！
	wear all
	mpkill $n
	mpnowait
	mphunt $n
	mpnowait
	break
endif
if is_qmark($n) != homeport_quest
	mpechoat $n $I 說：歡迎來到望鄉港，這邊是個充滿海灣氣息的港口
	mpechoat $n $I 說：望鄉港是個平和的都市，破壞平和的人將會接受
	mpechoat $n $I 說：嚴厲的懲罰。
	mpadd_qmark $n homeport_quest -1 0 0 0 0 1
endif
"""
[[mobiles.18000.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) == homeport_enemy
	yell 破壞平和的人終將受到報應！
	wear all
	mpkill $n
	mpnowait
	mphunt $n
	mpnowait
	break
endif
if is_qmark($i) == talking
	break
endif
mpadd_qmark self talking
mpcallout 5 mpdel_qmark self talking
tell $n 歡迎光臨，親愛的冒險者。
tell $n 如果你很疲累，望鄉港的旅館將可以帶給你舒適的休息。
tell $n 如果你想逛街，望鄉港的商店將不會讓你空手而歸。
tell $n 如果你想工作，望鄉港的公會應該可以幫上點忙。
tell $n 希望望鄉港能夠給你一個很好的回憶。
"""
[[mobiles.18000.programs]]
trigger = "fight_prog"
argument = "30"
script = """
wear all
bashhead
mpnowait
bashhead
mpnowait
mpgoto self
perform emp $n
mpnowait
if hitprcnt($i) < 25
	mpat 5 cast 'double heal'
	mpnowait
endif
"""
[[mobiles.18000.programs]]
trigger = "death_prog"
argument = "100"
script = """
yell 破壞平和的人終將受到報應！
mpdis_magic self blindness
mpat 5 c 'detect invis'
mpnowait
if is_qmark($n) != homeport_enemy
	mpadd_qmark $n homeport_enemy 100 0 0 0 1 1
else
	mpmod_qmark $n homeport_enemy timer + 100
endif
"""

