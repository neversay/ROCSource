[[rooms.18016.programs]]
trigger = "room_defun"
argument = "baccarat_bet_check"
script = """
if roomvalue($1) == 7
	echoat $n 遊戲才剛結束，桌面還在整理。
	del_qmark $n baccarat_bet_buf
	break
endif
if roomvalue($1) >= 5
	echoat $n 遊戲已經開始。
	del_qmark $n baccarat_bet_buf
	break
endif
if carrynum($n) > 99
	echoat $n 你身上帶著太多東西了，贏牌也拿不動獎勵。
	del_qmark $n baccarat_bet_buf
	break
endif
if is_qmark($n) == baccarat_bet_buf 100001
	if carrycount($n , 18051 ) < 1
		echoat $n 你身上的籌碼不夠。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet_buf 100002
	if carrycount($n , 18051 ) < 2
		echoat $n 你身上的籌碼不夠。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet_buf 100003
	if carrycount($n , 18051 ) < 3
		echoat $n 你身上的籌碼不夠。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet_buf 100004
	if carrycount($n , 18051 ) < 4
		echoat $n 你身上的籌碼不夠。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet_buf 100005
	if carrycount($n , 18051 ) < 5
		echoat $n 你身上的籌碼不夠。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) >= baccarat_bet 100005
	echoat $n 你這把已經下注太多了。
	del_qmark $n baccarat_bet_buf
	break
endif
if is_qmark($n) == baccarat_bet 100004
	if is_qmark($n) > baccarat_bet_buf 100001
		echoat $n 這次下注太多了，會超過這把的上限。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet 100003
	if is_qmark($n) > baccarat_bet_buf 100002
		echoat $n 這次下注太多了，會超過這把的上限。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet 100002
	if is_qmark($n) > baccarat_bet_buf 100003
		echoat $n 這次下注太多了，會超過這把的上限。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if is_qmark($n) == baccarat_bet 100001
	if is_qmark($n) > baccarat_bet_buf 100004
		echoat $n 這次下注太多了，會超過這把的上限。
		del_qmark $n baccarat_bet_buf
		break
	endif
endif
if roomvalue($1) == 0
	modrvt v1 = 1
endif
rcall baccarat_pay $n
if is_qmark($n) != baccarat_bet
	add_qmark $n baccarat_bet -1 0 0 0 1 0
endif
if is_qmark($n) != baccarat_banker_win
