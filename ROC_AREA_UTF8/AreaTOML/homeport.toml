[rooms.18065]
name = "哨站"
description = """
前方的林間道路滿是濃霧，可見度不高，這裡是你所能通行道路的最
後一小段，再過去即是一片的廢墟，至於為什麼會在這裡建一個哨站來封
鎖這條道路，到現在仍是眾說紛紜。傳聞中那裡曾有一座版圖不小的城堡
和莊園，在戰爭中遭到破壞後就沒落了，現在成為盜匪的盤踞地；也有人
傳言有惡魔封印在那片廢墟深處，所以才會禁止通行，事實總是不如故事
來的精采。由花崗岩堆砌建造而成的哨站雖沒有高大宏偉的骨架，但其莊
嚴而精巧的建築風格仍會讓人為之佇足；周圍彌漫著一股詭譎的氣息，讓
人心中有些忐忑，望著守衛凝重的表情，更加深了那種不安的感覺。
"""
