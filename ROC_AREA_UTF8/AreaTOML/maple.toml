[mobiles.16001]
keywords = "anka-maple lord"
short_description = "安卡(Anka)"
long_description = "導師 - 安卡(Lord Anka)正坐在這裡。\n"
description = """
端坐在你眼前的人正是楓紅村中最為人景仰的導師，雖然他只
有四十多歲，但是眼中卻散發著睿智的光輝。掛在牆上的長劍
劍鞘上隱約泛著暗紅色的光澤，感覺上似乎經歷過不少戰役。
"""
act_flags = ["NPC", "SENTINEL", "STAY_AREA", "WIMPY", "TRAIN", "PRACTICE", "CRITICAL", "HARD_DIS", "TWO_WEAPON", "ARTIFACT", "MOB_AI"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED"]
alignment = 800
level = 50
mod_hitplus = 3000
mod_mana = 0
mod_hitroll = 30
mod_damroll = 5
mod_ac = 350
mod_svs = -10
dodge = -50
mod_pp = 30
gold = -1
sex = "male"
class = ["WARRIOR", "MAGE", "THIEF", "SWORD"]
spec_flags = ["NO_CHARM", "EXPERT"]
[[mobiles.16001.weaknesses]]
skill = "flaming slash"
percent = 400
damage = 200
[[mobiles.16001.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.16001.programs]]
trigger = "fight_prog"
argument = "40"
script = """
wear all
disarm
get all
if rand(30)
        flaming
        break
endif
if rand(30)
        earth
else
        circular
endif
"""
[[mobiles.16001.programs]]
trigger = "fight_prog"
argument = "40"
script = """
if rand(30)
        c 2 'chill touch' $n
endif
if rand(30)
        c 2 weaken $n
endif
if rand(30)
        c 2 harm $n
endif
if rand(30)
        c 2 blindness
        c 'cure blind'
endif
if rand(10)
        c 'full heal'
endif
"""
[[mobiles.16001.programs]]
trigger = "fight_prog"
argument = "40"
script = """
wear all
disarm
get all
if hitprcnt($i) < 30
        c 'double heal'
        c heal
        c curse $n
        break
endif
if hitprcnt($i) < 50
        c 'double heal'
        c weaken $n
        break
endif
if hitprcnt($i) < 70
        c heal
        c 'chill touch'
endif
"""
[[mobiles.16001.programs]]
trigger = "hitprcnt_prog"
argument = "40"
script = """
if rand(50)
        c 'double heal'
else
        c heal
endif
"""
[[mobiles.16001.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
                break
        endif
        if is_qmark($n) == maple_enemy
                yell 打擾了楓紅林和平的人只有死路一條！
                mpat 5 c gi
                c 'dispel magic' $n
                c fae $n
                c curse $n
                c bli $n
                mpkill $n
                flami $n
                break
        endif
        if is_qmark($n) == maple_swd_trail 100005
                clap $n
                say 恭喜你通過了這三場困難的試煉。
                mpechoaround $n $i 將自己脖子上的項鍊解了下來，遞給 $n 。
                mpechoat $n $i 將自己脖子上的項鍊解了下來，遞給了你。
                say 這條項鍊是我的護身符，現在送給你作為通過試煉的證明。
                mpoload 16004 $n viclv target
                say 願真理和秩序與你同在。
                mpmod_qmark $n maple_swd_trail v0 = 6
                say ......對了，如果你需要學習更精要的劍術，你可以到樓下
                say 與我設置的幻影學習。
        endif
        if rand(50)
                smile $n
                break
        endif
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "seed"
script = """
if is_qmark($n) == ocean_annie_seed 100002
mpmod_qmark $n ocean_annie_seed v0 = 3
think $n
mpcallout 1 say 我是曾經有過一顆白楓種子
mpcallout 2 say 不過很久以前就已經送給黛妮雅了
mpcallout 3 say 你最好還是回去問問看吧。
endif
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 歡迎來到祥和的楓紅林區(forest)。
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "forest"
script = """
nod $n
        say 住在楓紅林的我們，是從史卡拉貝(skara brae)移民過來的第二代。
        say 我們原本也是光明之鎮的住民
        say 後來跟鎮裡的人們在一些事情(something)上意見不合
        say 所以才會遷徙至此。
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "something"
script = """
say 詳細的情形我也不太清楚了，
        say 好像是跟當年的戰事有關吧。
        sorry $n
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "trial"
script = """
if class($n) == 12
        if is_qmark($n) != maple_swd_trail
                break
        endif
        if is_qmark($n) == maple_swd_trail 100001
                if level($n) < 38
                        shake $n
                        say 你的等級不夠高，還不能夠接受我的試煉。
                else
                        mpmod_qmark $n maple_swd_trail v0 = 2
                        say 好！果然英雄出少年！
                        clap $n
                        say 如果你已經做好了準備，只要跟我說可以(talk anka ok)，就開始進行
                        tell $n 如果不幸戰敗，跟我說一聲(talk anka grave)就可以取回屍首。
                        tell $n 同時再跟我說(talk anka ok)任務即可重新開始。
                endif
        endif
endif
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "grave"
script = """
if class($n) == 12
        if is_qmark($n) <= maple_swd_trail 100001
                break
        else
                cast grave $n
                say 請多加油
        endif
endif
"""
[[mobiles.16001.programs]]
trigger = "talk_prog"
argument = "ok"
script = """
if is_qmark($n) <= maple_swd_trail 100004
        if class($n) == 12
                if level($n) >= 38
                mpechoat $n 一陣奇怪的感覺後，你忽然被傳送到一個奇怪的地方....。
                mptransfer $n 16050
                endif
        endif
endif
"""
[[mobiles.16001.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) != maple_enemy
        mpadd_qmark $n maple_enemy 50 0 0 0 1 0
else
        mpmod_qmark $n maple_enemy timer + 50
endif
"""

[mobiles.16002]
keywords = "cloud-maple cleric"
short_description = "克勞德牧師(Cleric Cloud)"
long_description = "秩序之神方提修的牧師(Cleric)正在這裡傳道。\n"
description = """
克勞德牧師是迷霧之島的第一代移民。當年安定了跟著安卡的父
親一起逃難到這片楓林的民眾恐慌心靈的，正是這位信奉秩序之
神的牧師。
"""
act_flags = ["NPC", "WIMPY"]
affected_flags = ["DETECT_EVIL", "DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "INFRARED", "PROTECT"]
alignment = 1000
level = 50
mod_hitplus = 0
mod_mana = 1000
mod_hitroll = 0
mod_damroll = 0
mod_ac = 30
mod_svs = 20
dodge = 10
mod_pp = 0
gold = -1
sex = "male"
class = ["MAGE"]
spec_flags = ["NO_CHARM", "EXPERT"]
[[mobiles.16002.programs]]
trigger = "repop_prog"
argument = "100"
script = """
mpadd_qmark self delayed_cast -1 99999 0 0 1 0
"""
[[mobiles.16002.programs]]
trigger = "fight_prog"
argument = "40"
script = """
wear all
barehand
mpnowait
c angry
mpnowait
disarm
mpnowait
get all
if rand(30)
        c 2 'chill touch' $n
        mpnowait
endif
if rand(30)
        c 2 weaken $n
        mpnowait
endif
if rand(30)
        c 2 harm $n
        mpnowait
endif
if rand(30)
        c 2 blindness
        mpnowait
endif
if rand(10)
        c 'full heal'
        mpnowait
endif
"""
[[mobiles.16002.programs]]
trigger = "fight_prog"
argument = "30"
script = """
if hitprcnt($i) < 30
        c 'double heal'
        mpnowait
        c heal
        mpnowait
        c curse $n
        mpnowait
        break
endif
if hitprcnt($i) < 50
        c 'double heal'
        mpnowait
        c weaken $n
        mpnowait
        break
endif
if hitprcnt($i) < 70
        c heal
        mpnowait
        c 'chill touch'
        mpnowait
endif
"""
[[mobiles.16002.programs]]
trigger = "hitprcnt_prog"
argument = "40"
script = """
if rand(50)
        c 'double heal'
else
        c heal
endif
mpnowait
"""
[[mobiles.16002.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if isnpc($n)
        break
endif
if is_qmark($n) == maple_enemy
        say 受死！
        c angry $n
        break
endif
if is_inv_obj($n) == 10018
or is_equ_obj($n) == 10018
        if is_qmark($n) == crystal_reward
                if is_qmark($n) == maple_camus_attack
                or mobcount(16023) >= 1
                        break
                endif
                gasp $n
                mpechoat $n $I 驚訝的說「這....這是聖王的信物」
                mpechoat $n $I 驚訝的說「難道你就是拯救了水晶湖的勇士！」
                mpechoaround $n 正當 $I 等待 $n 的回答時，忽然天空響起了雷聲！
                mpechoat $n 正當 $I 等待你的回答時，突然天空響起了雷聲！
                mpechoat $n $I 說著「魔族的妖怪又要作亂！他就是控制住水晶湖的魔族 卡瑪斯(camus)！」
                mpechoat $n $I 說著「能否請你幫忙除去他呢(destroy)？」
                mpadd_qmark $n maple_camus_attack -1 0 0 0 0 1
        endif
endif
if is_qmark($n) == wyvern_tower 300002
        if is_equ_obj($n) == 15112
        or is_inv_obj($n) == 15112
                gasp $n
                say 你身上的那面盾牌，可以借給我看一下嗎？
                say 我在那上面感覺到一股不太好的力量存在。
                mpmod_qmark $n wyvern_tower v2 = 3
        endif
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "destroy"
script = """
if is_qmark($n) == maple_camus_attack 100000
        mpechoat $n 你義不容辭的接下了這個任務....。
        mpat 16023 mpmload 16023
        mpat 16023 mpforce camus mpoload 16041
        mpat 16023 mpforce camus mpoload 16042
        mpat 16023 mpforce camus mpoload 16010
        mpat 16023 mpforce camus-maple wear all
        mpat 16023 mpforce camus-maple mpat $n mpdef_rembch $n
        mpat 16023 mpadd_qmark camus-maple maple_camus_tick 50 0 0 0 0 1
        mpat 16023 mpmload 16027
        mpat 16023 mpadd_qmark camus-maple maple_camus_tick 50 0 0 0 0 1
        mpat 16023 mpforce camus-maple mpgroup self daemon 1 0
        mpat 16016 mpmload 16027
        mpat 16023 mpadd_qmark camus-maple maple_camus_tick 50 0 0 0 0 1
        mpat 16041 mpmload 16027
        mpat 16023 mpadd_qmark camus-maple maple_camus_tick 50 0 0 0 0 1
        mpat 16041 mpforce daemon mpkill lord
        mpat 16023 mpforce camus-maple yell 破壞闇黑主宰計畫的人類，來到我的跟前試試黑暗的力量吧！
        mpat 16041 mpforce lord yell 不正的力量！遠離潔淨之地！
        mpmod_qmark $n maple_camus_attack v0 = 1
        say 願神保佑你....。
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
bow $n
say 你好，歡迎來到秩序之神的殿堂。
say 我是秩序之神的牧師克勞德
say 你想知道秩序的真諦嗎？(talk cleric yes/no)
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "no"
script = """
sigh
say 我也無法勉強你…
say 畢竟順應一個人的喜好也是秩序的一種。
bow
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if being($b)
        break
else
        mpecho $I 對你的同意感到十分高興
        say 在這個混沌幻世中，不同的神有著不同的工作。
        say 秩序之神主要的任務就是讓這個世界平和的運轉，
        say 使其不會發生混亂....。
        mpecho $I 拿起旁邊的杯子喝了口水....。
        mpadd_qmark self maple_cloud -1 0 0 0 0 1
        mpdef_rembch $n
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) <= maple_camus_attack 100001
        if mobcount(16023) == 0
                mpechoat $n 遠方傳來一陣聲響「你的任務已經可以重解了！」
                mpdel_qmark $n maple_camus_attack
        else
                mpechoat $n 遠方傳來一陣聲響「目前已經有人接受這項任務！」
                mpechoat $n 遠方傳來一陣聲響「這項任務暫時無法重解，請稍待。」
        endif
endif
"""
[[mobiles.16002.programs]]
trigger = "rand_prog"
argument = "40"
script = """
if is_qmark($i) == maple_cloud 100000
        say 因此秩序的真諦，就是順應各種事物的本性，讓他們能各司其職，各取所需。
        say 如果能做到這樣，那你就能夠獲得秩序之神的認同(acknowledge)了。
        mpadd_qmark $b maple_ack -1 1 0 0 0 1
        smile $b
        mpdef_rembch null-tar
        mpdel_qmark self maple_cloud
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "acknowledge"
script = """
if is_qmark($n) != maple_ack 100001
        say 孩子，在神的跟前撒謊是不好的。
        smile
else
        mpechoat $n $I 上上下下注視著你
        ponder
        say 你有這份心當然是很好....。
        mpecho $I 對著秩序之神的神像喃喃自語，似乎是在禱告....。
        say 神希望你到楓林中取得一樣足以證明的物件(thing)。
        say 將物件帶回給我，讓我知道你已然領悟了秩序的真諦。
        smile $n
        mpmod_qmark $n maple_ack v0 = 2
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "thing"
script = """
if is_qmark($n) != maple_ack 100002
        say 孩子，在神的跟前撒謊是不好的
        sigh $n
else
        say 只要遵循自然的規律
        say 你就能理解神的意思。
        mpat 16045 mpmload 16018
        mpat 16045 mpmload 16019
        mpat 16045 mpforce wolf-maple mpkill rabbit-maple
        smile $n
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "abyss"
script = """
if is_qmark($n) != maple_camus_attack 100002
        break
else
        soga
        say 我一直想不通那些邪惡勢力是那裡來的
        say 真是多虧了你，現在終於知道了
        say 深淵魔域(abyss)是存在於另一次元的世界
        say 看來黑暗主宰也是來自那裡了。
        say 詳細的情形，就得請你去詢問 黛妮雅(dynia) 祭司了。
        mpmod_qmark $n maple_camus_attack v0 = 3
        mpexp $n 2000
        mpgold $n 10000
        mpresp $n 3
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "assist"
script = """
if is_qmark($n) == wyvern_tower 300004
        bow $n
        say 其實我的想法很簡單，就是給予它大量的『靈魂』
        say 之力。如果這盾牌真是黑暗主宰用來收集靈魂的道
        say 具，那麼它每段時間只能吸取少量的靈魂必定有原
        say 因，我猜想是一次傳送過大的靈魂力量的話，這個
        say 傳送的途徑會因此產生錯亂，畢竟只靠一面盾做這
        say 種靈魂的傳送是很困難的。
        mpcallout 1 mpcall cloud_talking2 $n
        mpcallout 1 mpmod_qmark $n wyvern_tower v2 = 5
endif
"""
[[mobiles.16002.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
if is_qmark($n) != maple_enemy
        mpadd_qmark $n maple_enemy 50 0 0 0 1 0
else
        mpmod_qmark $n maple_enemy timer + 50
endif
"""
[[mobiles.16002.programs]]
trigger = "talk_prog"
argument = "bless"
script = """
if is_qmark($n) != maple_cle_stone
        if is_qmark($n) == ocean_alc_stone 100003
                mpadd_qmark $n maple_cle_stone -1 1 0 0 0 1
                say 這也不是很困難的事情
                say 將阿瑞托沙拿來給我，之後再耐心等待三天即可
        endif
else
        if is_qmark($n) == maple_cle_stone 100001
                say 我不能瞭解你的意思。
        endif
endif
"""
[[mobiles.16002.programs]]
trigger = "give_prog"
argument = "40038"
script = """
if is_qmark($n) == maple_cle_stone 100001
        mpjunk all.arethusa
        mpadd_qmark $n maple_cle_wait 72 0 0 0 0 0
        say 請你等待三天，三天後就可以完成祝福儀式。
        mpmod_qmark $n maple_cle_stone v0 = 2
        say 到時候跟我說一聲謝謝就好。
else
        say 你給我阿瑞托沙幹嘛？
        drop are
endif
"""
[[mobiles.16002.programs]]
trigger = "act_prog"
argument = "thank"
script = """
if is_qmark($n) == maple_cle_wait
        - $n
        say 我還在祝福中，請不要煩我
        break
endif
                if is_qmark($n) == maple_cle_stone 100002
                        if is_qmark($n) != maple_cle_wait
                        mpmod_qmark $n maple_cle_stone v0 = 3
                        mpoload 40039 $n target
                        say 這就是經過祝福的阿瑞托沙了。
                        say 願秩序之神保佑你完成你的心願。
                        endif
                endif
"""
[[mobiles.16002.programs]]
trigger = "give_prog"
argument = "16002"
script = """
if is_qmark($n) != maple_ack 100003
        break
else
        sigh
        say 其實這並不是秩序的真諦
        say 一般人總以為助弱鋤強便是真理，卻不知自然界有她自己的法則
        say 雖然你並沒有達成我的要求，但知道以後可要加倍努力。
        mpmod_qmark $n maple_ack v0 = 4
        mpexp $n 800
        endif
endif
"""
[[mobiles.16002.programs]]
trigger = "give_prog"
argument = "16003"
script = """
if is_qmark($n) != maple_ack 100003
        break
else
        good $n
        say 沒錯！自然的法則便是順應事物的本性
        say 也許你反對坐視惡狼吞吃野兔
        say 但是自然的運作也是有他的道理的
        say 請謹記這個道理。
        mpmod_qmark $n maple_ack v0 = 4
        mpexp $n 1000
endif
"""
[[mobiles.16002.programs]]
trigger = "give_prog"
argument = "15112"
script = """
if is_qmark($n) == wyvern_tower 300003
        mpat 5 mpjunk $o
        mmm
        say 果然跟我想的一樣，上面有黑暗主宰的力量......
        say 你可以告訴我有關這面盾的情報嗎？
        mpechoat $n 你一五一十的將之前羅帕斯跟你講的全都告訴了$I....
        mpcallout 1 mpcall cloud_talking1 $n
        mpcallout 1 mpmod_qmark $n wyvern_tower v2 = 4
endif
"""
[[mobiles.16002.programs]]
trigger = "give_prog"
argument = "all"
script = """
if name($o) / soul
        if is_qmark($n) == wyvern_tower 300014
                mpmod_qmark $n wyvern_tower v2 = 15
                say 這物品擁有著極致強大的靈魂之力啊！
                say 累積到這樣的靈魂之力應該是足夠了，我現在就開
                say 始進行淨化儀式，請你稍等片刻。
                mpcallout 1 mpcall cloud_talking3 $n
                mpcallout 2 mpechoat $n 完全沒注意到你驚愕不已的神情，$I不急不徐的走到祭壇旁，並將手中的水緩緩倒在那些物品上......
                mpcallout 3 mpechoat $n 你辛苦收集來的那些裝備慢慢的溶解在金黃色的流水之中......嗯.....怎麼鹹鹹的，這就是眼淚的味道嗎......〒ˍ〒
                mpcallout 4 mpechoat $n 金黃的聖水又逐漸的被吸入了吞噬之盾中....你感覺吞噬之盾似乎也放出了金色光輝。
                mpcallout 5 mpcall cloud_talking4 $n
                mpcallout 6 mpcall cloud_talking5 $n
        else
                if is_qmark($n) > wyvern_tower 300014
                or is_qmark($n) < wyvern_tower 300005
                else
                        say 這物品擁有著極致強大的靈魂之力啊！
                        mpmod_qmark $n wyvern_tower v2 + 1
                endif
        endif
endif
"""
[[mobiles.16002.programs]]
trigger = "defun_prog"
argument = "cloud_talking1"
script = """
say 原來是這樣啊，這個推斷的確滿合理的......
say 我是有個想法，或許可以壓制這面盾的力量，不過
say 需要你的協助(assist)。
"""
[[mobiles.16002.programs]]
trigger = "defun_prog"
argument = "cloud_talking2"
script = """
mpechoat $n 看你一臉茫然的樣子，$I有些尷尬的咳了兩聲。
say 啊，真不好意思，說明好像太長了點，簡單說吧，
say 請你去收集擁有『靈魂』之力的物品給我，只要量
say 到達一定的程度，我馬上就可以進行壓制這邪惡力
say 量的儀式。
smile
mpechoat $n 你心想：混蛋，吃了五面盾還不夠，現在還要收名字有魂的裝備，這是資源回收任務嗎？
"""
[[mobiles.16002.programs]]
trigger = "defun_prog"
argument = "cloud_talking3"
script = """
mpechoat $n $I將你收集來的物品放在祭壇上，並將吞噬之盾也放了上去。
mpechoat $n $I從一旁的水池中裝了一杯水，闔上眼默唸了幾個古代文字。
mpechoat $n $I手中的清水居然發出了金色光芒！你甚至看到了龍的幻影！
mpechoat $n 我的天啊！這不是傳說中的特級廚師做料理時才會發生的現象嗎！
"""
[[mobiles.16002.programs]]
trigger = "defun_prog"
argument = "cloud_talking4"
script = """
mpechoat $n 等到水全部被吞噬之盾吸盡後，$I拿起了吞噬之盾觀察。
sigh
say 結果不盡人意啊，雖然一口氣灌注了這麼大量的靈
say 魂之力，卻只能稍微壓制住它的力量，這樣的話實
say 在不能說是成功......
ponder
"""
[[mobiles.16002.programs]]
trigger = "defun_prog"
argument = "cloud_talking5"
script = """
say 這樣吧，據說在史卡拉貝大陸的一座塔上，有一名
say 很厲害的牧師，或許他能夠幫你的忙(help)也說不
say 定。
say 雖然沒辦法幫你解決問題，但我還是會祈求秩序之
say 神方提修(Zeel)保佑你。
mpoload 15112 $n 36 target
mpechoat $n $I給了你吞噬之盾(devour shield).
wave $n
"""

