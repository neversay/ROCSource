description = """
這個白髮白鬚的老者就是清河鎮的鎮長，也是清河鎮當年的創建者之一。

若不是當年他和幾個同伴在這裡一同奮鬥，清河鎮那有今天的風光。現在他雖然不
用再像以前一樣的辛苦，但是他對清河鎮的熱愛卻一點也沒有稍減。
"""
