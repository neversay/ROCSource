[[mobiles.6315.programs]]
trigger = "rand_prog"
argument = "50"
script = """
if area($i) != arachnos
	say 這裡不是我該來的地方。
	mpecho $I 轉身離開了你的視線....
	mppurge self
	break
endif
if being($b)
	if is_qmark($i) == arachnos_ki-rin_group
		if insameroom($b)
		else
			tell $b 快來，我們趕緊一同前去消滅蜘蛛女。
			if is_qmark($i) > arachnos_ki-rin_group 1005
				mpmod_qmark self arachnos_ki-rin_group timer - 5
			endif
		endif
	else
		tell $b 你實在拖得太久了，我實在無法信任你！
		wave $b
		mppurge self
	endif
else
	if is_qmark($i) == arachnos_ki-rin_group
		sigh
		say 又有人未解完任務就離開遊戲了。
		mpecho $I 轉身消失在你的眼前....
		mppurge self
	endif
endif
"""
[[mobiles.6315.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) != arachnos_quest
or is_qmark($n) <= arachnos_quest 100003
	say 我的同伴們，都被邪惡的蜘蛛女給抓住了，
	say 他們現在都在上層的蜘蛛網區當奴隸，
	say 其中有一個叫做隱士(hermit)，不知道他的現況如何。
	say 你可以先去看看他的狀況嗎？
	break
endif
if is_qmark($n) == arachnos_quest 100004
	sm $n
	say 我終於等到你來救我了。
	mpmod_qmark $n arachnos_quest v0 = 5
	mpdef_rembch $n
	mpadd_qmark self arachnos_ki-rin_group 48 0 0 0 1 0
	say 蜘蛛女住在蜘蛛網區的深處，我們趕緊去找它吧！
	mpgroup $n self 1 0
	break
endif
if is_qmark($n) == arachnos_quest 100006
	mpdis_magic self blindness
	mpat 5 c inf
	rumor $n \u001B[1;33m解放了被蜘蛛女所佔據的蜘蛛網區！\u001B[m
	if class($n) < 5
		mpexp $n 750
	else
		mpexp $n 500
		mpmod_qmark $n arachnos_quest v2 = 2
	endif
	mpmod_qmark $n arachnos_quest v0 = 7
	say 實在太感謝你了 $n ，我有一些小禮物要送給你。
	if level($n) >= 30
		mpoload 6304 30
	else
		mpoload 6304 15
	endif
	give visor $n
	wave $n
	mpecho $I 離開了蜘蛛網區....
	mppurge self
endif
"""
[[mobiles.6315.programs]]
trigger = "fight_prog"
argument = "50"
script = """
if isaffected($i) & 1
	c 'cure blindness'
	mpnowait
endif
if insameroom($b)
	if isaffected($b) & 1
		say 讓我來幫助我的伙伴吧！
		c 'cure blindness' $b
		mpnowait
		break
	endif
	if isaffected($b) & 4096
		say 讓我來幫助我的伙伴吧！
		c 'cure poison' $b
		mpnowait
	endif
endif
"""
[[mobiles.6315.programs]]
trigger = "death_prog"
argument = "100"
script = """
mpdis_magic self blindness
mpat 5 c inf
yell 我未能完成市長給我的任務，我不甘心！
"""

