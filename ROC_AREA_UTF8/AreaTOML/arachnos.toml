argument = "100"
script = """
if ispc($n)
	if is_qmark($n) == arachnos_quest 100005
		if insameroom(ki-rin-arachnos)
			mpecho $I\u001B[1;32m說著「不自量力的 $n 竟敢救出凱倫，去死吧！！」\u001B[0m
