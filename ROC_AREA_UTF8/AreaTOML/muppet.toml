[rooms.65403]
name = "倉庫"
description = """
這裡就是店裡面的倉庫，和店裡面一樣，這裡十分的整潔，你不禁稱讚著這裡的
環境，能夠將環境弄得如此的整潔，八成是有個勤快的夥計，看來這家店的生意一定
不錯。你在東張西望的時候，看到了另一個人偶，照常理來推斷，他大概就是那個勤
快的傢伙了吧。看到這些成堆的東西，你的"冒險者本能"正在蠢蠢欲動，說不定這裡
可以找出什麼好東西呢。
"""
flags = ["NO_MOB", "INDOORS", "SAFE"]
sector = "INSIDE"
[rooms.65403.exits.south]
description = ""
keywords = ""
locks = []
key = 0
to_room = 65402
[[rooms.65403.programs]]
trigger = "room_command"
argument = "search default"
script = """
echoat $n 你要找什麼？
"""
[[rooms.65403.programs]]
trigger = "room_command"
argument = "search around"
script = """
if roomvalue($0) < 20
	modrvt v0 + 1
	modrvt t0 + 1
	if is_qmark($n) != muppet_search
		echoat $n 你開始在這些成堆的物品翻找...
		echoaround $n $N 開始在這些成堆的物品翻找...
		add_qmark $n muppet_search -1 1 0 0 1 0
	else
		if is_qmark($n) > muppet_search 100010
			echoat $n 你找到了一盒東西！
			echoaround $n $N 找到了一盒東西！
			del_qmark $n muppet_search
			oload 65425 30 floor
		else
