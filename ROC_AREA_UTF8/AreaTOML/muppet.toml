當你一進入這家店舖之後，發現這裡十分的整潔，而且光線充足，讓你感到十分
的舒服愉快。老闆自然也是一個人偶，雖說是人偶，他還是很殷勤的招呼著你，叫你
隨意看看。從你的常識推斷，他大概可以提供不少消息來滿足你的好奇心。往北好像
