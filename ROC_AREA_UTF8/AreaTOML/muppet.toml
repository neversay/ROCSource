short_description = "葛羅佛(Grover)"
long_description = "葛羅佛(Grover)意氣風發的站在這裡。\n"
description = """
他是馬佛德的死對頭，也是鎮上處心積慮想要打倒他的唯一一人，或許你能夠幫上他什麼忙(help)。
"""
act_flags = ["SENTINEL"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
