[mobiles.65400]
keywords = "Ernie-muppet"
short_description = "歐尼(Ernie)"
long_description = "歐尼(Ernie)站在這，賣一些日用品。\n"
description = """
歐尼是個橘色的人偶，看來他在被變成人偶之前是個鎮上日用品店的老闆。
"""
act_flags = ["SENTINEL"]
affected_flags = ["DETECT_INVIS", "DETECT_HIDDEN"]
alignment = 500
level = 36
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 0
sex = "male"
spec_flags = ["ALY_DI", "ALY_DH"]
[[mobiles.65400.programs]]
trigger = "greet_prog"
argument = "70"
script = """
say 歡迎，歡迎，快進來坐坐，請自己挑選想要的物品。
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
if is_qmark($n) != muppet_grover_save
        sigh
        say 不知道這種日子什麼時候才可以結束阿，
        say 希望葛羅佛(Grover)別出事了才好。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "grover"
script = """
if is_qmark($n) != muppet_grover_save
        say 他是我們鎮上的英雄，為了我們的將來奮鬥!!!
        say 他要是能打倒馬佛德(Mumford)這壞傢伙就好了。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "mumford"
script = """
if is_qmark($n) != muppet_grover_save
        curse
        say 他是讓我們變成人偶的元兇，這個壞蛋...
        say 不過幸好有葛羅佛正在策劃打倒他的計劃。
        say 如果你有空的話希望你能順便幫助我們。
        say 你可以去找葛羅佛商談細節。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "information"
script = """
if is_qmark($n) == muppet_grover_save 100001
        mpmod_qmark $n muppet_grover_save v0 = 2
        bow
        mpcallout 1 say 你真的想要拯救我們？
        mpcallout 2 say 那我一定將我所知道的全都告訴你...
        mpcallout 3 say 你想要知道什麼呢？
        mpcallout 5 mpechoat $n 馬佛德到底是誰(who)？*
        mpcallout 5 mpechoat $n 秘密入口(enter)？
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "who"
script = """
if is_qmark($n) == muppet_grover_save 100002
        say 馬佛德他本來也是我們鎮上的鎮民之一，他本來是法力高強的法師，
        say 但是後來我們附近的泰洛斯被邪惡侵襲後，他為了追求更強的法力，
        say 投靠了他們...然後將我們全部變成人偶，至於為什麼，我也不是很
        say 清楚，我想大概是當初守護這鎮上的力量(force)所保護我們的關係。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "force"
script = """
if is_qmark($n) == muppet_grover_save 100002
        say 馬佛德的父親，也是個法力高強的法師，同時也是個善於操弄人偶的
        say 人偶師。在很久以前，我們將他從敵人的手中救出，並且讓他住在這
        say 鎮上，他為了感謝我們，就在我們鎮上設下守護的力量，據說這股力
        say 量就是他最喜歡的玩偶(muppet)，後來他的兒子在他死後就漸漸偏入
        say 魔道，最後引狼入室，他自己也是成了半個死人...
        sigh
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "muppet"
script = """
if is_qmark($n) >= muppet_grover_save 100002
        if is_qmark($n) == muppet_grover_save 200001
                mpmod_qmark $n muppet_grover_save v1 = 2
                mpadd_qmark $n muppet_oscar -1 0 0 0 0 1
                say 這樣的玩偶有四個，我的是青蛙玩偶，但是我的不小心被奧斯卡給拿
                say 走了，你還是找他拿回來吧，你找到以後就跟我說一下，我會告訴你
                say 關於下一個兔子玩偶(rabbit)的下落。
                say 至於你，只要問他們在哪裡就好了(where)。
        endif
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "enter"
script = """
if is_qmark($n) == muppet_grover_save
        say 秘密入口阿....
        say 馬佛德他在將我們全都變成人偶後，有些壞蛋趁機投靠他，欺壓其他
        say 鎮民，在鎮上組成幫派，他們的基地就在鎮上的西北方，尤其裡面有
        say 個老大，更是馬佛德的左右手，他們一定知道秘密的入口和進入的方
        say 法。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "rabbit"
script = """
if is_qmark($n) == muppet_grover_save 200003
        mpadd_qmark $n muppet_count -1 0 0 0 0 1
        say 很好，你找到了我的青蛙玩偶了！
        say 接著是伯爵(Count)的兔子人偶...
        say 拿到兔子玩偶以後再問我蛇玩偶(snake)的下落。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "snake"
script = """
if is_qmark($n) == muppet_grover_save 200004
        mpadd_qmark $n muppet_luis -1 0 0 0 0 1
        say 很好，你拿到了伯爵的兔子玩偶了！
        say 接著是路易士(Luis)的蛇玩偶...
        say 拿到蛇玩偶以後再問我老虎玩偶(tiger)的下落。
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "tiger"
script = """
if is_qmark($n) == muppet_grover_save 200005
        mpadd_qmark $n muppet_hooper -1 0 0 0 0 1
        say 很好，接下來就是最後一個玩偶了！
        say 桶匠的老虎玩偶(tiger)...
        say 拿到之後就跟我說一聲吧(report)
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($n) == muppet_grover_save 200006
        say 太好了，你把玩偶全都蒐集完了
        say 趕快去打倒馬佛德吧！
        say 人偶鎮的希望都在你身上了
        wave
endif
"""
[[mobiles.65400.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == muppet_grover_save 200006
        say 你已經完成此任務。
        slap $n
endif
if is_qmark($n) <= muppet_grover_save 200005
        mpmod_qmark $n muppet_grover_save v1 = 2
        mpdel_qmark $n muppet_hooper
        mpdel_qmark $n muppet_luis
        mpdel_qmark $n muppet_count
        mpdel_qmark $n muppet_frog
        mpdel_qmark $n muppet_no
        mpdel_qmark $n muppet_smily
        mpdel_qmark $n muppet_lasso
        mpdel_qmark $n muppet_snake
        mpdel_qmark $n muppet_rabbit
        mpdel_qmark $n muppet_tiger
        mpadd_qmark $n muppet_oscar -1 0 0 0 0 1
        say 快去從青蛙玩偶開始找吧！
        sigh
        worry $n
endif
"""

