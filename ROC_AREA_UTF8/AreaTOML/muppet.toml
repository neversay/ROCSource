spec_flags = ["ALY_DI", "ALY_DH"]
[[mobiles.65404.programs]]
trigger = "talk_prog"
argument = "help"
script = """
if is_qmark($n) != muppet_grover_save
	mpechoat $n 你向葛羅佛表達了想要幫助人偶鎮的意思...
	mpechoaround $n $N 向葛羅佛表達了想要幫助人偶鎮的意思...
	mpadd_qmark $n muppet_grover_save -1 1 1 0 0 1
	mpcallout 1 mpecho $I 看起來很驚訝的樣子...
	mpcallout 2 say 喔，你想要幫助我們脫離馬佛德的統治阿？
	mpcallout 3 bow $n
	mpcallout 4 say 那真是太好了
	mpcallout 5 pon
	mpcallout 6 say 如果有興趣的話就跟我說(talk)吧。
	mpcallout 6 say 我聽到了一些關於馬佛德的傳聞(news)，或許對你會有點幫助，
	mpcallout 7 say 在鎮內雜貨店裡面的歐尼應該知道很多事情...
	mpcallout 7 say 對了，或許你應該多蒐集點資訊(information)，對你會有更多的幫助。*
endif
"""
[[mobiles.65404.programs]]
trigger = "talk_prog"
argument = "news"
script = """
if is_qmark($n) == muppet_grover_save
	nod
	say 我最近打聽到馬佛德的老巢在某個隱密的地方，
	say 沒有特殊的方法是無法進入的，至於那特殊的方
	say 法，我也不是很清楚了。
endif
"""
[[mobiles.65404.programs]]
trigger = "talk_prog"
argument = "report"
script = """
if is_qmark($n) == muppet_grover_save 100005
	mpmod_qmark $n muppet_grover_save v0 = 6
	bow $n
	say 謝謝你打倒了馬佛德，拯救了我們！
	mpechoat $n $I 解下了他身上的披風，交給了你...
	mpechoaround $n $I 解下了他身上的披風，交給了$N ...
	mpoload 65405 $n viclv target
	say 我們會永遠記得你的！
	wave
endif
"""
[[mobiles.65404.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) == muppet_grover_save 100002
	? $n
	say 你應該去幫派那邊去找線索啦
	say 幹嘛來找我
else
	if is_qmark($n) == muppet_grover_save 100003
		 mpmod_qmark $n muppet_grover_save v0 - 1
		 say ok...你可以重新去找線索了
	else
		if is_qmark($n) == muppet_grover_save 100004
			 if is_qmark($n) != muppet_grover_save 200007
				mpmod_qmark $n muppet_grover_save v0 - 1
				say 你現在可以重新挑戰馬佛德了
				say 加油阿
			 endif
		else
			if is_qmark($n) == muppet_grover_save 100006
				say 你已經完成了這個任務了
			endif
		endif
	endif
endif
"""

