[rooms.65400]
name = "人偶鎮的入口"
description = """
你正位於人偶鎮的入口，據說這裡的居民全都是人偶，而且是受到某種詛咒的關
係。這激起了你的冒險者的血液，這裡或許正等著你去拯救他們呢！但是這裡的景象
卻讓你有點提不起勁的感覺，因為從這裡望去，跟普通的城鎮沒有什麼兩樣，或許不
一樣的東西正在裡面等著你呢。
     這裡好像有個不怎麼重要的匾額(small tablet)。
"""
flags = ["DARK", "NO_MOB"]
sector = "CITY"
[[rooms.65400.extra_descriptions]]
keywords = "small tablet"
description = """
++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
+                                                                    +
+                這個區域是由Reticent所改編為ROC的區域格式           +
+                      再經由Cake大幅改編而成                        +
+                    原作名稱:芝麻街(sesame street) (?)              +
+                          BY   Cake                                 +
+                    PS:此地為25-31的練功區域                        +
+                   此地的Quest難度或許需要點巧思:P                  +
+                如果真的解不出來就去小小的請教一下老手吧            +
++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
"""
[[rooms.65400.extra_descriptions]]
keywords = "更新履歷update"
description = """
2022/10/23 開放所有等級玩家進入人偶鎮，移除該格 room_mask north default 等級 37 的限制。
"""
[rooms.65400.exits.north]
description = ""
keywords = ""
locks = []
key = 0
to_room = 65401
[rooms.65400.exits.south]
description = ""
keywords = ""
locks = []
key = 0
to_room = 5257
[[rooms.65400.programs]]
trigger = "room_enter"
argument = "1 100"
script = """
if is_qmark($n) == muppet_mage
	force mage-tower say 你想出去嗎？
	force mage-tower say 那可不行，我得做完我的研究，否則可能會受到嚴厲的處罰阿！
	force mage-tower say 我先回去了...
	force mage-tower mpecho 永恆之塔法師(mage)轉身回人偶鎮去了...
	force mage-tower mpdel_qmark $n muppet_mage_help
	force mage-tower mppurge self
	del_qmark $n muppet_mage
endif
"""

[rooms.65401]
name = "道路"
description = """
你從入口來到了人偶鎮內，來到了這裡，你才發現謠言果然是真的，這裡的一切
都和普通城鎮沒什麼差別，除了居民全都是人偶之外....雖說是人偶，但是他們的日
常生活還是跟常人無異，會說話，會走路，看來即使變成了人偶，好像也不會構成什
麼不方便，除了外型之外。往北可以繼續深入探索這裡，東邊則是一個小店舖。
"""
