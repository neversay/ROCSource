[[mobiles.65407.programs]]
trigger = "talk_prog"
argument = "where"
script = """
if is_qmark($n) == muppet_hooper
	ponder
	say 你說我的玩偶？
	say 那被瓊斯(Jones)借走了喔...
	say 你自己去拿吧，對了順便提醒(remind)他來拿他要的桶子
	say 他大概又忘了...
	mpdel_qmark $n muppet_hooper
	mpadd_qmark $n muppet_tiger -1 0 0 0 0 1
endif
"""
[[mobiles.65407.programs]]
trigger = "talk_prog"
argument = "jewel smith"
script = """
sigh
say 沒錯，我本來是個珠寶匠
say 看來是那個常來店裡玩的小孩告訴你的...
say 這樣吧，我可以幫你做一些合成(mix)的工作。
"""
[[mobiles.65407.programs]]
trigger = "talk_prog"
argument = "mix"
script = """
say 我可以幫你進行鑽石的精煉工作。
say 規則就是五顆粗糙鑽石和一顆魔力寶石可以提煉出一顆精緻鑽石。
say 二十顆的精緻鑽石加上十顆魔力寶石則有機會可以提煉出星之鑽石！
say 但是在星之鑽石的部分有風險，我個人預估成功的機率大概只有百分之三十左右。
say 只要你先給我粗糙或是精緻鑽石我就可以知道你的目的了。
"""
[[mobiles.65407.programs]]
trigger = "give_prog"
argument = "65428"
script = """
mpjunk crude
if is_qmark($n) != muppet_crude
	mpadd_qmark $n muppet_crude -1 0 0 0 0 1
	mpmod_qmark $n muppet_crude v0 + 1
	say 好，請給我另外的四顆粗糙鑽石。
	say 然後再給我魔力寶石。
else
	if is_qmark($n) == muppet_crude 100001
		say 好的，剩下三顆。
		mpmod_qmark $n muppet_crude v0 + 1
	else
		if is_qmark($n) == muppet_crude 100002
			say 好的，剩下兩顆。
			mpmod_qmark $n muppet_crude v0 + 1
		else
			if is_qmark($n) == muppet_crude 100003
				say 好的，剩下最後一顆。
				mpmod_qmark $n muppet_crude v0 + 1
			else
				if is_qmark($n) == muppet_crude 100004
					say OK，請給我最後的魔力寶石作為引子。
					mpdel_qmark $n muppet_crude
					mpadd_qmark $n muppet_crude_gem -1 0 0 0 0 1
				endif
			endif
		endif
	endif
endif
"""
[[mobiles.65407.programs]]
trigger = "give_prog"
argument = "23"
script = """
mpjunk gem
if is_qmark($n) == muppet_crude_gem
	mpdel_qmark $n muppet_crude_gem
	mpoload 65429
	say 完成了！
	give bijou $n
	drop bijou
	say 這是你的精緻鑽石。
else
	if is_qmark($n) == muppet_bijou_gem
		if is_qmark($n) < muppet_bijou_gem 100009
			mpmod_qmark $n muppet_bijou_gem v0 + 1
			say 我收到魔力寶石囉，但是數量還不夠，再拿更多來吧！
		else
			mpdel_qmark $n muppet_bijou_gem
			say 好了，開始吧
			mpecho $I 開始了精煉星之鑽石的工作....
			if rand(30)
				mpdel_qmark $n muppet_bijou_gems
				mpoload 65430
				say 成功了！
				mpecho $I 面露驕傲的神色...
				give star $n
				drop star
				say 我的手藝果然還沒退步啊...
				cac
			else
				mpdel_qmark $n muppet_bijou_gems
				mpecho $I 露出尷尬的神色...
				say 失敗囉...
				say 下次在努力吧。
				wave
			endif
		endif
	endif
endif
"""
[[mobiles.65407.programs]]
trigger = "give_prog"
argument = "65429"
script = """
mpjunk bijou
if is_qmark($n) != muppet_bijou
	mpadd_qmark $n muppet_bijou -1 0 0 0 0 1
	mpmod_qmark $n muppet_bijou v0 + 1
	say 你要做星之鑽石，好吧，請先把精緻鑽石給我再給我魔力寶石。
	say 需要20顆喔，你現在拿了1顆。
else
	if is_qmark($n) < muppet_bijou 100019
		mpmod_qmark $n muppet_bijou v0 + 1
		hmm
		say 我收到精緻鑽石囉，但是數量還不夠，再拿更多來吧！
	else
		hmm
		say 行了，你已經拿了20顆給我了，接下來請給我10顆魔力寶石吧！
		mpdel_qmark $n muppet_bijou
		mpadd_qmark $n muppet_bijou_gem -1 0 0 0 0 1
	endif
endif
"""
[[mobiles.65407.programs]]
trigger = "give_prog"
argument = "all"
script = """
say 你給我這個幹嘛？
drop $o
"""

