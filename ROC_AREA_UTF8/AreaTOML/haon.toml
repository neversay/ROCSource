[mobiles.6009]
keywords = "hermit forest"
short_description = "森林隱者(forest hermit)"
long_description = "森林隱者(forest hermit)坐在這裡，慈祥地招呼你過來。\n"
description = """
他很削瘦，但精神奕奕。
"""
act_flags = ["NPC", "SENTINEL", "SCAVENGER"]
affected_flags = ["DETECT_INVIS", "DETECT_MAGIC", "DETECT_HIDDEN", "INFRARED"]
alignment = 1000
level = 22
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = -300
mod_svs = 0
dodge = -200
mod_pp = 0
gold = -1
sex = "male"
[[mobiles.6009.applies]]
type = "EXP"
degree = -300
[[mobiles.6009.programs]]
trigger = "greet_prog"
argument = "100"
script = """
if ispc($n)
	if is_qmark($n) != western_hermit
		say 孩子，走過來一點....
		say 聽馬修說最近有位上進的年輕冒險者，難道就是你嗎？(yes/no)
	endif
endif
"""
[[mobiles.6009.programs]]
trigger = "talk_prog"
argument = "yes"
script = """
if is_qmark($n) != western_hermit
	mpadd_qmark $n western_hermit -1 1 1 1 0 1
	say 既然是這樣，我要給你一項寶物。
	smile $n
	say 不過在此之前，我想看看你的能力....
	say 黑森林西北邊有一條綠龍，如果你能打敗它，
	say 把它的眼珠拿給我，我就認為你值得我的幫助。
	say 我給你一點建議，注意別把 wimpy 設成零喔！
	wave $n
endif
"""
[[mobiles.6009.programs]]
trigger = "talk_prog"
argument = "no"
script = """
sigh
"""
[[mobiles.6009.programs]]
trigger = "give_prog"
argument = "6019"
script = """
if is_qmark($n) == western_hermit 300005
	say 你已經解過此任務了.
	drop eyeball
	break
endif
if is_qmark($n) == western_hermit 100001
	say 你確定你有見到綠龍嗎？
	drop eyeball
	break
endif
if is_qmark($n) == western_hermit
	mpmod_qmark $n western_hermit v2 = 5
	clap $n
	good
	mpjunk ball
	mpoload 6020 18
	give pill $n
	mpgold $n 20000
	if class($n) < 5
		mpexp $n 1000
	else
		mpexp $n 500
		mpmod_qmark $n western_hermit v1 = 2
	endif
	say 這是你的獎勵！希望能對你有所幫助。
	wave $n
endif
"""

