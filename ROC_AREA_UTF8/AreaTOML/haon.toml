long_description = "森林精靈夏高(Brownie Shargugh)微笑地看著你。\n"
description = """
這個褐髮褐眉的森林精靈只有三呎高，他穿著間雜褐色與綠色的衣服，看起
來正在享受森林的清靜氣氛。
"""
act_flags = ["NPC", "SENTINEL"]
