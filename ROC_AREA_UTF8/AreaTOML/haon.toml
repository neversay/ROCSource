[mobiles.6000]
keywords = "john-haon lumberjack"
short_description = "樵夫約翰(John the Lumberjack)"
long_description = "樵夫約翰(John the Lumberjack)住在這很多年，也許你能請教他有關森林(forest)的事。\n"
description = """
他是一位六呎高、強壯的男人，衣服下是強壯的肌肉。他的特徵帶著努力的辛勞，
他嚮往一個平靜安寧的普通人生活。
"""
act_flags = ["NPC", "SENTINEL"]
affected_flags = ["DETECT_EVIL", "DETECT_INVIS"]
alignment = 350
level = 15
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = -1
sex = "male"
[[mobiles.6000.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 這個森林(forest)的事，沒人比我清楚。
"""
[[mobiles.6000.programs]]
trigger = "talk_prog"
argument = "forest"
script = """
nod $n
mpcallout 1 mpcall talk_1 $n
mpcallout 1 mpechoaround $n $I 裂開大口對 $n 笑著。
mpcallout 2 mpcall talk_2 $n
mpcallout 3 say 這座森林東邊的出口就是史卡拉貝城，東南方是小惡鬼的棲息地，
mpcallout 4 say 北邊通往綠樹王國，西北邊可抵達新囤墾區(shire)，神秘的魔法高塔
mpcallout 5 say 在森林的西邊，西南方是遠古沼澤以及人類的要塞，
mpcallout 6 say 不過那裡我就不大清楚了....
mpcallout 7 bow $n 
mpcallout 7 say 我所知道的就是這些了，祝你們旅途愉快。
mpcallout 8 wave $n 
"""
[[mobiles.6000.programs]]
trigger = "defun_prog"
argument = "talk_1"
script = """
say 你問對人了，史卡拉貝西方的這座森林相當廣大，
say 要是沒有人說明，一般旅人很容易迷失。        
"""
[[mobiles.6000.programs]]
trigger = "defun_prog"
argument = "talk_2"
script = """
say 這座森林一般人簡稱西方黑森林，裡面都是幾千年的蒼天巨木。
say 史卡拉貝陸上的對外交通大半都要經過這裡，所以基本上森林
say 裡沒有太危險的動物。
"""
[[mobiles.6000.programs]]
trigger = "talk_prog"
argument = "shire"
script = """
say 這個郡是一個新的囤墾區。
"""

