race = "Elf"
[[mobiles.6115.programs]]
trigger = "talk_prog"
argument = "topic"
script = """
say 這個森林很容易迷路，最好畫個地圖。
"""
[[mobiles.6115.programs]]
trigger = "greet_prog"
argument = "70"
script = """
if isnpc($n)
or is_qmark($n) == western_brownie
	break
endif
say 我肚子好餓(hungry)。
"""
[[mobiles.6115.programs]]
trigger = "talk_prog"
argument = "hungry"
script = """
if is_qmark($n) == western_brownie
	break
endif
sigh
say 最近一直沒機會到史卡拉貝購物，每天都吃些漿果磨菇，
say 真懷念咕嚕咕嚕野豬酒吧的烤雞(fried chicken)啊，想到就流口水。
mpecho $I 的口水都滴出來了。
"""
[[mobiles.6115.programs]]
trigger = "talk_prog"
argument = "chicken"
script = """
if is_qmark($n) == western_brownie
	break
endif
mpecho $I 睜大了眼睛看著 $n
say 喔？太幸運了！你有嗎？可不可以分我一點？
"""
[[mobiles.6115.programs]]
trigger = "give_prog"
argument = "3011"
script = """
if is_qmark($n) == western_brownie
	say 謝謝，不過我剛吃飽而已，還不餓。
	give fried $n
	break
endif
mpadd_qmark $n western_brownie 10 1 0 0 0 1
say 啊，謝謝，謝謝....
mpecho $I 迫不及待地吃起烤雞。
eat fried
ponder
say 無功不受祿，我告訴你一個有用的消息做交換吧。
say 早上我在森林南方的河堤上看到一些藍莓，這是那個孤僻的得魯伊教士(druid)
say 最喜歡吃的，不過只有我知道那裡採得到。你如果把藍莓送給他，
say 他應該會有好東西給你吧...
mpoload 6016 17
mpat 6121 drop druid
smile $n
"""
[[mobiles.6115.programs]]
trigger = "talk_prog"
argument = "druid"
script = """
say 他呀，他很孤僻，自己一個人住在黑森林北邊一個樹洞裡。
"""

