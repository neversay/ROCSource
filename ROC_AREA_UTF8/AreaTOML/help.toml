獲得較高的生命力加成。受到攻擊時，實體遭受的傷害也會比較少。簡單
的來說，就是耐衝擊、耐操、新陳代謝較強。那些習慣以血換血的蠻俠們
可從來沒有在這項能力上面鬆懈！
"""

[[helps]]
level = 0
keywords = "SIZE"
text = """
Size (體型)

    在幻世大陸上充滿著許多神話中的奇異生物，且各個種族天生的體型
都不盡相同，現存的各種大小的生物，都是在長久的演化鬥爭中幸存下來
的勝利者，因此不同體型的生物，必定擁有其獨特的生存之道，沒有一定
的優劣。像是體型越大的生物對衝擊有較高的抵抗力，給予的物理傷害力
也比較高，但其巨大的身驅會造成移動能力下降，並且無法進入一些狹小
的空間或通道，而體型較小則剛好與之相反。

    雖然體型是每個種族天生固定的數值，但也可以靠著後天的裝備來把
自己體型變得較大。像是騎乘(ride)座騎就會增加角色整體的體型。
"""

