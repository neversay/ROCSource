[[helps]]
level = 0
keywords = "AUCTION BID"
text = """
指令格式： auction <物品> [價錢]
指令格式： auction id <物品>
指令格式： auction cancel
指令格式： bid <物品> <價錢>

AUCTION 指令可以讓你拍賣一樣物品，指定的價錢是一個數字，如果不指定的話，
拍賣會將會以物品的公定價格來進行拍賣，不過拍賣的價格最低是一枚金幣。
整個混沌幻世中同時間只能存在一件同名物品拍賣的交易，如果已經有人在賣
東西的話，你可以輸入 AUCTION 不加參數來觀看物品的基本資料.
AUCTION ID 可以看到物品的詳細資料，但你必須付出一定的物品鑑定費用。
AUCTION CANCEL 可以讓賣方取消這一次的拍賣。

BID 指令可以用來叫價，當然先決條件是要有東西正在賣才有用，由於拍賣只被允
許在ROC世界的酒店中進行，所以一切的金錢交易都是透過銀行轉帳進行的。
如果 BID 沒有指定價錢，則會顯示目前的物品拍賣價格狀態。

目前你不可以在混沌幻世中的任何一個地方拍賣及叫價，拍賣會會幫你保管拍賣
的物品和處理金錢的交易，不過拍賣成功後你必須付出最終拍賣價錢的 5 - 10 ％
做為手續費，而且你在拍賣交易過程中不能中途離開遊戲(QUIT).

在不同的時空之間無法互相拍賣，必須要在同一個時空才能夠叫價。正在拍賣東
西的人同時也可以出價購買別人拍賣的東西。

請記住，你只能夠在各大酒店中執行以上的指令。
"""

