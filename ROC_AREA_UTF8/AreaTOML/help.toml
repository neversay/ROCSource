天地開墾。
西方最早出現的新都市是望鄉港，那是人類艦隊最早到達時登陸的海口港。經過
兩百年的慘澹經營，望鄉港終於取代了史卡拉貝，成為新大陸最大的近洋海港；
另一部份的移民前往史卡拉貝南方的密登尼森林，試著與小惡鬼建立良好的關係
，可惜最終以悲劇收場；有一部份無業遊民從矮人族口中打聽到了有關大礦山的
