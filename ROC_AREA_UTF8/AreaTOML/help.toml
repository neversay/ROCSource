[[helps]]
level = 0
keywords = "'ACID BREATH' 'FIRE BREATH' 'FROST BREATH' 'GAS BREATH' 'LIGHTNING BREATH'"
text = """
指令名稱：龍之強酸吐息(acid breath)   龍之灼熱吐息(fire breath)
指令名稱：龍之冰霜吐息(frost breath)  龍之毒氣吐息(gas breath)
指令名稱：龍之閃電吐息(lightning breath)
指令格式：cast 'acid breath'      <生物>
指令格式：cast 'fire breath'      <生物>
指令格式：cast 'frost breath'     <生物>
指令格式：cast 'lightning breath' <生物>
指令格式：cast 'gas breath'       <生物>
使用時機：開戰前與戰鬥中

龍之吐息是龍族的天生技能，以氣態激流的方式朝目標持續性噴射，不僅能將眼
前的目標毀滅殆盡，特定屬性的吐息還能破壞盔甲、攜帶物、甚至是使人中毒。
而其威力主要源自於龍族將自身強大的生命力融入於魔力之中，因此龍之吐息是
具有生命的法術。

讓魔力具有生命的特性並不是一件容易的事，如果能知悉其運作方式將會是魔法
史上的一大創舉。也因此法師公會的高層們早窺覬這神秘法術已久，而這野望終
於靠著第三次衛城之役的材料得以成真。

了解龍之吐息的秘密後，第三次衛城之役中的首要的目標是知道如何防御這種強
力的法術。法師公會發現到帶有生命的魔力具有黏著於目標身上的特性，如果多
次被同樣的吐息擊中，將會使目標受到更加嚴重的傷害。公會以此為準，進一步
發現對黏著性的防禦抗性並將其定義為吐息抗性(Save vs Breath)，此種抗性越
高將可以抵抗多次吐息加劇的傷害。此外公會也發現到，當前的吐息都具有特定
屬性，針對該屬性抗性越高將可以直接降低傷害。

雖然法師已明白如何使用龍之吐息，但非龍種族的肉體在施放吐息後將無法承受
後續帶來的衝擊，後果往往以施法者自滅告終。藉由多次的改良後，法師們發現
到重要的是結果，不必執著於自身施放，所以改由將生命力及魔力傳輸於元素生
物，使其作為施法媒介施放吐息。

然而由這些由元素組成的生物卻是把雙面刃，如果召喚者的抗性不夠高，卻又召
喚出過於強大的元素生物，反將受到召喚物身上元素反噬，無異於引火自焚。因
此想發揮龍之吐息的破壞力，需有夠高的生命力與對應的抗性。

以下是抗性與吐息表：
酸爆吐息               土抗性
火焰吐息               火抗性
冰凍吐息               水抗性
雷電吐息               雷抗性
劇毒吐息               風抗性
"""

