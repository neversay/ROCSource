LIST 若不加參數，會列出店裡所有能賣的物品；而LIST <物品名>則會列出有關該
物品的所有商品，LIST all則能列出所有物品，如果同格房間存在複數的商人時，
使用 LIST <物品名> <商人名> 能列出指定商人持有的物品。如果想知道特定商人
持有的所有商品，能使用 LIST all <商人名> 則能列出指定商人的所有物品列出。
BUY , SELL , VALUE 指令加入 <商人名> 則可以指定商人。

此外，LIST <部位名> 可以列出能裝備在此部位的裝備
list finger     (手指)  通常是戒指(ring)
list neck       (脖子)  通常是護身符、項鍊(amulet necklace)
list body       (身體)  通常是護甲(armor plate)
