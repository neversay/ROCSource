[[helps]]
level = 0
keywords = "'FIREARM MASTERY'"
text = """
指令名稱：槍械精通(firearm mastery)
指令格式：無
使用時機：學習後自動使用

炸藥一種遇到外來能量刺激就會產生大範圍高能反應的物質。就廣意上來講，
任何不穩定物質都可以成為炸藥，是種在鍊金過程中相當常見的副產物。

雖然炸藥只是鍊金過程中的一個環節，並不是鍊金的目的，但有少部分鍊金師
被爆炸時所產生的高能與震撼力深深吸引。在百年前就有對一群鍊金師同好認
為「爆炸才是浪漫！」，這群人從而偏離傳統的鍊金道路，開始對炸藥作起了
深入研究。

然而這群人想都沒想到的是，他們的研究從浪漫出發卻對往後的歷史有著重大
影響。炸藥因他們的研究廣為世人所熟知，也因此產生出槍械這種熱兵器。

普通人手持裝載鉛彈的槍械對上類人種族，就能產生一定程度的威脅性，但在
面對風之大陸上的奇異生物時，這就略顯不足了。其一是，沒經過訓練會有命
中率不足的問題；其二是，僅有單點的物理傷害無法對大型的生物造成致命傷
害，與使用箭矢無異。發現問題後，這群的鍊金師們討論出了解決方法。

關於第一點，這群的鍊金師們發展出一套優秀的槍械作戰系統(autocombat)，
熟練後不僅能有效提高射擊命中率，在戰鬥中還能行雲流水地填裝(reload)彈
藥，這套作戰方式甚至還教導要如何才能把彈藥(ammo)投擲(throw)得更遠，不
過理論歸理論，最終還是得靠勤奮練習才能解決；而關於第二點，鍊金師採用
最簡單解法，直接對彈藥作魔法附加的處理，等同直接把法術打入敵人體內，
以此解決傷害力不足的問題。

使用槍械戰鬥是一件相當不便的事情，事前需要作足大量準備並且要攜帶大量
的彈藥在身上，對於本來就力量不足的法師而言，這是相當致命的缺點。況且
追根究底，最終都是以法術傷害為主，那鍊金師從一開始就直接以拿手的多重
施法(multi casting)把敵人轟上天不就行了嗎？

時至今日，這套以槍械為中心的系統，在法師中已經沒人在使用了，在公會中
自然也找不到人學習。但這套系統也並沒有因此佚失，反而還相當受歡迎，在
許多只懂得用槍的獵人間備受青睞。

如果你內心也存有一絲浪漫，也許能找位經驗老道的獵人討教。


相關說明：魔精石提煉術(abstraction)
          魔具專精(artifacts mastery)
          投擲物品(throwing)
          作戰型態(autocombat)
"""

