指令名稱：綠龍狂焰(green breath)
指令格式：perform 'green breath' 或 cast 'green breath'
使用時機：開戰前或是戰鬥中

視覺系幻術。

幻法師可以在戰鬥中製造綠龍噴出吐息的幻象來迷惑敵人，利用龍族天
生對於其他種族的震攝來使敵人受到傷害。並且讓敵人產生中毒的幻象。

如果施法者本人的心靈停留在增幅狀態，且我方隊伍中有以體魄為主要
修練項目的隊友，則施法者可以利用隊友的心靈附加更強大有力的超級
幻象，造成更大傷害。
"""

[[helps]]
level = 0
keywords = "EXCITED"
text = """
指令名稱：亢奮(excited)
指令格式：eat corpse
使用時機：吃完屍體之後自動產生

獸人吃到等級高的屍體時會特別興奮，同時也會提高本身的戰鬥意志。不過要小
心，等級太高或是太低的屍體都無法使獸人興奮。
"""

[[helps]]
level = 0
keywords = "ASSASSINATION"
text = """
指令名稱：暗殺(assassination)
指令格式：assassination <生物>
使用時機：開戰前指定目標，開戰中對手

刺客一旦決定暗殺某人，會以迅雷不及掩耳的速度給予敵人背刺，同時為了防止
失手而使敵人有喘息的機會，會自動獵殺敵人。老練的刺客在暗殺目標時會先快
速掃過目標的弱點，使每一下傷害達最大化。熟悉暗殺及背刺(backstab)技巧的
刺客，甚至能利用夜晚的黑暗，靈巧背刺死鬥中的敵人，其中更有技術高操到不
需在夜幕的保護下也能熟悉背刺敵人的高手。充滿野性的刺客則可以運用自身的
野性(berserk)直覺切入死鬥中的敵人死角進行背刺。

刺客對暗殺中的目標有額外的傷害加成，暗殺的傷害加成與技能等級有關。

在戰鬥中如果還沒有暗殺中的目標，直接下 assassnation 指令則會暗殺當前的
對手，如果想取消暗殺中的目標，在 assassnation 後不加目標即可取消對目前
獵物的暗殺狀態。
"""

[[helps]]
level = 0
keywords = "'ARCHERY'"
text = """
指令名稱：箭術(archery)
指令格式：無
使用時機：學會後戰鬥中自動使用

弓箭是安全且殺傷力高的武器，但想完整發揮弓箭的威力，就必需先懂得箭術。
但如此強大的武器也有著致命的缺點，當弓箭手被敵人拉近距離時，將沒有空閒
拉弓射擊，只能拿手裡的弓與敵人進行肉搏戰。

面對這缺陷，弓箭手們不僅沒有放棄使用這武器，反而還發展出不同的技藝來克
服這道難題，讓他們在激戰中也能隨心所欲的射擊。像是北方擅長騎術(ride)的
奧夫卡弓箭手就發展出騎馬射箭的技藝，他們利用座騎的速度優勢與近身的敵人
拉開一小段距離，並在移動的過程中引弓射擊；另外有一派盜賊出身自稱俠盜的
弓箭手群，則靠著自身敏捷的優勢利用獨特的步調(tricky pacing) 把敵人耍得
團團轉，以此爭取到拉弓的機會。

但如果弓箭手對這兩項技藝都不熟練，那只需要找個人來保護(protect)，如此
就能心無旁騖一箭一箭的把敵人射成馬蜂窩了！

當箭術技巧達到一定等級後，可以使用兩種 perform (需求等級不同) 分別為：
perform trueshot  -- 效用為提升命中率。
perform powerbolt -- 效用為提升傷害力。

相關說明：魔彈射擊(powerbolt)
          精準射擊(trueshot)
          流星箭(meteoric arrow)
          魔法箭(magic arrow)
          保護目標(protect target)
          騎術(ride)
          詭譎步調(tricky pacing)
"""

[[helps]]
level = 0
keywords = "'MOON NIGHT'"
text = """
指令名稱：月夜(moon night)
指令格式：無
使用時機：自動使用

吸血鬼在夜晚能夠發揮出屬於闇之種族的最高力量，不但作戰能力加強，身體也
呼應著月亮強大的魔力而擁有再生的能力，一改白天孱弱的模樣，使得吸血鬼成
為夜晚的帝王。
"""

[[helps]]
level = 0
keywords = "'BREAK SHIELD'"
text = """
指令名稱：破盾術(break shield)
指令格式：無
使用時機：戰鬥中自動使用

只要有盾牌在手，就好像多了一層裝甲。對於防守的人來說，他是一個相當好用
的防具。但是對於攻擊的人來說，他就是一個很礙眼的東西了。使用盾牌不需要
高強的技巧，於是常常人手一盾，高強的戰士們為此傷透了腦筋，最後發展出使
敵人拋棄盾牌的方法，攻敵之必救，然後迅速的打落他的盾牌，接下來，他就成
為肉靶了！

熟練此技巧的劍客甚至能將盾牌視為無物，以霸皇劍(empslash)穿透敵人防禦。

相關說明：盾牌(shields)
          霸皇劍(empslash)
          衝刺(charge)
"""

[[helps]]
level = 0
keywords = "'WIND SCREAMING'"
text = """
指令名稱：陰風怒號(wind screaming)
指令格式：cast 'wind screaming'
使用時機：開戰前或是戰鬥中

這是一個相當危險的法術，施法者催動法力使得風之精靈暴走，對附近的敵人造
成傷害，同時將敵人傳送到別的地方，至於傳送到哪裡去，連施術者也不知道。
據傳是某個法師因為憤怒過度，施展狂嵐術而意外失去控制發展出來的危險法術。
"""

[[helps]]
level = 0
keywords = "'POLYMORPH OTHER'"
text = """
指令名稱：種族變更術(polymorph other)
指令格式：cast 'polymorph other' <生物>
使用時機：開戰前與戰鬥中

謠傳中在某些邪惡的高等生物中流傳著邪法，能將人變成其他生物，但事實上未
有冒險者回報過此類消息，或許也是因為無法回報消息了吧....。
"""

[[helps]]
level = 0
keywords = "'REMOVE ALIGNMENT'"
text = """
指令名稱：陣營解除術(remove alignment)
指令格式：cast 'remove alignment' <物品>
使用時機：非戰鬥中

強力的古代魔法兵器或其他物品常設有保護該物的結界，使相對陣營者無法濫用
該物品，但在越來越混沌的世上，正邪的分界也混亂了，一個混亂的法師竟在巧
合中以相反的兩股力量中合掉物品上的保護結界，自此無陣營限制的物品漸多了
起來，但因為所使用的兩股不同的力量，若出力拿捏不當很容易便造成魔力的暴
走，對物品產生破壞性的影響。
"""

[[helps]]
level = 0
keywords = "'DEMON TREMOR'"
text = """
指令名稱：惡魔戰歌(demon tremor)
指令格式：perform 'demon tremor' 或 cast 'demon tremor'
使用時機：開戰前與戰鬥中

聽覺類幻術。

邪惡的法師不斷鑽研古魔法之下，發展出自己獨特的法術鏈結方式，將原本需多
次施展的邪法能在最快速最短的時間內爆發出來，傳聞中該法術施展時，那邪惡
法師的念咒聲竟如惡魔暴吼的聲音，短短的瞬間高度凝聚的邪惡力量籠罩了冒險
者們，下一瞬間只見所有的冒險者都癱倒在地！小心，這個法術會讓敵人瘋狂，
讓他們產生特強的力量，並且不分敵我亂打一氣！當你的團隊中招時，如果不小
心處理很容易變成大亂鬥，然後滅團。
"""

[[helps]]
level = 0
keywords = "'ADORE'"
text = """
指令名稱：英烈魂(adore)
指令格式：adore corpse , perform adore
使用時機：地上有屍體時，在英烈魂狀態下

在戰場上以武勇見稱的戰王，對自己的武藝與敵人的勇氣都同樣尊敬。
當他擊敗難得一見的好敵手，往往會立於對手的屍體前進行別人無法瞭解的尊崇
儀式，而這個儀式會加深戰王對戰鬥的信仰，使戰王的破壞力更強。一旦尊崇的
心被鼓舞起來，戰王很容易在戰鬥中得到更進一步的啟發，使得破壞力更強，但
命中率稍降，一直要到這份心情平息為止。

與燃燒生命殺到興奮的狂戰士不同，為了能夠跟更多強大的敵人對戰。戰王能藉
由對決時生死一瞬的刺激感，引發身體活化，快速回復自身的生命力。畢竟唯有
持續在戰場生存，才能繼續跟更多的強者對戰。
"""

[[helps]]
level = 0
keywords = "'EARTH SLASH'"
text = """
指令名稱：大地斬(earth slash)
指令格式：earth
使用時機：戰鬥中

如果說迴旋斬(circular chop)是戰王的拿手好戲的話，那大地斬(earth slash)
就是劍客的拿手絕活。將強大劍氣集中一口氣放出，便能夠劈開地面，震撼整個
大地。這招劍客的絕活不僅可攻擊所有的敵人，在威力上更是無可比擬。因此，
老冒險者常奉勸小鬼們，不要與劍客為敵！畢竟，誰都不想挨一發強力的劍氣，
掉到大地的裂縫裡。

這種運用強大劍氣的技法原本也是魔劍士們的得意劍技之一，然而隨著時代的改
變，狂劍士們在多次實戰後逐漸發現：倘若對手被風之枷鎖綑縛住，而自己又能
夠拋開所有的雜念與恐懼猛烈攻擊，就有可能施展出令其他劍士們望塵莫及，真
正的大地斬！
"""

[[helps]]
level = 0
keywords = "'SOBER UP'"
text = """
指令名稱：醒酒術(sober up)
指令格式：cast 'sober up' <玩家>
使用時機：非戰鬥中

因為酗酒人數愈來愈多，而且口齒不清又造成了許多溝通不便。史卡拉貝的牧師
公會決定投下大批人力，開發出新的法術，希望能夠解決這個問題。此法術是用
魔力強制性將體內的酒精排除到體外，因此需要耗費大量的體力。另外，原先因
為宿醉而導致的體力衰弱，在沒有酒精而不再亢奮的狀態下會更為的明顯。
"""

[[helps]]
level = 0
keywords = "'FLAMING SLASH'"
text = """
指令名稱：烈焰斬(flaming slash)
指令格式：flaming
使用時機：戰鬥中

相傳烈焰斬是劍豪托斯馬克的拿手必殺技。將全身的氣集中於劍身，利用快速揮
斬時的高溫，加上劍客本身灌注的精氣及魔力，發出劇烈炎氣。而等級越高的劍
客，由於豐富的經驗以及熟練的快速斬擊，能發出更強烈的炎氣。據說，大劍豪
托斯馬克在龍族大舉進攻的那場戰役中，利用烈焰斬發出席捲天地的強烈劍氣，
擊退了不少龍族，成為史卡拉貝城中的英雄。此劍法也成為魔劍士代代相傳的最
基礎絕招，所以能比其他型態的劍客擊出更多段的火焰波。

在多年的研究與改良後，有一部份的魔劍士研究出「火燄共鳴」的秘密，他們發
現只要精通某種火燄法術，就能讓烈焰斬的威力有著更進一步的提升！
"""

[[helps]]
level = 0
keywords = "'CIRCULAR CHOP'"
text = """
指令名稱：迴旋斬(circular chop)
指令格式：circular
使用時機：戰鬥中

原本英勇果敢的史卡拉貝戰士，在某次小惡鬼及獸人聯合入侵的戰役中，不幸的被
人山人海的敵人給團團包圍。許多戰技出群的勇士們，終因寡不敵眾而在這場戰役
中犧牲。因此，一名傳說中的戰士創造出此招數，並將其傳授給人們。
迴旋斬(circular chop)能一口氣斬擊所有正在攻擊戰士的敵人們。也因此，原先擅
長單打獨鬥的戰士們，有了一項能對付大舉來襲敵人的必殺技。
對於擅長團體戰鬥的戰王(Wrd)而言，在隊伍中有領主(Lord)指導的情況下，對付大
量的敵人時更能發揮出強大的威力，對陣型擁擠的敵人造成重大傷害。
"""

[[helps]]
level = 0
keywords = "'ARMOR MASTERY'"
text = """
指令名稱： 裝甲專家(armor mastery)
指令格式： 無
使用時機： 學習後自動使用

騎士們在經歷過無數大戰後，見到太多因不知利用裝甲而慘死的同伴，可是若配
了重裝來防衛卻又會降低攻擊能力。最後騎士們終於想出一個兩全之道，也就是
去瞭解每一件防具的特性，並利用周遭環境發揮其優點，使每一件護具都能超越
一般人使用時的防衛能力。使身上防具的基本防禦力得到更好的發揮。
"""

[[helps]]
level = 0
keywords = "'LANCE MASTERY'"
text = """
指令名稱： 槍術(lance mastery):
指令格式： 無
使用時機： 學習後自動使用

槍術是騎士專屬的技能，精通槍術的騎士，將能有優於其他職業駕馭槍的能力，
包括命中 / 攻擊次數 / 格擋(parry) / 衝刺(charge)，甚至引用槍的魔法力量
(artifact)。槍術技巧高超的騎士，甚至能將槍術應用在杖、槌、劍及刀等類型
的武器。
"""

[[helps]]
level = 0
keywords = "'TRICKY PACING'"
text = """
指令名稱： 詭譎步調(tricky pacing):
指令格式： 無
使用時機： 學習後自動使用

盜賊間流傳的一套詭異步法，使用匕首之類的短武器時，能夠踏出敏捷的步伐使
敵人掌握不到行為，從而閃躲(dodge) 攻擊，並讓自己有更多空檔給予對手更多
傷害，或著利用空檔來引發武器魔法力量(artifact)。練習過這項技巧的人能在
短兵對峙的距離內找到機會拉弓射擊，或是藉由視線昏暗的夜晚以鬼魅的步伐切
入敵人死角用匕首進行背刺(backstab)。而更加專精這技巧的人，甚至能在步法
中操作鞭、爪、牙等，攻擊模式不易掌控的詭異武器。
"""

[[helps]]
level = 0
keywords = "'MAGIC ARROW'"
text = """
指令名稱： 魔法箭(magic arrow)
命令格式： cast 'magic arrow'
使用時機： 非戰鬥中

鑽研射箭藝術極致的遊俠們，在達心物合一的境界後，慢慢的藉由對弓箭日積月
累的探索，推敲出利用心靈力量來提煉出不屬於這世間物質的魔法之箭。魔法箭
是利用遊俠本身的魔法能源，而擬構成形的武器。隨著創作者本身魔力量增加，
創造出來的魔法箭也會跟著威力提升。如此便利的代價就是使用魔法之箭射擊時
，遊俠們的魔力將會隨著箭支的消耗而逐漸流失。此外，魔法之箭只能被該創作
者擁有，無法被贈與，離開主人的魔法箭將消失於大地之中。
"""

[[helps]]
level = 0
keywords = "CIRCLE"
text = """
指令名稱：繞刺(circle)
指令格式：circle
使用時機：戰鬥中

一名受過訓練的刺客，可以在戰鬥中藉由隊友的掩護來找尋敵人的空隙，
在抓到機會後悄悄的繞到敵人身後給予致命性的刺擊，由於迅速寂靜的動
作使得敵人無法查覺到動向，所以能在敵人還來不及防禦閃躲的情況下命
中，專精於此的刺客更是恐怖的殺人機器，而一個敏捷過人的刺客更是能
在敵人還來不及反應的情況下再補上一擊。

不過使用此技巧需要注意的是，為了不妨礙行動，只能持用輕短的匕首類
武器，而且如果沒有充沛的體力是無法靈活運用此招的。
"""

[[helps]]
level = 0
keywords = "BAREHAND"
text = """
指令名稱：空手入白刃(barehand)
指令格式：barehand <生物>
使用時機：戰鬥中且在徒手攻擊(fist fight)狀態下

武僧在經過非人般的嚴厲訓練後，以其自身所鍛鍊出的良好動體視力與其過往的
經驗能看透對方攻擊的軌跡，進而在雙手空空的情況下阻礙對方進一步的攻擊，
曾經有人目睹過一個武僧雙手一扳就使對手的武器飛了出去，接著以空手就將對
方擊敗。
"""

[[helps]]
level = 0
keywords = "'FOOL FOE'"
text = """
指令名稱：移形換位(fool foe)
指令格式：無
使用時機：學習後戰鬥中自動使用

僧侶特有的高級閃避技巧，經過鍛鍊的僧侶將擁有迅捷無比的身法，藉此在戰鬥
中四處游移，除了可以閃躲敵人的攻擊之外，還能出其不意的將敵人絆倒。
"""

[[helps]]
level = 0
keywords = "SPELLCRAFT"
text = """
指令名稱：法術大師(spellcraft)
指令格式：無
使用時機：學習後施法時自動使用

一般來說施完一個法術後由於同時耗用體力與精力會進入短暫的失神狀態，但一
