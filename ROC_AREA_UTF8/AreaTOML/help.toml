SNEAK 可以讓你開始潛行，在你移動時就沒有人會察覺。

VISIBLE 會終止你的躲藏或是潛行狀態以及暗夜潛行(nightstalk)。
visible inv 可以停止你的隱形狀態，
visible hide 可以停止你的藏匿狀態，
visible sneak 可以停止你的潛行狀態，
visible nightstalk 可以停止你的暗夜潛行狀態，

HIDE 和 SNEAK 以及 NIGHTSTALK 的使用都必須先學習相關的技能。
"""

[[helps]]
level = 0
keywords = "QUIT SAVE BACKUP"
text = """
指令格式： QUIT
指令格式： SAVE
指令格式： BACKUP

SAVE 保存你的人物目前的狀態和物品，至少要升上第二級才能儲存進度，每次升
級，遊戲會幫你存，每五級會幫你備份，每天會由系統幫你備份該天的狀態。

這世界上有所謂的儲存點，這些大多都位在各地的酒吧、旅館、等地方，雖然在
非儲存點還是可以 SAVE，但如果你中途離線了，將會被傳送回這個時空的出發點
（/），而且生命力、魔法力、移動力都會減半。

某些物品，像是鑰匙、或是等級高過你許多的物品等，在儲存進度時都是不會被
保存下來的。

BACKUP 的功能和 SAVE 是一樣的，它可以讓你另存一個備份檔，如果檔案有損毀
時可以請大神幫忙讀檔，所以當你有重大成就時請別忘了備份。

QUIT 讓你離開這個遊戲，回到真實的世界。任何地方都可以使用這個指令。當你
在儲存點離開混沌幻世並重新進入遊戲，你會出現在原來的房間。但若你在非儲
存點 QUIT，你將會被傳送回這個時空的出發點（/）。

離開遊戲時會自動進行儲存的動作，所以你可以不用先儲存再離開。但是最好養成
這個習慣，以免可能在別的MUD中吃虧。
"""

[[helps]]
level = 0
keywords = "RECALL /"
text = """
指令格式： RECALL

RECALL 運用天神的神力，把你從任何地方帶回到這個時空的出發點。'/'是 RECALL
的簡寫。

如果你在戰鬥中使用RECALL，那就視同逃亡，而且會損失較多的經驗值，逃亡成功
的機率也較低。

使用RECALL會消耗你一半的體力。

在某些特殊的地方，RECALL有可能會失效，另外，某些區域可能有不同的 RECALL 點
，也就是說，不一定是會回到史卡拉貝城的聖殿。受到詛咒的玩者也不能使用本指令。
"""

