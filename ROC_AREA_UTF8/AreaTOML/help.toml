text = """
指令格式： cooperate <人物>
指令格式： cooperate self

COOPERATE 可以讓你協助特定的對象，你所協助的對象在使用部分技或法術時，可
能找你幫忙。天下沒有白吃的午餐，正常人不會平白無故接受陌生人無償的幫助，
在你協助別人前，必須先跟人混熟並成為同一個隊伍(group)的夥伴才行。

受協助對象並不會直接在戰鬥中得到任何優勢，僅作為特定組合技使用時作為優先
配合的對象。部分技能需要兩個人互相協助才能使用，只有單方面的協助依然無法
辦法使用。

輸入 cooperate self 將會停止協助當前的對象。
"""

[[helps]]
level = 0
keywords = "HIDE SNEAK VISIBLE"
text = """
指令格式： HIDE
指令格式： SNEAK
指令格式： VISIBLE

