list arrow      (箭矢)  通常是箭矢(arrow)
list hold       (手持)  除了一些小道具，還有捲軸，法杖(scroll wand staff)

BUY 用來在商店裡購買物品，如果加入 <數量> 的項目可一次購買數件相同商品。
例如 buy 10 potion，如果商人有足夠的商品時，則可一次購入 10 瓶 potion。

SELL 可以把你不要的東西賣給店主。

VALUE 可以請店主替你想賣的物品估價，作為參考。

在賣物品時，請記住要到相關的商店辦理，要賣武器，就得到武器店...依此類推。
