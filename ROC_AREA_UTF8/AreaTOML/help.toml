指令格式： note show
指令格式： note clear
指令格式： note post , note send
指令格式： note remove  <文章編號>

信件指令，可以發送訊息給群體或特定玩家，內容將於每次離開遊戲(quit)後更新。

NOTE LIST，列出所有你能讀的文章作者及標題。

NOTE READ <文章編號>，可以閱讀指定編號的文章。

NOTE SUBJECT <文章標題>，用來設定新文章的標題。

NOTE TO <收信人>，設定新文章的收信人，如果是<ALL>則代表所有人，
<IMMORTAL> 則代表所有的神族，<HERO>則代表所有英雄及神族。
另外你也可以指定多個收信人，如 <note to amenda pluto zcecil asla>。

NOTE + <一行訊息>，將一行訊息加入新文章中。

NOTE SHOW 檢視目前文章的內容。

NOTE CLEAR 清除目前編號中的文章。包含全部的內容、標題、和收信人設定。
(請注意：離開遊戲(quit)後，編寫中的內容也會被清除。)

NOTE POST 和 NOTE SEND 會將你的文章發出。
(請注意：文章不會自動發出，一定要確實輸入該指令。)

NOTE REMOVE 可以刪除自己發出的信件，或是將已讀過的信件刪除。
但寄給 ALL，IMMORTAL，HERO 的群體信不能被刪除。其他的信都可以被
寄、收信人砍掉，想留備份可以把自己的名字也加進收信人名單內。
"""

[[helps]]
level = 0
keywords = "CHAT 。MUSIC QUESTION ANSWER SHOUT YELL RUMOR HEROTALK"
text = """
指令格式： chat     <訊息>
