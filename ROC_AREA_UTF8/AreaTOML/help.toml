當領主越精進領導的要訣，所能用的技巧便越多
以下是各種戰術的技巧以及說明列表，越下方的戰術越需要高等的領導能力：

指令名稱：側攻
指令格式：自動生效
使用時機：戰鬥中，且領主本人為領隊
藉由領主的戰術掩護，所有領主麾下的隊員都可以在藏匿的狀態下背刺
(backstab)戰鬥中的敵人。

指令名稱：聯合衝鋒(United charge)
指令格式：perform ucharge
使用時機：戰鬥中，衝鋒的角色必須協助(cooperate)領主
同隊伍中協助(cooperate)領主並且會使用衝刺(charge)的隊員，在領主的率領一齊衝鋒，
對敵軍造成強大的損害。

指令名稱：亂箭砲轟(United fire)
指令格式：perform ufire
使用時機：戰鬥中，砲轟的角色必須協助(cooperate)領主
同隊伍中協助(cooperate)領主並且會使用流星箭(meteoric arrow)的隊員，在領主的率領
下精準的萬箭齊發，在敵人身上插滿箭矢。但要注意，如果隊員正在跟敵人纏鬥，可能會
