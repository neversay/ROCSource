指令格式： clan score <幫主名稱>
指令格式： clan chat
指令格式： clan status
指令格式： clan deposit <金錢數目>
指令格式： clan withdraw <金錢數目>
指令格式： clan level <冒險者名稱> <等級>
指令格式： clan title <冒險者名稱> <稱號>
指令格式： clan + <敘述>
指令格式： clan history <幫主名稱>
指令格式： clan clear
指令格式： clan transfer <冒險者名稱>
指令格式： help aedit
指令格式： help oedit
指令格式： help redit
指令格式： help mmedit

clan setup 是成立幫派的指令，當然成立者順理成章地就是幫主。
幫派名稱請勿使用不雅名字，否則大神會取消幫會。
成立一個幫派需要大筆金錢，並且幫主也要孚人望。
目前成立一個幫派需要八百萬金幣，幫主的等級至少要到 38 級，
威望值至少要有二點。

請注意，每一個幫派的名稱只能夠使用一次，如果這個名稱之前有人用了，將會
無法創立幫派。

clan accept 可以讓幫主接受其他冒險者成為幫派中的一員。想要加入一個幫會，
前提是，玩家必須選了要加入的幫派, 才能加入。

指令:
        clan join clan_leader_name       選擇要加入的幫派
        clan join cancel                  取消選擇

        另, quit 後不會被保留, 要加入則要再選擇
冒險者身上至少要有三萬元金幣，而幫派必須交十萬金幣。

clan retrieve 讓幫主或在幫內等級 3 以上的長老開除一位成員，該成員必
須和幫主或長老在一起，而幫派必須付出二十萬金幣。

clan leave 讓一位幫眾自己退出幫會，幫眾必須付出十萬金幣。

clan who 可以讓你知道目前有哪些幫中成員在線上。
clan who <幫派名稱> 可以讓你知道你所指定的幫派目前線上有哪些成員。

clan score <幫派名稱> 可以讓你知道這個幫派的發展狀況。

clan chat 幫派閒聊頻道，可以利用這個頻道與線上所有幫派成員閒聊溝通。

clan status 可以讓你知道目前所有派系的基本資料，好挑選一個強大的幫派加入。

clan deposit 把錢存進幫會的帳戶。

clan withdraw 從幫派的帳戶裡提錢。

clan level 可以讓幫主設定某位成員在幫中的地位。剛入幫時每位成員的起始等
級都是 0 級，而幫主是最高的 5 級。而某些特殊的幫派指令必須在幫中的地位夠
高才能執行。設定等級時會從幫派帳戶中扣繳 level * level * 10000 的金幣。

clan title 可以讓夠資格的幫中幹部為幫眾設定幫派稱號，但幹部的等級一定要比
較高才行。

clan + 這個指令是讓幫主寫出他的幫派的描述、理想、幫規.....等。
寫幫派敘述時建議用 copy/paste，先寫好再 copy 上來，會方便很多。

clan history 可以讓你看到那一個幫派的幫派描述。

clan clear 讓幫主清除掉所有的幫派描述。

clan transfer <冒險者名稱> 這個指令可以讓幫主傳位給幫眾，但是幫眾必須至少要
有當幫主的資格。

另外，還有更進階的幫派指令，請參照help oedit， help redit， help mmedit，
help aedit。
"""

