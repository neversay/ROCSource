GROUP <人物> 會讓某個跟隨你移動的人加入你的隊伍中。同一個隊伍的人在打倒
怪物時會分享經驗值，而每個人得到的量比自己單打獨鬥還多！
而彼此之間的溝通可以使用 GTELL。戰鬥後獲得的金幣可以使用 SPLIT來分配。
隊伍中的任何成員一旦被攻擊，同隊的其他人也會自動加入戰鬥。GROUP ALL 可以
一次把同一格內所有跟隨你的玩家加入你的隊伍中。

要將某人踢出你的隊伍，只要再'GROUP <人物>'一次就可以了。隊伍中的成員也可
以自行停止跟隨隊長，這樣也會脫離隊伍。

若是不加參數，GROUP 會列出隊中所有成員的狀況。

跟隨或是組隊的對象僅限於和你等級相差不超過5級的人物。
"""

[[helps]]
