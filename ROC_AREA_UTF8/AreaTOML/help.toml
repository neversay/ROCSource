升爆發力上的技巧(perform)。
這技巧會讓使用者短時間內所受的一切創傷都無法復原，但隨時遊走死亡邊緣卻
能讓狂戰士對血的渴望得到進一步的升華，以暗示來提高肉體的爆發力，甚至短
時間內受到致命的傷害都無法停止狂戰士的身體作出行動。
隨著空氣中血腥味濃度增加，會使狂戰士對血的渴望漸漸被滿足，直到最後恢復
