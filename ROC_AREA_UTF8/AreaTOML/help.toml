[[helps]]
level = 0
keywords = "TRANSPORT"
text = """
史卡拉貝與迷霧之島之間的交通主要是依賴船隻，要前往迷霧之島的玩家可以到維芬海港
搭乘渡船。豪華渡船每三個月一班，費用是一個人三十萬元。普通渡船七天一班，每個人
需要十萬元。詳細開船時間可以到維芬海港(2/的話是在迷霧海港)看告示。要特別注意的
是，船隻宣布開船到正式開船之前，會港口等候 6 個小時，請玩家把握時間。

    此外兩地間有不定期的走私渡船，玩家可以多多打聽看看。
"""

