狂戰士會因為對戰鬥殘暴的熱情而陷入忘我的瘋狂，破壞力會大幅得提昇。不管
是自己流的血或是敵人流得血，戰場上越是鮮血淋漓，他們的戰鬥力就越強。但
是過度的忘我則會因用力過度而降低命中率。但也可以藉著強烈的肉體訓練提高
自身生命力(hp)，來達到在一定的身體狀況下，還是保持著高命中率打擊敵人。

