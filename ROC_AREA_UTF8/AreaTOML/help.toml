不過易容終究有其極限，不是每種種族都能易容。
另，要結束易容狀態，只要perform morphing 後面不加任何參數即可。

"""

[[helps]]
level = 0
keywords = "EVADE"
text = """
指令名稱：迴避技巧(evade)
指令格式：自動使用
使用時機：戰鬥時

受過神秘訓練的忍者在忍者首領的訓練之下，研發出了一套閃躲魔法的恐怖技
巧。由於長年擔任偵察暗殺任務，少部分的菁英忍者為了在與法師的暗殺戰鬥
上取得優勢，便著手研究法術，最後終於成功地習得大部分基礎法術，連帶地
也掌握到閃躲法術的訣竅。

"""

[[helps]]
level = 0
keywords = "MARK"
text = """
指令名稱：標記術(mark)、返回術(recall)
指令格式：cast mark (下標記)、cast recall (瞬間返回標記處)
使用時機：非戰鬥時

這兩招是忍者用以偵察環境的便利法術之一，相傳在古老時代，拓荒隊伍為了探索
密林荒地，為了怕迷路便會在路上做標記以辨明方位，而深研法術的忍者也發展出
了一套利用自身法力當作標記的特殊技巧，只要在同一個區域內的某個房間施法，
等到迷路之時再循著法力的軌跡回到標記處。但是標記的存留有其極限，過了一段
時間便會自然消散，無法返回。另外，隨著技能的提升，忍者也能在更艱困的環境
裡，標記方位。也只有在Imm 集會大廳中，才無法施展標記術，且玩家無法在天牢
中使用返回術。

此外，提升返回術的技能等級將能有效減少施展返回術的法力點數花費。

相關法術：傳送術(teleport)
技能等級及特殊效果提示：
  ｌｖ２：可以在無法使用傳送術(teleport)的地方施展標記術。
  ｌｖ４：可以在無法祈求傳送(recall or /)的地方施展標記術。
  ｌｖ５：可以在無法使用傳送術(teleport)進入地方施展標記術。
  ｌｖ６：在施展標記術後，可在不同的時空點(recall 點)施展返回術返回原地。


"""

[[helps]]
level = 0
keywords = "SCOUT"
text = """
指令名稱：偵察技巧(scout)
指令格式：scout <方向>
使用時機：非戰鬥時

這是忍者在偵察複雜地形時最有利的一招，忍者利用良好的訓練以及特殊的技巧，往
某個方向偵察，並且得到那個方向限定範圍內的所有特殊情報，諸如出入口分佈、生
物分佈、物品分佈等詳細訊息都能偵察得到，是一個在迷宮中非常重要的技巧。另外
，在使用這個技巧時即使碰到敵方具侵略性的生物也不會引發戰鬥。最後要注意的一
點，初級的忍者必須吃飽喝足，才有辦法完成偵察，技巧高深的忍者，則能在口渴下
完成偵察，只有最強大的忍衛，才足以在飢餓中完成所有的偵察任務。

以下為技能展示部分：
\u001B[1;30m
你試著偵察靠近你的地方：\u001B[m
史卡拉貝南城牆 - [出口: 東 西]
    這裡是史卡拉貝新城牆的南面，從這裡你可以聽見不遠處史卡拉貝河的潺
潺流水聲，望見遠方的密登尼森林黑黝的林尖，偶而還會聽見遠方傳來的淒厲
狼嚎，令你毛骨悚然。城牆往東西方延伸。

城市警衛巴斯(Bus)正站在這裡，尋找有無危險份子。
此外，你敏銳的觀察力發現這裡似乎有什麼不對勁。
\u001B[1;30m
你試著偵察更遙遠的地方：\u001B[m
史卡拉貝南城牆 - [出口: 東 西]
    這裡是史卡拉貝新城牆的南面木製橋樑上，由於史卡拉貝港的河道阻斷了
城牆，所以守軍在這裡搭蓋了一座高空橋樑，讓行船的船帆不會撞上。你可以
欣賞此地商船忙進忙出的熱鬧情景，欣賞史卡拉貝河滔滔的河水，往南望見遠
方的密登尼森林黑黝的林尖，偶而還會聽見遠方傳來的淒厲狼嚎，令你毛骨悚
然。城牆往東西方延伸。

一個清潔工(janitor)正在打掃這裡的環境，可別亂丟東西。
此外，你敏銳的觀察力發現這裡似乎有什麼不對勁。
"""

[[helps]]
level = 0
keywords = "THROWING"
text = """
指令名稱：投擲物品(throwing)
指令格式：throw <物品名稱> <對象>
使用時機：戰鬥時，或者開戰用

投擲攻擊是智慧生物最古老的退敵方式，朝目標突如其來的丟擲物品，欲投擲的
物品必須攜帶在身上且不能裝備著，這樣才能出其不意的給予傷害。投擲對目標
造成的傷害量是以擲出物的重量為基準。如果投擲的是魔法道具，則被擊中的目
標有可能會被物品隱含的魔法所影響。

自古某些盜賊為暗算敵人，研發出專門用來投擲的道具，這些只有內行人才有管
道取得的飛行道具被稱為暗器(dart)，投擲這些特殊武器所造成的殺傷力遠大於
普通物品。
雖然暗器是被專門設計來投擲的道具，但使用上並不如想像中簡單，沒有練習過
的普通人將難以駕馭這項武器，為有學習過暗器正確使用方法(dart mastery)的
人才有辦法發揮它最大的價值。

雖然有許多為了投擲而設計出來的輕巧道具，但丟越重的東西造成的傷害越大，
這點確是亙古不變的硬道理。不過人的力量有限，不可能丟擲無限重的物品，對
於力量不足的人而言這更是硬傷。但好在投擲並不是只受到力量影響，還可以靠
著熟悉投擲技巧來讓自己投出更重的東西。


相關說明：暗器專精(dart mastery)
          金幣飛舞(coin-dart)
"""

[[helps]]
level = 0
keywords = "'DART MASTERY'"
text = """
指令名稱：暗器專精(dart mastery)
指令格式：無
使用時機：學習後自動使用

自古需要隱匿行動的斥侯身上自然不會穿著笨重的鎧甲影響自身的敏捷，但在
偵察敵情的過程中總會碰到個萬一。當被敵人發現時一身的輕裝就變成短兵相
接的不利因素了。

偉大的飛刀大師 - 安塔．提爾森曾說過：
「只要敵人無法近身，就算手持再厲害的神兵利器也拿我沒轍呀！」

白話的大意是說：只要在敵人拿刀砍向你前先把他作掉，那一切的問題都將不
在是問題了。斥侯們從這句話中獲得了啟發，並且想出個簡單且暴力的解決方
法 - 暗器(dart)，輕巧又具殺傷力的飛行兵器就此誕生。

攜帶輕巧的暗器不太會影響到自身敏捷，在戰鬥中靈巧的移動隨時與敵人保持
距離並消耗敵人體力，在敵人精疲力盡時投擲(throw)暗器給予致命的一擊。

不過暗器的使用需要相當的技巧，如果沒經過一定程度的練習將無法發揮出其
殺傷力，並可能比投擲一旁的板凳還來得糟糕。但相反的，對真正的高手而言
任何能投擲的物品都作為兇器使用，不過這類高手反而就不會隨身攜帶著大量
暗器，畢竟再輕巧的物品也還是會佔據行囊空間。

像是光明鎮坊間就流傳著一則奇妙的傳聞，有個技巧高超的俠盜在某次談判桌
上與對方一言不合，直接把手中的金幣作為暗器(coin-dart)擊倒對方。


相關說明：投擲物品(throwing)
          金幣飛舞(coin-dart)
"""

[[helps]]
level = 0
keywords = "COIN-DART"
text = """
指令名稱：金幣飛舞(coin-dart)
指令格式：perform coin-dart <對象>
使用時機：戰鬥中

相傳這招是一位光明鎮上的俠盜在敵對幫派內談判時所使出的絕技。對方人馬
在談判中突然抄起暗藏的武器朝著手無寸鐵包的俠盜包抄而去，只見俠盜伸出
放在口袋中的手，下一秒雙手閃出一條條金黃色的光茫，襲擊而來的敵人紛紛
倒下。

善用投擲的高手能將鬥氣灌注在金幣上，對敵人產生致命的傷害。但為了補足
金幣重量不足所欠缺的威力，必需擊發大量金幣才能擁有一定程度的殺傷力，
所以速度比起投擲單一物品慢上許多，而且所需的成本相當高昂。


相關說明：投擲物品(throwing)
          暗器專精(dart mastery)
"""

[[helps]]
level = 0
keywords = "FLEE RESCUE"
text = """
指令名稱：逃跑(flee)  解救同伴(rescue)
指令格式：flee
指令格式：rescue   <人物>
使用時機：戰鬥中

在戰鬥中，雙方都不能任意離開。如果情勢不對，你最好趕快逃走(flee)，或是由
其他的玩者來拯救(rescue)你。（你也可以下'recall'，不過這比較容易失敗，而
且會損失較多的經驗值）。

另外，當你練習了逃跑技巧(escape)後，你能在逃跑時指定方向，以及毫無損失經
驗值地離開，不過一旦失敗會損失更多的經驗值。

如果你在戰鬥中不幸斷線了，你的人物還是會繼續英勇作戰，而且會一直自動嘗試
使用'recall'。但是成功率會更低，而且會損失更多的經驗值。

想要提高救人的成功率，必須要多練習相關的技能。
"""

