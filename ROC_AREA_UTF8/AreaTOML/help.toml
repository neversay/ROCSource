[[helps]]
level = 0
keywords = "AUTOCOMBAT AUTODODGE AUTOPARRY AUTOCAST"
text = """
作戰型態是指角色在戰鬥中的行為設定，這些設定可能影響到每回合的動作、
主動行為、被動行為的效果及成功率。但是作戰型態的影響不一定為正面，也
可能是負面的。

指令格式：autocombat normal , autocombat stop , autocombat coop
    這三項是所有角色天生都可以使用的作戰模式， normal 表示普通作戰，
    角色戰鬥中每回合會對當前目標使出普通攻擊。 stop 則表示\u001B[1;31m停止攻擊\u001B[m，
    戰鬥中不會使出普通攻擊。 coop 是\u001B[1;37m群體作戰\u001B[m，當需要與其他人共同使用
    的合技時，會尋找條件符合的團員使用技能。如果輸入 autocombat 後面
    不接任何的字串，則作戰型態將恢復為預設型態 autocombat normal。

指令格式：autocombat dodge
    \u001B[1;36m全力閃躲\u001B[m，學習過全力閃躲(autododge)的角色將可以使用此型態，此型態
    在戰鬥中不會使出普通攻擊，但會提高閃躲技巧(dodge)、迴避技巧(evade)
    及反向殺法(reflexion)的成功率。

指令格式：autocombat parry
    \u001B[1;32m全力格擋\u001B[m，學習過全力格檔(autoparry)的角色將可以使用此型態，此型態
    在戰鬥中不會使出普通攻擊，但會提高武器格檔(parry)及盾牌抵擋(block)
    的成功率，並且能對飛踢(kick)等特定技能作出特效格檔。此外角色如果為
    戰士(war)轉職的騎士(kni)，在此型態下能對狂爆攻擊(frenzy)作武器格檔
    及盾牌抵擋。

指令格式：autocombat cast
    \u001B[1;33m專注祈禱\u001B[m，學習過專注(concentration)的角色將可以使用此型態，此型態
    在戰鬥中不會使出普通攻擊，但能提高施法成功率，並且在角色被攻擊的
    情況下也施放非攻擊性法術。

指令格式：autocombat critical
    \u001B[1;35m致命攻擊\u001B[m，學習過致命攻擊(deadly strike)的角色將可以使用此型態，此
    型態下能提高致命一擊的出現率，不過每一次攻擊都會消耗體力。

指令格式：autocombat power
    \u001B[1;36m引發魔力\u001B[m，學習過魔精石提煉術(abstraction)的角色將可以使用此型態，
    於此型態下在施法過程如果法力不足，則會自動使用身上的魔力寶石(gem)
    進行魔力轉換，但魔力的效率會略低於手動 power gem。

指令格式：autocombat instant
    \u001B[1;33m迅捷施法\u001B[m，學習過迅捷施法(instant cast)的角色將可以使用這個型態，
    此型態在戰鬥中不會使出普通攻擊，並將所有施法變為瞬間施法，不會有
    前置的詠唱期，不過消耗的法力也會變得比較多，並且施法後的恢復時間
    也會變得比較長。

指令格式：autocombat charge
    \u001B[1;33m衝刺突擊\u001B[m，此作戰型態需先騎乘(ride)在座騎上並且學習過衝刺(charge)
    才能使用。在此種作戰型態下如果有獵殺(hunt)中的目標時，對目標成功
    執行獵殺後將對目標自動執行一次衝刺技能。

指令格式：autocombat reload
    \u001B[1;30m快速填彈\u001B[m，學習過槍械精通(firearm mastery)的角色才能使用這個型態，
    在此作戰型態下當角色在戰鬥時如果裝備槍械而沒有裝備可用彈藥(ammo)
    時，會自動找尋身上可用彈藥並且裝上彈藥進行攻擊。但快速填彈將額外
    消耗體力，如果體力不足將無法執行。
"""

