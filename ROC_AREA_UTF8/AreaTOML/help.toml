[[helps]]
level = -1
keywords = "PROMPT"
text = """
指令格式： prompt
指令格式： prompt all
指令格式： prompt max
指令格式： prompt <%* %* %* ...>

若是不加參數，PROMPT 會打開或是關閉你的提示符號.

PROMPT ALL 會將你的提示符號設為 <\u001B[1;32m生命\u001B[m%h \u001B[1;32m魔法\u001B[m%m \u001B[1;32m移動\u001B[m%v>
PROMPT MAX 會將你的提示符號設為 <%h/\u001B[1;36m%H\u001B[m %m/\u001B[1;36m%M\u001B[m %v/\u001B[1;36m%V\u001B[m %c/\u001B[1;32m%C\u001B[m>

PROMPT <%* %* %* ...> 可以自行設定各種提示符號，%* 的說明如下:

        %h : 顯示你目前的生命點數，值的顏色會隨百分比變化，僅在血量大於 75% 時能變更色碼，且參數最後有結束色碼
        %H : 顯示你最大的生命點數
        %m : 顯示你目前的魔法點數
        %M : 顯示你最大的魔法點數
        %v : 顯示你目前的移動點數
        %V : 顯示你最大的移動點數
        %a : 顯示你目前的陣營指數
        %b : 顯示的陣營指數的顏色會隨陣營變化，參數最後有結束色碼
        %g : 顯示你目前的金幣數
        %x : 顯示你目前的經驗值
        %X : 顯示你還要多少經驗值升下一級
        %i : 顯示你目前是否隱形
        %t : 顯示現在的時間
        %A : 顯示你目前的陣營描述
        %B : 顯示的陣營描述的顏色會隨陣營變變化，參數最後有結束色碼
        %l : 顯示你目前的等級
        %r : 顯示你目前所在的房間名稱
        %d : 顯示當前背掛位置的箭矢數量 (裝備必須為箭矢才會顯示)
        %D : 顯示當前彈藥位置的彈藥數量 (裝備必須為彈藥才會顯示)
