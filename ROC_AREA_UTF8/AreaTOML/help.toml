text = """
ROC 嚴禁玩家出現 Multi Login 的行為。何謂 Multi Login ，即玩家利用
現今軟體方便，對 ROC 進行不同角色的三重以上的登入行為。另外，
ROC 已經於2005/09/11正式開放玩家同時登入兩個角色，然而若超過兩
個角色則依然不被允許，請玩家務必遵守。

由於視窗系統的便利、加上 Mud 軟體（如Zmud）的普及，因此使得多重登入
變得十分容易。但是 ROC 禁止玩家對本 Mud 進行相同的行為。不論是相同
IP 的多重登入；或是利用工作站以不同 IP 登入本 Mud ，但是依然為相同
玩家所控制，都算是 Multi Login 之行為。

Multi Login 經發現勸告不聽者，將予以強迫斷線，並予以 Freeze 之處分。
並請遭受懲處之玩家於本 Mud 之討論區上提出「之後絕不再犯，否則願意負
完全責任」之宣言，並署名登入角色之名字。

若今後再犯，將直接以砍檔為處分，絕不寬待。
"""

