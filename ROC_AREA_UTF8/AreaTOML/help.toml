[[helps]]
level = 0
keywords = "TRAIN"
text = """
指令格式： train <'str'或'int'或'wis'或'dex'或'con'或'hp'或'mana'或'move'或'practice'>
指令格式： train <'hp-r'或'mana-r'或'move-r'或'practice-r'>

TRAIN 可以提高你的屬性。每個新建人物的屬性都依各自的職業而定，你可以利用
學習點數來訓練你的屬性，但是也必須找到能替你訓練的人才行（通常是你的公會
導師）。

每訓練一次要花費 5 點學習點數，但是在訓練你的主要屬性時卻只要花 3 點即可。

建議先行提高知識和體質兩項屬性。知識愈高，升級時獲得的學習點數就愈多，而
體質愈高，生命點數就愈多。因此長遠看來，先訓練知識和體質是最有利的。

在你成為英雄之後，你可以練習生命力(hp) 法力(mana) 體力(move)
來增進自己的實力，每種職業的生命法力體力上限都不一樣，而越靠近上限花費的
練習點數就越多，所以在練習前穿一些能讓自己最大生命法力體力降低的裝備，
有助於你省下不少金錢與練習點數，另外，你也能用一筆錢和五千點經驗值換取
一點練習點數(practice)。

如果嫌 hp , mana , move , practice 慢慢的一次一次 train 太麻煩，則可以
使用 train hp-r , mana-r , move-r , practice-r 的指令。
此指令能盡可能的把你該項數值連續 train 100 次，但如果該到達上限或身上的
金錢、經驗值、練習點數不夠 train，則會自動停止。
"""

