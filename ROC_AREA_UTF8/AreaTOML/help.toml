第八章、第二次衛城之役

史卡拉貝建城後第三百三十年，第二次衛城之役爆發。
第二次衛城之役是一項計畫多年的侵攻，由瓦其頓的曾孫 ─ 拉瓦其頓主導。
拉瓦其頓雄才偉略且驍勇善戰，他花了十年的時間武裝了整個小惡鬼族，併吞更
南方的大惡鬼族，訓化灰毛的夜月吼狼，與巨魔族重新結盟。他也聯合神秘東方
地帶的邪惡種族 ─ 食人魔，以牽制北方同盟的地精援軍；雇用強大的冷血蜥蜴
族為前鋒；以凶猛的戰鷹建立了成功的情報網和統一的指揮體系，組織了前所未
見的超強戰力。
他唯一的失策就是消息太早走漏。當巨魔、蜥蜴人和吼狼騎兵組成的奇襲軍踏平
了羅胡要塞，與大軍合流於史卡拉貝城四周時，人類、精靈、地精和奧夫卡騎兵
的聯合軍早已恭候多時。

第二次衛城之役很快就變成了膠著的消耗戰，雖然當泰洛斯著名的武士隊趕到時
的確改變了戰場形勢，但敵方的食人魔從背後突襲抵達後，戰爭之神的天枰又回
歸均勢。為求盡快結束戰爭，雙方又陸續找來其他援軍，包括南方同盟的牛頭人
和精靈族的世仇黑暗精靈，以及人類陣營的矮人和豬臉獸人傭兵。這也是精靈族
與矮人族第一次拋棄成見合作。

這場戰役最後的決定性會戰是發生在西方黑森林綿延不絕的大戰線上。蜥蜴人與
南方同盟的合作關係在雇主遲遲未繳傭雇費的情況下終止，儘管拉瓦其頓一再保
證攻下史卡拉貝後有享用不盡的財寶，但冷血蜥蜴人已聽夠了。就在他們拔營離
去的前一晚，擔心他們改投北方同盟的巨魔軍偷襲並摧毀了蜥蜴人營地，殘存的
蜥蜴人在領導者 Pluto的指揮下且戰且走，退向羅胡要塞廢墟，並向駐守當地的
豬臉獸人首領 Dqqqqqq投降。隔日拂曉，獸人和蜥蜴人的聯軍配合史卡拉貝的地
精火焰兵將巨魔軍殺得焦頭爛額，一路退回黑森林以南的大沼澤區深處。
少了左翼掩護的南方同盟士氣崩潰，在史卡拉貝河南岸的平原上被泰洛斯的武士
刀殺得如砍瓜切菜，只留下殘陽夕照下的數千具屍體。

這一仗參與的種族和人數之多，死傷程度和影響之廣恐怕都是空前的。戰後，泰
洛斯、地精和矮人族都加入了強大的北方同盟，共同圍堵邪惡的南方勢力，而以
英雄之姿崛起的獸人與蜥蜴人也成為北方最受人矚目、尊敬的新種族，儘管精靈
族的一些不情願，但公民大會還是順利通過提案，讓這群精靈口中：「滿腦子只
想到打架。」的英雄加入了史卡拉貝的聯合陣營。稍後，戰時替各種族傳遞軍令
的快腳賀比特們也加盟了，繼續為各族的團結付出心力。

就這樣，史卡拉貝成為各族的交通中心和防堵南方勢力的第一線，屬於史卡拉貝
的時代，由此開始。

