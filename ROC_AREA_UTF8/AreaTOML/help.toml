[[helps]]
level = 0
keywords = "EQBANK"
text = """
伴隨著近期用戶大量增加，本行推出了新的裝備保存服務，並將業務範圍擴展
  至迷霧之島，期望能帶給各位用戶更多方便。

  指令：eqbank

  格式：eqbank new 名稱 密碼
                開一個新的倉庫，並且指定開啟用的密碼。為了成本的考量，
                酌收 500000 金幣做為開戶費用。
                   ex: eqbank new zcecil 1234
                   開一個新倉庫叫 zcecil，密碼是 1234

        eqbank open 名稱 密碼
                打開指定名稱的倉庫。

        eqbank store 物品編號
        eqbank receive 物品編號
                請見 help store，help receive

        eqbank list
        eqbank list <關鍵字>
                列出目前倉庫裡的物品
                後面加上關鍵字可以列出倉庫內具有相同關鍵字的物品。

        eqbank exam 物品編號
                查看倉庫內物品的狀態。

        eqbank id 物品編號
                鑑定倉庫內的物品，使用者需額外負擔鑑定費用。

        eqbank close
                關閉eq bank

        eqbank passwd 新密碼 再打一次新密碼
                更改目前開啟的倉庫密碼。

        eqbank backup
                備份目前開啟的倉庫。

  使用規範：
            1. 本服務不接受個人專用、獨一無二、無法儲存的物品。
            2. 每件物品總重不得超過 800 公斤，容器內物品數不得超過 90 件。
            3. 欲保存的容器內如果放有其他容器，則其他容器不得內含物品。
            4. 每個倉庫的編號最多只能到 150。
            5. 服務內容不包含代管座騎。

  希望使用本服務的用戶能遵守上述內容，以期創造雙贏的局面。

                                                  裝備銀行總管 夏瑞斯(Sharas)
"""

