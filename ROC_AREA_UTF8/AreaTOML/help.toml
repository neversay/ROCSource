使用時機：開戰前或戰鬥中

高階純能量法術。

一則已失傳的上古高階能量攻擊法術，施法者不斷地將魔力灌輸在一個極小的點
上，直到這個點產生出奇異的變化，再一口氣灌輸全身的魔力使蓄積的能量釋放
開來，將猶如激流一般對目標造成連續高強度的魔法傷害，直到爆破為止。

該法術爆破的威力不僅能與龍焰相比擬，爆炸的餘波還能波及周圍的敵人。雖然
威力強大，但高能核爆卻存在一些設計上的問題。快速的大量釋放魔力的作法不
僅會造成施法者虛脫，還會讓魔力的轉換效率降低，使得許多魔力平白的消散在
