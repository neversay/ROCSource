SAY 是對同房間內，所有清醒的玩者說話。單引號"'"可以代表SAY。

TELL 可以向世界上任何地方的某個清醒的玩者送出訊息。

REPLY 可以直接回答訊息給最近一個TELL你的玩者，不管他們在那裡，或是你看不
