當你的等級超過 20 之後，就有機會向公會導師要求改變為進階職業。而轉職之後，
你的等級會降回 1 ，而且你的最大生命力、魔力、體力點數都會減半。

當然，轉職之後也是有好處的，最主要的就是可以學到新的技能，而且能力也較低階
職業強大，但是轉為進階職業之後，升級也會變的較為困難（經驗值的獲取會變少）。

以下是 ROC 轉職等級限制表（等級限制代表基本職業欲轉為進階職業的等級最低標準）：

    進階職業            魔法師    牧師    盜賊   戰士   野蠻人
    ------------------------------------------------------------
     巫師(wizard)         20       --      --     36      --
     鍊金師(alchemist)    20       --      --     34      36
     賢者(savant)         --       20      --     --      --
     主教(bishop)         35       20      --     --      --
     殺手(assassin)       --       --      20     34      36
     忍者(ninja)          --       --      20     34      35
     騎士(knight)         35       35      35     20      34
     劍士(swordsman)      36       --      34     20      34
     僧侶(monk)           --       30      --     20      30
     巫醫(shaman)         30       25      --     --      20
     幻法師(sorcerer)     20       34      --     --      --
     領主(lord)           --       20      --     30      34
     遊俠(ranger)         35       33      20     30      35
     戰王(warlord)        --       36      35     30      20
     狂戰士(martialman)   --       --      36     30      20
    ------------------------------------------------------------

注意：基本職業轉為進階職業後，若進階職業中並無基本職業中的技能，
\u001B[1;31m則在經過轉職之後無法再度學習，請玩家在轉職前先考慮清楚再行轉職。\u001B[0m
"""

[[helps]]
level = 0
keywords = "PK"
text = """
PK (player kill/killing) 是指玩家間的互相廝殺較量行為.
以下是有關 PK 的一些規則.

1. 一般狀態下你可以用謀殺(murder)指令來攻擊其他的玩家，但在安全區或是謀殺
   等級小於 20 的玩家是不合法的。謀殺者將會成為凶手(KILLER)，任何人都可以
   攻擊凶手，且某些 Mob 也會主動對你發動攻擊。

2. 另外你也可以加入 PK(register pk)，條件為你的等級在 25 級以上。成為 Pker
   後，你可以直接攻擊(kill)其他的 Pker 而不會成為凶手，但攻擊非
   Pker 的玩家仍會成為凶手，此外 PK 仍會受到安全區(safe room)之限制。

3. 轉職後 PK 設定會因等級降低而取消，此為唯一解除 PK 設定之方式。

4. 在 PK 場獲勝不會得到額外的經驗值(EXP)，但也不會損失。

5. 魅惑(charm)Mob攻擊其他玩家是一種謀殺行為，不論你有無參加 PK 均會成為凶手.
   攻擊被其他玩家魅惑(charm)的生物也算是謀殺行為。
"""

[[helps]]
level = 0
keywords = "KILLER"
text = """
KILLER 就是所謂的凶手或謀殺犯，若你有以下行為之一，你就會成為 KILLER.

1.謀殺(murder)其他的玩家.

2.指使(order)手下攻擊其他玩家.

3.攻擊(kill)其他玩家的寵物或追隨者.

但 PK 有職照的玩家能夠彼此攻擊而不成為 KILLER，你可以"help pk".
所有的玩家都可以攻擊 KILLER，且安全區不會保護 KILLER，某些 Mob 會主動
攻擊 KILLER，一旦死後 KILLER 標誌就會解除.
"""

[[helps]]
level = 0
keywords = "ROBOT"
text = """
ROBOT 係指玩家利用 tt++，Zmud 等任何軟體操控角色的行為，在此係指操縱玩家
不在電腦之前而你的角色仍會有行動，如攻擊 Mob，發出訊息，或收到某種訊息即
有某種反應者，本人於電腦前利用軟體方便遊戲的進行不算是機器人行為。

ROBOT 在本 Mud 裡是完全禁止的，因此如果你使用機器人來練功、賺取金錢，拿取
裝備，甚至只是用來發呆(idle)，經過工作人員查明屬實或是經由玩家反應之後，
工作人員將會給予你適當的處分（處分內容請參照 rule 5）。此外，因為發呆而操
縱玩家不在線上所造成的任何損失，工作人員並無補償、負責之義務。

至於機器人之認定，只要是你不在系統前觀看，控制你的人物，造成工作人員在確認
你是否為機器人時完全沒有任何反應，但卻又不因為在系統 idle 過久而被系統自動
斷線時，即被認定為機器人（線路問題造成的不正常斷線，是不會再自動重登的）。
一旦因被工作人員認定為機器人遭到初級的關天牢或冷凍(freeze)時，可以於線上尋
找或是 note 給任何一個工作人員，並向他們保證自己不再使用機器人時，每個工作
人員皆有權力將你機器人的頭銜給去除；但若玩家因持續使用機器人而被永遠拒絕上
線或刪除玩家檔案的處份，是無法再申訴的。
"""

[[helps]]
level = 46
keywords = "ADVANCE"
text = """
指令格式： advance <玩者人物> <等級>

ADVANCE 可以將某個人物的等級提高到指定的數值。

目前所能提升的最大上限為 36 級的英雄，神無特殊理由不應用此指令幫一般玩家升級.

如果指定等級低於玩者等級，將會把該人物降級。
"""

[[helps]]
level = 46
keywords = "TRUST"
text = """
指令格式： trust <玩者人物> <等級>

TRUST 可以提高對某個人物的信賴度。提高信賴度和提升等級都能使一個人物有權
使用神族的指令，但是提高信賴度並不會讓該人物有能力上的提升（如生命力，魔
力…等）。你可以只提高某個人物的信賴度以給予該人物更多的權力，而不會改變
該人物的屬性；相反的，你也可以將某個人的信賴度設的比他的真實等級還低作為
某種處罰。

若是信賴值設為 0 則代表將信賴值設為該人物目前的等級。
"""

[[helps]]
level = 43
keywords = "ALLOW BAN"
text = """
指令格式： allow   <站台>
指令格式： ban     <站台>
指令格式： ban

BAN <站台> 禁止所有來自該站台的人物上線。若是不加參數，則會列出所有被禁
止的站台。

ALLOW <站台>則是取消對某站台的限制。

限制站台的比較是由後向前進行，例如你設定'ban foo.edu'，那麼被禁止的站台
就是'*.foo.edu'。

站台限制並不會儲存，當MUD重新啟動之後，站台限制列表就會被清除。
"""

[[helps]]
level = 43
keywords = "REBOOT SHUTDOWN WIZLOCK SSTIME"
text = """
指令格式： reboot
指令格式： shutdown
指令格式： wizlock
指令格式： sstime <時間長度>

REBOOT 關閉MUD，然後重新啟動。當啟動巨集開始運作時，大約有60秒鐘的時間
不能連線。

SHUTDOWN 關閉MUD，但並不重新啟動。

WIZLOCK 一旦設定之後，等級小於36的玩者將無法再上線，但是若是斷線的玩者還
是可以重新建立連線。

SSTIME則可以設定下次系統重新啟動的時間，時間長度以分鐘為單位。

"""

[[helps]]
level = 43
keywords = "DENY FREEZE"
text = """
指令格式： deny       <玩者人物>
指令格式： disconnect <玩者人物>
指令格式： freeze     <玩者人物>

DENY 會禁止某玩者上線，並立刻將他踢出遊戲。DENY 的效果是永久性的，除非直
接修改玩者資料檔，否則無法取消。

DISCONNECT 立刻強迫某玩者離開遊戲。

FREEZE 會將某玩者凍結，使他無法使用任何指令。
"""

[[helps]]
level = 43
keywords = "FORCE"
text = """
指令格式： force <人物> <命令>
指令格式： force all <命令>

FORCE 可以強迫某個人物進行某個動作。

FORCE 'all' 會強迫所有的玩者人物進行某個動作，通常是用在'force all save'
，以便重新啟動或是關機。
"""

[[helps]]
level = 43
keywords = "WIZIFY"
text = """
指令格式： wizify <玩者人物>

WIZIFY 給予某人在WIZLOCK 的上線權力。
"""

[[helps]]
level = 43
keywords = "NOEMOTE NOTELL SILENCE"
text = """
指令格式： noemote <人物>
指令格式： notell  <人物>
指令格式： silence <人物>

NOEMOTE 禁止某個人物使用emote 指令，和所有的SOCIAL指令。

NOTELL 禁止某個人物使用tell、reply、gtell...等指令。

SILENCE 禁止某個人物使用通訊頻道。

另外，NOTELL的人物也不會收到來自別人的訊息。
"""

[[helps]]
level = 43
keywords = "SLAY"
text = """
指令格式： slay <人物>

SLAY 直接殺死指定目標，沒有反悔的機會。

SLAY 之後不會進行AUTOLOOT 和 AUTOSAC。
"""

[[helps]]
level = 43
keywords = "TRANSFER"
text = """
指令格式： transfer <人物>
指令格式： transfer all
指令格式： transfer <人物> <地點>
指令格式： transfer all    <地點>

TRANSFER 可以將指定的人物或所有玩者人物傳送至你所在的房間，
或是指定的房間。
"""

[[helps]]
level = 43
keywords = "LOG SNOOP"
text = """
指令格式： log   <人物>
指令格式： log   all
指令格式： snoop <人物>

LOG 可以記錄某個人物的所有動作。這個設定是永久性的。

某些命令是不會被記錄的（像是PASSWORD）；而某些指令（特別是神族的指令），
則是一定會被記錄的。

LOG ALL 會記錄所有人的命令，而此設定卻不是永久性的，只會持續到重新啟動。

SNOOP 可以把某個玩者的所有輸出入全部列出來，你也可以同時對數個玩者使用。

SNOOP 自己就可以停止所有的snoop。
"""

[[helps]]
level = 43
keywords = "MLOAD OLOAD"
text = """
指令格式： mload <vnum>
指令格式： oload <vnum> <level>

MLOAD 可以根據一個非玩者生物的vnum來載入之。

OLOAD 則是根據一個物品的vnum來載入之，但若權限不夠則無法指定物品等級。
"""

[[helps]]
level = 43
keywords = "MSET OSET RSET SSET"
text = """
指令格式： mset <生物> <欄位> <數值>
指令格式： oset <物品> <欄位> <數值>
指令格式： rset <房間> <欄位> <數值>
指令格式： sset <玩者人物> <技能> <數值>
指令格式： sset <玩者人物> all <數值>

MSET 設定非玩者生物的各項資料。

OSET 設定物品的各項資料。

RSET 設定房間的各項資料。

SSET 設定某個玩者人物的各項技能和法術等級。

目前對於字串類別的資料尚無法輸入超過一行以上。
"""

[[helps]]
level = 43
keywords = "RESTORE"
text = """
指令格式： restore <人物>

RESTORE 回復目標人物的全部生命力、魔力、體力點數。
"""

[[helps]]
level = 43
keywords = "MEMORY"
text = """
指令格式： memory

MEMORY 列出目前記憶體的使用情形。
"""

[[helps]]
level = 43
keywords = "PEACE"
text = """
指令格式： peace

PEACE 終止所在房間內所有的戰鬥。
"""

[[helps]]
level = 43
keywords = "PURGE"
text = """
指令格式： purge
指令格式： purge <人物>

若是不加參數，PURGE 內定清除你所在房間內的所有物品和非玩者人物。而若是指
定參數，則會清除指定的非玩者人物（不論在那裡）。

PURGE 不能用來清除玩者人物。
"""

[[helps]]
level = 43
keywords = "SWITCH RETURN"
text = """
指令格式： switch <人物>
指令格式： return

SWITCH 可以附身在某個非玩者生物身上。

RETURN 可以解除附身，回到自己的身體。
"""

[[helps]]
level = 43
keywords = "AT"
text = """
指令格式： at <地點> <指令>

AT 在指定地點執行指定的指令。地點可以用 vnum、其中非玩者生物的名字，或是
其中物品的名字來指定。

AT 會暫時把你傳送到指定的地點去，工作完成後，再把你送回原來的地方。但若
所執行的指令會改變你的位置，則不會將你傳回。
"""

[[helps]]
level = 43
keywords = "PARDON"
text = """
指令格式： pardon <玩者人物> (+|-)killer
指令格式： pardon <玩者人物> (+|-)robot

PARDON 可以用來赦免某個人物的罪行。
例如 pardon xxx killer
也可以把某個人設成(+)凶手(killer)或機器人(robot)。
"""

[[helps]]
level = 43
keywords = "ECHO RECHO"
text = """
指令格式： echo  <訊息>
指令格式： recho <訊息>

ECHO 送出訊息給所有遊戲中的玩者，但是看不出來是誰發出的。

RECHO 和ECHO很像，但是只送訊息給所有同房間中玩者。
"""

[[helps]]
level = 43
keywords = "GOTO"
text = """
指令格式： goto <地點>

GOTO 把你傳送至某個地點。地點可以用 vnum、其中非玩者生物的名字，或是
其中物品的名字來指定。
"""

[[helps]]
level = 43
keywords = "HOLYLIGHT WIZINVIS"
text = """
指令格式： holylight
指令格式： wizinvis <等級>

HOLYLIGHT 讓你能夠看見所有比你等級低的玩者人物和非玩者人物。
若是不使用本功能，則只能看見一般人。

WIZINVIS 讓所有的一般人、非玩者生物，以及等級比你低的人物看不見你。你可
以輸入WIZINVIS <等級>，這麼做的好處是你可以在忙碌的時候仍然讓一些等級較
低的人找的到你。另外，MOB 與房間看不到隱形神族，即使是 WIZINVIS 1。

HOLYLIGHT 並不能讓你看見等級比你高的隱形神族。
"""

[[helps]]
level = 43
keywords = "MFIND OFIND"
text = """
指令格式： mfind <名稱>
指令格式： ofind <名稱>

MFIND 列出指定名稱的所有非玩者生物。

OFIND 列出指定名稱的所有物品。
"""

[[helps]]
level = 43
keywords = "MSTAT OSTAT RSTAT SKSTAT"
text = """
指令格式： mstat <人物>
指令格式： ostat <物品>
指令格式： rstat <地點>
指令格式： rstat
指令格式： skstat <玩家>

MSTAT 列出某個人物的詳細狀況。

OSTAT 列出某個物品的詳細狀況。

RSTAT 列出某個地點的詳細狀況。地點可以用 vnum、其中非玩者生物的名字，
或是其中物品的名字來指定，不指定的話就是顯示目前所在的房間。

SKSTAT 可以看到該玩家的技能學習狀況，包括隱藏經驗值等.
"""

[[helps]]
level = 43
keywords = "MWHERE OWHERE"
text = """
指令格式： mwhere <名稱>
指令格式： owhere <名稱>

MWHERE 列出指定名稱的所有生物所在位置。

OWHERE 列出指定名稱的物品所在位置。
"""

[[helps]]
level = 43
keywords = "BAMFIN BAMFOUT"
text = """
指令格式： bamfin  <訊息>
指令格式： bamfout <訊息>

BAMFIN 用來改變自己GOTO到某個房間時，出現的訊息。

BAMFOUT 用來改變自己GOTO到某個房間時，從原來房間消失的訊息。

範例：bamfin 飛了過來。
將會顯示：Slay(Slay) 飛了過來。

"""

[[helps]]
level = 43
keywords = "SLOOKUP"
text = """
指令格式： slookup <技能|法術>
指令格式： slookup all

SLOOKUP 列出指定技能的內部'sn'（序號）和外部'slot'（欄位）。'sn'是用在
OSET 和 OSTAT。'slot'是用在區域檔案中。而玩者檔案中並不使用這兩個值，而
是使用實際的檔案名稱。

SLOOKUP ALL 則是列出所有技能的'sn'和'slot'。
"""

[[helps]]
level = 43
keywords = "USERS"
text = """
指令格式： users
指令格式： users multi

USERS 列出所有連線中的使用者，包括登入中及已在遊戲中的.
[ ] 內第一個數值為使用者 descriptor 代號，第二個是使用者狀態,
0 表示正在遊戲中，其他則代表尚未進入遊戲前的各種狀態,
第三個是使用者發呆的時間(tick)。後面還有玩家姓名，remoteuser@host

USERS MULTI 會在使用者列表中找尋從相同 host/remoteuser 登入超過兩人的使用者.
"""

[[helps]]
level = 43
keywords = "GIFT"
text = """
指令格式： gift <物品> <玩家>

凡是神送給玩家改過的物品之前都可以用本指令將物品資料記錄於 LOG.TXT 中.
"""

[[helps]]
level = 43
keywords = "IMMTALK :"
text = """
指令格式： immtalk <訊息>

IMMTALK 用來傳達訊息給所有神族。':'是IMMTALK的簡寫。
你也可以在本頻道使用socials指令，但必須輸入imm*而不是immtalk*。

"""

[[helps]]
level = 43
keywords = "WIZHELP"
text = """
指令格式： wizhelp

提供你目前能使用的工作人員指令列表。
"""

[[helps]]
level = 0
keywords = "ARMOR ARMOUR SHIELD 'STONE SKIN'"
text = """
指令名稱：護甲術(armor), 魔法護盾術(shield), 石甲術(stone skin)
指令格式：cast armor <生物>
指令格式：cast shield <生物>
指令格式：cast 'stone skin' <生物>
使用時機：平時或戰鬥中

護甲術(armor), 魔法護盾術(shield)以及石甲術(stone skin)為法師及牧師
提升自己及隊友防禦的法術，三項法術有其相同及相異的地方。相同的是，
此三種法術都能提升目標的護甲防禦力(AC, Armor Class)。相異的是，在高技
能等級狀態下，護甲術(armor)能提升較高的護甲防禦力、魔法護盾術(shield)
能提升額外的抗魔法傷害(MDR, Magical Damage Resistance)、而石甲術(stone
skin)能提升額外的抗物理傷害(PDR, Physical Damage Resistance)。

此外，三種法術中，被施法的目標只可選擇其一為輔助法術。另外，高階法術可
以覆蓋低階同類型法術。後上的其他兩類法術，可覆蓋掉原先的輔助法術。最後
，基礎職業為法師的玩家，對自己施展時，將有額外 50% 的防禦力/抗魔法傷害
/抗物理傷害的加成。而智力或智慧低的種族，施展此法術將會得到較差的效果。

相關說明：護甲防禦力(AC, Armor Class)
          抗物理傷害(PDR, Physical Damage Resistance)
          抗魔法傷害(MDR, Magical Damage Resistance)
          法師(Mage)
"""

[[helps]]
level = 0
keywords = "DISCONNECT"
text = """
指令名稱：DISCONNECT
指令格式：disconnect <玩家角色> <玩家角色密碼>
使用時機：隨時

發生網路問題造成 client 斷開與角色間的連線，但角色的狀態依然被主機判定為
login 而無法取代連線登入的情況下，可以使用其他角色對無法登入的角色下達此
指令，強迫角色被主機判定為斷線以重新登入。

使用 disconnect 必需要知道角色密碼，不知道密碼的情況下將會失敗。
重複失敗幾次後，使用指令的角色將有一段時間無法再次使用該指令。

"""

[[helps]]
level = 0
keywords = "KICK"
text = """
指令名稱：飛踢(kick)
指令格式：kick
使用時機：戰鬥中

正如其名，在戰鬥中用腿踢人。雖然說攻擊能力比起神兵利器或是法術弱了很多
，但由於對手全神貫注在你手中的兵器上，這突如其來的一腳往往令人難以閃避
