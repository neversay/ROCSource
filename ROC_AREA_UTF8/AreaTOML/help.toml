[[helps]]
level = 0
keywords = "STORY11"
text = """
第十一章、奴隸制度

第二次大發現時代帶給史卡拉貝的是廣大的疆域和無窮盡的耕地，為了在新墾的
肥沃坡地上種植更多的穀物，放牧更多的牛羊，極盛的史卡拉貝開始畜養奴隸。

最先開始的是奧夫卡。擁有整片北方大草原和莫瑞亞礦山的奧夫卡都首先逼迫窮
困的佃農賣身為農奴和牧奴，接著是貧困的礦工，最後逼迫良家女孩賣身為奴。
宗主國史卡拉貝雖然立即通過決議，禁止販賣人類奴隸，並且封閉人口市場，但
神通廣大的商人總有鑽漏洞的方法。既然不能販賣人類，精靈族、矮人族和獸人
的販賣通路很快就生意興旺，精靈村和矮人帝國不斷發生擄人事件，擄掠而來的
人口便被送至貧民區內的秘密奴隸市場拍賣掉；而天高皇帝遠的奧夫卡更是絲毫
不理會禁令，大發奴隸財。

機靈的奴隸販子很快就將主意打到心思單純的綠樹小妖精身上。漂亮、纖細的小
妖精族馬上成為史卡拉貝富豪的最愛，將翅膀拔去再施以奴隸訓練的小妖精族可
是天價的搶手貨。日漸興旺的奴隸運輸業取代了綠樹原本最大的林木業，是絕對
穩賺不賠獲利豐富的油水業，其利率甚至超越了香料業。

此時的史卡拉貝已失去當初對外探險的活力，舉國耗在奴隸農業和政治鬥爭的漩
渦中，市議會逐漸被販賣奴隸致富的暴發戶和黑勢力滲透、墮落。隨著史卡拉貝
議會的徹底腐化，奴隸制度達極盛。

世代更替，原先精力充沛、好奇心旺盛的冒險者已墮落為尋找新奴隸來源以獲利
的侵略者、屠殺者。浮華的史卡拉貝與奢侈的富豪們爭相競買昂貴首飾和珍寶，
帶動更大一波尋寶潮，引起一些種族的不滿，其中幾起不知死活硬闖龍族禁地的
行為更讓龍人們十分火大。但人類絲毫不受教訓，依然我行我素猖狂潛進龍塔，
竊取龍族的財富。

終於，不滿爆發了。

                                       請輸入help story12 來看第十二章
"""

[[helps]]
level = 0
keywords = "STORY12"
text = """
第十二章、第三次衛城之役

史卡拉貝和平、強盛的黃金時期持續了三百年，然後第三次，也是最近一次衛城
之役在距今兩百年前爆發。

嚴格說來，這次衛城之役是人類自找的，導火線是不肖的冒險者盜走了龍族聖物
龍水晶。
龍水晶是由歷代龍族長老在變異（即去世）前將自身魔力封入而形成，除了本身
具有極強的魔法力量外，也是龍族慎終追遠的信仰象徵。
發現大批龍水晶被史卡拉貝的偷獵者盜走後，龍族上下群情激憤，於是由當時龍
族的大長老魔龍艾瑞克（Evick）率領，向史卡拉貝展開報復性攻擊。
史卡拉貝的艦隊在外海遭受大批海龍攻擊，全軍覆沒；固若金湯的羅胡要塞亦在
一番激戰後被飛龍群攻下；史卡拉貝的西城門也在總攻開始後一個小時內被佔下
，由全大陸募集而來的巨龍菁英和龍人戰士湧入城內進行激烈的巷戰。
由於龍族的本意只是要奪回龍水晶並給驕傲的史卡拉貝一個教訓，因此在攻入山
頂聖殿後所有的攻擊便暫時停止，帶著善意的龍族要求與人類展開談判，人類也
同意，於是漫長的談判開始。

不料人類此時的心態與當初第一次衛城之役前的小惡鬼族一樣，在聞風而來馳援
的各族同盟到達後，人類掀翻談判桌，將大戰帶入毀滅性的殺戮血渦中。
一方是魔法抗力極強，巨大無匹的各色狂龍和龍人軍團，另一方是善於各式魔法
、武器戰技精良的精靈術士、矮人諸族、泰洛斯武士、獸人聯合軍。雙方你來我
往，局勢演變成沒有勝利者的消耗戰。
魔龍艾瑞克眼見騎虎難下，便幻化作人形向當時的敵軍領導者 ─ 劍聖托斯馬克
（Tosmark）約戰，兩人單獨在清晨的聖殿廣場進行決鬥。

決鬥的內容沒有人曉得，但最後的結果是托斯馬克身首異處。
而魔龍艾瑞克則率領所有的龍族退出戰場。
有人說托斯馬克是為了給龍族一個交代，所以引刀自刎，讓艾瑞克能有理由說服
族人停戰。不過事實真相只有他們兩人曉得，並且在艾瑞克十年後變異而成為永
遠的謎。

驚惶未定的居民回到絲毫無損的居處，市場照常開業，富豪人家大開宴會慶祝災
難遠去，憤怒的公民大會開始清算背約的盟友，一切似乎回歸正常，回歸腐爛。
卻沒人想到，真正的災難才剛開始。

                                  Base on Amenda,renewed by Neversay.

"""

