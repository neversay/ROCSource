[[helps]]
level = 0
keywords = "GROUP"
text = """
組隊指令，需由一人先組建隊伍成為隊長，隊長能將 follow 他的人加入隊伍中成為隊員。
如果同隊伍中的隊友跟你在不同房間，會以暗水藍色碼顯示。

group form [隊名]     成立隊伍，隊長必須先做這個動作。隊名可有可無。

group disband         解散隊伍

group transfer <id>   把隊長交接給另一個人，在隊長要離開時很有用

group + <id>          把指定id的人加入隊伍，要加入時必須先follow你，加入後則無此限制。

group - <id>          把指定id的人移出隊伍。

group all             把同房間裡follow你的所有人加入隊伍

group * <id>          跟指定對象的隊伍合併，下指令的人會繼續是隊長。
                      <id>必須follow你，而且是該隊的隊長。

group -l +l           將隊伍內的人物按照等級排列， -l 為由小到大，
                      +l 為由大到小。

group -h +h           將隊伍內的人物按照hp排列。
group -m +m           將隊伍內的人物按照mp排列。
group -v +v           將隊伍內的人物按照mv排列。
group -c +c           將隊伍內的人物按照職業排列。

group -p              可以觀看隊伍內的人的保護資訊。

group -k              可以觀看隊伍內的人的協助資訊。

group +r -r           +r 為顯示隊伍中跟你同房間的隊員，-r 為顯示隊伍中跟你不同房間的隊員。
"""

[[helps]]
