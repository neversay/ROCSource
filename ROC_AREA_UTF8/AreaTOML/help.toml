召喚獸就會返回異界。伴隨技能等級高低，會影響召喚獸可召出的數量、強度、
及可召喚的級別，不過級別越高的召喚獸保持形體所需的魔力量也越多。

高階的雷系召喚獸擁有強大的物理攻擊能力，並且能命令(order)其穿上裝備，
其中最具代表性的召喚物為泰坦巨人(Titan Giant)，持有瞬間物理傷害的技能
及放電的能力。

