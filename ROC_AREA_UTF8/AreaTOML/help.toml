使用時機：戰鬥中
領主率領所有可正常戰鬥的隊員，突破敵軍防線，直接攻擊領主正在對戰的
敵人。運用得當可收擒賊擒王的效果。

指令名稱：奇襲行軍(Hidemarch)
指令格式：perform hidemarch
使用時機：平常時
領主藉由地形與戰術指揮之能力以及多名的斥候（忍者或殺手）的探勘下，
進入隱密移動的狀態，藉以奇襲敵軍。
在夜晚視線不明的狀態下，更可將整支軍隊藏匿於陰影中。

指令名稱：合圍包抄(Envelopment)
指令格式：perform envelopment
使用時機：戰鬥中，且領主為領隊
