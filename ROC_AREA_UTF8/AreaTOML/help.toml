WHO 的參數可以設定只列出某些職業或等級的玩者。

範例：
who 10           列出等級至少是10級的玩者
who 15 20        列出等級範圍是10至15級的玩者
who cleric       列出職業是牧師的玩者
who cleric 1 5   列出等級範圍是1至5級的牧師
who imm          列出在線上的神族
who group        列出線上的冒險團領隊
who group <人物> 列出處於該人物領導下的冒險者
who pk           列出有參加 PK 的玩家
who orc          列出所有種族是獸人(Orc)的玩家
"""

