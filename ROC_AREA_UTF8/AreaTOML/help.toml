第七章、黃金八十年

戰後，南北兩方開始積極尋找盟友，史卡拉貝商隊除了做生意外，也擔當了外交
使節的重任，商隊中的成員也加入了專業的學者和術法師，也改變了以往的交易
模式：尋找盟友是第一要務，貿易次之。

在那段時期，由政府雇用的探險隊重新發現了以往為人忽略的神秘地區和古老遺
跡。東方探險隊越過地精和矮人的領地，來到了同為人類的泰洛斯人的城市 ─
泰洛斯城。黑髮黑瞳的泰洛斯人顯然不怎麼信任同族的史卡拉貝人，幾經交涉才
開啟了塵封幾千年的對外貿易網；另一支冒險隊憑著高超的外交技巧說服了地精
族，共同抵抗來自南方的侵略。
西方的羅胡要塞派出眾多的兵力打通了與望鄉港之間的陸路，並在大路附近建起
第二座軍事要塞 ─ 武士堡，藉以保障陸路旅客的人身安全。在市政府的鼓勵下
，探險隊開始朝西方進發，穿越無數山林和深谷，來到從未有人涉足的原始林區
，他們開墾荒地，挖掘渠道，不過數年便成了史卡拉貝境內最富庶的農業省分 ─
山恩郡。
北方的奧夫卡也沒閒著，勇敢的奧夫卡騎士穿山越嶺，重新抵達荒蕪數百年的莫
瑞亞礦山，重啟礦業採集，並引進矮人的礦業技巧，很快地莫瑞亞成為史卡拉貝
最重要的貴重金屬產地，結束了矮人數百年的壟斷，奧夫卡從此致富。

一支奇形怪狀的游獵民族翻越北疆界高聳的奧夫卡山脈，出現在奧夫卡西境，不
斷南移。後世對這類名為獸人的豬臉人身種族始終搞不清其來源，不過獸人出現
已是既定事實，一些商隊雇傭這些嗜戰如狂的兩腳山豬，一起走進極度危險的叢
林深處，而獸人也稱職地扮演了傭兵該有的角色，沒多久，這批心思單純的尚武
種族便成了最佳的戰士人選，大量出現在冒險者工會的應徵名單中。不久，另一
批更奇形怪狀的爬蟲蜥蜴人穿過精靈族和奧夫卡之間的山區，繞個大彎進入小惡
鬼族的家鄉密登尼森林裡，馬上被頗具別心的小惡鬼族長雇用，收編進部隊裡。

為了因應日漸龐大的外交、軍事和文事人才需求，史卡拉貝市政府終於在建城後
第三百年左右成立了第一座專職學校 ─ 史卡拉貝大學院。在其後的歲月中，該
學院成為文明區最重要的教育機構，優秀人才輩出，組成了史卡拉貝日後最堅強
的基礎力量。

南北兩方在這時期不斷加強自身實力，招攬同盟，為的就是不被對手超越，但這
場競賽總有到達終點的一天。當一批神秘軍隊出現在羅胡要塞附近，並向著東方
移動時，有識之士已隱約感覺到，終點已近。

