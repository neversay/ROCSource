SCORE 列出你自己目前詳細的狀態（當然只給自己看）。

      如果你的職業是騎士或領主的話，你可以使用這兩個指令後面接著坐騎的 ID
      ，那麼你將可以快速地檢閱坐騎目前的詳細狀況。
      
SCORE 後面總共可以加三個參數以簡便玩家查詢角色相關資訊：

      SCORE B ：列出角色基本資料。 (快速記法: base)
