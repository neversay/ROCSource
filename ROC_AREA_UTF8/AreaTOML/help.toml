大部分被魅惑的生物會暫時失去其侵略性。

如果被你魅惑的生物投入戰鬥，他們將會自動解除魅惑狀態。

要指定坐騎做事，除了必須要擁有坐騎以外，還必須處與非騎乘的狀態。
