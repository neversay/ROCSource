指令格式： question <訊息>
指令格式： answer   <訊息>
指令格式： shout    <訊息>
指令格式： yell     <訊息>
指令格式： rumor    <訊息>
指令格式： herotalk <訊息>

這些指令可以透過公眾通訊頻道來和其他的玩者溝通。

SHOUT 會送出訊息給所有清醒的玩者。為了避免亂叫，SHOUT之後會強迫延遲3秒。

CHAT（閒談），MUSIC（演奏），以及QUESTION（問題）ANSWER（解答）
這些頻道是用來討論不同方面的訊息，有興趣的玩者會請自行選擇頻道參
與討論。QUESTION和ANSWER兩個指令是共用同一個頻道。另外， '.' 是 CHAT 的
簡寫。chat* 後面能加上表情指令，讓你在公眾頻道做表情，例如chat* laugh
chat* emote <訊息>　能讓你模擬出各種自己寫的表情。

YELL 會送出訊息給在同一區域內的所有清醒玩者。

RUMOR 會匿名送訊息給所有玩家，如果覺得很吵可以關閉這個 CHANNEL。
另外，等級比你高的玩家將能知道是誰在散播謠言。

HEROTALK 會送出訊息給所有英雄級的玩家。

