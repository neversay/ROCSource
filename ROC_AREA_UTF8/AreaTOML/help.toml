這些指令會改變你的姿勢，如果你休息(rest)，或是睡覺(sleep)，你的生命力、
魔力，和體力都會回復的較平常多。然而，你也會變得比較脆弱，反應也會變差。
如果是在睡眠狀態，對周圍環境的改變將幾乎察覺不出。

想要中止休息，可以用 'stand'或是'wake'。你也可以叫醒(wake)其他正在睡覺的
人物。

另外'sleep'也是一個可以催眠目標生物的法術，會把目標送進甜蜜的夢鄉，
且被催眠的人在一定時間內是無法叫醒(wake)的，不過一旦遭受攻擊或是法術時間
結束，目標就會自然清醒。
"""

