    敏捷值代表你身體的反應速度。尤其是閃躲(dodge)能力，身形敏捷
的人總是能夠在千鈞一髮之際閃避敵人的攻擊。此外，由於動作比較靈活
也會影響攻擊時的命中率。對於盜賊來說，身手矯健是不可或缺的條件。
"""

[[helps]]
level = 0
keywords = "CON CONSTITUTION"
text = """
Constitution (體質)

