"""

[[helps]]
level = 0
keywords = "DUAL"
text = """
指令名稱：雙手武器(dual)
指令格式：無
使用時機：學習後自動使用

本項技能讓你能同時裝備兩樣武器。因此，你的攻擊命中率和攻擊力都會提升。
如果搭配雙重攻擊(second attack)，甚或三重攻擊(third attack)，將會變成四
重攻擊或是六重攻擊！
但是要注意，你不能同時裝備需要雙手拿的武器和一個盾牌，也不能同時多握一
件手持配件。

如果雙手武器皆為匕首(dagger)時，執行背刺(backstab)時出現雙重背刺，將會以
次要武器作為第二次背次的武器。
"""

[[helps]]
level = 0
keywords = "BODYCONTROL"
text = """
指令名稱：身體平衡控制(bodycontrol)
指令格式：無
使用時機：學習後戰鬥中自動使用

身體平衡控制可以減少被絆倒(trip)的機率，避免因絆倒而造成的延遲時間。
"""

[[helps]]
level = 0
keywords = "'FIST FIGHT'"
text = """
指令名稱：徒手攻擊(fist fight)
指令格式：無
使用時機：學習後戰鬥中自動使用

這個技能讓你能徒手格鬥，當你沒有裝備護甲於身體(body)，腿部(leg)，盾牌
(shield)，武器(wield)與手握(hold)時會自動使用，有著較高的命中率跟給與
敵人較強的傷害。

當你熟悉此技巧之後，你能夠穿上你力氣所能負擔的裝甲(armor)，而仍能使用
徒手攻擊卻一點也不會受到裝甲影響減低靈活度。如果你是人馬(Centaur)，在
你更能靈活使用你的四隻蹄腳後，你將能開始穿著腿部(leg)裝備而不影響你的
徒手攻擊。
"""

[[helps]]
level = 0
keywords = "HUNT"
text = """
指令名稱：獵殺技巧(hunt)
指令格式：hunt <目標>
使用時機：開戰前與戰鬥中

這項技能的發動將讓你對敵人更具侵略性。一旦開始獵殺目標之後，下次的相
