呈現，不過基本上還是越大越好。這個數值跟角色的力量、敏捷、智慧的數
值有關。其中力量的部份還包括武器重量，如果武器太重的話連揮動都有問
題，更不用說打中敵人了，如果單手實在無法靈活使用武器的話，別忘了，
除了眼魔以外，所有的類人種族都有兩隻手！
"""

[[helps]]
level = 0
keywords = "DR 'DAMAGE ROLL' "
text = """
Damage Roll  (傷害值)

    傷害值決定你能夠對敵人造成多少物理傷害。注意實際上的傷害值是由
武器的AVG 與DR 兩個因素決定的，所以如果DR很高，而武器的威力很差，
是打不出高傷害的。
"""

[[helps]]
level = 0
keywords = "DOD"
text = """
Dodge (閃躲值)

    閃躲值用來檢定你閃避敵方物理攻擊的機會，數值越低(負越多)越好，
要特別注意的是此項數值與技能的dodge不同，天生的dodge 會受到敏捷值
以及負重的影響，身上帶太重的東西是不可能身輕如燕的。
"""

[[helps]]
level = 0
keywords = "DC 'DODGE CLASS' "
text = """
Dodge Class  (閃避值)

    閃避值代表你對物理攻擊的閃躲程度，這個數值顯示著你能夠承受物理攻擊的
強度。數值越低，代表你的閃避力越好。敏捷的影響也會反映在這項數值上。
"""

[[helps]]
level = 0
keywords = "AC 'ARMOR CLASS'"
text = """
Armor Class  (護甲防禦力)

    護甲防禦力代表你身上的武裝程度，是你抵抗物理攻擊的第一道防禦。數值越
低，代表你的裝甲越好。而你的體質(Con)也會提升你的護甲防禦力。

值得注意的是，不論你的護甲防禦力再高，沒有適量的抗物理傷害(PDR, Physical
Damage Resistance)，你都無法完全抵擋敵人的物理攻擊。惟有護甲防禦力以及抗
物理傷害兩者兼顧才能抵擋敵人最大的物理傷害。

以下是簡單的護甲防禦力及傷害抵擋比例的對照表：
  防禦力    +500   0   -500  -1000   -2000  -3000  -4000  -5000
  減少傷害  -25%   0%   25%    50%   87.5%  94.4%  96.9%  98.0%

相關說明：抗物理傷害(PDR, Physical Damage Resistance)
          法術抗性(SVS, Save vs Spell)
"""

[[helps]]
level = 0
keywords = "PDR 'PHYSICAL DAMAGE RESISTANCE'"
text = """
Physical Damage Resistance (抗物理傷害)

    不同於護甲防禦力(Armor Class)，抗物理傷害是身體抵禦物理傷害的最後一層
防護。當傷害已被護甲防禦力降低一定的比例之後，抗物理傷害能再減少固定量的
傷害。

也就是說，護甲防禦力能按比例減少傷害，而抗物理傷害則是減少固定量的傷害。

值得注意的是，抗物理傷害對抵抗肉體或鬥氣直接攻擊的傷害特別有效，諸如飛腿
(Kick)、頭部猛擊(Bashhead)、以及吸血鬼之吻(vampiric bite)、投擲物品(thro-
wing)以及金幣飛舞(coin-dart)。

相關文件說明：護甲防禦力(Armor Class)
              抗魔法傷害(MDR, Magical Damage Resistance)
"""

[[helps]]
level = 0
keywords = "PP 'POWER POTENTIAL' "
text = """
Power Potential  (魔法潛力)

    魔法潛力代表你能夠抵銷的魔法檢定(svs)的數值。注意，抵銷svs不一定
代表威力增強，有時候是施法成功率增加，尤其顯現在輔助魔法上。
"""

[[helps]]
level = 0
keywords = "SVS 'SAVE VS SPELL' "
text = """
Save vs Spell (魔法抗性)

    魔法抗性代表著你對不同魔法的抵抗性，同時也代表著你對該屬性的適應
性，這個數值是越低越好(負值)，代表對該系的魔法抗性越強、操作性越佳。
目前共分為一般魔法、風系、火系、水系、地系、雷系、闇系、光系以及吐息
九大類，各類分開計算。抗性越強，敵人施法的成功率或是威力會下降；且對
於龍之吐息而言，抵性越強，所能招喚的吐息威力也會越強。

魔法抗性與抗魔法傷害(MDR, Magical Damage Resistance)的關係和護甲防禦
力(AC, Armor Class)與抗物理傷害(PDR, Physical Damage Resistance)的關
係相似。魔法抗性能協助你抵擋一定比例的魔法傷害，是身體抵擋魔法的第一
層防護；而抗魔法傷害則是抵擋固定量的魔法傷害，是你身體抵抗魔法的最後
一層防護。

相關文件說明：護甲防禦力(Armor Class)
              抗魔法傷害(MDR, Magical Damage Resistance)
"""

[[helps]]
level = 0
keywords = "MD 'MAGICAL DAMAGE'"
text = """
Magical Damage (魔法傷害力)

    不同於魔法潛力(PP,Power Potential)，魔法傷害力直接對目標的身體造
成魔法傷害的數值。當魔法潛力抵銷魔法抗性的數值後，魔法傷害力能對目標
額外造成固定量的傷害。

相關文件說明：物理傷害力(PD, Physical Damage)
              抗物理傷害(PDR, Physical Damage Resistance)
              抗魔法傷害(MDR, Magical Damage Resistance)
"""

[[helps]]
level = 0
keywords = "PD 'PHYSICAL DAMAGE'"
text = """
Physical Damage (物理傷害力)

    不同於傷害值(DR,Damage Roll)，物理傷害力是直接對目標物的身體造成
物理傷害的數值。當造成目標物理傷害後，物理傷害力的數值將對目標額外造
成固定量的傷害。

相關文件說明：魔法傷害力(MD, Magical Damage)
              抗物理傷害(PDR, Physical Damage Resistance)
              抗魔法傷害(MDR, Magical Damage Resistance)
"""

[[helps]]
level = 0
keywords = "MDR 'MAGICAL DAMAGE RESISTANCE'"
text = """
Magical Damage Resistance (抗魔法傷害)

    不同於魔法抗性(SVS, Save vs Spell)，抗魔法傷害是身體抵禦魔法傷害
的最後一層防護。當傷害已被法術抗性降低一定的比例之後，抗魔法傷害能再
減少固定量的傷害。

也就是說，魔法抗性能按比例減少傷害，而抗魔法傷害則是減少固定量的傷害。

值得注意的是，抗魔法傷害對抵抗雷系魔法攻擊及炎之鎧甲(flaming armor)特
別有用。

相關文件說明：魔法抗性(SVS, Save vs Spell)
              護甲防禦力(AC, Armor Class)
              抗物理傷害(PDR, Physical Damage Resistance)
"""

[[helps]]
level = 0
keywords = "ALI ALIGNMENT"
text = """
Alignment  (陣營)

    陣營代表一個人正邪程度，有些mob攻擊相反陣營的人，也有裝備會有陣營
的限制，需要特別小心，一般來說共有三種陣營：善良(1000─300)、中立(299
─ -299 )、邪惡(-300 ─ -1000)。攻擊邪惡的mob 就會增加自己的陣營，相反
的，攻擊善良的mob 則是會降低自己的陣營。

"""

[[helps]]
level = 0
keywords = "!"
text = """
指令格式：!

! 可以重複你先前所輸入的最後一個指令。
"""

[[helps]]
level = 0
keywords = "NORTH SOUTH EAST WEST UP DOWN"
text = """
指令格式： north <n> or <->
指令格式： south <s> or <[>
指令格式： east <e> or <]>
指令格式： west <w> or <p>
指令格式： up <u> or <=>
指令格式： down <d> or <;>

這些指令可以用來走向指定的方向，而且全部可以用第一個字母來代表。
例如：n = north，u=up，其他依此類推。
你也可以用比較方便的 - [ p ] = ; 這六個按鍵(都在鍵盤右上方)來移動。
"""

[[helps]]
level = 0
keywords = "CAST"
text = """
指令格式： cast <法術> <目標>

在施法之前，你必需要先學會該項法術 <help practice> 。你對某個法術愈熟悉，
則施法成功的機率愈大。施任何法術都需要消耗魔力點數，消耗的量會隨著你的等級
升高而減少。由於施法前必須專心一致的詠唱咒文，所以無法進行其他動作。

有些法術是不需目標的，而某些法術在不指定目標時會自動選擇一個目標，尤其是
在戰鬥中，因為你總不會用火球打自己人吧？

如果法術的名字超過一個單字（像是full refresh），就必須用單引號來括住法術
名稱（例如：cast 'full refresh' zcecil）。而單字母的法術則可用可不用。另
外，法術名稱是可以簡寫的。

當你施放一個攻擊性法術時，目標通常會有閃躲的機會。如果對方閃躲成功，那麼
法術的效果就會減低甚或完全消失。

各項法術的說明請鍵入 < help 法術名稱> 來查詢(如help fireball)。
"""

[[helps]]
level = 0
keywords = "EXIT EXITS"
text = """
指令格式： exits

本指令會顯示你所在房間中的可見出口，但不一定所有的出口都是可見的。你可能
需要試著到處亂撞才能找出隱藏的出口。
"""

[[helps]]
level = 0
keywords = "DROP GET GIVE PUT TAKE"
text = """
指令格式： drop <物品名稱>
指令格式： drop <數量> coins
指令格式： get  <物品名稱>
指令格式： get  <物品名稱> <容器名稱>
指令格式： give <物品名稱> <人物稱號>
指令格式： give <數量> coins <人物稱號>
指令格式： put  <物品名稱> <容器名稱>

DROP 可以用來將一個物品或一些錢給丟到地上。
 <drop all coins> 可以將所有身上的錢丟到地上。
 <drop 1000 coins> 則可以將身上的 1000 元丟到地上。

GET 用來從地上、容器中，或是屍體的口袋裡（雖然指令是'get all corpse'，但
是從屍體「裡」拿東西還是一件很奇怪的事情）取得物品。TAKE 和 GET 是兩個完
全相同的指令。

GIVE 是用來將一個物品，或一些錢轉交給另一位人物（或是非玩者人物）。

PUT 可以將一個物品放進能容納它的容器裡。

DROP、GET，以及PUT 都可以使用'all'來代表身上所有的東西，或是用'all.物品
名稱'來代表所有的同名物品，例如get all.key。

GET n.obj 可以用來指定第 n 個同名稱的物品。

DROP n.obj 可以用來指定第 n 個同名稱的物品。
"""

[[helps]]
level = 0
keywords = "DONATE"
text = """
指令格式： donate <物品>

DONATE用來把多餘的東西捐出來，自動放到聖殿的奉獻箱裡，供給別人使用。

每個時空會有一個自己的奉獻箱。
"""

[[helps]]
level = 0
keywords = "REPAIR RECOVER"
text = """
指令格式： repair <武器或防具>
指令格式： recover <防具>

裝備都有耐用度，如果耐用度降低將會使裝備的效果大打折扣甚至毀壞到無法
使用，因此裝備需要找工匠幫忙定時保養維修，以為持最佳狀態。

REPAIR 指令能在工匠處花錢修理裝備耐用度，修理裝備前記得先把裝備脫下。
       如果有多件裝備需要維修，可以輸入 repair all 的指令，能一次性的
       修理身上所有攜帶的裝備。


RECOVER 多數的鎧甲修理僅只是修補破洞，遭腐蝕的裝甲需要靠魔法才能恢復原
        樣。該指令能在工匠處修理裝備被腐蝕造成防禦力下降的問題，但價格
        不斐，如果不想花大錢修理可以找認識的鍊金師幫忙一件件修理腐蝕的
        部分。但如果自認財力十足，也能輸入 recover all 的指令，一次性的
        修復身上攜帶的所有備腐蝕的裝備。


相關說明：護具修復術(repair armor)
"""

[[helps]]
level = 0
keywords = "SKADV"
text = """
指令格式： skadv <技能>

和practice相似的指令，必須要找到導師才能進行。
可以提升你的技能等級，另外可用skdemote來回收已
提升的技能等級，詳情請help skdemote。

"""

[[helps]]
level = 0
keywords = "SKDEMOTE"
text = """
指令格式： skdemote <技能>

如果你升錯了技能，也可以取消。這個不需要找導師就可以做了。
降低技能可以得回一部分的技能經驗值，然後，你就得再去賺回損
失的量。關於提升技能等級的部分，請參考help skadv

"""

[[helps]]
level = 0
keywords = "DESTROY"
text = """
指令格式： destroy <物品>

將身上丟不掉、死了也會回到身上、專屬於個人(personal)的物品毀滅掉。
請記住，毀滅掉的物品無法復原。
"""

[[helps]]
level = 0
keywords = "EQUIPMENT INVENTORY"
text = """
指令格式： equipment
指令格式： inventory

EQUIPMENT 會列出你目前身上所穿的裝備（甲胄、武器、手持物等）
簡化指令是 eq
INVENTORY 會列出你身上所有的物品（不含裝備）
簡化指令是 i

如果你的職業是騎士或領主的話，你可以使用這兩個指令後面接著坐騎的 ID
，那麼你將可以快速地檢閱坐騎身上的裝備與物品。
"""

[[helps]]
level = 0
keywords = "COMPARE"
text = """
指令格式： compare <物品1> <物品2>
指令格式： compare <物品>

COMPARE 用來比較你身上的兩個物品。如果兩者都是武器，則會顯示何者具有較強
的殺傷力；如果是甲胄，則是顯示何者具有較好的防護等級。

COMPARE 如果只接一個參數，則內定是比較該物品與你現在所裝備的同型物品孰優
孰劣。

COMPARE 比較時不會考慮其他特殊的物品能力。
"""

[[helps]]
level = 0
keywords = "DISPERSE"
text = """
指令格式： disperse
指令格式： disperse "項目"

DISPERSE 是用來解除角色身上特定增益效果的指令。

如果指令後不接任何項目或接 all，則會一次解除多個項目的增益效果。

如果指令後接有特定項目的名稱，則只會解除該特定項目的增益效果。

DISPERSE 指令的項目需輸入完整名稱
"""

[[helps]]
level = 0
keywords = "BACKSTAB BS DISARM KILL MURDER "
text = """
指令格式： backstab <人物>
指令格式： disarm
指令格式： kill     <人物>
指令格式： murder   <玩者人物>

KILL 會開始一場不死不休的戰鬥(當然，你還是可以逃走)。而 BACKSTAB 則是另
一種開戰的方式，通常是由盜賊所採用。BS 是 BACKSTAB 的簡寫。BS的傷害力通
常都是普通一擊的數倍，身手敏捷的玩家還有機率使出第二段背刺（刺客的優勢
更明顯。）
雖然BS不能攻擊正在戰鬥中的敵人，但是尚未參戰的藏匿刺客和有領主領導的旁觀
藏匿隊員不在此限。

MURDER 可以殺死其他玩者人物(用MUD術語來說，叫做 PK，player kill/killing)。
目前禁止 PK 等級低於 20 的玩者，還有，用 MURDER PK 別人是會受到處罰的。
另外有一種終身加入 PK 的辦法，詳請可 help pk。

DISARM 是一個輔助性的戰鬥指令，只用來解除對手的武裝（不會死人的）。
另外，BASHHEAD 會比用空手造成較多的戰鬥傷害.

想要提高BACKSTAB、ASSAULT、DISARM，或是BASHHEAD的成功率與效果，必須要多多
花錢練習對應的技能。
"""

[[helps]]
level = 0
keywords = "FEED"
text = """
技能名稱：吸血(feed)，吸血鬼之吻(vampiric bite)
指令格式：feed <生物>
使用時機：開戰前與戰鬥中

FEED 是吸血鬼專用的技能，可以用來吸取目標的生命力以為己用。
"""

[[helps]]
level = 0
keywords = "'VAMPIRIC BITE'"
text = """
技能名稱：吸血鬼之吻(vampiric bite)
指令格式：c 'vampiric bite' <生物>
使用時機：開戰前與戰鬥中

吸血鬼之吻是法師模仿吸血鬼在吸血(feed)時所產生的效果而研發出
的法術。命中後可以造成目標身體出血，在戰鬥中不斷流失生命，並
且施法者能藉此奪取對手生命力佔為己用。
"""

[[helps]]
level = 0
keywords = "FRENZY"
text = """
技能名稱：狂暴攻擊(frenzy)
指令格式：frenzy
使用時機：戰鬥中

Frenzy是一個強而有力的攻擊指令，可以依照技能等級連續攻擊目標數十次！
狂暴的過程會使你失去一些生命點數(hp)。要使用frenzy之前，你的生命力不
能太少。另外，非狂戰士的職業在frenzy時也會消耗一些體力點數(mv)，所有
的職業在frenzy之前都要有一定的體力才有氣力使出。注意！不是某個基本職
轉成的狂戰士，使用frenzy當中，敵人都有機會有效的閃躲(dodge)和武器與
盾牌格擋(parry/block)掉你的層層攻擊。
"""

[[helps]]
level = 0
keywords = "REGENERACY"
text = """
技能名稱：再生能力(regeneracy)
指令格式：無
使用時機：學習後戰鬥中自動使用

當你學會本項技能後，在戰鬥中會回復生命點數，注意，這項能力的強弱是看敵我雙方
的實力來決定回復程度的，所以不必期待與野狗打架會有多好的回復效果。不過，當敵
人的等級超過36時，你的再生能力一定會作用。除此之外，一旦你中毒之後，再生能力
會因此而暫時消失。
"""

[[helps]]
level = 0
keywords = "POWERBLOW"
text = """
指令名稱： 重擊術(powerblow)
命令格式： 無
使用時機： 戰鬥中自動使用

在血腥的殺戮之中，狂戰士們為了更能重創對手，他們泯滅了自己的良性，
讓自己在面對敵人時，更能毫不遲疑的利用本身肌肉瞬間爆發力，配合著武
器，來撕裂對方，給於對方更致命的傷害。當你擁有了這項技巧之後，別忘
記找一把傷害上限強的武器，讓它爆發出更恐怖的破壞力。
"""

[[helps]]
level = 0
keywords = "INVOKE"
text = """
技能名稱：神靈附體(invoke)
指令格式：invoke
使用時機：非戰鬥中

