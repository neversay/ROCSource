text = """
第十章、第二次大發現時代

本時代與下一個時期「奴隸制度興起」是一串經歷兩百年的漫長過程，其成就與
發現足夠寫滿三大本書，在此只簡述最重要的發現。

最早也是最振奮人心的發現便是找到了傳說中的小妖精(Fairy)國度。
衛城之役後，一位奧夫卡的大地教徒誤打誤撞發明一帖解毒劑，沒想到用在克服
綠樹瘴氣也有極好成效。一隊探險隊靠著解毒劑深入綠樹森林，發現史上最大的
巨木森林和一種前所未見的生物：「Pillywiggin!」這是第一名發現者的吶喊。
Pillywiggin（即小妖精之意） 是舊大陸傳說中的仙靈生物，有著巴掌大的肉體
和兩對蜻蜓薄翅，據說永遠不死。而新大陸冒險者見到的小妖精與傳說中的幾無
二異，但他們見到的只是幼體。當真人般大，振著雙翅赤身裸體的成年小妖精出
現時，幾乎嚇昏所有冒險者。

西方傳來了這個好消息，駛向東方新航路的商隊也毫不遜色。
東方商隊越過矮人和泰洛斯族的領地，避開食人魔的追擊，終於抵達了史卡拉貝
文明區的最東界 ─ 東方大沙漠。翻越一脈深鬱的野蠻森林和高山，開展眼前的
竟然是滾滾黃沙和遠方迷濛的金字塔幻象。這裡就是精靈族傳說的中央沙漠，橫
亙整個新大陸中央的巨大沙漠阻絕了大陸東西壁的交通，也阻斷了精靈族與其母
帝國的交通達萬年之久。心滿意足的冒險者開始調查大沙漠附近的地勢，竟然發
現了傳說中的人馬族以及其居地旁的雙子飛龍塔；另一支分隊北上穿越食人魔領
地，找到了另一座廢棄已久的精靈帝國遺跡 ─ 永恆之塔。據人馬族傳說，這兩
座塔原是精靈族在東方大沙漠未出現時，為了抵抗惡鬼族的侵略而建起的要塞，
後經大沙漠成形及帝國中衰，只好棄守。滿懷虔誠的調查隊在永恆之塔發現了成
堆的魔法典籍和物品，這發現震驚全魔法界，成百的法師不遠千里跋涉而來，只
為學習遠古強大的法術知識。突然遽增的日常用品需求和魔法物品轉賣壯大了東
方貿易網，也促成位於沙漠和永恆之塔中途的魔法交易市 ─ 麥格城的誕生。

進剿巨魔勢力的羅胡要塞遠征隊全軍覆沒，殘存的敗兵回報他們誤入巨魔陷阱，
被引入迷霧漫天的詭異森林裡，在那裡，他們遭遇到強大的魔法人偶群攻擊，後
撤數里終於脫離敵軍，卻又誤入一處無樹盆地，遭受恐怖的龍族攻擊。
為了徹底調查是否有新興的邪惡勢力崛起，要塞再次派出更強大的軍團，進發迷
霧森林。經過一段不短的征戰後，軍隊與人偶之主，居於高塔的魔法女王訂定互
不侵犯協定；在打下幾場勝仗後，軍隊在龍族的根據地龍塔之前一樣簽署了和平
條約，連年騷亂終於平定，西南地區再也不是商旅的惡夢了。

奧夫卡地方經過連年的勵精圖治，掌握了最高的礦產貿易量，終於在史卡拉貝議
會奪得席次，通過讓奧夫卡自由開墾的許可。大批滿懷希望的牧民移出剛建完灌
溉水渠的奧夫卡四省農業區，遷向廣闊的北方大平原，畜牧上百萬羊隻牛隻。隨
著牧地和牲口頭數的增加，奧夫卡缺乏人力的問題浮上台面。富有的奧夫卡買主
開始跟史卡拉貝下九流的黑道勢力掛勾，開啟人口販賣的先例，雖然史卡拉貝議
會隨後禁止販賣人口，但黑市市場依然熱絡，為下一個時代揭開布幕。

強大的史卡拉貝艦隊終於繞過風暴海，抵達位香料群島不遠的另一塊大島，此島
受風暴海系統影響，濃霧終年籠罩，故稱之「迷霧之島」。剛經歷大戰，開始對
外世界好奇的泰洛斯城，以豐富的財力買下此島一部份的土地，在上方蓋了一座
堡壘，至於用途為何，只有偶而流出的情報可知此處是泰洛斯秘密訓練情報人員
─ 俗稱〝忍者〞之處。

至此，得助於永恆之塔豐富遺產，人類的魔法技術開始突飛猛進，除了古老的巫
術系統，提煉魔法精粹及精通草藥知識的練金術士和召喚強大生物及產生幻象的
幻術師系統也正式誕生，超強的法術接連產生，促進人類勢力更加強大。

史卡拉貝顛峰已至，極盛的史卡拉貝領土超過一半文明區，人類的行徑也越來越
囂張、墮落。為了享受，富貴人家開始畜養奴隸，驕奢浪費。

史卡拉貝史上最頹廢糜爛的時代開始了。

