當時的人類猝不及防，小惡鬼和巨魔原本是可以成功的，不過由於兩族間的一些
齟齬及戰術失誤，人類迅速地關閉城門、發出求援、組織反抗部隊，和敵軍展開
拉鋸戰。數日後，史卡拉貝艦隊趕回，切斷了敵軍的水運補給線；從北方馳援的
奧夫卡騎兵隊和精靈術法軍也適時趕到，擊退小惡鬼的最後反抗，首領瓦其頓也
被精靈大法師馬林的法術壓扁，塞進了自己的戰靴裡。歷時十多日的第一次衛城
之役終於在北方諸族的合作下獲得最後勝利。

這一仗使得史卡拉貝成為文明區北方最重要的軍事大城，人類和精靈族共組的北
方聯盟成形，與南方的小惡鬼邦聯形成對壘之勢，戰後一年，公民大會通過成立
常備軍隊的決議，以及開放關口給精靈族自由進出，從此史卡拉貝進入多種族融
合共存的新局面，也走出稱霸大陸三百年的第一步。

