[[helps]]
level = -1
keywords = "HISTORY"
text = """
[4/0] 幻世傳說(World of Fantasy)於2001年3月份系統大抵完成，並更名為
      混沌幻世(Realm of Chaos)。目前正式站址為 140.112.21.16:5500

      不想要或想重練的角色可用 "suicide <passwd>" 來自殺.

      殯儀館和招屍術(grave robber)寫好了，以後死掉可以買屍體或招屍了.
      殯儀館買屍請 'look list'，關於招屍請help grave robber.

[8/15] ROC 正式開放第二recall區 - 迷霧之島。

[5/4] 對於 ROC 中對於職業與種族新增能力的詳細內容，可以 <help race> 與 <help class>
      來獲得詳細的解說。

[2/9] ROC 已於 2002/02/09 06:00 PM 正式復站。

[2/10] ROC於2002/2/10施行兩個新制度，內容如下：

        ROC玩家薪水制度：

        1、玩家依照其等級與威望值都有其固定的薪水。
        2、薪水發放的時間為每一個半月(45天)。
        3、時間計算的方式為線上時間的一個半月。
        4、玩家領薪水的時間不同，取決於玩家在線上的時間。
        5、請各位玩家到史卡拉貝銀行中向天宇(Sup)領取薪水。
        6、詳細薪水數目與等級、威望值的關係可於銀行中得知。

        ROC所有區域Mob攜帶金幣數量調整：

        ROC所有區域的Mob身上的攜帶金幣數量。除了區域作者特別
        指定以外，將依照種族以決定其攜帶金幣數目。例如龍族、
        不死族、惡魔族、吸血鬼....等等有機會得到比原來更多的
        金幣。人類攜帶的金幣數將也比其他類人種族為多。動物、
        恐龍、昆蟲....等等種族將不會攜帶任何的金幣。若出現奇
        異的數字，請玩家回報。

[2/17] 為因應預防不肖玩家multi login不斷創造等級1 new char而
       不斷重複give/drop all coins過程而修改lv1-2玩家不能give
       /drop coins之措施，因此史卡拉貝與光明之鎮的招屍服務修
       正為lv1-2的玩家免費。

       此外，有關clan的補償措施，請原本舊clan的幫主，除已成為
       ROC工作人員者以外，先將幫主的char練到lv38以方便創幫。
       創幫所耗用的經費已經過去幫會的經驗點數將由工作人員補償
       ，至於過去幫會的存款部分將不予以補償。過去幫會曾經創造
       的房間與物品檔案都還在，因此創幫後即可正常如同以往一般
       運作。

