[[helps]]
level = 0
keywords = "PRACTICE"
text = """
指令格式： practice
指令格式： practice <技能|法術>
指令格式： practice + <導師>
指令格式： practice <技能|法術> <導師>

PRACTICE指令可以讓你查看目前所能練習的法術和技能，並顯示各技能的基本熟練度。

若要練習某項技能或是法術，必須在公會導師的房間中才能進行，而且要該導師有教
授你想練的技能才行，你可以輸入 practice，如果技能名稱前面有 + 號表示有教授。
你所能靠訓練提升的技能的熟練程度從最低的0%(不會該項技能)，到最高可能是
75%至90%之間，依據你的職業和等級而定。

你的智力愈高，學習的效果愈好；若是智識愈高，升級時所獲得的學習點數愈多。

另外，練習技能是要付費的，你總不能讓公會導師沒錢餓死吧。

如果你要學習的技能多於一個字，就要用單引號括起來，並在後面接上導師名，例如
practice 'gfull heal' dynia

PRACTICE 增加新的格式，在一個房間裡有許多 MOB 時，可以向指定的導師學習
技能，或是查詢指定導師的技能。PRACTICE + 導師 可以查導師的技能。

關於技能等級的部分，請參考help skexp，help skadv，help skdemote。

"""

