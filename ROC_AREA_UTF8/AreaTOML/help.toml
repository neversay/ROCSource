[[helps]]
level = 0
keywords = "NEWBIE"
text = """
首先，你可以到混沌幻世(Realms of Chaos)的網站和BBS上找到許多有用的
資訊，網址在進站畫面上應該有註明。若是你對混沌幻世的世界很陌生，我們強
烈建議你到BBS或網站看看，這將會減少你許多學習的時間。

　　這是一充滿冒險與幻想的世界，你將會碰到許多新奇的人和事。在這裡我只
能告訴你一些基本的東西，其他就要靠你慢慢從旅途中體驗。

　　一開始你必須選擇你所扮演的角色的種族與職業。這是一個複雜的選擇，因
為在這個世界裡沒有完美的東西。你可以輸入help race與help class看看。

　　順著新手學校的引導，你應該很容易就能升到第二級，趕快將你的人物檔案
儲存(save)起來，這樣下次你就不必從頭再來。如果一開始就碰到困難，你可以
用tell指令尋求其他玩家的幫助，或是用question頻道來請教線上所有的玩家。
如果告訴他們你第一次接觸這類遊戲，相信大部份玩家都很樂意幫助你。

　　你可以在新手學校的訓練場中待到第四級之後再出新手學校探險，新手學校
中的教授對於循規蹈矩，循序漸進的學生有著特別的獎賞，因此請記得注意聽取
學校內教授所有的指示。

　　請輸入 help newbie2 翻到下一頁。
"""

[[helps]]
level = 0
keywords = "NEWBIE2"
text = """
幾乎所有用括號括起來的英文字都有進一步的作用，這些關鍵字詞你可以使
用 help <keyword> 或 look <keyword> 來啟動。或你也可以跟非玩家角色(mob)
用 talk 的指令來打聽消息，只要輸入 talk <mob name> 即可。如果發現對話裡
有新的線索，可以用 talk <mob name> <keyword> 進一步追查。不論何時都可以
輸入 recall 或 /，只要是天神聽得到你祈禱的地方，就會把你帶回史卡拉貝城
的聖殿。

　　一般玩家在告訴你路徑時，通常會以 / 為起點。譬如 /d 就是 recall後再
往下(d)一格，也就是你一進入遊戲所在之處。/2d3s 就是recall後往下(d)走兩
格再往南(s)走三格，以此類推。你可以輸入 help maps 看 ROC 的地圖。

　　在Mud School裡你可以升到第四級，四級以後因為等級太高，打Mud School
裡的怪獸(mob)基本就獲得不到什麼經驗點了！所以擊敗Mud School的考試官後，
我們建議你到競技場(/2d)繼續你的修業。你可以在競技場升到等級七左右，就可
以準備到繁華的史卡拉貝城內晃晃，考慮你自己的下一步。

　　史卡拉貝城是個繁華的海港城市，有許多商店與來自各地的冒險者，山頂聖殿
有醫者無償地為你施法治療及各種防禦法術，而且警衛與終結者都會保護你。如果
你怕在城裡迷路，/ 就有份詳細的市街圖(map)可以參考。

　　請輸入 help newbie3 翻到下一頁。
"""

[[helps]]
level = 0
keywords = "NEWBIE3"
text = """
作戰是你獲得經驗值的主要來源。在Mud School及競技場裡的mob都很瘦弱，
危險性不大。但是其他地方就不同了，有些魔王甚至在你還沒看清他之前就可以
把你做了！

    如果你是一位新手冒險者，我們建議你一開始選擇戰士這門職業，然後在適當
的時機轉職為僧侶。一位帶滿藥水的戰士有很高的生存率，而武藝精湛的僧侶既使
沒有超級的裝備，也能發揮強大的戰鬥力。

　　碰到不確定強度的怪獸(mob)你可以先用consider指令，看看有沒有希望打贏
它。砍死怪獸(mob)後你會獲得經驗(exp)和裝備，你可以輸入get all corpse 把
戰利品從屍體裡拿出來，然後如果有拿到金錢的話可以用split <錢數> 來和隊友
平分所得的金幣。獲得一定的經驗值後你會自動升一級(level)，升級後別忘了到
史卡拉貝城內的各職業公會學點技能(skills)或法術(spell)，並且到商店裡看看
有沒有新的武器護甲或特殊物品可以使用。記住戰士系(war)的人物非常依賴他的
裝備，所以請不要吝惜你的金錢.....

　　殺敵一千，自損三百。打仗沒有不受傷的，如果你的生命力太低，請別暴虎
馮河，還是趕快找醫生(doctor)醫療一下。另外，一些輔助性法術像blindness，
faerie fire，bless，armor等....。都能給你很大的優勢，如果你無法施法，不
妨找商人買些藥水魔杖或捲軸。(你必須先學會揮舞魔杖及朗誦卷軸才行用。)有
些行走各地的商人會賣好東西，這就需要靠你自己打聽了(talk <mob name>)。

　　請輸入 help newbie4 翻到下一頁。
"""

[[helps]]
level = 0
keywords = "NEWBIE4"
text = """
如果不幸戰死，而且又沒能力把屍體的裝備撿回來，你可以到 /2sen 去買回
自己的屍體。但買屍體是要錢的！所以請事先存點錢(deposit)在銀行(/2s3wn)，
急用時才有錢可以領(withdraw)。

　　如果你在升級方面真的遇到很大的困難，也許可以到BBS上查詢，一些老經驗
的冒險者已經將他們的經驗詳細寫出來。

　　既使對一位老手而言這個世界仍然隱藏許多危險，所以我們建議你最好找其
他玩家組成一隊，共同冒險。你可以輸入 who看看有那些人現在在線上，如果他
們等級和你相近，你可以邀請他們與你一起組隊，輸入 help group 能了解組隊
的方法。ROC 提倡團隊合作，有許多地方、有許多事情是非得要好幾位隊友互相
幫助才能進行下去的....

　　記住，多看(look)、多問(question)、和別人組隊(group)，這是我能給你的
最好建議。祝你有個愉快的旅程。　　　　　　　　　　　　　　　　-- Amenda


　　請輸入 help levelup 看看快速升級技巧。
"""

[[helps]]
level = 0
keywords = "LEVELUP"
text = """
警告：以下的內容是等級一到等級八左右的快速升級技巧，
       如果你不想喪失太多探索的樂趣，還是把它跳過吧。

如果你已經輸入 help race 或 help class，一定被混沌幻世眾多的種族職業組合嚇了
一跳。不過別太緊張，因為嘗試各種組合搭配將是你未來的一大樂趣，至於目前，
我還是建議你先選擇戰士為你第一份職業，這樣可以讓你減少許多挫折感。

一開始你的基本屬性可能沒有全滿，建議你到/dsw去訓練(train)一下。wis, con, str
都是剛開始就會需要到的屬性，能撐多高就多高。而/dse是技能魔法訓練室，可以傳授
你一些"基礎"的技能(就是前面有個小'+'號那些)。不過你必須到第三級才能學習，
所以讓我們先去嘗一點血腥的快感吧....

順著 Mud School 的引導，你應該發現在/dsssssed有四個大籠子，裡面都有一些怪獸。
別客氣，這是神族給新手們的一點心意，趕快殺來進補。殺掉怪獸別忘了 get all
corpse, wear all 來穿上你的戰利品。喔，對了，別太貪心拿了一身沒用的東西，
這可是會降低你的閃避能力的。多餘的裝備你可以拿到城裡的武器、護甲店賣點蠅頭
小利，/就有份map讓你查閱店鋪位置。

這四個大籠子的怪獸特別容易殺死，而且中央的牧師會幫你上許多防禦性法術，甚至還
會給你一些好裝備，所以，在時間還沒到之前就賴在這裡升級吧 :P。哪時候算時間到
了？別急，那位牧師會告訴你的....

有時候冒險者太多，大家搶怪獸殺搶得不亦樂乎，這如何是好？教你一個訣竅，"把競
爭者變成幫助者"，邀請他和你一起組隊吧(help group, help tell)。組隊起來不但戰力
大增，經驗值又不會減少，一輪就把怪獸殺死省得它到處逃竄，真是有說不完的好處。
而且，很快你就會遇到一個quest(任務)是需要兩個冒險者的隊伍才能完成的，為了避免
到時候找不到人陪你完成任務拿到獎勵，還是趁早打下人脈吧。

當你擊敗 Mud School 考試官後，Mud School 大概也容不下你這位大和尚了。此時不妨到
繁華的城裡四處逛逛，向城裡的居民打探點消息(talk mob-name)。你的第一份任務會在
/接到，應該很容易就完成。至於第二項任務就稍難了，你必須把史卡拉貝城逛熟才行。

接下來我建議你到城西北的藍色小精靈區擄掠一番(在城裡，別跑出城門了)。小聰明
的眼鏡是個不錯的 baby eq，而且你還能撿到龍葵這項關鍵物品。四到八級的升級區還有
城南的 mob 工廠，城裡的馬戲團，/dd的競技場，以及出西城門向南走的地精村。這裡的
mob 開始有一點難度，你有可能會曝屍路旁。記得開打前先 consider 一下，而且手上有
武器的傢伙還是少碰為妙。(當然如果你們人多，那就一路 殺 殺 殺....就是了)如果你
不幸戰死，切記要回來把自己屍體裡的裝備撿起來，或者到 /ssen 向喬藍多買屍體
(give xxxx coins Joe)。

當你升級後，別忘了訓練自己的技能或魔法，那可是你吃飯的傢伙。比較好的技能你必
須在各職業公會會長那裡學，一些傳說中的技巧甚至要歷經千山萬水才學得到，就看你
的造化了。另外也該時常到武器護甲店買更好的裝備，否則賺那麼多錢幹什麼呢？而在
/ssswn的寵物店也很重要，買一隻寵物就多一個幫手，最是養老溫貧。

升級一般人講究穿升級裝備，這樣在升級時才會多加一些屬性。升級裝備何處尋？唉，
一言難盡，有些甚至要完成特殊任務才拿得到。建議你到 bbs 上查查看，或者直接問線
上的老手吧。任務(quest)是這個世界裡相當精采的一環，至於任務的解法，關鍵就是注
意所有細節。由於大部分的 mob 都可以打聽，很多提示都會在對話裡出現，有些任務甚
至有好幾種分支和解法，這也只能靠你慢慢發覺。

講得這麼清楚，要是你還升不了級，那只有最後手段，向線上的老玩家求助吧。你可以用
question, tell, chat 來告訴他們你的困難，當然，語氣可要諂媚一些喔！
"""

