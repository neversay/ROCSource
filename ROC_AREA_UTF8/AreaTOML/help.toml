text = """
第九章、重建時代

非常破壞之後是非常建設。戰爭正式宣告結束後，住民們開始為重建史卡拉貝而
忙碌起來。為了感謝天上諸神的護祐，戰後史卡拉貝的居民在舊神殿廢墟上重建
了一座更巍峨莊嚴的白色大理石聖殿。神殿位於山頂，俯眺遠方繁華的芬維海港
與鄰近平原。除了做為附近居民的信仰中心外，也可作為戰時的瞭望堡壘。
在神殿的最深處，放置了三主神：月之女神黛妮亞，海航與商業之神迪利恩與戰
神奧瑟蘭的神龕。後來，為了酬謝月之女神信徒在大戰中擔任醫療隊的貢獻，市
民大會決議將黛妮亞的祭壇移至中央。此事雖引起其他教派的不滿，但礙於城內
女神教徒壓倒性的數目優勢，只好隱忍下來。

城外，經歷了幾個月的辛勤努力，人類在獸人軍隊的戒護下終於重建了更為強固
的新羅胡要塞。新要塞比舊的更深入黑森林，防禦範圍涵蓋全部黑森林，南達巨
魔和牛頭人的根據地。自此之後，西方大路終於宣告平靜。日漸興繁的路上客旅
為一向神秘難解的西北地區帶來探險熱潮。不再害怕巨魔突襲的冒險者越過現今
的茵夢湖高原，來到一片巨大原始的檜木寒葉林。雖然受阻於可怕的瘴氣而不得
深入，但人類總算為地圖上那塊空缺畫上代表森林的翠綠。

為了收容戰時產生的難民和孤兒，市政府在原東方城牆的廢墟上搭起一座座收容
營，沒多久髒亂的收容營發展成貧民區。缺乏管理龍蛇混雜的貧民區淪落為無賴
和黑勢力角逐的獵場，讓市議會頭痛不已。

總觀史卡拉貝這段時期的發展，她從廢墟上重新站起，藉著戰勝的餘威大大擴展
自身勢力，將以往的宿敵趕出荒廢已久的交通要道，暢通內陸水道，讓商隊和冒
險者能更安全地向未知地帶探險，不久後，史卡拉貝史上最強盛的時代來臨。

