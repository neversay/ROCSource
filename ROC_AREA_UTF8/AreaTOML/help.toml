text = """
技能名稱：脫離術(evacuate)
指令格式：cast evacuate , cast evacuate mark , cast evacuate cancel
使用時機：平時或戰鬥中

巫師的獨門絕招，相傳是當年精靈內戰時的巫師所發明的空間法術。巫師在戰場
中受到生命危險時，會使用此法術脫離戰鬥。一旦成功，周圍的同伴(僅限玩家)
都會被瞬間傳送到附近最安全的地方----通常是那個時空的出發點(recall)。但
此法術不僅消耗大量魔力，受傳送的人物也將體力盡失，短時間內會全身虛脫。

操控空間屬於最高階的法術，平時就難以成功施展。更別提想要隨心所慾的傳送
到特定地點。然而在經歷第三次衛城之役後，一位失業巫師為了靠送貨大量賺外
快，改良這項古老的法術，成功的讓自己能快速傳送於各大城市間。

這項技術的運作原理是先將部分魔力(cast evacuate mark)標記在地脈流串魔力
之處，隨後施展脫離術(c evacuate)追跡自身的魔力標記，從而使移動位置比起
時空出發點，更導向標記地點。

然而這項技術有幾個限制：其一，只能用在流串著魔力的地面之上；其二，標記
一次只能設定一處；其三，對脫離術有一定程度的熟練。就算達到這些條件，也
不表示能在危險的地點(no recall)或設有結界的空間(no teleport)之間傳送，
但也無須感到絕望。畢竟世上也存在著能夠無視限制進行傳送的強大巫師，只要
更加熟練這門魔法，種有一天能突破時空！

相關說明：標記術(mark)
          傳送術(teleport)
"""

[[helps]]
level = 0
keywords = "'BATTLE ARRAY'"
text = """
技能名稱：陣形(battle array)
記憶陣形：battle <陣形數+指令數> <指令>
下達陣形：battle <陣形數>
使用時機：記憶陣形於非戰鬥中，下達陣形於戰鬥中

領主可以在戰鬥前先設好三種陣形，每個陣形是由 1-3 道指令所組成。
當戰鬥中下達某一陣形，這個陣形的三道指令會連續地執行，沒有間隔。

陣形的設定法是：

第一個陣形的第一道命令：battle 11 xxxxx
第一個陣形的第二道命令：battle 12 xxxxx
第一個陣形的第三道命令：battle 13 xxxxx

第二個陣形的第一道命令：battle 21 xxxxx
第二個陣形的第二道命令：battle 22 xxxxx

依此類推.....最多能記憶有三種陣形。

在戰鬥中要下達某個陣形時以 battle：
下達陣形一：battle 1
下達陣形二：battle 2
下達陣形三：battle 3

陣形與領導相結合將可使領主在危急時為隊伍做許多事。

相關說明：領導(lead)
          組隊(group)
"""

