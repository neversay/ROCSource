        else
                say 這件袍子就送給你吧！
                mpoload 935 $n viclv target
		mplog give quest eq vnum 935 to $n
        endif
endif
"""
[[mobiles.905.programs]]
trigger = "talk_prog"
argument = "reward"
script = """
if is_qmark($n) == olympus_jail_quest 100018
        mpmod_qmark $n olympus_jail_quest v0 + 3
        say 你真的解放他了嗎？
        say 真是太太太感謝你了！
        if rand(45)
