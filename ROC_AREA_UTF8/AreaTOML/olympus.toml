        if ischarmed($i)
                break
        else
                say 我該回到奧林帕司山去了....。
                mpcallout 1 mppurge self
        endif
endif
"""
[[mobiles.905.programs]]
trigger = "talk_prog"
argument = "p ask about zeus"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_weapon_quest 100004
                mpadd_qmark $i olympus_talking 10 0 0 0 0 1
                mpcallout 2 say 這個呀～
                mpcallout 4 glare
                mpcallout 6 say 難怪我最近嗅到暴戾之氣在奧林帕斯聚集 ..
                mpcallout 10 say 我看，是魔劍「切割者」又回來了。
                mpcallout 14 say 那把魔劍在兩百年前就在奧林帕斯裡掀起腥風血雨。
                mpcallout 18 say 諸神的黃昏他也有參與，幾個北歐神祇都是最近才藉神力復活的。
                mpcallout 20 say 真是該死！它可以隱藏自己的魔力。
                mpcallout 22 say 一般的法術是找不到的，你可以嘗試在各神祇之間搜尋，或許會有些斬獲。
                mpcallout 24 say 一切！都靠你了！
                mpcallout 24 mpmod_qmark $n olympus_weapon_quest v0 + 1
                mpcallout 24 mpdel_qmark $i olympus_talking
        else
                mpadd_qmark $i olympus_talking 2 0 0 0 0 1
                say 宙斯？就是奧林帕斯諸神統領呀！
                mpcallout 2 say 連他都不認識，你也未免太孤陋寡聞了吧！
                mpdel_qmark $i olympus_talking
        endif
endif
"""
[[mobiles.905.programs]]
trigger = "talk_prog"
argument = "p prometheus' situation"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_jail_quest 100003
                mpadd_qmark $i olympus_talking 2 0 0 0 0 1
                say 這個嘛，其實我也想幫他很久了，但是 ...
                mpcallout 2 say 宙斯他呀，喜怒無常的。
                mpcallout 4 mpechoat $n 阿波羅似乎有什麼難言之隱。(troubles)
                mpcallout 4 mpmod_qmark $n olympus_jail_quest v0 + 1
                mpcallout 4 mpdel_qmark $i olympus_talking
        endif
endif
"""
[[mobiles.905.programs]]
trigger = "talk_prog"
argument = "troubles"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_jail_quest 100004
                if is_qmark($n) == olympus_weapon_quest 200009
                        mpadd_qmark $i olympus_talking 2 0 0 0 0 1
                        say 這個嘛，你可以試試把你鑄造的聖劍給宙斯看看，說不定他會發特赦令。
                        mpcallout 2 say 不過，克萊弗那邊就要靠你交涉了.(please give me the sword)
                        mpcallout 2 mpdel_qmark $i olympus_talking
                        mpcallout 2 mpmod_qmark $n olympus_jail_quest v0 + 1
                else
                        mpadd_qmark $i olympus_talking 2 0 0 0 0 1
                        say 你可以試著去找找看聖劍普魯托，把他呈獻給宙斯，說不定他會發特赦令。
                        mpcallout 2 say 你可以去克萊弗那裡問問，說不定他會有些消息.(ask about sword)
                        mpcallout 2 mpdel_qmark $i olympus_talking
                        mpcallout 2 mpmod_qmark $n olympus_jail_quest v0 + 1
                endif
        endif
endif
"""
[[mobiles.905.programs]]
trigger = "talk_prog"
argument = "award"
script = """
if is_qmark($n) == olympus_jail_quest 100007
        mpmod_qmark $n olympus_jail_quest v0 + 14
        say 你真的解放他了嗎？
        say 真是太太太感謝你了！
        if rand(45)
