[area]
name = "奧林帕斯山"
identity = "olympus"
builders = "Generic"
translator = "Pluto"
modifier = "Amushi"
vnum_start = 900
vnum_end = 993
security = 1
recall = 3001
f_toggle = false

[mobiles.901]
keywords = "zeus-olympus god"
short_description = "宙斯(Zeus)"
long_description = "宙斯(Zeus)正坐在祂的王座上.\n"
description = """
在你面前所見到的是奧林帕斯山諸神中最偉大的一位. 祂似乎只要用一個念頭就
足以把你殺死. 祂對你的每一瞥都深深地刺入你的靈魂. 你終於知道什麼是你所
該畏懼的. 他手上的閃電吱吱作響, 代表了他煩惱著什麼. 你應該嘗試問問.
(What worries you?)
"""
act_flags = ["NPC", "SENTINEL", "ARTIFACT"]
affected_flags = ["INVISIBLE", "DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "PROTECT", "FLYING"]
alignment = 1000
level = 51
mod_hitplus = 300
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 8000
sex = "male"
race = "God"
class = ["MAGE"]
spec_flags = ["NO_CHARM"]
special_function = "spec_cast_cleric"
[[mobiles.901.programs]]
trigger = "talk_prog"
argument = "restart"
script = """
if is_qmark($n) <= olympus_weapon_quest 100007
   mpdel_qmark $n olympus_weapon_quest
   say 任務重新開始.
endif
"""
[[mobiles.901.programs]]
trigger = "talk_prog"
argument = "p what worries you?"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) != olympus_weapon_quest
                mpadd_qmark $i olympus_talking 1 0 0 0 0 1
                mpadd_qmark $n olympus_weapon_quest -1 1 0 0 0 1
                say 該死的，走開走開，低賤的凡人沒有資格跟我講話！
                mpcallout 2 mpechoat $n 你想著，應該有什麼事發生了，說不定你可以問問這城裡最睿智的人呢！(ask about zeus)
                mpcallout 2 mpdel_qmark $i olympus_talking
        endif
endif
"""
[[mobiles.901.programs]]
trigger = "give_prog"
argument = "932"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_weapon_quest 100008
                mpadd_qmark $i olympus_talking 3 0 0 0 0 1
                mpjunk all.corpse
                mpmod_qmark $n olympus_weapon_quest v0 + 1
                mpechoat $n 你細心的跟宙斯講著原由。
                mpcallout 2 say 原來是這樣呀～
                mpcallout 10 mpecho 宙斯沉思了一會兒。
                mpcallout 12 say 從今以後，天界將會多加小心的，感謝您的幫助，您的名聲將再度提高！
                mpcallout 12 mpresp $n 1
                mpcallout 13 say 另外，希拉的事情，過段時日，我將復活她。
                mpcallout 14 say 這件禮物就給你吧！
                mpcallout 14 mpoload 934 $n 1 target
		mpcallout 14 mplog give quest eq vnum 934 to $n.
                mpcallout 15 rumor 天界危機解除，$n的名聲更加壯大了！
                mpcallout 15 mpdel_qmark $i olympus_talking
        else
                drop corpse
        endif
endif
"""
[[mobiles.901.programs]]
trigger = "give_prog"
argument = "930"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_jail_quest 100006
                mpadd_qmark $i olympus_talking 2 0 0 0 0 1
                say 喔喔喔喔～～！我夢寐以求的寶劍！
                mpjunk all
                mpcallout 1 say 好吧！你說的我都答應啦！
                mpat prometheus-olympus mppurge prometheus-olympus
                mpcallout 2 rumor 天界發出特赦令。
                mpcallout 3 mpechoat $n 普羅米休斯用心電感應對你說：真是太感謝你了！請找阿波羅領賞吧！(Award)
                mpcallout 3 mpdel_qmark $i olympus_talking
                mpcallout 3 mpmod_qmark $n olympus_jail_quest v0 + 1
        endif
endif
"""
[[mobiles.901.programs]]
trigger = "talk_prog"
argument = "p release prometheus please"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_jail_quest 100017
                mpadd_qmark $i olympus_talking 3 0 0 0 0 1
                say 嗯 ..
                mpechoat $n 宙斯思考了一下。
                mpcallout 6 say 好吧！看在你的份上，我就放過他！
                mpcallout 6 rumor 天界發出特赦令。
                mpcallout 6 mpat prometheus-olympus mppurge prometheus-olympus
                mpcallout 7 mpechoat $n 普羅米休斯用心電感應對你說：真是太感謝你了！請找阿波羅領賞吧！(Reward)
                mpcallout 7 mpdel_qmark $i olympus_talking
                mpcallout 7 mpmod_qmark $n olympus_jail_quest v0 + 1
        endif
endif
"""

[mobiles.902]
keywords = "prometheus-olympus"
short_description = "普羅米休斯(Prometheus)"
long_description = "普羅米休斯(Prometheus)正在這裡玩弄著火柴.\n"
description = """
這位凡人冒著違背宙斯神旨的危險, 盜取火種給人類. 他正看著你並對你微笑.
或許你可以幫助他？(Help!)
"""
act_flags = ["NPC", "SENTINEL", "SCAVENGER"]
affected_flags = ["INVISIBLE", "DETECT_INVIS", "DETECT_HIDDEN", "SANCTUARY", "PROTECT", "FLYING"]
alignment = 1000
level = 47
mod_hitplus = 0
mod_mana = 0
mod_hitroll = 0
mod_damroll = 0
mod_ac = 0
mod_svs = 0
dodge = 0
mod_pp = 0
gold = 2500
sex = "male"
race = "God"
spec_flags = ["NO_CHARM"]
special_function = "spec_breath_fire"
[[mobiles.902.programs]]
trigger = "talk_prog"
argument = "p ask about jail"
script = """
if is_qmark($i) != olympus_talking
        if is_qmark($n) == olympus_jail_quest 100001
                mpadd_qmark $i olympus_talking 20 0 0 0 0 1
                say 這可說來話長了呀～
                mpcallout 2 mpechoat $n 他從他如何成為神祇講起。
                mpcallout 12 mpechoat $n 講起那紅極一時的「火」事件。
                mpcallout 32 mpechoat $n 抑或是與宙斯的爭論。
                mpcallout 52 mpechoat $n 話鋒一轉，又講回與阿波羅成為好朋友的經過。
                mpcallout 62 mpechoat $n 他的語氣太平淡了，好像比水還淡一般，一下就消散了。
                mpcallout 62 glare
                mpcallout 63 say 事情已過多年，現在，也沒有什麼好怨恨的了。
                mpcallout 65 say 現在我只希望能早點出去這裡，再呼吸呼吸新鮮的空氣罷了。
                mpcallout 67 sigh
                mpcallout 68 mpechoat $n 看著他這樣可憐兮兮的樣子，你想出手幫他嗎？(I can help you)
                mpcallout 68 mpdel_qmark $i olympus_talking
                mpcallout 68 mpmod_qmark $n olympus_jail_quest v0 + 1
        endif
endif
"""
[[mobiles.902.programs]]
trigger = "talk_prog"
argument = "p i can help you"
script = """
if is_qmark($n) == olympus_jail_quest 100002
        mpmod_qmark $n olympus_jail_quest v0 + 1
        say 真的嗎？
        mpcallout 1 say 那就麻煩您幫我去找阿波羅說我現在的情況(Prometheus' situation)
endif
"""
[[mobiles.902.programs]]
trigger = "talk_prog"
argument = "p help!"
script = """
if is_qmark($n) != olympus_jail_quest
        if is_qmark($n) == olympus_weapon_quest 200009
        or is_qmark($n) == olympus_weapon_quest 100009
                mpadd_qmark $n olympus_jail_quest -1 1 0 0 0 1
                say 原來是最近名聲響遍天際的$N呀。
                say 你找我又有什麼事呢？
                mpechoat $n 你可以嘗試問問他為何會被關。(Ask about jail)
        endif
endif
"""

