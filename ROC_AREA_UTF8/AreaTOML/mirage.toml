trigger = "obj_command"
argument = "xcast tranquility"
script = """
if is_qmark($n) != mirage_quest
        echoat $n 什麼？
        break
endif
if is_qmark($n) !& mirage_quest 100004
        echoat $n 什麼？
        break
endif
if is_equ_obj($n) != 59472
        echoat $n 你沒有施法的媒介。
        break
endif
if is_inv_obj($n) != 59051
        echoat $n 什麼？
        break
endif
if is_qmark($n) == xmagic_delay
        echoat $n 你的身體還未恢復過來。
        break
endif
if isaffected($n) & 268435456
        echoat $n 你麻痺了。
        break
endif
if isaffected($n) & 16777216
        echoat $n 一道力場阻隔了你的魔法。
        break
endif
if isaffected($n) & 8388608
        echoat $n 你的嘴巴在動，但是沒有發出聲音。
        break
endif
if mpnum($n) <= 450
        echoat $n 你的法力不夠了。
        break
endif
modhmv $n 11.450 450 00000000
oforcer here add_qmark $n xmagic_delay 8 0 0 0 0 0
oforce $n say 我在此祈禱，那迦之神，
oforce $n say 降下您的慈悲，治癒眾人的傷痛。安寧之雨！
echo 從那迦卡中散發出四道白色的光芒呼嘯而過往天邊去，
echo \u001B[1;36m天空緩緩降下藍白色的雨。\u001B[m
oforcer here stun $n 2
modhmv pc 02.400 600 00000000
oforcer here callout 1 echo \u001B[1;36m天空緩緩降下藍白色的雨。\u001B[m
oforcer here callout 1 modhmv pc 02.400 600 00000000
oforcer here callout 2 echo \u001B[1;36m天空緩緩降下藍白色的雨。\u001B[m
oforcer here callout 2 modhmv pc 02.400 600 00000000
oforcer here callout 3 echo \u001B[1;36m天空緩緩降下藍白色的雨。\u001B[m
oforcer here callout 3 modhmv pc 02.400 600 00000000
"""

