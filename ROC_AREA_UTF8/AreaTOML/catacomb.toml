argument = "topic"
script = """
emote 上上下下打量著$n
say 你好。你也是來作研究(research)的嗎？
"""
[[mobiles.2003.programs]]
trigger = "talk_prog"
argument = "research"
script = """
if is_qmark($n) != cata_quest2_explorer
	mpadd_qmark $n cata_quest2_explorer -1 1 0 0 0 1
	mpcallout 1 say 我聽說這邊的地下陵墓中，住了一些奇怪的生物。
	mpcallout 2 say 所以才來這邊看看。
	emote 上上下下打量著 $n
	if level($n) < 20
	mpcallout 3 say 你的實力看起來不太好，自己小心喔。
	endif
	mpcallout 4 say 要是你發現了什麼古怪的生物(creature)，請跟我講一聲喔。
endif
"""
[[mobiles.2003.programs]]
trigger = "death_prog"
argument = "35"
script = """
mpoload 2017 floor
"""
[[mobiles.2003.programs]]
trigger = "talk_prog"
argument = "creature"
script = """
if is_qmark($n) == cata_quest2_explorer 100002
mpmod_qmark $n cata_quest2_explorer v0 = 3
say 原來這裡有龍啊......
say 真是感謝你的回報，還有其他的生物(creature)嗎？
break
endif
	if is_qmark($n) == cata_quest2_explorer 100004
	mpmod_qmark $n cata_quest2_explorer v0 = 5
	say 連暗黑怪獸都有啊...
	mpexp $n 2500
	say 太謝謝你了，我想我不需要更多的資訊了。
	endif
"""

