say 好小子，原來你也是同行啊……
if level($n) < 15
	if is_qmark($n) != cata_robber_grave
	        mpexp $n 2000
	        mpadd_qmark $n cata_robber_grave -1 1 0 0 0 1
	        mpalign $n -1000
	        break
	endif
endif
if is_qmark($n) == cata_robber_grave
        if is_qmark($n) < cata_robber_grave 100010
		mpexp $n 400
		mpmod_qmark $n cata_robber_grave v0 + 1
		break
	else
	        break
	endif
else
	mpexp $n 800
endif
if is_qmark($n) != cata_robber_grave
	mpadd_qmark $n cata_robber_grave -1 1 0 0 0 1
endif
mpalign $n -100
"""

